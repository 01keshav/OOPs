rite()` internally."], "tip": "API vs system call: you usually call a library function (printf), the library makes the system call (write).", "code": {"f": "main.c", "c": "#include <unistd.h>\n#include <stdio.h>\n#include <sys/wait.h>\n\nint main() {\n    write(1, \"Hello from write()\\n\", 19);   /* system call: fd 1 = screen */\n    pid_t pid = fork();                    /* system call: make a child */\n    if (pid == 0) {\n        write(1, \"child running\\n\", 14);\n        _exit(0);\n    }\n    wait(NULL);                            /* parent waits for child */\n    write(1, \"parent done\\n\", 12);\n    return 0;\n}\n", "out": "Hello from write()\nchild running\nparent done"}}], "analogy": "In a restaurant you do not enter the kitchen. You tell the waiter (system call) and the kitchen (kernel) cooks and returns the food.", "hinglish": "System call matlab program OS se kaam maangne ka safe tareeka. Seedha hardware ko haath nahi lagate, kernel ko request bhejte hain.", "mistakes": ["Thinking printf is a system call. It is a library function that uses the write system call.", "Forgetting that a trap changes mode; the user program never jumps to kernel code directly."], "remember": ["System call = programmatic way a process requests a kernel service", "Done through TRAP (software interrupt); CPU moves user mode to kernel mode", "Parameters passed by registers, stack or a table in memory", "Six categories: process control, file, device, information, communication, protection", "Libraries (API) hide system calls: printf() -> write()", "Mode bit: 0 = kernel, 1 = user"], "def": "An OS gives two kinds of services: some help the **user and programs**, others keep the **system itself** running well."}, "u1-t4": {"tldr": "How the OS code is organised: monolithic, layered or microkernel.", "sections": [{"h": "Monolithic structure", "p": ["Fast, because there is no extra message passing. But a bug in a driver can crash everything and the code is hard to maintain."], "viz": {"items": ["User programs", "System call interface", "ONE big kernel: scheduler + memory + file system + drivers", "Hardware"], "cap": "Monolithic kernel (early UNIX, MS-DOS, Linux)", "type": "layers", "caption": "Monolithic kernel (early UNIX, MS-DOS, Linux)"}}, {"h": "Layered structure", "p": ["The OS is split into **layers**. Layer 0 is hardware and the top layer is the user interface. A layer uses only the services of the layers below it.", "Easy to debug and verify layer by layer. Harder to design (what goes in which layer?) and slower, because a request passes through many layers."], "viz": {"items": ["Layer 5: User programs", "Layer 4: I/O management", "Layer 3: Operator console", "Layer 2: Memory management", "Layer 1: CPU scheduling", "Layer 0: Hardware"], "cap": "THE operating system (Dijkstra) style layering", "type": "layers", "caption": "THE operating system (Dijkstra) style layering"}}, {"h": "Microkernel structure", "p": ["Keep only the **minimum** inside the kernel: basic memory, CPU scheduling and message passing (IPC). Everything else (file system, drivers, network) runs as normal **user-space servers**.", "More secure and stable: if a driver crashes only that server dies. Slower because services talk by messages. Examples: Mach, QNX, Minix."], "viz": {"type": "graph", "nodes": ["Client", "File server", "Driver", "Microkernel"], "edges": [["Client", "Microkernel", "msg"], ["Microkernel", "File server", "msg"], ["File server", "Microkernel", "reply"], ["Microkernel", "Driver", "msg"]], "directed": true, "anim": true, "pos": [[0, 0.1], [1, 0.1], [1, 0.9], [0.5, 0.5]], "caption": "All services talk through the microkernel using messages"}}, {"h": "Hybrid (modular) kernels", "p": ["Most modern systems mix ideas. **Linux** is monolithic but loads **modules** on demand. **Windows NT** and **macOS** keep a microkernel-like design but run many services in kernel space for speed."]}, {"h": "Comparison", "tip": "Write \"microkernel = minimum in kernel, rest in user space\" in every exam answer. It scores.", "table": {"head": ["Point", "Monolithic", "Layered", "Microkernel"], "rows": [["Size of kernel", "Large", "Medium", "Very small"], ["Speed", "Fastest", "Slower (layers)", "Slower (messages)"], ["Reliability", "Low", "Good", "High"], ["Security", "Low", "Medium", "High"], ["Example", "Linux, early UNIX", "THE system", "Minix, QNX, Mach"]]}}], "analogy": "A house can be built as one big hall (monolithic), as floors stacked up (layered), or as a tiny core with separate small rooms added outside (microkernel).", "hinglish": "Monolithic me sab kernel me hota hai, tez par risky. Microkernel me sirf zaroori cheez kernel me, baaki bahar, safe par thoda slow.", "mistakes": ["Saying Linux is a pure microkernel. It is monolithic with modules.", "Thinking layers can call any other layer. Only the layer just below."], "remember": ["Monolithic: whole OS in one kernel, fast, less reliable", "Layered: layer n uses layer n-1 only, easy to debug, many layers slow it", "Microkernel: only IPC, scheduling, basic memory in kernel", "In microkernel the services run in user mode and use message passing", "Hybrid kernels (Windows NT, macOS) combine ideas", "Linux supports loadable kernel modules"], "def": "The entire OS runs as **one big program in kernel mode**. Every part (file system, memory, scheduler, drivers) can call any other directly."}, "u1-t5": {"tldr": "A virtual machine pretends to be a whole computer; UNIX and Windows are the two classic OS case studies.", "sections": [{"h": "Concept of a virtual machine", "p": ["Each VM runs its own guest OS. You can run Linux and Windows on the same laptop at the same time."], "viz": {"items": ["VM 1: Linux + apps   |   VM 2: Windows + apps   |   VM 3: Android + apps", "Hypervisor (VMware, VirtualBox, KVM, Hyper-V)", "Host OS (optional for type-2) and real hardware"], "cap": "Virtual machines on one physical computer", "type": "layers", "caption": "Virtual machines on one physical computer"}}, {"h": "Types and benefits", "pts": ["**Type 1 (bare metal):** hypervisor runs directly on hardware (Xen, ESXi). Used in data centres.", "**Type 2 (hosted):** hypervisor is an app on a host OS (VirtualBox, VMware Workstation).", "**Benefits:** isolation (a crash or virus stays inside one VM), cheap testing of other OSes, easy backup and copy, better hardware use.", "**Drawback:** slower than real hardware and needs more RAM."]}, {"h": "Case study: UNIX", "p": ["UNIX was built at Bell Labs in 1969-70 by **Ken Thompson and Dennis Ritchie** and rewritten in **C**. It is multi-user, multitasking and portable. Everything is treated as a file."], "pts": ["Hierarchical file system with one root `/`", "Pipes: `ls | grep txt` connects small programs", "Permissions for owner, group, others", "Descendants: Linux, macOS, BSD, Solaris"], "viz": {"items": ["Users", "Shell (sh, bash) and utilities (ls, grep, vi)", "System call interface", "KERNEL: process, memory, file system, device drivers", "Hardware"], "cap": "UNIX architecture", "type": "layers", "caption": "UNIX architecture"}}, {"h": "Case study: Windows", "p": ["Windows (Microsoft) started as a GUI on MS-DOS and became the **Windows NT** family (NT, 2000, XP, 7, 10, 11). It has a hybrid kernel, a rich GUI and wide hardware support."], "viz": {"items": ["User mode: applications, subsystems (Win32), services", "--- boundary ---", "Kernel mode: Executive (process, memory, I/O, security managers)", "Microkernel + device drivers", "HAL (Hardware Abstraction Layer)", "Hardware"], "cap": "Windows NT architecture", "type": "layers", "caption": "Windows NT architecture"}}, {"h": "UNIX vs Windows", "table": {"head": ["Point", "UNIX / Linux", "Windows"], "rows": [["Source", "Open (Linux) / varied", "Closed, commercial"], ["Interface", "Command line first, GUI optional", "GUI first"], ["File system", "Single tree from /", "Drives C:, D:"], ["Users", "Strong multi-user design", "Mainly single-user desktop, multi-user on server"], ["Kernel", "Monolithic with modules", "Hybrid"], ["Use", "Servers, supercomputers, Android", "Desktops, enterprise"]]}}], "analogy": "A virtual machine is like a hostel building with many separate rooms. Each room feels like a private home but all share one building.", "hinglish": "VM ek computer ke andar nakli computer hai. UNIX purana aur powerful, command wala. Windows GUI wala.", "mistakes": ["Calling the shell the kernel. The shell is a user program that talks to the kernel.", "Saying UNIX is the same as Linux. Linux is a UNIX-like kernel."], "remember": ["VM = software computer created by hypervisor; each VM has its own guest OS", "Type 1 hypervisor on hardware, type 2 on host OS", "VM gives isolation, testing, consolidation", "UNIX: 1969 Bell Labs, written in C, multi-user, everything is a file", "UNIX layers: hardware, kernel, shell, utilities", "Windows NT: user mode and kernel mode, HAL, executive, hybrid kernel", "Linux is UNIX-like and open source"], "def": "A **virtual machine (VM)** is software that behaves like a complete computer. A layer called the **hypervisor** (virtual machine monitor) shares the real hardware and gives each VM its own virtual CPU, memory and disk."}, "u2-t1": {"tldr": "A process is a program in execution, with its own memory, registers and state.", "sections": [{"h": "What is a process?", "p": ["One program can create many processes. Open the same browser twice and you have two processes of one program."], "table": {"head": ["Program", "Process"], "rows": [["Passive, stored on disk", "Active, lives in memory"], ["One copy of code", "Needs CPU, memory, I/O while running"], ["Exists forever (until deleted)", "Exists only until it ends"], ["Example: chrome.exe file", "Example: running Chrome window"]]}}, {"h": "Process in memory", "p": ["Every process gets its own memory space with four parts. Stack and heap grow towards each other."], "viz": {"segs": [["Stack (local vars, return addresses)", 30, "used"], ["free (stack and heap grow here)", 25, "free"], ["Heap (malloc / new)", 25, "used"], ["Data (global and static variables)", 20, "used"], ["Text (program code)", 30, "os"]], "cap": "Layout of a process: high address at the top", "type": "mem", "caption": "Layout of a process: high address at the top"}}, {"h": "Process relationship: parent and child", "p": ["A process can create new processes using the **fork()** system call. The creator is the **parent** and the new one is the **child**. This builds a **process tree**.", "Parent and child can run at the same time, or the parent can wait for the child to end. When a parent ends early, children become **orphans** (adopted by init). A child that ended but is not yet waited for is a **zombie**."], "viz": {"type": "tree", "root": "init (PID 1)", "kids": ["bash", "sshd", "cron"], "caption": "Process tree: every process has one parent"}}, {"h": "fork() in action", "tip": "fork() returns 0 in the child and the child PID in the parent. This is the trick to tell them apart.", "code": {"f": "main.c", "c": "#include <stdio.h>\n#include <unistd.h>\n#include <sys/wait.h>\n\nint main() {\n    pid_t pid = fork();            /* one process becomes two */\n    if (pid < 0) { perror(\"fork\"); return 1; }\n    if (pid == 0) {\n        printf(\"child:  pid is different, fork returned 0\\n\");\n    } else {\n        wait(NULL);                /* parent waits so output order is fixed */\n        printf(\"parent: fork returned the child pid (>0)\\n\");\n    }\n    return 0;\n}\n", "out": "child:  pid is different, fork returned 0\nparent: fork returned the child pid (>0)"}}, {"h": "Process creation and termination", "pts": ["**Creation reasons:** system start, user request, a running process calls fork(), batch job start.", "**Resource sharing options:** parent and child share all, some, or no resources.", "**Termination:** normal exit, error exit, fatal error, killed by another process.", "**Execution:** exec() replaces the child memory with a new program."]}], "analogy": "A recipe in a book is a program. When you actually cook with it, using a stove and ingredients, that cooking is the process.", "hinglish": "Program sirf file hai, jab chalne lage tab process banta hai. fork() se naya process (child) banta hai.", "mistakes": ["Calling a program and a process the same thing.", "Thinking fork() returns the same value in both processes."], "remember": ["Process = program in execution; program is passive, process is active", "Memory layout: text, data, heap, stack", "Process created by fork() (UNIX) or CreateProcess() (Windows)", "fork returns 0 to child, child PID to parent", "Orphan: parent died first. Zombie: child died, parent has not called wait()", "All processes form a tree rooted at init"], "def": "A **program** is a passive file on disk (instructions only). A **process** is a program **in execution**: it has a program counter, registers, memory and open files."}, "u2-t2": {"tldr": "A process moves between New, Ready, Running, Waiting and Terminated during its life.", "sections": [{"h": "The five-state model", "p": [], "viz": {"type": "graph", "nodes": ["New", "Ready", "Running", "Waiting", "Terminated"], "edges": [["New", "Ready", "admit"], ["Ready", "Running", "dispatch"], ["Running", "Ready", "timeout"], ["Running", "Waiting", "I/O wait"], ["Waiting", "Ready", "I/O done"], ["Running", "Terminated", "exit"]], "directed": true, "anim": true, "pos": [[0, 0.1], [0.33, 0.1], [0.7, 0.1], [0.7, 0.95], [1, 0.1]], "caption": "Process state diagram (watch the dots move)"}}, {"h": "What each state means", "table": {"head": ["State", "Meaning"], "rows": [["New", "Process is being created"], ["Ready", "In memory, has everything except the CPU, waits in the ready queue"], ["Running", "Instructions are being executed on the CPU"], ["Waiting (Blocked)", "Waiting for an event: I/O finish, signal, resource"], ["Terminated", "Finished; OS is cleaning up its resources"]]}}, {"h": "Transitions: who causes them?", "tip": "There is NO direct Waiting -> Running. After the wait ends the process goes to Ready and must win the CPU again.", "table": {"head": ["Transition", "Cause"], "rows": [["New -> Ready", "Admitted by the long-term scheduler"], ["Ready -> Running", "Dispatched by the short-term (CPU) scheduler"], ["Running -> Ready", "Time slice over, or a higher priority process arrived (preemption)"], ["Running -> Waiting", "Process asks for I/O or waits for an event"], ["Waiting -> Ready", "I/O completed or event happened (interrupt)"], ["Running -> Terminated", "Process finishes or is killed"]]}}, {"h": "Ready queue and device queues", "p": ["Ready processes stand in the **ready queue**. Each device has its own **device queue** for processes waiting on it. A process keeps moving between these queues until it ends."], "viz": {"type": "chain", "items": ["Ready queue", "CPU (Running)", "Disk queue (Waiting)", "Ready queue"], "labels": ["dispatch", "I/O request", "I/O done"], "caption": "Life of a process between queues"}}, {"h": "Suspended states", "p": ["When memory is full, the OS can **swap out** a process to disk. Then there are two more states: **Suspended Ready** and **Suspended Waiting**. When memory is free the process is swapped back in."]}], "analogy": "A customer in a bank: enters (new), sits in the waiting hall (ready), is at the counter (running), steps away to fetch a document (waiting), and leaves (terminated).", "hinglish": "Process 5 states me ghoomta hai. CPU milte hi Running, I/O ke liye Waiting, I/O ke baad wapas Ready, kaam khatam to Terminated.", "mistakes": ["Drawing Waiting -> Running directly.", "Confusing Ready (has all but CPU) with Waiting (needs an event)."], "remember": ["Five states: New, Ready, Running, Waiting, Terminated", "Ready -> Running by dispatcher; Running -> Ready by timeout or preemption", "Running -> Waiting on I/O; Waiting -> Ready on I/O completion", "Only one process runs per CPU at a time", "No Waiting -> Running transition", "Suspended states exist because of swapping"], "def": "At any moment a process is in exactly one state. Only **one process per CPU** can be Running, but many can be Ready or Waiting."}, "u2-t3": {"tldr": "The PCB is the OS notebook for one process; context switching saves it and loads another.", "sections": [{"h": "What is a PCB?", "p": [], "viz": {"segs": [["Process ID (PID)", "", "used"], ["Process state", "", "used"], ["Program counter", "", "used"], ["CPU registers", "", "used"], ["Memory-management info (page table, limits)", "", "used"], ["Scheduling info (priority, queue pointers)", "", "used"], ["Accounting info (CPU time used)", "", "used"], ["I/O status (open files, devices)", "", "used"]], "cap": "Fields inside a PCB", "type": "mem", "caption": "Fields inside a PCB"}}, {"h": "Why the PCB matters", "pts": ["It is the **only record** of a process. Without it the OS cannot resume the process.", "All state needed to **stop and restart** a process is stored here.", "The ready queue is simply a linked list of PCBs."]}, {"h": "Context switching", "p": ["A **context switch** is when the CPU moves from one process to another. The OS **saves** the state of the old process into its PCB and **loads** the state of the new process from its PCB."], "viz": {"type": "chain", "items": ["P1 running", "Interrupt or timeout", "Save P1 state to PCB1", "Load P2 state from PCB2", "P2 running"], "labels": null, "caption": "Steps of a context switch"}}, {"h": "Context switch timeline", "warn": "Context switch time is pure **overhead**. Too many switches waste CPU time. Hardware support (more register sets) makes it faster.", "viz": {"segs": [["P1", 0, 4], ["switch", 4, 5], ["P2", 5, 9], ["switch", 9, 10], ["P1", 10, 13]], "lanes": false, "cap": "The CPU does no useful work during \"switch\"", "type": "gantt", "caption": "The CPU does no useful work during \"switch\""}}, {"h": "What triggers a context switch?", "pts": ["Time slice (quantum) expired", "A higher priority process becomes ready", "Running process waits for I/O", "An interrupt arrives", "Process exits"], "tip": "Process switch is heavier than thread switch because memory maps (page tables) also change."}], "analogy": "A teacher marks a bookmark (and notes the page) before leaving a book, so the next reader or she can continue exactly from that line.", "hinglish": "PCB process ka biodata hai. Context switch me purane process ka PCB save karte hain aur naye ka load karte hain. Ye time waste hota hai.", "mistakes": ["Saying context switching is useful work. It is pure overhead.", "Forgetting to mention program counter and registers in the PCB."], "remember": ["PCB holds PID, state, PC, registers, memory info, scheduling info, I/O info, accounting", "Context = what is needed to resume a process (PC, registers, PCB)", "Context switch = save old PCB, load new PCB", "Context switch is overhead; no useful work happens", "Triggered by interrupt, timeout, I/O wait, higher priority arrival", "Ready queue is a list of PCBs"], "def": "The OS keeps a data structure for every process called the **Process Control Block (PCB)** or task control block. It is created with the process and removed when it ends."}, "u2-t4": {"tldr": "A thread is a light-weight unit of execution inside a process; threads share memory.", "sections": [{"h": "What is a thread?", "p": [], "table": {"head": ["Shared by all threads", "Private to each thread"], "rows": [["Code (text)", "Program counter"], ["Global data", "Registers"], ["Heap", "Stack"], ["Open files", "Thread ID and state"]]}}, {"h": "Single-threaded vs multithreaded", "viz": {"segs": [["Code + Data + Files (shared)", 40, "os"], ["Thread 1: regs + stack", 20, "used"], ["Thread 2: regs + stack", 20, "used"], ["Thread 3: regs + stack", 20, "used"]], "cap": "One process, three threads", "type": "mem", "caption": "One process, three threads"}}, {"h": "Thread states", "p": ["A thread has the same states as a process: **New, Ready (Runnable), Running, Waiting (Blocked), Terminated**. Operations: create, run, block, unblock, terminate."], "viz": {"type": "graph", "nodes": ["New", "Runnable", "Running", "Blocked", "Done"], "edges": [["New", "Runnable", "start"], ["Runnable", "Running", "schedule"], ["Running", "Runnable", "yield"], ["Running", "Blocked", "wait"], ["Blocked", "Runnable", "wake"], ["Running", "Done", "exit"]], "directed": true, "anim": true, "pos": [[0, 0.1], [0.33, 0.1], [0.7, 0.1], [0.7, 0.95], [1, 0.1]], "caption": "Thread states"}}, {"h": "Benefits of threads", "pts": ["**Responsiveness:** UI stays alive while another thread does a long job.", "**Resource sharing:** threads share memory so no heavy message passing is needed.", "**Economy:** creating and switching threads is much cheaper than for processes.", "**Scalability:** threads can run on different CPU cores at the same time."]}, {"h": "Process vs thread", "table": {"head": ["Point", "Process", "Thread"], "rows": [["Weight", "Heavy", "Light"], ["Memory", "Own address space", "Shares address space"], ["Creation / switch cost", "High", "Low"], ["Communication", "IPC needed", "Directly via shared memory"], ["If one crashes", "Others are safe", "Whole process may die"]]}}, {"h": "User-level vs kernel-level threads", "table": {"head": ["Point", "User-level threads", "Kernel-level threads"], "rows": [["Managed by", "Thread library in user space", "The OS kernel"], ["Switch speed", "Very fast, no kernel call", "Slower, needs kernel"], ["One blocks on I/O", "All threads of the process block", "Others keep running"], ["Multi-core use", "Cannot use many cores", "Can use many cores"], ["Example", "Green threads", "Windows threads, Linux pthreads"]]}}, {"h": "Multithreading models", "table": {"head": ["Model", "Mapping", "Idea"], "rows": [["Many-to-One", "many user threads -> 1 kernel thread", "Cheap, but one block stops all, no parallelism"], ["One-to-One", "1 user thread -> 1 kernel thread", "True parallelism, costly (Linux, Windows)"], ["Many-to-Many", "many user -> many kernel threads", "Flexible, hard to build"]]}}, {"h": "Creating threads in C (pthread)", "tip": "Compile with: gcc main.c -lpthread", "code": {"f": "main.c", "c": "#include <stdio.h>\n#include <pthread.h>\n\nvoid *work(void *arg) {\n    int id = *(int *)arg;\n    printf(\"thread %d running\\n\", id);\n    return NULL;\n}\n\nint main() {\n    pthread_t t1, t2;\n    int a = 1, b = 2;\n    pthread_create(&t1, NULL, work, &a);\n    pthread_join(t1, NULL);          /* join each so output order is fixed */\n    pthread_create(&t2, NULL, work, &b);\n    pthread_join(t2, NULL);\n    printf(\"main: both threads finished\\n\");\n    return 0;\n}\n", "out": "thread 1 running\nthread 2 running\nmain: both threads finished"}}], "analogy": "A restaurant (process) has one kitchen and many cooks (threads). The cooks share the same stove and ingredients but work on different dishes.", "hinglish": "Thread process ke andar chhota worker hai. Memory share karte hain isliye fast, par ek galti pure process ko giraa sakti hai.", "mistakes": ["Saying threads have separate memory. They share the heap and globals.", "Believing user-level threads use many cores."], "remember": ["Thread = light-weight process, unit of CPU scheduling", "Threads share code, data, heap, files; own stack, registers, PC", "Benefits: responsiveness, resource sharing, economy, scalability", "User-level threads are fast but one block blocks all", "Kernel-level threads allow real parallelism", "Models: many-to-one, one-to-one, many-to-many", "pthread_create creates, pthread_join waits"], "def": "A **thread** is the smallest unit of CPU scheduling. A process can have many threads. All threads of a process **share** code, data and open files, but each thread has its **own** program counter, registers and stack."}, "u2-t5": {"tldr": "Scheduling decides which ready process gets the CPU next, so the CPU is never wasted.", "sections": [{"h": "Why scheduling?", "p": [], "viz": {"type": "chain", "items": ["Ready queue (P3, P1, P4)", "Scheduler picks one", "Dispatcher gives CPU", "Running on CPU"], "labels": null, "caption": "Scheduler chooses, dispatcher hands over the CPU"}}, {"h": "Scheduling objectives", "pts": ["Keep the CPU as **busy** as possible", "Maximise **throughput**", "Minimise **turnaround, waiting and response** time", "Be **fair** to all processes", "Avoid **starvation**"]}, {"h": "Types of schedulers", "tip": "Short-term must be very fast, since it runs every few milliseconds.", "table": {"head": ["Scheduler", "Also called", "Runs", "Job"], "rows": [["Long-term", "Job scheduler", "Rarely (seconds-minutes)", "Chooses jobs from disk to bring into memory; controls degree of multiprogramming"], ["Medium-term", "Swapper", "Sometimes", "Swaps processes out and in to free memory"], ["Short-term", "CPU scheduler", "Very often (milliseconds)", "Chooses next ready process for the CPU"]]}}, {"h": "Dispatcher", "p": ["The **dispatcher** gives control of the CPU to the process chosen by the short-term scheduler. It does the context switch, switches to user mode and jumps to the right instruction. The time it takes is **dispatch latency**."]}, {"h": "Scheduling criteria", "table": {"head": ["Criterion", "Meaning", "Want"], "rows": [["CPU utilization", "% of time CPU is busy", "Maximum"], ["Throughput", "Processes completed per unit time", "Maximum"], ["Turnaround time (TAT)", "Completion time - Arrival time", "Minimum"], ["Waiting time (WT)", "Time spent in ready queue = TAT - Burst", "Minimum"], ["Response time", "First response - Arrival", "Minimum"]]}}, {"h": "Preemptive vs non-preemptive", "table": {"head": ["Point", "Non-preemptive", "Preemptive"], "rows": [["CPU taken away?", "No, until the process ends or waits", "Yes, OS can take it any time"], ["Overhead", "Low", "Higher (more context switches)"], ["Response", "Poor for short jobs", "Better"], ["Examples", "FCFS, non-preemptive SJF", "Round Robin, SRTF, preemptive priority"]]}}, {"h": "Important formulas", "pts": ["**Turnaround time = Completion time - Arrival time**", "**Waiting time = Turnaround time - Burst time**", "**Response time = First CPU time - Arrival time**", "Average = sum / number of processes"]}], "analogy": "A single cashier with a queue of customers. The scheduler is the rule that decides who is served next.", "hinglish": "Scheduler decide karta hai agla kaun, dispatcher CPU de deta hai. TAT = CT - AT, WT = TAT - BT yaad rakho.", "mistakes": ["Mixing scheduler (decides) with dispatcher (acts).", "Using TAT formula as CT - BT."], "remember": ["Short-term = CPU scheduler, long-term = job scheduler, medium-term = swapper", "Dispatcher performs context switch; delay = dispatch latency", "Criteria: utilization, throughput, TAT, WT, response time", "TAT = CT - AT; WT = TAT - BT", "Non-preemptive: CPU released only on end or wait; preemptive: OS may take it", "Starvation = a process never gets the CPU"], "def": "In multiprogramming many processes are ready but only one CPU exists. The **CPU scheduler** picks one from the ready queue. A good choice keeps the CPU busy and users happy."}, "u2-t6": {"tldr": "FCFS serves in arrival order; SJF serves the shortest job first and gives the least average waiting time.", "sections": [{"h": "Example processes", "p": [], "table": {"head": ["Process", "Arrival time", "Burst time"], "rows": [["P1", "0", "5"], ["P2", "1", "3"], ["P3", "2", "8"], ["P4", "3", "6"]]}}, {"h": "FCFS: First Come First Served", "p": ["The process that arrives first gets the CPU first. It is **non-preemptive** and uses a simple FIFO queue.", "Gantt chart (watch the bars grow):"], "viz": {"segs": [["P1", 0, 5], ["P2", 5, 8], ["P3", 8, 16], ["P4", 16, 22]], "lanes": false, "cap": "FCFS Gantt chart", "type": "gantt", "caption": "FCFS Gantt chart"}}, {"h": "FCFS calculation", "warn": "**Convoy effect:** one long process at the front makes all short processes wait behind it. That is why FCFS average waiting time can be high.", "table": {"head": ["Process", "Arrival", "Burst", "Completion", "Turnaround", "Waiting"], "rows": [["P1", "0", "5", "5", "5", "0"], ["P2", "1", "3", "8", "7", "4"], ["P3", "2", "8", "16", "14", "6"], ["P4", "3", "6", "22", "19", "13"], ["Average", "", "", "", "11.25", "5.75"]]}}, {"h": "SJF: Shortest Job First (non-preemptive)", "p": ["From the processes that have arrived, pick the one with the **smallest burst time**. It gives the **minimum average waiting time** of any algorithm, but needs to know burst time in advance and can **starve** long jobs."], "viz": {"segs": [["P1", 0, 5], ["P2", 5, 8], ["P4", 8, 14], ["P3", 14, 22]], "lanes": false, "cap": "SJF (non-preemptive) Gantt chart", "type": "gantt", "caption": "SJF (non-preemptive) Gantt chart"}}, {"h": "SJF calculation", "table": {"head": ["Process", "Arrival", "Burst", "Completion", "Turnaround", "Waiting"], "rows": [["P1", "0", "5", "5", "5", "0"], ["P2", "1", "3", "8", "7", "4"], ["P3", "2", "8", "22", "20", "12"], ["P4", "3", "6", "14", "11", "5"], ["Average", "", "", "", "10.75", "5.25"]]}}, {"h": "SRTF: Shortest Remaining Time First (preemptive SJF)", "p": ["When a new process arrives with a burst shorter than the **remaining** time of the running one, the CPU is taken away. Better average waiting time, more context switches."], "viz": {"segs": [["P1", 0, 1], ["P2", 1, 4], ["P1", 4, 8], ["P4", 8, 14], ["P3", 14, 22]], "lanes": false, "cap": "SRTF Gantt chart", "type": "gantt", "caption": "SRTF Gantt chart"}}, {"h": "SRTF calculation", "table": {"head": ["Process", "Arrival", "Burst", "Completion", "Turnaround", "Waiting"], "rows": [["P1", "0", "5", "8", "8", "3"], ["P2", "1", "3", "4", "3", "0"], ["P3", "2", "8", "22", "20", "12"], ["P4", "3", "6", "14", "11", "5"], ["Average", "", "", "", "10.50", "5.00"]]}}, {"h": "FCFS in C", "code": {"f": "main.c", "c": "#include <stdio.h>\n\nint main() {\n    int n = 4, at[] = {0,1,2,3}, bt[] = {5,3,8,6};\n    int t = 0; float tw = 0, tt = 0;\n    printf(\"P  AT BT CT TAT WT\\n\");\n    for (int i = 0; i < n; i++) {\n        if (t < at[i]) t = at[i];       /* CPU idle until arrival */\n        t += bt[i];                      /* completion time */\n        int tat = t - at[i], wt = tat - bt[i];\n        tw += wt; tt += tat;\n        printf(\"P%d %2d %2d %2d %3d %2d\\n\", i+1, at[i], bt[i], t, tat, wt);\n    }\n    printf(\"avg TAT = %.2f, avg WT = %.2f\\n\", tt / n, tw / n);\n    return 0;\n}\n", "out": "P  AT BT CT TAT WT\nP1  0  5  5   5  0\nP2  1  3  8   7  4\nP3  2  8 16  14  6\nP4  3  6 22  19 13\navg TAT = 11.25, avg WT = 5.75"}}], "analogy": "FCFS is a normal queue at a shop. SJF is the express counter: customers with very few items go first.", "hinglish": "FCFS me jo pehle aaya wo pehle. SJF me sabse chhota kaam pehle, average waiting sabse kam. Gantt chart pehle banao.", "mistakes": ["Forgetting arrival time in SJF: only choose among processes that have already arrived.", "Computing WT as CT - BT."], "remember": ["FCFS: non-preemptive, FIFO, simple, suffers from convoy effect", "SJF: picks smallest burst; optimal average waiting time; needs burst estimate; starvation possible", "SRTF: preemptive SJF, picks smallest remaining time", "Draw the Gantt chart first, then CT, TAT = CT - AT, WT = TAT - BT", "Compare average WT of the algorithms to find the best one"], "def": "We use the same four processes for all algorithms so you can compare results."}, "u2-t7": {"tldr": "Round Robin gives everyone a fixed time slice; priority scheduling serves the most important process first.", "sections": [{"h": "Round Robin (RR)", "p": [], "viz": {"segs": [["P1", 0, 2], ["P2", 2, 4], ["P3", 4, 6], ["P1", 6, 8], ["P4", 8, 10], ["P2", 10, 11], ["P3", 11, 13], ["P1", 13, 14], ["P4", 14, 16], ["P3", 16, 18], ["P4", 18, 20], ["P3", 20, 22]], "lanes": false, "cap": "Round Robin, quantum = 2", "type": "gantt", "caption": "Round Robin, quantum = 2"}}, {"h": "RR calculation", "table": {"head": ["Process", "Arrival", "Burst", "Completion", "Turnaround", "Waiting"], "rows": [["P1", "0", "5", "14", "14", "9"], ["P2", "1", "3", "11", "10", "7"], ["P3", "2", "8", "22", "20", "12"], ["P4", "3", "6", "20", "17", "11"], ["Average", "", "", "", "15.25", "9.75"]]}}, {"h": "Effect of the time quantum", "tip": "A good quantum is bigger than the context switch time but small enough for good response.", "table": {"head": ["Quantum", "Result"], "rows": [["Very large", "Behaves like FCFS"], ["Very small", "Too many context switches, much overhead"], ["Right size", "About 80% of bursts should finish within one quantum"]]}}, {"h": "Priority scheduling", "p": ["Each process has a **priority number**. The CPU goes to the highest priority (here a smaller number = higher priority: P2=1, P4=2, P1=3, P3=4). It can be **non-preemptive** or **preemptive**."], "viz": {"segs": [["P1", 0, 5], ["P2", 5, 8], ["P4", 8, 14], ["P3", 14, 22]], "lanes": false, "cap": "Priority (non-preemptive)", "type": "gantt", "caption": "Priority (non-preemptive)"}}, {"h": "Priority calculation", "table": {"head": ["Process", "Arrival", "Burst", "Completion", "Turnaround", "Waiting"], "rows": [["P1", "0", "5", "5", "5", "0"], ["P2", "1", "3", "8", "7", "4"], ["P3", "2", "8", "22", "20", "12"], ["P4", "3", "6", "14", "11", "5"], ["Average", "", "", "", "10.75", "5.25"]]}}, {"h": "Preemptive priority", "viz": {"segs": [["P1", 0, 1], ["P2", 1, 4], ["P4", 4, 10], ["P1", 10, 14], ["P3", 14, 22]], "lanes": false, "cap": "Priority (preemptive): a new higher-priority arrival takes the CPU", "type": "gantt", "caption": "Priority (preemptive): a new higher-priority arrival takes the CPU"}}, {"h": "Starvation and aging", "p": ["Low priority processes may wait forever (**starvation** or indefinite blocking). The fix is **aging**: slowly raise the priority of a process the longer it waits."]}, {"h": "Other algorithms in brief", "pts": ["**Multilevel queue:** separate queues (system, interactive, batch), each with its own algorithm.", "**Multilevel feedback queue:** processes can move between queues based on behaviour; the most flexible scheduler."]}, {"h": "Round Robin in C", "tip": "This simple version assumes all processes arrive at time 0.", "code": {"f": "main.c", "c": "#include <stdio.h>\n\nint main() {\n    int n = 4, bt[] = {5,3,8,6}, rem[4], q = 2, t = 0, done = 0;\n    for (int i = 0; i < n; i++) rem[i] = bt[i];\n    printf(\"order: \");\n    while (done < n) {\n        for (int i = 0; i < n; i++) {\n            if (rem[i] == 0) continue;\n            int run = rem[i] < q ? rem[i] : q;\n            printf(\"P%d(%d-%d) \", i + 1, t, t + run);\n            t += run; rem[i] -= run;\n            if (rem[i] == 0) done++;\n        }\n    }\n    printf(\"\\ntotal time = %d\\n\", t);\n    return 0;\n}\n", "out": "order: P1(0-2) P2(2-4) P3(4-6) P4(6-8) P1(8-10) P2(10-11) P3(11-13) P4(13-15) P1(15-16) P3(16-18) P4(18-20) P3(20-22) \ntotal time = 22"}}], "analogy": "Round Robin is a teacher giving every student 2 minutes to speak in turn. Priority is a VIP line at the airport.", "hinglish": "RR me har process ko fix time slice, na khatam ho to line ke peeche. Priority me bade importance wala pehle, aur aging se starvation hata te hain.", "mistakes": ["Adding a newly arrived process before the preempted one in the RR queue. New arrival enters first, then the preempted process.", "Forgetting aging as the answer to starvation."], "remember": ["RR: preemptive, fixed time quantum, back of the queue if not finished", "Large quantum = FCFS, tiny quantum = overhead", "Priority: highest priority first; preemptive or non-preemptive", "Starvation of low priority; solution is aging", "Multilevel queue: fixed queues; multilevel feedback: processes move between queues", "RR gives good response time"], "def": "Each process gets the CPU for a small fixed **time quantum**. If it is not finished it goes to the **back of the ready queue**. RR is **preemptive** and designed for time-sharing systems. Here quantum = 2."}, "u2-t8": {"tldr": "Real-time tasks repeat and must meet deadlines. RM and EDF are the two classic algorithms.", "sections": [{"h": "Multiprocessor scheduling", "p": [], "table": {"head": ["Approach", "Idea"], "rows": [["Asymmetric (AMP)", "One master CPU runs the OS and scheduling, others run user code"], ["Symmetric (SMP)", "Every CPU schedules itself; all share one ready queue or have private queues"], ["Load balancing", "Move work from busy to idle CPUs (push and pull migration)"], ["Processor affinity", "Keep a process on the same CPU so its cache stays warm"]]}}, {"h": "Real-time scheduling basics", "p": ["A real-time task has a **period** T (it repeats every T time units), an execution time **C** and a **deadline** (usually the end of the period). CPU utilization of a task = C / T. Total **U = sum of C/T**."]}, {"h": "RM: Rate Monotonic scheduling", "p": ["**Static priority:** the task with the **shortest period** (highest rate) gets the highest priority. Preemptive. Priorities never change.", "Schedulable test (sufficient): U <= n(2^(1/n) - 1). For 2 tasks the bound is 0.828.", "Example: T1 (C=1, T=4), T2 (C=2, T=6). U = 0.25 + 0.33 = 0.58, which is below 0.828, so it is schedulable."], "viz": {"segs": [["T1", 0, 1], ["T2", 1, 3], ["T1", 4, 5], ["T2", 6, 8], ["T1", 8, 9]], "lanes": true, "cap": "RM schedule over 12 time units (no deadline miss)", "type": "gantt", "caption": "RM schedule over 12 time units (no deadline miss)"}}, {"h": "EDF: Earliest Deadline First", "p": ["**Dynamic priority:** the task whose **absolute deadline is nearest** runs first. Preemptive. EDF is **optimal** on one CPU: it can schedule any task set with **U <= 1**.", "Example: T1 (C=2, T=5), T2 (C=4, T=7). U = 0.4 + 0.571 = 0.971 (RM bound exceeded, EDF limit not)."], "viz": {"segs": [["T1", 0, 2], ["T2", 2, 6], ["T1", 6, 8], ["T2", 8, 12], ["T1", 12, 14], ["T2", 14, 15], ["T1", 15, 17], ["T2", 17, 20], ["T1", 20, 22], ["T2", 22, 26], ["T1", 26, 28], ["T2", 28, 32], ["T1", 32, 34]], "lanes": true, "cap": "EDF: all deadlines met", "type": "gantt", "caption": "EDF: all deadlines met"}}, {"h": "Same tasks under RM", "p": ["Now run the same task set under RM."], "warn": "RM can miss deadlines at high utilization where EDF still succeeds. EDF cost: needs dynamic priority tracking.", "viz": {"segs": [["T1", 0, 2], ["T2", 2, 5], ["T1", 5, 7], ["T2", 7, 10], ["T1", 10, 12], ["T2", 12, 13], ["T2", 14, 15], ["T1", 15, 17], ["T2", 17, 20], ["T1", 20, 22], ["T2", 22, 25], ["T1", 25, 27], ["T2", 27, 30], ["T1", 30, 32], ["T2", 32, 34]], "lanes": true, "cap": "RM: deadline missed by T2@7", "type": "gantt", "caption": "RM: deadline missed by T2@7"}}, {"h": "RM vs EDF", "table": {"head": ["Point", "RM", "EDF"], "rows": [["Priority", "Static (by period)", "Dynamic (by deadline)"], ["Utilization limit", "About 69% to 100% (n(2^(1/n)-1))", "100%"], ["Complexity", "Simple", "More overhead"], ["Optimal?", "Optimal among static", "Optimal among dynamic on one CPU"], ["Used in", "Most small RTOS", "Where full CPU use is needed"]]}}], "analogy": "A school bell must ring exactly on time, every time. It does not matter how fast the rest is: late is wrong.", "hinglish": "RM me chhoti period wale ko hamesha priority. EDF me jiska deadline paas, wo pehle. EDF 100 percent CPU tak chal jaata hai.", "mistakes": ["Saying EDF has static priorities. They change every period.", "Applying the RM utilization bound as exact. It is only sufficient."], "remember": ["RTOS tasks are periodic with C, T and deadline", "Utilization U = sum of Ci/Ti", "RM: static priority, shortest period first, bound n(2^(1/n)-1) ~ 0.693", "EDF: dynamic priority, earliest deadline first, schedules if U <= 1", "SMP: all CPUs run the OS; AMP: master and slaves", "Load balancing and processor affinity are multiprocessor ideas"], "def": "With **many CPUs** the OS must also decide which CPU runs which process."}, "u3-t1": {"tldr": "When two processes touch the same data at the same time, the result can go wrong. Mutual exclusion prevents that.", "sections": [{"h": "Inter-process communication: why we need it", "p": [], "viz": {"type": "chain", "items": ["Process A", "Shared data", "Process B"], "labels": ["write", "read"], "caption": "Two processes share one variable"}}, {"h": "Race condition", "p": ["A **race condition** happens when the output depends on the **exact order** in which processes run. Example: both threads do `count++`. Internally that is three steps: load, add, store."], "table": {"head": ["Time", "Thread 1", "Thread 2", "count in memory"], "rows": [["1", "load count (5)", "", "5"], ["2", "", "load count (5)", "5"], ["3", "add 1 (6)", "", "5"], ["4", "store 6", "", "6"], ["5", "", "add 1 and store 6", "6"]]}}, {"h": "Critical section", "p": ["The part of a program that touches shared data is the **critical section (CS)**. The rule: **only one process may be inside its critical section at a time.**"], "viz": {"type": "chain", "items": ["Entry section (ask permission)", "CRITICAL SECTION (use shared data)", "Exit section (release)", "Remainder section"], "labels": null, "caption": "Structure of every process"}}, {"h": "Three conditions for a correct solution", "tip": "A good answer also says: no assumption about CPU speed or number of CPUs.", "table": {"head": ["Condition", "Meaning"], "rows": [["Mutual exclusion", "If one process is in its CS, no other may enter"], ["Progress", "If nobody is inside, the decision of who enters next cannot be postponed forever, and only processes that want to enter take part"], ["Bounded waiting", "A limit exists on how many times others enter before a waiting process gets its turn (no starvation)"]]}}, {"h": "Fixing the race with a lock (real C)", "p": ["Here two threads each add 100000 to one counter. The mutex makes the load-add-store a protected critical section, so the answer is always exact."], "warn": "Remove the lock and the answer becomes random and usually less than 200000. That is the race condition.", "code": {"f": "main.c", "c": "#include <stdio.h>\n#include <pthread.h>\n\nlong count = 0;\npthread_mutex_t lock = PTHREAD_MUTEX_INITIALIZER;\n\nvoid *work(void *a) {\n    for (int i = 0; i < 100000; i++) {\n        pthread_mutex_lock(&lock);     /* entry section */\n        count++;                       /* critical section */\n        pthread_mutex_unlock(&lock);   /* exit section */\n    }\n    return NULL;\n}\nint main() {\n    pthread_t a, b;\n    pthread_create(&a, NULL, work, NULL);\n    pthread_create(&b, NULL, work, NULL);\n    pthread_join(a, NULL); pthread_join(b, NULL);\n    printf(\"count = %ld (always 200000)\\n\", count);\n    return 0;\n}\n", "out": "count = 200000 (always 200000)"}}], "analogy": "Two people editing the same bank passbook line at the same instant: the last pen stroke wins and one update is lost.", "hinglish": "Race condition matlab dono process ek saath shared data badle aur result galat aaye. Critical section me ek time par ek hi process jaye, ye mutual exclusion hai.", "mistakes": ["Forgetting bounded waiting when listing the three conditions.", "Thinking a race can only happen on multiple CPUs. It also happens on one CPU with context switches."], "remember": ["IPC = communication and synchronization between processes", "Race condition: result depends on order of execution", "Critical section = code that accesses shared data", "Solution needs: mutual exclusion, progress, bounded waiting", "Structure: entry, critical section, exit, remainder", "count++ is load, add, store (not atomic)"], "def": "Processes in a system are **independent** or **cooperating**. Cooperating processes share data, so they need **IPC** and **synchronization** to avoid errors."}, "u3-t2": {"tldr": "Software tricks and CPU instructions that let only one process enter the critical section.", "sections": [{"h": "Strict alternation", "p": [], "warn": "**Violates Progress.** If P0 is slow in its remainder section, P1 cannot enter twice in a row even though nobody is in the CS. This is also busy waiting (spinning).", "viz": {"type": "chain", "items": ["P0: while(turn != 0) wait", "P0 critical section", "turn = 1", "P1: while(turn != 1) wait", "P1 critical section", "turn = 0"], "labels": null, "caption": "Strict alternation"}}, {"h": "Peterson's solution", "p": ["Two shared items: `flag[2]` (I want to enter) and `turn` (whose turn if both want). A process sets its flag, gives the turn to the other, then waits only while the **other wants in and it is the other's turn**.", "It satisfies **mutual exclusion, progress and bounded waiting** with software only."], "table": {"head": ["Step", "What happens"], "rows": [["1. flag[i] = true", "I want to enter"], ["2. turn = j", "but you go first, politely"], ["3. while(flag[j] && turn == j) wait", "wait only if you also want and it is your turn"], ["4. CRITICAL SECTION", "enter"], ["5. flag[i] = false", "exit, I am done"]]}}, {"h": "Peterson in C (verified)", "tip": "C11 atomics are needed on modern CPUs because they reorder memory operations. On paper (exams) plain variables are fine.", "code": {"f": "main.c", "c": "#include <stdio.h>\n#include <pthread.h>\n#include <stdatomic.h>\n\natomic_int flag[2];\natomic_int turn;\nlong count = 0;\n\nvoid enter(int i) {\n    int j = 1 - i;\n    atomic_store(&flag[i], 1);\n    atomic_store(&turn, j);\n    while (atomic_load(&flag[j]) && atomic_load(&turn) == j) ;   /* busy wait */\n}\nvoid leave(int i) { atomic_store(&flag[i], 0); }\n\nvoid *work(void *a) {\n    int me = *(int *)a;\n    for (int k = 0; k < 100000; k++) { enter(me); count++; leave(me); }\n    return NULL;\n}\nint main() {\n    pthread_t t0, t1; int a = 0, b = 1;\n    pthread_create(&t0, NULL, work, &a);\n    pthread_create(&t1, NULL, work, &b);\n    pthread_join(t0, NULL); pthread_join(t1, NULL);\n    printf(\"count = %ld\\n\", count);\n    return 0;\n}\n", "out": "count = 200000"}}, {"h": "Hardware solutions", "p": ["**Disable interrupts:** a process turns off interrupts in its CS so no context switch can happen. Simple, but dangerous for user programs and does not work on multi-CPU machines.", "**Test-and-Set (TSL) instruction:** one atomic CPU instruction that reads the old value of a lock and sets it to 1 in one step."], "table": {"head": ["Step", "What happens"], "rows": [["1. old = lock", "read the lock"], ["2. lock = 1", "set it, in the same atomic step"], ["3. if old == 0", "lock was free: I got it, enter"], ["4. if old == 1", "someone has it: spin and retry"]]}}, {"h": "Test-and-Set spinlock in C", "code": {"f": "main.c", "c": "#include <stdio.h>\n#include <pthread.h>\n#include <stdatomic.h>\n\natomic_flag lock = ATOMIC_FLAG_INIT;\nlong count = 0;\n\nvoid *work(void *a) {\n    for (int i = 0; i < 100000; i++) {\n        while (atomic_flag_test_and_set(&lock)) ;   /* spin until old value was 0 */\n        count++;                                    /* critical section */\n        atomic_flag_clear(&lock);                   /* release */\n    }\n    return NULL;\n}\nint main() {\n    pthread_t a, b;\n    pthread_create(&a, NULL, work, NULL); pthread_create(&b, NULL, work, NULL);\n    pthread_join(a, NULL); pthread_join(b, NULL);\n    printf(\"count = %ld\\n\", count);\n    return 0;\n}\n", "out": "count = 200000"}}, {"h": "Comparison", "table": {"head": ["Method", "Mutual exclusion", "Progress", "Bounded wait", "Drawback"], "rows": [["Strict alternation", "Yes", "No", "Yes", "Busy waiting, forced turns"], ["Peterson", "Yes", "Yes", "Yes", "Only 2 processes, busy waiting"], ["Disable interrupts", "Yes (1 CPU)", "Yes", "Yes", "Unsafe in user mode, no multi-CPU"], ["Test-and-Set", "Yes", "Yes", "No (can starve)", "Busy waiting"]]}}], "analogy": "A single-key washroom: the key (lock) decides who can go in, and others wait outside.", "hinglish": "Strict alternation me bari bari se jaana padta hai, ye progress todta hai. Peterson me flag aur turn dono use hote hain. TSL hardware ka atomic instruction hai.", "mistakes": ["Writing turn = i instead of turn = j in Peterson. You give the turn to the OTHER process.", "Forgetting that TSL must be atomic."], "remember": ["Strict alternation: turn variable, violates progress, busy waiting", "Peterson: flag[2] + turn, satisfies all three conditions for two processes", "Disabling interrupts works only on single CPU and is risky", "TSL / Test-and-Set: atomic read-and-set of a lock", "Busy waiting = wasting CPU in a loop (spinlock)", "Peterson uses software only"], "def": "Two processes share a variable `turn`. Process 0 enters only when `turn == 0`, then sets `turn = 1`. Process 1 does the opposite, so they **take turns**."}, "u3-t3": {"tldr": "Semaphores, monitors and event counters are higher-level tools to synchronize processes without busy waiting.", "sections": [{"h": "Semaphore", "p": [], "table": {"head": ["Operation", "Meaning", "Code idea"], "rows": [["wait(S) or P(S)", "Take a permit; block if none", "while (S <= 0) block; S = S - 1"], ["signal(S) or V(S)", "Give a permit back; wake a waiter", "S = S + 1; wake one blocked process"]]}}, {"h": "Binary and counting semaphores", "table": {"head": ["Type", "Value range", "Use"], "rows": [["Binary (mutex)", "0 or 1", "Mutual exclusion on one resource"], ["Counting", "0 to N", "Control access to N identical resources (e.g. 3 printers)"]]}}, {"h": "Semaphore for mutual exclusion", "p": ["Initialise `mutex = 1`. Every process does `wait(mutex)`, critical section, `signal(mutex)`."], "viz": {"type": "chain", "items": ["wait(mutex)  [1 -> 0]", "CRITICAL SECTION", "signal(mutex)  [0 -> 1]"], "labels": null, "caption": "Binary semaphore guards the CS"}}, {"h": "Semaphore in C", "code": {"f": "main.c", "c": "#include <stdio.h>\n#include <pthread.h>\n#include <semaphore.h>\n\nsem_t mutex;\nlong count = 0;\n\nvoid *work(void *a) {\n    for (int i = 0; i < 100000; i++) {\n        sem_wait(&mutex);     /* P */\n        count++;\n        sem_post(&mutex);     /* V */\n    }\n    return NULL;\n}\nint main() {\n    sem_init(&mutex, 0, 1);   /* binary semaphore, initial value 1 */\n    pthread_t a, b;\n    pthread_create(&a, NULL, work, NULL); pthread_create(&b, NULL, work, NULL);\n    pthread_join(a, NULL); pthread_join(b, NULL);\n    printf(\"count = %ld\\n\", count);\n    return 0;\n}\n", "out": "count = 200000"}}, {"h": "Order control with a semaphore", "p": ["A semaphore initialised to 0 can force an **order**: B waits until A signals. Example: B must print only after A."], "code": {"f": "main.c", "c": "#include <stdio.h>\n#include <pthread.h>\n#include <semaphore.h>\n\nsem_t done;\n\nvoid *A(void *x) { printf(\"A: first\\n\"); sem_post(&done); return NULL; }\nvoid *B(void *x) { sem_wait(&done); printf(\"B: after A\\n\"); return NULL; }\n\nint main() {\n    sem_init(&done, 0, 0);          /* starts at 0: B must wait */\n    pthread_t b, a;\n    pthread_create(&b, NULL, B, NULL);   /* B starts first but blocks */\n    pthread_create(&a, NULL, A, NULL);\n    pthread_join(a, NULL); pthread_join(b, NULL);\n    return 0;\n}\n", "out": "A: first\nB: after A"}}, {"h": "Monitors", "p": ["A **monitor** is a high-level construct: shared data plus the procedures that use it, packaged together. **Only one process can be active inside a monitor at a time**, and the compiler enforces it, so the programmer cannot forget a wait or signal.", "Inside a monitor, **condition variables** let a process wait (`wait(c)`) until another process calls `signal(c)`."], "viz": {"items": ["Callers: P1, P2, P3 (queue at the entrance)", "Monitor entrance: one at a time", "Shared data + procedures + condition variables"], "cap": "Only one process is inside the monitor", "type": "layers", "caption": "Only one process is inside the monitor"}}, {"h": "Event counters", "p": ["An **event counter** is an integer that only increases. Three operations: `read(E)` returns the count, `advance(E)` adds 1, `await(E, v)` blocks until the count reaches `v`. Producer and consumer can synchronize without any mutual exclusion because each counter has only one writer."]}, {"h": "Semaphore vs monitor", "table": {"head": ["Point", "Semaphore", "Monitor"], "rows": [["Level", "Low level", "High level"], ["Mistakes", "Easy (forget signal, wrong order)", "Hard, mutual exclusion is automatic"], ["Mutual exclusion", "Programmer's job", "Built in"], ["Supported in", "OS and libraries", "Languages (Java synchronized, C# lock)"]]}}], "analogy": "A semaphore is a counter of free tickets at a parking gate: take a ticket to enter, give it back on leaving. No ticket means you wait.", "hinglish": "Semaphore ek counter hai jisse wait aur signal chalte hain. Monitor me ek time par ek hi process andar hota hai. Event counter sirf badhta hai.", "mistakes": ["Initialising a mutex semaphore to 0. It must be 1.", "Calling signal before wait on a condition variable and losing the wake-up."], "remember": ["Semaphore = integer with atomic wait(P) and signal(V)", "Binary semaphore (0/1) for mutex; counting semaphore for N resources", "Semaphore initial 0 enforces order between two processes", "Monitor = data + procedures, only one process active at a time", "Condition variables inside monitors: wait and signal", "Event counter: only increases; read, advance, await", "Blocking semaphores avoid busy waiting"], "def": "A **semaphore** is an integer variable accessed only through two atomic operations: **wait (P)** and **signal (V)**. Introduced by Dijkstra."}, "u3-t4": {"tldr": "The two basic ways for processes to talk to each other.", "sections": [{"h": "Two IPC models", "table": {"head": ["Point", "Shared memory", "Message passing"], "rows": [["Idea", "Processes read and write a common memory region", "Processes send and receive messages through the kernel"], ["Speed", "Fast (after setup, no kernel call)", "Slower (system call per message)"], ["Sync", "Programmer must synchronize", "Kernel helps"], ["Good for", "Large data, same machine", "Small data, also across machines (distributed)"], ["Examples", "shmget, mmap", "pipe, message queue, socket"]]}}, {"h": "Shared memory", "p": ["The OS maps one region of memory into the address space of two or more processes. After that they exchange data by plain reads and writes. The OS is involved only in creating the region."], "viz": {"segs": [["Process A space", 30, "used"], ["SHARED REGION", 20, "free"], ["Process B space", 30, "used"]], "cap": "A and B both see the shared region", "type": "mem", "caption": "A and B both see the shared region"}}, {"h": "Shared memory in C", "code": {"f": "main.c", "c": "#include <stdio.h>\n#include <sys/mman.h>\n#include <sys/wait.h>\n#include <unistd.h>\n\nint main() {\n    int *shared = mmap(NULL, sizeof(int), PROT_READ | PROT_WRITE,\n                       MAP_SHARED | MAP_ANONYMOUS, -1, 0);   /* shared page */\n    *shared = 0;\n    if (fork() == 0) {          /* child writes */\n        *shared = 42;\n        return 0;\n    }\n    wait(NULL);                 /* parent waits, then reads */\n    printf(\"parent reads %d written by child\\n\", *shared);\n    return 0;\n}\n", "out": "parent reads 42 written by child"}}, {"h": "Message passing", "p": ["Two operations: **send(destination, message)** and **receive(source, message)**. A **communication link** must exist between the processes."], "viz": {"type": "chain", "items": ["Process A: send(B, msg)", "Kernel message queue", "Process B: receive(A, msg)"], "labels": null, "caption": "Messages go through the kernel"}}, {"h": "Design choices in message passing", "table": {"head": ["Choice", "Options"], "rows": [["Naming", "Direct (send to P) or indirect (mailbox / port)"], ["Synchronization", "Blocking (synchronous) or non-blocking (asynchronous) send and receive"], ["Buffering", "Zero capacity (rendezvous), bounded, unbounded queue"]]}}, {"h": "Pipe: message passing in C", "code": {"f": "main.c", "c": "#include <stdio.h>\n#include <string.h>\n#include <unistd.h>\n#include <sys/wait.h>\n\nint main() {\n    int fd[2]; pipe(fd);            /* fd[0] read end, fd[1] write end */\n    if (fork() == 0) {\n        close(fd[0]);\n        const char *m = \"hello from child\";\n        write(fd[1], m, strlen(m) + 1);   /* send */\n        return 0;\n    }\n    close(fd[1]);\n    char buf[64];\n    read(fd[0], buf, sizeof buf);          /* receive (blocks until data) */\n    wait(NULL);\n    printf(\"parent got: %s\\n\", buf);\n    return 0;\n}\n", "out": "parent got: hello from child"}}], "analogy": "Shared memory is a common notice board. Message passing is sending letters.", "hinglish": "Shared memory me dono process ek hi memory padhte likhte hain, fast hai par sync chahiye. Message passing me kernel message pahunchata hai.", "mistakes": ["Forgetting that shared memory needs synchronization (race condition).", "Saying message passing needs no kernel. The kernel handles every send and receive."], "remember": ["Two IPC models: shared memory and message passing", "Shared memory is faster; needs programmer synchronization", "Message passing: send and receive; easier, good for distributed systems", "Direct vs indirect communication (mailbox)", "Blocking vs non-blocking send/receive", "Pipe = unidirectional message channel"]}, "u3-t5": {"tldr": "A producer fills a buffer and a consumer empties it. They must not overflow, underflow or collide.", "sections": [{"h": "The problem", "p": [], "viz": {"type": "cells", "items": ["A", "B", "C", "", "", ""], "labels": ["0", "1", "2", "3", "4", "5"], "hl": [0, 1, 2], "caption": "Buffer of size 6: 3 filled, 3 empty. in=3, out=0"}}, {"h": "Semaphores used", "table": {"head": ["Semaphore", "Initial value", "Meaning"], "rows": [["empty", "N", "Number of empty slots"], ["full", "0", "Number of filled slots"], ["mutex", "1", "Mutual exclusion on the buffer"]]}}, {"h": "Pseudocode", "warn": "Never put wait(mutex) before wait(empty). If the buffer is full, the producer would hold the mutex while sleeping, and the consumer could never enter: **deadlock**.", "table": {"head": ["Producer", "Consumer"], "rows": [["wait(empty)", "wait(full)"], ["wait(mutex)", "wait(mutex)"], ["add item to buffer", "remove item from buffer"], ["signal(mutex)", "signal(mutex)"], ["signal(full)", "signal(empty)"]]}}, {"h": "Complete C program", "tip": "The buffer is circular: in and out wrap around using % N.", "code": {"f": "main.c", "c": "#include <stdio.h>\n#include <pthread.h>\n#include <semaphore.h>\n#define N 5\n\nint buf[N], in = 0, out = 0;\nsem_t empty, full, mutex;\n\nvoid *producer(void *a) {\n    for (int i = 1; i <= 10; i++) {\n        sem_wait(&empty);\n        sem_wait(&mutex);\n        buf[in] = i; in = (in + 1) % N;\n        sem_post(&mutex);\n        sem_post(&full);\n    }\n    return NULL;\n}\nvoid *consumer(void *a) {\n    int sum = 0;\n    for (int i = 1; i <= 10; i++) {\n        sem_wait(&full);\n        sem_wait(&mutex);\n        sum += buf[out]; out = (out + 1) % N;\n        sem_post(&mutex);\n        sem_post(&empty);\n    }\n    printf(\"consumer received 10 items, sum = %d\\n\", sum);\n    return NULL;\n}\nint main() {\n    sem_init(&empty, 0, N); sem_init(&full, 0, 0); sem_init(&mutex, 0, 1);\n    pthread_t p, c;\n    pthread_create(&p, NULL, producer, NULL); pthread_create(&c, NULL, consumer, NULL);\n    pthread_join(p, NULL); pthread_join(c, NULL);\n    return 0;\n}\n", "out": "consumer received 10 items, sum = 55"}}], "analogy": "A bakery: the baker puts bread on the shelf, the customer takes it. The baker waits when the shelf is full, the customer waits when it is empty.", "hinglish": "Producer buffer bharta hai, consumer khali karta hai. Teen semaphore: empty = N, full = 0, mutex = 1. Order galat hua to deadlock.", "mistakes": ["Swapping wait(empty) and wait(mutex).", "Initialising empty = 0 or full = N."], "remember": ["Bounded buffer problem = producer-consumer", "Semaphores: empty = N, full = 0, mutex = 1", "Producer: wait(empty), wait(mutex), add, signal(mutex), signal(full)", "Consumer: wait(full), wait(mutex), remove, signal(mutex), signal(empty)", "Wrong order of waits causes deadlock", "Circular buffer uses in and out with modulo N"], "def": "A **bounded buffer** of size N is shared. The **producer** adds items. The **consumer** removes items. We need three things: producer waits when the buffer is **full**, consumer waits when it is **empty**, and only one touches the buffer at a time."}, "u3-t6": {"tldr": "Many readers can read at the same time, but a writer needs the data all to itself.", "sections": [{"h": "The problem", "p": [], "table": {"head": ["Who is inside", "Reader allowed?", "Writer allowed?"], "rows": [["Nobody", "Yes", "Yes"], ["Readers only", "Yes", "No"], ["One writer", "No", "No"]]}}, {"h": "First readers-writers solution (readers priority)", "p": ["Shared: `readcount = 0`, semaphore `mutex = 1` (protects readcount) and `wrt = 1` (writers and the group of readers)."], "table": {"head": ["Reader", "Writer"], "rows": [["wait(mutex)", "wait(wrt)"], ["readcount++", "write the data"], ["if readcount == 1: wait(wrt)", "signal(wrt)"], ["signal(mutex)", ""], ["READ the data", ""], ["wait(mutex)", ""], ["readcount--", ""], ["if readcount == 0: signal(wrt)", ""], ["signal(mutex)", ""]]}}, {"h": "Starvation", "p": ["In the readers-priority version a steady stream of readers can **starve** the writer. The second version gives writers priority, but then readers may starve. Fair versions use queueing."], "warn": "Exam point: the classic solution is NOT starvation-free."}, {"h": "Readers-writers in C", "code": {"f": "main.c", "c": "#include <stdio.h>\n#include <pthread.h>\n#include <semaphore.h>\n\nint data = 0, readcount = 0;\nsem_t mutex, wrt;\n\nvoid *writer(void *a) {\n    for (int i = 0; i < 5; i++) {\n        sem_wait(&wrt);\n        data++;                           /* exclusive write */\n        sem_post(&wrt);\n    }\n    return NULL;\n}\nvoid *reader(void *a) {\n    for (int i = 0; i < 5; i++) {\n        sem_wait(&mutex);\n        if (++readcount == 1) sem_wait(&wrt);   /* first reader locks writers */\n        sem_post(&mutex);\n        volatile int v = data;            /* many readers can be here */\n        (void)v;\n        sem_wait(&mutex);\n        if (--readcount == 0) sem_post(&wrt);   /* last reader frees writers */\n        sem_post(&mutex);\n    }\n    return NULL;\n}\nint main() {\n    sem_init(&mutex, 0, 1); sem_init(&wrt, 0, 1);\n    pthread_t r1, r2, w1, w2;\n    pthread_create(&r1, NULL, reader, NULL); pthread_create(&r2, NULL, reader, NULL);\n    pthread_create(&w1, NULL, writer, NULL); pthread_create(&w2, NULL, writer, NULL);\n    pthread_join(r1, NULL); pthread_join(r2, NULL); pthread_join(w1, NULL); pthread_join(w2, NULL);\n    printf(\"final data = %d (2 writers x 5 writes)\\n\", data);\n    return 0;\n}\n", "out": "final data = 10 (2 writers x 5 writes)"}}], "analogy": "A notice board: many people may read it together, but when the clerk is changing it, nobody should read half-written text.", "hinglish": "Readers-writers me bahut readers ek saath padh sakte hain, writer akela chahiye. Pehla reader writers ko lock karta hai, aakhri reader unlock.", "mistakes": ["Allowing a reader and a writer at the same time.", "Forgetting that mutex protects readcount only."], "remember": ["Readers can share; writers need exclusive access", "Shared: readcount, mutex (for readcount), wrt (for writers)", "First reader does wait(wrt); last reader does signal(wrt)", "Readers-priority version can starve writers", "Writers-priority version can starve readers", "Both read-read is allowed; read-write and write-write are not"], "def": "A shared database is used by **readers** (only read) and **writers** (read and write). Rules: many readers allowed together, but a **writer needs exclusive access**."}, "u3-t7": {"tldr": "Five philosophers, five forks: how to avoid deadlock and starvation when everyone needs two forks.", "sections": [{"h": "The problem", "p": [], "viz": {"type": "graph", "nodes": ["P0", "F0", "P1", "F1", "P2", "F2", "P3", "F3", "P4", "F4"], "edges": [["P0", "F0"], ["F0", "P1"], ["P1", "F1"], ["F1", "P2"], ["P2", "F2"], ["F2", "P3"], ["P3", "F3"], ["F3", "P4"], ["P4", "F4"], ["F4", "P0"]], "directed": false, "anim": false, "pos": null, "caption": "P = philosopher, F = fork between neighbours"}}, {"h": "Naive solution and deadlock", "p": ["Each philosopher does `wait(fork[i])` then `wait(fork[(i+1)%5])`. If **all five** pick up their left fork at the same moment, everyone holds one fork and waits for the right one forever: **deadlock**."], "warn": "Deadlock = circular wait. All four conditions of deadlock are present.", "viz": {"type": "graph", "nodes": ["P0", "P1", "P2", "P3", "P4"], "edges": [["P0", "P1", "waits"], ["P1", "P2", "waits"], ["P2", "P3", "waits"], ["P3", "P4", "waits"], ["P4", "P0", "waits"]], "directed": true, "anim": true, "pos": null, "caption": "Circular wait: everyone waits for the next one"}}, {"h": "Solutions to avoid deadlock", "table": {"head": ["Solution", "Idea"], "rows": [["Allow at most 4 philosophers at the table", "With 4 seated, at least one can always get both forks"], ["Pick both forks or none (inside a mutex)", "Check both available, take both atomically"], ["Asymmetric: odd picks left first, even picks right first", "Breaks the circular wait"], ["Resource hierarchy: always take the lower numbered fork first", "Numbering forks makes a cycle impossible"], ["Monitor with states THINKING, HUNGRY, EATING", "A philosopher eats only if neighbours are not eating"]]}}, {"h": "Resource-ordering solution in C", "p": ["Every philosopher picks the **lower-numbered fork first**. This removes the circular wait. Each philosopher eats 3 times."], "code": {"f": "main.c", "c": "#include <stdio.h>\n#include <pthread.h>\n#define N 5\n\npthread_mutex_t fork_[N];\nint meals[N];\n\nvoid *philosopher(void *a) {\n    int i = *(int *)a;\n    int first = i < (i + 1) % N ? i : (i + 1) % N;    /* lower fork number first */\n    int second = i < (i + 1) % N ? (i + 1) % N : i;\n    for (int k = 0; k < 3; k++) {\n        pthread_mutex_lock(&fork_[first]);\n        pthread_mutex_lock(&fork_[second]);\n        meals[i]++;                                     /* eating */\n        pthread_mutex_unlock(&fork_[second]);\n        pthread_mutex_unlock(&fork_[first]);\n    }\n    return NULL;\n}\nint main() {\n    pthread_t t[N]; int id[N];\n    for (int i = 0; i < N; i++) pthread_mutex_init(&fork_[i], NULL);\n    for (int i = 0; i < N; i++) { id[i] = i; pthread_create(&t[i], NULL, philosopher, &id[i]); }\n    for (int i = 0; i < N; i++) pthread_join(t[i], NULL);\n    for (int i = 0; i < N; i++) printf(\"philosopher %d ate %d times\\n\", i, meals[i]);\n    printf(\"no deadlock\\n\");\n    return 0;\n}\n", "out": "philosopher 0 ate 3 times\nphilosopher 1 ate 3 times\nphilosopher 2 ate 3 times\nphilosopher 3 ate 3 times\nphilosopher 4 ate 3 times\nno deadlock"}}, {"h": "Starvation", "p": ["Even a deadlock-free solution can let a philosopher **starve** if his two neighbours keep eating in turn. Fair queueing (or the monitor with HUNGRY state and checking neighbours) reduces this."]}], "analogy": "Five friends at a round table with one chopstick between each pair. Everyone needs two chopsticks to eat. If everyone grabs the left one, nobody can ever eat.", "hinglish": "Paanch philosopher, paanch fork. Sab ne left fork utha liya to deadlock. Fork ko number do aur chhota pehle uthao.", "mistakes": ["Saying the naive semaphore solution is correct. It can deadlock.", "Mixing deadlock (nobody progresses) with starvation (one never progresses)."], "remember": ["Five philosophers, five forks, each needs two forks", "Naive solution deadlocks when everyone takes the left fork", "Solutions: limit to 4 at table, pick both or none, asymmetric order, resource hierarchy, monitor", "Deadlock = circular wait; starvation = one philosopher never eats", "Represents allocating limited resources among competing processes"], "def": "Five philosophers sit around a table. Between each pair there is **one fork**. A philosopher alternates between **thinking** and **eating**. To eat, a philosopher needs **both** the left and right forks. Two neighbours cannot eat together."}, "u4-t1": {"tldr": "A set of processes is stuck forever, each waiting for something another one holds.", "sections": [{"h": "What is a deadlock", "p": ["Resource use order: **request, use, release**."], "viz": {"type": "graph", "nodes": ["P1", "R1", "P2", "R2"], "edges": [["R1", "P1", "held by"], ["P1", "R2", "wants"], ["R2", "P2", "held by"], ["P2", "R1", "wants"]], "directed": true, "anim": true, "pos": null, "caption": "P1 holds R1 and wants R2. P2 holds R2 and wants R1. Cycle = deadlock"}}, {"h": "Four necessary conditions (Coffman)", "p": ["All four must hold **together** for a deadlock."], "tip": "Remove any one condition and deadlock cannot happen. This is the idea behind prevention.", "table": {"head": ["Condition", "Meaning"], "rows": [["Mutual exclusion", "A resource can be used by only one process at a time"], ["Hold and wait", "A process holds some resources while waiting for others"], ["No preemption", "A resource cannot be forcibly taken; only the holder releases it"], ["Circular wait", "P0 waits for P1, P1 for P2, ... Pn for P0 (a cycle)"]]}}, {"h": "Resource allocation graph (RAG)", "p": ["Vertices: processes (circles) and resources (rectangles with dots for instances). Edges: **request edge** P to R, **assignment edge** R to P.", "**No cycle:** no deadlock. **Cycle with single-instance resources:** deadlock. **Cycle with multi-instance resources:** deadlock is possible but not certain."], "table": {"head": ["Graph", "Result"], "rows": [["No cycle", "No deadlock"], ["Cycle, every resource has 1 instance", "Deadlock"], ["Cycle, some resource has many instances", "Maybe deadlock"]]}}, {"h": "Deadlock in real C (with timeout, so it exits)", "p": ["Two threads lock A and B in opposite order. A short sleep makes the clash certain. We use `trylock` so the demo reports it instead of hanging."], "warn": "With plain lock() instead of trylock(), this program would hang forever.", "code": {"f": "main.c", "c": "#include <stdio.h>\n#include <pthread.h>\n#include <unistd.h>\n\npthread_mutex_t A = PTHREAD_MUTEX_INITIALIZER, B = PTHREAD_MUTEX_INITIALIZER;\n\nvoid *t1(void *x) {\n    pthread_mutex_lock(&A);\n    usleep(100000);\n    if (pthread_mutex_trylock(&B) != 0) printf(\"T1: holds A, cannot get B -> deadlock\\n\");\n    else pthread_mutex_unlock(&B);\n    pthread_mutex_unlock(&A);\n    return NULL;\n}\nvoid *t2(void *x) {\n    pthread_mutex_lock(&B);\n    usleep(100000);\n    if (pthread_mutex_trylock(&A) != 0) printf(\"T2: holds B, cannot get A -> deadlock\\n\");\n    else pthread_mutex_unlock(&A);\n    pthread_mutex_unlock(&B);\n    return NULL;\n}\nint main() {\n    pthread_t a, b;\n    pthread_create(&a, NULL, t1, NULL); pthread_create(&b, NULL, t2, NULL);\n    pthread_join(a, NULL); pthread_join(b, NULL);\n    return 0;\n}\n", "out": "T1: holds A, cannot get B -> deadlock\nT2: holds B, cannot get A -> deadlock"}}], "analogy": "Two cars meet on a one-lane bridge from opposite sides. Neither can move until the other backs up, and neither will.", "hinglish": "Deadlock me sab process ek doosre ka wait karte rehte hain. Char conditions: mutual exclusion, hold and wait, no preemption, circular wait.", "mistakes": ["Saying a cycle in RAG always means deadlock. Only for single-instance resources.", "Listing only three of the four conditions."], "remember": ["Deadlock: all processes in a set wait for each other forever", "Coffman conditions: mutual exclusion, hold and wait, no preemption, circular wait", "All four needed together (necessary); cycle in RAG is sufficient only for single-instance resources", "RAG: request edge P to R, assignment edge R to P", "Resource use: request, use, release"], "def": "A **deadlock** is a situation where every process in a set waits for a resource held by another process in the same set, so **none can ever proceed**."}, "u4-t2": {"tldr": "Prevention breaks one condition. Avoidance checks every request and grants it only if the system stays safe.", "sections": [{"h": "Deadlock handling strategies", "table": {"head": ["Strategy", "Idea"], "rows": [["Prevention", "Make sure at least one of the 4 conditions can never hold"], ["Avoidance", "Know future needs; grant a request only if the state stays safe"], ["Detection and recovery", "Allow deadlock, detect it, then recover"], ["Ignore (Ostrich)", "Pretend it never happens (used by UNIX and Windows)"]]}}, {"h": "Prevention: attack each condition", "table": {"head": ["Condition attacked", "How", "Drawback"], "rows": [["Mutual exclusion", "Make resources sharable (read-only files)", "Not possible for printers etc."], ["Hold and wait", "Request all resources at start, or release before asking", "Low utilisation, starvation"], ["No preemption", "Take resources from a waiting process", "Hard for printers; fine for CPU/memory"], ["Circular wait", "Number resources; request only in increasing order", "Rigid, but widely used"]]}}, {"h": "Safe state", "p": ["A state is **safe** if there is an order of all processes (a **safe sequence**) in which each can get its maximum need, finish, and release resources. **Unsafe** does not mean deadlock, but deadlock becomes possible."], "viz": {"type": "graph", "nodes": ["Safe", "Unsafe", "Deadlock"], "edges": [["Safe", "Unsafe", "bad grant"], ["Unsafe", "Deadlock", "may lead"]], "directed": true, "anim": true, "pos": null, "caption": "Avoidance keeps the system inside Safe"}}, {"h": "Banker's algorithm", "p": ["Data per process: **Max**, **Allocation**, **Need = Max - Allocation**, and the system **Available** vector.", "**Safety algorithm:** Work = Available. Find a process with Need <= Work that is not finished. Pretend it finishes: Work += Allocation. Repeat. If all finish, the state is safe.", "**Resource-request algorithm:** a request is valid if Request <= Need and Request <= Available. Pretend to grant it, then run the safety check. If unsafe, make the process wait."]}, {"h": "Worked example (computed by the program below)", "p": ["5 processes P0 to P4, resources A, B, C with Available = (3,3,2)."], "table": {"head": ["Process", "Allocation A B C", "Max A B C", "Need A B C"], "rows": [["P0", "0 1 0", "7 5 3", "7 4 3"], ["P1", "2 0 0", "3 2 2", "1 2 2"], ["P2", "3 0 2", "9 0 2", "6 0 0"], ["P3", "2 1 1", "2 2 2", "0 1 1"], ["P4", "0 0 2", "4 3 3", "4 3 1"]]}}, {"h": "Banker's algorithm in C (verified)", "tip": "The safe sequence is not unique. Any one valid order proves the state is safe.", "code": {"f": "main.c", "c": "#include <stdio.h>\n#define P 5\n#define R 3\n\nint alloc[P][R] = {{0,1,0},{2,0,0},{3,0,2},{2,1,1},{0,0,2}};\nint max[P][R]   = {{7,5,3},{3,2,2},{9,0,2},{2,2,2},{4,3,3}};\nint avail[R]    = {3,3,2};\n\nint main() {\n    int need[P][R], done[P] = {0}, seq[P], n = 0, work[R];\n    for (int i = 0; i < P; i++) for (int j = 0; j < R; j++) need[i][j] = max[i][j] - alloc[i][j];\n    for (int j = 0; j < R; j++) work[j] = avail[j];\n    while (n < P) {\n        int found = 0;\n        for (int i = 0; i < P; i++) {\n            if (done[i]) continue;\n            int ok = 1;\n            for (int j = 0; j < R; j++) if (need[i][j] > work[j]) { ok = 0; break; }\n            if (ok) {\n                for (int j = 0; j < R; j++) work[j] += alloc[i][j];   /* it finishes, releases */\n                done[i] = 1; seq[n++] = i; found = 1;\n            }\n        }\n        if (!found) { printf(\"UNSAFE state\\n\"); return 0; }\n    }\n    printf(\"SAFE. Safe sequence: \");\n    for (int i = 0; i < P; i++) printf(\"P%d%s\", seq[i], i < P - 1 ? \" -> \" : \"\\n\");\n    return 0;\n}\n", "out": "SAFE. Safe sequence: P1 -> P3 -> P4 -> P0 -> P2"}}], "analogy": "Prevention is a rule that makes jams impossible. Avoidance is a traffic police who lets a car go only if everyone can still get through.", "hinglish": "Prevention ek condition tod deta hai. Avoidance me Banker's algorithm se dekhte hain ki request dene ke baad bhi safe sequence bachta hai ya nahi.", "mistakes": ["Calculating Need as Allocation - Max (it is Max - Allocation).", "Thinking unsafe state means deadlock has already occurred."], "remember": ["Strategies: prevention, avoidance, detection and recovery, ignore", "Prevention breaks one of the 4 conditions; circular wait broken by resource ordering", "Safe state = a safe sequence exists; unsafe may lead to deadlock", "Banker's: Need = Max - Allocation; safety check with Work and Finish", "Request is granted only if Request <= Need, Request <= Available and the new state is safe", "Banker's needs advance knowledge of maximum needs"]}, "u4-t3": {"tldr": "Let deadlocks happen, find them with an algorithm, then break them.", "sections": [{"h": "Detection with single-instance resources", "p": [], "viz": {"type": "graph", "nodes": ["P1", "P2", "P3"], "edges": [["P1", "P2"], ["P2", "P3"], ["P3", "P1"]], "directed": true, "anim": true, "pos": null, "caption": "Wait-for graph: cycle P1, P2, P3 means deadlock"}}, {"h": "Detection with multiple instances", "p": ["Use a Banker's-like algorithm with **Allocation**, **Request** and **Available**. Mark processes that can finish. Any process that can never be marked is **deadlocked**."], "tip": "Here P2 asks for one more C that nobody can give, and P1, P3, P4 wait on it too, so the output lists the deadlocked set.", "code": {"f": "main.c", "c": "#include <stdio.h>\n#define P 5\n#define R 3\n\nint alloc[P][R] = {{0,1,0},{2,0,0},{3,0,3},{2,1,1},{0,0,2}};\nint req[P][R]   = {{0,0,0},{2,0,2},{0,0,1},{1,0,0},{0,0,2}};\nint avail[R]    = {0,0,0};\n\nint main() {\n    int work[R], fin[P];\n    for (int j = 0; j < R; j++) work[j] = avail[j];\n    for (int i = 0; i < P; i++) fin[i] = 0;\n    int changed = 1;\n    while (changed) {\n        changed = 0;\n        for (int i = 0; i < P; i++) {\n            if (fin[i]) continue;\n            int ok = 1;\n            for (int j = 0; j < R; j++) if (req[i][j] > work[j]) ok = 0;\n            if (ok) { for (int j = 0; j < R; j++) work[j] += alloc[i][j]; fin[i] = changed = 1; }\n        }\n    }\n    int dead = 0;\n    for (int i = 0; i < P; i++) if (!fin[i]) { printf(\"P%d is deadlocked\\n\", i); dead = 1; }\n    if (!dead) printf(\"no deadlock\\n\");\n    return 0;\n}\n", "out": "P1 is deadlocked\nP2 is deadlocked\nP3 is deadlocked\nP4 is deadlocked"}}, {"h": "When to run detection", "table": {"head": ["Option", "Effect"], "rows": [["Every resource request", "Finds deadlock early but costs a lot of CPU"], ["At fixed intervals", "Cheaper, may find several deadlocks at once"], ["When CPU utilisation drops", "Low utilisation hints that processes are stuck"]]}}, {"h": "Recovery", "warn": "Choosing the victim: priority, work done, resources held, how many more it needs. Avoid always picking the same victim (starvation).", "table": {"head": ["Method", "How", "Issue"], "rows": [["Terminate all deadlocked processes", "Kill every process in the cycle", "Heavy loss of work"], ["Terminate one at a time", "Kill until the cycle breaks, re-run detection", "Overhead; choose a victim wisely"], ["Resource preemption", "Take a resource from a process and give it to another", "Choose victim, rollback, avoid starvation"], ["Rollback", "Restart a process from a saved checkpoint", "Needs checkpoints"]]}}], "analogy": "Doctors let a disease appear, run a test, then treat it, rather than preventing it every time.", "hinglish": "Detection me wait-for graph ka cycle dhundhte hain. Recovery me process maarte hain ya resource chheen lete hain, aur victim aise chuno ki starvation na ho.", "mistakes": ["Forgetting to rerun detection after killing one process.", "Picking the same victim every time (starvation)."], "remember": ["Detection allows deadlock then finds it", "Single instance: wait-for graph cycle = deadlock", "Multiple instances: Banker-like algorithm with Request matrix", "Recovery: terminate processes (all or one by one) or preempt resources with rollback", "Victim selection must avoid starvation"], "def": "Convert the RAG to a **wait
