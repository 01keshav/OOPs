lain dequeue from q1. The newest item is always at the front, which is the LIFO rule."], "code": {"f": "Main.java", "c": "public class Main {\n    static class Queue {\n        int[] a = new int[100]; int h = 0, t = 0;\n        void enqueue(int x) { a[t++] = x; }\n        int dequeue() { return a[h++]; }\n        boolean isEmpty() { return h == t; }\n    }\n    static Queue q1 = new Queue(), q2 = new Queue();\n    static void push(int x) {                       // costly push\n        q2.enqueue(x);\n        while (!q1.isEmpty()) q2.enqueue(q1.dequeue());\n        Queue t = q1; q1 = q2; q2 = t;              // swap names\n    }\n    static int pop() { return q1.dequeue(); }       // O(1)\n    public static void main(String[] args) {\n        push(1); push(2); push(3);\n        System.out.println(\"pop -> \" + pop());\n        push(4);\n        System.out.println(\"pop -> \" + pop());\n        System.out.println(\"pop -> \" + pop());\n        System.out.println(\"pop -> \" + pop());\n    }\n}\n", "out": "pop -> 3\npop -> 4\npop -> 2\npop -> 1", "cpp": {"f": "main.cpp", "c": "#include <iostream>\nusing namespace std;\nstruct Queue {\n    int a[100]; int h = 0, t = 0;\n    void enqueue(int x) { a[t++] = x; }\n    int dequeue() { return a[h++]; }\n    bool isEmpty() { return h == t; }\n};\nQueue qa, qb;\nQueue *q1 = &qa, *q2 = &qb;\nvoid push(int x) {                       // costly push\n    q2->enqueue(x);\n    while (!q1->isEmpty()) q2->enqueue(q1->dequeue());\n    Queue* t = q1; q1 = q2; q2 = t;      // swap names\n}\nint pop() { return q1->dequeue(); }      // O(1)\nint main() {\n    push(1); push(2); push(3);\n    cout << \"pop -> \" << pop() << \"\\n\";\n    push(4);\n    cout << \"pop -> \" << pop() << \"\\n\";\n    cout << \"pop -> \" << pop() << \"\\n\";\n    cout << \"pop -> \" << pop() << \"\\n\";\n}\n"}, "clang": {"f": "main.c", "c": "#include <stdio.h>\n\ntypedef struct { int a[100]; int h, t; } Queue;\nvoid enqueue(Queue *q, int x) { q->a[q->t++] = x; }\nint dequeue(Queue *q) { return q->a[q->h++]; }\nint isEmpty(Queue *q) { return q->h == q->t; }\n\nQueue qa, qb;\nQueue *q1 = &qa, *q2 = &qb;\nvoid push(int x) {                       /* costly push */\n    enqueue(q2, x);\n    while (!isEmpty(q1)) enqueue(q2, dequeue(q1));\n    Queue *t = q1; q1 = q2; q2 = t;      /* swap names */\n}\nint pop() { return dequeue(q1); }        /* O(1) */\nint main() {\n    push(1); push(2); push(3);\n    printf(\"pop -> %d\\n\", pop());\n    push(4);\n    printf(\"pop -> %d\\n\", pop());\n    printf(\"pop -> %d\\n\", pop());\n    printf(\"pop -> %d\\n\", pop());\n    return 0;\n}\n"}}}, {"h": "Stack using one queue", "p": ["One queue is enough. After enqueueing x, rotate the older n-1 items (dequeue and enqueue each) so that x comes to the front. Push costs n steps, pop costs 1."], "code": {"f": "Main.java", "c": "public class Main {\n    static int[] a = new int[100];\n    static int h = 0, t = 0, rot = 0;                // one queue only\n    static int size() { return t - h; }\n    static void push(int x) {\n        a[t++] = x;\n        for (int i = 0; i < size() - 1; i++) { a[t++] = a[h++]; rot++; }   // rotate old items behind x\n    }\n    static int pop() { return a[h++]; }\n    public static void main(String[] args) {\n        for (int x = 10; x <= 40; x += 10) push(x);\n        System.out.println(\"front (top of stack) = \" + a[h]);\n        System.out.println(\"pop -> \" + pop());\n        System.out.println(\"pop -> \" + pop());\n        System.out.println(\"rotations done = \" + rot);\n    }\n}\n", "out": "front (top of stack) = 40\npop -> 40\npop -> 30\nrotations done = 6", "cpp": {"f": "main.cpp", "c": "#include <iostream>\nusing namespace std;\nint a[100];\nint h = 0, t = 0, rot = 0;                // one queue only\nint size() { return t - h; }\nvoid push(int x) {\n    a[t++] = x;\n    for (int i = 0; i < size() - 1; i++) { a[t++] = a[h++]; rot++; }   // rotate old items behind x\n}\nint pop() { return a[h++]; }\nint main() {\n    for (int x = 10; x <= 40; x += 10) push(x);\n    cout << \"front (top of stack) = \" << a[h] << \"\\n\";\n    cout << \"pop -> \" << pop() << \"\\n\";\n    cout << \"pop -> \" << pop() << \"\\n\";\n    cout << \"rotations done = \" << rot << \"\\n\";\n}\n"}, "clang": {"f": "main.c", "c": "#include <stdio.h>\n\nint a[100];\nint h = 0, t = 0, rot = 0;                /* one queue only */\nint size() { return t - h; }\nvoid push(int x) {\n    a[t++] = x;\n    for (int i = 0; i < size() - 1; i++) { a[t++] = a[h++]; rot++; }   /* rotate old items behind x */\n}\nint pop() { return a[h++]; }\nint main() {\n    for (int x = 10; x <= 40; x += 10) push(x);\n    printf(\"front (top of stack) = %d\\n\", a[h]);\n    printf(\"pop -> %d\\n\", pop());\n    printf(\"pop -> %d\\n\", pop());\n    printf(\"rotations done = %d\\n\", rot);\n    return 0;\n}\n"}}}, {"h": "Time and space complexity", "p": ["Queue with two stacks (lazy transfer): enqueue O(1). Dequeue is O(n) in the worst case, when n items must be moved, but each item moves once, so over m operations the total is O(m): amortised O(1). The alternative design (costly enqueue) makes enqueue O(n) and dequeue O(1).", "Stack with queues: push O(n) because n-1 items are rotated or copied; pop O(1). The other design (costly pop) makes push O(1) and pop O(n). Extra space: a second stack or queue holding up to n items, O(n); the one-queue stack needs no second structure (O(1) extra)."], "tip": "Exam: always say which operation is made costly and why. \"Amortised O(1)\" is the key phrase for the two-stack queue.", "table": {"head": ["Design", "Operation", "Time", "Extra space"], "rows": [["Queue from 2 stacks (lazy)", "enqueue", "O(1)", "O(n)"], ["", "dequeue", "O(1) amortised, O(n) worst", "O(n)"], ["Stack from 2 queues (costly push)", "push", "O(n)", "O(n)"], ["", "pop", "O(1)", "O(n)"], ["Stack from 1 queue", "push", "O(n)", "O(1)"], ["", "pop", "O(1)", "O(1)"]]}}], "analogy": "Stack of plates: you take the top plate (the last one placed). To serve plates in the order they were placed, move the whole pile onto a second pile; the order flips and the oldest plate is now on top.", "hinglish": "Bhai stack LIFO hai aur queue FIFO. Do stacks ko jodkar order do baar ulta hota hai to FIFO mil jaata hai. Ulta, queue se stack banana ho to push ke time purane items ko rotate karke naye item ke peeche bhej do, taaki naya item front par rahe.", "mistakes": ["Transferring from `in` to `out` on every dequeue, or while `out` is not empty (breaks the order).", "Forgetting to swap the queues after a push.", "Saying both operations are O(1) in the worst case.", "Checking only one stack for empty."], "remember": ["Stack is LIFO, queue is FIFO; converting needs a reversal.", "Queue with 2 stacks: enqueue to in, dequeue from out.", "Transfer in to out ONLY when out is empty.", "Transferring flips the order, so the oldest item is on top.", "Each item is moved at most once: amortised O(1) dequeue.", "Stack with 2 queues: after push, front must hold the newest item.", "Costly push: put new item in q2, move all of q1 behind it, swap q1 and q2.", "Stack with 1 queue: enqueue then rotate n-1 items.", "Either push or pop is O(n), never both.", "Extra space is O(n) with two structures."], "uses": ["Interview and exam problems on ADT understanding", "Systems that only offer a stack (or only a queue) API", "Undo/redo and buffering designs where order must be reversed"], "pros": ["Shows that an ADT does not depend on its implementation", "Two-stack queue has amortised O(1) operations"], "cons": ["Extra memory for the second structure", "One of the operations becomes O(n) in the worst case"], "def": "A stack gives the NEWEST item first, a queue gives the OLDEST item first. To imitate one with the other we must reverse the order of the items once, and that reversing step is the extra cost."}, "u3-t6": {"tldr": "Three classic linked list problems solved with pointer tricks: reversing links, slow and fast pointers, and Floyd cycle detection.", "sections": [{"h": "Reverse a linked list: idea", "p": [], "pts": ["Dry run for 1 -> 2 -> 3: start prev = null, cur = 1.", "Step 1: 1.next = null, prev = 1, cur = 2.", "Step 2: 2.next = 1, prev = 2, cur = 3.", "Step 3: 3.next = 2, prev = 3, cur = null. Return prev = 3, giving 3 -> 2 -> 1."], "table": {"head": ["Step", "What happens"], "rows": [["1. nxt = cur.next", "save the rest of the list"], ["2. cur.next = prev", "flip this link"], ["3. prev = cur", "move prev forward"], ["4. cur = nxt", "move cur forward; stop at null"]]}}, {"h": "Reverse: iterative and recursive code", "p": ["The recursive version reverses the rest of the list first, then makes the next node point back to the current one and cuts the old forward link."], "code": {"f": "Main.java", "c": "public class Main {\n    static class Node { int data; Node next; Node(int d) { data = d; } }\n    static Node build(int... v) {\n        Node h = null, t = null;\n        for (int x : v) { Node n = new Node(x); if (h == null) h = t = n; else { t.next = n; t = n; } }\n        return h;\n    }\n    static String str(Node h) {\n        StringBuilder sb = new StringBuilder();\n        for (Node p = h; p != null; p = p.next) sb.append(p.data).append(p.next != null ? \" -> \" : \"\");\n        return sb.toString();\n    }\n    static Node reverse(Node head) {                  // iterative\n        Node prev = null, cur = head;\n        while (cur != null) {\n            Node nxt = cur.next;      // 1. save\n            cur.next = prev;          // 2. reverse the link\n            prev = cur;               // 3. move prev\n            cur = nxt;                // 4. move cur\n        }\n        return prev;\n    }\n    static Node reverseRec(Node h) {                  // recursive\n        if (h == null || h.next == null) return h;\n        Node rest = reverseRec(h.next);\n        h.next.next = h;\n        h.next = null;\n        return rest;\n    }\n    public static void main(String[] args) {\n        Node h = build(1, 2, 3, 4, 5);\n        System.out.println(\"original  : \" + str(h));\n        h = reverse(h);\n        System.out.println(\"iterative : \" + str(h));\n        h = reverseRec(h);\n        System.out.println(\"recursive : \" + str(h));\n    }\n}\n", "out": "original  : 1 -> 2 -> 3 -> 4 -> 5\niterative : 5 -> 4 -> 3 -> 2 -> 1\nrecursive : 1 -> 2 -> 3 -> 4 -> 5", "cpp": {"f": "main.cpp", "c": "#include <iostream>\n#include <string>\nusing namespace std;\nstruct Node { int data; Node* next; Node(int d) : data(d), next(nullptr) {} };\nNode* build(initializer_list<int> v) {\n    Node *h = nullptr, *t = nullptr;\n    for (int x : v) { Node* n = new Node(x); if (!h) h = t = n; else { t->next = n; t = n; } }\n    return h;\n}\nstring str(Node* h) {\n    string s = \"\";\n    for (Node* p = h; p; p = p->next) s += to_string(p->data) + (p->next ? \" -> \" : \"\");\n    return s;\n}\nNode* reverse(Node* head) {                  // iterative\n    Node *prev = nullptr, *cur = head;\n    while (cur) {\n        Node* nxt = cur->next;      // 1. save\n        cur->next = prev;           // 2. reverse the link\n        prev = cur;                 // 3. move prev\n        cur = nxt;                  // 4. move cur\n    }\n    return prev;\n}\nNode* reverseRec(Node* h) {                  // recursive\n    if (!h || !h->next) return h;\n    Node* rest = reverseRec(h->next);\n    h->next->next = h;\n    h->next = nullptr;\n    return rest;\n}\nint main() {\n    Node* h = build({1, 2, 3, 4, 5});\n    cout << \"original  : \" << str(h) << \"\\n\";\n    h = reverse(h);\n    cout << \"iterative : \" << str(h) << \"\\n\";\n    h = reverseRec(h);\n    cout << \"recursive : \" << str(h) << \"\\n\";\n}\n"}, "clang": {"f": "main.c", "c": "#include <stdio.h>\n#include <stdlib.h>\n\ntypedef struct Node { int data; struct Node *next; } Node;\nNode *mk(int d) { Node *n = malloc(sizeof(Node)); n->data = d; n->next = NULL; return n; }\nNode *build(int v[], int n) {\n    Node *h = NULL, *t = NULL;\n    for (int i = 0; i < n; i++) { Node *x = mk(v[i]); if (!h) h = t = x; else { t->next = x; t = x; } }\n    return h;\n}\nvoid str(Node *h) {\n    for (Node *p = h; p; p = p->next) printf(\"%d%s\", p->data, p->next ? \" -> \" : \"\");\n}\nNode *reverse(Node *head) {                  /* iterative */\n    Node *prev = NULL, *cur = head;\n    while (cur) {\n        Node *nxt = cur->next;      /* 1. save */\n        cur->next = prev;           /* 2. reverse the link */\n        prev = cur;                 /* 3. move prev */\n        cur = nxt;                  /* 4. move cur */\n    }\n    return prev;\n}\nNode *reverseRec(Node *h) {                  /* recursive */\n    if (!h || !h->next) return h;\n    Node *rest = reverseRec(h->next);\n    h->next->next = h;\n    h->next = NULL;\n    return rest;\n}\nint main() {\n    int v[] = {1, 2, 3, 4, 5};\n    Node *h = build(v, 5);\n    printf(\"original  : \"); str(h); printf(\"\\n\");\n    h = reverse(h);\n    printf(\"iterative : \"); str(h); printf(\"\\n\");\n    h = reverseRec(h);\n    printf(\"recursive : \"); str(h); printf(\"\\n\");\n    return 0;\n}\n"}}}, {"h": "Middle node and Nth node from the end", "p": ["Slow and fast pointers: fast moves two nodes for every one move of slow. When fast reaches the end, slow is at the middle. For an even count this gives the second middle.", "Nth from the end: move `lead` n nodes ahead, then move both together. When lead falls off the end, `lag` is n nodes from the end. No need to count the length first."], "code": {"f": "Main.java", "c": "public class Main {\n    static class Node { int data; Node next; Node(int d) { data = d; } }\n    static Node build(int... v) {\n        Node h = null, t = null;\n        for (int x : v) { Node n = new Node(x); if (h == null) h = t = n; else { t.next = n; t = n; } }\n        return h;\n    }\n    static int middle(Node h) {                       // slow moves 1, fast moves 2\n        Node slow = h, fast = h;\n        while (fast != null && fast.next != null) { slow = slow.next; fast = fast.next.next; }\n        return slow.data;\n    }\n    static int nthFromEnd(Node h, int n) {            // gap of n between two pointers\n        Node lead = h, lag = h;\n        for (int i = 0; i < n; i++) { if (lead == null) return -1; lead = lead.next; }\n        while (lead != null) { lead = lead.next; lag = lag.next; }\n        return lag.data;\n    }\n    public static void main(String[] args) {\n        Node a = build(10, 20, 30, 40, 50), b = build(10, 20, 30, 40, 50, 60);\n        System.out.println(\"middle of 5 nodes = \" + middle(a));\n        System.out.println(\"middle of 6 nodes = \" + middle(b) + \" (second middle)\");\n        System.out.println(\"2nd from end (5 nodes) = \" + nthFromEnd(a, 2));\n        System.out.println(\"1st from end (6 nodes) = \" + nthFromEnd(b, 1));\n        System.out.println(\"9th from end (5 nodes) = \" + nthFromEnd(a, 9));\n    }\n}\n", "out": "middle of 5 nodes = 30\nmiddle of 6 nodes = 40 (second middle)\n2nd from end (5 nodes) = 40\n1st from end (6 nodes) = 60\n9th from end (5 nodes) = -1", "cpp": {"f": "main.cpp", "c": "#include <iostream>\nusing namespace std;\nstruct Node { int data; Node* next; Node(int d) : data(d), next(nullptr) {} };\nNode* build(initializer_list<int> v) {\n    Node *h = nullptr, *t = nullptr;\n    for (int x : v) { Node* n = new Node(x); if (!h) h = t = n; else { t->next = n; t = n; } }\n    return h;\n}\nint middle(Node* h) {                       // slow moves 1, fast moves 2\n    Node *slow = h, *fast = h;\n    while (fast && fast->next) { slow = slow->next; fast = fast->next->next; }\n    return slow->data;\n}\nint nthFromEnd(Node* h, int n) {            // gap of n between two pointers\n    Node *lead = h, *lag = h;\n    for (int i = 0; i < n; i++) { if (!lead) return -1; lead = lead->next; }\n    while (lead) { lead = lead->next; lag = lag->next; }\n    return lag->data;\n}\nint main() {\n    Node *a = build({10, op, fast reaches null.", "To find where the loop starts: keep one pointer at the meeting node and put another at the head; move both one step at a time. They meet at the first node of the loop. To get the loop length, walk from the meeting node until you return to it."], "code": {"f": "Main.java", "c": "public class Main {\n    static class Node { int data; Node next; Node(int d) { data = d; } }\n    static Node meet(Node head) {                     // Floyd: returns meeting node or null\n        Node slow = head, fast = head;\n        while (fast != null && fast.next != null) {\n            slow = slow.next; fast = fast.next.next;\n            if (slow == fast) return slow;\n        }\n        return null;\n    }\n    static void analyse(String name, Node head) {\n        Node m = meet(head);\n        if (m == null) { System.out.println(name + \": no cycle\"); return; }\n        Node a = head, b = m;                         // start of the cycle\n        while (a != b) { a = a.next; b = b.next; }\n        int len = 1;                                  // length of the cycle\n        for (Node p = m.next; p != m; p = p.next) len++;\n        System.out.println(name + \": cycle found, starts at \" + a.data + \", length \" + len);\n    }\n    public static void main(String[] args) {\n        Node[] n = new Node[6];\n        for (int i = 0; i < 6; i++) n[i] = new Node(i + 1);\n        for (int i = 0; i < 5; i++) n[i].next = n[i + 1];\n        analyse(\"list A\", n[0]);\n        n[5].next = n[2];                             // 6 points back to 3\n        analyse(\"list B\", n[0]);\n    }\n}\n", "out": "list A: no cycle\nlist B: cycle found, starts at 3, length 4", "cpp": {"f": "main.cpp", "c": "#include <iostream>\n#include <string>\nusing namespace std;\nstruct Node { int data; Node* next; Node(int d) : data(d), next(nullptr) {} };\nNode* meet(Node* head) {                     // Floyd: returns meeting node or null\n    Node *slow = head, *fast = head;\n    while (fast && fast->next) {\n        slow = slow->next; fast = fast->next->next;\n        if (slow == fast) return slow;\n    }\n    return nullptr;\n}\nvoid analyse(string name, Node* head) {\n    Node* m = meet(head);\n    if (!m) { cout << name << \": no cycle\\n\"; return; }\n    Node *a = head, *b = m;                  // start of the cycle\n    while (a != b) { a = a->next; b = b->next; }\n    int len = 1;                             // length of the cycle\n    for (Node* p = m->next; p != m; p = p->next) len++;\n    cout << name << \": cycle found, starts at \" << a->data << \", length \" << len << \"\\n\";\n}\nint main() {\n    Node* n[6];\n    for (int i = 0; i < 6; i++) n[i] = new Node(i + 1);\n    for (int i = 0; i < 5; i++) n[i]->next = n[i + 1];\n    analyse(\"list A\", n[0]);\n    n[5]->next = n[2];                       // 6 points back to 3\n    analyse(\"list B\", n[0]);\n}\n"}, "clang": {"f": "main.c", "c": "#include <stdio.h>\n#include <stdlib.h>\n\ntypedef struct Node { int data; struct Node *next; } Node;\nNode *mk(int d) { Node *n = malloc(sizeof(Node)); n->data = d; n->next = NULL; return n; }\nNode *build(int v[], int n) {\n    Node *h = NULL, *t = NULL;\n    for (int i = 0; i < n; i++) { Node *x = mk(v[i]); if (!h) h = t = x; else { t->next = x; t = x; } }\n    return h;\n}\nNode *meet(Node *head) {                     /* Floyd: returns meeting node or NULL */\n    Node *slow = head, *fast = head;\n    while (fast && fast->next) {\n        slow = slow->next; fast = fast->next->next;\n        if (slow == fast) return slow;\n    }\n    return NULL;\n}\nvoid analyse(const char *name, Node *head) {\n    Node *m = meet(head);\n    if (!m) { printf(\"%s: no cycle\\n\", name); return; }\n    Node *a = head, *b = m;                  /* start of the cycle */\n    while (a != b) { a = a->next; b = b->next; }\n    int len = 1;                             /* length of the cycle */\n    for (Node *p = m->next; p != m; p = p->next) len++;\n    printf(\"%s: cycle found, starts at %d, length %d\\n\", name, a->data, len);\n}\nint main() {\n    Node *n[6];\n    for (int i = 0; i < 6; i++) n[i] = mk(i + 1);\n    for (int i = 0; i < 5; i++) n[i]->next = n[i + 1];\n    analyse(\"list A\", n[0]);\n    n[5]->next = n[2];                       /* 6 points back to 3 */\n    analyse(\"list B\", n[0]);\n    return 0;\n}\n"}}, "viz": {"type": "chain", "items": ["1", "2", "3", "4", "5", "6", "back to 3"], "caption": "List B: node 6 points back to node 3"}}, {"h": "Time and space complexity", "p": ["Reverse: every node is visited once and each step does constant work, so O(n) time. Iterative uses 3 pointers: O(1) space. Recursive reversal uses one stack frame per node: O(n) space.", "Middle, Nth from end: one pass, O(n) time, O(1) space (fast covers n nodes, slow n/2). Cycle detection: if the loop exists, fast catches slow within about n steps (non-loop length + loop length), so O(n) time and O(1) space. The naive method that stores visited nodes in a hash set is also O(n) time but needs O(n) space.", "Best case for cycle detection is a very short list, but the bound stays O(n) for an acyclic list because fast must reach the end."], "tip": "Exam: stress \"one pass and O(1) extra space\" for Floyd, it is the reason this method is preferred.", "table": {"head": ["Problem", "Time", "Space"], "rows": [["Reverse (iterative)", "O(n)", "O(1)"], ["Reverse (recursive)", "O(n)", "O(n) stack"], ["Middle node (slow/fast)", "O(n)", "O(1)"], ["Nth from end (two pointers)", "O(n)", "O(1)"], ["Cycle detection (Floyd)", "O(n)", "O(1)"], ["Cycle detection (visited set)", "O(n)", "O(n)"], ["Find cycle start / length", "O(n)", "O(1)"]]}}], "analogy": "Two runners on a track: one jogs, one sprints at double speed. If the track is a straight line the sprinter just finishes first (and the jogger is exactly halfway). If the track is a loop, the sprinter laps the jogger and they meet.", "hinglish": "Bhai linked list ke teen famous sawal hain. Reverse mein prev, cur, next teen pointer se links ulta karte hain. Middle ke liye slow ek step aur fast do step chalta hai. Cycle ho to fast, slow se aakar mil jaata hai. Teeno O(n) time aur O(1) space mein.", "mistakes": ["Overwriting cur.next before saving it (the rest of the list is lost).", "Returning head instead of prev after reversal.", "Checking fast.next.next without first checking fast and fast.next for null.", "Forgetting that the old head must end with next = null."], "remember": ["Reverse: use prev, cur, nxt; save next, flip link, advance both.", "Return prev as the new head.", "Recursive reverse: reverse the rest, then h.next.next = h, h.next = null.", "Middle: slow +1, fast +2; stop when fast or fast.next is null.", "Nth from end: gap of n nodes between two pointers.", "Floyd: slow +1, fast +2; if they meet, a cycle exists.", "Cycle start: reset one pointer to head, move both +1 until they meet.", "Cycle length: count nodes from the meeting node back to itself.", "All three are O(n) time; iterative versions are O(1) space.", "Recursive reverse needs O(n) stack space."], "uses": ["Reversing a list in place (undo history, palindrome check)", "Finding the middle for merge sort on linked lists", "Detecting infinite loops or corrupted lists", "Checking whether a linked list is a palindrome (find middle, reverse second half, compare)"], "pros": ["One pass, O(1) extra space", "No extra data structure needed"], "cons": ["Pointer handling is error prone", "Recursive reverse can overflow the stack on long lists"], "def": "Reversing means making every node point to its PREVIOUS node. We cannot just change `cur.next` because we would lose the rest of the list, so we save the next node first."}, "u3-t7": {"tldr": "Store each term (coefficient, exponent) as a node in decreasing exponent order; adding two polynomials is a merge of two sorted lists.", "sections": [{"h": "Why a linked list for polynomials?", "p": ["Each node holds the coefficient, the exponent and a link to the next term. The terms are kept in DECREASING order of exponent so that two polynomials can be added in one pass."], "viz": {"type": "chain", "items": ["5,3", "4,2", "2,0", "null"], "labels": ["next", "next", "next"], "caption": "5x^3 + 4x^2 + 2 (each node is coefficient, exponent)"}}, {"h": "Node structure, creation and display", "p": ["The insert function places a term at its correct position and adds the coefficients if that exponent already exists (a zero result removes the term). Display prints signs and powers in the usual style."], "code": {"f": "Main.java", "c": "public class Main {\n    static class Node { int c, e; Node next; Node(int c, int e) { this.c = c; this.e = e; } }\n    static Node insert(Node h, int c, int e) {        // keeps exponents in decreasing order, combines like terms\n        if (c == 0) return h;\n        if (h == null || e > h.e) { Node n = new Node(c, e); n.next = h; return n; }\n        if (h.e == e) { h.c += c; return h.c == 0 ? h.next : h; }\n        Node p = h;\n        while (p.next != null && p.next.e > e) p = p.next;\n        if (p.next != null && p.next.e == e) { p.next.c += c; if (p.next.c == 0) p.next = p.next.next; return h; }\n        Node n = new Node(c, e); n.next = p.next; p.next = n;\n        return h;\n    }\n    static String str(Node h) {\n        if (h == null) return \"0\";\n        StringBuilder sb = new StringBuilder();\n        for (Node p = h; p != null; p = p.next) {\n            int c = p.c, a = Math.abs(c);\n            if (p == h) { if (c < 0) sb.append(\"-\"); } else sb.append(c < 0 ? \" - \" : \" + \");\n            if (a != 1 || p.e == 0) sb.append(a);\n            if (p.e == 1) sb.append(\"x\"); else if (p.e > 1) sb.append(\"x^\").append(p.e);\n        }\n        return sb.toString();\n    }\n    public static void main(String[] args) {\n        Node p = null;\n        p = insert(p, 2, 2); p = insert(p, 3, 4); p = insert(p, -5, 0); p = insert(p, 1, 1);   // any order\n        System.out.println(\"P(x) = \" + str(p));\n        p = insert(p, 4, 2);                          // like term: 2x^2 + 4x^2\n        System.out.println(\"after adding 4x^2: \" + str(p));\n        int n = 0; for (Node t = p; t != null; t = t.next) n++;\n        System.out.println(\"nodes used = \" + n + \" (a dense array would need \" + (p.e + 1) + \" cells)\");\n    }\n}\n", "out": "P(x) = 3x^4 + 2x^2 + x - 5\nafter adding 4x^2: 3x^4 + 6x^2 + x - 5\nnodes used = 4 (a dense array would need 5 cells)", "cpp": {"f": "main.cpp", "c": "#include <iostream>\n#include <string>\n#include <cstdlib>\nusing namespace std;\nstruct Node { int c, e; Node* next; Node(int c, int e) : c(c), e(e), next(nullptr) {} };\nNode* insert(Node* h, int c, int e) {        // keeps exponents in decreasing order, combines like terms\n    if (c == 0) return h;\n    if (!h || e > h->e) { Node* n = new Node(c, e); n->next = h; return n; }\n    if (h->e == e) { h->c += c; return h->c == 0 ? h->next : h; }\n    Node* p = h;\n    while (p->next && p->next->e > e) p = p->next;\n    if (p->next && p->next->e == e) { p->next->c += c; if (p->next->c == 0) p->next = p->next->next; return h; }\n    Node* n = new Node(c, e); n->next = p->next; p->next = n;\n    return h;\n}\nstring str(Node* h) {\n    if (!h) return \"0\";\n    string s = \"\";\n    for (Node* p = h; p; p = p->next) {\n        int c = p->c, a = abs(c);\n        if (p == h) { if (c < 0) s += \"-\"; } else s += (c < 0 ? \" - \" : \" + \");\n        if (a != 1 || p->e == 0) s += to_string(a);\n        if (p->e == 1) s += \"x\"; else if (p->e > 1) s += \"x^\" + to_string(p->e);\n    }\n    return s;\n}\nint main() {\n    Node* p = nullptr;\n    p = insert(p, 2, 2); p = insert(p, 3, 4); p = insert(p, -5, 0); p = insert(p, 1, 1);   // any order\n    cout << \"P(x) = \" << str(p) << \"\\n\";\n    p = insert(p, 4, 2);                          // like term: 2x^2 + 4x^2\n    cout << \"after adding 4x^2: \" << str(p) << \"\\n\";\n    int n = 0; for (Node* t = p; t; t = t->next) n++;\n    cout << \"nodes used = \" << n << \" (a dense array would need \" << (p->e + 1) << \" cells)\\n\";\n}\n"}, "clang": {"f": "main.c", "c": "#include <stdio.h>\n#include <stdlib.h>\n\ntypedef struct Node { int c, e; struct Node *next; } Node;\nNode *mk(int c, int e) { Node *n = malloc(sizeof(Node)); n->c = c; n->e = e; n->next = NULL; return n; }\nNode *insert(Node *h, int c, int e) {        /* keeps exponents in decreasing order, combines like terms */\n    if (c == 0) return h;\n    if (!h || e > h->e) { Node *n = mk(c, e); n->next = h; return n; }\n    if (h->e == e) { h->c += c; return h->c == 0 ? h->next : h; }\n    Node *p = h;\n    while (p->next && p->next->e > e) p = p->next;\n    if (p->next && p->next->e == e) { p->next->c += c; if (p->next->c == 0) p->next = p->next->next; return h; }\n    Node *n = mk(c, e); n->next = p->next; p->next = n;\n    return h;\n}\nvoid str(Node *h) {\n    if (!h) { printf(\"0\"); return; }\n    for (Node *p = h; p; p = p->next) {\n        int c = p->c, a = abs(c);\n        if (p == h) { if (c < 0) printf(\"-\"); } else printf(c < 0 ? \" - \" : \" + \");\n        if (a != 1 || p->e == 0) printf(\"%d\", a);\n        if (p->e == 1) printf(\"x\"); else if (p->e > 1) printf(\"x^%d\", p->e);\n    }\n}\nint main() {\n    Node *p = NULL;\n    p = insert(p, 2, 2); p = insert(p, 3, 4); p = insert(p, -5, 0); p = insert(p, 1, 1);   /* any order */\n    printf(\"P(x) = \"); str(p); printf(\"\\n\");\n    p = insert(p, 4, 2);                          /* like term: 2x^2 + 4x^2 */\n    printf(\"after adding 4x^2: \"); str(p); printf(\"\\n\");\n    int n = 0; for (Node *t = p; t; t = t->next) n++;\n    printf(\"nodes used = %d (a dense array would need %d cells)\\n\", n, p->e + 1);\n    return 0;\n}\n"}}}, {"h": "Addition: algorithm", "p": ["Use two pointers a and b, one per polynomial, and build the result list at the tail."], "pts": ["If exp(a) > exp(b): copy term of a to the result, move a.", "If exp(a) < exp(b): copy term of b to the result, move rn r;\n}\nNode* multiply(Node* a, Node* b) {\n    Node* r = nullptr;\n    for (Node* p = a; p; p = p->next)\n        for (Node* q = b; q; q = q->next) r = insert(r, p->c * q->c, p->e + q->e);\n    return r;\n}\nint main() {\n    Node *p = nullptr, *q = nullptr;\n    p = insert(p, 1, 1); p = insert(p, 1, 0);          // x + 1\n    q = insert(q, 1, 1); q = insert(q, -1, 0);         // x - 1\n    cout << \"P = \" << str(p) << \",  Q = \" << str(q) << \"\\n\";\n    cout << \"P * Q = \" << str(multiply(p, q)) << \"\\n\";\n    Node* s = multiply(multiply(p, p), p);\n    cout << \"(x+1)^3 = \" << str(s) << \"\\n\";\n    cout << \"(x+1)^3 at x = 2 is \" << eval(s, 2) << \"\\n\";\n}\n"}, "clang": {"f": "main.c", "c": "#include <stdio.h>\n#include <stdlib.h>\n\ntypedef struct Node { int c, e; struct Node *next; } Node;\nNode *mk(int c, int e) { Node *n = malloc(sizeof(Node)); n->c = c; n->e = e; n->next = NULL; return n; }\nNode *insert(Node *h, int c, int e) {        /* keeps exponents in decreasing order, combines like terms */\n    if (c == 0) return h;\n    if (!h || e > h->e) { Node *n = mk(c, e); n->next = h; return n; }\n    if (h->e == e) { h->c += c; return h->c == 0 ? h->next : h; }\n    Node *p = h;\n    while (p->next && p->next->e > e) p = p->next;\n    if (p->next && p->next->e == e) { p->next->c += c; if (p->next->c == 0) p->next = p->next->next; return h; }\n    Node *n = mk(c, e); n->next = p->next; p->next = n;\n    return h;\n}\nvoid str(Node *h) {\n    if (!h) { printf(\"0\"); return; }\n    for (Node *p = h; p; p = p->next) {\n        int c = p->c, a = abs(c);\n        if (p == h) { if (c < 0) printf(\"-\"); } else printf(c < 0 ? \" - \" : \" + \");\n        if (a != 1 || p->e == 0) printf(\"%d\", a);\n        if (p->e == 1) printf(\"x\"); else if (p->e > 1) printf(\"x^%d\", p->e);\n    }\n}\nlong long eval(Node *h, int x) {\n    long long r = 0;\n    for (Node *p = h; p; p = p->next) { long long pw = 1; for (int i = 0; i < p->e; i++) pw *= x; r += p->c * pw; }\n    return r;\n}\nNode *multiply(Node *a, Node *b) {\n    Node *r = NULL;\n    for (Node *p = a; p; p = p->next)\n        for (Node *q = b; q; q = q->next) r = insert(r, p->c * q->c, p->e + q->e);\n    return r;\n}\nint main() {\n    Node *p = NULL, *q = NULL;\n    p = insert(p, 1, 1); p = insert(p, 1, 0);          /* x + 1 */\n    q = insert(q, 1, 1); q = insert(q, -1, 0);         /* x - 1 */\n    printf(\"P = \"); str(p); printf(\",  Q = \"); str(q); printf(\"\\n\");\n    printf(\"P * Q = \"); str(multiply(p, q)); printf(\"\\n\");\n    Node *s = multiply(multiply(p, p), p);\n    printf(\"(x+1)^3 = \"); str(s); printf(\"\\n\");\n    printf(\"(x+1)^3 at x = 2 is %lld\\n\", eval(s, 2));\n    return 0;\n}\n"}}}, {"h": "Time and space complexity", "p": ["Addition walks both lists once and each step advances at least one pointer, so with m and n terms it takes at most m + n steps: O(m + n) time. The result list can have up to m + n nodes, so O(m + n) space. Best case is when the exponents are completely different (just copying): still m + n; there is no shortcut because every term must be copied.", "Multiplication does m * n term products. Each product is inserted into a sorted result list of up to m*n terms, so a simple insert makes it O(m * n * (m * n)) in the worst case; with a smarter merge per row it becomes O(m * n * (m + n)). Evaluation of one polynomial with n terms costs O(n * d) if powers are recomputed (d = highest exponent), or O(n) if powers are built incrementally."], "tip": "Exam: \"Addition is like merging two sorted lists, so O(m + n)\". Mention that zero-sum terms are dropped.", "table": {"head": ["Operation", "Time", "Space"], "rows": [["Create (insert n terms in sorted order)", "O(n^2) worst; O(n) if given sorted", "O(n)"], ["Display", "O(n)", "O(1)"], ["Add (m and n terms)", "O(m + n)", "O(m + n)"], ["Multiply (simple insert)", "O(m*n) products, each insert up to O(m*n)", "O(m*n)"], ["Evaluate at x", "O(n) with incremental powers", "O(1)"]]}}], "analogy": "A shopping bill lists only the items you actually bought, each with a quantity. To add two bills you walk down both lists together: same item means add quantities, different items are copied as they are.", "hinglish": "Bhai polynomial ko linked list mein aise rakhte hain ki har term ek node ho, jisme coefficient, exponent aur next ho. Exponent ke ghatte order mein sort rakhte hain. Do polynomials add karne ke liye dono list ek saath chalate hain: exponent barabar to coefficient jodo, warna bada exponent wala term copy karo. Ye merge jaisa hai.", "mistakes": ["Storing zero-coefficient terms.", "Forgetting to copy the leftover terms after the loop.", "Not combining like terms in multiplication.", "Keeping the list unsorted, which breaks the merge-style addition."], "remember": ["Polynomial term = (coefficient, exponent).", "Node: coef, exp, next.", "Keep terms in decreasing order of exponent.", "Store only non-zero terms: efficient for sparse polynomials.", "Addition compares exponents, like merge of two sorted lists.", "Equal exponents: add coefficients, drop the term if the sum is 0.", "Copy the remaining terms when one list is finished.", "Addition: O(m + n) time, O(m + n) space.", "Multiplication: coefficients multiply, exponents add, then combine like terms.", "Array representation wastes space for sparse polynomials like 5x^100 + 1."], "uses": ["Symbolic algebra and computer algebra systems", "Sparse polynomials in scientific computing", "Cryptography and coding theory (polynomial arithmetic)", "Teaching example of linked list merge"], "pros": ["Saves space for sparse polynomials", "Easy to insert or remove terms", "No fixed maximum degree"], "cons": ["Extra memory for the exponent and the link per term", "Evaluating or finding a term by exponent needs a traversal", "Pointer handling is more complex than arrays"], "def": "A polynomial such as 5x^100 + 3x + 7 has only 3 non-zero terms. An array indexed by exponent would need 101 cells, mostly zero. A linked list stores only the terms that exist."}};
const ELI5 = {"u3-t1": {"story": "Socho ek treasure hunt hai. Tumhe sirf pehli chit (head) di gayi hai. Us chit par ek gift likha hai aur ye bhi likha hai ki agli chit kahan chhupi hai. Tum ek ek karke chit follow karte ho jab tak 'end' na mile. Chits poore ghar me alag alag jagah rakhi hain, ek line me nahi.", "items": [["🧩", "Node", "Ek chit jisme gift (data) aur agli chit ka pata (next) dono hote hain."], ["🏁", "Head", "Pehli chit jo tumhare haath me hai. Ye kho gayi to poora hunt khatam."], ["💾", "Memory representation", "Chits alag alag kamron me hain, bas pata (address) unhe jodta hai."], ["🎩", "Header node", "Ek khaali pehli chit jo sirf batati hai 'yahan se shuru karo', aur shayad chits ki ginti bhi."], ["🚶", "Traversal", "Pehli chit se shuru karke har chit padhte jao jab tak 'end' na aa jaye."], ["🔍", "Search", "Har chit kholkar dekho tumhara gift mila ya nahi. Shortcut nahi, ek ek karke."]], "line": "Linked list = data + next pointer; head kho diya to list kho di."}, "u3-t2": {"story": "Socho ek train hai jisme dibbe ek doosre se hooks se jude hain. Naya dibba beech me lagana ho to pehle naye dibbe ko aage wale dibbe se jodo, phir peeche wale ko naye dibbe se. Dibba hatana ho to uske peeche aur aage wale dibbe ko seedha jod do. Koi dibba khiskana nahi padta, sirf hooks badalte hain.", "items": [["⏫", "Insert at beginning", "Engine ke aage ek naya dibba laga do aur use naya engine bana do. Bas ek hook ka kaam, to O(1)."], ["⏬", "Insert at end", "Train ke aakhri dibbe tak chalke jaana padta hai, phir wahan naya dibba jodo. Chalna padta hai isliye O(n)."], ["➕", "Insert after a node", "Pehle naya dibba aage wale se jodo, phir peeche wale se. Ulta kiya to aage ki poori train kho jayegi."], ["⏪", "Delete first", "Pehla dibba hatao aur engine doosre dibbe ko bana do. Bahut fast."], ["⏩", "Delete last", "Aakhri se pehle wale dibbe tak jaao aur uska hook kaat do, isliye walk karna padta hai."], ["✂️", "Delete given node", "Us dibbe ka peeche wala aur aage wala dibba seedha jod do, beech wala bypass ho jata hai."]], "line": "Pehle aage jodo, phir peeche jodo; delete me previous pointer zaroor rakho."}, "u3-t3": {"story": "Ek canteen me plates ka dher hai. Nayi plate sabse upar rakhte ho aur plate bhi upar se hi uthate ho. Ye stack hai. Dusri taraf chai ki line hai: naya banda line ke peeche lagta hai aur jo sabse aage hai wo pehle chai leke jaata hai. Ye queue hai. Linked list me ye dono bina size ki limit ke ban jaate hain.", "items": [["📚", "Linked stack", "Plates ka dher: top par hi plate rakho aur top se hi uthao. List ka head hi top hai."], ["⬆️", "Push", "Nayi plate upar rakhi, bas top pointer badal gaya. Ek step ka kaam."], ["⬇️", "Pop", "Upar wali plate uthayi, top neeche wali plate par aa gaya."], ["🚶", "Linked queue", "Chai ki line: front pe pehla banda, rear pe aakhri banda."], ["➕", "Enqueue", "Naya banda line ke aakhir me lagta hai. Rear pointer pata hai kahan hai, to line me chalna nahi padta."], ["➖", "Dequeue", "Sabse aage wala banda chai leke chala gaya. Agar line khaali ho gayi to rear bhi khaali karo."]], "line": "Stack: head se hi push-pop. Queue: rear se enqueue, front se dequeue."}, "u4-t2": {"story": "Socho class ki line banani hai height ke hisaab se. Selection me tum sabse chhote bachche ko dhoondh ke line ke aage bhej dete ho. Bubble me padosi bachche apni height compare karke jagah badalte hain. Insertion me tum ek-ek naya bachcha lete ho aur pehle se bani line me sahi jagah pe ghusa dete ho.", "items": [["🎯", "Selection sort", "Cricket team me sabse tez bowler ko pehle chuno, phir baaki me se agla tez. Har baar minimum chun ke aage rakho."], ["🫧", "Bubble sort", "Paani me bubble upar uthta hai. Yaha sabse bada number ek-ek swap karke end tak pahunch jata hai."], ["🃏", "Insertion sort", "Taash ke patte hath me lete ho aur naya patta sahi jagah pe slide karte ho. Wahi insertion sort hai."], ["🔁", "Pass", "Poori list pe ek round. Har pass me kam se kam ek element apni final jagah pe pahunchta hai."], ["⚖️", "Stable", "Do same marks wale students ka original order bana rahe to sort stable hai."], ["🚩", "Swapped flag", "Agar ek pura round me koi swap nahi hua to list sorted hai, ruk jao."]], "line": "Teeno O(n^2): selection = pick min, bubble = swap neighbours, insertion = insert in sorted part."}, "u4-t3": {"story": "Socho mela me ek line hai aur tumhe sabko height ke hisaab se lagana hai. Tum ek bande ko pakadte ho (pivot). Jo usse chhote hain wo ek side, jo bade hain dusri side. Ab wo bandaa apni sahi jagah pe hai. Dono side ke logon ke saath yehi game phir khelte ho.", "items": [["📌", "Pivot", "Reference banda jiske hisaab se baaki ko chhota ya bada bolte hain."], ["✂️", "Partition", "Pivot ke left me chhote, right me bade, ek hi pass me. Jaise cricket team me batsmen ek side, bowlers dusri side."], ["🔁", "Recursion", "Left group aur right group pe wahi kaam dobara, jab tak group me 1 banda na bache."], ["🎲", "Random pivot", "Pivot random lo taaki koi jaan-bujh ke tumhe worst case na de sake."], ["🐢", "Worst case", "Agar pivot hamesha sabse chhota mila to har baar sirf ek banda kam hota hai, to O(n^2)."], ["🏠", "In-place", "Alag array nahi banate, usi array me adla-badli karte hain."]], "line": "Pivot chuno, partition karo, left-right pe recursion: average O(n log n), worst O(n^2), unstable."}, "u4-t4": {"story": "Socho do dost apne-apne cards ke dher ko sort kar chuke hain. Ab tumhe dono ko mila ke ek sorted dher banana hai. Tum dono ke upar wale card dekhte ho aur chhota wala utha ke nayi pile me rakh dete ho. Merge sort bhi yahi karta hai, bas pehle bade dher ko baar-baar aadha karta hai.", "items": [["✂️", "Divide", "Bade kaam ko aadha-aadha todte jao jab tak ek-ek element na bache. Ek element to already sorted hai."], ["🔗", "Merge", "Do sorted lines ko ek line me jodna: dono ke aage wale ko dekho, jo chhota hai pehle jaye."], ["📚", "Extra space", "Merge karte time alag jagah chahiye, jaise do piles ko mila ke nayi table pe rakhna."], ["⚖️", "Stable", "Barabar roll no. aaye to left wala pehle rakho, isse original order bana rehta hai."], ["📈", "n log n", "Log n levels, har level pe n kaam. Isliye har case me same speed."], ["💽", "External sort", "Bahut badi file RAM me nahi aati, to tukdo me sort karke merge karte hain."]], "line": "Todo, sort karo, jodo: hamesha O(n log n), extra O(n) space, stable."}, "u1-t1": {"story": "Socho tumhari school ki attendance copy hai. Copy poori ek file hai, har student ki row ek record hai, aur us row ka naam, roll number alag-alag data items hain. Copy ka layout, jaise sorted by roll number, ek data structure hai. Aur agar teacher bole 'bas attendance lagana aur dekhna', 'kaise' tumhari marzi, wo ADT hai.", "items": [["📦", "Data / data item", "Data matlab raw facts, jaise '25'. Data item uska sabse chhota piece, jaise tumhari age."], ["🗂️", "Record & file", "Ek student ki saari details ek record. Poori class ke records milke file."], ["🧱", "Primitive", "Sabse basic dabba, ek hi value rakhta hai, jaise ek chhoti steel ki katori."], ["🚆", "Linear", "Train ke dabbe, ek ke baad ek. Aage-peeche hi jaa sakte ho."], ["🌳", "Non-linear", "Family tree ya Metro map, ek se kai jagah jaa sakte ho."], ["📏", "Static vs dynamic", "Static: fixed tiffin box. Dynamic: rubber bag jo saaman ke hisaab se bada ho jaye."], ["🎭", "ADT", "ATM ka button panel: tum bas 'withdraw' dabate ho, andar kaise hota hai pata nahi."]], "line": "Data item -> record -> file; ADT batata hai kya, data structure batata hai kaise."}, "u1-t2": {"story": "Socho tumhari almari me kitaabein rakhi hain. Sab kitaabon ko ek-ek karke dekhna traversal hai. Beech me nayi kitaab ghusana hai to baaki ko thoda khisakna padta hai, wo insertion. Kitaab nikaalne pe jagah bharne ke liye phir khisakna, wo deletion.", "items": [["🚶", "Traversal", "Class ki attendance leni ho to har student ka naam ek baar bolte ho. Sabko ek baar visit karna."], ["➕", "Insertion", "Cinema ki line me dost beech me ghusa to uske peeche sab ek step peeche khiske."], ["➖", "Deletion", "Line se koi nikal gaya to peeche wale ek step aage aa gaye."], ["🔍", "Searching", "Linear: har kitaab dekho. Binary: dictionary beech se kholo, phir aadhe me jao."], ["📊", "Sorting", "Cards ko chhote se bade order me lagana."], ["🔗", "Merging", "Do sorted line ko ek line me jodna, jo chhota hai wo pehle."]], "line": "Array me insert/delete = shifting = O(n); search ke liye sorted ho to binary use karo."}, "u1-t3": {"story": "Chai banane ka tarika yaad karo: paani ubalo, patti daalo, doodh daalo, chhan lo. Ye steps clear hain aur khatam hote hain, to ye ek algorithm hai. Ab 2 log ki chai alag, 200 log ki chai alag: time aur bartan kitne lagenge ye hi analysis hai.", "items": [["📜", "Algorithm", "Recipe jaisa: pehle kya, phir kya, aur kab khatam. Language koi bhi ho."], ["✅", "Properties", "Input do, output lo, step saaf ho, aur ruk jaye. Warna wo algorithm nahi."], ["✏️", "Pseudocode / flowchart", "Pseudocode = rough likhna, flowchart = arrows wali drawing jaise Metro route."], ["⏱️", "Time analysis", "Kitne steps lage, jaise 10 roti banani ho to 10 baar belna."], ["🧳", "Space analysis", "Kitni extra jagah chahiye, jaise extra bartan kitne le liye."], ["🎯", "Best / avg / worst", "Dost ko dhoondhna: pehli row me mila (best), beech me (avg), aakhri me ya mila hi nahi (worst)."]], "line": "Algorithm = finite clear steps; analysis = steps and memory as n grows; worst case is the safe answer."}, "u1-t4": {"story": "Do cyclists race karte hain: ek ke paas 10 minute ka head start hai, doosre ki speed zyada hai. Chhoti doori pe head start wala jeetega, par bahut lambi doori pe tez speed wala hi jeetega. Asymptotic notation bhi lambi doori (bada n) dekhta hai, head start jaise constants ko ignore karta hai.", "items": [["📈", "Big-O", "Upar ki seema: 'isse zyada slow nahi hoga'. Jaise bus bole 'late ho gayi to bhi 2 ghante se zyada nahi'."], ["📉", "Omega", "Neeche ki seema: 'isse kam time nahi lagega'. Kam se kam itna to lagega."], ["🎯", "Theta", "Dono seema barabar: time bilkul isi order ka hai. Exact range."], ["🔹", "Little-o", "Strictly chhota: 'n, n^2 se strictly slow badhta hai'."], ["🚀", "Growth rates", "Paani ki boond (1), seedhi (n), pahaad chadhna (n^2), aur bomb blast (2^n)."], ["🔁", "Loops", "Ek loop = n. Loop ke andar loop = n x n. Aadha karte jao = log n."]], "line": "Constants aur chhote terms hatao, sabse bada term bachao: 3n+2 ko O(n) bolo."}, "u1-t5": {"story": "Exam ke liye tumne formulas ki chhoti chit-chart bana li. Chart banane me kagaz (space) lagta hai, par exam me har baar formula yaad nahi karna padta (time bachta hai). Agar chart nahi banate to har baar formula sochna padta hai, kagaz bachta hai par time lagta hai.", "items": [["📋", "Lookup table", "Pahaadon (tables) ki list yaad rakhna: har baar multiply nahi karna, seedha dekh lo."], ["📝", "Memoization", "Ek baar jawab nikala to copy me likh liya, dobara wahi sawal aaye to copy se dekh lo."], ["🗜️", "Compression", "Kapde vacuum bag me daale: jagah kam, par kholne me time lagta hai."], ["🔄", "Recompute", "Notes nahi banaye, har baar book se padhte ho: jagah bachi, time gaya."], ["🧭", "Choosing", "Bag chhota hai to compress karo; time kam hai to table banao."]], "line": "Zyada memory = kam time, kam memory = zyada time. Zaroorat dekh ke chuno."}, "u2-t1": {"story": "Socho tumhare paas tiffin ke dabbe ek ke upar ek rakhe hain. Naya dabba hamesha upar rakhte ho aur dabba bhi upar se hi uthate ho. Beech se nikaloge to sab gir jayega! Stack bhi bilkul aisa hi hai.", "items": [["📥", "Push", "Naya dabba sabse upar rakhna. Array mein top badhao aur value likho."], ["📤", "Pop", "Sabse upar wala dabba uthana. Value return karo aur top ek kam karo."], ["👀", "Peek", "Upar wale dabbe mein bas jhaank ke dekhna, uthana nahi."], ["🕳️", "isEmpty", "Kya koi dabba bacha hai? top -1 hai to khali."], ["🚫", "Overflow", "Shelf full hai aur tum aur dabba rakhne ki koshish kar rahe ho. Error!"], ["⚠️", "Underflow", "Shelf khali hai aur tum dabba uthane gaye. Error!"]], "line": "Stack = last in, first out; sab kaam sirf top par."}, "u2-t2": {"story": "Maan lo tum canteen mein order likh rahe ho aur tumhe sabse pehle bhaari kaam (jaise * aur /) karna hai, halka kaam (+ aur -) baad mein. Halke kaam ko tum ek side tray (stack) mein rok ke rakhte ho jab tak bhaari kaam na ho jaye. Bracket ek chhota dibba hai: uske andar ka kaam pehle khatam hota hai.", "items": [["🔤", "Infix", "Jaise hum likhte hain: A+B. Operator beech mein."], ["➡️", "Postfix", "Operator end mein: AB+. Computer ek hi baar left se right padh ke solve kar leta hai."], ["⬅️", "Prefix", "Operator shuru mein: +AB. Bracket ki zarurat nahi."], ["🥇", "Precedence", "Multiplication ki priority addition se zyada, jaise pehle bhaari saaman gaadi mein rakhte ho."], ["🧺", "Stack in conversion", "Operator ko tray mein rakho, jab upar wala zyada ya barabar priority ka ho to use bahar nikaal do."], ["🪆", "Balanced brackets", "Jaise matryoshka dolls: jo last mein khola wahi pehle band hona chahiye."]], "line": "Operand seedha output, operator stack se, bracket ke andar ka pehle."}, "u2-t3": {"story": "Socho tum calculator pe pehle numbers likhte ho phir operator dabate ho. Postfix bhi aisa hi hai: pehle numbers aate hain, phir operator. Numbers ko tum ek stack (table pe rakhi chits) mein rakhte ho. Jab operator aata hai, upar ki do chits uthao, hisaab karo, aur nayi chit wapas rakh do.", "items": [["📥", "Operand aaya", "Number mila to seedha stack mein rakh do."], ["🔧", "Operator aaya", "Upar ke do number nikalo, operation karo, result wapas rakho."], ["↔️", "Order ka dhyan", "Pehla nikla hua right side wala hota hai. 5 3 - mein 5-3 = 2, 3-5 nahi."], ["🏁", "Final answer", "Sab symbols khatam hone par stack mein ek hi value bachti hai: wahi result."], ["🔄", "Prefix evaluation", "Right se left padho, aur pehla pop ab left operand hota hai."]], "line": "Number push karo, operator pe do pop karo, result push karo."}, "u2-t4": {"story": "Tum school canteen ki line mein khade ho. Jo bacha pehle aaya, usko samosa pehle milta hai. Naya bacha line ke end mein lagta hai. Line ke aage wale ko front bolte hain aur peeche wale ko rear.", "items": [["🧍", "Enqueue", "Naya bacha line ke peeche (rear) lag gaya."], ["🍽️", "Dequeue", "Sabse aage (front) wale ko samosa mila aur wo line se bahar."], ["👀", "Peek / Front", "Dekho abhi kaun sabse aage hai, bina hataye."], ["🚫", "Overflow", "Line ki jagah full, ab koi aur nahi aa sakta."], ["🪑", "Wasted space", "Aage ke bachche chale gaye par un ki jagah khali padi hai aur peeche se naya nahi ghus sakta. Yahi simple queue ki problem hai."]], "line": "Queue = pehle aao, pehle jao (FIFO)."}, "u2-t5": {"story": "Ek gol (round) dining table socho jisme 4 kursi hain. Jab 4th kursi bhar jaye, agla guest wapas kursi number 1 pe baithta hai agar wo khali ho gayi ho. Isse koi kursi waste nahi hoti. Circular queue ka array bhi aisa hi gol table hai.", "items": [["⭕", "Ring", "Array ke end ke baad wapas start aa jaata hai, jaise gol table."], ["➗", "Modulo (%)", "(i+1) % MAX se pointer last ke baad 0 pe aa jaata hai. Jaise ghadi mein 12 ke baad 1."], ["🫙", "Empty", "front == -1: koi kursi bhari nahi."], ["🈵", "Full", "(rear+1) % MAX == front: rear ke aage wali kursi pe front baitha hai, ab jagah nahi."], ["🔁", "Wrap-around", "Rear last index se 0 pe aa gaya aur khali jagah use kar li. Yahi magic hai."]], "line": "Circular queue = queue + ghadi ka chakkar (modulo)."}, "u2-t6": {"story": "Hospital ke emergency mein sab patient line mein hain, par jiska accident bada hai use doctor pehle dekhta hai, chahe wo baad mein aaya ho. Ye priority queue hai. Deque ek aisi line hai jisme tum dono taraf se andar aa sakte ho aur dono taraf se bahar ja sakte ho.", "items": [["🚑", "Priority queue", "Line mein jiski priority zyada, wo pehle serve hota hai."], ["⬆️", "Ascending", "Chhota number = zyada priority. 1 pehle, phir 2, phir 3."], ["⬇️", "Descending", "Bada number = zyada priority. Sabse bada pehle nikalta hai."], ["📋", "Array version", "Sab ko bina order ke likh lo, nikalte time sabse important dhundo (O(n))."], ["🔗", "Linked list version", "List ko order mein rakho, to sabse important hamesha head pe milega."], ["↔️", "Deque", "Dono sire khule hain, jaise ek chhoti gali jahan dono taraf se aana-jaana ho sakta hai."]], "line": "Priority queue = jiski priority zyada, wo pehle."}, "u5-t6": {"story": "Socho tum ek chhoti si dukaan chalate ho. Hisaab ke liye ek pyramid jaisa chart banate ho jisme upar operator aur neeche numbers hote hain. Jo samaan sabse zyada bikta hai uska naam chhota likhte ho, aur kam bikne wale ka lamba naam. Aur jo kaam sabse urgent hai wo hamesha list ke upar rakhte ho.", "items": [["🧮", "Expression tree", "Calculator ka chart: neeche numbers, upar + - * wale. Neeche se upar solve karte jao, answer mil jata hai."], ["🗜️", "Huffman coding", "Jo letter baar baar aata hai uska chhota code, jaise 'chai' ko 'ch' bolna. Message chhota ho jata hai."], ["⛰️", "Heap", "Line me sabse urgent patient hamesha sabse aage, jaise hospital emergency."], ["📚", "BST", "Dictionary jaisa: chhota word left, bada word right. Seedha sahi jagah pahunch jaate ho."], ["❓", "Decision tree", "20 questions game: har sawal ka haan/na aage ka rasta chunta hai."], ["📁", "File system", "Folder ke andar folder, aur sabse neeche files, bilkul ek ped ki tarah."]], "line": "Same tree, alag alag kaam: calculate, compress, prioritize, search, decide, store."}, "u5-t1": {"story": "Socho ek ghar ka family tree hai. Sabse upar dada ji hain (root), unke bete-betiyan unke children hain, aur jinke bache nahi hain wo leaf hain. Har bache ke sirf ek parent hote hain, isliye koi loop nahi banta.", "items": [["🌳", "Root", "Sabse upar wala node, jaise company ka CEO. Uska koi boss nahi."], ["🍃", "Leaf", "Jiske neeche koi nahi, jaise ped ka last patta."], ["👨‍👧", "Parent / Child", "Ek node ke neeche wale uske bache, jaise papa aur beta."], ["👫", "Siblings", "Ek hi parent ke bache, jaise do bhai-behen."], ["📏", "Height / Depth", "Depth = upar se is node tak kitni seedhi utarna padi, height = is node se sabse niche tak kitni seedhi."], ["🔺", "Perfect / Full / Skewed", "Perfect = poora bhara hua pyramid, full = har node ke 0 ya 2 bache, skewed = ek hi side lambi line."]], "line": "Tree = ek root, neeche bachhe, koi loop nahi."}, "u5-t2": {"story": "Socho ek school me class teacher (root) ke neeche do monitor hain, aur monitors ke neeche bache. Agar tum attendance lena chaho to kai tarike hain: pehle teacher ko, phir left wale ko, phir right wale ko. Ya fir floor by floor sabko ek line me.", "items": [["🧱", "Array representation", "Sab nodes ek line me rakh do, node i ke bache 2i aur 2i+1 par milte hain, jaise flat numbers."], ["🔗", "Linked representation", "Har node ke paas do hath hain: ek left bache ka address, ek right bache ka."], ["1️⃣", "Preorder", "Pehle boss ko salaam, phir left team, phir right team."], ["2️⃣", "Inorder", "Pehle left team, phir boss, phir right team. BST me sorted milta hai."], ["3️⃣", "Postorder", "Pehle dono teams ka kaam khatam, boss sabse last. Delete karne me kaam aata hai."], ["4️⃣", "Level order", "Building ki ek-ek floor pe jao, queue me log line se aate hain."]], "line": "Pre = root pehle, In = root beech me, Post = root last, Level = queue."}, "u5-t3": {"story": "Socho ek mela hai jisme har stall ke do raste hain, par kai stalls ke raste band hain. Threaded tree me in band raaston par ek arrow laga dete hain jo agla stall dikhata hai. Ab tumhe wapas map dekhne ki zarurat nahi, bas arrow follow karo.", "items": [["🕳️", "Null pointers", "Tree me n+1 raste khali padhe hain, jaise band gali."], ["🧵", "Thread", "Khali raste ko agle (inorder) node se jodne wala arrow."], ["➡️", "One-way threading", "Sirf aage ka arrow (successor), peeche nahi ja sakte."], ["↔️", "Two-way threading", "Aage aur peeche dono arrows, jaise do-tarfa road."], ["🚩", "Flag", "Ek chhota sa nishan jo batata hai ye arrow thread hai ya asli bacha."], ["🚶", "No-stack traversal", "Thread follow karte jao, stack ya recursion ki zarurat nahi."]], "line": "Null pointer ko arrow bana do, aur stack ki chhutti."}, "u4-t1": {"story": "Socho tumhare paas ek bada register hai jisme students ke naam likhe hain. Agar register random order me hai to tumhe pehle page se ek-ek naam padhna padega, yahi linear search hai. Agar register A se Z tak sorted hai, to tum beech ka page kholte ho, dekhte ho naam pehle aayega ya baad me, aur aadha register chhod dete ho. Yahi binary search hai.", "items": [["🔎", "Searching", "Kisi cheez ko collection me dhundhna, jaise bag me chaabi dhundhna. Mil gayi to jagah batao, nahi mili to -1."], ["➡️", "Linear search", "Line me khade logon se ek-ek karke poochna 'tum Rahul ho?'. Kaam karta hai chahe line kaisi bhi ho, par slow hai."], ["✂️", "Binary search", "Dictionary me beech ka page kholna aur aadha hissa hata dena. Bahut fast, par dictionary sorted honi chahiye."], ["📏", "Sorted condition", "Agar kitaab ke pages mix-up hain to beech ka page dekhkar kuch decide nahi kar sakte. Isliye sorted zaroori hai."], ["🪆", "Recursive vs iterative", "Same kaam, ek loop se (iterative) ya khud ko dubara bulakar (recursive). Recursive me extra stack lagta hai."], ["⏱️", "Complexity", "10 lakh naam me linear me 10 lakh tak check, binary me sirf 20 ke aas-paas."]], "line": "Unsorted? Linear search. Sorted? Binary search, aadha data har baar gayab."}, "u4-t6": {"story": "Socho tumhare paas cricket cards ka ek bada dher hai aur tumhe unhe sahi order me lagana hai. Kabhi tum ek-ek card utha ke sahi jagah daalte ho, kabhi dher ko do hisson me baant ke alag alag sort karke jod dete ho. Har tarika alag speed aur jagah leta hai.", "items": [["📊", "Time complexity", "Kitne steps lagenge. Chhote dher me koi bhi tarika chalega, bade dher me tez tarika chahiye."], ["🧱", "Stable", "Agar do cards ki value same hai, to jo pehle aaya wo pehle hi rahe. Jaise same marks wale students ka naam order na bigde."], ["🏠", "In-place", "Sorting apni hi table pe ho, doosri table nahi chahiye. Quick sort aisa hai, merge sort ko extra table chahiye."], ["🌊", "Adaptive", "Agar cards pehle se lagbhag sorted hain to kaam jaldi ho jaye, jaise insertion sort me."], ["💾", "External sort", "Dher itna bada ki table pe aata hi nahi, to chhote hisse sort karke disk se jodte hain."]], "line": "Chhota ya almost sorted: insertion. Stable aur safe: merge. Fast aur kam memory: quick."}, "u4-t7": {"story": "Socho ek hostel me 7 lockers hain aur har student ko roll number se locker milta hai: roll number ko 7 se divide karo aur jo bacha wo locker number. Agar do students ka locker same aaye to ya to ek locker me dono ka saaman list me rakho, ya agla khali locker dhundo.", "items": [["🔢", "Hash function", "Roll number se locker number nikaalne ka formula, jaise roll mod 7."], ["💥", "Collision", "Do students ko same locker mil gaya. Ab koi rule chahiye."], ["⛓️", "Chaining", "Ek locker me ek dabba-list rakh do, usme sabka saaman line se. Jagah kabhi khatam nahi."], ["➡️", "Linear probing", "Locker bhara hai to agla locker dekho, phir uske agla, jab tak khali na mile."], ["🦘", "Quadratic probing", "Agla, phir 4 aage, phir 9 aage jump karo taaki sab ek jagah na jam jaye."], ["🔑", "Double hashing", "Jump ka size bhi student ke roll number se decide hota hai, isliye sab alag raste pe jaate hain."], ["📈", "Load factor", "Kitne lockers bhar gaye. Zyada bhar gaye to bada hostel (resize) banao."]], "line": "Key se seedha index, collision pe chaining ya probing, load factor kam rakho."}, "u5-t4": {"story": "Socho tum dictionary me ek word dhundh rahe ho. Beech ka page kholte ho, word chhota hai to left ke pages, bada hai to right ke pages. Har baar aadhe pages chhod dete ho. BST bhi isi tarah kaam karta hai.", "items": [["📏", "BST rule", "Left me chhoti keys, right me badi keys, har node pe yahi rule."], ["🔍", "Search", "Root se shuru, chhota to left, bada to right, jab tak mil na jaye."], ["➕", "Insert", "Search karte karte jahan khali jagah mile, wahan naya leaf laga do."], ["🍃", "Delete leaf", "Bina bacche wala node seedha hata do, koi dikkat nahi."], ["👶", "Delete one child", "Node hatao aur uske bacche ko uski jagah laga do."], ["👨‍👩‍👧", "Delete two children", "Right side ka sabse chhota (successor) uski jagah rakho, phir wo successor hata do."], ["📶", "Inorder", "Left, node, right ke order me padho, sab sorted nikalta hai."]], "line": "Left chhota, right bada; search aadha-aadha; inorder = sorted."}, "u5-t5": {"story": "Socho ek see-saw (jhoola) hai jisme ek taraf bachche zyada ho gaye aur wo neeche jhuk gaya. Tum beech wale bachche ko upar le aate ho aur dono taraf barabar kar dete ho. AVL tree me yahi rotation hota hai.", "items": [["⚖️", "Balance factor", "Left ki height minus right ki height. -1, 0, +1 tak theek hai."], ["↘️", "LL rotation", "Sab left me line me lag gaye, to ek baar right rotate karo."], ["↙️", "RR rotation", "Sab right me line me lag gaye, to ek baar left rotate karo."], ["↪️", "LR rotation", "Left me jhuke par bend hai, pehle child ko left rotate, phir upar wale ko right rotate."], ["↩️", "RL rotation", "Right me jhuke par bend hai, pehle child ko right rotate, phir upar wale ko left rotate."], ["➕", "Insert", "Pehle normal BST jaisa daalo, phir upar jaate hue balance check karo."]], "line": "BF -1,0,+1 rakho; line me ho to single rotation, bend ho to double rotation."}, "u3-t4": {"story": "Socho ek train hai jisme har dabba aage wale aur peeche wale dabbe se juda hai. Tum engine se guard tak ja sakte ho aur wapas bhi aa sakte ho. Agar beech ka ek dabba hatana hai to bas uske aage-peeche wale dabbe ko aapas me jod do. Yahi doubly linked list hai.", "items": [["🚂", "Node", "Ek dabba: usme saman (data) hai aur do hook, ek aage ka (next) aur ek peeche ka (prev)."], ["↔️", "Traversal", "Engine se chalo to next follow karo, guard van se chalo to prev follow karo. Dono taraf ja sakte ho."], ["➕", "Insertion", "Do dabbon ke beech naya dabba lagana ho to naye dabbe ke dono hook jodo aur purane dono dabbon ke hook bhi badlo."], ["➖", "Deletion", "Beech ka dabba nikalna hai to uske aage aur peeche wale dabbe ko seedha jod do. Dabba ko khud pata hai kaun kaun juda hai, isliye O(1)."], ["🔁", "Reverse", "Har dabbe ke aage-peeche wale hook ki adla-badli kar do, aur engine-guard ki jagah bhi badal do."]], "line": "Do pointers = dono taraf chalo, delete fast, par memory zyada."}, "u3-t5": {"story": "Socho bachhe gol ghera banake baithe hain aur ek ball paas kar rahe hain. Last bachhe ke baad ball wapas pehle bachhe ke paas aa jaati hai. Koi 'line ka end' hota hi nahi. Circular linked list bhi aisi hi hai, last node ka haath first node ko pakda hota hai.", "items": [["⭕", "Circular singly", "Sab ek hi direction me ball dete hain. Last wala first ko deta hai."], ["🔁", "Circular doubly", "Har bachha dono taraf ke bachhe ko pakde hai. Clockwise aur anticlockwise dono me ball ghuma sakte ho."], ["🚶", "Traverse", "Jahan se shuru kiya wahin wapas aao to ruk jao. Warna ghumte hi rahoge, infinite loop."], ["➕", "Insert", "Naya bachha circle me ghusana hai to bas do bachhon ke beech haath jodo. Last ka pointer rakhne se begin aur end dono jagah turant ghus jata hai."], ["➖", "Delete", "Bachha nikla to uske dono taraf wale bachhe aapas me haath pakad lete hain. Agar wo last tha to 'last' naya banao."], ["🎯", "Round robin", "CPU har process ko thoda time deta hai aur agle ko ghuma deta hai, bilkul gol-gol baari baari."]], "line": "Last ka next = first. Rukna ho to head par wapas aane par ruko, null par nahi."}, "u4-t5": {"story": "Socho ek cricket tournament jisme har round me sabse strong team upar aa jaati hai. Champion ko nikaal ke final list me sabse last position par rakh do. Phir baaki teams dobara fight karti hain aur naya champion upar aata hai. Ye tab tak karo jab tak sab teams list me na aa jayein. Yahi heap sort hai.", "items": [["🏔️", "Max-heap", "Ek pyramid jisme har boss apne dono juniors se bada hota hai. Sabse bada upar baithta hai."], ["🏗️", "Build heap", "Neeche se upar jaao, har boss ko check karo. Agar koi junior bada ho to jagah badal lo. Ye kaam fast hai, O(n)."], ["⬇️", "Heapify", "Naya raja upar baitha par kamzor hai? Use neeche bhejo jab tak wo apne juniors se bada na ho jaye."], ["🔁", "Sort step", "Raja ko last position par bhej do (wo final hai), baaki pyramid chhota karo aur phir se ek raja chuno."], ["⏱️", "Time", "n elements ko nikalna aur har baar log n kaam, to O(n log n), kisi bhi input par."]], "line": "Build max-heap, root ko end se swap karo, heapify karo, repeat."}, "u5-t7": {"story": "Socho ek bahut badi library hai jisme 1 crore books hain. Agar librarian ek-ek shelf check kare to din nikal jayega. Isliye library me bade bade index boards lage hain, har board par 500 entries hain: 'A-C idhar, D-F udhar'. Do-teen board dekhte hi tumhari book mil jaati hai. B-tree bilkul yahi index board system hai.", "items": [["🏢", "Fat node", "Ek node me bahut keys, jaise ek index board par 500 entries. Isse tree patla aur chhota (kam height) ho jata hai."], ["🔍", "Search", "Board par dekho tumhari key kis range me aati hai, phir us range ke next board par jao. Last tak 3-4 boards hi dekhne padte hain."], ["✂️", "Split (insert)", "Board full ho gaya to usko do boards me tod do aur beech wali entry upar ke board par laga do. Jaise class ka bench full hone par do bench bana dena."], ["🤝", "Merge / borrow (delete)", "Board bahut khali ho gaya to padosi board se entry udhaar lo, ya dono board mila do."], ["🔗", "B+ linked leaves", "Asli books sirf last wale boards (leaves) par hain aur wo ek chain me jude hain. 'D se H tak saari books' chahiye? Ek jagah se shuru karo aur chain pe chalte jao."]], "line": "B-tree = fat nodes + sab leaves same level = kam disk reads; B+ = data sirf leaves me, leaves linked."}, "u6-t1": {"story": "Socho tumhare class ke dost hain aur tum unhe 'dosti' ki line se jodte ho. Har dost ek gol (vertex) hai aur har dosti ek line (edge). Agar Instagram jaisa 'follow' ho to line ek taraf jaati hai (directed), aur Facebook jaisi friendship dono taraf (undirected). Is poore network ko computer me do tarike se likh sakte ho: ek bada table ya har dost ke saamne uske doston ki list.", "items": [["⚪", "Vertex aur Edge", "Vertex = ek banda ya shehar, edge = unke beech ka rishta ya road."], ["➡️", "Directed / Undirected", "Instagram follow ek taraf ka hai (directed). WhatsApp contact dono taraf ka dost hai (undirected)."], ["💰", "Weighted", "Road ke upar likha distance ya toll, yaani edge ki keemat."], ["🔢", "Degree", "Kitne dost hain ek bande ke? Wahi uski degree hai."], ["🔁", "Cycle", "Ghar se nikle, ghoom ke wapas ghar aa gaye bina same road repeat kiye, wo cycle hai."], ["📊", "Adjacency matrix", "Class ka bada attendance-jaisa table: row aur column me naam, 1 matlab dost. Jagah zyada lagti hai."], ["📋", "Adjacency list", "Har bande ke saamne sirf uske doston ke naam. Jagah bachti hai."]], "line": "Graph = vertices + edges; matrix = table (V x V), list = har vertex ke neighbours."}, "u6-t2": {"story": "Socho tumne ek rumour start kiya apne ek dost ko bata kar. Wo apne sab doston ko batata hai, phir un sab ke dost apne doston ko. Pehle sabse paas wale log sunte hain, phir door wale. Jo pehle bataya gaya, wo pehle aage bataega, yaani line (queue) me pehle aao pehle jao. Yahi BFS hai.", "items": [["🚶", "Queue (line)", "Canteen ki line jaisi: jo pehle aaya wo pehle jayega. BFS me vertices isi order me process hote hain."], ["✅", "Visited array", "Jisko rumour pehle hi pata hai usko dobara mat batao. Warna gol-gol ghoomte rahoge."], ["🌊", "Levels", "Pehle 1 step door wale dost, phir 2 step door wale. Pond ki ripples jaise."], ["📏", "Shortest path", "Rumour sabse kam logon ke through jis dost tak pahucha, wahi sabse chhota raasta hai (unweighted graph me)."], ["🧩", "Disconnected graph", "Agar koi dost group alag hai to ek baar me nahi pahunchega. Har bache hue vertex se BFS dobara chalao."]], "line": "BFS = queue + visited, level by level, shortest path in unweighted graph, O(V+E)."}, "u6-t3": {"story": "Socho tum ek maze me ho aur tumhare paas dhaaga hai. Tum ek raste pe seedha chalte jaate ho jab tak dead end na aa jaye. Dead end aaya to dhaage ke sahare piche aate ho, aur pichhle chauraahe se doosra raasta lete ho. Ye backtracking hai, aur DFS wahi karta hai.", "items": [["🏃", "Go deep", "Ek hi raste pe aage badhte jao jab tak naya unvisited vertex mile."], ["↩️", "Backtrack", "Dead end par piche aao aur pichhle junction ka doosra raasta lo."], ["📚", "Stack / recursion", "Kitabon ka dher: jo sabse upar rakhi wahi pehle uthti hai. Recursion me ye stack computer khud banata hai."], ["🔄", "Cycle detection", "Chalte chalte aise vertex pe pahunche jo pehle hi dekha hua hai (aur jisse aaye wo nahi), matlab gol ghoom gaye: cycle mil gaya."], ["🧩", "Connected components", "Har baar jab naya unvisited vertex mile aur DFS chalao, to ek naya group (component) mila."]], "line": "DFS = stack/recursion, deep first then backtrack, O(V+E)."}, "u1-t6": {"story": "Socho ek hostel ka corridor hai jisme saare rooms barabar size ke hain aur 1 se shuru hote hain. Pehle room ka address pata hai aur room ki chaudai bhi, to room number 7 kahan hai ye seedha hisaab se nikal lete ho, har darwaza kholna nahi padta. Record matlab ek room ke andar alag-alag cheezein: bed, almari, table.", "items": [["🧱", "Array", "Same type ke items ek line mein, jaise train ke dibbe. Index se seedha dibba mil jaata hai."], ["📐", "1D formula", "Base + w * (k - LB): pehle dibbe se k dibbe aage chalo, har dibba w bytes ka."], ["🔲", "Row-major", "Class register jaise: pehle ek row poori likho, phir doosri row."], ["🔳", "Column-major", "Pehle ek column poora, phir agla column. Formula mein dimension ulti lagti hai."], ["🗃️", "Record", "Student ka form: naam, roll, marks ek hi form mein."]], "line": "Array ka address = Base + w * (kitne items chhode)."}, "u1-t7": {"story": "Matryoshka gudiya jaisa socho: badi gudiya kholo to andar chhoti gudiya, usse kholo to usse bhi chhoti, jab tak sabse chhoti na mile jo khulti hi nahi. Wo sabse chhoti gudiya base case hai. Phir tum ek-ek karke sabko wapas band karte jaate ho, wahi return hota hai.", "items": [["🔁", "Recursion", "Function khud ko chhote kaam ke liye bulata hai, jaise gudiya ke andar gudiya."], ["🛑", "Base case", "Jahan ruk jana hai, warna infinite loop ban jayega."], ["❗", "Factorial", "5! = 5 x 4!. 4! ka kaam kisi aur call ko do, wo aage doosre ko."], ["🐚", "Fibonacci", "Har number pichle do ka sum. Do-do calls hoti hain isliye bahut slow badhta hai."], ["🗼", "Tower of Hanoi", "Pehle upar ke n-1 disk side peg par, bada disk target par, phir n-1 us par. Moves 2^n - 1."]], "line": "Recursion = chhota problem + base case + stack mein frames."}, "u1-t8": {"story": "Maan lo tumhe class ke n bacchon ko ek-ek chocolate dena hai. Ek-ek ko dena n kaam hai. Agar har bacche ko baaki sab bacchon se haath milana hai, to n x n kaam. Agar tum har baar line aadhi karte jao (pehle 16, phir 8, phir 4) to sirf kuch hi kadam lagenge, wo log n hai.", "items": [["🔂", "Single loop", "n baar chalta hai to O(n), jaise n bacchon ko chocolate dena."], ["🔳", "Nested loop", "Loop ke andar loop: n x n. Sabko sabse milana."], ["✂️", "Log loop", "i ko double ya half karte raho to bahut jaldi khatam, log n steps."], ["🔄", "Recurrence", "Recursion ka kharcha T(n) likho aur expand karo, jaise ladder ke steps gino."], ["🧮", "Drop constants", "3n^2 + 5n ko bhi n^2 hi bolte hain, kyunki bade n par wahi important hai."]], "line": "Loop gino: add, multiply, ya halve; phir chhota hissa hata do."}, "u2-t7": {"story": "Plates ka dher socho: sabse upar wali plate pehle uthti hai (stack). Ab tumhe pehli rakhi hui plate pehle chahiye (queue). To saari plates doosre dher par palat do, ab sabse purani plate upar aa gayi. Bas ye palatna hi extra kaam hai.", "items": [["📥", "In stack", "Naye items yahin daalo, ye sirf likhne ke liye hai."], ["📤", "Out stack", "Yahin se nikalo; khaali ho to in ka saara maal palat do."], ["🔁", "Transfer", "Ek stack se doosre mein daalne par order ulta ho jaata hai, isliye FIFO mil jaata hai."], ["🧺", "Stack from queues", "Naya item front par laane ke liye purane items ko line ke peeche bhej do."], ["⚖️", "Amortised", "Har item sirf ek baar shift hota hai, to average kharcha chhota hi rehta hai."]], "line": "Ek bar palto to LIFO se FIFO, aur queue mein ghumao to FIFO se LIFO."}, "u3-t6": {"story": "Reverse karna matlab train ke dibbon ke hook ulta jodna. Pehle agle dibbe ka pata yaad rakho (nxt), phir hook peeche wale dibbe se jodo. Middle ke liye do dost daudte hain, ek normal, ek double speed. Jab tez wala end par pahunche to dheere wala beech mein hota hai. Agar track gol hai to tez wala dheere wale se aa milta hai.", "items": [["🔃", "Reverse", "nxt save, link ulta, prev aur cur aage. Teen pointer ka khel."], ["🎯", "Middle", "Slow ek step, fast do step. Fast khatam to slow beech mein."], ["♻️", "Cycle detect", "Gol track par tez wala aakhir mein dheere wale se mil jaata hai."], ["📍", "Cycle start", "Meeting point se aur head se ek-ek step chalo, jahan milein wahi cycle ki shuruaat."], ["🔚", "Nth from end", "Aage wala n step pehle chalo, phir dono saath. Aage wala khatam to peeche wala sahi jagah."]], "line": "Do pointer, alag speed ya alag gap, ek hi pass."}, "u3-t7": {"story": "Do dukaan ke bill socho jisme sirf wahi items likhe hain jo kharide gaye, saath mein quantity. Dono bill jodne hain: same item ho to quantity jodo, alag item ho to jaise hai waise likh do. Agar quantity 0 ho jaye to us item ko likhna hi nahi. Polynomial addition bhi aisa hi hai.", "items": [["🧩", "Term node", "Har term ek dabba: coefficient, exponent aur agle dabbe ka link."], ["📉", "Decreasing order", "Bade exponent pehle, taaki dono list ek saath chal sakein."], ["➕", "Addition", "Exponent barabar to coefficient jodo, warna bada exponent wala copy karo."], ["0️⃣", "Zero term", "4x^2 - 4x^2 = 0, to ye term result mein aata hi nahi."], ["✖️", "Multiply", "Har term ko har term se: coefficient guna, exponent jod, phir same exponent wale jodo."]], "line": "Polynomial add = do sorted lists ka merge."}};
