e address of A[i][j] in row-major and column-major order.", ""], ["medium", "A[-3..4][2..6] is stored in row-major order, Base = 1200, w = 2. Find LOC(A[1][5]).", ""], ["hard", "Write a program to store 5 student records (roll, marks), print the address formula of every field and the highest marks.", ""]], "u1-t7": [["easy", "Write a recursive function for n! and trace it for n = 4.", ""], ["easy", "Print the first 8 Fibonacci numbers using recursion. How many calls does fib(6) make?", ""], ["medium", "Solve Tower of Hanoi for 3 disks and list all 7 moves. Derive that 2^n - 1 moves are needed.", ""], ["hard", "Write the recurrence for naive Fibonacci and show why it is exponential. Give two ways to make it O(n).", ""]], "u1-t8": [["easy", "Find the time complexity: for (i = 1; i <= n; i *= 3) { x++; }", ""], ["easy", "Find the Big-O of two separate loops, the first to n and the second to n*n.", ""], ["medium", "Find the complexity of: for (i = 0; i < n; i++) for (j = i; j < n; j++) print(i, j); Show the sum.", ""], ["hard", "Solve T(n) = 2T(n/2) + n by expansion and also T(n) = T(n-1) + n. Compare the answers.", ""]], "u2-t7": [["easy", "Show with a diagram how two stacks implement enqueue 1, 2, 3 and one dequeue.", ""], ["easy", "Why is the transfer done only when the output stack is empty?", ""], ["medium", "Implement a stack using two queues with a costly pop instead of a costly push. Give the complexity.", ""], ["hard", "Prove that dequeue in the two-stack queue is amortised O(1) (count moves per item).", ""]], "u3-t6": [["easy", "Reverse the list 5 -> 10 -> 15 -> 20 by hand using prev, cur, nxt and show each step.", ""], ["easy", "Find the middle of a list with 7 nodes and with 8 nodes using slow and fast pointers.", ""], ["medium", "Explain why slow and fast pointers must meet if a loop exists. Find the node where the loop starts.", ""], ["hard", "Write a function to remove the Nth node from the end in one pass.", ""]], "u3-t7": [["easy", "Represent 7x^5 - 3x^ const LESSONS = {"u3-t1": {"tldr": "A linked list stores items in nodes (data + next link) scattered in memory; HEAD points to the first node and the last node's link is null.", "sections": [{"h": "What is a linked list?", "p": ["Why do we need it? An array needs a fixed, contiguous block, and inserting or deleting in the middle shifts many elements. In a linked list we only change a few links, and the list can grow or shrink at run time (dynamic memory)."], "pts": ["Linear and dynamic data structure", "Size is not fixed; memory is taken node by node", "No wasted shifting during insert/delete", "Access is sequential only (no a[i])"], "viz": {"type": "chain", "items": ["HEAD", "10", "20", "30", "null"], "labels": ["", "next", "next", "next"], "caption": "Singly linked list with 3 nodes"}}, {"h": "Node structure: INFO and LINK", "p": ["A node of a singly linked list has two parts. The INFO (data) part stores the value. The LINK (next) part stores the address of the next node. The last node has null in its LINK part to show the end of the list.", "The pointer variable HEAD (also called START or FIRST) stores the address of the first node. If HEAD = null, the list is empty. We must never lose HEAD, otherwise the whole list is lost."], "tip": "In Java, Node next is a reference, so it plays the role of the pointer. In C you would write struct Node *next.", "code": {"f": "Main.java", "c": "public class Main {\n    static class Node {\n        int data;      // INFO part\n        Node next;     // LINK part (address of next node)\n        Node(int d) { data = d; next = null; }\n    }\n    public static void main(String[] args) {\n        Node head = new Node(10);          // first node\n        head.next = new Node(20);          // second node\n        head.next.next = new Node(30);     // third node\n        Node p = head;\n        while (p != null) {\n            System.out.print(p.data + \" -> \");\n            p = p.next;\n        }\n        System.out.println(\"null\");\n    }\n}", "out": "10 -> 20 -> 30 -> null", "cpp": {"f": "main.cpp", "c": "#include <iostream>\nusing namespace std;\n\nstruct Node {\n    int data;      // INFO part\n    Node* next;    // LINK part (address of next node)\n    Node(int d) : data(d), next(nullptr) {}\n};\nint main() {\n    Node* head = new Node(10);          // first node\n    head->next = new Node(20);          // second node\n    head->next->next = new Node(30);    // third node\n    Node* p = head;\n    while (p != nullptr) {\n        cout << p->data << \" -> \";\n        p = p->next;\n    }\n    cout << \"null\\n\";\n    while (head) { Node* t = head; head = head->next; delete t; }   // free\n    return 0;\n}\n"}, "clang": {"f": "main.c", "c": "#include <stdio.h>\n#include <stdlib.h>\n\nstruct Node {\n    int data;           /* INFO part */\n    struct Node *next;  /* LINK part (address of next node) */\n};\nstruct Node *mk(int d) { struct Node *n = malloc(sizeof *n); n->data = d; n->next = NULL; return n; }\n\nint main() {\n    struct Node *head = mk(10);          /* first node */\n    head->next = mk(20);                 /* second node */\n    head->next->next = mk(30);           /* third node */\n    struct Node *p = head;\n    while (p != NULL) {\n        printf(\"%d -> \", p->data);\n        p = p->next;\n    }\n    printf(\"null\\n\");\n    while (head) { struct Node *t = head; head = head->next; free(t); }   /* free */\n    return 0;\n}\n"}}, "table": {"head": ["One Node"], "rows": [["INFO: data (e.g. 20)"], ["LINK: next (address of next node)"]]}}, {"h": "Memory representation", "p": ["Nodes of a list can sit anywhere in memory. Suppose the list 10, 20, 30 is stored at addresses 200, 520 and 340. Each node's LINK holds the address of its successor, and HEAD holds 200. The last link is null (0).", "In textbooks this is also shown with two parallel arrays INFO[] and LINK[], plus START and a list AVAIL of free nodes. Positions in the array act like addresses."], "pts": ["START/HEAD = 200 -> first node", "Follow LINK: 200 -> 520 -> 340 -> null", "AVAIL list keeps the free (unused) nodes for new insertions", "Memory is allocated per node, so no big contiguous block is needed"], "table": {"head": ["Address", "INFO", "LINK"], "rows": [["200 (HEAD)", "10", "520"], ["520", "20", "340"], ["340", "30", "null"]]}}, {"h": "Header node idea", "p": ["A header node (or dummy node) is a special first node that does not store real data. HEAD always points to it, so HEAD is never null, even for an empty list. The real elements start from header.next.", "A header node can also store useful information, such as the number of nodes. Its benefit is that insertion and deletion at the front need no special case, because every real node now has a predecessor."], "tip": "A header list: empty list is header.next == null. A plain list: empty list is head == null.", "code": {"f": "Main.java", "c": "public class Main {\n    static class Node {\n        int data; Node next;\n        Node(int d) { data = d; }\n    }\n    public static void main(String[] args) {\n        Node header = new Node(0);             // header node: data field holds the COUNT\n        Node a = new Node(11), b = new Node(22), c = new Node(33);\n        header.next = a; a.next = b; b.next = c;\n        header.data = 3;                       // number of real nodes\n        System.out.println(\"Nodes stored: \" + header.data);\n        for (Node p = header.next; p != null; p = p.next)   // start AFTER header\n            System.out.print(p.data + \" \");\n        System.out.println();\n        Node empty = new Node(0);              // empty list = header only\n        System.out.println(\"Empty? \" + (empty.next == null));\n    }\n}", "out": "Nodes stored: 3\n11 22 33 \nEmpty? true", "cpp": {"f": "main.cpp", "c": "#include <iostream>\nusing namespace std;\n\nstruct Node {\n    int data; Node* next;\n    Node(int d) : data(d), next(nullptr) {}\n};\nint main() {\n    Node* header = new Node(0);            // header node: data field holds the COUNT\n    Node *a = new Node(11), *b = new Node(22), *c = new Node(33);\n    header->next = a; a->next = b; b->next = c;\n    header->data = 3;                      // number of real nodes\n    cout << \"Nodes stored: \" << header->data << \"\\n\";\n    for (Node* p = header->next; p != nullptr; p = p->next)   // start AFTER header\n        cout << p->data << \" \";\n    cout << \"\\n\";\n    Node* empty = new Node(0);             // empty list = header only\n    cout << \"Empty? \" << (empty->next == nullptr ? \"true\" : \"false\") << \"\\n\";\n    delete header; delete a; delete b; delete c; delete empty;\n    return 0;\n}\n"}, "clang": {"f": "main.c", "c": "#include <stdio.h>\n#include <stdlib.h>\n\ntypedef struct Node { int data; struct Node *next; } Node;\nNode *mk(int d) { Node *n = malloc(sizeof(Node)); n->data = d; n->next = NULL; return n; }\n\nint main() {\n    Node *header = mk(0);                  /* header node: data field holds the COUNT */\n    Node *a = mk(11), *b = mk(22), *c = mk(33);\n    header->next = a; a->next = b; b->next = c;\n    header->data = 3;                      /* number of real nodes */\n    printf(\"Nodes stored: %d\\n\", header->data);\n    for (Node *p = header->next; p != NULL; p = p->next)   /* start AFTER header */\n        printf(\"%d \", p->data);\n    printf(\"\\n\");\n    Node *empty = mk(0);                   /* empty list = header only */\n    printf(\"Empty? %s\\n\", empty->next == NULL ? \"true\" : \"false\");\n    free(header); free(a); free(b); free(c); free(empty);\n    return 0;\n}\n"}}, "viz": {"type": "chain", "items": ["HEADER (count=3)", "11", "22", "33", "null"], "labels": ["next", "next", "next", "next"], "caption": "List with a header node"}}, {"h": "Traversing a linked list", "p": ["Traversing means visiting every node exactly once, from the first to the last. We use a temporary pointer PTR so that HEAD is not changed.", "Algorithm TRAVERSE(HEAD):"], "pts": ["Dry run on 5 -> 8 -> 2 -> 9: PTR=5 print, PTR=8 print, PTR=2 print, PTR=9 print, PTR=null stop", "Same loop gives count of nodes, sum of data, maximum, etc.", "Time O(n), extra space O(1)"], "warn": "Never do head = head.next while traversing. You will lose the start of the list. Use a copy pointer.", "code": {"f": "Main.java", "c": "public class Main {\n    static class Node {\n        int data; Node next;\n        Node(int d) { data = d; }\n    }\n    static void display(Node head) {\n        Node ptr = head;                 // step 1: ptr = HEAD\n        while (ptr != null) {            // step 2: repeat till NULL\n            System.out.print(ptr.data + \" \");\n            ptr = ptr.next;              // move to next node\n        }\n        System.out.println();\n    }\n    static int count(Node head) {\n        int n = 0;\n        for (Node p = head; p != null; p = p.next) n++;\n        return n;\n    }\n    static int sum(Node head) {\n        int s = 0;\n        for (Node p = head; p != null; p = p.next) s += p.data;\n        return s;\n    }\n    public static void main(String[] args) {\n        Node head = new Node(5);\n        head.next = new Node(8);\n        head.next.next = new Node(2);\n        head.next.next.next = new Node(9);\n        display(head);\n        System.out.println(\"Count = \" + count(head));\n        System.out.println(\"Sum   = \" + sum(head));\n    }\n}", "out": "5 8 2 9 \nCount = 4\nSum   = 24", "cpp": {"f": "main.cpp", "c": "#include <iostream>\nusing namespace std;\n\nstruct Node {\n    int data; Node* next;\n    Node(int d) : data(d), next(nullptr) {}\n};\nvoid display(Node* head) {\n    Node* ptr = head;                // step 1: ptr = HEAD\n    while (ptr != nullptr) {         // step 2: repeat till NULL\n        cout << ptr->data << \" \";\n        ptr = ptr->next;             // move to next node\n    }\n    cout << \"\\n\";\n}\nint count(Node* head) {\n    int n = 0;\n    for (Node* p = head; p != nullptr; p = p->next) n++;\n    return n;\n}\nint sum(Node* head) {\n    int s = 0;\n    for (Node* p = head; p != nullptr; p = p->next) s += p->data;\n    return s;\n}\nint main() {\n    Node* head = new Node(5);\n    head->next = new Node(8);\n    head->next->next = new Node(2);\n    head->next->next->next = new Node(9);\n    display(head);\n    cout << \"Count = \" << count(head) << \"\\n\";\n    cout << \"Sum   = \" << sum(head) << \"\\n\";\n    while (head) { Node* t = head; head = head->next; delete t; }   // free\n    return 0;\n}\n"}, "clang": {"f": "main.c", "c": "#include <stdio.h>\n#include <stdlib.h>\n\ntypedef struct Node { int data; struct Node *next; } Node;\nNode *mk(int d) { Node *n = malloc(sizeof(Node)); n->data = d; n->next = NULL; return n; }\n\nvoid display(Node *head) {\n    Node *ptr = head;                /* step 1: ptr = HEAD */\n    while (ptr != NULL) {            /* step 2: repeat till NULL */\n        printf(\"%d \", ptr->data);\n        ptr = ptr->next;             /* move to next node */\n    }\n    printf(\"\\n\");\n}\nint count(Node *head) {\n    int n = 0;\n    for (Node *p = head; p != NULL; p = p->next) n++;\n    return n;\n}\nint sum(Node *head) {\n    int s = 0;\n    for (Node *p = head; p != NULL; p = p->next) s += p->data;\n    return s;\n}\nint main() {\n    Node *head = mk(5);\n    head->next = mk(8);\n    head->next->next = mk(2);\n    head->next->next->next = mk(9);\n    display(head);\n    printf(\"Count = %d\\n\", count(head));\n    printf(\"Sum   = %d\\n\", sum(head));\n    while (head) { Node *t = head; head = head->next; free(t); }   /* free */\n    return 0;\n}\n"}}, "table": {"head": ["Step", "What happens"], "rows": [["1. Set PTR = HEAD", "start at the first node"], ["2. Repeat while PTR != NULL", "stop when list ends"], ["3. Process PTR.INFO", "print / count / add"], ["4. Set PTR = PTR.LINK", "move to next node"], ["5. Exit", "all nodes visited"]]}}, {"h": "Searching in a linked list", "p": ["Searching is linear search. Start from the first node, compare each INFO with the key, and stop when it matches or when PTR becomes null. A linked list has no random access, so binary search is not possible even if the list is sorted.", "Algorithm SEARCH(HEAD, KEY): 1) PTR = HEAD, POS = 1. 2) While PTR != NULL: if PTR.INFO == KEY then return POS; else PTR = PTR.LINK and POS = POS + 1. 3) Return -1 (not found)."], "pts": ["Trace for list 7 -> 3 -> 9 -> 4, KEY = 9: 7 != 9, 3 != 9, 9 == 9 found at position 3", "Trace for KEY = 6: all four nodes fail, PTR = null, answer -1", "Best case O(1) (key at head), worst and average O(n)", "For a sorted list we can stop early when PTR.INFO > KEY"], "code": {"f": "Main.java", "c": "public class Main {\n    static class Node {\n        int data; Node next;\n        Node(int d) { data = d; }\n    }\n    // returns position (1-based) of key, or -1 if absent\n    static int search(Node head, int key) {\n        Node ptr = head;\n        int pos = 1;\n        while (ptr != null) {\n            if (ptr.data == key) return pos;\n            ptr = ptr.next;\n            pos++;\n        }\n        return -1;\n    }\n    public static void main(String[] args) {\n        Node head = new Node(7);\n        head.next = new Node(3);\n        head.next.next = new Node(9);\n        head.next.next.next = new Node(4);\n        System.out.println(\"Search 9 -> position \" + search(head, 9));\n        System.out.println(\"Search 4 -> position \" + search(head, 4));\n        System.out.println(\"Search 6 -> position \" + search(head, 6));\n    }\n}", "out": "Search 9 -> position 3\nSearch 4 -> position 4\nSearch 6 -> position -1", "cpp": {"f": "main.cpp", "c": "#include <iostream>\nusing namespace std;\n\nstruct Node {\n    int data; Node* next;\n    Node(int d) : data(d), next(nullptr) {}\n};\n// returns position (1-based) of key, or -1 if absent\nint search(Node* head, int key) {\n    Node* ptr = head;\n    int pos = 1;\n    while (ptr != nullptr) {\n        if (ptr->data == key) return pos;\n        ptr = ptr->next;\n        pos++;\n    }\n    return -1;\n}\nint main() {\n    Node* head = new Node(7);\n    head->next = new Node(3);\n    head->next->next = new Node(9);\n    head->next->next->next = new Node(4);\n    cout << \"Search 9 -> position \" << search(head, 9) << \"\\n\";\n    cout << \"Search 4 -> position \" << search(head, 4) << \"\\n\";\n    cout << \"Search 6 -> position \" << search(head, 6) << \"\\n\";\n    while (head) { Node* t = head; head = head->next; delete t; }   // free\n    return 0;\n}\n"}, "clang": {"f": "main.c", "c": "#include <stdio.h>\n#include <stdlib.h>\n\ntypedef struct Node { int data; struct Node *next; } Node;\nNode *mk(int d) { Node *n = malloc(sizeof(Node)); n->data = d; n->next = NULL; return n; }\n\n/* returns position (1-based) of key, or -1 if absent */\nint search(Node *head, int key) {\n    Node *ptr = head;\n    int pos = 1;\n    while (ptr != NULL) {\n        if (ptr->data == key) return pos;\n        ptr = ptr->next;\n        pos++;\n    }\n    return -1;\n}\nint main() {\n    Node *head = mk(7);\n    head->next = mk(3);\n    head->next->next = mk(9);\n    head->next->next->next = mk(4);\n    printf(\"Search 9 -> position %d\\n\", search(head, 9));\n    printf(\"Search 4 -> position %d\\n\", search(head, 4));\n    printf(\"Search 6 -> position %d\\n\", search(head, 6));\n    while (head) { Node *t = head; head = head->next; free(t); }   /* free */\n    return 0;\n}\n"}}}, {"h": "Complexity and array comparison", "p": ["Space complexity of a linked list of n nodes is O(n) (data plus n pointers). Traversal and search need only O(1) extra space because we use one temporary pointer."], "pts": ["Linked list wins when there are many insertions/deletions", "Array wins when we need fast access by index", "Linked list does not waste memory in unused slots, but each node pays for a pointer"], "table": {"head": ["Operation", "Linked list (time)", "Array (time)"], "rows": [["Access i-th element", "O(n)", "O(1)"], ["Traverse", "O(n)", "O(n)"], ["Search (unsorted)", "O(n)", "O(n)"], ["Insert / delete at front", "O(1)", "O(n)"], ["Extra space per element", "one pointer", "none"], ["Size", "dynamic", "fixed"]]}}], "analogy": "Think of a treasure hunt. Each clue slip (node) has the prize/info and a note saying where the next slip is hidden. You hold only the first slip (head) and must follow the notes one by one. The last slip says 'end'.", "hinglish": "Bhai linked list matlab nodes ki chain. Har node me data hota hai aur next node ka address. Humare paas sirf head hota hai (pehle node ka address), baaki sab next se follow karte jaate hain jab tak null na mile. Array jaisa index se direct jump nahi kar sakte, isliye traversal aur search dono O(n) hain.", "mistakes": ["Moving HEAD itself while traversing and losing the list.", "Forgetting the null check: ptr.next on a null pointer gives NullPointerException.", "Saying binary search works on a sorted linked list (it does not give O(log n)).", "Writing while (ptr.next != null) when you also want to process the last node."], "remember": ["Linked list: linear collection of nodes joined by links; dynamic size.", "Node = INFO (data) + LINK (next pointer). Last node's LINK = NULL.", "HEAD/START points to the first node; HEAD = NULL means empty list.", "Nodes need not be contiguous in memory; AVAIL list holds free nodes.", "Header node = dummy first node (may store count); HEAD never null.", "Traversal: PTR = HEAD; while PTR != NULL { process; PTR = PTR.LINK } -> O(n).", "Search: linear only; binary search impossible (no random access).", "Search time: best O(1), worst/average O(n); space O(1).", "No random access: reaching i-th node costs O(i).", "Each node needs extra memory for the pointer.", "Insert/delete need no shifting, only pointer changes.", "Never move HEAD during traversal; use a temporary pointer."], "uses": ["Dynamic memory allocation and free lists in operating systems", "Base for stacks, queues, hash-table chaining and graph adjacency lists", "Polynomial representation and sparse matrices", "Music playlists, image viewers (next/previous)"], "pros": ["Dynamic size, grows and shrinks at run time", "Insertion and deletion need no shifting", "No memory wasted by unused capacity"], "cons": ["No random access; i-th element takes O(i)", "Extra memory for the pointer in every node", "Poor cache behaviour; pointer errors are easy to make"], "def": "A linked list is a linear data structure in which elements, called nodes, are stored at different places in memory and are connected by pointers (links). The order of elements is given by the links, not by the memory positions."}, "u3-t2": {"tldr": "Insert or delete in a singly linked list by changing only a few links: at the beginning, at the end, or after/at a given node.", "sections": [{"h": "Overview: how insertion and deletion work", "p": ["Overflow happens when no free node is available (AVAIL = NULL) while inserting. Underflow happens when we try to delete from an empty list (HEAD = NULL). Always check these first."], "table": {"head": ["Operation", "Where", "Pointers changed"], "rows": [["Insert", "Beginning", "NEW.next, HEAD"], ["Insert", "End", "last.next"], ["Insert", "After node / at position", "NEW.next, PTR.next"], ["Delete", "First", "HEAD"], ["Delete", "Last", "second-last.next"], ["Delete", "Given node", "prev.next"]]}}, {"h": "Insert at the beginning", "p": ["Create a new node, make its next point to the current first node, then move HEAD to the new node. It works for an empty list too, because NEW.next becomes null.", "Algorithm INSERT_BEGIN(HEAD, X): 1) If no free node, overflow. 2) NEW = new node, NEW.INFO = X. 3) NEW.LINK = HEAD. 4) HEAD = NEW."], "pts": ["Before: HEAD -> 20 -> 30 -> null", "Step 3: NEW(10).next = 20", "Step 4: HEAD = NEW(10)", "After: HEAD -> 10 -> 20 -> 30 -> null", "Time O(1), space O(1)"], "code": {"f": "Main.java", "c": "public class Main {\n    static class Node {\n        int data; Node next;\n        Node(int d) { data = d; }\n    }\n    static void show(Node h) {\n        for (Node p = h; p != null; p = p.next) System.out.print(p.data + \" -> \");\n        System.out.println(\"null\");\n    }\n    static Node build(int... a) {\n        Node h = null, t = null;\n        for (int x : a) { Node n = new Node(x); if (h == null) h = t = n; else { t.next = n; t = n; } }\n        return h;\n    }\n    static Node insertBegin(Node head, int x) {\n        Node n = new Node(x);   // 1. create node\n        n.next = head;          // 2. NEW.next = HEAD\n        head = n;               // 3. HEAD = NEW\n        return head;\n    }\n    public static void main(String[] args) {\n        Node head = build(20, 30);\n        head = insertBegin(head, 10);\n        show(head);\n        head = insertBegin(null, 5);   // empty list also works\n        show(head);\n    }\n}", "out": "10 -> 20 -> 30 -> null\n5 -> null", "cpp": {"f": "main.cpp", "c": "#include <iostream>\n#include <initializer_list>\nusing namespace std;\n\nstruct Node {\n    int data; Node* next;\n    Node(int d) : data(d), next(nullptr) {}\n};\nvoid show(Node* h) {\n    for (Node* p = h; p != nullptr; p = p->next) cout << p->data << \" -> \";\n    cout << \"null\\n\";\n}\nNode* build(initializer_list<int> a) {\n    Node *h = nullptr, *t = nullptr;\n    for (int x : a) { Node* n = new Node(x); if (h == nullptr) h = t = n; else { t->next = n; t = n; } }\n    return h;\n}\nNode* insertBegin(Node* head, int x) {\n    Node* n = new Node(x);  // 1. create node\n    n->next = head;         // 2. NEW.next = HEAD\n    head = n;               // 3. HEAD = NEW\n    return head;\n}\nint main() {\n    Node* head = build({20, 30});\n    head = insertBegin(head, 10);\n    show(head);\n    head = insertBegin(nullptr, 5);   // empty list also works\n    show(head);\n    return 0;\n}\n"}, "clang": {"f": "main.c", "c": "#include <stdio.h>\n#include <stdlib.h>\n\ntypedef struct Node { int data; struct Node *next; } Node;\nNode *mk(int d) { Node *n = malloc(sizeof(Node)); n->data = d; n->next = NULL; return n; }\n\nvoid show(Node *h) {\n    for (Node *p = h; p != NULL; p = p->next) printf(\"%d -> \", p->data);\n    printf(\"null\\n\");\n}\nNode *build(int a[], int n) {\n    Node *h = NULL, *t = NULL;\n    for (int i = 0; i < n; i++) { Node *x = mk(a[i]); if (h == NULL) h = t = x; else { t->next = x; t = x; } }\n    return h;\n}\nNode *insertBegin(Node *head, int x) {\n    Node *n = mk(x);        /* 1. create node */\n    n->next = head;         /* 2. NEW.next = HEAD */\n    head = n;               /* 3. HEAD = NEW */\n    return head;\n}\nint main() {\n    int a[] = {20, 30};\n    Node *head = build(a, 2);\n    head = insertBegin(head, 10);\n    show(head);\n    head = insertBegin(NULL, 5);   /* empty list also works */\n    show(head);\n    return 0;\n}\n"}}, "viz": {"type": "chain", "items": ["NEW(10)", "20", "30", "null"], "labels": ["next = HEAD", "next", "next"], "caption": "After step 3: NEW points to old first node; then HEAD = NEW"}}, {"h": "Insert at the end", "p": ["We must reach the last node, the one whose next is null, and attach the new node there. If the list is empty, the new node simply becomes HEAD.", "Algorithm INSERT_END(HEAD, X): 1) NEW = new node, INFO = X, LINK = NULL. 2) If HEAD = NULL then HEAD = NEW and exit. 3) PTR = HEAD. 4) While PTR.LINK != NULL: PTR = PTR.LINK. 5) PTR.LINK = NEW."], "pts": ["Trace on 10 -> 20, insert 30: PTR=10 (next is 20, move), PTR=20 (next is null, stop)", "20.next = NEW(30). List: 10 -> 20 -> 30", "Time O(n) for the walk; O(1) if we keep a TAIL pointer", "Space O(1)"], "tip": "If you keep a tail pointer, insertion at the end becomes O(1). This is how a linked queue works.", "code": {"f": "Main.java", "c": "public class Main {\n    static class Node {\n        int data; Node next;\n        Node(int d) { data = d; }\n    }\n    static void show(Node h) {\n        for (Node p = h; p != null; p = p.next) System.out.print(p.data + \" -> \");\n        System.out.println(\ urn head; }\n        prev.next = cur.next;                            // bypass cur\n        return head;\n    }\n    public static void main(String[] args) {\n        Node head = build(10, 20, 30, 40);\n        head = deleteKey(head, 30);\n        show(head);\n        head = deleteKey(head, 10);\n        show(head);\n        head = deleteKey(head, 40);\n        show(head);\n        head = deleteKey(head, 77);\n    }\n}", "out": "10 -> 20 -> 40 -> null\n20 -> 40 -> null\n20 -> null\n77 not found", "cpp": {"f": "main.cpp", "c": "#include <iostream>\n#include <initializer_list>\nusing namespace std;\n\nstruct Node {\n    int data; Node* next;\n    Node(int d) : data(d), next(nullptr) {}\n};\nvoid show(Node* h) {\n    for (Node* p = h; p != nullptr; p = p->next) cout << p->data << \" -> \";\n    cout << \"null\\n\";\n}\nNode* build(initializer_list<int> a) {\n    Node *h = nullptr, *t = nullptr;\n    for (int x : a) { Node* n = new Node(x); if (h == nullptr) h = t = n; else { t->next = n; t = n; } }\n    return h;\n}\nNode* deleteKey(Node* head, int key) {\n    if (head == nullptr) return nullptr;\n    if (head->data == key) { Node* t = head->next; delete head; return t; }   // first node\n    Node *prev = head, *cur = head->next;\n    while (cur != nullptr && cur->data != key) { prev = cur; cur = cur->next; }\n    if (cur == nullptr) { cout << key << \" not found\\n\"; return head; }\n    prev->next = cur->next;                          // bypass cur\n    delete cur;\n    return head;\n}\nint main() {\n    Node* head = build({10, 20, 30, 40});\n    head = deleteKey(head, 30);\n    show(head);\n    head = deleteKey(head, 10);\n    show(head);\n    head = deleteKey(head, 40);\n    show(head);\n    head = deleteKey(head, 77);\n    return 0;\n}\n"}, "clang": {"f": "main.c", "c": "#include <stdio.h>\n#include <stdlib.h>\n\ntypedef struct Node { int data; struct Node *next; } Node;\nNode *mk(int d) { Node *n = malloc(sizeof(Node)); n->data = d; n->next = NULL; return n; }\nvoid show(Node *h) {\n    for (Node *p = h; p != NULL; p = p->next) printf(\"%d -> \", p->data);\n    printf(\"null\\n\");\n}\nNode *build(int a[], int n) {\n    Node *h = NULL, *t = NULL;\n    for (int i = 0; i < n; i++) { Node *x = mk(a[i]); if (h == NULL) h = t = x; else { t->next = x; t = x; } }\n    return h;\n}\nNode *deleteKey(Node *head, int key) {\n    if (head == NULL) return NULL;\n    if (head->data == key) { Node *t = head->next; free(head); return t; }   /* first node */\n    Node *prev = head, *cur = head->next;\n    while (cur != NULL && cur->data != key) { prev = cur; cur = cur->next; }\n    if (cur == NULL) { printf(\"%d not found\\n\", key); return head; }\n    prev->next = cur->next;                          /* bypass cur */\n    free(cur);\n    return head;\n}\nint main() {\n    int a[] = {10, 20, 30, 40};\n    Node *head = build(a, 4);\n    head = deleteKey(head, 30);\n    show(head);\n    head = deleteKey(head, 10);\n    show(head);\n    head = deleteKey(head, 40);\n    show(head);\n    head = deleteKey(head, 77);\n    return 0;\n}\n"}}, "viz": {"type": "chain", "items": ["10", "20", "30", "40", "null"], "labels": ["next", "skipped", "next", "next"], "caption": "Delete 30: 20.next jumps over 30 and points to 40"}}, {"h": "Complexity and comparison with arrays", "p": ["The pure pointer change is always O(1). The cost in a linked list comes from FINDING the position. In an array the cost comes from SHIFTING elements. So linked lists are better when the position is already known (front, or an existing pointer)."], "pts": ["Linked list: no shifting, no fixed capacity", "Array: no pointer overhead, direct access", "Deleting a given node when only its pointer is known is O(1) only in a doubly linked list"], "table": {"head": ["Operation", "Linked list", "Array"], "rows": [["Insert at beginning", "O(1)", "O(n) shift"], ["Insert at end", "O(n) (O(1) with tail)", "O(1) if space"], ["Insert at position k", "O(k) to reach + O(1) link", "O(n) shift"], ["Delete first", "O(1)", "O(n) shift"], ["Delete last", "O(n)", "O(1)"], ["Delete given node", "O(n) search + O(1) unlink", "O(n) shift"], ["Space", "O(1) extra per operation", "O(1)"]]}}], "analogy": "A train of coaches. To add a coach in the middle you unhook one coupling, attach the new coach, and hook it to the next. You never move the other coaches. Removing a coach is the same: just join the two neighbours.", "hinglish": "Bhai linked list me insert/delete ka matlab hai pointers ko sahi order me badalna. Shuru me insert O(1) hai, end me insert me last node tak jaana padta hai to O(n). Delete me hamesha previous node ka pointer chahiye hota hai. Sabse important: pehle naye node ko aage wale se jodo, phir peeche wale se, warna list toot jaati hai.", "mistakes": ["Updating PTR.next before NEW.next, which loses the rest of the list.", "Forgetting the empty-list and single-node special cases.", "Deleting a node without a PREV pointer, so the list cannot be re-joined.", "Not checking for position beyond the length of the list (null pointer error).", "Using while (ptr.next != null) for delete last: that stops at the last node, not the second-last."], "remember": ["Insertion/deletion change links only; no shifting of data.", "Overflow: no free node available. Underflow: delete from empty list.", "Insert begin: NEW.LINK = HEAD; HEAD = NEW. O(1).", "Insert end: reach last node, LAST.LINK = NEW. O(n) (O(1) with tail pointer).", "Insert after PTR: NEW.LINK = PTR.LINK; then PTR.LINK = NEW. Order is important.", "Insert at position k: move PTR to (k-1)th node first.", "Delete first: TEMP = HEAD; HEAD = HEAD.LINK. O(1).", "Delete last: reach second-last node; set its LINK = NULL. O(n).", "Delete given node: keep PREV and CUR; PREV.LINK = CUR.LINK.", "Special cases: empty list, single node, first node, last node.", "Finding the position costs O(n); the link change itself is O(1).", "Space complexity of each operation is O(1) (a couple of pointers)."], "uses": ["Editors keeping lines or undo history where insert/delete is frequent", "Memory managers inserting/removing free blocks from the free list", "Implementation of stacks, queues and hash-table buckets", "Playlists where songs are added or removed anywhere"], "pros": ["No shifting of elements during insert/delete", "Insert at front and delete at front are O(1)", "Grows and shrinks without reallocation"], "cons": ["Reaching a position or the last node costs O(n)", "Deleting last node needs the second-last node", "Pointer mistakes (wrong order) can lose or corrupt the list"], "def": "In a linked list, no element is shifted. Insertion and deletion only change the LINK fields of one or two nodes. The key is to change links in the correct order so that no part of the list is lost."}, "u3-t3": {"tldr": "Stack and queue built on linked lists: no fixed size, no overflow (until memory ends). Stack uses head insertion/removal; queue uses front and rear pointers.", "sections": [{"h": "Why linked representation?", "p": ["The idea is to reuse the singly linked list operations: insert/delete only at the ends where the stack or queue allows it. Then every operation is O(1)."], "table": {"head": ["Structure", "Add at", "Remove from", "Pointers"], "rows": [["Stack (LIFO)", "Head (top)", "Head (top)", "TOP"], ["Queue (FIFO)", "Tail (rear)", "Head (front)", "FRONT, REAR"]]}}, {"h": "Linked stack: push and pop", "p": ["In a linked stack, TOP is simply the HEAD of the list. The most recently pushed element is the first node. Because we insert and delete only at the head, no traversal is needed.", "PUSH(X): 1) NEW = new node (if no memory, overflow). 2) NEW.INFO = X. 3) NEW.LINK = TOP. 4) TOP = NEW.", "POP(): 1) If TOP = NULL, underflow. 2) X = TOP.INFO. 3) TOP = TOP.LINK. 4) Return X."], "pts": ["Trace: push 10 -> TOP=10; push 20 -> 20.next=10, TOP=20; push 30 -> TOP=30", "pop -> returns 30, TOP moves to 20", "Time O(1) each; space O(1) extra per operation, O(n) in total"], "code": {"f": "Main.java", "c": "public class Main {\n    static class Node { int data; Node next; Node(int d) { data = d; } }\n    static Node top = null;                     // TOP = HEAD of the list\n\n    static void push(int x) {\n        Node n = new Node(x);\n        n.next = top;                           // insert at beginning\n        top = n;\n    }\n    static int pop() {\n        if (top == null) { System.out.println(\"Stack Underflow\"); return -1; }\n        int x = top.data;\n        top = top.next;                         // delete first node\n        return x;\n    }\n    public static void main(String[] args) {\n        push(10); push(20); push(30);\n        System.out.println(\"Popped: \" + pop());\n        System.out.println(\"Popped: \" + pop());\n        push(40);\n        System.out.println(\"Popped: \" + pop());\n        System.out.println(\"Popped: \" + pop());\n        pop();\n    }\n}", "out": "Popped: 30\nPopped: 20\nPopped: 40\nPopped: 10\nStack Underflow", "cpp": {"f": "main.cpp", "c": "#include <iostream>\nusing namespace std;\n\nstruct Node { int data; Node* next; Node(int d) : data(d), next(nullptr) {} };\nNode* top = nullptr;                        // TOP = HEAD of the list\n\nvoid push(int x) {\n    Node* n = new Node(x);\n    n->next = top;                          // insert at beginning\n    top = n;\n}\nint pop() {\n    if (top == nullptr) { cout << \"Stack Underflow\\n\"; return -1; }\n    int x = top->data;\n    Node* old = top;\n    top = top->next;                        // delete first node\n    delete old;\n    return x;\n}\nint main() {\n    push(10); push(20); push(30);\n    cout << \"Popped: \" << pop() << \"\\n\";\n    cout << \"Popped: \" << pop() << \"\\n\";\n    push(40);\n    cout << \"Popped: \" << pop() << \"\\n\";\n    cout << \"Popped: \" << pop() << \"\\n\";\n    pop();\n    return 0;\n}\n"}, "clang": {"f": "main.c", "c": "#include <stdio.h>\n#include <stdlib.h>\n\ntypedef struct Node { int data; struct Node *next; } Node;\nNode *top = NULL;                           /* TOP = HEAD of the list */\n\nvoid push(int x) {\n    Node *n = malloc(sizeof(Node)); n->data = x;\n    n->next = top;                          /* insert at beginning */\n    top = n;\n}\nint pop() {\n    if (top == NULL) { printf(\"Stack Underflow\\n\"); return -1; }\n    int x = top->data;\n    Node *old = top;\n    top = top->next;                        /* delete first node */\n    free(old);\n    return x;\n}\nint main() {\n    push(10); push(20); push(30);\n    printf(\"Popped: %d\\n\", pop());\n    printf(\"Popped: %d\\n\", pop());\n    push(40);\n    printf(\"Popped: %d\\n\", pop());\n    printf(\"Popped: %d\\n\", pop());\n    pop();\n    return 0;\n}\n"}}, "viz": {"type": "chain", "items": ["TOP", "30", "20", "10", "null"], "labels": ["", "next", "next", "next"], "caption": "Stack after push 10, 20, 30: top is 30"}}, {"h": "Other stack operations: peek, isEmpty, size", "p": ["PEEK returns TOP.INFO without removing it (check for underflow first). IS_EMPTY returns true when TOP = NULL. Size needs a traversal, so it is O(n), unless we keep a counter updated in push and pop.", "A stack is LIFO (last in, first out), so pushing the letters D, A, T, A and popping them gives the reverse A, T, A, D. This is the idea behind reversing a string and undo features."], "tip": "Keep an int count field if you need size in O(1).", "code": {"f": "Main.java", "c": "public class Main {\n    static class Node { char data; Node next; Node(char d) { data = d; } }\n    static Node top;\n    static boolean isEmpty() { return top == null; }\n    static void push(char c) { Node n = new Node(c); n.next = top; top = n; }\n    static char pop() { char c = top.data; top = top.next; return c; }\n    static char peek() { return top.data; }\n    static int size() { int c = 0; for (Node p = top; p != null; p = p.next) c++; return c; }\n\n    public static void main(String[] args) {\n        String s = \"DATA\";\n        for (char c : s.toCharArray()) push(c);\n        System.out.println(\"Top = \" + peek() + \", size = \" + size());\n        StringBuilder rev = new StringBuilder();\n        while (!isEmpty()) rev.append(pop());\n        System.out.println(\"Reversed: \" + rev);\n        System.out.println(\"Empty? \" + isEmpty());\n    }\n}", "out": "Top = A, size = 4\nReversed: ATAD\nEmpty? true", "cpp": {"f": "main.cpp", "c": "#include <iostream>\n#include <string>\nusing namespace std;\n\nstruct Node { char data; Node* next; Node(char d) : data(d), next(nullptr) {} };\nNode* top = nullptr;\nbool isEmpty() { return top == nullptr; }\nvoid push(char c) { Node* n = new Node(c); n->next = top; top = n; }\nchar pop() { char c = top->data; Node* old = top; top = top->next; delete old; return c; }\nchar peek() { return top->data; }\nint size() { int c = 0; for (Node* p = top; p != nullptr; p = p->next) c++; return c; }\n\nint main() {\n    string s = \"DATA\";\n    for (char c : s) push(c);\n    cout << \"Top = \" << peek() << \", size = \" << size() << \"\\n\";\n    string rev;\n    while (!isEmpty()) rev += pop();\n    cout << \"Reversed: \" << rev << \"\\n\";\n    cout << \"Empty? \" << (isEmpty() ? \"true\" : \"false\") << \"\\n\";\n    return 0;\n}\n"}, "clang": {"f": "main.c", "c": "#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\n\ntypedef struct Node { char data; struct Node *next; } Node;\nNode *top = NULL;\nint isEmpty() { return top == NULL; }\nvoid push(char c) { Node *n = malloc(sizeof(Node)); n->data = c; n->next = top; top = n; }\nchar pop() { char c = top->data; Node *old = top; top = top->next; free(old); return c; }\nchar peek() { return top->data; }\nint size() { int c = 0; for (Node *p = top; p != NULL; p = p->next) c++; return c; }\n\nint main() {\n    const char *s = \"DATA\";\n    for (int i = 0; s[i]; i++) push(s[i]);\n    printf(\"Top = %c, size = %d\\n\", peek(), size());\n    char rev[20]; int k = 0;\n    while (!isEmpty()) rev[k++] = pop();\n    rev[k] = '\\0';\n    printf(\"Reversed: %s\\n\", rev);\n    printf(\"Empty? %s\\n\", isEmpty() ? \"true\" : \"false\");\n    return 0;\n}\n"}}}, {"h": "Linked queue: front and rear pointers", "p": ["A queue is FIFO (first in, first out). In the linked form, FRONT points to the first node (where we remove) and REAR points to the last node (where we add). If only FRONT were kept, every enqueue would need a walk to the end, costing O(n).", "An empty queue has FRONT = REAR = NULL. A queue with one element has FRONT = REAR = that node."], "viz": {"type": "chain", "items": ["FRONT", "10", "20", "30", "null"], "labels": ["", "next", "next", "next"], "caption": "REAR also points to node 30 (the last node)"}}, {"h": "Enqueue and dequeue algorithms", "p": ["ENQUEUE(X): 1) NEW = new node, INFO = X, LINK = NULL. 2) If REAR = NULL (empty), FRONT = REAR = NEW. 3) Else REAR.LINK = NEW and REAR = NEW.", "DEQUEUE(): 1) If FRONT = NULL, underflow. 2) X = FRONT.INFO. 3) FRONT = FRONT.LINK. 4) If FRONT = NULL then REAR = NULL. 5) Return X."], "warn": "Step 4 of dequeue is the classic trap: if you forget to set REAR = NULL when the last node is removed, REAR keeps pointing to a deleted node and the next enqueue breaks the queue.", "code": {"f": "Main.java", "c": "public class Main {\n    static class Node { int data; Node next; Node(int d) { data = d; } }\n    static Node front = null, rear = null;\n\n    static void enqueue(int x) {\n        Node n = new Node(x);\n        if (rear == null) front = rear = n;     // first element\n        else { rear.next = n; rear = n; }       // insert at END\n    }\n    static int dequeue() {\n        if (front == null) { System.out.println(\"Queue Underflow\"); return -1; }\n        int x = front.data;\n        front = front.next;                     // delete from FRONT\n        if (front == null) rear = null;         // queue became empty\n        return x;\n    }\n    public static void main(String[] args) {\n        enqueue(10); enqueue(20); enqueue(30);\n        System.out.println(\"Dequeued: \" + dequeue());\n        enqueue(40);\n        System.out.println(\"Dequeued: \" + dequeue());\n        System.out.println(\"Dequeued: \" + dequeue());\n        System.out.println(\"Dequeued: \" + dequeue());\n        dequeue();\n        enqueue(50);\n        System.out.println(\"Front = \" + front.data + \", Rear = \" + rear.data);\n    }\n}", "out": "Dequeued: 10\nDequeued: 20\nDequeued: 30\nDequeued: 40\nQueue Underflow\nFront = 50, Rear = 50", "cpp": {"f": "main.cpp", "c": "#include <iostream>\nusing namespace std;\n\nstruct Node { int data; Node* next; Node(int d) : data(d), next(nullptr) {} };\nNode *front = nullptr, *rear = nullptr;\n\nvoid enqueue(int x) {\n    Node* n = new Node(x);\n    if (rear == nullptr) front = rear = n;  // first element\n    else { rear->next = n; rear = n; }      // insert at END\n}\nint dequeue() {\n    if (front == nullptr) { cout << \"Queue Underflow\\n\"; return -1; }\n    int x = front->data;\n    Node* old = front;\n    front = front->next;                    // delete from FRONT\n    delete old;\n    if (front == nullptr) rear = nullptr;   // queue became empty\n    return x;\n}\nint main() {\n    enqueue(10); enqueue(20); enqueue(30);\n    cout << \"Dequeued: \" << dequeue() << \"\\n\";\n    enqueue(40);\n    cout << \"Dequeued: \" << dequeue() << \"\\n\";\n    cout << \"Dequeued: \" << dequeue() << \"\\n\";\n    cout << \"Dequeued: \" << dequeue() << \"\\n\";\n    dequeue();\n    enqueue(50);\n    cout << \"Front = \" << front->data << \", Rear = \" << rear->data << \"\\n\";\n    return 0;\n}\n"}, "clang": {"f": "main.c", "c": "#include <stdio.h>\n#include <stdlib.h>\n\ntypedef struct Node { int data; struct Node *next; } Node;\nNode *front = NULL, *rear = NULL;\n\nvoid enqueue(int x) {\n    Node *n = malloc(sizeof(Node)); n->data = x; n->next = NULL;\n    if (rear == NULL) front = rear = n;     /* first element */\n    else { rear->next = n; rear = n; }      /* insert at END */\n}\nint dequeue() {\n    if (front == NULL) { printf(\"Queue Underflow\\n\"); return -1; }\n    int x = front->data;\n    Node *old = front;\n    front = front->next;                    /* delete from FRONT */\n    free(old);\n    if (front == NULL) rear = NULL;         /* queue became empty */\n    return x;\n}\nint main() {\n    enqueue(10); enqueue(20); enqueue(30);\n    printf(\"Dequeued: %d\\n\", dequeue());\n    enqueue(40);\n    printf(\"Dequeued: %d\\n\", dequeue());\n    printf(\"Dequeued: %d\\n\", dequeue());\n    printf(\"Dequeued: %d\\n\", dequeue());\n    dequeue();\n    enqueue(50);\n    printf(\"Front = %d, Rear = %d\\n\", front->data, rear->data);\n    return 0;\n}\n"}}, "table": {"head": ["Step", "What happens"], "rows": [["1. enqueue 10", "FRONT = REAR = 10"], ["2. enqueue 20, 30", "REAR moves: 10 -> 20 -> 30"], ["3. dequeue", "returns 10, FRONT = 20"], ["4. enqueue 40", "30.next = 40, REAR = 40"], ["5. dequeue until empty", "when FRONT becomes null, set REAR = null"]]}}, {"h": "Complexity", "p": ["Each node holds the data plus one pointer, so n elements use O(n) space. Every basic operation touches only a constant number of pointers, hence O(1) time."], "table": {"head": ["Operation", "Linked stack", "Linked queue"], "rows": [["Insert (push / enqueue)", "O(1)", "O(1) with REAR"], ["Delete (pop / dequeue)", "O(1)", "O(1)"], ["Peek / front", "O(1)", "O(1)"], ["isEmpty", "O(1)", "O(1)"], ["Space for n items", "O(n)", "O(n)"]]}}, {"h": "Array vs linked representation", "p": ["Use the array form when the maximum size is known and memory is tight per element. Use the linked form when the size varies a lot. A linked queue also avoids the 'false full' problem of a simple array queue, where free space at the front cannot be reused."], "table": {"head": ["Point", "Array based", "Linked based"], "rows": [["Size", "Fixed (overflow possible)", "Dynamic"], ["Memory", "May waste or run out", "Exactly n nodes"], ["Extra space", "None", "Pointer per node"], ["Speed", "O(1), cache friendly", "O(1), slightly slower"], ["Queue wrap-around", "Needs circular logic", "Not needed"], ["Implementation", "Simple", "Needs pointer care"]]}}], "analogy": "Stack: a pile of plates. You add and take plates only at the top. Queue: a ticket line. People join at the back (rear) and leave from the front.", "hinglish": "Bhai array wale stack/queue me size fix hoti hai. Linked list se banao to size dynamic ho jaati hai. Stack me head ko hi top maan lo: push matlab head pe insert, pop matlab head se delete, dono O(1). Queue me front aur rear do pointer rakhte hain: rear pe enqueue, front se dequeue. Isse dono kaam O(1) me hote hain.", "mistakes": ["Inserting the stack element at the end of the list, which makes push O(n).", "Keeping only FRONT in a queue and making enqueue O(n).", "Forgetting to reset REAR = NULL when the last element is dequeued.", "Not checking underflow before pop, peek or dequeue.", "Mixing up the ends: queue deletes at front, inserts at rear."], "remember": ["Linked stack: TOP = HEAD pointer of a singly linked list.", "PUSH = insert at beginning; POP = delete from beginning. Both O(1).", "Underflow: TOP = NULL when popping. Overflow only when memory is exhausted.", "PEEK returns TOP.INFO without deleting.", "Linked queue uses two pointers: FRONT (delete end) and REAR (insert end).", "ENQUEUE at REAR, DEQUEUE at FRONT; both O(1).", "Empty queue: FRONT = REAR = NULL.", "After dequeue of the last element set REAR = NULL.", "Stack is LIFO; queue is FIFO.", "Space for n elements is O(n): data + one link per node.", "Array: fixed size, no pointer overhead. Linked: dynamic, pointer overhead.", "Applications: expression evaluation, undo (stack); scheduling, buffers (queue)."], "uses": ["Function call management and undo/redo (stack)", "Expression evaluation and parenthesis matching (stack)", "CPU scheduling, printer spooling, BFS (queue)", "Buffers where the number of items is not known in advance"], "pros": ["No fixed size; no overflow until memory is full", "All basic operations are O(1)", "No wasted capacity"], "cons": ["Extra memory for a pointer in every node", "Slightly slower than arrays due to dynamic allocation and poor cache use", "Pointer handling is more error prone"], "def": "A stack or queue made from an array has a fixed capacity. If it becomes full we get overflow, and if we choose a very big array we waste memory. A linked representation allocates one node per element, so the structure grows and shrinks as needed."}, "u4-t2": {"tldr": "Three simple O(n^2) sorts: selection (pick the minimum), bubble (swap neighbours), insertion (insert into sorted part).", "sections": [{"h": "What is sorting? Meet the three simple sorts", "p": ["Selection, bubble and insertion sort are the simple (elementary) sorting methods. They are easy to write and understand, use no extra array, but take O(n^2) time in the average and worst case, so they suit small inputs."], "pts": ["Selection sort: repeatedly select the minimum and put it at its place", "Bubble sort: repeatedly swap adjacent elements that are out of order", "Insertion sort: grow a sorted part by inserting one element at a time", "All three work on the array itself (in-place), O(1) extra space"], "viz": {"type": "chain", "items": ["Unsorted", "Sorting pass(es)", "Sorted"], "caption": "Each pass puts at least one element in its final place"}}, {"h": "Selection sort: idea and algorithm", "p": ["Idea: divide the array into a sorted part (left) and an unsorted part (right). In every pass, find the smallest element of the unsorted part and swap it with the first element of the unsorted part. The sorted part grows by one.", "For n elements we need n-1 passes. The last element is automatically in place."], "pts": ["Step 1: for i = 0 to n-2", "Step 2: set min = i", "Step 3: for j = i+1 to n-1, if a[j] < a[min] then min = j", "Step 4: swap a[i] and a[min]", "Step 5: repeat until i = n-2"], "tip": "Selection sort does at most n-1 swaps, the fewest of the three sorts. Useful when writing to memory is costly.", "viz": {"type": "cells", "items": ["64", "25", "12", "22", "11"], "labels": ["0", "1", "2", "3", "4"], "hl": [0], "caption": "Pass 1: minimum of the whole array is 11 (index 4), swap with a[0]"}}, {"h": "Selection sort: pass-by-pass trace and code", "p": ["Dry run on [64, 25, 12, 22, 11]. The part before the current position is already sorted."], "code": {"f": "Main.java", "c": "public class Main {\n    static void selectionSort(int[] a) {\n        int n = a.length;\n        for (int i = 0; i < n - 1; i++) {\n            int min = i;\n            for (int j = i + 1; j < n; j++)\n                if (a[j] < a[min]) min = j;\n            int t = a[i]; a[i] = a[min]; a[min] = t;\n            System.out.println(\"Pass \" + (i + 1) + \": \" + java.util.Arrays.toString(a));\n        }\n    }\n    public static void main(String[] args) {\n        selectionSort(new int[]{64, 25, 12, 22, 11});\n    }\n}", "out": "Pass 1: [11, 25, 12, 22, 64]\nPass 2: [11, 12, 25, 22, 64]\nPass 3: [11, 12, 22, 25, 64]\nPass 4: [11, 12, 22, 25, 64]", "cpp": {"f": "main.cpp", "c": "#include <iostream>\n#include <vector>\n#include <string>\nusing namespace std;\n\n// like Java's Arrays.toString\nstring str(const vector<int>& a) {\n    string s = \"[\";\n    for (size_t i = 0; i < a.size(); i++) s += (i ? \", \" : \"\") + to_string(a[i]);\n    return s + \"]\";\n}\nvoid selectionSort(vector<int>& a) {\n    int n = a.size();\n    for (int i = 0; i < n - 1; i++) {\n        int mn = i;\n        for (int j = i + 1; j < n; j++)\n            if (a[j] < a[mn]) mn = j;\n        int t = a[i]; a[i] = a[mn]; a[mn] = t;\n        cout << \"Pass \" << (i + 1) << \": \" << str(a) << endl;\n    }\n}\nint main() {\n    vector<int> a = {64, 25, 12, 22, 11};\n    selectionSort(a);\n}\n"}, "clang": {"f": "main.c", "c": "#include <stdio.h>\n\n/* like Java's Arrays.toString */\nvoid prt(int a[], int n) {\n    printf(\"[\");\n    for (int i = 0; i < n; i++) printf(\"%s%d\", i ? \", \" : \"\", a[i]);\n    printf(\"]\");\n}\nvoid selectionSort(int a[], int n) {\n    for (int i = 0; i < n - 1; i++) {\n        int mn = i;\n        for (int j = i + 1; j < n; j++)\n            if (a[j] < a[mn]) mn = j;\n        int t = a[i]; a[i] = a[mn]; a[mn] = t;\n        printf(\"Pass %d: \", i + 1); prt(a, n); printf(\"\\n\");\n    }\n}\nint main() {\n    int a[] = {64, 25, 12, 22, 11};\n    selectionSort(a, 5);\n    return 0;\n}\n"}}, "table": {"head": ["Pass", "What happens", "Array after pass"], "rows": [["Pass 1", "min of a[0..4] = 11", "[11, 25, 12, 22, 64]"], ["Pass 2", "min of a[1..4] = 12", "[11, 12, 25, 22, 64]"], ["Pass 3", "min of a[2..4] = 22", "[11, 12, 22, 25, 64]"], ["Pass 4", "min of a[3..4] = 25", "[11, 12, 22, 25, 64]"]]}}, {"h": "Bubble sort: idea and algorithm", "p": ["Idea: compare each pair of adjacent elements and swap them if they are in the wrong order. After pass 1 the largest element reaches the last position, like a bubble rising. After pass 2 the second largest is in place, and so on.", "Optimisation: keep a flag `swapped`. If a full pass makes no swap, the array is already sorted and we stop. This gives O(n) best case."], "pts": ["Step 1: for p = 0 to n-2", "Step 2: swapped = false", "Step 3: for j = 0 to n-2-p, if a[j] > a[j+1] swap them and set swapped = true", "Step 4: if swapped is false, stop (sorted)", "Each pass the inner loop gets shorter by one"], "viz": {"type": "cells", "items": ["5", "1", "4", "2", "8"], "labels": ["0", "1", "2", "3", "4"], "hl": [0, 1], "caption": "Compare a[0] and a[1]: 5 > 1 so swap"}}, {"h": "Bubble sort: pass-by-pass trace and code", "p": ["Dry run on [5, 1, 4, 2, 8]. Pass 3 makes no swap, so the flag stops the loop."], "code": {"f": "Main.java", "c": "public class Main {\n    static void bubbleSort(int[] a) {\n        int n = a.length;\n        for (int p = 0; p < n - 1; p++) {\n            boolean swapped = false;\n            for (int j = 0; j < n - 1 - p; j++) {\n                if (a[j] > a[j + 1]) {\n                    int t = a[j]; a[j] = a[j + 1]; a[j + 1] = t;\n                    swapped = true;\n                }\n            }\n            System.out.println(\"Pass \" + (p + 1) + \": \" + java.util.Arrays.toString(a));\n            if (!swapped) break;\n        }\n    }\n    public static void main(String[] args) {\n        bubbleSort(new int[]{5, 1, 4, 2, 8});\n    }\n}", "out": "Pass 1: [1, 4, 2, 5, 8]\nPass 2: [1, 2, 4, 5, 8]\nPass 3: [1, 2, 4, 5, 8]", "cpp": {"f": "main.cpp", "c": "#include <iostream>\n#include <vector>\n#include <string>\nusing namespace std;\n\n// like Java's Arrays.toString\nstring str(const vector<int>& a) {\n    string s = \"[\";\n    for (size_t i = 0; i < a.size(); i++) s += (i ? \", \" : \"\") + to_string(a[i]);\n    return s + \"]\";\n}\nvoid bubbleSort(vector<int>& a) {\n    int n = a.size();\n    for (int p = 0; p < n - 1; p++) {\n        bool swapped = false;\n        for (int j = 0; j < n - 1 - p; j++) {\n            if (a[j] > a[j + 1]) {\n                int t = a[j]; a[j] = a[j + 1]; a[j + 1] = t;\n                swapped = true;\n            }\n        }\n        cout << \"Pass \" << (p + 1) << \": \" << str(a) << endl;\n        if (!swapped) break;\n    }\n}\nint main() {\n    vector<int> a = {5, 1, 4, 2, 8};\n    bubbleSort(a);\n}\n"}, "clang": {"f": "main.c", "c": "#include <stdio.h>\n#include <stdlib.h>\n\n/* like Java's Arrays.toString */\nvoid prt(int a[], int n) {\n    printf(\"[\");\n    for (int i = 0; i < n; i++) printf(\"%s%d\", i ? \", \" : \"\", a[i]);\n    printf(\"]\");\n}\nvoid bubbleSort(int a[], int n) {\n    for (int p = 0; p < n - 1; p++) {\n        int swapped = 0;\n        for (int j = 0; j < n - 1 - p; j++) {\n            if (a[j] > a[j + 1]) {\n                int t = a[j]; a[j] = a[j + 1]; a[j + 1] = t;\n                swapped = 1;\n            }\n        }\n        printf(\"Pass %d: \", p + 1); prt(a, n); printf(\"\\n\");\n        if (!swapped) break;\n    }\n}\nint main() {\n    int a[] = {5, 1, 4, 2, 8};\n    bubbleSort(a, 5);\n    return 0;\n}\n"}}, "table": {"head": ["Pass", "What happens", "Array after pass"], "rows": [["Pass 1", "3 swap(s); 8 fixed at end", "[1, 4, 2, 5, 8]"], ["Pass 2", "1 swap(s); 5 fixed at end", "[1, 2, 4, 5, 8]"], ["Pass 3", "0 swap(s); 4 fixed at end", "[1, 2, 4, 5, 8]"]]}}, {"h": "Insertion sort: idea and algorithm", "p": ["Idea: treat a[0] as a sorted part of size 1. Take the next element (the key), compare it with elements on its left, shift the bigger ones one place to the right, and drop the key into the gap.", "It is the way most people sort playing cards. It is also adaptive: on nearly sorted data very few shifts are needed."], "pts": ["Step 1: for i = 1 to n-1", "Step 2: key = a[i], j = i-1", "Step 3: while j >= 0 and a[j] > key: a[j+1] = a[j], j = j-1", "Step 4: a[j+1] = key", "Shifting (not swapping) makes it faster than bubble sort in practice"], "viz": {"type": "cells", "items": ["12", "11", "13", "5", "6"], "labels": ["0", "1", "2", "3", "4"], "hl": [1], "caption": "Pass 1: key = 11, shift 12 right, place 11 at index 0"}}, {"h": "Insertion sort: pass-by-pass trace and code", "p": ["Dry run on [12, 11, 13, 5, 6]."], "code": {"f": "Main.java", "c": "public class Main {\n    static void insertionSort(int[] a) {\n        for (int i = 1; i < a.length; i++) {\n            int key = a[i];\n            int j = i - 1;\n            while (j >= 0 && a[j] > key) {\n                a[j + 1] = a[j];\n                j--;\n            }\n            a[j + 1] = key;\n            System.out.println(\"Pass \" + i + \": \" + java.util.Arrays.toString(a));\n        }\n    }\n    public static void main(String[] args) {\n        insertionSort(new int[]{12, 11, 13, 5, 6});\n    }\n}", "out": "Pass 1: [11, 12, 13, 5, 6]\nPass 2: [11, 12, 13, 5, 6]\nPass 3: [5, 11, 12, 13, 6]\nPass 4: [5, 6, 11, 12, 13]", "cpp": {"f": "main.cpp", "c": "#include <iostream>\n#include <vector>\n#include <string>\nusing namespace std;\n\n// like Java's Arrays.toString\nstring str(const vector<int>& a) {\n    string s = \"[\";\n    for (size_t i = 0; i < a.size(); i++) s += (i ? \", \" : \"\") + to_string(a[i]);\n    return s + \"]\";\n}\nvoid insertionSort(vector<int>& a) {\n    for (int i = 1; i < (int)a.size(); i++) {\n        int key = a[i];\n        int j = i - 1;\n        while (j >= 0 && a[j] > key) {\n            a[j + 1] = a[j];\n            j--;\n        }\n        a[j + 1] = key;\n        cout << \"Pass \" << i << \": \" << str(a) << endl;\n    }\n}\nint main() {\n    vector<int> a = {12, 11, 13, 5, 6};\n    insertionSort(a);\n}\n"}, "clang": {"f": "main.c", "c": "#include <stdio.h>\n#include <stdlib.h>\n\n/* like Java's Arrays.toString */\nvoid prt(int a[], int n) {\n    printf(\"[\");\n    for (int i = 0; i < n; i++) printf(\"%s%d\", i ? \", \" : \"\", a[i]);\n    printf(\"]\");\n}\nvoid insertionSort(int a[], int n) {\n    for (int i = 1; i < n; i++) {\n        int key = a[i];\n        int j = i - 1;\n        while (j >= 0 && a[j] > key) {\n            a[j + 1] = a[j];\n            j--;\n        }\n        a[j + 1] = key;\n        printf(\"Pass %d: \", i); prt(a, n); printf(\"\\n\");\n    }\n}\nint main() {\n    int a[] = {12, 11, 13, 5, 6};\n    insertionSort(a, 5);\n    return 0;\n}\n"}}, "table": {"head": ["Pass", "What happens", "Array after pass"], "rows": [["Pass 1", "key=11, 1 shifts", "[11, 12, 13, 5, 6]"], ["Pass 2", "key=13, 0 shifts", "[11, 12, 13, 5, 6]"], ["Pass 3", "key=5, 3 shifts", "[5, 11, 12, 13, 6]"], ["Pass 4", "key=6, 3 shifts", "[5, 6, 11, 12, 13]"]]}}, {"h": "Complexity and stability", "p": ["A sort is stable if equal elements keep their original relative order. Bubble sort and insertion sort are stable because they never jump equal elements over each other (we use > not >=). Selection sort is unstable because the long-distance swap can move an element past an equal one. Example: [4a, 4b, 2] becomes [2, 4b, 4a] after pass 1.", "Selection sort always scans the whole unsorted part, so it is not adaptive. Bubble (with flag) and insertion are adaptive."], "warn": "Plain bubble sort without the swapped flag is O(n^2) even in the best case. Mention the flag in exams.", "table": {"head": ["Sort", "Best", "Average", "Worst", "Space", "Stable"], "rows": [["Selection", "O(n^2)", "O(n^2)", "O(n^2)", "O(1)", "No"], ["Bubble", "O(n)", "O(n^2)", "O(n^2)", "O(1)", "Yes"], ["Insertion", "O(n)", "O(n^2)", "O(n^2)", "O(1)", "Yes"]]}}], "analogy": "Selection sort is picking the shortest student and sending him to the front of the line, then the next shortest. Insertion sort is arranging playing cards in your hand: pick a new card and slide it into its place. Bubble sort is neighbours swapping places if the taller one stands first.", "hinglish": "Bhai teen simple sorts hain. Selection har baar minimum dhoondh ke aage rakhta hai. Bubble padosi elements ko compare karke swap karta hai, sabse bada end me pahunch jata hai. Insertion cards ki tarah hai, naya element sorted part me sahi jagah fit karo. Teeno O(n^2) hain, par bubble (flag ke saath) aur insertion almost sorted data pe O(n) me chal jate hain.", "mistakes": ["Writing the bubble inner loop up to n-1 every pass (works, but wastes time; use n-1-p).", "Forgetting the swapped flag and then claiming best case O(n).", "Using >= in insertion sort condition, which breaks stability.", "Saying selection sort is stable. It is not (default swap version).", "In insertion sort, writing the key before the shifting loop ends and overwriting data."], "remember": ["Sorting = arranging elements in ascending or descending order.", "Selection sort: find min of unsorted part, swap to front. n-1 passes.", "Selection sort comparisons = n(n-1)/2 always; swaps <= n-1.", "Bubble sort: swap adjacent out-of-order pairs; largest goes to end each pass.", "Bubble sort with swapped flag: best case O(n) on sorted input.", "Insertion sort: insert key into sorted left part by shifting bigger elements right.", "Insertion sort best case O(n) (already sorted), worst O(n^2) (reverse sorted).", "All three: average/worst O(n^2), space O(1), in-place.", "Stable: bubble, insertion. Unstable: selection (swap version).", "Adaptive: bubble (with flag), insertion. Not adaptive: selection.", "Insertion sort is best of the three for small or nearly sorted data.", "Number of passes: n-1 for selection and bubble; insertion starts from i = 1."], "uses": ["Sorting small arrays (fewer than about 20 elements)", "Insertion sort inside faster sorts (Timsort, quick sort for small pieces)", "Nearly sorted data: insertion sort or flagged bubble sort", "Selection sort when swaps are expensive (writes to flash memory)", "Teaching and exam questions on algorithm analysis"], "pros": ["Simple to write and understand", "In-place, O(1) extra memory", "Insertion and bubble are stable and adaptive"], "cons": ["O(n^2) average and worst case, slow for large data", "Bubble sort does many unnecessary swaps", "Selection sort is not stable and not adaptive"], "def": "Sorting means arranging the elements of a list in a fixed order, usually ascending (small to big) or descending. Sorted data makes searching (binary search), merging and reporting much faster."}, "u4-t3": {"tldr": "Quick sort picks a pivot, partitions the array around it, then sorts both sides recursively: average O(n log n), in-place, unstable.", "sections": [{"h": "Idea: divide and conquer", "p": ["Compare with merge sort: merge sort does the easy split and the hard merge; quick sort does the hard split (partition) and no merge."], "viz": {"type": "chain", "items": ["Choose pivot", "Partition", "Sort left part", "Sort right part"], "caption": "Quick sort in four moves"}}, {"h": "Partition: the heart of quick sort", "p": ["Partition rearranges a[lo..hi] so that all elements left of the pivot are <= pivot and all elements right of it are > pivot. It returns the final index of the pivot.", "Lomuto scheme (used here): take the last element as pivot. Keep an index i = lo-1 that marks the end of the 'small' zone. Scan j from lo to hi-1. If a[j] <= pivot, increment i and swap a[i] with a[j]. At the end swap a[i+1] with the pivot. Cost: one scan, O(n) time, O(1) space.", "Hoare scheme (original): two pointers start from both ends and move towards each other, swapping out-of-place pairs. It does fewer swaps but is trickier to code."], "viz": {"type": "cells", "items": ["10", "80", "30", "90", "40", "50", "70"], "labels": ["0", "1", "2", "3", "4", "5", "6"], "hl": [6], "caption": "Pivot = last element = 70"}}, {"h": "Choosing the pivot", "p": ["Quick sort is fast only when the pivot splits the array into two roughly equal halves. A bad pivot (always the smallest or largest) gives splits of size 0 and n-1 and the time becomes O(n^2)."], "tip": "To use another pivot with the Lomuto code, first swap the chosen pivot with a[hi], then partition as usual.", "table": {"head": ["Pivot choice", "How", "Remark"], "rows": [["First / last element", "a[lo] or a[hi]", "Simple; worst case on sorted input"], ["Middle element", "a[(lo+hi)/2]", "Good on sorted input"], ["Random element", "random index in [lo,hi]", "Worst case very unlikely"], ["Median of three", "median of first, middle, last", "Common in libraries"]]}}, {"h": "Algorithm", "p": ["Algorithm QUICKSORT(a, lo, hi) and PARTITION(a, lo, hi):"], "pts": ["QUICKSORT: if lo < hi then p = PARTITION(a, lo, hi)", "QUICKSORT(a, lo, p-1) and QUICKSORT(a, p+1, hi)", "PARTITION: pivot = a[hi], i = lo - 1", "for j = lo to hi-1: if a[j] <= pivot then i = i + 1 and swap a[i], a[j]", "swap a[i+1] and a[hi], return i + 1", "Base case: lo >= hi means 0 or 1 element, already sorted"]}, {"h": "Traced example", "p": ["First, one partition step by step on [10, 80, 30, 90, 40, 50, 70] with pivot 70 (lo = 0, hi = 6, i starts at -1).", "Then the whole recursion. Each row is one call; the pivot lands at its final index."], "pts": ["After the first partition the pivot 70 is at index 4, final position", "Left part [10, 30, 40, 50] and right part [90, 80] are sorted independently"], "table": {"head": ["Step", "Test", "Action", "Array"], "rows": [["j=0", "a[j] <= 70: yes", "i=0; swap a[0],a[0]", "[10, 80, 30, 90, 40, 50, 70]"], ["j=1", "a[j]=80 <= 70: no", "no swap", "[10, 80, 30, 90, 40, 50, 70]"], ["j=2", "a[j] <= 70: yes", "i=1; swap a[1],a[2]", "[10, 30, 80, 90, 40, 50, 70]"], ["j=3", "a[j]=90 <= 70: no", "no swap", "[10, 30, 80, 90, 40, 50, 70]"], ["j=4", "a[j] <= 70: yes", "i=2; swap a[2],a[4]", "[10, 30, 40, 90, 80, 50, 70]"], ["j=5", "a[j] <= 70: yes", "i=3; swap a[3],a[5]", "[10, 30, 40, 50, 80, 90, 70]"], ["end", "place pivot 70", "swap a[4],a[6]", "[10, 30, 40, 50, 70, 90, 80]"]]}}, {"h": "Full recursion trace and Java code", "p": ["Every call fixes one pivot in its final place. Calls on 0 or 1 element do nothing."], "code": {"f": "Main.java", "c": "public class Main {\n    static int partition(int[] a, int lo, int hi) {\n        int pivot = a[hi];\n        int i = lo - 1;\n        for (int j = lo; j < hi; j++) {\n            if (a[j] <= pivot) {\n                i++;\n                int t = a[i]; a[i] = a[j]; a[j] = t;\n            }\n        }\n        int t = a[i + 1]; a[i + 1] = a[hi]; a[hi] = t;\n        return i + 1;\n    }\n    static void quickSort(int[] a, int lo, int hi) {\n        if (lo < hi) {\n            int p = partition(a, lo, hi);\n            System.out.println(\"pivot \" + a[p] + \" at index \" + p + \": \" + java.util.Arrays.toString(a));\n            quickSort(a, lo, p - 1);\n            quickSort(a, p + 1, hi);\n        }\n    }\n    public static void main(String[] args) {\n        int[] a = {10, 80, 30, 90, 40, 50, 70};\n        quickSort(a, 0, a.length - 1);\n        System.out.println(\"Sorted: \" + java.util.Arrays.toString(a));\n    }\n}", "out": "pivot 70 at index 4: [10, 30, 40, 50, 70, 90, 80]\npivot 50 at index 3: [10, 30, 40, 50, 70, 90, 80]\npivot 40 at index 2: [10, 30, 40, 50, 70, 90, 80]\npivot 30 at index 1: [10, 30, 40, 50, 70, 90, 80]\npivot 80 at index 5: [10, 30, 40, 50, 70, 80, 90]\nSorted: [10, 30, 40, 50, 70, 80, 90]", "cpp": {"f": "main.cpp", "c": "#include <iostream>\n#include <vector>\n#include <string>\nusing namespace std;\n\n// like Java's Arrays.toString\nstring str(const vector<int>& a) {\n    string s = \"[\";\n    for (size_t i = 0; i < a.size(); i++) s += (i ? \", \" : \"\") + to_string(a[i]);\n    return s + \"]\";\n}\nint partition(vector<int>& a, int lo, int hi) {\n    int pivot = a[hi];\n    int i = lo - 1;\n    for (int j = lo; j < hi; j++) {\n        if (a[j] <= pivot) {\n            i++;\n            int t = a[i]; a[i] = a[j]; a[j] = t;\n        }\n    }\n    int t = a[i + 1]; a[i + 1] = a[hi]; a[hi] = t;\n    return i + 1;\n}\nvoid quickSort(vector<int>& a, int lo, int hi) {\n    if (lo < hi) {\n        int p = partition(a, lo, hi);\n        cout << \"pivot \" << a[p] << \" at index \" << p << \": \" << str(a) << endl;\n        quickSort(a, lo, p - 1);\n        quickSort(a, p + 1, hi);\n    }\n}\nint main() {\n    vector<int> a = {10, 80, 30, 90, 40, 50, 70};\n    quickSort(a, 0, a.size() - 1);\n    cout << \"Sorted: \" << str(a) << endl;\n}\n"}, "clang": {"f": "main.c", "c": "#include <stdio.h>\n#include <stdlib.h>\n\n/* like Java's Arrays.toString */\nvoid prt(int a[], int n) {\n    printf(\"[\");\n    for (int i = 0; i < n; i++) printf(\"%s%d\", i ? \", \" : \"\", a[i]);\n    printf(\"]\");\n}\nint n = 7;\nint partition(int a[], int lo, int hi) {\n    int pivot = a[hi];\n    int i = lo - 1;\n    for (int j = lo; j < hi; j++) {\n        if (a[j] <= pivot) {\n            i++;\n            int t = a[i]; a[i] = a[j]; a[j] = t;\n        }\n    }\n    int t = a[i + 1]; a[i + 1] = a[hi]; a[hi] = t;\n    return i + 1;\n}\nvoid quickSort(int a[], int lo, int hi) {\n    if (lo < hi) {\n        int p = partition(a, lo, hi);\n        printf(\"pivot %d at index %d: \", a[p], p); prt(a, n); printf(\"\\n\");\n        quickSort(a, lo, p - 1);\n        quickSort(a, p + 1, hi);\n    }\n}\nint main() {\n    int a[] = {10, 80, 30, 90, 40, 50, 70};\n    quickSort(a, 0, n - 1);\n    printf(\"Sorted: \"); prt(a, n); printf(\"\\n\");\n    return 0;\n}\n"}}, "table": {"head": ["Call", "Pivot", "Pivot index", "Array after partition"], "rows": [["qs(0,6)", "70", "index 4", "[10, 30, 40, 50, 70, 90, 80]"], ["qs(0,3)", "50", "index 3", "[10, 30, 40, 50, 70, 90, 80]"], ["qs(0,2)", "40", "index 2", "[10, 30, 40, 50, 70, 90, 80]"], ["qs(0,1)", "30", "index 1", "[10, 30, 40, 50, 70, 90, 80]"], ["qs(5,6)", "80", "index 5", "[10, 30, 40, 50, 70, 80, 90]"]]}}, {"h": "Complexity, in-place and stability", "p": ["Best case: pivot splits in the middle every time. T(n) = 2T(n/2) + n gives O(n log n). Average case is also O(n log n). Worst case: pivot is always the smallest or largest, T(n) = T(n-1) + n gives O(n^2); this happens for sorted input with first/last pivot.", "Space: no extra array, so it is in-place. But the recursion uses stack: O(log n) on average, O(n) in the worst case. Quick sort is NOT stable because partition swaps elements that are far apart, which can reorder equal keys."], "warn": "Exam trap: quick sort is in-place but its recursion stack is not free. Also its worst case is O(n^2), unlike merge sort and heap sort.", "code": {"f": "Main.java", "c": "public class Main {\n    static int partition(int[] a, int lo, int hi) {\n        int r = lo + (int) (Math.random() * (hi - lo + 1));\n        int t = a[r]; a[r] = a[hi]; a[hi] = t;\n        int pivot = a[hi], i = lo - 1;\n        for (int j = lo; j < hi; j++)\n            if (a[j] <= pivot) { i++; t = a[i]; a[i] = a[j]; a[j] = t; }\n        t = a[i + 1]; a[i + 1] = a[hi]; a[hi] = t;\n        return i + 1;\n    }\n    static void quickSort(int[] a, int lo, int hi) {\n        if (lo < hi) {\n            int p = partition(a, lo, hi);\n            quickSort(a, lo, p - 1);\n            quickSort(a, p + 1, hi);\n        }\n    }\n    public static void main(String[] args) {\n        int[] a = {1, 2, 3, 4, 5, 6, 7, 8};\n        quickSort(a, 0, a.length - 1);\n        System.out.println(java.util.Arrays.toString(a));\n    }\n}", "out": "[1, 2, 3, 4, 5, 6, 7, 8]", "cpp": {"f": "main.cpp", "c": "#include <iostream>\n#include <vector>\n#include <string>\n#include <cstdlib>\nusing namespace std;\n\n// like Java's Arrays.toString\nstring str(const vector<int>& a) {\n    string s = \"[\";\n    for (size_t i = 0; i < a.size(); i++) s += (i ? \", \" : \"\") + to_string(a[i]);\n    return s + \"]\";\n}\nint partition(vector<int>& a, int lo, int hi) {\n    int r = lo + rand() % (hi - lo + 1);     // random pivot\n    int t = a[r]; a[r] = a[hi]; a[hi] = t;\n    int pivot = a[hi], i = lo - 1;\n    for (int j = lo; j < hi; j++)\n        if (a[j] <= pivot) { i++; t = a[i]; a[i] = a[j]; a[j] = t; }\n    t = a[i + 1]; a[i + 1] = a[hi]; a[hi] = t;\n    return i + 1;\n}\nvoid quickSort(vector<int>& a, int lo, int hi) {\n    if (lo < hi) {\n        int p = partition(a, lo, hi);\n        quickSort(a, lo, p - 1);\n        quickSort(a, p + 1, hi);\n    }\n}\nint main() {\n    vector<int> a = {1, 2, 3, 4, 5, 6, 7, 8};\n    quickSort(a, 0, a.size() - 1);\n    cout << str(a) << endl;\n}\n"}, "clang": {"f": "main.c", "c": "#include <stdio.h>\n#include <stdlib.h>\n\n/* like Java's Arrays.toString */\nvoid prt(int a[], int n) {\n    printf(\"[\");\n    for (int i = 0; i < n; i++) printf(\"%s%d\", i ? \", \" : \"\", a[i]);\n    printf(\"]\");\n}\nint partition(int a[], int lo, int hi) {\n    int r = lo + rand() % (hi - lo + 1);     /* random pivot */\n    int t = a[r]; a[r] = a[hi]; a[hi] = t;\n    int pivot = a[hi], i = lo - 1;\n    for (int j = lo; j < hi; j++)\n        if (a[j] <= pivot) { i++; t = a[i]; a[i] = a[j]; a[j] = t; }\n    t = a[i + 1]; a[i + 1] = a[hi]; a[hi] = t;\n    return i + 1;\n}\nvoid quickSort(int a[], int lo, int hi) {\n    if (lo < hi) {\n        int p = partition(a, lo, hi);\n        quickSort(a, lo, p - 1);\n        quickSort(a, p + 1, hi);\n    }\n}\nint main() {\n    int a[] = {1, 2, 3, 4, 5, 6, 7, 8};\n    quickSort(a, 0, 7);\n    prt(a, 8); printf(\"\\n\");\n    return 0;\n}\n"}}, "table": {"head": ["Case", "Time", "Space (stack)"], "rows": [["Best", "O(n log n)", "O(log n)"], ["Average", "O(n log n)", "O(log n)"], ["Worst", "O(n^2)", "O(n)"]]}}], "analogy": "Imagine a teacher picks one student as the reference. Everyone shorter stands on her left, everyone taller on her right. She is now at her correct place. The same is repeated for the left group and the right group.", "hinglish": "Bhai quick sort me ek pivot chunte hain. Pivot se chhote left me, bade right me. Ab pivot apni sahi jagah pe hai. Phir left aur right part pe yehi recursively karte hain. Average O(n log n), par agar pivot hamesha sabse chhota ya bada mila to O(n^2). Extra array nahi chahiye par stable nahi hai.", "mistakes": ["Saying worst case is O(n log n). It is O(n^2).", "Believing quick sort is stable.", "Forgetting that the pivot is already in its final place, so it is excluded from the recursive calls (p-1 and p+1).", "Choosing first/last pivot and claiming good performance on sorted input.", "Forgetting the base case lo < hi, causing infinite recursion."], "remember": ["Quick sort = divide and conquer, by C.A.R. Hoare.", "Partition: put elements <= pivot on left, > pivot on right; pivot reaches final position.", "Lomuto: pivot = a[hi], i = lo-1, scan j, swap a[i+1] with pivot.", "Recurrence best/avg: T(n) = 2T(n/2) + n, so O(n log n).", "Recurrence worst: T(n) = T(n-1) + n, so O(n^2).", "Worst case: already sorted / reverse sorted with first or last pivot, or all keys equal (Lomuto).", "Pivot choices: first, last, middle, random, median of three.", "In-place sort: no extra array; stack space O(log n) average.", "Not stable (long-distance swaps).", "No combine step, unlike merge sort.", "Usually faster than merge sort and heap sort in practice (cache friendly).", "Not adaptive: sorted input is the worst case for naive pivot."], "uses": ["Default sort for primitives in many libraries (Java uses dual-pivot quick sort for int[])", "Sorting large arrays in memory where speed matters", "Finding the k-th smallest element (quick select)", "Systems where extra memory must be small"], "pros": ["Very fast in practice, small constant factor", "In-place, needs no extra array", "Cache friendly"], "cons": ["Worst case O(n^2)", "Not stable", "Recursive; deep recursion can overflow the stack on bad input"], "def": "Quick sort was invented by C.A.R. Hoare. It follows divide and conquer: (1) Divide: choose a pivot and partition the array into two parts, smaller-or-equal on the left and greater on the right. (2) Conquer: sort the two parts recursively. (3) Combine: nothing to do, because the sorting happens in place."}, "u4-t4": {"tldr": "Merge sort splits the array in halves, sorts each half recursively and merges them: always O(n log n), stable, needs O(n) extra space.", "sections": [{"h": "Idea: divide and conquer", "p": ["A single element is already sorted. That is the base case: when lo >= hi we simply return. The real work is done in the merge step."], "viz": {"type": "tree", "root": "[38,27,43,3,9,82,10]", "kids": ["[38,27,43,3]", "[9,82,10]"], "caption": "First divide step (mid = 3); each half is split again until single elements"}}, {"h": "The merge procedure", "p": ["Merge takes two sorted lists and produces one sorted list. Keep one pointer on the front of each list, compare the two front elements, copy the smaller to the output and move that pointer. When one list is finished, copy the rest of the other.", "Taking from the left list when the elements are equal (<=) keeps the sort stable. Merge needs a temporary copy of the parts, so extra space is O(n). It makes at most n-1 comparisons, so it is O(n)."], "pts": ["Step 1: copy a[lo..mid] to left[] and a[mid+1..hi] to right[]", "Step 2: i = 0, j = 0, k = lo", "Step 3: while both have elements: if left[i] <= right[j] then a[k++] = left[i++] else a[k++] = right[j++]", "Step 4: copy remaining elements of left[] (if any)", "Step 5: copy remaining elements of right[] (if any)"], "viz": {"type": "cells", "items": ["3", "27", "38", "43", "9", "10", "82"], "labels": ["L0", "L1", "L2", "L3", "R0", "R1", "R2"], "hl": [0, 4], "caption": "Merging left [3,27,38,43] and right [9,10,82]: compare fronts 3 and 9"}}, {"h": "Merge trace", "p": ["Merging L = [3, 27, 38, 43] with R = [9, 10, 82]. i and j are the front pointers of L and R."], "tip": "Comparisons here: 6 (the last element 82 is just copied). In the worst case merging n elements takes n-1 comparisons.", "table": {"head": ["Pointers", "Compare", "Action", "Output so far"], "rows": [["i=0, j=0", "3 <= 9", "take 3 from left", "[3]"], ["i=1, j=0", "27 > 9", "take 9 from right", "[3, 9]"], ["i=1, j=1", "27 > 10", "take 10 from right", "[3, 9, 10]"], ["i=1, j=2", "27 <= 82", "take 27 from left", "[3, 9, 10, 27]"], ["i=2, j=2", "38 <= 82", "take 38 from left", "[3, 9, 10, 27, 38]"], ["i=3, j=2", "43 <= 82", "take 43 from left", "[3, 9, 10, 27, 38, 43]"], ["i=4, j=2", "left exhausted", "copy 82", "[3, 9, 10, 27, 38, 43, 82]"]]}}, {"h": "Merge sort algorithm", "p": ["Algorithm MERGESORT(a, lo, hi):"], "pts": ["If lo >= hi, return (0 or 1 element is sorted)", "mid = (lo + hi) / 2", "MERGESORT(a, lo, mid)", "MERGESORT(a, mid+1, hi)", "MERGE(a, lo, mid, hi)", "Call with MERGESORT(a, 0, n-1)"], "viz": {"type": "chain", "items": ["Split", "Split", "Single elements", "Merge", "Merge", "Sorted"], "caption": "Go down by splitting, come up by merging"}}, {"h": "Traced example", "p": ["Sorting [38, 27, 43, 3, 9, 82, 10]. The array is split into [38,27,43,3] and [9,82,10], and so on. Below are all the merges in the order they happen (left part, right part, result)."], "table": {"head": ["Left", "Right", "Merged", "Whole array"], "rows": [["merge [38]", "[27]", "[27, 38]", "[27, 38, 43, 3, 9, 82, 10]"], ["merge [43]", "[3]", "[3, 43]", "[27, 38, 3, 43, 9, 82, 10]"], ["merge [27, 38]", "[3, 43]", "[3, 27, 38, 43]", "[3, 27, 38, 4
