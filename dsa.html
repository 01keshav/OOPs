while (p != NULL && p->data != key) p = p->next;\n    if (p == NULL) { printf(\"%d not found\\n\", key); return; }\n    if (p->prev != NULL) p->prev->next = p->next; else head = p->next;\n    if (p->next != NULL) p->next->prev = p->prev; else tail = p->prev;\n    free(p);\n}\nvoid show() {\n    for (Node *p = head; p != NULL; p = p->next) printf(\"%d \", p->data);\n    printf(\"\\n\");\n}\nint main() {\n    for (int i = 10; i <= 50; i += 10) insertEnd(i);\n    del(30); show();   /* middle */\n    del(10); show();   /* first */\n    del(50); show();   /* last */\n    del(77);\n    while (head) { Node *t = head; head = head->next; free(t); }   /* free */\n    return 0;\n}\n"}}, "table": {"head": ["Step", "What happens"], "rows": [["1. Find node p", "search by key, O(n)"], ["2. If p.prev != null", "p.prev.next = p.next, else head = p.next"], ["3. If p.next != null", "p.next.prev = p.prev, else tail = p.prev"], ["4. Free node", "Java GC reclaims p"]]}}, {"h": "Complete DLL with traced reverse", "p": ["Reversing a DLL needs no new nodes: swap `prev` and `next` in every node, then swap `head` and `tail`. Dry run on 1 <-> 2 <-> 3: node1 becomes (prev=2, next=null), node2 becomes (prev=3, next=1), node3 becomes (prev=null, next=2); head moves to 3. Result 3 <-> 2 <-> 1.", "The program below gathers add/remove at both ends, search and reverse in one place."], "code": {"f": "Main.java", "c": "public class Main {\n    static class Node {\n        int data; Node prev, next;\n        Node(int d) { data = d; }\n    }\n    static Node head, tail;\n    static int size;\n\n    static void addLast(int x) {\n        Node n = new Node(x);\n        if (head == null) head = tail = n;\n        else { tail.next = n; n.prev = tail; tail = n; }\n        size++;\n    }\n    static void addFirst(int x) {\n        Node n = new Node(x);\n        if (head == null) head = tail = n;\n        else { n.next = head; head.prev = n; head = n; }\n        size++;\n    }\n    static int removeFirst() {\n        int v = head.data;\n        head = head.next;\n        if (head == null) tail = null; else head.prev = null;\n        size--; return v;\n    }\n    static int removeLast() {\n        int v = tail.data;\n        tail = tail.prev;\n        if (tail == null) head = null; else tail.next = null;\n        size--; return v;\n    }\n    static boolean search(int key) {\n        for (Node p = head; p != null; p = p.next) if (p.data == key) return true;\n        return false;\n    }\n    static void reverse() {\n        Node p = head, tmp = null;\n        while (p != null) {            // swap prev and next of every node\n            tmp = p.prev; p.prev = p.next; p.next = tmp;\n            p = p.prev;\n        }\n        tmp = head; head = tail; tail = tmp;\n    }\n    static void show() {\n        for (Node p = head; p != null; p = p.next) System.out.print(p.data + \" \");\n        System.out.println(\"(size \" + size + \")\");\n    }\n    public static void main(String[] args) {\n        addLast(2); addLast(3); addFirst(1); addLast(4);\n        show();\n        System.out.println(\"removeFirst = \" + removeFirst());\n        System.out.println(\"removeLast  = \" + removeLast());\n        show();\n        addLast(9); addLast(7);\n        reverse(); show();\n        System.out.println(\"search 9: \" + search(9) + \", search 5: \" + search(5));\n    }\n}", "out": "1 2 3 4 (size 4)\nremoveFirst = 1\nremoveLast  = 4\n2 3 (size 2)\n7 9 3 2 (size 4)\nsearch 9: true, search 5: false", "cpp": {"f": "main.cpp", "c": "#include <iostream>\n\nstruct Node {\n    int data; Node *prev, *next;\n    Node(int d) : data(d), prev(nullptr), next(nullptr) {}\n};\nNode *head = nullptr, *tail = nullptr;\nint size = 0;\n\nvoid addLast(int x) {\n    Node* n = new Node(x);\n    if (head == nullptr) head = tail = n;\n    else { tail->next = n; n->prev = tail; tail = n; }\n    size++;\n}\nvoid addFirst(int x) {\n    Node* n = new Node(x);\n    if (head == nullptr) head = tail = n;\n    else { n->next = head; head->prev = n; head = n; }\n    size++;\n}\nint removeFirst() {\n    int v = head->data;\n    Node* old = head;\n    head = head->next;\n    if (head == nullptr) tail = nullptr; else head->prev = nullptr;\n    delete old;\n    size--; return v;\n}\nint removeLast() {\n    int v = tail->data;\n    Node* old = tail;\n    tail = tail->prev;\n    if (tail == nullptr) head = nullptr; else tail->next = nullptr;\n    delete old;\n    size--; return v;\n}\nbool search(int key) {\n    for (Node* p = head; p != nullptr; p = p->next) if (p->data == key) return true;\n    return false;\n}\nvoid reverse() {\n    Node *p = head, *tmp = nullptr;\n    while (p != nullptr) {            // swap prev and next of every node\n        tmp = p->prev; p->prev = p->next; p->next = tmp;\n        p = p->prev;\n    }\n    tmp = head; head = tail; tail = tmp;\n}\nvoid show() {\n    for (Node* p = head; p != nullptr; p = p->next) std::cout << p->data << \" \";\n    std::cout << \"(size \" << size << \")\\n\";\n}\nint main() {\n    addLast(2); addLast(3); addFirst(1); addLast(4);\n    show();\n    std::cout << \"removeFirst = \" << removeFirst() << \"\\n\";\n    std::cout << \"removeLast  = \" << removeLast() << \"\\n\";\n    show();\n    addLast(9); addLast(7);\n    reverse(); show();\n    std::cout << \"search 9: \" << (search(9) ? \"true\" : \"false\")\n              << \", search 5: \" << (search(5) ? \"true\" : \"false\") << \"\\n\";\n    while (head) { Node* t = head; head = head->next; delete t; }   // free\n    return 0;\n}\n"}, "clang": {"f": "main.c", "c": "#include <stdio.h>\n#include <stdlib.h>\n\ntypedef struct Node { int data; struct Node *prev, *next; } Node;\nNode *mk(int d) { Node *n = malloc(sizeof(Node)); n->data = d; n->prev = n->next = NULL; return n; }\nNode *head = NULL, *tail = NULL;\nint size = 0;\n\nvoid addLast(int x) {\n    Node *n = mk(x);\n    if (head == NULL) head = tail = n;\n    else { tail->next = n; n->prev = tail; tail = n; }\n    size++;\n}\nvoid addFirst(int x) {\n    Node *n = mk(x);\n    if (head == NULL) head = tail = n;\n    else { n->next = head; head->prev = n; head = n; }\n    size++;\n}\nint removeFirst() {\n    int v = head->data;\n    Node *old = head;\n    head = head->next;\n    if (head == NULL) tail = NULL; else head->prev = NULL;\n    free(old);\n    size--; return v;\n}\nint removeLast() {\n    int v = tail->data;\n    Node *old = tail;\n    tail = tail->prev;\n    if (tail == NULL) head = NULL; else tail->next = NULL;\n    free(old);\n    size--; return v;\n}\nint search(int key) {\n    for (Node *p = head; p != NULL; p = p->next) if (p->data == key) return 1;\n    return 0;\n}\nvoid reverse() {\n    Node *p = head, *tmp = NULL;\n    while (p != NULL) {            /* swap prev and next of every node */\n        tmp = p->prev; p->prev = p->next; p->next = tmp;\n        p = p->prev;\n    }\n    tmp = head; head = tail; tail = tmp;\n}\nvoid show() {\n    for (Node *p = head; p != NULL; p = p->next) printf(\"%d \", p->data);\n    printf(\"(size %d)\\n\", size);\n}\nint main() {\n    addLast(2); addLast(3); addFirst(1); addLast(4);\n    show();\n    printf(\"removeFirst = %d\\n\", removeFirst());\n    printf(\"removeLast  = %d\\n\", removeLast());\n    show();\n    addLast(9); addLast(7);\n    reverse(); show();\n    printf(\"search 9: %s, search 5: %s\\n\", search(9) ? \"true\" : \"false\", search(5) ? \"true\" : \"false\");\n    while (head) { Node *t = head; head = head->next; free(t); }   /* free */\n    return 0;\n}\n"}}}, {"h": "Complexity", "p": ["n = number of nodes. Space is O(n) overall and each node carries one extra pointer compared with a singly list."], "table": {"head": ["Operation", "Time", "Extra space"], "rows": [["Traverse (either way)", "O(n)", "O(1)"], ["Insert at front", "O(1)", "O(1)"], ["Insert at end (with tail)", "O(1)", "O(1)"], ["Insert after given node", "O(1)", "O(1)"], ["Delete given node", "O(1)", "O(1)"], ["Delete by value / search", "O(n)", "O(1)"], ["Access i-th element", "O(n)", "O(1)"]]}}, {"h": "Doubly vs singly linked list", "p": ["Choose DLL when you need backward movement or quick deletion of a known node. Choose singly when memory is tight and one-way access is enough."], "table": {"head": ["Point", "Singly", "Doubly"], "rows": [["Links per node", "1 (next)", "2 (prev, next)"], ["Traversal", "Forward only", "Both directions"], ["Memory per node", "Less", "More"], ["Delete given node", "O(n) (need previous)", "O(1)"], ["Insert before node", "O(n)", "O(1)"], ["Code complexity", "Simple", "More pointer changes"], ["Reverse traversal", "Not possible directly", "Easy"]]}}], "analogy": "Think of a train. Every coach is joined to the coach in front and the coach behind. You can walk from engine to guard van, or back. A singly linked list is like a one-way corridor where you can only go forward.", "hinglish": "Bhai doubly linked list me har node ke paas do pointer hote hain: prev (peeche wala) aur next (aage wala). Isliye hum dono direction me chal sakte hain. Delete karna easy hota hai kyunki node ko apna previous pehle se pata hota hai, bas extra memory lagti hai.", "mistakes": ["Updating only one of the two links (next but not prev) and corrupting the list.", "Not handling head/tail/empty-list special cases when deleting.", "Writing p.next.prev when p.next is null (NullPointerException).", "Changing p.next before saving the old next, losing the rest of the list."], "remember": ["DLL node has three fields: prev, data, next.", "First node prev = null; last node next = null.", "Traversal is possible in both forward and backward directions.", "Insert at front: n.next = head; head.prev = n; head = n.", "Insert at end (tail kept): tail.next = n; n.prev = tail; tail = n.", "Insert after p: n.next = p.next; n.prev = p; p.next.prev = n (if exists); p.next = n.", "Delete p: p.prev.next = p.next; p.next.prev = p.prev (handle head/tail cases).", "Deleting a known node is O(1); searching is O(n).", "Traversal, search O(n); insert/delete at ends O(1) with head and tail.", "Extra memory: one more pointer per node than singly list.", "Reverse: swap prev and next in every node, then swap head and tail.", "Used in browser history, undo/redo, music playlist, LRU cache."], "uses": ["Browser back/forward navigation", "Undo/redo in editors", "Music player playlist (previous/next song)", "LRU cache (with a hash map)", "Implementing deque and navigation of text cursor"], "pros": ["Traversal in both directions", "O(1) deletion of a known node", "Insert before a node is easy"], "cons": ["Extra memory for the prev pointer", "More pointer updates, so more chance of bugs", "No random access, search is O(n)"], "def": "A doubly linked list (DLL) is a linear data structure made of nodes. Each node has three parts: a `prev` link, the `data`, and a `next` link. `prev` points to the node before it and `next` points to the node after it."}, "u3-t5": {"tldr": "A linked list whose last node points back to the first, so there is no null and traversal can loop forever.", "sections": [{"h": "What is a circular linked list?", "p": ["There are two kinds: circular singly linked list (one link `next` per node) and circular doubly linked list (`prev` and `next` per node, where `head.prev` is the last node and `last.next` is the head)."], "pts": ["No node has null in its next field (when list is non-empty)", "Empty list: pointer is null", "One node: n.next = n", "Stop condition for loops: p.next == head, not p.next == null"], "viz": {"type": "chain", "items": ["10", "20", "30", "10 (head)"], "caption": "Circular singly list: the last node points back to the first"}}, {"h": "Circular singly linked list: traversal", "p": ["Start at the first node, print, move to `next`, and stop when we reach the first node again. A normal `while (p != null)` loop would never end. A `do-while` handles the one-node case correctly, because the check happens after the first visit.", "Time O(n), space O(1)."], "table": {"head": ["Step", "What happens"], "rows": [["1. If list empty", "print empty and return"], ["2. p = head", "start at first node"], ["3. do: visit p", "print p.data"], ["4. p = p.next", "move ahead"], ["5. while p != head", "stop after one full round"]]}}, {"h": "Circular singly list: insert at beginning and end", "p": ["Trick: keep a pointer `last` to the last node instead of `head`. Then the first node is `last.next`. This makes both insert-at-begin and insert-at-end O(1). If we kept only `head`, insert at end would need a full walk to find the last node (O(n)).", "Insert at beginning: new.next = last.next; last.next = new. Insert at end: do the same two steps, then last = new. Empty list: last = new; new.next = new.", "Dry run: insertEnd(20) gives [20]. insertEnd(30): 30.next = 20, 20.next = 30, last = 30, ring 20-30. insertBegin(10): 10.next = 20, 30.next = 10, ring 10-20-30. insertEnd(40): ring 10-20-30-40, last = 40."], "code": {"f": "Main.java", "c": "public class Main {\n    static class Node {\n        int data; Node next;\n        Node(int d) { data = d; }\n    }\n    static Node last;   // we keep a pointer to the LAST node; last.next is the first\n\n    static void insertBegin(int x) {\n        Node n = new Node(x);\n        if (last == null) { last = n; n.next = n; return; }\n        n.next = last.next;     // new -> old first\n        last.next = n;          // last -> new first\n    }\n    static void insertEnd(int x) {\n        insertBegin(x);         // same links ...\n        last = last.next;       // ... but new node becomes last\n    }\n    static void show() {\n        if (last == null) { System.out.println(\"empty\"); return; }\n        Node p = last.next;\n        do { System.out.print(p.data + \" -> \"); p = p.next; } while (p != last.next);\n        System.out.println(\"(back to \" + last.next.data + \")\");\n    }\n    public static void main(String[] args) {\n        insertEnd(20); insertEnd(30); insertBegin(10); insertEnd(40);\n        show();\n        System.out.println(\"first = \" + last.next.data + \", last = \" + last.data);\n    }\n}", "out": "10 -> 20 -> 30 -> 40 -> (back to 10)\nfirst = 10, last = 40", "cpp": {"f": "main.cpp", "c": "#include <iostream>\nusing namespace std;\n\nstruct Node {\n    int data; Node* next;\n    Node(int d) : data(d), next(nullptr) {}\n};\nNode* last = nullptr;   // we keep a pointer to the LAST node; last->next is the first\n\nvoid insertBegin(int x) {\n    Node* n = new Node(x);\n    if (last == nullptr) { last = n; n->next = n; return; }\n    n->next = last->next;     // new -> old first\n    last->next = n;           // last -> new first\n}\nvoid insertEnd(int x) {\n    insertBegin(x);           // same links ...\n    last = last->next;        // ... but new node becomes last\n}\nvoid show() {\n    if (last == nullptr) { cout << \"empty\\n\"; return; }\n    Node* p = last->next;\n    do { cout << p->data << \" -> \"; p = p->next; } while (p != last->next);\n    cout << \"(back to \" << last->next->data << \")\\n\";\n}\nint main() {\n    insertEnd(20); insertEnd(30); insertBegin(10); insertEnd(40);\n    show();\n    cout << \"first = \" << last->next->data << \", last = \" << last->data << \"\\n\";\n    // cleanup: break the circle, then free\n    Node* p = last->next; last->next = nullptr;\n    while (p) { Node* t = p; p = p->next; delete t; }\n    return 0;\n}\n"}, "clang": {"f": "main.c", "c": "#include <stdio.h>\n#include <stdlib.h>\n\ntypedef struct Node { int data; struct Node *next; } Node;\nNode *mk(int d) { Node *n = malloc(sizeof(Node)); n->data = d; n->next = NULL; return n; }\nNode *last = NULL;   /* pointer to the LAST node; last->next is the first */\n\nvoid insertBegin(int x) {\n    Node *n = mk(x);\n    if (last == NULL) { last = n; n->next = n; return; }\n    n->next = last->next;     /* new -> old first */\n    last->next = n;           /* last -> new first */\n}\nvoid insertEnd(int x) {\n    insertBegin(x);           /* same links ... */\n    last = last->next;        /* ... but new node becomes last */\n}\nvoid show() {\n    if (last == NULL) { printf(\"empty\\n\"); return; }\n    Node *p = last->next;\n    do { printf(\"%d -> \", p->data); p = p->next; } while (p != last->next);\n    printf(\"(back to %d)\\n\", last->next->data);\n}\nint main() {\n    insertEnd(20); insertEnd(30); insertBegin(10); insertEnd(40);\n    show();\n    printf(\"first = %d, last = %d\\n\", last->next->data, last->data);\n    /* cleanup: break the circle, then free */\n    Node *p = last->next; last->next = NULL;\n    while (p) { Node *t = p; p = p->next; free(t); }\n    return 0;\n}\n"}}, "table": {"head": ["Step", "What happens"], "rows": [["1. n = new Node(x)", "create node"], ["2. If last == null", "last = n; n.next = n; stop"], ["3. n.next = last.next", "new points to current first"], ["4. last.next = n", "last points to new node (new is first now)"], ["5. For insert at END only", "last = n"]]}}, {"h": "Circular singly list: deletion", "p": ["Delete first: last.next = last.next.next (if only one node, set last = null). Delete a node with a key: walk with two pointers `prev` and `cur`, link prev.next = cur.next. If the deleted node was `last`, move `last = prev`. Handle the single-node case separately.", "Cost: delete first O(1); delete by key O(n); delete last O(n) in singly circular, because we need the node before last."], "warn": "Forgetting to update `last` when the last node is deleted leaves a dangling pointer to a removed node.", "code": {"f": "Main.java", "c": "public class Main {\n    static class Node {\n        int data; Node next;\n        Node(int d) { data = d; }\n    }\n    static Node last;\n\n    static void insertEnd(int x) {\n        Node n = new Node(x);\n        if (last == null) { last = n; n.next = n; return; }\n        n.next = last.next; last.next = n; last = n;\n    }\n    static void deleteFirst() {\n        if (last == null) return;\n        if (last.next == last) last = null;       // only one node\n        else last.next = last.next.next;\n    }\n    static void delete(int key) {\n        if (last == null) return;\n        Node prev = last, cur = last.next;\n        do {\n            if (cur.data == key) {\n                if (cur == prev) { last = null; return; }   // single node\n                prev.next = cur.next;\n                if (cur == last) last = prev;\n                return;\n            }\n            prev = cur; cur = cur.next;\n        } while (prev != last);\n        System.out.println(key + \" not found\");\n    }\n    static void show() {\n        if (last == null) { System.out.println(\"empty\"); return; }\n        Node p = last.next;\n        do { System.out.print(p.data + \" \"); p = p.next; } while (p != last.next);\n        System.out.println();\n    }\n    public static void main(String[] args) {\n        for (int i = 10; i <= 50; i += 10) insertEnd(i);\n        show();\n        deleteFirst(); show();\n        delete(30); show();\n        delete(50); show();\n        delete(99);\n    }\n}", "out": "10 20 30 40 50 \n20 30 40 50 \n20 40 50 \n20 40 \n99 not found", "cpp": {"f": "main.cpp", "c": "#include <iostream>\nusing namespace std;\n\nstruct Node {\n    int data; Node* next;\n    Node(int d) : data(d), next(nullptr) {}\n};\nNode* last = nullptr;\n\nvoid insertEnd(int x) {\n    Node* n = new Node(x);\n    if (last == nullptr) { last = n; n->next = n; return; }\n    n->next = last->next; last->next = n; last = n;\n}\nvoid deleteFirst() {\n    if (last == nullptr) return;\n    if (last->next == last) { delete last; last = nullptr; }   // only one node\n    else { Node* old = last->next; last->next = old->next; delete old; }\n}\nvoid del(int key) {   // 'delete' is a C++ keyword\n    if (last == nullptr) return;\n    Node *prev = last, *cur = last->next;\n    do {\n        if (cur->data == key) {\n            if (cur == prev) { delete cur; last = nullptr; return; }   // single node\n            prev->next = cur->next;\n            if (cur == last) last = prev;\n            delete cur;\n            return;\n        }\n        prev = cur; cur = cur->next;\n    } while (prev != last);\n    cout << key << \" not found\\n\";\n}\nvoid show() {\n    if (last == nullptr) { cout << \"empty\\n\"; return; }\n    Node* p = last->next;\n    do { cout << p->data << \" \"; p = p->next; } while (p != last->next);\n    cout << \"\\n\";\n}\nint main() {\n    for (int i = 10; i <= 50; i += 10) insertEnd(i);\n    show();\n    deleteFirst(); show();\n    del(30); show();\n    del(50); show();\n    del(99);\n    return 0;\n}\n"}, "clang": {"f": "main.c", "c": "#include <stdio.h>\n#include <stdlib.h>\n\ntypedef struct Node { int data; struct Node *next; } Node;\nNode *mk(int d) { Node *n = malloc(sizeof(Node)); n->data = d; n->next = NULL; return n; }\nNode *last = NULL;\n\nvoid insertEnd(int x) {\n    Node *n = mk(x);\n    if (last == NULL) { last = n; n->next = n; return; }\n    n->next = last->next; last->next = n; last = n;\n}\nvoid deleteFirst() {\n    if (last == NULL) return;\n    if (last->next == last) { free(last); last = NULL; }   /* only one node */\n    else { Node *old = last->next; last->next = old->next; free(old); }\n}\nvoid del(int key) {\n    if (last == NULL) return;\n    Node *prev = last, *cur = last->next;\n    do {\n        if (cur->data == key) {\n            if (cur == prev) { free(cur); last = NULL; return; }   /* single node */\n            prev->next = cur->next;\n            if (cur == last) last = prev;\n            free(cur);\n            return;\n        }\n        prev = cur; cur = cur->next;\n    } while (prev != last);\n    printf(\"%d not found\\n\", key);\n}\nvoid show() {\n    if (last == NULL) { printf(\"empty\\n\"); return; }\n    Node *p = last->next;\n    do { printf(\"%d \", p->data); p = p->next; } while (p != last->next);\n    printf(\"\\n\");\n}\nint main() {\n    for (int i = 10; i <= 50; i += 10) insertEnd(i);\n    show();\n    deleteFirst(); show();\n    del(30); show();\n    del(50); show();\n    del(99);\n    return 0;\n}\n"}}, "table": {"head": ["Step", "What happens"], "rows": [["1. Empty?", "return"], ["2. Single node (last.next == last)?", "last = null"], ["3. Else find prev and cur", "cur.data == key"], ["4. prev.next = cur.next", "bypass cur"], ["5. If cur == last", "last = prev"]]}}, {"h": "Circular doubly linked list", "p": ["Here each node has `prev` and `next`. The first node's `prev` is the last node and the last node's `next` is the first node. So with just `head` we reach the last node in O(1) as `head.prev`. We can traverse clockwise (next) or anticlockwise (prev).", "Insert at end: tail = head.prev; new.next = head; new.prev = tail; tail.next = new; head.prev = new. Insert at beginning: same, then head = new. Delete head: head.prev.next = head.next; head.next.prev = head.prev; head = head.next."], "code": {"f": "Main.java", "c": "public class Main {\n    static class Node {\n        int data; Node prev, next;\n        Node(int d) { data = d; }\n    }\n    static Node head;\n\n    static void insertEnd(int x) {\n        Node n = new Node(x);\n        if (head == null) { head = n; n.next = n.prev = n; return; }\n        Node tail = head.prev;         // last node is found in O(1)\n        n.next = head; n.prev = tail;\n        tail.next = n; head.prev = n;\n    }\n    static void insertBegin(int x) {\n        insertEnd(x);\n        head = head.prev;              // new node becomes head\n    }\n    static void deleteFirst() {\n        if (head == null) return;\n        if (head.next == head) { head = null; return; }\n        head.prev.next = head.next;\n        head.next.prev = head.prev;\n        head = head.next;\n    }\n    static void forward() {\n        Node p = head;\n        do { System.out.print(p.data + \" \"); p = p.next; } while (p != head);\n        System.out.println();\n    }\n    static void backward() {\n        Node p = head.prev;\n        do { System.out.print(p.data + \" \"); p = p.prev; } while (p != head.prev);\n        System.out.println();\n    }\n    public static void main(String[] args) {\n        insertEnd(20); insertEnd(30); insertBegin(10); insertEnd(40);\n        forward(); backward();\n        deleteFirst();\n        forward(); backward();\n    }\n}", "out": "10 20 30 40 \n40 30 20 10 \n20 30 40 \n40 30 20 ", "cpp": {"f": "main.cpp", "c": "#include <iostream>\nusing namespace std;\n\nstruct Node {\n    int data; Node *prev, *next;\n    Node(int d) : data(d), prev(nullptr), next(nullptr) {}\n};\nNode* head = nullptr;\n\nvoid insertEnd(int x) {\n    Node* n = new Node(x);\n    if (head == nullptr) { head = n; n->next = n->prev = n; return; }\n    Node* tail = head->prev;       // last node is found in O(1)\n    n->next = head; n->prev = tail;\n    tail->next = n; head->prev = n;\n}\nvoid insertBegin(int x) {\n    insertEnd(x);\n    head = head->prev;             // new node becomes head\n}\nvoid deleteFirst() {\n    if (head == nullptr) return;\n    if (head->next == head) { delete head; head = nullptr; return; }\n    Node* old = head;\n    head->prev->next = head->next;\n    head->next->prev = head->prev;\n    head = head->next;\n    delete old;\n}\nvoid forward() {\n    Node* p = head;\n    do { cout << p->data << \" \"; p = p->next; } while (p != head);\n    cout << \"\\n\";\n}\nvoid backward() {\n    Node* p = head->prev;\n    do { cout << p->data << \" \"; p = p->prev; } while (p != head->prev);\n    cout << \"\\n\";\n}\nint main() {\n    insertEnd(20); insertEnd(30); insertBegin(10); insertEnd(40);\n    forward(); backward();\n    deleteFirst();\n    forward(); backward();\n    return 0;\n}\n"}, "clang": {"f": "main.c", "c": "#include <stdio.h>\n#include <stdlib.h>\n\ntypedef struct Node { int data; struct Node *prev, *next; } Node;\nNode *mk(int d) { Node *n = malloc(sizeof(Node)); n->data = d; n->prev = n->next = NULL; return n; }\nNode *head = NULL;\n\nvoid insertEnd(int x) {\n    Node *n = mk(x);\n    if (head == NULL) { head = n; n->next = n->prev = n; return; }\n    Node *tail = head->prev;       /* last node is found in O(1) */\n    n->next = head; n->prev = tail;\n    tail->next = n; head->prev = n;\n}\nvoid insertBegin(int x) {\n    insertEnd(x);\n    head = head->prev;             /* new node becomes head */\n}\nvoid deleteFirst() {\n    if (head == NULL) return;\n    if (head->next == head) { free(head); head = NULL; return; }\n    Node *old = head;\n    head->prev->next = head->next;\n    head->next->prev = head->prev;\n    head = head->next;\n    free(old);\n}\nvoid forward() {\n    Node *p = head;\n    do { printf(\"%d \", p->data); p = p->next; } while (p != head);\n    printf(\"\\n\");\n}\nvoid backward() {\n    Node *p = head->prev;\n    do { printf(\"%d \", p->data); p = p->prev; } while (p != head->prev);\n    printf(\"\\n\");\n}\nint main() {\n    insertEnd(20); insertEnd(30); insertBegin(10); insertEnd(40);\n    forward(); backward();\n    deleteFirst();\n    forward(); backward();\n    return 0;\n}\n"}}, "viz": {"type": "chain", "items": ["10", "20", "30", "10 (head)"], "labels": ["next", "next", "next"], "caption": "next links go clockwise; prev links (not drawn) go back, and head.prev = 30"}}, {"h": "Complexity", "p": ["n = number of nodes. Space is O(n) for the list and O(1) extra for each operation."], "table": {"head": ["Operation", "Circular singly (last ptr)", "Circular doubly (head ptr)"], "rows": [["Insert at beginning", "O(1)", "O(1)"], ["Insert at end", "O(1)", "O(1)"], ["Delete first", "O(1)", "O(1)"], ["Delete last", "O(n)", "O(1)"], ["Delete given key", "O(n)", "O(n) find + O(1) unlink"], ["Traversal", "O(n)", "O(n) both ways"], ["Search", "O(n)", "O(n)"], ["Extra space per node", "1 pointer", "2 pointers"]]}}, {"h": "Applications: round robin and Josephus", "p": ["Round-robin CPU scheduling: each process gets a fixed time quantum, then goes to the back of the queue. A circular list models this naturally, because moving to the next process is just `cur = cur.next`, and finished processes are unlinked. Below: quantum 3, processes P1(5), P2(2), P3(4).", "The Josephus problem (people in a circle, every k-th is eliminated) is another classic. Below: n = 5, k = 2."], "tip": "Josephus example for the exam: n = 5, k = 2 eliminates 2, 4, 1, 5 and survivor is 3.", "code": {"f": "Main.java", "c": "public class Main {\n    static class Node {\n        String pid; int burst; Node next;\n        Node(String p, int b) { pid = p; burst = b; }\n    }\n    public static void main(String[] args) {\n        int quantum = 3;\n        // circular list of processes P1(5) P2(2) P3(4)\n        Node a = new Node(\"P1\", 5), b = new Node(\"P2\", 2), c = new Node(\"P3\", 4);\n        a.next = b; b.next = c; c.next = a;\n        Node cur = a, prev = c;\n        int time = 0, left = 3;\n        while (left > 0) {\n            int run = Math.min(quantum, cur.burst);\n            time += run; cur.burst -= run;\n            System.out.println(\"t=\" + time + \" ran \" + cur.pid + \" for \" + run\n                + (cur.burst == 0 ? \" -> finished\" : \" (left \" + cur.burst + \")\"));\n            if (cur.burst == 0) { prev.next = cur.next; left--; }   // remove from circle\n            else prev = cur;\n            cur = cur.next;\n        }\n    }\n}", "out": "t=3 ran P1 for 3 (left 2)\nt=5 ran P2 for 2 -> finished\nt=8 ran P3 for 3 (left 1)\nt=10 ran P1 for 2 -> finished\nt=11 ran P3 for 1 -> finished", "cpp": {"f": "main.cpp", "c": "#include <iostream>\n#include <string>\n#include <algorithm>\nusing namespace std;\n\nstruct Node {\n    string pid; int burst; Node* next;\n    Node(string p, int b) : pid(p), burst(b), next(nullptr) {}\n};\nint main() {\n    int quantum = 3;\n    // circular list of processes P1(5) P2(2) P3(4)\n    Node *a = new Node(\"P1\", 5), *b = new Node(\"P2\", 2), *c = new Node(\"P3\", 4);\n    a->next = b; b->next = c; c->next = a;\n    Node *cur = a, *prev = c;\n    int time = 0, left = 3;\n    while (left > 0) {\n        int run = min(quantum, cur->burst);\n        time += run; cur->burst -= run;\n        cout << \"t=\" << time << \" ran \" << cur->pid << \" for \" << run\n             << (cur->burst == 0 ? \" -> finished\" : \" (left \" + to_string(cur->burst) + \")\") << \"\\n\";\n        if (cur->burst == 0) { prev->next = cur->next; left--; }   // remove from circle\n        else prev = cur;\n        cur = cur->next;\n    }\n    delete a; delete b; delete c;\n    return 0;\n}\n"}, "clang": {"f": "main.c", "c": "#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\n\ntypedef struct Node { char pid[4]; int burst; struct Node *next; } Node;\nNode *mk(const char *p, int b) { Node *n = malloc(sizeof(Node)); strcpy(n->pid, p); n->burst = b; n->next = NULL; return n; }\n\nint main() {\n    int quantum = 3;\n    /* circular list of processes P1(5) P2(2) P3(4) */\n    Node *a = mk(\"P1\", 5), *b = mk(\"P2\", 2), *c = mk(\"P3\", 4);\n    a->next = b; b->next = c; c->next = a;\n    Node *cur = a, *prev = c;\n    int time = 0, left = 3;\n    while (left > 0) {\n        int run = quantum < cur->burst ? quantum : cur->burst;\n        time += run; cur->burst -= run;\n        printf(\"t=%d ran %s for %d\", time, cur->pid, run);\n        if (cur->burst == 0) printf(\" -> finished\\n\"); else printf(\" (left %d)\\n\", cur->burst);\n        if (cur->burst == 0) { prev->next = cur->next; left--; }   /* remove from circle */\n        else prev = cur;\n        cur = cur->next;\n    }\n    free(a); free(b); free(c);\n    return 0;\n}\n"}}}, {"h": "Josephus problem code", "p": ["Build the ring, then repeatedly move k-1 steps, remove the next node, and continue from the node after it. The loop ends when one node points to itself."], "code": {"f": "Main.java", "c": "public class Main {\n    static class Node { int id; Node next; Node(int i) { id = i; } }\n    public static void main(String[] args) {\n        int n = 5, k = 2;\n        Node head = new Node(1), p = head;\n        for (int i = 2; i <= n; i++) { p.next = new Node(i); p = p.next; }\n        p.next = head;                         // close the circle\n        Node prev = p;                         // node before head\n        Node cur = head;\n        while (cur.next != cur) {\n            for (int i = 1; i < k; i++) { prev = cur; cur = cur.next; }\n            System.out.println(\"eliminated \" + cur.id);\n            prev.next = cur.next; cur = cur.next;\n        }\n        System.out.println(\"survivor \" + cur.id);\n    }\n}", "out": "eliminated 2\neliminated 4\neliminated 1\neliminated 5\nsurvivor 3", "cpp": {"f": "main.cpp", "c": "#include <iostream>\nusing namespace std;\n\nstruct Node { int id; Node* next; Node(int i) : id(i), next(nullptr) {} };\nint main() {\n    int n = 5, k = 2;\n    Node *head = new Node(1), *p = head;\n    for (int i = 2; i <= n; i++) { p->next = new Node(i); p = p->next; }\n    p->next = head;                        // close the circle\n    Node* prev = p;                        // node before head\n    Node* cur = head;\n    while (cur->next != cur) {\n        for (int i = 1; i < k; i++) { prev = cur; cur = cur->next; }\n        cout << \"eliminated \" << cur->id << \"\\n\";\n        Node* old = cur;\n        prev->next = cur->next; cur = cur->next;\n        delete old;\n    }\n    cout << \"survivor \" << cur->id << \"\\n\";\n    delete cur;\n    return 0;\n}\n"}, "clang": {"f": "main.c", "c": "#include <stdio.h>\n#include <stdlib.h>\n\ntypedef struct Node { int id; struct Node *next; } Node;\nNode *mk(int i) { Node *n = malloc(sizeof(Node)); n->id = i; n->next = NULL; return n; }\n\nint main() {\n    int n = 5, k = 2;\n    Node *head = mk(1), *p = head;\n    for (int i = 2; i <= n; i++) { p->next = mk(i); p = p->next; }\n    p->next = head;                        /* close the circle */\n    Node *prev = p;                        /* node before head */\n    Node *cur = head;\n    while (cur->next != cur) {\n        for (int i = 1; i < k; i++) { prev = cur; cur = cur->next; }\n        printf(\"eliminated %d\\n\", cur->id);\n        Node *old = cur;\n        prev->next = cur->next; cur = cur->next;\n        free(old);\n    }\n    printf(\"survivor %d\\n\", cur->id);\n    free(cur);\n    return 0;\n}\n"}}}], "analogy": "Kids sitting in a circle for a game. After the last kid, the turn goes back to the first kid. There is no 'end of line'. You can start from any kid and still visit everyone once.", "hinglish": "Bhai circular linked list me last node ka next pointer null nahi hota, wo wapas first node ko point karta hai. To list ek gola ban jaati hai. Traverse karte time bas yaad rakho ki jab wapas start pe aa jao to ruk jao, warna infinite loop.", "mistakes": ["Writing while (p != null) in a circular list: infinite loop.", "Using while (p != head) with p = head at the start: the loop never runs. Use do-while.", "Not updating last when the last node is inserted or deleted.", "Forgetting to set n.next = n for the first node in an empty list.", "Not handling the single-node deletion case."], "remember": ["Circular linked list: last node's link points to the first node, not null.", "Types: circular singly and circular doubly.", "Empty list pointer = null; single node: n.next = n.", "Traverse with do-while; stop when p == head again.", "Keep a pointer to the last node: last.next is first, so insert at begin/end is O(1).", "Insert at begin: n.next = last.next; last.next = n. For end also last = n.", "Delete first: last.next = last.next.next (single node: last = null).", "Delete last in circular singly is O(n); in circular doubly it is O(1).", "Circular doubly: head.prev = last, last.next = head.", "Any node can be the starting point, so the list needs no special end marker.", "Applications: round-robin scheduling, Josephus, multiplayer turns, circular buffer, music loop.", "Using p.next != null as loop condition gives an infinite loop in a CLL."], "uses": ["Round-robin CPU scheduling", "Multiplayer game turns", "Circular buffer / queue implementation", "Music or image slideshow that loops", "Josephus problem and token ring networks"], "pros": ["Any node can be the start", "Insert at begin and end is O(1) with a last pointer", "Natural for repeating, cyclic tasks"], "cons": ["Risk of infinite loop if the stop condition is wrong", "Harder to detect the end of the list", "Delete last in circular singly is O(n)"], "def": "In a circular linked list (CLL) the last node does not store `null`. It stores the address of the first node, so the nodes form a ring. Any node can act as the starting point."}, "u4-t5": {"tldr": "Heap sort turns the array into a max-heap, then repeatedly moves the biggest element to the end. O(n log n) always, O(1) extra space.", "sections": [{"h": "Heap and the heap property", "p": ["Max-heap property: every node is greater than or equal to its children, so the root is the maximum. Min-heap property: every node is less than or equal to its children, so the root is the minimum. Heap sort (ascending) uses a max-heap."], "pts": ["Complete binary tree shape", "Max-heap: parent >= children (root = max)", "Min-heap: parent <= children (root = min)", "Siblings have no order between them"], "viz": {"type": "btree", "nodes": ["50", "30", "40", "10", "20", "35"], "caption": "Max-heap: each parent >= its children"}}, {"h": "Array representation", "p": ["With 0-based indexing, node i has left child 2i+1, right child 2i+2 and parent (i-1)/2 (integer division). The last non-leaf node is at index n/2 - 1; all nodes after it are leaves, and a leaf is already a valid heap."], "code": {"f": "Main.java", "c": "public class Main {\n    public static void main(String[] args) {\n        int[] heap = {50, 30, 40, 10, 20, 35};\n        for (int i = 0; i < heap.length; i++) {\n            int l = 2 * i + 1, r = 2 * i + 2;\n            String s = \"a[\" + i + \"]=\" + heap[i];\n            if (i > 0) s += \"  parent=\" + heap[(i - 1) / 2];\n            if (l < heap.length) s += \"  left=\" + heap[l];\n            if (r < heap.length) s += \"  right=\" + heap[r];\n            System.out.println(s);\n        }\n    }\n}", "out": "a[0]=50  left=30  right=40\na[1]=30  parent=50  left=10  right=20\na[2]=40  parent=50  left=35\na[3]=10  parent=30\na[4]=20  parent=30\na[5]=35  parent=40", "cpp": {"f": "main.cpp", "c": "#include <iostream>\n#include <vector>\n#include <string>\nusing namespace std;\n\nint main() {\n    vector<int> heap = {50, 30, 40, 10, 20, 35};\n    int n = heap.size();\n    for (int i = 0; i < n; i++) {\n        int l = 2 * i + 1, r = 2 * i + 2;\n        string s = \"a[\" + to_string(i) + \"]=\" + to_string(heap[i]);\n        if (i > 0) s += \"  parent=\" + to_string(heap[(i - 1) / 2]);\n        if (l < n) s += \"  left=\" + to_string(heap[l]);\n        if (r < n) s += \"  right=\" + to_string(heap[r]);\n        cout << s << endl;\n    }\n}\n"}, "clang": {"f": "main.c", "c": "#include <stdio.h>\n\nint main() {\n    int heap[] = {50, 30, 40, 10, 20, 35};\n    int n = 6;\n    for (int i = 0; i < n; i++) {\n        int l = 2 * i + 1, r = 2 * i + 2;\n        printf(\"a[%d]=%d\", i, heap[i]);\n        if (i > 0) printf(\"  parent=%d\", heap[(i - 1) / 2]);\n        if (l < n) printf(\"  left=%d\", heap[l]);\n        if (r < n) printf(\"  right=%d\", heap[r]);\n        printf(\"\\n\");\n    }\n    return 0;\n}\n"}}, "viz": {"type": "cells", "items": ["50", "30", "40", "10", "20", "35"], "labels": ["0", "1", "2", "3", "4", "5"], "hl": [0], "caption": "The heap above stored in an array"}}, {"h": "Heapify (sift down)", "p": ["Heapify fixes one node assuming both its subtrees are already heaps. Compare the node with its two children. If a child is bigger, swap with the BIGGER child and continue downward from there. Stop when the node is >= both children or it becomes a leaf.", "Time O(log n) because the node moves down at most the height of the tree."], "table": {"head": ["Step", "What happens"], "rows": [["1. largest = i", "l = 2i+1, r = 2i+2"], ["2. If l < n and a[l] > a[largest]", "largest = l"], ["3. If r < n and a[r] > a[largest]", "largest = r"], ["4. If largest != i", "swap a[i], a[largest]"], ["5. Recurse on largest", "heapify(a, n, largest)"]]}}, {"h": "Step 1: build the max-heap", "p": ["Leaves are already heaps. So start from the last non-leaf node n/2 - 1 and call heapify on each node going up to the root (index 0). This bottom-up build costs O(n), not O(n log n), because most nodes are near the bottom and sift only a little.", "Dry run for {4, 10, 3, 5, 1}: n = 5, so start at i = 1. heapify(1): children 5 and 1, 10 is already largest, no change. heapify(0): 4 < 10, swap, array [10, 4, 3, 5, 1]; 4 at index 1 has children 5 and 1, so swap with 5, array [10, 5, 3, 4, 1]. Max-heap done."], "table": {"head": ["Step", "What happens"], "rows": [["1. Start", "[4, 10, 3, 5, 1]"], ["2. heapify(1)", "10 >= 5, 1: no change"], ["3. heapify(0)", "swap 4 and 10 -> [10, 4, 3, 5, 1]"], ["4. Continue sift of 4", "swap 4 and 5 -> [10, 5, 3, 4, 1]"], ["5. Max-heap ready", "root 10 is the maximum"]]}}, {"h": "Step 2: sorting phase", "p": ["Repeat n-1 times: swap the root (current maximum) with the last element of the heap, reduce the heap size by one (the last position is now final and sorted), and heapify the root. The sorted part grows from the right.", "This is selection sort done with a heap: finding the max costs O(log n) instead of O(n)."], "table": {"head": ["Step", "What happens"], "rows": [["1. Build max-heap", "O(n)"], ["2. Swap a[0] with a[end]", "max goes to its final place"], ["3. end = end - 1", "heap shrinks by one"], ["4. heapify(a, end, 0)", "restore heap property"], ["5. Repeat until end = 0", "array is sorted ascending"]]}}, {"h": "Complete traced example", "p": ["The program prints the array after every step for input {4, 10, 3, 5, 1}. Compare with the dry run above: the 10 goes to the end first, then 5, then 4, then 3. The code that follows is the full heap sort you can write in the exam."], "tip": "In the output, after each 'swap' line the elements on the right of the heap are already in their final sorted position.", "code": {"f": "Main.java", "c": "import java.util.Arrays;\n\npublic class Main {\n    static void heapify(int[] a, int n, int i) {\n        int largest = i, l = 2 * i + 1, r = 2 * i + 2;\n        if (l < n && a[l] > a[largest]) largest = l;\n        if (r < n && a[r] > a[largest]) largest = r;\n        if (largest != i) {\n            int t = a[i]; a[i] = a[largest]; a[largest] = t;\n            heapify(a, n, largest);\n        }\n    }\n    public static void main(String[] args) {\n        int[] a = {4, 10, 3, 5, 1};\n        int n = a.length;\n        System.out.println(\"Input        : \" + Arrays.toString(a));\n        for (int i = n / 2 - 1; i >= 0; i--) {\n            heapify(a, n, i);\n            System.out.println(\"heapify(\" + i + \")   : \" + Arrays.toString(a));\n        }\n        System.out.println(\"-- max-heap built --\");\n        for (int end = n - 1; end > 0; end--) {\n            int t = a[0]; a[0] = a[end]; a[end] = t;\n            heapify(a, end, 0);\n            System.out.println(\"swap 0,\" + end + \"    : \" + Arrays.toString(a));\n        }\n    }\n}", "out": "Input        : [4, 10, 3, 5, 1]\nheapify(1)   : [4, 10, 3, 5, 1]\nheapify(0)   : [10, 5, 3, 4, 1]\n-- max-heap built --\nswap 0,4    : [5, 4, 3, 1, 10]\nswap 0,3    : [4, 1, 3, 5, 10]\nswap 0,2    : [3, 1, 4, 5, 10]\nswap 0,1    : [1, 3, 4, 5, 10]", "cpp": {"f": "main.cpp", "c": "#include <iostream>\n#include <vector>\n#include <string>\nusing namespace std;\n\n// like Java's Arrays.toString\nstring str(const vector<int>& a) {\n    string s = \"[\";\n    for (size_t i = 0; i < a.size(); i++) s += (i ? \", \" : \"\") + to_string(a[i]);\n    return s + \"]\";\n}\nvoid heapify(vector<int>& a, int n, int i) {\n    int largest = i, l = 2 * i + 1, r = 2 * i + 2;\n    if (l < n && a[l] > a[largest]) largest = l;\n    if (r < n && a[r] > a[largest]) largest = r;\n    if (largest != i) {\n        int t = a[i]; a[i] = a[largest]; a[largest] = t;\n        heapify(a, n, largest);\n    }\n}\nint main() {\n    vector<int> a = {4, 10, 3, 5, 1};\n    int n = a.size();\n    cout << \"Input        : \" << str(a) << endl;\n    for (int i = n / 2 - 1; i >= 0; i--) {\n        heapify(a, n, i);\n        cout << \"heapify(\" << i << \")   : \" << str(a) << endl;\n    }\n    cout << \"-- max-heap built --\" << endl;\n    for (int end = n - 1; end > 0; end--) {\n        int t = a[0]; a[0] = a[end]; a[end] = t;\n        heapify(a, end, 0);\n        cout << \"swap 0,\" << end << \"    : \" << str(a) << endl;\n    }\n}\n"}, "clang": {"f": "main.c", "c": "#include <stdio.h>\n#include <stdlib.h>\n\n/* like Java's Arrays.toString */\nvoid prt(int a[], int n) {\n    printf(\"[\");\n    for (int i = 0; i < n; i++) printf(\"%s%d\", i ? \", \" : \"\", a[i]);\n    printf(\"]\");\n}\nvoid heapify(int a[], int n, int i) {\n    int largest = i, l = 2 * i + 1, r = 2 * i + 2;\n    if (l < n && a[l] > a[largest]) largest = l;\n    if (r < n && a[r] > a[largest]) largest = r;\n    if (largest != i) {\n        int t = a[i]; a[i] = a[largest]; a[largest] = t;\n        heapify(a, n, largest);\n    }\n}\nint main() {\n    int a[] = {4, 10, 3, 5, 1};\n    int n = 5;\n    printf(\"Input        : \"); prt(a, n); printf(\"\\n\");\n    for (int i = n / 2 - 1; i >= 0; i--) {\n        heapify(a, n, i);\n        printf(\"heapify(%d)   : \", i); prt(a, n); printf(\"\\n\");\n    }\n    printf(\"-- max-heap built --\\n\");\n    for (int end = n - 1; end > 0; end--) {\n        int t = a[0]; a[0] = a[end]; a[end] = t;\n        heapify(a, end, 0);\n        printf(\"swap 0,%d    : \", end); prt(a, n); printf(\"\\n\");\n    }\n    return 0;\n}\n"}}}, {"h": "Full code", "p": ["Recursive heapify version (standard exam answer) is below. An iterative sift-down version follows, which uses no recursion stack and so really has O(1) extra space. It also shows that duplicates and already-sorted or reverse-sorted input work fine."], "warn": "Pass the heap size n (or end) to heapify. If you pass a.length every time, the already sorted elements get pulled back into the heap.", "code": {"f": "Main.java", "c": "import java.util.Arrays;\n\npublic class Main {\n    // sift element at index i down inside heap of size n (max-heap)\n    static void heapify(int[] a, int n, int i) {\n        int largest = i, l = 2 * i + 1, r = 2 * i + 2;\n        if (l < n && a[l] > a[largest]) largest = l;\n        if (r < n && a[r] > a[largest]) largest = r;\n        if (largest != i) {\n            int t = a[i]; a[i] = a[largest]; a[largest] = t;\n            heapify(a, n, largest);\n        }\n    }\n    static void heapSort(int[] a) {\n        int n = a.length;\n        for (int i = n / 2 - 1; i >= 0; i--)     // build max-heap\n            heapify(a, n, i);\n        for (int end = n - 1; end > 0; end--) {   // extract max one by one\n            int t = a[0]; a[0] = a[end]; a[end] = t;\n            heapify(a, end, 0);\n        }\n    }\n    public static void main(String[] args) {\n        int[] a = {4, 10, 3, 5, 1};\n        heapSort(a);\n        System.out.println(Arrays.toString(a));\n    }\n}", "out": "[1, 3, 4, 5, 10]", "cpp": {"f": "main.cpp", "c": "#include <iostream>\n#include <vector>\n#include <string>\nusing namespace std;\n\n// like Java's Arrays.toString\nstring str(const vector<int>& a) {\n    string s = \"[\";\n    for (size_t i = 0; i < a.size(); i++) s += (i ? \", \" : \"\") + to_string(a[i]);\n    return s + \"]\";\n}\n// sift element at index i down inside heap of size n (max-heap)\nvoid heapify(vector<int>& a, int n, int i) {\n    int largest = i, l = 2 * i + 1, r = 2 * i + 2;\n    if (l < n && a[l] > a[largest]) largest = l;\n    if (r < n && a[r] > a[largest]) largest = r;\n    if (largest != i) {\n        int t = a[i]; a[i] = a[largest]; a[largest] = t;\n        heapify(a, n, largest);\n    }\n}\nvoid heapSort(vector<int>& a) {\n    int n = a.size();\n    for (int i = n / 2 - 1; i >= 0; i--)     // build max-heap\n        heapify(a, n, i);\n    for (int end = n - 1; end > 0; end--) {   // extract max one by one\n        int t = a[0]; a[0] = a[end]; a[end] = t;\n        heapify(a, end, 0);\n    }\n}\nint main() {\n    vector<int> a = {4, 10, 3, 5, 1};\n    heapSort(a);\n    cout << str(a) << endl;\n}\n"}, "clang": {"f": "main.c", "c": "#include <stdio.h>\n#include <stdlib.h>\n\n/* like Java's Arrays.toString */\nvoid prt(int a[], int n) {\n    printf(\"[\");\n    for (int i = 0; i < n; i++) printf(\"%s%d\", i ? \", \" : \"\", a[i]);\n    printf(\"]\");\n}\n/* sift element at index i down inside heap of size n (max-heap) */\nvoid heapify(int a[], int n, int i) {\n    int largest = i, l = 2 * i + 1, r = 2 * i + 2;\n    if (l < n && a[l] > a[largest]) largest = l;\n    if (r < n && a[r] > a[largest]) largest = r;\n    if (largest != i) {\n        int t = a[i]; a[i] = a[largest]; a[largest] = t;\n        heapify(a, n, largest);\n    }\n}\nvoid heapSort(int a[], int n) {\n    for (int i = n / 2 - 1; i >= 0; i--)     /* build max-heap */\n        heapify(a, n, i);\n    for (int end = n - 1; end > 0; end--) {   /* extract max one by one */\n        int t = a[0]; a[0] = a[end]; a[end] = t;\n        heapify(a, end, 0);\n    }\n}\nint main() {\n    int a[] = {4, 10, 3, 5, 1};\n    heapSort(a, 5);\n    prt(a, 5); printf(\"\\n\");\n    return 0;\n}\n"}}}, {"h": "Iterative version and checks", "p": ["Same algorithm with a loop instead of recursion. Notice the repeated value 5 in the first input: equal values may change their relative order, which is why heap sort is not stable."], "code": {"f": "Main.java", "c": "import java.util.Arrays;\n\npublic class Main {\n    // iterative sift-down: no recursion, O(1) extra space\n    static void siftDown(int[] a, int n, int i) {\n        while (true) {\n            int big = i, l = 2 * i + 1, r = l + 1;\n            if (l < n && a[l] > a[big]) big = l;\n            if (r < n && a[r] > a[big]) big = r;\n            if (big == i) return;\n            int t = a[i]; a[i] = a[big]; a[big] = t;\n            i = big;\n        }\n    }\n    static void heapSort(int[] a) {\n        for (int i = a.length / 2 - 1; i >= 0; i--) siftDown(a, a.length, i);\n        for (int end = a.length - 1; end > 0; end--) {\n            int t = a[0]; a[0] = a[end]; a[end] = t;\n            siftDown(a, end, 0);\n        }\n    }\n    public static void main(String[] args) {\n        int[] a = {12, 11, 13, 5, 6, 7, 5};\n        heapSort(a);\n        System.out.println(Arrays.toString(a));\n        int[] b = {9, 8, 7, 6, 5};   // already reverse sorted\n        heapSort(b);\n        System.out.println(Arrays.toString(b));\n    }\n}", "out": "[5, 5, 6, 7, 11, 12, 13]\n[5, 6, 7, 8, 9]", "cpp": {"f": "main.cpp", "c": "#include <iostream>\n#include <vector>\n#include <string>\nusing namespace std;\n\n// like Java's Arrays.toString\nstring str(const vector<int>& a) {\n    string s = \"[\";\n    for (size_t i = 0; i < a.size(); i++) s += (i ? \", \" : \"\") + to_string(a[i]);\n    return s + \"]\";\n}\n// iterative sift-down: no recursion, O(1) extra space\nvoid siftDown(vector<int>& a, int n, int i) {\n    while (true) {\n        int big = i, l = 2 * i + 1, r = l + 1;\n        if (l < n && a[l] > a[big]) big = l;\n        if (r < n && a[r] > a[big]) big = r;\n        if (big == i) return;\n        int t = a[i]; a[i] = a[big]; a[big] = t;\n        i = big;\n    }\n}\nvoid heapSort(vector<int>& a) {\n    int n = a.size();\n    for (int i = n / 2 - 1; i >= 0; i--) siftDown(a, n, i);\n    for (int end = n - 1; end > 0; end--) {\n        int t = a[0]; a[0] = a[end]; a[end] = t;\n        siftDown(a, end, 0);\n    }\n}\nint main() {\n    vector<int> a = {12, 11, 13, 5, 6, 7, 5};\n    heapSort(a);\n    cout << str(a) << endl;\n    vector<int> b = {9, 8, 7, 6, 5};   // already reverse sorted\n    heapSort(b);\n    cout << str(b) << endl;\n}\n"}, "clang": {"f": "main.c", "c": "#include <stdio.h>\n#include <stdlib.h>\n\n/* like Java's Ar  root ko last element se swap karte hain, heap ka size ek kam karte hain aur root ko heapify karte hain. Ye n baar karne par array sorted ho jaata hai. Time hamesha O(n log n), extra space O(1).", "mistakes": ["Building a min-heap and expecting ascending order (use max-heap for ascending).", "Starting build-heap from the last index instead of n/2 - 1.", "Calling heapify with the full size after a swap, so sorted items re-enter the heap.", "Saying build-heap is O(n log n). The tight bound is O(n).", "Claiming heap sort is stable. It is not."], "remember": ["Heap = complete binary tree with the heap property, stored in an array.", "Max-heap: parent >= children. Min-heap: parent <= children.", "0-based: left = 2i+1, right = 2i+2, parent = (i-1)/2.", "Last non-leaf node index = n/2 - 1.", "Heapify(i): swap i with its larger child while a child is larger; O(log n).", "Build max-heap: heapify for i = n/2-1 down to 0; O(n).", "Sort: swap a[0] with a[end], end--, heapify(0); repeat n-1 times.", "Ascending order uses a max-heap; descending uses a min-heap.", "Time O(n log n) in all cases. Space O(1) in-place.", "Heap sort is not stable and not adaptive.", "Worst case is better than quick sort (O(n^2)), but quick sort is usually faster in practice (cache friendly).", "Heap sort is the same idea as selection sort, but selecting the max takes O(log n)."], "uses": ["Sorting when worst-case O(n log n) and O(1) space are both needed", "Embedded systems with little memory", "Finding the k largest/smallest elements", "Basis of priority queues and the idea behind scheduling by priority"], "pros": ["O(n log n) in every case", "In-place, O(1) extra space", "No worst-case O(n^2) like quick sort"], "cons": ["Not stable", "Not adaptive: no speed-up on nearly sorted input", "Poor cache behaviour, usually slower than quick sort in practice"], "def": "A binary heap is a complete binary tree: all levels are full except possibly the last, which is filled from the left. Because it is complete, we can store it in an array with no gaps."}, "u5-t7": {"tldr": "Multiway balanced search trees built for disks: fat nodes, tiny height, few disk reads. B+ keeps data in linked leaves.", "sections": [{"h": "Why B-trees? The disk access problem", "p": ["A balanced BST with 1 billion keys has height about 30, so a search can need around 30 disk reads. A B-tree stores many keys in one node (sized to one disk block). With about 500 children per node the height is only 3-4, so a search needs 3-4 disk reads. Databases and file systems use B-trees and B+ trees for exactly this reason."], "table": {"head": ["1 billion keys", "Balanced BST", "B-tree (m = 1000)"], "rows": [["Keys per node", "1", "up to 999"], ["Approx. height", "about 30", "about 3-4"], ["Disk reads per search", "about 30", "about 3-4"]]}}, {"h": "B-tree of order m: definition and properties", "p": ["A B-tree of order m is a self-balancing multiway search tree. Each node stores keys in sorted order, and the keys separate the ranges of its children. Insertions and deletions keep the tree balanced automatically.", "A node with k keys has k+1 children (if it is not a leaf). Keys in child i lie between key i-1 and key i, just like a BST generalised to many keys."], "pts": ["Every node has at most m children and at most m-1 keys.", "Every internal node except the root has at least ceil(m/2) children (so at least ceil(m/2)-1 keys).", "The root has at least 2 children if it is not a leaf (a leaf root may have 1 or more keys).", "All leaves are at the same level, so the tree is perfectly height balanced.", "Keys inside a node are sorted; a node with k keys has k+1 children."], "tip": "Books differ: Knuth/most Indian syllabi use order m (max children). CLRS uses minimum degree t (max children 2t). Read the question and state which one you use.", "table": {"head": ["Order m", "Max children", "Max keys", "Min children (non-root internal)", "Min keys"], "rows": [["3", "3", "2", "2", "1"], ["4", "4", "3", "2", "1"], ["5", "5", "4", "3", "2"], ["6", "6", "5", "3", "2"]]}}, {"h": "Searching in a B-tree", "p": ["Search is the BST search extended to many keys. In a node, find the first key that is greater than or equal to the target. If it is equal, we are done. Otherwise go down into the child between the two keys. If we reach a leaf without finding it, the key is absent."], "pts": ["Time (CPU): O(log n) levels x O(m) scan per node (or O(log m) with binary search).", "Disk reads: O(log_m n), the height of the tree.", "Space: O(n) for n keys."], "table": {"head": ["Step", "What happens"], "rows": [["1. Start at root", "x = root"], ["2. Scan keys of x", "find first i with key[i] >= target"], ["3. Match?", "key[i] == target: found, stop"], ["4. Leaf?", "x is leaf and no match: not found"], ["5. Descend", "x = child[i], go to step 2"]]}}, {"h": "Insertion with node split", "p": ["Insertion always happens at a leaf. Search down to the correct leaf and put the key in sorted position. If the leaf now has m keys (one too many), it overflows and must split."], "pts": ["The tree grows at the ROOT, never at the leaves. That is why all leaves stay on one level.", "Insert is O(log n) levels; each split costs O(m). Total CPU O(m log_m n), disk reads O(log_m n).", "Space for one insert: O(1) extra (a split creates one new node)."], "warn": "Do not insert into the middle of the tree. New keys start in a leaf; only the median key of a split moves up.", "table": {"head": ["Step", "What happens"], "rows": [["1. Find leaf", "search down; key goes into the right leaf"], ["2. Insert sorted", "place key inside the leaf"], ["3. Overflow?", "if keys <= m-1, done"], ["4. Split", "median key goes up to the parent; left half and right half become two nodes"], ["5. Repeat upward", "parent may overflow too; split again"], ["6. Root splits", "make a new root with the median: height grows by 1"]]}}, {"h": "Traced example: order 3, insert 10, 20, 30, 40, 50, 60, 70", "p": ["Order 3 means at most 2 keys per node. A node with 3 keys overflows and splits: the middle key goes up, the smaller key stays left, the larger key goes right. This is the classic 2-3 tree. The diagram shows the final tree; the steps are below it."], "pts": ["Insert 10, 20: one leaf [10 20] (it is the root).", "Insert 30: [10 20 30] overflows. Split, 20 goes up: root [20], leaves [10] and [30].", "Insert 40: goes right of 20, leaf becomes [30 40].", "Insert 50: [30 40 50] overflows. 40 goes up: root [20 40], leaves [10] [30] [50].", "Insert 60: leaf becomes [50 60].", "Insert 70: [50 60 70] overflows, 60 goes up and root [20 40 60] overflows too. 40 goes up to a new root: height becomes 3."], "tip": "The program prints the tree as [keys](children...). Compare each line with the dry run above.", "code": {"f": "Main.java", "c": "public class Main {\n    static final int M = 3;                 // order: max 3 children, max 2 keys\n    static class Node {\n        int[] keys = new int[M];            // one spare slot for overflow\n        Node[] kids = new Node[M + 1];\n        int n = 0;\n        boolean leaf = true;\n    }\n    static int upKey;\n    static Node upNode;                     // set when a child split\n\n    static boolean search(Node x, int k) {\n        int i = 0;\n        while (i < x.n && k > x.keys[i]) i++;\n        if (i < x.n && x.keys[i] == k) return true;\n        return !x.leaf && search(x.kids[i], k);\n    }\n\n    static void insert(Node x, int k) {\n        int i = 0;\n        while (i < x.n && x.keys[i] < k) i++;\n        if (x.leaf) {\n            for (int j = x.n; j > i; j--) x.keys[j] = x.keys[j - 1];\n            x.keys[i] = k;\n            x.n++;\n        } else {\n            insert(x.kids[i], k);\n            if (upNode != null) {           // absorb the promoted key\n                for (int j = x.n; j > i; j--) x.keys[j] = x.keys[j - 1];\n                for (int j = x.n + 1; j > i + 1; j--) x.kids[j] = x.kids[j - 1];\n                x.keys[i] = upKey;\n                x.kids[i + 1] = upNode;\n                upNode = null;\n                x.n++;\n            }\n        }\n        if (x.n == M) {                     // overflow -> split\n            int mid = M / 2;\n            Node r = new Node();\n            r.leaf = x.leaf;\n            for (int j = mid + 1; j < M; j++) {\n                r.keys[r.n] = x.keys[j];\n                r.kids[r.n] = x.kids[j];\n                r.n++;\n            }\n            r.kids[r.n] = x.kids[M];\n            for (int j = mid + 1; j <= M; j++) x.kids[j] = null;\n            upKey = x.keys[mid];\n            upNode = r;\n            x.n = mid;\n        }\n    }\n\n    static Node add(Node root, int k) {\n        insert(root, k);\n        if (upNode != null) {               // root split -> tree grows\n            Node nr = new Node();\n            nr.leaf = false;\n            nr.keys[0] = upKey;\n            nr.kids[0] = root;\n            nr.kids[1] = upNode;\n            nr.n = 1;\n            upNode = null;\n            return nr;\n        }\n        return root;\n    }\n\n    static String show(Node x) {\n        StringBuilder sb = new StringBuilder(\"[\");\n        for (int i = 0; i < x.n; i++) sb.append(i > 0 ? \" \" : \"\").append(x.keys[i]);\n        sb.append(\"]\");\n        if (!x.leaf) {\n            sb.append(\"(\");\n            for (int i = 0; i <= x.n; i++) sb.append(i > 0 ? \" \" : \"\").append(show(x.kids[i]));\n            sb.append(\")\");\n        }\n        return sb.toString();\n    }\n\n    public static void main(String[] args) {\n        Node root = new Node();\n        for (int k = 10; k <= 70; k += 10) {\n            root = add(root, k);\n            System.out.println(\"insert \" + k + \" -> \" + show(root));\n        }\n        System.out.println(\"search 50: \" + search(root, 50));\n        System.out.println(\"search 55: \" + search(root, 55));\n    }\n}", "out": "insert 10 -> [10]\ninsert 20 -> [10 20]\ninsert 30 -> [20]([10] [30])\ninsert 40 -> [20]([10] [30 40])\ninsert 50 -> [20 40]([10] [30] [50])\ninsert 60 -> [20 40]([10] [30] [50 60])\ninsert 70 -> [40]([20]([10] [30]) [60]([50] [70]))\nsearch 50: true\nsearch 55: false", "cpp": {"f": "main.cpp", "c": "#include <iostream>\n#include <string>\nusing namespace std;\n\nconst int M = 3;                 // order: max 3 children, max 2 keys\nstruct Node {\n    int keys[M] = {};            // one spare slot for overflow\n    Node* kids[M + 1] = {};\n    int n = 0;\n    bool leaf = true;\n};\nint upKey;\nNode* upNode = nullptr;          // set when a child split\n\nbool search(Node* x, int k) {\n    int i = 0;\n    while (i < x->n && k > x->keys[i]) i++;\n    if (i < x->n && x->keys[i] == k) return true;\n    return !x->leaf && search(x->kids[i], k);\n}\n\nvoid insert(Node* x, int k) {\n    int i = 0;\n    while (i < x->n && x->keys[i] < k) i++;\n    if (x->leaf) {\n        for (int j = x->n; j > i; j--) x->keys[j] = x->keys[j - 1];\n        x->keys[i] = k;\n        x->n++;\n    } else {\n        insert(x->kids[i], k);\n        if (upNode != nullptr) {           // absorb the promoted key\n            for (int j = x->n; j > i; j--) x->keys[j] = x->keys[j - 1];\n            for (int j = x->n + 1; j > i + 1; j--) x->kids[j] = x->kids[j - 1];\n            x->keys[i] = upKey;\n            x->kids[i + 1] = upNode;\n            upNode = nullptr;\n            x->n++;\n        }\n    }\n    if (x->n == M) {                       // overflow -> split\n        int mid = M / 2;\n        Node* r = new Node();\n        r->leaf = x->leaf;\n        for (int j = mid + 1; j < M; j++) {\n            r->keys[r->n] = x->keys[j];\n            r->kids[r->n] = x->kids[j];\n            r->n++;\n        }\n        r->kids[r->n] = x->kids[M];\n        for (int j = mid + 1; j <= M; j++) x->kids[j] = nullptr;\n        upKey = x->keys[mid];\n        upNode = r;\n        x->n = mid;\n    }\n}\n\nNode* add(Node* root, int k) {\n    insert(root, k);\n    if (upNode != nullptr) {               // root split -> tree grows\n        Node* nr = new Node();\n        nr->leaf = false;\n        nr->keys[0] = upKey;\n        nr->kids[0] = root;\n        nr->kids[1] = upNode;\n        nr->n = 1;\n        upNode = nullptr;\n        return nr;\n    }\n    return root;\n}\n\nstring show(Node* x) {\n    string sb = \"[\";\n    for (int i = 0; i < x->n; i++) sb += (i > 0 ? \" \" : \"\") + to_string(x->keys[i]);\n    sb += \"]\";\n    if (!x->leaf) {\n        sb += \"(\";\n        for (int i = 0; i <= x->n; i++) sb += (i > 0 ? \" \" : \"\") + show(x->kids[i]);\n        sb += \")\";\n    }\n    return sb;\n}\n\nint main() {\n    Node* root = new Node();\n    for (int k = 10; k <= 70; k += 10) {\n        root = add(root, k);\n        cout << \"insert \" << k << \" -> \" << show(root) << endl;\n    }\n    cout << boolalpha << \"search 50: \" << search(root, 50) << endl;\n    cout << \"search 55: \" << search(root, 55) << endl;\n}\n"}, "clang": {"f": "main.c", "c": "#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\n#define M 3                      /* order: max 3 children, max 2 keys */\n\ntypedef struct Node {\n    int keys[M];                 /* one spare slot for overflow */\n    struct Node *kids[M + 1];\n    int n;\n    int leaf;\n} Node;\nNode *newNode() { Node *x = calloc(1, sizeof(Node)); x->leaf = 1; return x; }\n\nint upKey;\nNode *upNode = NULL;             /* set when a child split */\n\nint search(Node *x, int k) {\n    int i = 0;\n    while (i < x->n && k > x->keys[i]) i++;\n    if (i < x->n && x->keys[i] == k) return 1;\n    return !x->leaf && search(x->kids[i], k);\n}\n\nvoid insert(Node *x, int k) {\n    int i = 0;\n    while (i < x->n && x->keys[i] < k) i++;\n    if (x->leaf) {\n        for (int j = x->n; j > i; j--) x->keys[j] = x->keys[j - 1];\n        x->keys[i] = k;\n        x->n++;\n    } else {\n        insert(x->kids[i], k);\n        if (upNode != NULL) {              /* absorb the promoted key */\n            for (int j = x->n; j > i; j--) x->keys[j] = x->keys[j - 1];\n            for (int j = x->n + 1; j > i + 1; j--) x->kids[j] = x->kids[j - 1];\n            x->keys[i] = upKey;\n            x->kids[i + 1] = upNode;\n            upNode = NULL;\n            x->n++;\n        }\n    }\n    if (x->n == M) {                       /* overflow -> split */\n        int mid = M / 2;\n        Node *r = newNode();\n        r->leaf = x->leaf;\n        for (int j = mid + 1; j < M; j++) {\n            r->keys[r->n] = x->keys[j];\n            r->kids[r->n] = x->kids[j];\n            r->n++;\n        }\n        r->kids[r->n] = x->kids[M];\n        for (int j = mid + 1; j <= M; j++) x->kids[j] = NULL;\n        upKey = x->keys[mid];\n        upNode = r;\n        x->n = mid;\n    }\n}\n\nNode *add(Node *root, int k) {\n    insert(root, k);\n    if (upNode != NULL) {                  /* root split -> tree grows */\n        Node *nr = newNode();\n        nr->leaf = 0;\n        nr->keys[0] = upKey;\n        nr->kids[0] = root;\n        nr->kids[1] = upNode;\n        nr->n = 1;\n        upNode = NULL;\n        return nr;\n    }\n    return root;\n}\n\nvoid show(Node *x) {\n    printf(\"[\");\n    for (int i = 0; i < x->n; i++) printf(\"%s%d\", i > 0 ? \" \" : \"\", x->keys[i]);\n    printf(\"]\");\n    if (!x->leaf) {\n        printf(\"(\");\n        for (int i = 0; i <= x->n; i++) { if (i > 0) printf(\" \"); show(x->kids[i]); }\n        printf(\")\");\n    }\n}\n\nint main() {\n    Node *root = newNode();\n    for (int k = 10; k <= 70; k += 10) {\n        root = add(root, k);\n        printf(\"insert %d -> \", k); show(root); printf(\"\\n\");\n    }\n    printf(\"search 50: %s\\n\", search(root, 50) ? \"true\" : \"false\");\n    printf(\"search 55: %s\\n\", search(root, 55) ? \"true\" : \"false\");\n    return 0;\n}\n"}}, "viz": {"type": "btree", "nodes": ["40", "20", "60", "10", "30", "50", "70"], "caption": "Final B-tree (order 3): every leaf is on the same level"}}, {"h": "Deletion (the idea)", "p": ["Deletion is the reverse of insertion. The goal is to remove the key and still keep every node (except the root) at or above the minimum number of keys. It has three situations."], "pts": ["Time: O(m log_m n) CPU, O(log_m n) disk reads. Space: O(1) extra.", "Insert grows the tree at the root (split); delete shrinks it at the root (merge)."], "table": {"head": ["Step", "What happens"], "rows": [["1. Key in a leaf", "remove it. If the leaf still has the minimum keys, done"], ["2. Key in an internal node", "replace it with its inorder predecessor or successor (a leaf key), then delete that key from the leaf"], ["3. Underflow: borrow", "if a sibling has a spare key, rotate: sibling key goes up, parent key comes down"], ["4. Underflow: merge", "if siblings have only the minimum, merge the node, its sibling and the separating parent key into one node"], ["5. Parent underflows", "repeat upward; if the root becomes empty, the tree shrinks by one level"]]}}, {"h": "B+ tree: how it differs", "p": ["A B+ tree is a variant of the B-tree used by most databases. The big idea: store all actual records (key + data) only in the leaves. Internal nodes keep copies of keys purely as signposts for searching.", "The leaves are also joined into a sorted linked list. So once you reach the first leaf of a range, you just walk right along the leaves without climbing back up the tree."], "pts": ["Data (or record pointers) only in leaf nodes; internal nodes hold only keys to guide the search.", "Leaf level is a linked list in sorted order (next pointers).", "A search always goes down to a leaf, so every search takes the same number of steps.", "Internal nodes are smaller (no data), so more keys fit in a block and the tree is even shorter.", "Keys in internal nodes are repeated in the leaves (a leaf-split copies the key up, it does not move it)."], "tip": "Range query: search down for lo to reach its leaf, scan, follow next pointers, stop when a key is greater than hi. Time O(log_m n + k) for k results, space O(1). A plain B-tree needs an inorder walk up and down the levels.", "code": {"f": "Main.java", "c": "public class Main {\n    static class Leaf {\n        int[] keys;\n        Leaf next;\n        Leaf(int... k) { keys = k; }\n    }\n\n    // start at the leaf found by the index search, then walk right\n    static void range(Leaf start, int lo, int hi) {\n        for (Leaf p = start; p != null; p = p.next)\n            for (int k : p.keys) {\n                if (k > hi) return;\n                if (k >= lo) System.out.print(k + \" \");\n            }\n    }\n\n    public static void main(String[] args) {\n        Leaf a = new Leaf(10, 20), b = new Leaf(30, 40), c = new Leaf(50, 60), d = new Leaf(70, 80);\n        a.next = b; b.next = c; c.next = d;\n        System.out.print(\"keys in [35, 70]: \");\n        range(b, 35, 70);               // index tree would lead us to leaf b (30,40)\n        System.out.println();\n    }\n}", "out": "keys in [35, 70]: 40 50 60 70 ", "cpp": {"f": "main.cpp", "c": "#include <iostream>\n#include <vector>\nusing namespace std;\n\nstruct Leaf {\n    vector<int> keys;\n    Leaf* next = nullptr;\n    Leaf(vector<int> k) : keys(k) {}\n};\n\n// start at the leaf found by the index search, then walk right\nvoid range(Leaf* start, int lo, int hi) {\n    for (Leaf* p = start; p != nullptr; p = p->next)\n        for (int k : p->keys) {\n            if (k > hi) return;\n            if (k >= lo) cout << k << \" \";\n        }\n}\n\nint main() {\n    Leaf *a = new Leaf({10, 20}), *b = new Leaf({30, 40}), *c = new Leaf({50, 60}), *d = new Leaf({70, 80});\n    a->next = b; b->next = c; c->next = d;\n    cout << \"keys in [35, 70]: \";\n    range(b, 35, 70);               // index tree would lead us to leaf b (30,40)\n    cout << endl;\n}\n"}, "clang": {"f": "main.c", "c": "#include <stdio.h>\n#include <stdlib.h>\n\ntypedef struct Leaf { int keys[2]; int n; struct Leaf *next; } Leaf;\nLeaf *mk(int a, int b) { Leaf *l = malloc(sizeof(Leaf)); l->keys[0] = a; l->keys[1] = b; l->n = 2; l->next = NULL; return l; }\n\n/* start at the leaf found by the index search, then walk right */\nvoid range(Leaf *start, int lo, int hi) {\n    for (Leaf *p = start; p != NULL; p = p->next)\n        for (int i = 0; i < p->n; i++) {\n            int k = p->keys[i];\n            if (k > hi) return;\n            if (k >= lo) printf(\"%d \", k);\n        }\n}\n\nint main() {\n    Leaf *a = mk(10, 20), *b = mk(30, 40), *c = mk(50, 60), *d = mk(70, 80);\n    a->next = b; b->next = c; c->next = d;\n    printf(\"keys in [35, 70]: \");\n    range(b, 35, 70);               /* index tree would lead us to leaf b (30,40) */\n    printf(\"\\n\");\n    return 0;\n}\n"}}, "viz": {"type": "chain", "items": ["[10 20]", "[30 40]", "[50 60]", "[70 80]", "null"], "labels": ["next", "next", "next", "next"], "caption": "B+ tree leaf level: sorted linked list of leaves"}}, {"h": "Comparison: BST vs B-tree vs B+ tree", "p": ["A quick table that is often asked in exams."], "table": {"head": ["Point", "BST", "B-tree", "B+ tree"], "rows": [["Keys per node", "1", "up to m-1", "up to m-1"], ["Children per node", "max 2", "max m", "max m"], ["Balanced?", "No (unless AVL/RB)", "Always", "Always"], ["Data stored in", "Every node", "Every node", "Leaf nodes only"], ["Leaf linking", "No", "No", "Yes (linked list)"], ["Search ends at", "Any node", "Any node", "Always a leaf"], ["Range query", "Inorder walk", "Slow (up and down)", "Fast (scan leaves)"], ["Height", "O(n) worst, O(log2 n) best", "O(log_m n)", "O(log_m n), a bit shorter"], ["Best for", "In-memory", "Disk, file systems", "Database indexes"]]}}], "analogy": "A dictionary has thumb-index tabs: first you pick the letter, then the page range, then the word. Each step narrows a lot. A B-tree node is like one index page with many entries, so you reach the word in just 3-4 page flips instead of 30.", "hinglish": "Bhai B-tree ek balanced multiway tree hai jisme har node me bahut saari keys hoti hain, isliye height bahut kam rehti hai aur disk se kam baar padhna padta hai. Insert me node full ho jaye to split karke beech wali key upar bhej dete hain. B+ tree me asli data sirf leaves me hota hai aur leaves linked hoti hain, isliye range query (jaise 100 se 200 ke beech) bahut fast chalti hai. Database indexes isi se bante hain.", "mistakes": ["Saying a B-tree grows downward. It grows upward: only a root split increases the height.", "Mixing order m with minimum degree t. Max keys is m-1 for order m but 2t-1 for degree t.", "Inserting a new key directly into an internal node. Keys are always inserted at a leaf.", "Writing that B+ tree internal nodes store data. They store only keys; data is only in leaves.", "Forgetting that leaves must all be at the same level after a split or merge."], "remember": ["B-tree of order m: max m children, max m-1 keys per node; non-root internal nodes have at least ceil(m/2) children.", "Root has at least 2 children (if not a leaf). All leaves are on the same level.", "A node with k keys has k+1 children. Keys are sorted inside the node.", "Purpose: reduce disk accesses. Height is O(log_m n), versus about log2 n for a BST.", "Search: scan keys in node, match or descend into the proper child. Disk reads O(log_m n).", "Insert: add to leaf; if overflow (m keys), split at the median, median moves up; may split up to the root; tree grows at the root.", "Delete: remove key (use predecessor/successor for internal keys); on underflow borrow from a sibling or merge; tree shrinks at the root.", "B+ tree: records only in leaves; internal nodes are only an index; leaves are linked in sorted order.", "B+ tree range query = search the lower bound, then follow leaf links; B-tree needs inorder traversal.", "In a B+ tree a leaf split COPIES the middle key up; in a B-tree it MOVES the median up.", "Every B+ tree search reaches a leaf, so search time is uniform.", "Time: search/insert/delete O(log n) (CPU O(m log_m n)); space O(n)."], "uses": ["Database indexes (MySQL InnoDB, PostgreSQL, Oracle) use B+ trees.", "File systems store directories and metadata in B-trees or B+ trees (NTFS, ext4 htree, HFS+, Btrfs).", "Key-value stores and search indexes that live on disk.", "Any large sorted data that does not fit in RAM and needs range queries."], "pros": ["Very low height, so very few disk reads.", "Always balanced; search, insert and delete are all O(log n).", "B+ tree gives fast range queries and ordered scans."], "cons": ["Complex to implement (split, borrow, merge).", "Nodes can be up to half empty, wasting some space.", "For small in-memory data a simple BST or hash table is easier and as fast."], "def": "A hard disk (or SSD page) is read in big blocks, and one block read is thousands of times slower than a RAM access. So for huge data, the number of disk reads matters more than the number of comparisons."}, "u6-t1": {"tldr": "A graph is vertices joined by edges. Learn the vocabulary and store it as an adjacency matrix or adjacency list.", "sections": [{"h": "What is a graph?", "p": ["A tree is a special graph that is connected and has no cycle. A graph is more general because it can have cycles, many paths between two nodes and even disconnected parts."], "viz": {"type": "graph", "nodes": ["A", "B", "C", "D", "E"], "edges": [["A", "B"], ["A", "C"], ["B", "D"], ["C", "D"], ["D", "E"]], "directed": false, "caption": "V = {A,B,C,D,E}, E = 5 edges"}}, {"h": "Directed, undirected and weighted graphs", "p": ["In an undirected graph an edge {u, v} works both ways: you can go u to v and v to u. In a directed graph (digraph) an edge (u, v) goes only from u to v, like a one-way street.", "In a weighted graph each edge carries a number (weight, cost, distance, time). An unweighted graph treats all edges equal."], "pts": ["Undirected: edge (u,v) = edge (v,u). Directed: (u,v) is different from (v,u).", "Weighted: store the weight with the edge (e.g. A to B = 7 km).", "Simple graph: no self-loop and no parallel (repeated) edges.", "Maximum edges in a simple undirected graph = V(V-1)/2; in a simple directed graph = V(V-1)."], "viz": {"type": "graph", "nodes": ["A", "B", "C", "D"], "edges": [["A", "B"], ["B", "C"], ["C", "A"], ["C", "D"]], "directed": true, "caption": "A directed graph: edges have arrows"}}, {"h": "Degree, path, cycle, connected", "p": ["Degree of a vertex is the number of edges touching it. In a directed graph, in-degree counts edges coming in and out-degree counts edges going out. Handshaking lemma: the sum of all degrees = 2E for an undirected graph.", "A path is a sequence of vertices where each consecutive pair is joined by an edge. Its length is the number of edges. A simple path repeats no vertex. A cycle is a path that starts and ends at the same vertex (with no repeated edge or inner vertex)."], "pts": ["Connected (undirected): every vertex is reachable from every other. Otherwise the graph has several connected components.", "Directed graph: strongly connected if every vertex can reach every other following arrows.", "A DAG is a Directed Acyclic Graph (used for task scheduling and topological sort).", "Sparse graph: E is close to V. Dense graph: E is close to V^2."], "tip": "Check yourself with the handshaking lemma: in the 5-node graph the degrees are 2,2,2,3,1 and 2+2+2+3+1 = 10 = 2 x 5 edges.", "table": {"head": ["Term", "Meaning", "Example (graph above)"], "rows": [["Adjacent", "Joined by an edge", "A and B"], ["Degree", "Edges at a vertex", "deg(D) = 3 in the 5-node graph"], ["Path", "Edge-connected vertex sequence", "A, B, D, E"], ["Cycle", "Path returning to start", "A, B, D, C, A"], ["Connected graph", "A path exists between every pair", "The 5-node graph"], ["Component", "Maximal connected part", "A graph with two separate pieces has 2"], ["Acyclic", "No cycle", "A tree"]]}}, {"h": "Representation 1: adjacency matrix", "p": ["An adjacency matrix is a V x V 2D array adj. For an unweighted graph adj[i][j] = 1 if there is an edge from i to j, else 0. For a weighted graph store the
