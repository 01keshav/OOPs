3, 9, 82, 10]"], ["merge [9]", "[82]", "[9, 82]", "[3, 27, 38, 43, 9, 82, 10]"], ["merge [9, 82]", "[10]", "[9, 10, 82]", "[3, 27, 38, 43, 9, 10, 82]"], ["merge [3, 27, 38, 43]", "[9, 10, 82]", "[3, 9, 10, 27, 38, 43, 82]", "[3, 9, 10, 27, 38, 43, 82]"]]}}, {"h": "Java code", "p": ["The println inside mergeSort shows every merge, matching the trace table."], "code": {"f": "Main.java", "c": "public class Main {\n    static void merge(int[] a, int lo, int mid, int hi) {\n        int[] left = java.util.Arrays.copyOfRange(a, lo, mid + 1);\n        int[] right = java.util.Arrays.copyOfRange(a, mid + 1, hi + 1);\n        int i = 0, j = 0, k = lo;\n        while (i < left.length && j < right.length) {\n            if (left[i] <= right[j]) a[k++] = left[i++];   // <= keeps it stable\n            else a[k++] = right[j++];\n        }\n        while (i < left.length) a[k++] = left[i++];\n        while (j < right.length) a[k++] = right[j++];\n    }\n    static void mergeSort(int[] a, int lo, int hi) {\n        if (lo >= hi) return;\n        int mid = (lo + hi) / 2;\n        mergeSort(a, lo, mid);\n        mergeSort(a, mid + 1, hi);\n        merge(a, lo, mid, hi);\n        System.out.println(\"merged [\" + lo + \"..\" + hi + \"]: \" + java.util.Arrays.toString(a));\n    }\n    public static void main(String[] args) {\n        int[] a = {38, 27, 43, 3, 9, 82, 10};\n        mergeSort(a, 0, a.length - 1);\n        System.out.println(\"Sorted: \" + java.util.Arrays.toString(a));\n    }\n}", "out": "merged [0..1]: [27, 38, 43, 3, 9, 82, 10]\nmerged [2..3]: [27, 38, 3, 43, 9, 82, 10]\nmerged [0..3]: [3, 27, 38, 43, 9, 82, 10]\nmerged [4..5]: [3, 27, 38, 43, 9, 82, 10]\nmerged [4..6]: [3, 27, 38, 43, 9, 10, 82]\nmerged [0..6]: [3, 9, 10, 27, 38, 43, 82]\nSorted: [3, 9, 10, 27, 38, 43, 82]", "cpp": {"f": "main.cpp", "c": "#include <iostream>\n#include <vector>\n#include <string>\nusing namespace std;\n\n// like Java's Arrays.toString\nstring str(const vector<int>& a) {\n    string s = \"[\";\n    for (size_t i = 0; i < a.size(); i++) s += (i ? \", \" : \"\") + to_string(a[i]);\n    return s + \"]\";\n}\nvoid merge(vector<int>& a, int lo, int mid, int hi) {\n    vector<int> left(a.begin() + lo, a.begin() + mid + 1);\n    vector<int> right(a.begin() + mid + 1, a.begin() + hi + 1);\n    int i = 0, j = 0, k = lo;\n    while (i < (int)left.size() && j < (int)right.size()) {\n        if (left[i] <= right[j]) a[k++] = left[i++];   // <= keeps it stable\n        else a[k++] = right[j++];\n    }\n    while (i < (int)left.size()) a[k++] = left[i++];\n    while (j < (int)right.size()) a[k++] = right[j++];\n}\nvoid mergeSort(vector<int>& a, int lo, int hi) {\n    if (lo >= hi) return;\n    int mid = (lo + hi) / 2;\n    mergeSort(a, lo, mid);\n    mergeSort(a, mid + 1, hi);\n    merge(a, lo, mid, hi);\n    cout << \"merged [\" << lo << \"..\" << hi << \"]: \" << str(a) << endl;\n}\nint main() {\n    vector<int> a = {38, 27, 43, 3, 9, 82, 10};\n    mergeSort(a, 0, a.size() - 1);\n    cout << \"Sorted: \" << str(a) << endl;\n}\n"}, "clang": {"f": "main.c", "c": "#include <stdio.h>\n#include <stdlib.h>\n\n/* like Java's Arrays.toString */\nvoid prt(int a[], int n) {\n    printf(\"[\");\n    for (int i = 0; i < n; i++) printf(\"%s%d\", i ? \", \" : \"\", a[i]);\n    printf(\"]\");\n}\nint n = 7;\nvoid merge(int a[], int lo, int mid, int hi) {\n    int left[20], right[20];\n    int nl = mid - lo + 1, nr = hi - mid;\n    for (int i = 0; i < nl; i++) left[i] = a[lo + i];\n    for (int i = 0; i < nr; i++) right[i] = a[mid + 1 + i];\n    int i = 0, j = 0, k = lo;\n    while (i < nl && j < nr) {\n        if (left[i] <= right[j]) a[k++] = left[i++];   /* <= keeps it stable */\n        else a[k++] = right[j++];\n    }\n    while (i < nl) a[k++] = left[i++];\n    while (j < nr) a[k++] = right[j++];\n}\nvoid mergeSort(int a[], int lo, int hi) {\n    if (lo >= hi) return;\n    int mid = (lo + hi) / 2;\n    mergeSort(a, lo, mid);\n    mergeSort(a, mid + 1, hi);\n    merge(a, lo, mid, hi);\n    printf(\"merged [%d..%d]: \", lo, hi); prt(a, n); printf(\"\\n\");\n}\nint main() {\n    int a[] = {38, 27, 43, 3, 9, 82, 10};\n    mergeSort(a, 0, n - 1);\n    printf(\"Sorted: \"); prt(a, n); printf(\"\\n\");\n    return 0;\n}\n"}}}, {"h": "Complexity, extra space and stability", "p": ["The array is halved log2(n) times, so the recursion tree has about log n levels. At every level the merges together touch all n elements, which costs O(n). Total = O(n log n). The recurrence is T(n) = 2T(n/2) + n.", "Merge sort does the same amount of splitting whatever the input looks like, so best, average and worst case are all O(n log n). It needs a temporary array of size up to n, so extra space is O(n) (plus O(log n) stack). It is not in-place. It is stable."], "warn": "Merge sort is NOT in-place for arrays. For linked lists it can be done with O(1) extra space and is the preferred sort.", "table": {"head": ["Case", "Time", "Extra space", "Stable", "In-place"], "rows": [["Best", "O(n log n)", "O(n)", "Yes", "No"], ["Average", "O(n log n)", "O(n)", "Yes", "No"], ["Worst", "O(n log n)", "O(n)", "Yes", "No"]]}}], "analogy": "Two teachers each sort half of a pile of answer sheets by roll number. Then you merge the two sorted piles by always taking the smaller roll number from the tops of the two piles.", "hinglish": "Bhai merge sort simple hai: array ko beech se tod do, dono half ko sort karo (recursively), phir dono sorted halves ko merge kar do. Har case me O(n log n) hai. Bas extra O(n) memory lagti hai. Equal elements ka order bana rehta hai, isliye stable hai.", "mistakes": ["Saying merge sort is in-place. It needs O(n) extra space.", "Using < instead of <= in merge and losing stability.", "Forgetting to copy the remaining elements after one half is exhausted.", "Saying the worst case is O(n^2) (that is quick sort).", "Missing the base case lo >= hi, so the recursion never stops."], "remember": ["Merge sort = divide and conquer: divide, sort halves recursively, merge.", "Merge combines two sorted arrays in O(n) with at most n-1 comparisons.", "Recurrence: T(n) = 2T(n/2) + n, so T(n) = O(n log n).", "Best = average = worst = O(n log n).", "Space complexity: O(n) auxiliary array (plus O(log n) recursion stack).", "Stable if merge takes from left when equal (<=).", "Not in-place for arrays; not adaptive (does same work on sorted data).", "Excellent for linked lists and external sorting (huge files on disk).", "Number of levels = log2(n); each level does O(n) work.", "Slower than quick sort in practice for arrays because of copying and extra memory.", "Base case: a list of 0 or 1 element is already sorted."], "uses": ["Sorting linked lists", "External sorting of files larger than memory", "When a stable sort with guaranteed O(n log n) is needed", "Counting inversions in an array", "Java's Collections.sort / Arrays.sort for objects (Timsort, a merge sort variant)"], "pros": ["Guaranteed O(n log n) in every case", "Stable", "Works well for linked lists and huge data on disk"], "cons": ["Needs O(n) extra memory for arrays", "Slower than quick sort in practice for small or in-memory arrays", "Does not take advantage of already sorted input"], "def": "Merge sort (John von Neumann, 1945) is a classic divide-and-conquer algorithm. Divide: split the array into two halves at mid = (lo+hi)/2. Conquer: sort each half recursively. Combine: merge the two sorted halves into one sorted array."}, "u1-t1": {"tldr": "Core vocabulary of DSA: data, record, file, primitive/non-primitive, linear/non-linear, static/dynamic and ADT.", "sections": [{"h": "Data, data item and information", "p": ["A data item is a single unit of data. An elementary item cannot be divided further (roll no). A group item can be split into smaller items (a date = day + month + year)."], "pts": ["Data: raw facts, unprocessed", "Information: processed, meaningful data", "Elementary item: not divisible (age)", "Group item: made of elementary items (full name = first + last)"], "viz": {"type": "chain", "items": ["Data", "Processing", "Information"], "caption": "Data becomes information after processing"}}, {"h": "Entity, attribute, record and file", "p": ["An entity is a real-world thing about which we store data: a student, a book, an employee. Its properties are attributes (name, roll no, marks). The values of attributes are the data items. A set of similar entities is an entity set (all students of CSE).", "A record is a collection of related data items about ONE entity. A file is a collection of records of the same type. A field is the place where one data item is stored (a column).", "Hierarchy: data item -> record -> file -> database."], "code": {"f": "Main.java", "c": "public class Main {\n    static class Student {\n        int roll; String name; double marks;\n        Student(int r, String n, double m) { roll = r; name = n; marks = m; }\n    }\n    public static void main(String[] args) {\n        // a FILE = collection of RECORDS\n        Student[] file = {\n            new Student(1, \"Asha\", 82.5),\n            new Student(2, \"Ravi\", 74.0),\n            new Student(3, \"Meena\", 91.0)\n        };\n        for (Student s : file)\n            System.out.println(s.roll + \" | \" + s.name + \" | \" + s.marks);\n        System.out.println(\"Records in file: \" + file.length);\n    }\n}", "out": "1 | Asha | 82.5\n2 | Ravi | 74.0\n3 | Meena | 91.0\nRecords in file: 3", "cpp": {"f": "main.cpp", "c": "#include <iostream>\n#include <string>\n#include <vector>\nusing namespace std;\n\nstruct Student {\n    int roll; string name; double marks;\n    Student(int r, string n, double m) : roll(r), name(n), marks(m) {}\n};\n\nint main() {\n    // a FILE = collection of RECORDS\n    vector<Student> file = {\n        Student(1, \"Asha\", 82.5),\n        Student(2, \"Ravi\", 74.0),\n        Student(3, \"Meena\", 91.0)\n    };\n    for (const Student& s : file) {\n        // print marks like Java: always at least one decimal\n        cout << s.roll << \" | \" << s.name << \" | \" << fixed;\n        cout.precision(1);\n        cout << s.marks << defaultfloat << \"\\n\";\n    }\n    cout << \"Records in file: \" << file.size() << \"\\n\";\n    return 0;\n}\n"}, "clang": {"f": "main.c", "c": "#include <stdio.h>\n\nstruct Student { int roll; char name[20]; double marks; };\n\nint main() {\n    /* a FILE = collection of RECORDS */\n    struct Student file[] = { {1, \"Asha\", 82.5}, {2, \"Ravi\", 74.0}, {3, \"Meena\", 91.0} };\n    int n = 3;\n    for (int i = 0; i < n; i++)\n        printf(\"%d | %s | %.1f\\n\", file[i].roll, file[i].name, file[i].marks);\n    printf(\"Records in file: %d\\n\", n);\n    return 0;\n}\n"}}, "table": {"head": ["Term", "Meaning", "Example"], "rows": [["Entity", "Real-world object", "One student"], ["Attribute", "Property of entity", "roll, name, marks"], ["Field", "Storage for one item", "name column"], ["Record", "Items of one entity", "1, Asha, 82.5"], ["File", "Group of records", "Whole class register"]]}}, {"h": "What is a data structure?", "p": ["A data structure is a particular way of organising and storing data in memory so that it can be accessed and modified efficiently. It has two parts: the data organisation and the operations allowed on it (insert, delete, search...).", "Why do we need it? A good choice makes programs faster and uses less memory. Searching a phone book is easy because names are sorted; the same names in random order would be painful."], "viz": {"type": "tree", "root": "Data Structures", "kids": ["Primitive", "Non-primitive"], "caption": "Top-level classification"}}, {"h": "Primitive vs non-primitive", "p": ["Primitive data structures are the basic types built into the language, holding a single value: int, float, char, boolean. They are directly operated by machine instructions.", "Non-primitive data structures are built from primitives and hold many values: arrays, linked lists, stacks, queues, trees, graphs. They are further split into linear and non-linear."], "tip": "Note the output: changing b did not change a (value copy) but changing y changed x (both point to the same array).", "code": {"f": "Main.java", "c": "public class Main {\n    public static void main(String[] args) {\n        System.out.println(\"int bytes    = \" + Integer.BYTES);\n        System.out.println(\"double bytes = \" + Double.BYTES);\n        System.out.println(\"char bytes   = \" + Character.BYTES);\n        int a = 5, b = a;          // primitive: value is copied\n        b = 99;\n        System.out.println(\"a = \" + a);\n        int[] x = {1, 2}, y = x;   // non-primitive: reference is copied\n        y[0] = 99;\n        System.out.println(\"x[0] = \" + x[0]);\n    }\n}", "out": "int bytes    = 4\ndouble bytes = 8\nchar bytes   = 2\na = 5\nx[0] = 99", "cpp": {"f": "main.cpp", "c": "#include <iostream>\nusing namespace std;\n\nint main() {\n    cout << \"int bytes    = \" << sizeof(int) << \"\\n\";\n    cout << \"double bytes = \" << sizeof(double) << \"\\n\";\n    cout << \"char bytes   = \" << 2 << \"\\n\";   // Java char is 2 bytes (C++ char is 1, wchar_t/char16_t is 2)\n    int a = 5, b = a;          // primitive: value is copied\n    b = 99;\n    cout << \"a = \" << a << \"\\n\";\n    int arr[] = {1, 2};\n    int* x = arr; int* y = x;  // pointer: the address is copied (like a reference)\n    y[0] = 99;\n    cout << \"x[0] = \" << x[0] << \"\\n\";\n    return 0;\n}\n"}, "clang": {"f": "main.c", "c": "#include <stdio.h>\n\nint main() {\n    printf(\"int bytes    = %zu\\n\", sizeof(int));\n    printf(\"double bytes = %zu\\n\", sizeof(double));\n    printf(\"char bytes   = %d\\n\", 2);   /* Java char is 2 bytes (C char is 1) */\n    int a = 5, b = a;          /* value is copied */\n    b = 99;\n    printf(\"a = %d\\n\", a);\n    int arr[] = {1, 2};\n    int *x = arr, *y = x;      /* pointer: the address is copied */\n    y[0] = 99;\n    printf(\"x[0] = %d\\n\", x[0]);\n    return 0;\n}\n"}}, "table": {"head": ["Point", "Primitive", "Non-primitive"], "rows": [["Holds", "Single value", "Collection of values"], ["Defined by", "Language", "Programmer (or library)"], ["Examples", "int, char, float", "array, list, tree"], ["In Java", "Value copied", "Reference copied"]]}}, {"h": "Linear vs non-linear structures", "p": ["In a linear structure the elements form a sequence: each element has one predecessor and one successor (except first and last). Examples: array, linked list, stack, queue. They are easy to traverse in a single run.", "In a non-linear structure an element can connect to many others, so data forms a hierarchy or network. Examples: tree, graph. Traversal needs special methods (DFS, BFS)."], "pts": ["Linear: single level, memory use may be fully used or wasted", "Non-linear: multi level, memory used more efficiently", "Linear is simpler to implement; non-linear models real relationships (family tree, roads)"], "viz": {"type": "cells", "items": ["10", "20", "30", "40"], "labels": ["0", "1", "2", "3"], "hl": [], "caption": "Linear: one element after another"}}, {"h": "Static vs dynamic structures", "p": ["A static data structure has a fixed size decided at compile time or creation. Memory is allocated once. The array is the classic example. It is fast but can waste memory or overflow.", "A dynamic data structure can grow or shrink at run time and takes memory only as needed. Linked list and tree are examples. Memory is allocated with pointers/references, so access can be slower."], "code": {"f": "Main.java", "c": "import java.util.Arrays;\npublic class Main {\n    public static void main(String[] args) {\n        int[] a = new int[3];              // static: size fixed at creation\n        a[0] = 10; a[1] = 20; a[2] = 30;\n        // a[3] = 40;  -> ArrayIndexOutOfBoundsException\n        int[] bigger = Arrays.copyOf(a, 6); // dynamic idea: make a bigger one, copy\n        bigger[3] = 40;\n        System.out.println(Arrays.toString(a));\n        System.out.println(Arrays.toString(bigger));\n    }\n}", "out": "[10, 20, 30]\n[10, 20, 30, 40, 0, 0]", "cpp": {"f": "main.cpp", "c": "#include <iostream>\n#include <vector>\nusing namespace std;\n\nvoid print(const vector<int>& v) {\n    cout << \"[\";\n    for (size_t i = 0; i < v.size(); i++) cout << (i ? \", \" : \"\") << v[i];\n    cout << \"]\\n\";\n}\n\nint main() {\n    vector<int> a(3);                  // static idea: size fixed at creation\n    a[0] = 10; a[1] = 20; a[2] = 30;\n    // a[3] = 40;  -> undefined behaviour with operator[] (a.at(3) would throw)\n    vector<int> bigger(6);             // dynamic idea: make a bigger one, copy\n    for (size_t i = 0; i < a.size(); i++) bigger[i] = a[i];\n    bigger[3] = 40;\n    print(a);\n    print(bigger);\n    return 0;\n}\n"}, "clang": {"f": "main.c", "c": "#include <stdio.h>\n#include <stdlib.h>\n\nvoid print(int v[], int n) {\n    printf(\"[\");\n    for (int i = 0; i < n; i++) printf(\"%s%d\", i ? \", \" : \"\", v[i]);\n    printf(\"]\\n\");\n}\n\nint main() {\n    int a[3] = {10, 20, 30};              /* static: size fixed at creation */\n    int *bigger = malloc(6 * sizeof(int)); /* dynamic idea: bigger block, copy */\n    for (int i = 0; i < 6; i++) bigger[i] = 0;\n    for (int i = 0; i < 3; i++) bigger[i] = a[i];\n    bigger[3] = 40;\n    print(a, 3);\n    print(bigger, 6);\n    free(bigger);\n    return 0;\n}\n"}}, "table": {"head": ["Point", "Static", "Dynamic"], "rows": [["Size", "Fixed", "Changes at run time"], ["Memory", "Allocated once", "Allocated on demand"], ["Example", "Array", "Linked list, tree"], ["Risk", "Overflow / waste", "Extra pointer memory"]]}}, {"h": "Abstract Data Type (ADT)", "p": ["An ADT is a mathematical model of a data type defined by its values and the operations on it, without saying how they are implemented. It separates the interface (what) from the implementation (how).", "Example: Stack ADT says push, pop and isEmpty exist and follow LIFO. You may build it with an array or a linked list; users of the ADT do not care."], "tip": "Java interface is a natural way to write an ADT. Benefits: abstraction, encapsulation, easy to change implementation.", "code": {"f": "Main.java", "c": "interface StackADT {                 // ADT = WHAT it does\n    void push(int x);\n    int pop();\n    boolean isEmpty();\n}\nclass ArrayStack implements StackADT { // implementation = HOW\n    private int[] data = new int[10];\n    private int top = -1;\n    public void push(int x) { data[++top] = x; }\n    public int pop() { return data[top--]; }\n    public boolean isEmpty() { return top == -1; }\n}\npublic class Main {\n    public static void main(String[] args) {\n        StackADT s = new ArrayStack();   // user sees only the ADT\n        s.push(1); s.push(2); s.push(3);\n        while (!s.isEmpty()) System.out.print(s.pop() + \" \");\n    }\n}", "out": "3 2 1 ", "cpp": {"f": "main.cpp", "c": "#include <iostream>\nusing namespace std;\n\nstruct StackADT {                    // ADT = WHAT it does\n    virtual void push(int x) = 0;\n    virtual int pop() = 0;\n    virtual bool isEmpty() = 0;\n    virtual ~StackADT() {}\n};\nclass ArrayStack : public StackADT { // implementation = HOW\n    int data[10];\n    int top = -1;\npublic:\n    void push(int x) override { data[++top] = x; }\n    int pop() override { return data[top--]; }\n    bool isEmpty() override { return top == -1; }\n};\n\nint main() {\n    StackADT* s = new ArrayStack();  // user sees only the ADT\n    s->push(1); s->push(2); s->push(3);\n    while (!s->isEmpty()) cout << s->pop() << \" \";\n    delete s;\n    return 0;\n}\n"}, "clang": {"f": "main.c", "c": "#include <stdio.h>\n\n/* ADT = WHAT it does (the interface); the struct below = HOW */\ntypedef struct { int data[10]; int top; } ArrayStack;\n\nvoid push(ArrayStack *s, int x) { s->data[++s->top] = x; }\nint pop(ArrayStack *s) { return s->data[s->top--]; }\nint isEmpty(ArrayStack *s) { return s->top == -1; }\n\nint main() {\n    ArrayStack s; s.top = -1;\n    push(&s, 1); push(&s, 2); push(&s, 3);\n    while (!isEmpty(&s)) printf(\"%d \", pop(&s));\n    return 0;\n}\n"}}}], "analogy": "A school register is a file. Each student's row is a record. Name, roll no and marks are the data items. The register's layout (columns, order) is the data structure.", "hinglish": "Bhai simple hai: data matlab raw facts, data item sabse chhota piece, record un items ka group, aur file records ka group. Data structure ek tarika hai data ko store karne ka taaki kaam fast ho. ADT sirf batata hai 'kya karega', 'kaise karega' implementation decide karti hai.", "mistakes": ["Calling an array a dynamic structure; it is static (ArrayList only simulates dynamic by copying).", "Thinking a queue is non-linear because it has two ends; it is linear.", "Mixing up ADT and data structure: ADT is the idea, data structure is the implementation.", "Saying record and file are the same; a file contains many records."], "remember": ["Data = raw facts; information = processed data.", "Data item: elementary (indivisible) or group (divisible).", "Entity = real-world object; attribute = property; entity set = similar entities.", "Record = related data items of one entity; file = collection of records.", "Data structure = organised way of storing data + operations on it.", "Primitive: int, char, float, boolean (single value, built in).", "Non-primitive: array, list, stack, queue, tree, graph.", "Linear: elements in sequence (array, linked list, stack, queue).", "Non-linear: hierarchy / network (tree, graph).", "Static: fixed size (array). Dynamic: size varies at run time (linked list).", "ADT = values + operations, hides implementation.", "Examples of ADT: List, Stack, Queue, Map, Set."], "uses": ["Databases model data as entities, records and files", "Choosing array vs linked list based on static/dynamic need", "ADTs in library design (Java Collections: List, Map, Set)", "Trees and graphs for file systems and maps"], "pros": ["Common vocabulary for all later topics", "Helps pick the right structure for a problem", "ADT gives clean, replaceable design"], "cons": ["Terms overlap in textbooks (record vs structure)", "Choosing the wrong structure hurts performance"], "def": "Data means raw facts and figures, like 25, 'Asha' or 78.5. On its own it may not mean much. When data is processed and given meaning, it becomes information. For example, 78.5 alone is data; 'Asha scored 78.5%' is information."}, "u1-t2": {"tldr": "The six basic operations on any data structure: traversal, insertion, deletion, searching, sorting and merging.", "sections": [{"h": "Overview of operations", "p": ["Other operations exist too, like creating, updating (modify a value), copying and splitting, but the six below are the standard syllabus list."], "viz": {"type": "chain", "items": ["Traversal", "Insertion", "Deletion", "Searching", "Sorting", "Merging"], "caption": "The six basic operations"}}, {"h": "Traversal", "p": ["Traversal means visiting every element exactly once, usually to print, count or process it. For an array we go from index 0 to n-1."], "pts": ["Step 1: set i = 0", "Step 2: while i < n, process a[i]", "Step 3: i = i + 1", "Time O(n), space O(1)"], "code": {"f": "Main.java", "c": "public class Main {\n    static void traverse(int[] a) {\n        for (int i = 0; i < a.length; i++)\n            System.out.println(\"a[\" + i + \"] = \" + a[i]);\n    }\n    public static void main(String[] args) {\n        traverse(new int[]{10, 20, 30});\n    }\n}", "out": "a[0] = 10\na[1] = 20\na[2] = 30", "cpp": {"f": "main.cpp", "c": "#include <iostream>\nusing namespace std;\n\nvoid traverse(int a[], int n) {\n    for (int i = 0; i < n; i++)\n        cout << \"a[\" << i << \"] = \" << a[i] << \"\\n\";\n}\nint main() {\n    int a[] = {10, 20, 30};\n    traverse(a, 3);\n    return 0;\n}\n"}, "clang": {"f": "main.c", "c": "#include <stdio.h>\n\nvoid traverse(int a[], int n) {\n    for (int i = 0; i < n; i++)\n        printf(\"a[%d] = %d\\n\", i, a[i]);\n}\nint main() {\n    int a[] = {10, 20, 30};\n    traverse(a, 3);\n    return 0;\n}\n"}}, "viz": {"type": "cells", "items": ["10", "20", "30"], "labels": ["0", "1", "2"], "hl": [0, 1, 2], "caption": "Every cell is visited once"}}, {"h": "Insertion", "p": ["Insertion adds a new element at a given position. In an array, elements from that position onward must shift one place right to make room. Inserting at the end needs no shifting (if space is free).", "The array must have spare capacity, otherwise overflow occurs."], "pts": ["Step 1: check n < capacity", "Step 2: for i = n-1 down to pos: a[i+1] = a[i]", "Step 3: a[pos] = x", "Step 4: n = n + 1", "Best O(1) (at end), worst O(n) (at start)"], "code": {"f": "Main.java", "c": "import java.util.Arrays;\npublic class Main {\n    // insert x at index pos; n = current element count\n    static int insert(int[] a, int n, int pos, int x) {\n        for (int i = n - 1; i >= pos; i--)\n            a[i + 1] = a[i];          // shift right\n        a[pos] = x;\n        return n + 1;\n    }\n    public static void main(String[] args) {\n        int[] a = new int[6];\n        a[0] = 10; a[1] = 20; a[2] = 30; a[3] = 40;\n        int n = insert(a, 4, 2, 25);\n        System.out.println(Arrays.toString(a) + \" n=\" + n);\n    }\n}", "out": "[10, 20, 25, 30, 40, 0] n=5", "cpp": {"f": "main.cpp", "c": "#include <iostream>\nusing namespace std;\n\n// insert x at index pos; n = current element count\nint insert(int a[], int n, int pos, int x) {\n    for (int i = n - 1; i >= pos; i--)\n        a[i + 1] = a[i];          // shift right\n    a[pos] = x;\n    return n + 1;\n}\nint main() {\n    int a[6] = {0};\n    a[0] = 10; a[1] = 20; a[2] = 30; a[3] = 40;\n    int n = insert(a, 4, 2, 25);\n    cout << \"[\";\n    for (int i = 0; i < 6; i++) cout << (i ? \", \" : \"\") << a[i];\n    cout << \"] n=\" << n << \"\\n\";\n    return 0;\n}\n"}, "clang": {"f": "main.c", "c": "#include <stdio.h>\n\n/* insert x at index pos; n = current element count */\nint insert(int a[], int n, int pos, int x) {\n    for (int i = n - 1; i >= pos; i--)\n        a[i + 1] = a[i];          /* shift right */\n    a[pos] = x;\n    return n + 1;\n}\nint main() {\n    int a[6] = {0};\n    a[0] = 10; a[1] = 20; a[2] = 30; a[3] = 40;\n    int n = insert(a, 4, 2, 25);\n    printf(\"[\");\n    for (int i = 0; i < 6; i++) printf(\"%s%d\", i ? \", \" : \"\", a[i]);\n    printf(\"] n=%d\\n\", n);\n    return 0;\n}\n"}}, "viz": {"type": "cells", "items": ["10", "20", "25", "30", "40"], "labels": ["0", "1", "2", "3", "4"], "hl": [2], "caption": "Insert 25 at index 2: 30 and 40 shifted right"}}, {"h": "Deletion", "p": ["Deletion removes an element from a given position. To close the gap, all elements after it shift one place left. Deleting the last element needs no shifting."], "pts": ["Step 1: check n > 0 (else underflow)", "Step 2: for i = pos to n-2: a[i] = a[i+1]", "Step 3: n = n - 1", "Best O(1) (last), worst O(n) (first)"], "code": {"f": "Main.java", "c": "import java.util.Arrays;\npublic class Main {\n    static int delete(int[] a, int n, int pos) {\n        for (int i = pos; i < n - 1; i++)\n            a[i] = a[i + 1];          // shift left\n        return n - 1;\n    }\n    public static void main(String[] args) {\n        int[] a = {10, 20, 30, 40};\n        int n = delete(a, 4, 1);\n        System.out.println(Arrays.toString(Arrays.copyOf(a, n)) + \" n=\" + n);\n    }\n}", "out": "[10, 30, 40] n=3", "cpp": {"f": "main.cpp", "c": "#include <iostream>\nusing namespace std;\n\nint del(int a[], int n, int pos) {   // 'delete' is a C++ keyword\n    for (int i = pos; i < n - 1; i++)\n        a[i] = a[i + 1];          // shift left\n    return n - 1;\n}\nint main() {\n    int a[] = {10, 20, 30, 40};\n    int n = del(a, 4, 1);\n    cout << \"[\";\n    for (int i = 0; i < n; i++) cout << (i ? \", \" : \"\") << a[i];\n    cout << \"] n=\" << n << \"\\n\";\n    return 0;\n}\n"}, "clang": {"f": "main.c", "c": "#include <stdio.h>\n\nint del(int a[], int n, int pos) {\n    for (int i = pos; i < n - 1; i++)\n        a[i] = a[i + 1];          /* shift left */\n    return n - 1;\n}\nint main() {\n    int a[] = {10, 20, 30, 40};\n    int n = del(a, 4, 1);\n    printf(\"[\");\n    for (int i = 0; i < n; i++) printf(\"%s%d\", i ? \", \" : \"\", a[i]);\n    printf(\"] n=%d\\n\", n);\n    return 0;\n}\n"}}, "viz": {"type": "cells", "items": ["10", "30", "40"], "labels": ["0", "1", "2"], "hl": [], "caption": "Delete index 1 (20): 30 and 40 shifted left"}}, {"h": "Searching", "p": ["Searching finds the location of a key in the data. It is successful if found, unsuccessful otherwise.", "Linear search checks elements one by one, so it works on any array: O(n). Binary search needs a sorted array and halves the range each time: O(log n)."], "pts": ["Linear: compare key with a[0], a[1], ... until match", "Binary: compare with middle; go left or right half", "Space: O(1) for both (iterative)"], "code": {"f": "Main.java", "c": "public class Main {\n    static int linear(int[] a, int key) {\n        for (int i = 0; i < a.length; i++)\n            if (a[i] == key) return i;\n        return -1;\n    }\n    static int binary(int[] a, int key) {   // a must be sorted\n        int lo = 0, hi = a.length - 1;\n        while (lo <= hi) {\n            int mid = (lo + hi) / 2;\n            if (a[mid] == key) return mid;\n            else if (a[mid] < key) lo = mid + 1;\n            else hi = mid - 1;\n        }\n        return -1;\n    }\n    public static void main(String[] args) {\n        int[] a = {5, 9, 14, 20, 31};\n        System.out.println(\"linear 20 -> \" + linear(a, 20));\n        System.out.println(\"binary 31 -> \" + binary(a, 31));\n        System.out.println(\"binary 7  -> \" + binary(a, 7));\n    }\n}", "out": "linear 20 -> 3\nbinary 31 -> 4\nbinary 7  -> -1", "cpp": {"f": "main.cpp", "c": "#include <iostream>\nusing namespace std;\n\nint linear(int a[], int n, int key) {\n    for (int i = 0; i < n; i++)\n        if (a[i] == key) return i;\n    return -1;\n}\nint binary(int a[], int n, int key) {   // a must be sorted\n    int lo = 0, hi = n - 1;\n    while (lo <= hi) {\n        int mid = (lo + hi) / 2;\n        if (a[mid] == key) return mid;\n        else if (a[mid] < key) lo = mid + 1;\n        else hi = mid - 1;\n    }\n    return -1;\n}\nint main() {\n    int a[] = {5, 9, 14, 20, 31};\n    int n = 5;\n    cout << \"linear 20 -> \" << linear(a, n, 20) << \"\\n\";\n    cout << \"binary 31 -> \" << binary(a, n, 31) << \"\\n\";\n    cout << \"binary 7  -> \" << binary(a, n, 7) << \"\\n\";\n    return 0;\n}\n"}, "clang": {"f": "main.c", "c": "#include <stdio.h>\n\nint linear(int a[], int n, int key) {\n    for (int i = 0; i < n; i++)\n        if (a[i] == key) return i;\n    return -1;\n}\nint binary(int a[], int n, int key) {   /* a must be sorted */\n    int lo = 0, hi = n - 1;\n    while (lo <= hi) {\n        int mid = (lo + hi) / 2;\n        if (a[mid] == key) return mid;\n        else if (a[mid] < key) lo = mid + 1;\n        else hi = mid - 1;\n    }\n    return -1;\n}\nint main() {\n    int a[] = {5, 9, 14, 20, 31};\n    int n = 5;\n    printf(\"linear 20 -> %d\\n\", linear(a, n, 20));\n    printf(\"binary 31 -> %d\\n\", binary(a, n, 31));\n    printf(\"binary 7  -> %d\\n\", binary(a, n, 7));\n    return 0;\n}\n"}}, "viz": {"type": "cells", "items": ["5", "9", "14", "20", "31"], "labels": ["0", "1", "2", "3", "4"], "hl": [3], "caption": "Key 20 found at index 3"}}, {"h": "Sorting", "p": ["Sorting arranges elements in ascending or descending order. It makes searching faster and helps in merging and duplicates removal.", "Bubble sort repeatedly compares adjacent items and swaps them if out of order. After each pass the largest remaining item reaches its final place."], "pts": ["Step 1: for each pass 1..n-1", "Step 2: compare a[j] and a[j+1], swap if a[j] > a[j+1]", "Time O(n^2), space O(1)", "Others: selection, insertion, merge, quick (later topics)"], "code": {"f": "Main.java", "c": "import java.util.Arrays;\npublic class Main {\n    static void bubble(int[] a) {\n        for (int pass = 1; pass < a.length; pass++) {\n            for (int j = 0; j < a.length - pass; j++)\n                if (a[j] > a[j + 1]) {\n                    int t = a[j]; a[j] = a[j + 1]; a[j + 1] = t;\n                }\n            System.out.println(\"after pass \" + pass + \": \" + Arrays.toString(a));\n        }\n    }\n    public static void main(String[] args) {\n        bubble(new int[]{5, 2, 4, 1});\n    }\n}", "out": "after pass 1: [2, 4, 1, 5]\nafter pass 2: [2, 1, 4, 5]\nafter pass 3: [1, 2, 4, 5]", "cpp": {"f": "main.cpp", "c": "#include <iostream>\n#include <vector>\nusing namespace std;\n\nvoid show(const vector<int>& a) {\n    cout << \"[\";\n    for (size_t i = 0; i < a.size(); i++) cout << (i ? \", \" : \"\") << a[i];\n    cout << \"]\";\n}\nvoid bubble(vector<int>& a) {\n    int n = a.size();\n    for (int pass = 1; pass < n; pass++) {\n        for (int j = 0; j < n - pass; j++)\n            if (a[j] > a[j + 1]) {\n                int t = a[j]; a[j] = a[j + 1]; a[j + 1] = t;\n            }\n        cout << \"after pass \" << pass << \": \";\n        show(a);\n        cout << \"\\n\";\n    }\n}\nint main() {\n    vector<int> a = {5, 2, 4, 1};\n    bubble(a);\n    return 0;\n}\n"}, "clang": {"f": "main.c", "c": "#include <stdio.h>\n\nvoid show(int a[], int n) {\n    printf(\"[\");\n    for (int i = 0; i < n; i++) printf(\"%s%d\", i ? \", \" : \"\", a[i]);\n    printf(\"]\");\n}\nvoid bubble(int a[], int n) {\n    for (int pass = 1; pass < n; pass++) {\n        for (int j = 0; j < n - pass; j++)\n            if (a[j] > a[j + 1]) {\n                int t = a[j]; a[j] = a[j + 1]; a[j + 1] = t;\n            }\n        printf(\"after pass %d: \", pass);\n        show(a, n);\n        printf(\"\\n\");\n    }\n}\nint main() {\n    int a[] = {5, 2, 4, 1};\n    bubble(a, 4);\n    return 0;\n}\n"}}, "viz": {"type": "cells", "items": ["1", "2", "4", "5"], "labels": ["0", "1", "2", "3"], "hl": [], "caption": "Sorted result of [5, 2, 4, 1]"}}, {"h": "Merging", "p": ["Merging combines two sorted lists into one sorted list. Keep a pointer on each list, copy the smaller front element to the output, move that pointer, and finally copy the leftovers.", "This is the core step of merge sort."], "pts": ["Compare a[i] and b[j]; copy the smaller", "When one list ends, copy rest of the other", "Time O(m+n), extra space O(m+n)"], "code": {"f": "Main.java", "c": "import java.util.Arrays;\npublic class Main {\n    static int[] merge(int[] a, int[] b) {\n        int[] c = new int[a.length + b.length];\n        int i = 0, j = 0, k = 0;\n        while (i < a.length && j < b.length)\n            c[k++] = (a[i] <= b[j]) ? a[i++] : b[j++];\n        while (i < a.length) c[k++] = a[i++];\n        while (j < b.length) c[k++] = b[j++];\n        return c;\n    }\n    public static void main(String[] args) {\n        int[] r = merge(new int[]{1, 4, 8}, new int[]{2, 3, 9});\n        System.out.println(Arrays.toString(r));\n    }\n}", "out": "[1, 2, 3, 4, 8, 9]", "cpp": {"f": "main.cpp", "c": "#include <iostream>\n#include <vector>\nusing namespace std;\n\nvector<int> merge(const vector<int>& a, const vector<int>& b) {\n    vector<int> c(a.size() + b.size());\n    size_t i = 0, j = 0, k = 0;\n    while (i < a.size() && j < b.size())\n        c[k++] = (a[i] <= b[j]) ? a[i++] : b[j++];\n    while (i < a.size()) c[k++] = a[i++];\n    while (j < b.size()) c[k++] = b[j++];\n    return c;\n}\nint main() {\n    vector<int> r = merge({1, 4, 8}, {2, 3, 9});\n    cout << \"[\";\n    for (size_t i = 0; i < r.size(); i++) cout << (i ? \", \" : \"\") << r[i];\n    cout << \"]\\n\";\n    return 0;\n}\n"}, "clang": {"f": "main.c", "c": "#include <stdio.h>\n\nvoid merge(int a[], int na, int b[], int nb, int c[]) {\n    int i = 0, j = 0, k = 0;\n    while (i < na && j < nb)\n        c[k++] = (a[i] <= b[j]) ? a[i++] : b[j++];\n    while (i < na) c[k++] = a[i++];\n    while (j < nb) c[k++] = b[j++];\n}\nint main() {\n    int a[] = {1, 4, 8}, b[] = {2, 3, 9}, r[6];\n    merge(a, 3, b, 3, r);\n    printf(\"[\");\n    for (int i = 0; i < 6; i++) printf(\"%s%d\", i ? \", \" : \"\", r[i]);\n    printf(\"]\\n\");\n    return 0;\n}\n"}}, "viz": {"type": "merge", "parents": ["[1, 4, 8]", "[2, 3, 9]"], "child": "[1,2,3,4,8,9]", "bad": false, "caption": "Merging two sorted arrays"}}, {"h": "Complexity summary", "p": ["n is the number of elements. Insertion and deletion are costly in arrays because of shifting; linked lists avoid shifting (later topic)."], "table": {"head": ["Operation", "Time (worst)", "Extra space"], "rows": [["Traversal", "O(n)", "O(1)"], ["Insertion", "O(n)", "O(1)"], ["Deletion", "O(n)", "O(1)"], ["Linear search", "O(n)", "O(1)"], ["Binary search", "O(log n)", "O(1)"], ["Bubble sort", "O(n^2)", "O(1)"], ["Merging (m, n)", "O(m+n)", "O(m+n)"]]}}], "analogy": "Think of a bookshelf. Walking along it is traversal, adding a book in between is insertion (others slide), taking one out is deletion, finding a title is searching, arranging by author is sorting and joining two shelves is merging.", "hinglish": "Bhai kisi bhi data structure pe chhe kaam hote hain: traversal (sab dekhna), insertion (daalna), deletion (nikalna), searching (dhundhna), sorting (order me lagana) aur merging (do list ko jodna). Array me insert/delete karte waqt elements ko shift karna padta hai, isliye O(n) lagta hai.", "mistakes": ["Using binary search on an unsorted array.", "Shifting in the wrong direction during insertion (start from the end, not from pos, or you overwrite data).", "Forgetting to update n after insertion or deletion.", "Saying insertion at the end of an array is always O(1); it is only if free space exists."], "remember": ["Basic operations: traversal, insertion, deletion, searching, sorting, merging.", "Traversal visits each element once: O(n).", "Array insertion at position pos shifts elements pos..n-1 right: O(n).", "Array deletion at pos shifts elements pos+1..n-1 left: O(n).", "Overflow: insert into a full structure. Underflow: delete from an empty one.", "Linear search: any array, O(n). Binary search: sorted array, O(log n).", "Binary search: mid = (lo+hi)/2; if a[mid] < key go right, else go left.", "Bubble sort: n-1 passes, adjacent swaps, O(n^2).", "Merging two sorted arrays of sizes m and n: O(m+n).", "Searching is successful if the key is found, else unsuccessful.", "Sorting makes searching and merging easier."], "uses": ["Traversal: printing, summing, finding max/min", "Insertion/deletion: editors, playlists, databases", "Searching: contact search, login lookup", "Sorting: rank lists, report generation", "Merging: merge sort, combining sorted log files"], "pros": ["Small set of operations explains most data structure work", "Each operation has a clear algorithm and cost"], "cons": ["Array insertion and deletion are slow (shifting)", "Binary search and merging need sorted data", "Merging needs extra memory"], "def": "Every data structure is defined by the operations it supports. The six most common are listed below. We use a simple array with n elements to explain each one."}, "u1-t3": {"tldr": "What an algorithm is, its properties, how to write it, and how to analyse its time and space with step counting and best/average/worst cases.", "sections": [{"h": "What is an algorithm?", "p": ["Example: find the largest number in a list. Start with the first number as max, compare with every other number, update max when a bigger one appears, and finally report max."], "code": {"f": "Main.java", "c": "public class Main {\n    // Algorithm Max(A, n): returns largest element\n    static int max(int[] a) {\n        int m = a[0];                       // 1. m = A[0]\n        for (int i = 1; i < a.length; i++)  // 2. for i = 1 to n-1\n            if (a[i] > m) m = a[i];         // 3.   if A[i] > m then m = A[i]\n        return m;                           // 4. return m\n    }\n    public static void main(String[] args) {\n        System.out.println(max(new int[]{7, 3, 9, 4}));\n    }\n}", "out": "9", "cpp": {"f": "main.cpp", "c": "#include <iostream>\nusing namespace std;\n\n// Algorithm Max(A, n): returns largest element\nint maxOf(int a[], int n) {\n    int m = a[0];                       // 1. m = A[0]\n    for (int i = 1; i < n; i++)         // 2. for i = 1 to n-1\n        if (a[i] > m) m = a[i];         // 3.   if A[i] > m then m = A[i]\n    return m;                           // 4. return m\n}\nint main() {\n    int a[] = {7, 3, 9, 4};\n    cout << maxOf(a, 4) << \"\\n\";\n    return 0;\n}\n"}, "clang": {"f": "main.c", "c": "#include <stdio.h>\n\n/* Algorithm Max(A, n): returns largest element */\nint maxOf(int a[], int n) {\n    int m = a[0];                       /* 1. m = A[0] */\n    for (int i = 1; i < n; i++)         /* 2. for i = 1 to n-1 */\n        if (a[i] > m) m = a[i];         /* 3.   if A[i] > m then m = A[i] */\n    return m;                           /* 4. return m */\n}\nint main() {\n    int a[] = {7, 3, 9, 4};\n    printf(\"%d\\n\", maxOf(a, 4));\n    return 0;\n}\n"}}}, {"h": "Properties of an algorithm", "p": ["For a procedure to be called an algorithm it must have these five properties (Knuth):"], "pts": ["Input: zero or more values given from outside", "Output: at least one result is produced", "Definiteness: every step is clear and unambiguous", "Finiteness: it must stop after a finite number of steps", "Effectiveness: every step is basic enough to be done exactly in finite time"], "tip": "Qualities of a GOOD algorithm: correct, efficient (less time and space), simple, general and easy to modify.", "viz": {"type": "chain", "items": ["Input", "Finite clear steps", "Output"], "caption": "Shape of every algorithm"}}, {"h": "Pseudocode and flowchart", "p": ["Pseudocode is an informal, language-free description using plain English and programming-like structure (if, for, while). It is easy to read and quickly converted to code.", "A flowchart is a diagram: oval = start/stop, rectangle = process, parallelogram = input/output, diamond = decision, arrows = flow."], "pts": ["Pseudocode: Algorithm Max(A, n) ... m <- A[0]; for i <- 1 to n-1 do; if A[i] > m then m <- A[i]; return m", "Use <- for assignment, indentation for blocks, comments with //", "Flowchart is good for small logic; pseudocode scales better"], "viz": {"type": "chain", "items": ["Start", "m = A[0], i = 1", "i < n ?", "if A[i] > m: m = A[i]; i++", "Print m, Stop"], "labels": ["", "yes (loop)", "", "no"], "caption": "Flowchart idea for finding max"}}, {"h": "Analysis of algorithms", "p": ["Analysis predicts the resources an algorithm needs: time (how many basic steps) and space (how much memory). We express them as functions of the input size n, so we can compare algorithms without depending on a machine.", "A priori analysis is done before running, on the algorithm itself, and is machine independent. A posteriori analysis measures real run time on a machine and depends on hardware, language and load. DSA mostly uses a priori."], "tip": "Space = input space + auxiliary space. Iterative sum uses O(1) extra; recursive sum uses O(n) stack frames (depth 9 here: 8 calls plus the base case).", "code": {"f": "Main.java", "c": "public class Main {\n    static int maxDepth = 0;\n    static int sumIter(int[] a) {          // aux space O(1)\n        int s = 0;\n        for (int x : a) s += x;\n        return s;\n    }\n    static int sumRec(int[] a, int n, int depth) {  // aux space O(n)\n        maxDepth = Math.max(maxDepth, depth);\n        if (n == 0) return 0;\n        return a[n - 1] + sumRec(a, n - 1, depth + 1);\n    }\n    public static void main(String[] args) {\n        int[] a = {1, 2, 3, 4, 5, 6, 7, 8};\n        System.out.println(\"iterative = \" + sumIter(a));\n        System.out.println(\"recursive = \" + sumRec(a, a.length, 1));\n        System.out.println(\"max recursion depth = \" + maxDepth);\n    }\n}", "out": "iterative = 36\nrecursive = 36\nmax recursion depth = 9", "cpp": {"f": "main.cpp", "c": "#include <iostream>\n#include <vector>\n#include <algorithm>\nusing namespace std;\n\nint maxDepth = 0;\nint sumIter(const vector<int>& a) {          // aux space O(1)\n    int s = 0;\n    for (int x : a) s += x;\n    return s;\n}\nint sumRec(const vector<int>& a, int n, int depth) {  // aux space O(n)\n    maxDepth = max(maxDepth, depth);\n    if (n == 0) return 0;\n    return a[n - 1] + sumRec(a, n - 1, depth + 1);\n}\nint main() {\n    vector<int> a = {1, 2, 3, 4, 5, 6, 7, 8};\n    cout << \"iterative = \" << sumIter(a) << \"\\n\";\n    cout << \"recursive = \" << sumRec(a, a.size(), 1) << \"\\n\";\n    cout << \"max recursion depth = \" << maxDepth << \"\\n\";\n    return 0;\n}\n"}, "clang": {"f": "main.c", "c": "#include <stdio.h>\n\nint maxDepth = 0;\nint sumIter(int a[], int n) {          /* aux space O(1) */\n    int s = 0;\n    for (int i = 0; i < n; i++) s += a[i];\n    return s;\n}\nint sumRec(int a[], int n, int depth) {  /* aux space O(n) */\n    if (depth > maxDepth) maxDepth = depth;\n    if (n == 0) return 0;\n    return a[n - 1] + sumRec(a, n - 1, depth + 1);\n}\nint main() {\n    int a[] = {1, 2, 3, 4, 5, 6, 7, 8};\n    printf(\"iterative = %d\\n\", sumIter(a, 8));\n    printf(\"recursive = %d\\n\", sumRec(a, 8, 1));\n    printf(\"max recursion depth = %d\\n\", maxDepth);\n    return 0;\n}\n"}}, "table": {"head": ["Point", "Time complexity", "Space complexity"], "rows": [["Measures", "Number of steps", "Memory used"], ["Depends on", "Input size n", "Input size n"], ["Written as", "T(n)", "S(n)"], ["Total", "-", "Fixed part + variable part"]]}}, {"h": "Counting steps (frequency count)", "p": ["To find T(n), count how many times each statement runs and add them. Simple statements cost 1 step. A loop 'for i = 0 to n-1' tests its condition n+1 times (n true, 1 false) and runs its body n times.", "For the array sum: 1 (sum=0) + (n+1) loop tests + n additions + 1 return = 2n + 3 steps. For a nested loop of n x n, the inner statement runs n*n times."], "pts": ["Constants do not matter for growth: 2n+3 grows like n", "Single loop: n", "Two nested loops: n^2", "Counter variable in code verifies your count"], "code": {"f": "Main.java", "c": "public class Main {\n    static int sumSteps(int[] a) {\n        int count = 0, sum = 0;\n        count++;                         // sum = 0\n        for (int i = 0; i < a.length; i++) {\n            count++;                     // loop test (true)\n            sum += a[i];\n            count++;                     // sum += a[i]\n        }\n        count++;                         // last loop test (false)\n        count++;                         // return\n        return count;\n    }\n    static int nested(int n) {\n        int count = 0;\n        for (int i = 0; i < n; i++)\n            for (int j = 0; j < n; j++)\n                count++;                 // inner statement\n        return count;\n    }\n    public static void main(String[] args) {\n        for (int n : new int[]{5, 10, 20})\n            System.out.println(\"n=\" + n + \"  sum steps=\" + sumSteps(new int[n]) + \" (2n+3=\" + (2 * n + 3) + \")\");\n        for (int n : new int[]{3, 4, 5})\n            System.out.println(\"n=\" + n + \"  nested count=\" + nested(n));\n    }\n}", "out": "n=5  sum steps=13 (2n+3=13)\nn=10  sum steps=23 (2n+3=23)\nn=20  sum steps=43 (2n+3=43)\nn=3  nested count=9\nn=4  nested count=16\nn=5  nested count=25", "cpp": {"f": "main.cpp", "c": "#include <iostream>\n#include <vector>\nusing namespace std;\n\nint sumSteps(const vector<int>& a) {\n    int count = 0, sum = 0;\n    count++;                         // sum = 0\n    for (size_t i = 0; i < a.size(); i++) {\n        count++;                     // loop test (true)\n        sum += a[i];\n        count++;                     // sum += a[i]\n    }\n    count++;                         // last loop test (false)\n    count++;                         // return\n    return count;\n}\nint nested(int n) {\n    int count = 0;\n    for (int i = 0; i < n; i++)\n        for (int j = 0; j < n; j++)\n            count++;                 // inner statement\n    return count;\n}\nint main() {\n    for (int n : {5, 10, 20})\n        cout << \"n=\" << n << \"  sum steps=\" << sumSteps(vector<int>(n)) << \" (2n+3=\" << (2 * n + 3) << \")\\n\";\n    for (int n : {3, 4, 5})\n        cout << \"n=\" << n << \"  nested count=\" << nested(n) << \"\\n\";\n    return 0;\n}\n"}, "clang": {"f": "main.c", "c": "#include <stdio.h>\n\nint sumSteps(int n) {\n    int count = 0, sum = 0;\n    count++;                         /* sum = 0 */\n    for (int i = 0; i < n; i++) {\n        count++;                     /* loop test (true) */\n        sum += 0;\n        count++;                     /* sum += a[i] */\n    }\n    count++;                         /* last loop test (false) */\n    count++;                         /* return */\n    return count;\n}\nint nested(int n) {\n    int count = 0;\n    for (int i = 0; i < n; i++)\n        for (int j = 0; j < n; j++)\n            count++;                 /* inner statement */\n    return count;\n}\nint main() {\n    int s[] = {5, 10, 20}, t[] = {3, 4, 5};\n    for (int k = 0; k < 3; k++)\n        printf(\"n=%d  sum steps=%d (2n+3=%d)\\n\", s[k], sumSteps(s[k]), 2 * s[k] + 3);\n    for (int k = 0; k < 3; k++)\n        printf(\"n=%d  nested count=%d\\n\", t[k], nested(t[k]));\n    return 0;\n}\n"}}}, {"h": "Best, average and worst case", "p": ["The same algorithm can take different time for different inputs of the same size n. So we study three cases.", "Best case: the minimum steps over all inputs (lower limit). Worst case: the maximum steps (upper limit; a guarantee). Average case: expected steps over all inputs (needs probability assumption).", "Linear search on n elements: best = 1 comparison (key at first place), worst = n (key at last or absent), average = (1+2+...+n)/n = (n+1)/2 when the key is present and equally likely anywhere."], "tip": "Exams and practice mostly quote the worst case, because it is a guarantee that it will never be slower.", "code": {"f": "Main.java", "c": "public class Main {\n    static int comparisons;\n    static int linear(int[] a, int key) {\n        comparisons = 0;\n        for (int i = 0; i < a.length; i++) {\n            comparisons++;\n            if (a[i] == key) return i;\n        }\n        return -1;\n    }\n    public static void main(String[] args) {\n        int[] a = {40, 10, 30, 50, 20};\n        linear(a, 40); System.out.println(\"best  (first)   : \" + comparisons);\n        linear(a, 20); System.out.println(\"worst (last)    : \" + comparisons);\n        linear(a, 99); System.out.println(\"worst (absent)  : \" + comparisons);\n        int total = 0;\n        for (int x : a) { linear(a, x); total += comparisons; }\n        System.out.println(\"average         : \" + (double) total / a.length);\n    }\n}", "out": "best  (first)   : 1\nworst (last)    : 5\nworst (absent)  : 5\naverage         : 3.0", "cpp": {"f": "main.cpp", "c": "#include <iostream>\n#include <vector>\nusing namespace std;\n\nint comparisons;\nint linear(const vector<int>& a, int key) {\n    comparisons = 0;\n    for (size_t i = 0; i < a.size(); i++) {\n        comparisons++;\n        if (a[i] == key) return i;\n    }\n    return -1;\n}\nint main() {\n    vector<int> a = {40, 10, 30, 50, 20};\n    linear(a, 40); cout << \"best  (first)   : \" << comparisons << \"\\n\";\n    linear(a, 20); cout << \"worst (last)    : \" << comparisons << \"\\n\";\n    linear(a, 99); cout << \"worst (absent)  : \" << comparisons << \"\\n\";\n    int total = 0;\n    for (int x : a) { linear(a, x); total += comparisons; }\n    double avg = (double) total / a.size();\n    cout << \"average         : \" << avg;\n    if (avg == (long long) avg) cout << \".0\";   // Java prints 3.0\n    cout << \"\\n\";\n    return 0;\n}\n"}, "clang": {"f": "main.c", "c": "#include <stdio.h>\n\nint comparisons;\nint linear(int a[], int n, int key) {\n    comparisons = 0;\n    for (int i = 0; i < n; i++) {\n        comparisons++;\n        if (a[i] == key) return i;\n    }\n    return -1;\n}\nint main() {\n    int a[] = {40, 10, 30, 50, 20}, n = 5;\n    linear(a, n, 40); printf(\"best  (first)   : %d\\n\", comparisons);\n    linear(a, n, 20); printf(\"worst (last)    : %d\\n\", comparisons);\n    linear(a, n, 99); printf(\"worst (absent)  : %d\\n\", comparisons);\n    int total = 0;\n    for (int i = 0; i < n; i++) { linear(a, n, a[i]); total += comparisons; }\n    printf(\"average         : %.1f\\n\", (double) total / n);\n    return 0;\n}\n"}}, "table": {"head": ["Case", "Comparisons", "Complexity"], "rows": [["Best", "1", "O(1)"], ["Average", "(n+1)/2", "O(n)"], ["Worst", "n", "O(n)"]]}}, {"h": "Why analyse? Choosing between algorithms", "p": ["Two correct algorithms can differ hugely in speed. Analysis tells which will scale when input grows from 100 to 1,000,000. We compare their growth rates, which is why we need asymptotic notations (next topic)."], "pts": ["Faster algorithm saves time and cost", "Less memory lets program run on small devices", "Helps to avoid trial and error on big inputs"]}], "analogy": "An algorithm is a recipe. It has ingredients (input), clear steps, ends after the last step and gives a dish (output). Analysis asks: how long will it take and how many vessels will I need if guests increase?", "hinglish": "Bhai algorithm matlab kisi problem ko solve karne ke limited aur clear steps, bilkul recipe jaisa. Analysis me hum dekhte hain kitna time (steps) aur kitni memory lagegi jab input n bada hota hai. Linear search me best case 1 comparison, worst case n, average lagbhag (n+1)/2.", "mistakes": ["Saying an algorithm can run forever; finiteness is mandatory.", "Confusing time complexity with actual running seconds.", "Taking average case as (best+worst)/2 without checking probabilities.", "Ignoring recursion stack when counting space."], "remember": ["Algorithm: finite, ordered, unambiguous steps to solve a problem.", "Properties: input, output, definiteness, finiteness, effectiveness.", "Algorithm is language independent; program is its implementation.", "Pseudocode: plain, structured description. Flowchart: diagram with oval, rectangle, parallelogram, diamond.", "Analysis measures time and space as functions of n.", "A priori: before execution, machine independent. A posteriori: measured on a machine.", "Frequency count: number of times each statement executes.", "for i=1..n: test runs n+1 times, body runs n times.", "Array sum takes 2n+3 steps; nested n x n loop body runs n^2 times.", "Space = fixed part + variable part (auxiliary + input).", "Best case = minimum, worst = maximum, average = expected steps.", "Linear search: best 1, average (n+1)/2, worst n."], "uses": ["Choosing the right algorithm for large data", "Estimating cost of cloud and server operations", "Competitive programming and interviews", "Comparing designs before writing code"], "pros": ["Machine-independent comparison", "Finds bottlenecks before coding", "Worst-case analysis gives a guarantee"], "cons": ["Ignores constant factors and hardware", "Average case needs input assumptions", "Counting steps by hand is error-prone for complex code"], "def": "An algorithm is a finite sequence of well-defined instructions that takes some input, performs steps and produces output in a finite amount of time. It is independent of any programming language; a program is an algorithm written in a language."}, "u1-t4": {"tldr": "Big-O, Omega, Theta and little-o: how we describe the growth of running time for large n, with common growth rates and rules.", "sections": [{"h": "Why asymptotic notation?", "p": ["Example: for n = 1,000,000, the term 7n in 5n^2 + 7n is tiny next to 5n^2. So we say the algorithm is of order n^2."], "viz": {"type": "chain", "items": ["Exact count T(n)", "Drop constants", "Drop small terms", "Order of growth"], "labels": ["", "", ""], "caption": "From step count to notation"}}, {"h": "Big-O notation (upper bound)", "p": ["f(n) = O(g(n)) if there exist positive constants c and n0 such that f(n) <= c * g(n) for all n >= n0. It means f grows no faster than g. It is used for the worst case.", "Example: f(n) = 3n + 2. Take c = 4, n0 = 2. Then 3n + 2 <= 4n for n >= 2, so f(n) = O(n). It is also O(n^2) (a loose bound), but we give the tightest one."], "tip": "Big-O only needs ONE pair (c, n0) to exist.", "code": {"f": "Main.java", "c": "public class Main {\n    public static void main(String[] args) {\n        // f(n) = 3n + 2, g(n) = n. Claim: f(n) <= 4*g(n) for all n >= 2\n        boolean ok = true;\n        for (int n = 2; n <= 1000; n++)\n            if (3 * n + 2 > 4 * n) ok = false;\n        System.out.println(\"3n+2 <= 4n for n=2..1000 : \" + ok);\n        System.out.println(\"n=1 check: \" + (3 * 1 + 2) + \" <= \" + 4 * 1 + \" ? \" + (5 <= 4));\n    }\n}", "out": "3n+2 <= 4n for n=2..1000 : true\nn=1 check: 5 <= 4 ? false", "cpp": {"f": "main.cpp", "c": "#include <iostream>\nusing namespace std;\n\nint main() {\n    // f(n) = 3n + 2, g(n) = n. Claim: f(n) <= 4*g(n) for all n >= 2\n    bool ok = true;\n    for (int n = 2; n <= 1000; n++)\n        if (3 * n + 2 > 4 * n) ok = false;\n    cout << boolalpha;\n    cout << \"3n+2 <= 4n for n=2..1000 : \" << ok << \"\\n\";\n    cout << \"n=1 check: \" << (3 * 1 + 2) << \" <= \" << 4 * 1 << \" ? \" << (5 <= 4) << \"\\n\";\n    return 0;\n}\n"}, "clang": {"f": "main.c", "c": "#include <stdio.h>\n\nint main() {\n    /* f(n) = 3n + 2, g(n) = n. Claim: f(n) <= 4*g(n) for all n >= 2 */\n    int ok = 1;\n    for (int n = 2; n <= 1000; n++)\n        if (3 * n + 2 > 4 * n) ok = 0;\n    printf(\"3n+2 <= 4n for n=2..1000 : %s\\n\", ok ? \"true\" : \"false\");\n    printf(\"n=1 check: %d <= %d ? %s\\n\", 3 * 1 + 2, 4 * 1, (5 <= 4) ? \"true\" : \"false\");\n    return 0;\n}\n"}}}, {"h": "Omega notation (lower bound)", "p": ["f(n) = Omega(g(n)) if there exist positive constants c and n0 such that f(n) >= c * g(n) for all n >= n0. It means f grows at least as fast as g. It is used for the best case.", "Example: 3n + 2 >= 3n for n >= 1, so 3n + 2 = Omega(n). Linear search is Omega(1) in the best case (key at the first place)."]}, {"h": "Theta notation (tight bound)", "p": ["f(n) = Theta(g(n)) if there exist positive constants c1, c2 and n0 such that c1 * g(n) <= f(n) <= c2 * g(n) for all n >= n0. It means f is bounded above AND below by g, so g is the exact order.", "Also: f = Theta(g) if and only if f = O(g) and f = Omega(g). Example: 3n + 2 is Theta(n) with c1 = 3, c2 = 4, n0 = 2."], "code": {"f": "Main.java", "c": "public class Main {\n    public static void main(String[] args) {\n        // f(n) = 3n + 2 ; show 3n <= f(n) <= 4n for n >= 2  => Theta(n)\n        boolean ok = true;\n        for (int n = 2; n <= 1000; n++) {\n            int f = 3 * n + 2;\n            if (!(3 * n <= f && f <= 4 * n)) ok = false;\n        }\n        System.out.println(\"c1=3, c2=4, n0=2 holds: \" + ok);\n    }\n}", "out": "c1=3, c2=4, n0=2 holds: true", "cpp": {"f": "main.cpp", "c": "#include <iostream>\nusing namespace std;\n\nint main() {\n    // f(n) = 3n + 2 ; show 3n <= f(n) <= 4n for n >= 2  => Theta(n)\n    bool ok = true;\n    for (int n = 2; n <= 1000; n++) {\n        int f = 3 * n + 2;\n        if (!(3 * n <= f && f <= 4 * n)) ok = false;\n    }\n    cout << boolalpha;\n    cout << \"c1=3, c2=4, n0=2 holds: \" << ok << \"\\n\";\n    return 0;\n}\n"}, "clang": {"f": "main.c", "c": "#include <stdio.h>\n\nint main() {\n    /* f(n) = 3n + 2 ; show 3n <= f(n) <= 4n for n >= 2  => Theta(n) */\n    int ok = 1;\n    for (int n = 2; n <= 1000; n++) {\n        int f = 3 * n + 2;\n        if (!(3 * n <= f && f <= 4 * n)) ok = 0;\n    }\n    printf(\"c1=3, c2=4, n0=2 holds: %s\\n\", ok ? \"true\" : \"false\");\n    return 0;\n}\n"}}, "table": {"head": ["Notation", "Meaning", "Bound", "Used for"], "rows": [["O(g)", "f <= c*g", "Upper", "Worst case"], ["Omega(g)", "f >= c*g", "Lower", "Best case"], ["Theta(g)", "c1*g <= f <= c2*g", "Tight", "Exact order"]]}}, {"h": "Little-o and little-omega", "p": ["Little-o means a STRICT upper bound: f(n) = o(g(n)) if f grows strictly slower than g, i.e. f(n)/g(n) tends to 0 as n grows. Example: n = o(n^2) but n^2 is not o(n^2). Big-O allows equal growth; little-o does not.", "Little-omega is the strict lower bound: f(n) = omega(g(n)) if f grows strictly faster than g. Example: n^2 = omega(n)."], "pts": ["O: f <= c*g (can be equal order)", "o: f < c*g for every c (strictly smaller order)", "Omega / omega: same idea for lower bound"]}, {"h": "Common growth rates", "p": ["These are the orders you must remember, from slowest-growing (best) to fastest-growing (worst): O(1) < O(log n) < O(n) < O(n log n) < O(n^2) < O(n^3) < O(2^n) < O(n!).", "The table below computes each function for powers of 2. Notice how 2^n explodes while log n barely moves."], "warn": "O(2^n) algorithms become unusable beyond n of about 40-50. Always prefer a polynomial algorithm.", "code": {"f": "Main.java", "c": "public class Main {\n    public static void main(String[] args) {\n        System.out.printf(\"%4s %6s %6s %8s %6s %8s%n\", \"n\", \"1\", \"logn\", \"nlogn\", \"n^2\", \"2^n\");\n        for (int n = 1; n <= 32; n *= 2) {\n            int lg = Integer.numberOfTrailingZeros(n);   // log2 of a power of 2\n            System.out.printf(\"%4d %6d %6d %8d %6d %8d%n\", n, 1, lg, n * lg, n * n, 1L << n);\n        }\n    }\n}", "out": "   n      1   logn    nlogn    n^2      2^n\n   1      1      0        0      1        2\n   2      1      1        2      4        4\n   4      1      2        8     16       16\n   8      1      3       24     64      256\n  16      1      4       64    256    65536\n  32      1      5      160   1024 4294967296", "cpp": {"f": "main.cpp", "c": "#include <cstdio>\n\nint main() {\n    printf(\"%4s %6s %6s %8s %6s %8s\\n\", \"n\", \"1\", \"logn\", \"nlogn\", \"n^2\", \"2^n\");\n    for (int n = 1; n <= 32; n *= 2) {\n        int lg = __builtin_ctz(n);   // log2 of a power of 2\n        printf(\"%4d %6d %6d %8d %6d %8lld\\n\", n, 1, lg, n * lg, n * n, 1LL << n);\n    }\n    return 0;\n}\n"}, "clang": {"f": "main.c", "c": "#include <stdio.h>\n\nint main() {\n    printf(\"%4s %6s %6s %8s %6s %8s\\n\", \"n\", \"1\", \"logn\", \"nlogn\", \"n^2\", \"2^n\");\n    for (int n = 1; n <= 32; n *= 2) {\n        int lg = 0;\n        while ((1 << lg) < n) lg++;   /* log2 of a power of 2 */\n        printf(\"%4d %6d %6d %8d %6d %8lld\\n\", n, 1, lg, n * lg, n * n, 1LL << n);\n    }\n    return 0;\n}\n"}}, "table": {"head": ["Class", "Name", "Example"], "rows": [["O(1)", "Constant", "Array access a[i]"], ["O(log n)", "Logarithmic", "Binary search"], ["O(n)", "Linear", "Linear search, traversal"], ["O(n log n)", "Linearithmic", "Merge sort"], ["O(n^2)", "Quadratic", "Bubble sort"], ["O(2^n)", "Exponential", "Naive Fibonacci, subsets"]]}}, {"h": "Finding Big-O of loops", "p": ["Count how many times the innermost statement runs as a function of n, then keep the dominant term."], "pts": ["Single loop i++ up to n: O(n)", "Loop where i is multiplied or divided by 2: O(log n)", "Nested loops (each up to n): O(n^2)", "Inner loop j < i: 0+1+...+(n-1) = n(n-1)/2, so O(n^2)", "Loops one after another: add, keep the larger, e.g. O(n)+O(n) = O(n)", "Outer n times, inner halving: O(n log n)"], "code": {"f": "Main.java", "c": "public class Main {\n    public static void main(String[] args) {\n        int n = 16, c;\n        c = 0; for (int i = 0; i < n; i++) c++;\n        System.out.println(\"single loop i++        : \" + c);\n        c = 0; for (int i = 1; i < n; i *= 2) c++;\n        System.out.println(\"i *= 2 (log n)         : \" + c);\n        c = 0; for (int i = 0; i < n; i++) for (int j = 0; j < n; j++) c++;\n        System.out.println(\"nested n x n           : \" + c);\n        c = 0; for (int i = 0; i < n; i++) for (int j = 0; j < i; j++) c++;\n        System.out.println(\"inner j < i (n(n-1)/2) : \" + c);\n        c = 0; for (int i = 0; i < n; i++) c++; for (int j = 0; j < n; j++) c++;\n        System.out.println(\"two loops one by one   : \" + c);\n        c = 0; for (int i = 0; i < n; i++) for (int j = 1; j < n; j *= 2) c++;\n        System.out.println(\"n x log n              : \" + c);\n    }\n}", "out": "single loop i++        : 16\ni *= 2 (log n)         : 4\nnested n x n           : 256\ninner j < i (n(n-1)/2) : 120\ntwo loops one by one   : 32\nn x log n              : 64", "cpp": {"f": "main.cpp", "c": "#include <iostream>\nusing namespace std;\n\nint main() {\n    int n = 16, c;\n    c = 0; for (int i = 0; i < n; i++) c++;\n    cout << \"single loop i++        : \" << c << \"\\n\";\n    c = 0; for (int i = 1; i < n; i *= 2) c++;\n    cout << \"i *= 2 (log n)         : \" << c << \"\\n\";\n    c = 0; for (int i = 0; i < n; i++) for (int j = 0; j < n; j++) c++;\n    cout << \"nested n x n           : \" << c << \"\\n\";\n    c = 0; for (int i = 0; i < n; i++) for (int j = 0; j < i; j++) c++;\n    cout << \"inner j < i (n(n-1)/2) : \" << c << \"\\n\";\n    c = 0; for (int i = 0; i < n; i++) c++; for (int j = 0; j < n; j++) c++;\n    cout << \"two loops one by one   : \" << c << \"\\n\";\n    c = 0; for (int i = 0; i < n; i++) for (int j = 1; j < n; j *= 2) c++;\n    cout << \"n x log n              : \" << c << \"\\n\";\n    return 0;\n}\n"}, "clang": {"f": "main.c", "c": "#include <stdio.h>\n\nint main() {\n    int n = 16, c;\n    c = 0; for (int i = 0; i < n; i++) c++;\n    printf(\"single loop i++        : %d\\n\", c);\n    c = 0; for (int i = 1; i < n; i *= 2) c++;\n    printf(\"i *= 2 (log n)         : %d\\n\", c);\n    c = 0; for (int i = 0; i < n; i++) for (int j = 0; j < n; j++) c++;\n    printf(\"nested n x n           : %d\\n\", c);\n    c = 0; for (int i = 0; i < n; i++) for (int j = 0; j < i; j++) c++;\n    printf(\"inner j < i (n(n-1)/2) : %d\\n\", c);\n    c = 0; for (int i = 0; i < n; i++) c++; for (int j = 0; j < n; j++) c++;\n    printf(\"two loops one by one   : %d\\n\", c);\n    c = 0; for (int i = 0; i < n; i++) for (int j = 1; j < n; j *= 2) c++;\n    printf(\"n x log n              : %d\\n\", c);\n    return 0;\n}\n"}}}, {"h": "Rules of Big-O", "p": ["These rules let you find Big-O quickly without any proof."], "pts": ["Drop constants: O(5n) = O(n)", "Drop lower-order terms: O(n^2 + n) = O(n^2)", "Sum rule (sequential code): O(f) + O(g) = O(max(f, g))", "Product rule (nested code): O(f) * O(g) = O(f * g)", "Transitivity: f = O(g) and g = O(h) gives f = O(h)", "Different inputs need different letters: loops over arrays of size a then b give O(a + b), not O(n)", "Base of log does not matter: log2 n and log10 n differ by a constant"], "table": {"head": ["Exact T(n)", "Big-O", "Reason"], "rows": [["3n + 2", "O(n)", "drop constants"], ["5n^2 + 7n + 1", "O(n^2)", "largest term"], ["n + n log n", "O(n log n)", "n log n dominates"], ["2^n + n^3", "O(2^n)", "exponential wins"]]}}], "analogy": "If a trip takes 3 hours plus 2 minutes of parking, the 2 minutes do not matter for a long journey. Asymptotic notation keeps only the part that matters when the journey (n) becomes huge.", "hinglish": "Bhai asymptotic notation ka matlab hai jab n bahut bada ho to time kaise badhta hai. Big-O worst case upper limit hai, Omega lower limit, Theta dono ke beech tight limit. 3n+2 ko hum seedha O(n) bolte hain kyunki constant aur chhote terms ignore hote hain.", "mistakes": ["Writing O(2n) or O(n + 5); simplify to O(n).", "Thinking Big-O is only for worst case and Omega only for best; they are bounds on a function, the case is chosen separately.", "Saying O(n) algorithm is always faster than O(n^2) for small n; constants matter for small inputs.", "Treating two different input sizes as one n."], "remember": ["Asymptotic notation = growth of T(n) for large n.", "Big-O: f(n) <= c g(n) for n >= n0; upper bound; worst case.", "Omega: f(n) >= c g(n) for n >= n0; lower bound; best case.", "Theta: c1 g(n) <= f(n) <= c2 g(n); tight bound.", "Theta(g) iff both O(g) and Omega(g).", "Little-o: strict upper bound; little-omega: strict lower bound.", "Order: 1 < log n < n < n log n < n^2 < n^3 < 2^n < n!", "Halving/doubling loops give O(log n).", "Nested loops multiply, sequential loops add.", "Drop constants and lower-order terms.", "3n+2 = O(n) with c=4, n0=2.", "Log base is irrelevant in Big-O."], "uses": ["Comparing sorting and searching algorithms", "Predicting how code scales with data size", "Interview and exam analysis questions", "Setting performance requirements for systems"], "pros": ["Machine independent", "Simple, compact way to compare algorithms", "Focuses on scalability"], "cons": ["Hides constant factors that matter for small n", "Big-O alone can be a loose bound", "Does not show memory or cache behaviour"], "def": "Exact step counts like 3n+2 or 5n^2+7n+1 are messy and depend on the machine. What matters is how fast the count grows when n becomes very large. Asymptotic notation gives this growth rate with a simple function, ignoring constants and smaller terms."}, "u1-t5": {"tldr": "Using more memory to save time, or less memory at the cost of more time: lookup tables, memoization, compression and recomputation.", "sections": [{"h": "The idea", "p": ["Which side to choose depends on the situation: a phone with small memory prefers low space; a server answering millions of queries prefers low time."], "tip": "Not every algorithm has a trade-off. Some are better in both (binary search vs linear search on sorted data, after sorting once).", "table": {"head": ["Strategy", "Time", "Space"], "rows": [["Store results (table, memo)", "Less", "More"], ["Recompute every time", "More", "Less"], ["Compress data", "More (pack/unpack)", "Less"], ["Uncompressed data", "Less", "More"]]}}, {"h": "Example 1: Lookup table", "p": ["A lookup table stores precomputed answers in an array. Instead of calculating again, we just read the value: O(1) time at the cost of extra space.", "Here we count set bits (1s) in a byte. The loop method needs 8 steps per number and no memory. The table method needs 1 step per number but stores 256 values."], "pts": ["Build the table once (extra time up front)", "Each query is a single array read", "Good when same calculation is repeated many times"], "code": {"f": "Main.java", "c": "public class Main {\n    static int steps;\n    static int bitsLoop(int x) {          // no extra memory, 8 steps per call\n        int c = 0;\n        for (int i = 0; i < 8; i++) { steps++; c += (x >> i) & 1; }\n        return c;\n    }\n    public static void main(String[] args) {\n        int[] table = new int[256];       // extra memory: 256 ints\n        for (int x = 0; x < 256; x++) table[x] = bitsLoop(x);  // built once\n        steps = 0;\n        int sumA = 0, sumB = 0;\n        for (int x = 0; x < 256; x++) sumA += bitsLoop(x);\n        int loopSteps = steps;\n        for (int x = 0; x < 256; x++) sumB += table[x];        // 1 step each\n        System.out.println(\"loop method : total=\" + sumA + \", steps=\" + loopSteps);\n        System.out.println(\"table method: total=\" + sumB + \", steps=256, extra memory=256 ints\");\n    }\n}", "out": "loop method : total=1024, steps=2048\ntable method: total=1024, steps=256, extra memory=256 ints", "cpp": {"f": "main.cpp", "c": "#include <iostream>\nusing namespace std;\n\nint steps;\nint bitsLoop(int x) {          // no extra memory, 8 steps per call\n    int c = 0;\n    for (int i = 0; i < 8; i++) { steps++; c += (x >> i) & 1; }\n    return c;\n}\nint main() {\n    int table[256];            // extra memory: 256 ints\n    for (int x = 0; x < 256; x++) table[x] = bitsLoop(x);  // built once\n    steps = 0;\n    int sumA = 0, sumB = 0;\n    for (int x = 0; x < 256; x++) sumA += bitsLoop(x);\n    int loopSteps = steps;\n    for (int x = 0; x < 256; x++) sumB += table[x];        // 1 step each\n    cout << \"loop method : total=\" << sumA << \", steps=\" << loopSteps << \"\\n\";\n    cout << \"table method: total=\" << sumB << \", steps=256, extra memory=256 ints\\n\";\n    return 0;\n}\n"}, "clang": {"f": "main.c", "c": "#include <stdio.h>\n\nint steps;\nint bitsLoop(int x) {          /* no extra memory, 8 steps per call */\n    int c = 0;\n    for (int i = 0; i < 8; i++) { steps++; c += (x >> i) & 1; }\n    return c;\n}\nint main() {\n    int table[256];            /* extra memory: 256 ints */\n    for (int x = 0; x < 256; x++) table[x] = bitsLoop(x);  /* built once */\n    steps = 0;\n    int sumA = 0, sumB = 0;\n    for (int x = 0; x < 256; x++) sumA += bitsLoop(x);\n    int loopSteps = steps;\n    for (int x = 0; x < 256; x++) sumB += table[x];        /* 1 step each */\n    printf(\"loop method : total=%d, steps=%d\\n\", sumA, loopSteps);\n    printf(\"table method: total=%d, steps=256, extra memory=256 ints\\n\", sumB);\n    return 0;\n}\n"}}}, {"h": "Example 2: Memoization (Fibonacci)", "p": ["Plain recursive Fibonacci recomputes the same sub-problems again and again, so time is O(2^n). Memoization stores each result the first time it is computed in an array (memo) and reuses it. Time drops to O(n) and extra space is O(n).", "This is the classic trade-off: a small array turns an exponential algorithm into a linear one."], "tip": "Iterative Fibonacci with two variables is best of both; trade-off is not always forced.", "code": {"f": "Main.java", "c": "public class Main {\n    static int calls;\n    static long fib(int n) {                 // time O(2^n), space O(n) stack\n        calls++;\n        return n < 2 ? n : fib(n - 1) + fib(n - 2);\n    }\n    static long[] memo = new long[31];       // extra memory O(n)\n    static long fibMemo(int n) {             // time O(n)\n        calls++;\n        if (n < 2) return n;\n        if (memo[n] != 0) return memo[n];\n        return memo[n] = fibMemo(n - 1) + fibMemo(n - 2);\n    }\n    public static void main(String[] args) {\n        calls = 0; long a = fib(20);\n        System.out.println(\"plain fib(20) = \" + a + \", calls = \" + calls);\n        calls = 0; long b = fibMemo(20);\n        System.out.println(\"memo  fib(20) = \" + b + \", calls = \" + calls);\n    }\n}", "out": "plain fib(20) = 6765, calls = 21891\nmemo  fib(20) = 6765, calls = 39", "cpp": {"f": "main.cpp", "c": "#include <iostream>\nusing namespace std;\n\nint calls;\nlong long fib(int n) {                 // time O(2^n), space O(n) stack\n    calls++;\n    return n < 2 ? n : fib(n - 1) + fib(n - 2);\n}\nlong long memo[31];                    // extra memory O(n), zero-initialised\nlong long fibMemo(int n) {             // time O(n)\n    calls++;\n    if (n < 2) return n;\n    if (memo[n] != 0) return memo[n];\n    return memo[n] = fibMemo(n - 1) + fibMemo(n - 2);\n}\nint main() {\n    calls = 0; long long a = fib(20);\n    cout << \"plain fib(20) = \" << a << \", calls = \" << calls << \"\\n\";\n    calls = 0; long long b = fibMemo(20);\n    cout << \"memo  fib(20) = \" << b << \", calls = \" << calls << \"\\n\";\n    return 0;\n}\n"}, "clang": {"f": "main.c", "c": "#include <stdio.h>\n\nint calls;\nlong long fib(int n) {                 /* time O(2^n), space O(n) stack */\n    calls++;\n    return n < 2 ? n : fib(n - 1) + fib(n - 2);\n}\nlong long memo[31];                    /* extra memory O(n), zero-initialised */\nlong long fibMemo(int n) {             /* time O(n) */\n    calls++;\n    if (n < 2) return n;\n    if (memo[n] != 0) return memo[n];\n    return memo[n] = fibMemo(n - 1) + fibMemo(n - 2);\n}\nint main() {\n    calls = 0; long long a = fib(20);\n    printf(\"plain fib(20) = %lld, calls = %d\\n\", a, calls);\n    calls = 0; long long b = fibMemo(20);\n    printf(\"memo  fib(20) = %lld, calls = %d\\n\", b, calls);\n    return 0;\n}\n"}}, "table": {"head": ["Version", "Time", "Space"], "rows": [["Plain recursion", "O(2^n)", "O(n) stack"], ["Memoization", "O(n)", "O(n) memo + stack"], ["Iterative (2 variables)", "O(n)", "O(1)"]]}}, {"h": "Example 3: Compressed vs uncompressed data", "p": ["Compression stores the same information in fewer bytes, saving space. But we need time to compress and decompress, and random access becomes slower.", "Run-length encoding (RLE) replaces repeated characters with the character and its count: 'aaaabbbccd' becomes 'a4b3c2d1'. Uncompressed text allows direct index access in O(1); packed text needs a scan."], "warn": "RLE can make data bigger if there are no repeats (abcd becomes a1b1c1d1).", "code": {"f": "Main.java", "c": "public class Main {\n    static String encode(String s) {\n        StringBuilder sb = new StringBuilder();\n        for (int i = 0; i < s.length(); ) {\n            int j = i;\n            while (j < s.length() && s.charAt(j) == s.charAt(i)) j++;\n            sb.append(s.charAt(i)).append(j - i);\n            i = j;\n        }\n        return sb.toString();\n    }\n    static String decode(String e) {\n        StringBuilder sb = new StringBuilder();\n        for (int i = 0; i < e.length(); i += 2)\n            sb.append(String.valueOf(e.charAt(i)).repeat(e.charAt(i + 1) - '0'));\n        return sb.toString();\n    }\n    public static void main(String[] args) {\n        String raw = \"aaaabbbccd\";\n        String small = encode(raw);\n        System.out.println(\"raw   : \" + raw + \" (\" + raw.length() + \" chars)\");\n        System.out.println(\"packed: \" + small + \" (\" + small.length() + \" chars)\");\n        System.out.println(\"decoded back: \" + decode(small));\n        System.out.println(\"raw.charAt(5) is O(1) = \" + raw.charAt(5) + \"; packed needs decoding/scanning first\");\n    }\n}", "out": "raw   : aaaabbbccd (10 chars)\npacked: a4b3c2d1 (8 chars)\ndecoded back: aaaabbbccd\nraw.charAt(5) is O(1) = b; packed needs decoding/scanning first", "cpp": {"f": "main.cpp", "c": "#include <iostream>\n#include <string>\nusing namespace std;\n\nstring encode(const string& s) {\n    string sb;\n    for (size_t i = 0; i < s.size(); ) {\n        size_t j = i;\n        while (j < s.size() && s[j] == s[i]) j++;\n        sb += s[i];\n        sb += to_string(j - i);\n        i = j;\n    }\n    return sb;\n}\nstring decode(const string& e) {\n    string sb;\n    for (size_t i = 0; i < e.size(); i += 2)\n        sb += string(e[i + 1] - '0', e[i]);\n    return sb;\n}\nint main() {\n    string raw = \"aaaabbbccd\";\n    string small = encode(raw);\n    cout << \"raw   : \" << raw << \" (\" << raw.size() << \" chars)\\n\";\n    cout << \"packed: \" << small << \" (\" << small.size() << \" chars)\\n\";\n    cout << \"decoded back: \" << decode(small) << \"\\n\";\n    cout << \"raw.charAt(5) is O(1) = \" << raw[5] << \"; packed needs decoding/scanning first\\n\";\n    return 0;\n}\n"}, "clang": {"f": "main.c", "c": "#include <stdio.h>\n#include <string.h>\n\nvoid encode(const char *s, char *out) {\n    int n = strlen(s), k = 0;\n    for (int i = 0; i < n; ) {\n        int j = i;\n        while (j < n && s[j] == s[i]) j++;\n        out[k++] = s[i];\n        k += sprintf(out + k, \"%d\", j - i);\n        i = j;\n    }\n    out[k] = '\\0';\n}\nvoid decode(const char *e, char *out) {\n    int k = 0, n = strlen(e);\n    for (int i = 0; i < n; i += 2)\n        for (int r = 0; r < e[i + 1] - '0'; r++) out[k++] = e[i];\n    out[k] = '\\0';\n}\nint main() {\n    const char *raw = \"aaaabbbccd\";\n    char small[64], back[64];\n    encode(raw, small);\n    decode(small, back);\n    printf(\"raw   : %s (%zu chars)\\n\", raw, strlen(raw));\n    printf(\"packed: %s (%zu chars)\\n\", small, strlen(small));\n    printf(\"decoded back: %s\\n\", back);\n    printf(\"raw.charAt(5) is O(1) = %c; packed needs decoding/scanning first\\n\", raw[5]);\n    return 0;\n}\n"}}}, {"h": "Example 4: Storing vs recomputing", "p": ["Sometimes the choice is whether to keep an extra copy of derived data or compute it again when needed.", "A prefix-sum array stores running totals. A range sum is then pre[r+1] - pre[l] in O(1). Without it, every qu
