ery loops over the range in O(n). Extra memory O(n) buys fast repeated queries."], "code": {"f": "Main.java", "c": "public class Main {\n    static int ops;\n    static int rangeSum(int[] a, int l, int r) {      // no extra memory\n        int s = 0;\n        for (int i = l; i <= r; i++) { ops++; s += a[i]; }\n        return s;\n    }\n    public static void main(String[] args) {\n        int n = 100;\n        int[] a = new int[n];\n        for (int i = 0; i < n; i++) a[i] = i + 1;\n        int[] pre = new int[n + 1];                    // extra memory O(n)\n        for (int i = 0; i < n; i++) pre[i + 1] = pre[i] + a[i];\n        int q = 10;                                    // 10 queries of sum a[0..99]\n        ops = 0; int x = 0;\n        for (int k = 0; k < q; k++) x = rangeSum(a, 0, n - 1);\n        System.out.println(\"recompute: sum=\" + x + \", steps for 10 queries=\" + ops);\n        int y = 0;\n        for (int k = 0; k < q; k++) y = pre[n] - pre[0];\n        System.out.println(\"prefix   : sum=\" + y + \", steps for 10 queries=\" + q + \" (+\" + n + \" once to build)\");\n    }\n}", "out": "recompute: sum=5050, steps for 10 queries=1000\nprefix   : sum=5050, steps for 10 queries=10 (+100 once to build)", "cpp": {"f": "main.cpp", "c": "#include <iostream>\n#include <vector>\nusing namespace std;\n\nint ops;\nint rangeSum(const vector<int>& a, int l, int r) {      // no extra memory\n    int s = 0;\n    for (int i = l; i <= r; i++) { ops++; s += a[i]; }\n    return s;\n}\nint main() {\n    int n = 100;\n    vector<int> a(n);\n    for (int i = 0; i < n; i++) a[i] = i + 1;\n    vector<int> pre(n + 1);                        // extra memory O(n)\n    for (int i = 0; i < n; i++) pre[i + 1] = pre[i] + a[i];\n    int q = 10;                                    // 10 queries of sum a[0..99]\n    ops = 0; int x = 0;\n    for (int k = 0; k < q; k++) x = rangeSum(a, 0, n - 1);\n    cout << \"recompute: sum=\" << x << \", steps for 10 queries=\" << ops << \"\\n\";\n    int y = 0;\n    for (int k = 0; k < q; k++) y = pre[n] - pre[0];\n    cout << \"prefix   : sum=\" << y << \", steps for 10 queries=\" << q << \" (+\" << n << \" once to build)\\n\";\n    return 0;\n}\n"}, "clang": {"f": "main.c", "c": "#include <stdio.h>\n\nint ops;\nint rangeSum(int a[], int l, int r) {      /* no extra memory */\n    int s = 0;\n    for (int i = l; i <= r; i++) { ops++; s += a[i]; }\n    return s;\n}\nint main() {\n    int n = 100, a[100], pre[101];\n    for (int i = 0; i < n; i++) a[i] = i + 1;\n    pre[0] = 0;                                    /* extra memory O(n) */\n    for (int i = 0; i < n; i++) pre[i + 1] = pre[i] + a[i];\n    int q = 10;                                    /* 10 queries of sum a[0..99] */\n    ops = 0; int x = 0;\n    for (int k = 0; k < q; k++) x = rangeSum(a, 0, n - 1);\n    printf(\"recompute: sum=%d, steps for 10 queries=%d\\n\", x, ops);\n    int y = 0;\n    for (int k = 0; k < q; k++) y = pre[n] - pre[0];\n    printf(\"prefix   : sum=%d, steps for 10 queries=%d (+%d once to build)\\n\", y, q, n);\n    return 0;\n}\n"}}, "viz": {"type": "cells", "items": ["0", "1", "3", "6", "10"], "labels": ["p0", "p1", "p2", "p3", "p4"], "hl": [], "caption": "Prefix sums of [1, 2, 3, 4]"}}, {"h": "Choosing the right side", "p": ["Use extra space to gain speed when the same result is needed many times, memory is plentiful, or response time is critical. Use extra time to save space when memory is tight, data is used rarely, or it is cheap to recompute.", "Real examples: caches and indexes (space for time), file compression and streaming (time for space), hash tables (space for fast lookup), embedded devices (space is precious)."], "table": {"head": ["Situation", "Prefer", "Technique"], "rows": [["Repeated queries", "Save time", "Table, memo, cache"], ["Low memory device", "Save space", "Recompute, compress"], ["Big data transfer", "Save space", "Compression"], ["Real-time response", "Save time", "Precompute"]]}}], "analogy": "Cooking for guests: you can keep chopped onions ready in boxes (uses fridge space, saves time) or chop them fresh each time (no boxes, but more time).", "hinglish": "Bhai simple baat hai: time aur space dono ek saath kam karna mushkil hai. Agar zyada memory use karo (table, memo) to kaam fast ho jata hai. Agar memory kam chahiye (compression, recompute) to time zyada lagta hai. Situation dekh ke decide karo.", "mistakes": ["Believing memoization is free; it costs O(n) extra memory.", "Forgetting that building the table takes time too (one-time cost).", "Assuming compression always reduces size.", "Counting only time and ignoring the recursion stack space."], "remember": ["Time-space trade-off: reduce one resource by using more of the other.", "More memory -> less time: lookup table, memoization, caching, hashing, prefix sums.", "Less memory -> more time: recomputation, compression, in-place algorithms.", "Lookup table: precompute once, read in O(1).", "Memoization: store sub-problem results; fib(n) from O(2^n) to O(n).", "fib(20): 21891 calls plain vs 39 calls with memo.", "Compression saves storage but needs time to compress/decompress.", "Run-length encoding: aaaabbbccd -> a4b3c2d1.", "Prefix sums: O(n) extra space, O(1) range query.", "Choose based on which resource is scarcer.", "Some algorithms improve both time and space; trade-off is not universal."], "uses": ["Caching in browsers and databases", "Hash tables and indexes for fast lookup", "Dynamic programming (memoization / tabulation)", "Image, audio and file compression (ZIP, JPEG)", "Precomputed tables in graphics and cryptography"], "pros": ["Lets us tune a program to the available resources", "Huge speed-ups possible (exponential to linear)", "Compression saves storage and bandwidth"], "cons": ["More memory use or more computation time, never free", "Extra complexity in code (cache invalidation, encoding)", "Stale or wrong stored data can cause bugs"], "def": "A time-space trade-off means that one resource can be reduced by spending more of the other. An algorithm that uses more memory can often finish faster, and an algorithm that uses less memory often needs more time."}, "u2-t1": {"tldr": "A stack is a LIFO list where push and pop happen only at the top.", "sections": [{"h": "What is a Stack?", "p": ["Think of a pile of plates. You put a new plate on top and you also take a plate from the top. You never pull a plate from the middle or bottom."], "pts": ["Linear: elements are arranged one after another.", "Only the top element is accessible.", "Insert operation is called push, delete operation is called pop.", "Also called a LIFO list or a push-down list."], "viz": {"type": "cells", "items": ["10", "20", "30", "40"], "labels": ["0 (bottom)", "1", "2", "3 (top)"], "hl": [3], "caption": "Stack of 4 elements: push and pop both happen at the top (index 3)"}}, {"h": "Stack as an ADT", "p": ["An Abstract Data Type (ADT) defines WHAT a structure does (its values and operations) and not HOW it is coded. The Stack ADT can be built with an array or with a linked list, but the operations stay the same.", "Below are the standard operations of the Stack ADT."], "table": {"head": ["Operation", "What it does", "Returns"], "rows": [["push(x)", "Insert x on the top", "nothing (error if full)"], ["pop()", "Remove and return the top element", "the element (error if empty)"], ["peek() / top()", "Read the top element without removing it", "the element"], ["isEmpty()", "Check whether the stack has no element", "true / false"], ["isFull()", "Check whether no space is left (array stack)", "true / false"], ["size()", "Count of elements present", "int"]]}}, {"h": "Array representation and the push operation", "p": ["We keep an array `a[0..MAX-1]` and an integer `top`. Initially `top = -1`, which means the stack is empty. The bottom element is always at index 0.", "Push first checks for OVERFLOW. Overflow is the error that occurs when we try to push into a stack that is already full (`top == MAX-1`)."], "pts": ["Step 1: if top == MAX - 1, print 'Stack Overflow' and stop.", "Step 2: top = top + 1", "Step 3: a[top] = x", "Step 4: stop"], "tip": "Always check overflow BEFORE incrementing top. Otherwise you write outside the array.", "table": {"head": ["Step", "What happens"], "rows": [["1. Check overflow", "top == MAX-1 ? stop"], ["2. Increment top", "top = top + 1"], ["3. Store value", "a[top] = x"]]}}, {"h": "Pop, peek, isEmpty and isFull", "p": ["Pop removes the top element. It first checks for UNDERFLOW, which is the error when we try to pop from an empty stack (`top == -1`). We do not erase the value from the array; we only move `top` down by one, so that slot can be overwritten later.", "Peek only reads `a[top]`. isEmpty and isFull are simple comparisons on `top`."], "pts": ["POP: if top == -1 -> 'Stack Underflow', stop. Else x = a[top]; top = top - 1; return x.", "PEEK: if top == -1 -> 'Stack is empty'. Else return a[top].", "isEmpty: return top == -1", "isFull: return top == MAX - 1", "size: return top + 1"], "warn": "Underflow and overflow are different. Underflow = pop/peek on empty stack. Overflow = push on full stack.", "viz": {"type": "chain", "items": ["top == -1 ?", "x = a[top]", "top = top - 1", "return x"], "labels": ["no (yes = underflow)", "", ""], "caption": "Algorithm POP"}}, {"h": "Complete Java implementation", "p": ["This program uses a plain array of size 3. It shows a normal push/pop sequence and also triggers both overflow and underflow."], "tip": "Pop returns -1 here only to keep the code short. In real code throw an exception (for example `IllegalStateException`) instead.", "code": {"f": "Main.java", "c": "public class Main {\n    static int[] a = new int[3];\n    static int top = -1;\n\n    static boolean isEmpty() { return top == -1; }\n    static boolean isFull()  { return top == a.length - 1; }\n\n    static void push(int x) {\n        if (isFull()) { System.out.println(\"Overflow: cannot push \" + x); return; }\n        a[++top] = x;\n        System.out.println(\"Pushed \" + x);\n    }\n    static int pop() {\n        if (isEmpty()) { System.out.println(\"Underflow: stack is empty\"); return -1; }\n        return a[top--];\n    }\n    static int peek() {\n        if (isEmpty()) { System.out.println(\"Stack is empty\"); return -1; }\n        return a[top];\n    }\n    public static void main(String[] args) {\n        push(10); push(20); push(30);\n        push(40);\n        System.out.println(\"Top = \" + peek());\n        System.out.println(\"Popped \" + pop());\n        System.out.println(\"Popped \" + pop());\n        System.out.println(\"Popped \" + pop());\n        pop();\n        System.out.println(\"isEmpty = \" + isEmpty());\n    }\n}", "out": "Pushed 10\nPushed 20\nPushed 30\nOverflow: cannot push 40\nTop = 30\nPopped 30\nPopped 20\nPopped 10\nUnderflow: stack is empty\nisEmpty = true", "cpp": {"f": "main.cpp", "c": "#include <iostream>\nusing namespace std;\n\nint a[3];\nint top = -1;\nconst int N = 3;\n\nbool isEmpty() { return top == -1; }\nbool isFull()  { return top == N - 1; }\n\nvoid push(int x) {\n    if (isFull()) { cout << \"Overflow: cannot push \" << x << \"\\n\"; return; }\n    a[++top] = x;\n    cout << \"Pushed \" << x << \"\\n\";\n}\nint pop() {\n    if (isEmpty()) { cout << \"Underflow: stack is empty\\n\"; return -1; }\n    return a[top--];\n}\nint peek() {\n    if (isEmpty()) { cout << \"Stack is empty\\n\"; return -1; }\n    return a[top];\n}\nint main() {\n    push(10); push(20); push(30);\n    push(40);\n    cout << \"Top = \" << peek() << \"\\n\";\n    cout << \"Popped \" << pop() << \"\\n\";\n    cout << \"Popped \" << pop() << \"\\n\";\n    cout << \"Popped \" << pop() << \"\\n\";\n    pop();\n    cout << \"isEmpty = \" << (isEmpty() ? \"true\" : \"false\") << \"\\n\";\n    return 0;\n}\n"}, "clang": {"f": "main.c", "c": "#include <stdio.h>\n#define N 3\n\nint a[N];\nint top = -1;\n\nint isEmpty() { return top == -1; }\nint isFull()  { return top == N - 1; }\n\nvoid push(int x) {\n    if (isFull()) { printf(\"Overflow: cannot push %d\\n\", x); return; }\n    a[++top] = x;\n    printf(\"Pushed %d\\n\", x);\n}\nint pop() {\n    if (isEmpty()) { printf(\"Underflow: stack is empty\\n\"); return -1; }\n    return a[top--];\n}\nint peek() {\n    if (isEmpty()) { printf(\"Stack is empty\\n\"); return -1; }\n    return a[top];\n}\nint main() {\n    push(10); push(20); push(30);\n    push(40);\n    printf(\"Top = %d\\n\", peek());\n    printf(\"Popped %d\\n\", pop());\n    printf(\"Popped %d\\n\", pop());\n    printf(\"Popped %d\\n\", pop());\n    pop();\n    printf(\"isEmpty = %s\\n\", isEmpty() ? \"true\" : \"false\");\n    return 0;\n}\n"}}}, {"h": "Dry run (trace)", "p": ["Stack with MAX = 4, starting empty (`top = -1`). Follow each operation and see how `top` changes. The stack is written bottom to top."], "table": {"head": ["Operation", "Stack (bottom to top)", "top", "Result"], "rows": [["start", "[ ]", "-1", "empty"], ["push(10)", "[10]", "0", "ok"], ["push(20)", "[10, 20]", "1", "ok"], ["push(30)", "[10, 20, 30]", "2", "ok"], ["pop()", "[10, 20]", "1", "returns 30"], ["push(40)", "[10, 20, 40]", "2", "ok"], ["peek()", "[10, 20, 40]", "2", "returns 40"], ["pop()", "[10, 20]", "1", "returns 40"], ["pop()", "[10]", "0", "returns 20"], ["pop()", "[ ]", "-1", "returns 10"], ["pop()", "[ ]", "-1", "Underflow"]]}}, {"h": "Complexity of stack operations", "p": ["Every operation touches only the top, so no loop or shifting is needed. All are constant time. The array uses O(n) space for n slots."], "pts": ["Limitation: array size is fixed, so overflow is possible.", "A linked-list stack removes this limit (push/pop at head, still O(1))."], "table": {"head": ["Operation", "Time", "Space (extra)"], "rows": [["push", "O(1)", "O(1)"], ["pop", "O(1)", "O(1)"], ["peek", "O(1)", "O(1)"], ["isEmpty / isFull", "O(1)", "O(1)"], ["Whole stack of n items", "-", "O(n)"]]}}], "analogy": "A stack is like a pile of plates in a canteen. You add or take a plate only from the top, so the last plate placed is the first one used.", "hinglish": "Bhai stack ek aisa list hai jisme sab kuch sirf top se hota hai. Jo last mein aaya wo pehle bahar jaata hai (LIFO). Push se daalo, pop se nikalo, aur full pe push karo to overflow, empty pe pop karo to underflow.", "mistakes": ["Incrementing top before checking overflow.", "Confusing overflow with underflow.", "Starting top at 0 and then treating 0 as 'empty' (it means one element when top starts at -1).", "Thinking pop erases the array slot; it only moves top."], "remember": ["Stack = linear ADT, insert/delete at one end (top), follows LIFO.", "push(x): insert at top. pop(): remove and return top. peek(): read top.", "Array stack: int a[MAX], top = -1 initially.", "Empty condition: top == -1. Full condition: top == MAX-1.", "PUSH: if top==MAX-1 overflow; top++; a[top]=x.", "POP: if top==-1 underflow; x=a[top]; top--; return x.", "Overflow = push on full stack. Underflow = pop on empty stack.", "size = top + 1.", "All stack operations are O(1) time.", "Array stack has fixed size; linked-list stack is dynamic.", "ADT hides implementation: array or linked list both are valid."], "uses": ["Function call management (call stack)", "Undo/redo in editors", "Expression evaluation and conversion", "Browser back button history"], "pros": ["Very simple, all operations O(1)", "Easy to implement with array or list", "Natural fit for reverse-order problems"], "cons": ["Only the top is accessible (no random access)", "Array version has fixed size and can overflow", "Searching needs popping elements"], "def": "A stack is a linear data structure in which insertion and deletion happen at only ONE end, called the top. The element inserted last is removed first. This rule is called LIFO (Last In, First Out)."}, "u2-t2": {"tldr": "Stacks convert infix to postfix/prefix, match brackets and power recursion.", "sections": [{"h": "Applications of a stack", "p": [], "pts": ["Expression conversion: infix to postfix / prefix.", "Expression evaluation: postfix and prefix evaluation.", "Balanced symbol checking: (), {}, [] in compilers and editors.", "Function calls and recursion: the call stack stores return address and local variables.", "Undo / redo in editors; back button in browsers.", "Reversing a string or a list; DFS (depth first search) of a graph; backtracking (maze, N-Queens)."], "tip": "In exams, 'applications of stack' is usually answered with: expression evaluation, conversion, parenthesis matching, recursion, reversing."}, {"h": "Infix, prefix and postfix notation", "p": ["The usual way of writing `A + B` is infix: the operator sits BETWEEN the operands. Infix needs precedence rules and brackets, which is hard for a computer.", "Prefix (Polish) puts the operator BEFORE the operands: `+ A B`. Postfix (Reverse Polish) puts it AFTER: `A B +`. Both need no brackets and no precedence rules once written, so the machine can evaluate them in one left-to-right scan using a stack."], "pts": ["Precedence (high to low): ^ then * / % then + -.", "Associativity: + - * / go left to right. ^ goes right to left.", "Brackets ( ) override everything."], "table": {"head": ["Infix", "Prefix", "Postfix"], "rows": [["A + B", "+ A B", "A B +"], ["A + B * C", "+ A * B C", "A B C * +"], ["(A + B) * C", "* + A B C", "A B + C *"], ["A * B + C * D", "+ * A B * C D", "A B * C D * +"]]}}, {"h": "Infix to postfix: the algorithm", "p": ["We scan the infix expression from left to right and use a stack only for operators and left brackets. Operands go straight to the output."], "pts": ["For ^ (right associative) pop only while top has strictly higher precedence.", "The bracket ( is never popped by an operator; it has the lowest priority while on the stack.", "Time O(n), extra space O(n) for the stack."], "table": {"head": ["Step", "What happens"], "rows": [["1. Operand", "Append it to the output"], ["2. Left bracket (", "Push it on the stack"], ["3. Right bracket )", "Pop to output until ( is found; discard both brackets"], ["4. Operator", "While top has precedence >= current (left assoc), pop to output; then push current"], ["5. End of input", "Pop everything left on the stack to output"]]}}, {"h": "Traced example: A+B*C-(D/E)", "p": ["Convert `A + B * C - ( D / E )`. Watch how `*` waits above `+`, how `-` forces both to pop, and how the bracket group is flushed at `)`."], "tip": "Quick check: postfix of A+B*C-(D/E) is ABC*+DE/-. Evaluate mentally with A=6,B=2,C=3,D=8,E=4: 6+6-2 = 10.", "table": {"head": ["Symbol", "Action", "Stack (bottom to top)", "Output"], "rows": [["A", "operand, output", "empty", "A"], ["+", "push", "+", "A"], ["B", "operand, output", "+", "A B"], ["*", "* higher than +, push", "+ *", "A B"], ["C", "operand, output", "+ *", "A B C"], ["-", "pop * and +, push -", "-", "A B C * +"], ["(", "push", "- (", "A B C * +"], ["D", "operand, output", "- (", "A B C * + D"], ["/", "top is (, push", "- ( /", "A B C * + D"], ["E", "operand, output", "- ( /", "A B C * + D E"], [")", "pop / until (, discard (", "-", "A B C * + D E /"], ["end", "pop -", "empty", "A B C * + D E / -"]]}}, {"h": "Infix to prefix: the idea", "p": ["The easy way is to reuse the postfix algorithm. Prefix is almost a mirror image of postfix."], "pts": ["Example: A+B*C-(D/E) reversed with swapped brackets is (E/D)-C*B+A; its modified postfix is ED/CB*A+-; reversed gives -+A*BC/DE."], "table": {"head": ["Step", "What happens"], "rows": [["1. Reverse the infix string", "A+B*C becomes C*B+A"], ["2. Swap brackets", "( becomes ) and ) becomes ("], ["3. Convert to postfix", "but pop only when top precedence is STRICTLY higher (for ^ pop >= )"], ["4. Reverse the result", "this is the prefix expression"]]}}, {"h": "Java code: infix to postfix and prefix", "p": ["Operands are single letters or digits. The stack is a plain char array. The prefix method follows the reverse, swap, convert, reverse idea."], "code": {"f": "Main.java", "c": "public class Main {\n    static int prec(char c) {\n        if (c == '^') return 3;\n        if (c == '*' || c == '/') return 2;\n        if (c == '+' || c == '-') return 1;\n        return 0;\n    }\n    // strict = true is used for the prefix trick\n    static String toPostfix(String s, boolean strict) {\n        char[] st = new char[s.length()];\n        int top = -1;\n        StringBuilder out = new StringBuilder();\n        for (char c : s.toCharArray()) {\n            if (Character.isLetterOrDigit(c)) out.append(c);\n            else if (c == '(') st[++top] = c;\n            else if (c == ')') {\n                while (top >= 0 && st[top] != '(') out.append(st[top--]);\n                top--;                                   // discard '('\n            } else {\n                while (top >= 0 && st[top] != '(' &&\n                       (prec(st[top]) > prec(c) ||\n                        (!strict && c != '^' && prec(st[top]) == prec(c))))\n                    out.append(st[top--]);\n                st[++top] = c;\n            }\n        }\n        while (top >= 0) out.append(st[top--]);\n        return out.toString();\n    }\n    static String toPrefix(String s) {\n        StringBuilder r = new StringBuilder(s).reverse();\n        for (int i = 0; i < r.length(); i++) {\n            if (r.charAt(i) == '(') r.setCharAt(i, ')');\n            else if (r.charAt(i) == ')') r.setCharAt(i, '(');\n        }\n        return new StringBuilder(toPostfix(r.toString(), true)).reverse().toString();\n    }\n    public static void main(String[] args) {\n        String e = \"A+B*C-(D/E)\";\n        System.out.println(\"Infix   : \" + e);\n        System.out.println(\"Postfix : \" + toPostfix(e, false));\n        System.out.println(\"Prefix  : \" + toPrefix(e));\n        System.out.println(\"Postfix : \" + toPostfix(\"(A+B)*C\", false));\n        System.out.println(\"Prefix  : \" + toPrefix(\"(A+B)*C\"));\n    }\n}", "out": "Infix   : A+B*C-(D/E)\nPostfix : ABC*+DE/-\nPrefix  : -+A*BC/DE\nPostfix : AB+C*\nPrefix  : *+ABC", "cpp": {"f": "main.cpp", "c": "#include <iostream>\n#include <string>\n#include <algorithm>\n#include <cctype>\nusing namespace std;\n\nint prec(char c) {\n    if (c == '^') return 3;\n    if (c == '*' || c == '/') return 2;\n    if (c == '+' || c == '-') return 1;\n    return 0;\n}\n// strict = true is used for the prefix trick\nstring toPostfix(const string& s, bool strict) {\n    string st(s.size(), ' ');\n    int top = -1;\n    string out;\n    for (char c : s) {\n        if (isalnum((unsigned char)c)) out += c;\n        else if (c == '(') st[++top] = c;\n        else if (c == ')') {\n            while (top >= 0 && st[top] != '(') out += st[top--];\n            top--;                                   // discard '('\n        } else {\n            while (top >= 0 && st[top] != '(' &&\n                   (prec(st[top]) > prec(c) ||\n                    (!strict && c != '^' && prec(st[top]) == prec(c))))\n                out += st[top--];\n            st[++top] = c;\n        }\n    }\n    while (top >= 0) out += st[top--];\n    return out;\n}\nstring toPrefix(const string& s) {\n    string r(s.rbegin(), s.rend());\n    for (size_t i = 0; i < r.size(); i++) {\n        if (r[i] == '(') r[i] = ')';\n        else if (r[i] == ')') r[i] = '(';\n    }\n    string p = toPostfix(r, true);\n    reverse(p.begin(), p.end());\n    return p;\n}\nint main() {\n    string e = \"A+B*C-(D/E)\";\n    cout << \"Infix   : \" << e << \"\\n\";\n    cout << \"Postfix : \" << toPostfix(e, false) << \"\\n\";\n    cout << \"Prefix  : \" << toPrefix(e) << \"\\n\";\n    cout << \"Postfix : \" << toPostfix(\"(A+B)*C\", false) << \"\\n\";\n    cout << \"Prefix  : \" << toPrefix(\"(A+B)*C\") << \"\\n\";\n    return 0;\n}\n"}, "clang": {"f": "main.c", "c": "#include <stdio.h>\n#include <string.h>\n#include <ctype.h>\n\nint prec(char c) {\n    if (c == '^') return 3;\n    if (c == '*' || c == '/') return 2;\n    if (c == '+' || c == '-') return 1;\n    return 0;\n}\n/* strict = 1 is used for the prefix trick */\nvoid toPostfix(const char *s, int strict, char *out) {\n    char st[100]; int top = -1, k = 0;\n    for (int i = 0; s[i]; i++) {\n        char c = s[i];\n        if (isalnum((unsigned char)c)) out[k++] = c;\n        else if (c == '(') st[++top] = c;\n        else if (c == ')') {\n            while (top >= 0 && st[top] != '(') out[k++] = st[top--];\n            top--;                                   /* discard '(' */\n        } else {\n            while (top >= 0 && st[top] != '(' &&\n                   (prec(st[top]) > prec(c) ||\n                    (!strict && c != '^' && prec(st[top]) == prec(c))))\n                out[k++] = st[top--];\n            st[++top] = c;\n        }\n    }\n    while (top >= 0) out[k++] = st[top--];\n    out[k] = '\\0';\n}\nvoid toPrefix(const char *s, char *out) {\n    int n = strlen(s); char r[100], p[100];\n    for (int i = 0; i < n; i++) {\n        char c = s[n - 1 - i];\n        r[i] = (c == '(') ? ')' : (c == ')') ? '(' : c;\n    }\n    r[n] = '\\0';\n    toPostfix(r, 1, p);\n    int m = strlen(p);\n    for (int i = 0; i < m; i++) out[i] = p[m - 1 - i];\n    out[m] = '\\0';\n}\nint main() {\n    char o[100];\n    const char *e = \"A+B*C-(D/E)\";\n    printf(\"Infix   : %s\\n\", e);\n    toPostfix(e, 0, o); printf(\"Postfix : %s\\n\", o);\n    toPrefix(e, o);     printf(\"Prefix  : %s\\n\", o);\n    toPostfix(\"(A+B)*C\", 0, o); printf(\"Postfix : %s\\n\", o);\n    toPrefix(\"(A+B)*C\", o);     printf(\"Prefix  : %s\\n\", o);\n    return 0;\n}\n"}}}, {"h": "Balanced parentheses checking", "p": ["Problem: check whether every opening bracket has a matching closing bracket in the correct order. A stack solves it because the most recent opening bracket must be closed first."], "pts": ["Scan left to right. On ( [ { push it.", "On ) ] } : if stack is empty -> not balanced. Else pop and check it is the matching opener; if not -> not balanced.", "At the end the stack must be empty. If not, some opener was never closed.", "Time O(n), space O(n)."], "warn": "Counting brackets is not enough. `{[(])}` has equal counts but is NOT balanced because the order is wrong.", "code": {"f": "Main.java", "c": "public class Main {\n    static boolean balanced(String s) {\n        char[] st = new char[s.length()];\n        int top = -1;\n        for (char c : s.toCharArray()) {\n            if (c == '(' || c == '[' || c == '{') st[++top] = c;\n            else if (c == ')' || c == ']' || c == '}') {\n                if (top == -1) return false;              // nothing to match\n                char o = st[top--];\n                if ((c == ')' && o != '(') || (c == ']' && o != '[')\n                        || (c == '}' && o != '{')) return false;\n            }\n        }\n        return top == -1;                                  // all opened were closed\n    }\n    public static void main(String[] args) {\n        String[] t = {\"{[()]}\", \"{[(])}\", \"((\", \"a+(b*c)-[d]\", \")(\"};\n        for (String s : t) System.out.println(s + \" -> \" + balanced(s));\n    }\n}", "out": "{[()]} -> true\n{[(])} -> false\n(( -> false\na+(b*c)-[d] -> true\n)( -> false", "cpp": {"f": "main.cpp", "c": "#include <iostream>\n#include <string>\nusing namespace std;\n\nbool balanced(const string& s) {\n    string st(s.size(), ' ');\n    int top = -1;\n    for (char c : s) {\n        if (c == '(' || c == '[' || c == '{') st[++top] = c;\n        else if (c == ')' || c == ']' || c == '}') {\n            if (top == -1) return false;              // nothing to match\n            char o = st[top--];\n            if ((c == ')' && o != '(') || (c == ']' && o != '[')\n                    || (c == '}' && o != '{')) return false;\n        }\n    }\n    return top == -1;                                  // all opened were closed\n}\nint main() {\n    string t[] = {\"{[()]}\", \"{[(])}\", \"((\", \"a+(b*c)-[d]\", \")(\"};\n    for (const string& s : t) cout << s << \" -> \" << (balanced(s) ? \"true\" : \"false\") << \"\\n\";\n    return 0;\n}\n"}, "clang": {"f": "main.c", "c": "#include <stdio.h>\n#include <string.h>\n\nint balanced(const char *s) {\n    char st[100]; int top = -1;\n    for (int i = 0; s[i]; i++) {\n        char c = s[i];\n        if (c == '(' || c == '[' || c == '{') st[++top] = c;\n        else if (c == ')' || c == ']' || c == '}') {\n            if (top == -1) return 0;              /* nothing to match */\n            char o = st[top--];\n            if ((c == ')' && o != '(') || (c == ']' && o != '[')\n                    || (c == '}' && o != '{')) return 0;\n        }\n    }\n    return top == -1;                              /* all opened were closed */\n}\nint main() {\n    const char *t[] = {\"{[()]}\", \"{[(])}\", \"((\", \"a+(b*c)-[d]\", \")(\"};\n    for (int i = 0; i < 5; i++) printf(\"%s -> %s\\n\", t[i], balanced(t[i]) ? \"true\" : \"false\");\n    return 0;\n}\n"}}}], "analogy": "Think of a cook following a recipe: operands are ingredients placed on the counter, and the stack is the small tray where operators wait until the right moment to be used.", "hinglish": "Bhai computer ko A+B*C jaisa infix samajhna mushkil hai kyunki precedence aur brackets dekhne padte hain. Isliye hum postfix bana lete hain stack ki help se: operand seedha output mein, operator stack mein, aur jab upar wala operator zyada ya barabar priority ka ho to pop karo. Brackets check karna bhi stack se hota hai.", "mistakes": ["Popping on equal precedence for ^ (it is right associative).", "Forgetting to discard the left bracket after ) is processed.", "Forgetting to pop remaining operators at the end.", "Only counting brackets instead of checking order."], "remember": ["Applications: expression conversion/evaluation, parenthesis matching, recursion (call stack), undo/redo, DFS, reversing.", "Infix: operand op operand. Prefix: op operand operand. Postfix: operand operand op.", "Precedence: ^ > * / % > + - ; ^ is right associative, others left.", "Postfix and prefix need no brackets and no precedence rules.", "Infix to postfix: operand -> output; ( -> push; ) -> pop till (; operator -> pop while top >= current, then push.", "At the end, pop all remaining operators to output.", "A+B*C-(D/E) in postfix = ABC*+DE/-.", "Infix to prefix: reverse, swap brackets, postfix (pop only when strictly higher), reverse.", "A+B*C-(D/E) in prefix = -+A*BC/DE.", "Balanced parentheses: push openers; on closer pop and match; stack empty at end means balanced.", "Conversion is O(n) time, O(n) space."], "uses": ["Compilers evaluating arithmetic expressions", "Syntax checking of brackets in code editors", "Calculators (Reverse Polish Notation)", "Recursion and function call handling"], "pros": ["Removes need for brackets and precedence while evaluating", "Single left-to-right scan, O(n)", "Simple and easy to code with a stack"], "cons": ["Postfix/prefix are hard for humans to read", "Needs extra stack space O(n)", "Single-letter version cannot handle multi-digit operands without tokenizing"], "def": "A stack is useful wherever the most recent item must be handled first, or wherever we must reverse order or match pairs."}, "u2-t3": {"tldr": "Evaluate a postfix expression in one scan: push operands, apply operators on the top two.", "sections": [{"h": "What is postfix evaluation?", "p": ["Why does it work? In postfix, an operator always comes right after its two operands. So the moment we see an operator, its two operands are the top two values on the stack."], "viz": {"type": "chain", "items": ["Read symbol", "Operand? push", "Operator? pop 2, apply", "Push result", "Answer = top"], "caption": "Postfix evaluation in one picture"}}, {"h": "The algorithm", "p": ["Assume the postfix expression is valid and operands are single digits (so each character is one token)."], "pts": ["Time: O(n) because each symbol is handled once and push/pop are O(1).", "Space: O(n) for the stack in the worst case."], "table": {"head": ["Step", "What happens"], "rows": [["1. Create an empty stack", "top = -1"], ["2. Scan symbol by symbol (left to right)", "repeat until the expression ends"], ["3. If symbol is an operand", "push its value on the stack"], ["4. If symbol is an operator", "b = pop(); a = pop(); r = a OP b; push(r)"], ["5. At the end", "pop the only remaining value = result"]]}}, {"h": "Operand order for - and /", "p": ["For + and * the order does not matter, but for - and / it does. The FIRST value popped is the RIGHT operand and the SECOND value popped is the LEFT operand."], "warn": "Computing b OP a is the most common mistake. 5 3 - must give 2, not -2.", "table": {"head": ["Postfix", "Pop 1 (b)", "Pop 2 (a)", "Result a OP b"], "rows": [["5 3 -", "3", "5", "5 - 3 = 2"], ["8 4 /", "4", "8", "8 / 4 = 2"], ["2 3 ^", "3", "2", "2 ^ 3 = 8"]]}}, {"h": "Traced example", "p": ["Evaluate `6 2 3 * + 8 4 / -` (this is the postfix of 6+2*3-(8/4)). Stack is shown bottom to top."], "table": {"head": ["Symbol", "Action", "Stack"], "rows": [["6", "push 6", "6"], ["2", "push 2", "6 2"], ["3", "push 3", "6 2 3"], ["*", "pop 3 and 2, 2*3 = 6, push", "6 6"], ["+", "pop 6 and 6, 6+6 = 12, push", "12"], ["8", "push 8", "12 8"], ["4", "push 4", "12 8 4"], ["/", "pop 4 and 8, 8/4 = 2, push", "12 2"], ["-", "pop 2 and 12, 12-2 = 10, push", "10"], ["end", "pop result", "10 is the answer"]]}}, {"h": "Java code for postfix evaluation", "p": ["A plain `int` array is the stack. `c - '0'` converts a digit character to its number."], "tip": "For multi-digit numbers, separate tokens with spaces and split the string. The logic of push/pop stays the same.", "code": {"f": "Main.java", "c": "public class Main {\n    static int evalPostfix(String exp) {\n        int[] st = new int[exp.length()];\n        int top = -1;\n        for (char c : exp.toCharArray()) {\n            if (Character.isDigit(c)) {\n                st[++top] = c - '0';                 // operand: push\n            } else if (c != ' ') {\n                int b = st[top--];                   // first pop = right operand\n                int a = st[top--];                   // second pop = left operand\n                switch (c) {\n                    case '+': st[++top] = a + b; break;\n                    case '-': st[++top] = a - b; break;\n                    case '*': st[++top] = a * b; break;\n                    case '/': st[++top] = a / b; break;\n                    default: throw new IllegalArgumentException(\"bad operator \" + c);\n                }\n            }\n        }\n        return st[top];\n    }\n    public static void main(String[] args) {\n        System.out.println(\"623*+84/- = \" + evalPostfix(\"623*+84/-\"));\n        System.out.println(\"53-       = \" + evalPostfix(\"53-\"));\n        System.out.println(\"231*+9-   = \" + evalPostfix(\"231*+9-\"));\n    }\n}", "out": "623*+84/- = 10\n53-       = 2\n231*+9-   = -4", "cpp": {"f": "main.cpp", "c": "#include <iostream>\n#include <string>\n#include <stdexcept>\n#include <cctype>\nusing namespace std;\n\nint evalPostfix(const string& exp) {\n    int st[100];\n    int top = -1;\n    for (char c : exp) {\n        if (isdigit((unsigned char)c)) {\n            st[++top] = c - '0';                 // operand: push\n        } else if (c != ' ') {\n            int b = st[top--];                   // first pop = right operand\n            int a = st[top--];                   // second pop = left operand\n            switch (c) {\n                case '+': st[++top] = a + b; break;\n                case '-': st[++top] = a - b; break;\n                case '*': st[++top] = a * b; break;\n                case '/': st[++top] = a / b; break;\n                default: throw invalid_argument(string(\"bad operator \") + c);\n            }\n        }\n    }\n    return st[top];\n}\nint main() {\n    cout << \"623*+84/- = \" << evalPostfix(\"623*+84/-\") << \"\\n\";\n    cout << \"53-       = \" << evalPostfix(\"53-\") << \"\\n\";\n    cout << \"231*+9-   = \" << evalPostfix(\"231*+9-\") << \"\\n\";\n    return 0;\n}\n"}, "clang": {"f": "main.c", "c": "#include <stdio.h>\n#include <ctype.h>\n\nint evalPostfix(const char *exp) {\n    int st[100], top = -1;\n    for (int i = 0; exp[i]; i++) {\n        char c = exp[i];\n        if (isdigit((unsigned char)c)) {\n            st[++top] = c - '0';                 /* operand: push */\n        } else if (c != ' ') {\n            int b = st[top--];                   /* first pop = right operand */\n            int a = st[top--];                   /* second pop = left operand */\n            switch (c) {\n                case '+': st[++top] = a + b; break;\n                case '-': st[++top] = a - b; break;\n                case '*': st[++top] = a * b; break;\n                case '/': st[++top] = a / b; break;\n                default: printf(\"bad operator %c\\n\", c); return -1;\n            }\n        }\n    }\n    return st[top];\n}\nint main() {\n    printf(\"623*+84/- = %d\\n\", evalPostfix(\"623*+84/-\"));\n    printf(\"53-       = %d\\n\", evalPostfix(\"53-\"));\n    printf(\"231*+9-   = %d\\n\", evalPostfix(\"231*+9-\"));\n    return 0;\n}\n"}}}, {"h": "Prefix evaluation (the idea)", "p": ["Prefix evaluation is the mirror of postfix. Scan the expression from RIGHT to LEFT. Push operands. On an operator, pop two values, but now the first popped value is the LEFT operand and the second popped is the RIGHT operand. Push the result.", "Example: `- + 6 * 2 3 / 8 4`. Right to left: push 4, push 8, `/` gives 8/4 = 2, push 3, push 2, `*` gives 2*3 = 6, push 6, `+` gives 6+6 = 12, `-` gives 12-2 = 10."], "code": {"f": "Main.java", "c": "public class Main {\n    static int evalPrefix(String exp) {\n        int[] st = new int[exp.length()];\n        int top = -1;\n        for (int i = exp.length() - 1; i >= 0; i--) {   // right to left\n            char c = exp.charAt(i);\n            if (Character.isDigit(c)) {\n                st[++top] = c - '0';\n            } else {\n                int a = st[top--];                       // first pop = LEFT operand\n                int b = st[top--];                       // second pop = right operand\n                switch (c) {\n                    case '+': st[++top] = a + b; break;\n                    case '-': st[++top] = a - b; break;\n                    case '*': st[++top] = a * b; break;\n                    default:  st[++top] = a / b;\n                }\n            }\n        }\n        return st[top];\n    }\n    public static void main(String[] args) {\n        System.out.println(\"-+6*23/84 = \" + evalPrefix(\"-+6*23/84\"));\n        System.out.println(\"-53       = \" + evalPrefix(\"-53\"));\n    }\n}", "out": "-+6*23/84 = 10\n-53       = 2", "cpp": {"f": "main.cpp", "c": "#include <iostream>\n#include <string>\n#include <cctype>\nusing namespace std;\n\nint evalPrefix(const string& exp) {\n    int st[100];\n    int top = -1;\n    for (int i = exp.size() - 1; i >= 0; i--) {   // right to left\n        char c = exp[i];\n        if (isdigit((unsigned char)c)) {\n            st[++top] = c - '0';\n        } else {\n            int a = st[top--];                       // first pop = LEFT operand\n            int b = st[top--];                       // second pop = right operand\n            switch (c) {\n                case '+': st[++top] = a + b; break;\n                case '-': st[++top] = a - b; break;\n                case '*': st[++top] = a * b; break;\n                default:  st[++top] = a / b;\n            }\n        }\n    }\n    return st[top];\n}\nint main() {\n    cout << \"-+6*23/84 = \" << evalPrefix(\"-+6*23/84\") << \"\\n\";\n    cout << \"-53       = \" << evalPrefix(\"-53\") << \"\\n\";\n    return 0;\n}\n"}, "clang": {"f": "main.c", "c": "#include <stdio.h>\n#include <string.h>\n#include <ctype.h>\n\nint evalPrefix(const char *exp) {\n    int st[100], top = -1;\n    for (int i = strlen(exp) - 1; i >= 0; i--) {   /* right to left */\n        char c = exp[i];\n        if (isdigit((unsigned char)c)) {\n            st[++top] = c - '0';\n        } else {\n            int a = st[top--];                       /* first pop = LEFT operand */\n            int b = st[top--];                       /* second pop = right operand */\n            switch (c) {\n                case '+': st[++top] = a + b; break;\n                case '-': st[++top] = a - b; break;\n                case '*': st[++top] = a * b; break;\n                default:  st[++top] = a / b;\n            }\n        }\n    }\n    return st[top];\n}\nint main() {\n    printf(\"-+6*23/84 = %d\\n\", evalPrefix(\"-+6*23/84\"));\n    printf(\"-53       = %d\\n\", evalPrefix(\"-53\"));\n    return 0;\n}\n"}}}, {"h": "Complexity and errors to handle", "p": ["Evaluation visits each symbol once, so time is O(n). In the worst case (all operands first) the stack holds about n/2 values, so space is O(n)."], "table": {"head": ["Case", "Meaning", "What to do"], "rows": [["Stack empty when operator comes", "Too few operands", "Report invalid expression"], ["More than 1 value left at end", "Too few operators", "Report invalid expression"], ["Division by zero", "Runtime error", "Check b != 0 before a / b"]]}}], "analogy": "It is like a calculator where you first key in the numbers and then press the operator button. The numbers wait in memory until the button is pressed.", "hinglish": "Bhai postfix evaluation bahut easy hai. Number mile to stack mein push karo. Operator mile to do number pop karo, kaam karo, result wapas push kar do. Dhyan rakho: pehla pop right operand hota hai, dusra pop left operand. End mein jo bacha wahi answer.", "mistakes": ["Swapping operand order for - and / (computing b OP a).", "Scanning prefix from left to right.", "Treating a digit character as its ASCII value instead of c - '0'.", "Forgetting that multi-digit numbers need space-separated tokens."], "remember": ["Postfix evaluation uses an operand stack and one left-to-right scan.", "Operand -> push. Operator -> pop two, apply, push result.", "First popped value = right operand (b), second popped = left operand (a). Result = a OP b.", "At the end the stack has exactly one value: the answer.", "Example: 6 2 3 * + 8 4 / - = 10.", "Prefix evaluation: scan RIGHT to LEFT; first popped = left operand, second popped = right operand.", "Example prefix: - + 6 * 2 3 / 8 4 = 10.", "Time O(n), space O(n).", "Underflow while popping means invalid expression (too few operands).", "No brackets and no precedence are needed for postfix/prefix evaluation."], "uses": ["Calculators using Reverse Polish Notation", "Compilers evaluating expressions", "Stack-based virtual machines (e.g. JVM bytecode style)", "Spreadsheet formula engines"], "pros": ["Single scan, O(n)", "No brackets or precedence handling", "Very simple code"], "cons": ["Expression must first be converted to postfix", "Hard to read for humans", "Needs extra stack memory"], "def": "Once an expression is in postfix form (like `6 2 3 * + 8 4 / -`), the computer can find its value in ONE left-to-right scan. No brackets and no precedence rules are needed. A stack holds the operands that are waiting for an operator."}, "u2-t4": {"tldr": "A queue is a FIFO list: add at the rear, remove from the front.", "sections": [{"h": "What is a Queue?", "p": ["Think of a ticket counter line. The person who comes first is served first. New people join at the back."], "pts": ["Two ends are used: front (delete) and rear (insert).", "Insert = enqueue, delete = dequeue.", "Fair order: no one jumps the line."], "viz": {"type": "cells", "items": ["10", "20", "30", "40"], "labels": ["front", "1", "2", "rear"], "hl": [0, 3], "caption": "Dequeue from the front (left). Enqueue at the rear (right)."}}, {"h": "Queue as an ADT", "p": ["The Queue ADT says what operations exist, not how they are coded. It can be built using an array or a linked list."], "table": {"head": ["Operation", "What it does", "Condition / error"], "rows": [["enqueue(x)", "Add x at the rear", "Overflow if queue is full"], ["dequeue()", "Remove and return the front element", "Underflow if queue is empty"], ["front() / peek()", "Read the front element", "Error if empty"], ["rear()", "Read the last element", "Error if empty"], ["isEmpty()", "Is there no element?", "front > rear"], ["isFull()", "Is there no space?", "rear == MAX-1"]]}}, {"h": "Array representation and enqueue", "p": ["We use an array `q[0..MAX-1]` and two integers. `front = 0` points to the first element and `rear = -1` points to the last one. At the start `rear = -1`, so the queue is empty (`front > rear`).", "Enqueue moves rear one step to the right and stores the value there. Overflow happens when `rear == MAX-1`."], "table": {"head": ["Step", "What happens"], "rows": [["1. Check overflow", "rear == MAX-1 ? stop"], ["2. Move rear", "rear = rear + 1"], ["3. Store value", "q[rear] = x"]]}}, {"h": "Dequeue, front, isEmpty", "p": ["Dequeue returns the element at `front` and then moves front one step to the right. If `front > rear`, the queue is empty and dequeue gives UNDERFLOW."], "pts": ["peek: if front > rear error, else return q[front].", "isEmpty: return front > rear.", "isFull: return rear == MAX - 1.", "size: rear - front + 1."], "table": {"head": ["Step", "What happens"], "rows": [["1. Check underflow", "front > rear ? stop"], ["2. Take value", "x = q[front]"], ["3. Move front", "front = front + 1"], ["4. Return", "return x"]]}}, {"h": "Complete Java implementation", "p": ["Array-based simple queue with capacity 5. Elements are removed in the same order in which they were added."], "tip": "Return -1 on error is only for brevity. Real code should throw an exception.", "code": {"f": "Main.java", "c": "public class Main {\n    static int[] q = new int[5];\n    static int front = 0, rear = -1;\n\n    static boolean isEmpty() { return front > rear; }\n    static boolean isFull()  { return rear == q.length - 1; }\n\n    static void enqueue(int x) {\n        if (isFull()) { System.out.println(\"Overflow: cannot add \" + x); return; }\n        q[++rear] = x;\n        System.out.println(\"Enqueued \" + x);\n    }\n    static int dequeue() {\n        if (isEmpty()) { System.out.println(\"Underflow: queue is empty\"); return -1; }\n        return q[front++];\n    }\n    static int peek() { return isEmpty() ? -1 : q[front]; }\n\n    public static void main(String[] args) {\n        enqueue(10); enqueue(20); enqueue(30);\n        System.out.println(\"Front = \" + peek());\n        System.out.println(\"Dequeued \" + dequeue());\n        System.out.println(\"Dequeued \" + dequeue());\n        System.out.println(\"Size = \" + (rear - front + 1));\n        System.out.println(\"Dequeued \" + dequeue());\n        dequeue();\n    }\n}", "out": "Enqueued 10\nEnqueued 20\nEnqueued 30\nFront = 10\nDequeued 10\nDequeued 20\nSize = 1\nDequeued 30\nUnderflow: queue is empty", "cpp": {"f": "main.cpp", "c": "#include <iostream>\nusing namespace std;\n\nconst int N = 5;\nint q[N];\nint front = 0, rear = -1;\n\nbool isEmpty() { return front > rear; }\nbool isFull()  { return rear == N - 1; }\n\nvoid enqueue(int x) {\n    if (isFull()) { cout << \"Overflow: cannot add \" << x << \"\\n\"; return; }\n    q[++rear] = x;\n    cout << \"Enqueued \" << x << \"\\n\";\n}\nint dequeue() {\n    if (isEmpty()) { cout << \"Underflow: queue is empty\\n\"; return -1; }\n    return q[front++];\n}\nint peek() { return isEmpty() ? -1 : q[front]; }\n\nint main() {\n    enqueue(10); enqueue(20); enqueue(30);\n    cout << \"Front = \" << peek() << \"\\n\";\n    cout << \"Dequeued \" << dequeue() << \"\\n\";\n    cout << \"Dequeued \" << dequeue() << \"\\n\";\n    cout << \"Size = \" << (rear - front + 1) << \"\\n\";\n    cout << \"Dequeued \" << dequeue() << \"\\n\";\n    dequeue();\n    return 0;\n}\n"}, "clang": {"f": "main.c", "c": "#include <stdio.h>\n#define N 5\n\nint q[N];\nint front = 0, rear = -1;\n\nint isEmpty() { return front > rear; }\nint isFull()  { return rear == N - 1; }\n\nvoid enqueue(int x) {\n    if (isFull()) { printf(\"Overflow: cannot add %d\\n\", x); return; }\n    q[++rear] = x;\n    printf(\"Enqueued %d\\n\", x);\n}\nint dequeue() {\n    if (isEmpty()) { printf(\"Underflow: queue is empty\\n\"); return -1; }\n    return q[front++];\n}\nint peek() { return isEmpty() ? -1 : q[front]; }\n\nint main() {\n    enqueue(10); enqueue(20); enqueue(30);\n    printf(\"Front = %d\\n\", peek());\n    printf(\"Dequeued %d\\n\", dequeue());\n    printf(\"Dequeued %d\\n\", dequeue());\n    printf(\"Size = %d\\n\", rear - front + 1);\n    printf(\"Dequeued %d\\n\", dequeue());\n    dequeue();\n    return 0;\n}\n"}}}, {"h": "Dry run (trace)", "p": ["Queue with MAX = 4. Start: `front = 0`, `rear = -1`. The last row shows a false overflow."], "table": {"head": ["Operation", "Array (index 0..3)", "front", "rear", "Result"], "rows": [["start", "- - - -", "0", "-1", "empty"], ["enqueue(10)", "10 - - -", "0", "0", "ok"], ["enqueue(20)", "10 20 - -", "0", "1", "ok"], ["enqueue(30)", "10 20 30 -", "0", "2", "ok"], ["dequeue()", "x 20 30 -", "1", "2", "returns 10"], ["enqueue(40)", "x 20 30 40", "1", "3", "ok"], ["enqueue(50)", "x 20 30 40", "1", "3", "Overflow (but slot 0 is free!)"]]}}, {"h": "Problem: wasted space in a simple queue", "p": ["In a simple array queue, front and rear only move to the right. When we dequeue, the freed slots at the left are never used again. Once `rear` reaches `MAX-1`, the queue is declared full even if many slots near the start are empty. This is the main drawback of the simple queue.", "Two ways to fix it: (1) shift all elements left after each dequeue, which costs O(n) per dequeue, or (2) use a CIRCULAR queue, which wraps rear to index 0 and costs O(1). The next topic explains the circular queue."], "code": {"f": "Main.java", "c": "public class Main {\n    public static void main(String[] args) {\n        int[] q = new int[4];\n        int front = 0, rear = -1;\n        for (int x = 10; x <= 40; x += 10) q[++rear] = x;      // queue is full\n        System.out.println(\"Removed \" + q[front++]);\n        System.out.println(\"Removed \" + q[front++]);\n        int used = rear - front + 1;\n        System.out.println(\"Elements = \" + used + \", free slots = \" + (q.length - used));\n        System.out.println(\"rear == MAX-1 ? \" + (rear == q.length - 1));\n        System.out.println(\"So isFull() says true, yet 2 slots are empty.\");\n    }\n}", "out": "Removed 10\nRemoved 20\nElements = 2, free slots = 2\nrear == MAX-1 ? true\nSo isFull() says true, yet 2 slots are empty.", "cpp": {"f": "main.cpp", "c": "#include <iostream>\nusing namespace std;\n\nint main() {\n    int q[4];\n    int len = 4;\n    int front = 0, rear = -1;\n    for (int x = 10; x <= 40; x += 10) q[++rear] = x;      // queue is full\n    cout << \"Removed \" << q[front++] << \"\\n\";\n    cout << \"Removed \" << q[front++] << \"\\n\";\n    int used = rear - front + 1;\n    cout << \"Elements = \" << used << \", free slots = \" << (len - used) << \"\\n\";\n    cout << \"rear == MAX-1 ? \" << (rear == len - 1 ? \"true\" : \"false\") << \"\\n\";\n    cout << \"So isFull() says true, yet 2 slots are empty.\\n\";\n    return 0;\n}\n"}, "clang": {"f": "main.c", "c": "#include <stdio.h>\n\nint main() {\n    int q[4];\n    int len = 4;\n    int front = 0, rear = -1;\n    for (int x = 10; x <= 40; x += 10) q[++rear] = x;      /* queue is full */\n    printf(\"Removed %d\\n\", q[front++]);\n    printf(\"Removed %d\\n\", q[front++]);\n    int used = rear - front + 1;\n    printf(\"Elements = %d, free slots = %d\\n\", used, len - used);\n    printf(\"rear == MAX-1 ? %s\\n\", rear == len - 1 ? \"true\" : \"false\");\n    printf(\"So isFull() says true, yet 2 slots are empty.\\n\");\n    return 0;\n}\n"}}, "viz": {"type": "cells", "items": ["-", "-", "30", "40"], "labels": ["0 free", "1 free", "2 front", "3 rear"], "hl": [2, 3], "caption": "Two free slots on the left, but rear == MAX-1 so enqueue fails"}}, {"h": "Complexity", "p": ["Array queue with front and rear indexes does no shifting, so each operation is constant time. Space is O(n) for an array of n slots."], "table": {"head": ["Operation", "Time", "Note"], "rows": [["enqueue", "O(1)", "write at rear"], ["dequeue", "O(1)", "read at front, front++"], ["peek / isEmpty / isFull", "O(1)", "index comparison"], ["dequeue with left shifting", "O(n)", "avoid this design"], ["Space", "O(n)", "fixed size array"]]}}], "analogy": "A queue is a line at a bus stop. The first person to arrive boards first, and new people join at the end of the line.", "hinglish": "Bhai queue matlab line. Jo pehle aaya wo pehle jaata hai (FIFO). Peeche se enqueue, aage se dequeue. Simple array queue mein ek dikkat hai: aage ki jagah khali ho jaati hai par reuse nahi hoti, isliye circular queue banayi gayi.", "mistakes": ["Mixing up front and rear (insert at front is wrong).", "Declaring empty with front == rear instead of front > rear (in this convention).", "Forgetting that simple queue wastes space after dequeues.", "Calling it LIFO."], "remember": ["Queue = linear ADT, insert at rear, delete at front, follows FIFO.", "Operations: enqueue, dequeue, front/peek, rear, isEmpty, isFull.", "Array queue: q[MAX], front = 0, rear = -1.", "ENQUEUE: if rear==MAX-1 overflow; rear++; q[rear]=x.", "DEQUEUE: if front>rear underflow; x=q[front]; front++; return x.", "Empty: front > rear. Full: rear == MAX-1. Size = rear - front + 1.", "Overflow = enqueue on full; underflow = dequeue on empty.", "Drawback: freed slots on the left are wasted; queue shows full even with free space.", "Remedy: circular queue (or shifting, which is O(n)).", "Enqueue and dequeue are O(1); space O(n)."], "uses": ["CPU scheduling and printer spooling", "Buffers in networking and keyboards", "BFS (breadth first search) in graphs", "Customer service / ticket systems"], "pros": ["Simple and fair (FIFO order)", "O(1) enqueue and dequeue", "Easy to implement with an array"], "cons": ["Wasted space after dequeues in linear array queue", "Fixed size can overflow", "No random access"], "def": "A queue is a linear data structure in which insertion is done at one end, called the REAR, and deletion is done at the other end, called the FRONT. The element inserted first is removed first. This rule is called FIFO (First In, First Out)."}, "u2-t5": {"tldr": "A circular queue treats the array as a ring so freed slots are reused.", "sections": [{"h": "Why do we need a circular queue?", "p": ["A circular queue fixes this. We imagine the array as a RING: after the last index comes index 0 again. So rear can wrap around and use the freed slots. Every dequeue and enqueue still costs O(1)."], "viz": {"type": "cells", "items": ["60", "-", "30", "40"], "labels": ["0 rear", "1 free", "2 front", "3"], "hl": [0, 2], "caption": "Rear wrapped from index 3 to index 0 and reused a freed slot"}}, {"h": "Front, rear and the modulo trick", "p": ["We keep the same two pointers, `front` and `rear`, but every time we move one, we use the modulo operator so that it wraps around: `next = (i + 1) % MAX`.", "Initially `front = -1` and `rear = -1`. When the first element is inserted, both become 0. When the last element is removed, both go back to -1."], "pts": ["Move rear: rear = (rear + 1) % MAX", "Move front: front = (front + 1) % MAX", "Example MAX = 5: if rear = 4 then (4+1) % 5 = 0, so rear wraps to 0.", "Number of elements: (rear - front + MAX) % MAX + 1 (when not empty)."], "viz": {"type": "chain", "items": ["0", "1", "2", "3", "4", "back to 0"], "labels": ["+1", "+1", "+1", "+1", "(4+1)%5"], "caption": "Indexes form a ring when MAX = 5"}}, {"h": "Empty and full conditions", "p": ["With the front = -1 style, the checks are simple. The queue is full when the NEXT position of rear is front, i.e. every slot is used."], "tip": "This version can use ALL MAX slots. Another style keeps one slot empty to tell full from empty; do not mix the two styles in one answer.", "table": {"head": ["Condition", "Test", "Meaning"], "rows": [["Empty", "front == -1", "no element"], ["Full", "(rear + 1) % MAX == front", "all MAX slots are used"], ["One element", "front == rear (and not -1)", "front and rear at the same slot"]]}}, {"h": "Enqueue algorithm", "p": ["Enqueue first checks for overflow with the modulo test. If the queue is empty, both pointers start at 0. Otherwise rear moves to the next slot in the ring."], "table": {"head": ["Step", "What happens"], "rows": [["1. Check full", "if (rear+1) % MAX == front: Overflow, stop"], ["2. If empty", "if front == -1: front = 0, rear = 0"], ["3. Else", "rear = (rear + 1) % MAX"], ["4. Insert", "q[rear] = x"]]}}, {"h": "Dequeue algorithm", "p": ["Dequeue checks for underflow. If only one element is present (front equals rear), the queue becomes empty again, so both pointers reset to -1. Otherwise front moves to the next slot in the ring."], "table": {"head": ["Step", "What happens"], "rows": [["1. Check empty", "if front == -1: Underflow, stop"], ["2. Take value", "x = q[front]"], ["3. If one element", "if front == rear: front = rear = -1"], ["4. Else", "front = (front + 1) % MAX"], ["5. Return", "return x"]]}}, {"h": "Complete Java implementation", "p": ["Capacity is 4. After two dequeues, enqueue 60 and 70 reuse the freed slots at the start of the array. A simple queue would have shown overflow here."], "code": {"f": "Main.java", "c": "public class Main {\n    static int MAX = 4;\n    static int[] q = new int[MAX];\n    static int front = -1, rear = -1;\n\n    static boolean isEmpty() { return front == -1; }\n    static boolean isFull()  { return (rear + 1) % MAX == front; }\n\n    static void enqueue(int x) {\n        if (isFull()) { System.out.println(\"Overflow: cannot add \" + x); return; }\n        if (isEmpty()) front = rear = 0;\n        else rear = (rear + 1) % MAX;\n        q[rear] = x;\n    }\n    static int dequeue() {\n        if (isEmpty()) { System.out.println(\"Underflow\"); return -1; }\n        int x = q[front];\n        if (front == rear) front = rear = -1;\n        else front = (front + 1) % MAX;\n        return x;\n    }\n    static void show() {\n        if (isEmpty()) { System.out.println(\"[empty]\"); return; }\n        StringBuilder sb = new StringBuilder(\"front -> \");\n        int i = front;\n        while (true) {\n            sb.append(q[i]).append(' ');\n            if (i == rear) break;\n            i = (i + 1) % MAX;\n        }\n        System.out.println(sb + \"<- rear   (front=\" + front + \", rear=\" + rear + \")\");\n    }\n    public static void main(String[] args) {\n        enqueue(10); enqueue(20); enqueue(30); enqueue(40);\n        show();\n        enqueue(50);\n        System.out.println(\"Dequeued \" + dequeue());\n        System.out.println(\"Dequeued \" + dequeue());\n        enqueue(60); enqueue(70);\n        show();\n        System.out.println(\"Dequeued \" + dequeue());\n        show();\n    }\n}", "out": "front -> 10 20 30 40 <- rear   (front=0, rear=3)\nOverflow: cannot add 50\nDequeued 10\nDequeued 20\nfront -> 30 40 60 70 <- rear   (front=2, rear=1)\nDequeued 30\nfront -> 40 60 70 <- rear   (front=3, rear=1)", "cpp": {"f": "main.cpp", "c": "#include <iostream>\n#include <string>\nusing namespace std;\n\nconst int MAX = 4;\nint q[MAX];\nint front = -1, rear = -1;\n\nbool isEmpty() { return front == -1; }\nbool isFull()  { return (rear + 1) % MAX == front; }\n\nvoid enqueue(int x) {\n    if (isFull()) { cout << \"Overflow: cannot add \" << x << \"\\n\"; return; }\n    if (isEmpty()) front = rear = 0;\n    else rear = (rear + 1) % MAX;\n    q[rear] = x;\n}\nint dequeue() {\n    if (isEmpty()) { cout << \"Underflow\\n\"; return -1; }\n    int x = q[front];\n    if (front == rear) front = rear = -1;\n    else front = (front + 1) % MAX;\n    return x;\n}\nvoid show() {\n    if (isEmpty()) { cout << \"[empty]\\n\"; return; }\n    string sb = \"front -> \";\n    int i = front;\n    while (true) {\n        sb += to_string(q[i]) + ' ';\n        if (i == rear) break;\n        i = (i + 1) % MAX;\n    }\n    cout << sb << \"<- rear   (front=\" << front << \", rear=\" << rear << \")\\n\";\n}\nint main() {\n    enqueue(10); enqueue(20); enqueue(30); enqueue(40);\n    show();\n    enqueue(50);\n    cout << \"Dequeued \" << dequeue() << \"\\n\";\n    cout << \"Dequeued \" << dequeue() << \"\\n\";\n    enqueue(60); enqueue(70);\n    show();\n    cout << \"Dequeued \" << dequeue() << \"\\n\";\n    show();\n    return 0;\n}\n"}, "clang": {"f": "main.c", "c": "#include <stdio.h>\n#define MAX 4\n\nint q[MAX];\nint front = -1, rear = -1;\n\nint isEmpty() { return front == -1; }\nint isFull()  { return (rear + 1) % MAX == front; }\n\nvoid enqueue(int x) {\n    if (isFull()) { printf(\"Overflow: cannot add %d\\n\", x); return; }\n    if (isEmpty()) front = rear = 0;\n    else rear = (rear + 1) % MAX;\n    q[rear] = x;\n}\nint dequeue() {\n    if (isEmpty()) { printf(\"Underflow\\n\"); return -1; }\n    int x = q[front];\n    if (front == rear) front = rear = -1;\n    else front = (front + 1) % MAX;\n    return x;\n}\nvoid show() {\n    if (isEmpty()) { printf(\"[empty]\\n\"); return; }\n    printf(\"front -> \");\n    int i = front;\n    while (1) {\n        printf(\"%d \", q[i]);\n        if (i == rear) break;\n        i = (i + 1) % MAX;\n    }\n    printf(\"<- rear   (front=%d, rear=%d)\\n\", front, rear);\n}\nint main() {\n    enqueue(10); enqueue(20); enqueue(30); enqueue(40);\n    show();\n    enqueue(50);\n    printf(\"Dequeued %d\\n\", dequeue());\n    printf(\"Dequeued %d\\n\", dequeue());\n    enqueue(60); enqueue(70);\n    show();\n    printf(\"Dequeued %d\\n\", dequeue());\n    show();\n    return 0;\n}\n"}}}, {"h": "Dry run (trace)", "p": ["MAX = 4. Array cells are indexes 0 to 3. A dash means unused slot."], "table": {"head": ["Operation", "Array [0..3]", "front", "rear", "Note"], "rows": [["start", "- - - -", "-1", "-1", "empty"], ["enqueue(10)", "10 - - -", "0", "0", "first element: both = 0"], ["enqueue(20)", "10 20 - -", "0", "1", ""], ["enqueue(30)", "10 20 30 -", "0", "2", ""], ["enqueue(40)", "10 20 30 40", "0", "3", "(3+1)%4 = 0 = front, full"], ["enqueue(50)", "10 20 30 40", "0", "3", "Overflow"], ["dequeue()", "- 20 30 40", "1", "3", "returns 10"], ["dequeue()", "- - 30 40", "2", "3", "returns 20"], ["enqueue(60)", "60 - 30 40", "2", "0", "rear = (3+1)%4 = 0 (wrap)"], ["enqueue(70)", "60 70 30 40", "2", "1", "(1+1)%4 = 2 = front, full"], ["dequeue()", "60 70 - 40", "3", "1", "returns 30"]]}}, {"h": "Complexity, linear vs circular", "p": ["Only a few comparisons and one modulo are done per operation, so enqueue and dequeue are O(1). Space is O(MAX)."], "table": {"head": ["Point", "Simple queue", "Circular queue"], "rows": [["Space reuse", "No, slots wasted", "Yes, wraps around"], ["Full condition", "rear == MAX-1", "(rear+1) % MAX == front"], ["Empty condition", "front > rear", "front == -1"], ["enqueue / dequeue", "O(1)", "O(1)"], ["Use of memory", "Poor", "Full capacity"]]}}], "analogy": "Imagine a round dining table with numbered seats. When the last seat is taken, the next guest goes to seat 1 if it is free again, so no seat is wasted.", "hinglish": "Bhai circular queue mein array ko gol (ring) maan lete hain. Rear jab last index pe pahunche to modulo ki help se wapas 0 pe aa jaata hai. Isse dequeue se khali hui jagah dobara use hoti hai. Full ka test hai (rear+1)%MAX == front aur empty ka front == -1.", "mistakes": ["Using rear == MAX-1 as the full test (that is the simple queue test).", "Forgetting to reset front and rear to -1 when the last element is removed.", "Forgetting the modulo when moving a pointer.", "Printing elements from index 0 to MAX-1 instead of from front to rear."], "remember": ["Circular queue: last position is connected back to the first, forming a ring.", "Solves the wasted-space problem of the simple queue.", "Pointer move: rear = (rear+1) % MAX, front = (front+1) % MAX.", "Initially front = rear = -1 (empty).", "Empty: front == -1. Full: (rear+1) % MAX == front.", "ENQUEUE: check full; if empty front=rear=0 else rear=(rear+1)%MAX; q[rear]=x.", "DEQUEUE: check empty; x=q[front]; if front==rear then front=rear=-1 else front=(front+1)%MAX.", "Size = (rear - front + MAX) % MAX + 1 when not empty.", "Time O(1) for enqueue and dequeue; space O(MAX).", "Still FIFO and still fixed in size."], "uses": ["CPU scheduling (round robin)", "Keyboard and I/O buffers", "Streaming / audio buffers", "Traffic light cycling systems"], "pros": ["No wasted space; full capacity used", "O(1) enqueue and dequeue", "Better than shifting elements"], "cons": ["Slightly harder logic (modulo, wrap-around)", "Fixed size, overflow still possible", "Full vs empty confusion if conventions are mixed"], "def": "In a simple array queue, slots freed by dequeue at the left are never reused. The queue says 'full' (`rear == MAX-1`) even when space is free. This wastes memory."}, "u2-t6": {"tldr": "A priority queue serves the highest priority first; a deque inserts and deletes at both ends.", "sections": [{"h": "What is a priority queue?", "p": ["So it is not strictly first-in-first-out. The order of removal depends on priority, not on arrival time."], "viz": {"type": "chain", "items": ["insert any order", "Priority queue", "remove highest priority"], "labels": ["enqueue", "dequeue"], "caption": "Insertion anywhere, deletion by priority"}}, {"h": "Ascending and descending priority queue", "p": ["The word 'priority' can be defined in two ways, so there are two types."], "pts": ["Insertion is allowed in any order in both types.", "Only the deletion rule changes (smallest or largest key)."], "table": {"head": ["Type", "Removed first", "Also called", "Example order"], "rows": [["Ascending priority queue", "Smallest key (1 = highest priority)", "Min priority queue", "insert 30,10,20 -> remove 10,20,30"], ["Descending priority queue", "Largest key", "Max priority queue", "insert 30,10,20 -> remove 30,20,10"]]}}, {"h": "Ways to implement a priority queue", "p": ["There are three simple ways. Each moves the work either to insertion or to deletion."], "tip": "Heap is the best general method, but the syllabus asks for array and linked-list versions. Heaps come later in the course.", "table": {"head": ["Implementation", "Insert", "Delete (highest priority)"], "rows": [["Unsorted array / list", "O(1) add at end", "O(n) search for best"], ["Sorted array", "O(n) shift to keep order", "O(1) remove from end/front"], ["Sorted linked list", "O(n) find position", "O(1) remove head"], ["Binary heap (advanced)", "O(log n)", "O(log n)"]]}}, {"h": "Array implementation: insert and delete", "p": ["Here we keep the array UNSORTED. Insertion is fast; deletion must search for the best element. Smaller number means higher priority (ascending priority queue)."], "warn": "For a descending (max) priority queue just change `<` to `>` in the search loop.", "code": {"f": "Main.java", "c": "public class Main {\n    static String[] name = new String[10];\n    static int[] pri = new int[10];\n    static int n = 0;\n\n    static void insert(String s, int p) {          // O(1)\n        if (n == name.length) { System.out.println(\"Overflow\"); return; }\n        name[n] = s; pri[n] = p; n++;\n    }\n    static String deleteMin() {                    // O(n): smallest number = highest priority\n        if (n == 0) return \"Underflow\";\n        int best = 0;\n        for (int i = 1; i < n; i++)\n            if (pri[i] < pri[best]) best = i;      // strict '<' keeps FIFO for equal priority\n        String res = name[best] + \"(\" + pri[best] + \")\";\n        for (int i = best; i < n - 1; i++) {       // close the gap\n            name[i] = name[i + 1]; pri[i] = pri[i + 1];\n        }\n        n--;\n        return res;\n    }\n    public static void main(String[] args) {\n        insert(\"Print\", 3); insert(\"Email\", 1); insert(\"Backup\", 5); insert(\"Chat\", 1);\n        while (n > 0) System.out.println(\"Served \" + deleteMin());\n        System.out.println(deleteMin());\n    }\n}", "out": "Served Email(1)\nServed Chat(1)\nServed Print(3)\nServed Backup(5)\nUnderflow", "cpp": {"f": "main.cpp", "c": "#include <iostream>\n#include <string>\nusing namespace std;\n\nstring name[10];\nint pri[10];\nint n = 0;\n\nvoid insert(string s, int p) {          // O(1)\n    if (n == 10) { cout << \"Overflow\\n\"; return; }\n    name[n] = s; pri[n] = p; n++;\n}\nstring deleteMin() {                    // O(n): smallest number = highest priority\n    if (n == 0) return \"Underflow\";\n    int best = 0;\n    for (int i = 1; i < n; i++)\n        if (pri[i] < pri[best]) best = i;      // strict '<' keeps FIFO for equal priority\n    string res = name[best] + \"(\" + to_string(pri[best]) + \")\";\n    for (int i = best; i < n - 1; i++) {       // close the gap\n        name[i] = name[i + 1]; pri[i] = pri[i + 1];\n    }\n    n--;\n    return res;\n}\nint main() {\n    insert(\"Print\", 3); insert(\"Email\", 1); insert(\"Backup\", 5); insert(\"Chat\", 1);\n    while (n > 0) cout << \"Served \" << deleteMin() << \"\\n\";\n    cout << deleteMin() << \"\\n\";\n    return 0;\n}\n"}, "clang": {"f": "main.c", "c": "#include <stdio.h>\n#include <string.h>\n\nchar name[10][20];\nint pri[10];\nint n = 0;\n\nvoid insert(const char *s, int p) {          /* O(1) */\n    if (n == 10) { printf(\"Overflow\\n\"); return; }\n    strcpy(name[n], s); pri[n] = p; n++;\n}\nvoid deleteMin(char *res) {                  /* O(n): smallest number = highest priority */\n    if (n == 0) { strcpy(res, \"Underflow\"); return; }\n    int best = 0;\n    for (int i = 1; i < n; i++)\n        if (pri[i] < pri[best]) best = i;    /* strict '<' keeps FIFO for equal priority */\n    sprintf(res, \"%s(%d)\", name[best], pri[best]);\n    for (int i = best; i < n - 1; i++) {     /* close the gap */\n        strcpy(name[i], name[i + 1]); pri[i] = pri[i + 1];\n    }\n    n--;\n}\nint main() {\n    char r[40];\n    insert(\"Print\", 3); insert(\"Email\", 1); insert(\"Backup\", 5); insert(\"Chat\", 1);\n    while (n > 0) { deleteMin(r); printf(\"Served %s\\n\", r); }\n    deleteMin(r); printf(\"%s\\n\", r);\n    return 0;\n}\n"}}, "table": {"head": ["Step", "What happens"], "rows": [["1. INSERT(x, p)", "if n == MAX overflow; a[n] = (x, p); n = n + 1"], ["2. DELETE: check", "if n == 0 underflow"], ["3. DELETE: find", "scan 0..n-1 and note index of the smallest p (first one on ties)"], ["4. DELETE: remove", "save it, shift later elements left by one, n = n - 1"]]}}, {"h": "Linked list implementation: insert and delete", "p": ["Here the list is kept SORTED by priority, so the highest priority element is always the head. Insertion walks to the correct position; deletion just removes the head."], "tip": "Use `<=` while walking so equal priorities are served in the order they arrived (FIFO).", "code": {"f": "Main.java", "c": "public class Main {\n    static class Node {\n        String name; int pri; Node next;\n        Node(String n, int p) { name = n; pri = p; }\n    }\n    static Node head = null;\n\n    static void insert(String s, int p) {\n        Node nn = new Node(s, p);\n        if (head == null || p < head.pri) {          // goes before the head\n            nn.next = head; head = nn;\n            return;\n        }\n        Node cur = head;\n        while (cur.next != null && cur.next.pri <= p) cur = cur.next;   // <= keeps FIFO on ties\n        nn.next = cur.next;\n        cur.next = nn;\n    }\n    static String delete() {                         // highest priority is always the head\n        if (head == null) return \"Underflow\";\n        String r = head.name + \"(\" + head.pri + \")\";\n        head = head.next;\n        return r;\n    }\n    static void show() {\n        StringBuilder sb = new StringBuilder();\n        for (Node c = head; c != null; c = c.next) sb.append(c.name).append('(').append(c.pri).append(\") -> \");\n        System.out.println(sb + \"null\");\n    }\n    public static void main(String[] args) {\n        insert(\"Print\", 3); show();\n        insert(\"Email\", 1); show();\n        insert(\"Backup\", 5); show();\n        insert(\"Chat\", 1); show();\n        System.out.println(\"Served \" + delete());\n        System.out.println(\"Served \" + delete());\n        show();\n    }\n}", "out": "Print(3) -> null\nEmail(1) -> Print(3) -> null\nEmail(1) -> Print(3) -> Backup(5) -> null\nEmail(1) -> Chat(1) -> Print(3) -> Backup(5) -> null\nServed Email(1)\nServed Chat(1)\nPrint(3) -> Backup(5) -> null", "cpp": {"f": "main.cpp", "c": "#include <iostream>\n#include <string>\nusing namespace std;\n\nstruct Node {\n    string name; int pri; Node* next;\n    Node(string n, int p) : name(n), pri(p), next(nullptr) {}\n};\nNode* head = nullptr;\n\nvoid insert(string s, int p) {\n    Node* nn = new Node(s, p);\n    if (head == nullptr || p < head->pri) {          // goes before the head\n        nn->next = head; head = nn;\n        return;\n    }\n    Node* cur = head;\n    while (cur->next != nullptr && cur->next->pri <= p) cur = cur->next;   // <= keeps FIFO on ties\n    nn->next = cur->next;\n    cur->next = nn;\n}\nstring del() {                                       // highest priority is always the head\n    if (head == nullptr) return \"Underflow\";\n    string r = head->name + \"(\" + to_string(head->pri) + \")\";\n    Node* old = head;\n    head = head->next;\n    delete old;\n    return r;\n}\nvoid show() {\n    string sb;\n    for (Node* c = head; c != nullptr; c = c->next) sb += c->name + \"(\" + to_string(c->pri) + \") -> \";\n    cout << sb << \"null\\n\";\n}\nint main() {\n    insert(\"Print\", 3); show();\n    insert(\"Email\", 1); show();\n    insert(\"Backup\", 5); show();\n    insert(\"Chat\", 1); show();\n    cout << \"Served \" << del() << \"\\n\";\n    cout << \"Served \" << del() << \"\\n\";\n    show();\n    while (head) { Node* t = head; head = head->next; delete t; }   // cleanup\n    return 0;\n}\n"}, "clang": {"f": "main.c", "c": "#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\n\ntypedef struct Node { char name[20]; int pri; struct Node *next; } Node;\nNode *head = NULL;\n\nvoid insert(const char *s, int p) {\n    Node *nn = malloc(sizeof(Node));\n    strcpy(nn->name, s); nn->pri = p; nn->next = NULL;\n    if (head == NULL || p < head->pri) {          /* goes before the head */\n        nn->next = head; head = nn;\n        return;\n    }\n    Node *cur = head;\n    while (cur->next != NULL && cur->next->pri <= p) cur = cur->next;   /* <= keeps FIFO on ties */\n    nn->next = cur->next;\n    cur->next = nn;\n}\nvoid del(char *r) {                               /* highest priority is always the head */\n    if (head == NULL) { strcpy(r, \"Underflow\"); return; }\n    sprintf(r, \"%s(%d)\", head->name, head->pri);\n    Node *old = head;\n    head = head->next;\n    free(old);\n}\nvoid show() {\n    for (Node *c = head; c != NULL; c = c->next) printf(\"%s(%d) -> \", c->name, c->pri);\n    printf(\"null\\n\");\n}\nint main() {\n    char r[40];\n    insert(\"Print\", 3); show();\n    insert(\"Email\", 1); show();\n    insert(\"Backup\", 5); show();\n    insert(\"Chat\", 1); show();\n    del(r); printf(\"Served %s\\n\", r);\n    del(r); printf(\"Served %s\\n\", r);\n    show();\n    while (head) { Node *t = head; head = head->next; free(t); }   /* cleanup */\n    return 0;\n}\n"}}, "table": {"head": ["Step", "What happens"], "rows": [["1. INSERT: make node", "new node with data and priority"], ["2. INSERT: head case", "if list empty or p < head.pri: new.next = head; head = new"], ["3. INSERT: otherwise", "move cur while cur.next.pri <= p; new.next = cur.next; cur.next = new"], ["4. DELETE", "if head == null underflow; else take head and head = head.next"]]}}, {"h": "Dry run (trace) and complexity", "p": ["Sorted linked list, smaller number = higher priority. List is shown from head."], "pts": ["Linked list: insert O(n), delete O(1), space O(n) (extra pointer per node).", "Unsorted array: insert O(1), delete O(n), space O(n)."], "table": {"head": ["Operation", "List (head first)", "Result"], "rows": [["insert Print,3", "Print(3)", "list was empty"], ["insert Email,1", "Email(1) Print(3)", "1 < 3, goes to head"], ["insert Backup,5", "Email(1) Print(3) Backup(5)", "walks to the end"], ["insert Chat,1", "Email(1) Chat(1) Print(3) Backup(5)", "after Email: tie, FIFO"], ["delete", "Chat(1) Print(3) Backup(5)", "returns Email(1)"], ["delete", "Print(3) Backup(5)", "returns Chat(1)"]]}}, {"h": "Double-ended queue (deque)", "p": ["A deque (pronounced 'deck') is a queue in which insertion and deletion can be done at BOTH ends, front and rear. So it works as a stack and as a queue. Operations: insertFront, insertRear, deleteFront, deleteRear.", "Two restricted forms exist: an INPUT-restricted deque allows insertion at one end only (deletion at both). An OUTPUT-restricted deque allows deletion at one end only (insertion at both). The code below uses a circular array with a size counter; every operation is O(1)."], "tip": "insertRear + deleteRear behaves like a stack. insertRear + deleteFront behaves like a queue.", "code": {"f": "Main.java", "c": "public class Main {\n    static int MAX = 4;\n    static int[] d = new int[MAX];\n    static int front = 0, size = 0;\n\n    static void insertRear(int x) {\n        if (size == MAX) { System.out.println(\"Overflow: \" + x); return; }\n        d[(front + size) % MAX] = x; size++;\n    }\n    static void insertFront(int x) {\n        if (size == MAX) { System.out.println(\"Overflow: \" + x); return; }\n        front = (front - 1 + MAX) % MAX; d[front] = x; size++;\n    }\n    static int deleteFront() {\n        int x = d[front]; front = (front + 1) % MAX; size--; return x;\n    }\n    static int deleteRear() {\n        size--; return d[(front + size) % MAX];\n    }\n    static void show() {\n        StringBuilder sb = new StringBuilder(\"front \");\n        for (int i = 0; i < size; i++) sb.append(d[(front + i) % MAX]).append(' ');\n        System.out.println(sb + \"rear\");\n    }\n    public static void main(String[] args) {\n        insertRear(10); insertRear(20);\n        insertFront(5); insertFront(1);\n        show();\n        insertRear(99);\n        System.out.println(\"deleteFront = \" + deleteFront());\n        System.out.println(\"deleteRear  = \" + deleteRear());\n        show();\n    }\n}", "out": "front 1 5 10 20 rear\nOverflow: 99\ndeleteFront = 1\ndeleteRear  = 20\nfront 5 10 rear", "cpp": {"f": "main.cpp", "c": "#include <iostream>\n#include <string>\nusing namespace std;\n\nconst int MAX = 4;\nint d[MAX];\nint front = 0, sz = 0;\n\nvoid insertRear(int x) {\n    if (sz == MAX) { cout << \"Overflow: \" << x << \"\\n\"; return; }\n    d[(front + sz) % MAX] = x; sz++;\n}\nvoid insertFront(int x) {\n    if (sz == MAX) { cout << \"Overflow: \" << x << \"\\n\"; return; }\n    front = (front - 1 + MAX) % MAX; d[front] = x; sz++;\n}\nint deleteFront() {\n    int x = d[front]; front = (front + 1) % MAX; sz--; return x;\n}\nint deleteRear() {\n    sz--; return d[(front + sz) % MAX];\n}\nvoid show() {\n    string sb = \"front \";\n    for (int i = 0; i < sz; i++) sb += to_string(d[(front + i) % MAX]) + ' ';\n    cout << sb << \"rear\\n\";\n}\nint main() {\n    insertRear(10); insertRear(20);\n    insertFront(5); insertFront(1);\n    show();\n    insertRear(99);\n    cout << \"deleteFront = \" << deleteFront() << \"\\n\";\n    cout << \"deleteRear  = \" << deleteRear() << \"\\n\";\n    show();\n    return 0;\n}\n"}, "clang": {"f": "main.c", "c": "#include <stdio.h>\n#define MAX 4\n\nint d[MAX];\nint front = 0, sz = 0;\n\nvoid insertRear(int x) {\n    if (sz == MAX) { printf(\"Overflow: %d\\n\", x); return; }\n    d[(front + sz) % MAX] = x; sz++;\n}\nvoid insertFront(int x) {\n    if (sz == MAX) { printf(\"Overflow: %d\\n\", x); return; }\n    front = (front - 1 + MAX) % MAX; d[front] = x; sz++;\n}\nint deleteFront() {\n    int x = d[front]; front = (front + 1) % MAX; sz--; return x;\n}\nint deleteRear() {\n    sz--; retu
