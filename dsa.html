rn d[(front + sz) % MAX];\n}\nvoid show() {\n    printf(\"front \");\n    for (int i = 0; i < sz; i++) printf(\"%d \", d[(front + i) % MAX]);\n    printf(\"rear\\n\");\n}\nint main() {\n    insertRear(10); insertRear(20);\n    insertFront(5); insertFront(1);\n    show();\n    insertRear(99);\n    printf(\"deleteFront = %d\\n\", deleteFront());\n    printf(\"deleteRear  = %d\\n\", deleteRear());\n    show();\n    return 0;\n}\n"}}}], "analogy": "In a hospital emergency ward, a patient with a serious injury is treated before others who came earlier. That is a priority queue.", "hinglish": "Bhai priority queue mein line ka rule alag hai: jiski priority sabse zyada, wo pehle jaayega, chahe wo late aaya ho. Ascending mein chhota number pehle, descending mein bada pehle. Array ya sorted linked list se bana sakte hain. Deque mein dono taraf se insert aur delete hota hai.", "mistakes": ["Saying a priority queue is FIFO.", "Not handling the equal-priority case (use <= while walking in the list).", "Forgetting to shift elements after deletion in the unsorted array version.", "Mixing up input-restricted and output-restricted deque."], "remember": ["Priority queue: each element has a priority; highest priority element is deleted first.", "Equal priority: served in FIFO order.", "Ascending PQ: smallest key removed first (min PQ). Descending PQ: largest key removed first (max PQ).", "Unsorted array: insert O(1), delete O(n).", "Sorted array / linked list: insert O(n), delete O(1).", "Sorted linked list insert: head case when empty or p < head.pri, else walk to the right place.", "Delete from sorted list = remove head: head = head.next.", "Heap-based PQ gives O(log n) for both operations.", "Deque = double-ended queue: insertFront, insertRear, deleteFront, deleteRear.", "Input-restricted deque: insert at one end only. Output-restricted deque: delete at one end only.", "Deque can act as both stack and queue."], "uses": ["CPU and process scheduling", "Dijkstra's shortest path and Prim's algorithm", "Hospital emergency and ticket systems", "Huffman coding; deque: sliding-window problems and undo/redo"], "pros": ["Serves the most important element first", "Simple versions are easy to code", "Deque is flexible: works as stack and queue"], "cons": ["Either insert or delete is O(n) in simple versions", "Extra memory for priority field (and pointers in the list)", "Not FIFO overall; low priority items can starve"], "def": "A priority queue is a queue in which every element has a PRIORITY, and the element with the highest priority is removed first. If two elements have the same priority, they are served in FIFO order (the one inserted earlier goes first)."}, "u5-t6": {"tldr": "Binary trees power expression evaluation, Huffman compression, heaps, BST search, decision making and file systems.", "sections": [{"h": "Where binary trees are used", "p": ["Here are the six standard applications. Each one is explained below."], "table": {"head": ["Application", "Tree used", "Main benefit"], "rows": [["Expression evaluation", "Expression tree", "Handles precedence without brackets"], ["Compression", "Huffman tree", "Shorter codes for frequent symbols"], ["Priority queue", "Heap (complete tree)", "O(log n) insert and delete-min"], ["Dictionary / search", "BST", "O(log n) average search"], ["Decisions", "Decision tree", "Each node is a yes/no test"], ["Storage", "File-system tree", "Folders inside folders"]]}}, {"h": "Expression tree", "p": ["An expression tree represents an arithmetic expression. Operands (numbers, variables) are leaves. Operators (+, -, *, /) are internal nodes. The left and right children of an operator are its two operands.", "Evaluation is a post-order walk: evaluate the left subtree, then the right subtree, then apply the operator at the node. The tree shape already encodes precedence, so no brackets are needed.", "In-order traversal gives the infix form, pre-order gives prefix and post-order gives postfix."], "viz": {"type": "btree", "nodes": ["-", "+", "9", "*", "*", null, null, "2", "3", "5", "4"], "caption": "Tree for (2*3)+(5*4)-9 = postfix 2 3 * 5 4 * + 9 -"}}, {"h": "Building an expression tree from postfix", "p": ["Scan the postfix string left to right with a stack of tree nodes. An operand becomes a one-node tree and is pushed. For an operator, pop two nodes: the first popped is the RIGHT child, the second is the LEFT child. Make a new node with the operator and push it back. At the end the stack holds exactly one node, the root.", "Dry run for 2 3 * 5 4 * + 9 -."], "pts": ["2, 3 pushed. Stack: [2, 3]", "* : pop 3 (right), pop 2 (left) -> node (2*3). Stack: [(2*3)]", "5, 4 pushed. Stack: [(2*3), 5, 4]", "* : pop 4, pop 5 -> node (5*4). Stack: [(2*3), (5*4)]", "+ : pop (5*4) as right, (2*3) as left -> ((2*3)+(5*4)). Stack: [that]", "9 pushed, then - : pop 9 as right and the (+) tree as left -> root. Value = (6 + 20) - 9 = 17"], "tip": "Time O(n) for n symbols, space O(n) for the stack and the tree. Evaluation is also O(n) with O(h) recursion stack.", "code": {"f": "Main.java", "c": "import java.util.*;\npublic class Main {\n    static class Node {\n        char val; Node left, right;\n        Node(char v) { val = v; }\n    }\n    static Node build(String postfix) {\n        Deque<Node> st = new ArrayDeque<>();\n        for (char ch : postfix.toCharArray()) {\n            Node n = new Node(ch);\n            if (!Character.isDigit(ch)) {      // operator: pop right, then left\n                n.right = st.pop();\n                n.left = st.pop();\n            }\n            st.push(n);\n        }\n        return st.pop();\n    }\n    static int eval(Node n) {\n        if (Character.isDigit(n.val)) return n.val - '0';\n        int l = eval(n.left), r = eval(n.right);\n        switch (n.val) {\n            case '+': return l + r;\n            case '-': return l - r;\n            case '*': return l * r;\n            default:  return l / r;\n        }\n    }\n    static String infix(Node n) {\n        if (n.left == null) return \"\" + n.val;\n        return \"(\" + infix(n.left) + n.val + infix(n.right) + \")\";\n    }\n    public static void main(String[] args) {\n        Node root = build(\"23*54*+9-\");\n        System.out.println(infix(root) + \" = \" + eval(root));\n    }\n}", "out": "(((2*3)+(5*4))-9) = 17", "cpp": {"f": "main.cpp", "c": "#include <iostream>\n#include <stack>\n#include <string>\n#include <cctype>\nusing namespace std;\n\nstruct Node {\n    char val; Node *left, *right;\n    Node(char v) : val(v), left(nullptr), right(nullptr) {}\n};\nNode* build(const string& postfix) {\n    stack<Node*> st;\n    for (char ch : postfix) {\n        Node* n = new Node(ch);\n        if (!isdigit(ch)) {      // operator: pop right, then left\n            n->right = st.top(); st.pop();\n            n->left = st.top(); st.pop();\n        }\n        st.push(n);\n    }\n    return st.top();\n}\nint eval(Node* n) {\n    if (isdigit(n->val)) return n->val - '0';\n    int l = eval(n->left), r = eval(n->right);\n    switch (n->val) {\n        case '+': return l + r;\n        case '-': return l - r;\n        case '*': return l * r;\n        default:  return l / r;\n    }\n}\nstring infix(Node* n) {\n    if (n->left == nullptr) return string(1, n->val);\n    return \"(\" + infix(n->left) + n->val + infix(n->right) + \")\";\n}\nint main() {\n    Node* root = build(\"23*54*+9-\");\n    cout << infix(root) << \" = \" << eval(root) << endl;\n}\n"}, "clang": {"f": "main.c", "c": "#include <stdio.h>\n#include <stdlib.h>\n#include <ctype.h>\n#include <string.h>\n\ntypedef struct Node { char val; struct Node *left, *right; } Node;\nNode *mk(char v) { Node *n = malloc(sizeof(Node)); n->val = v; n->left = n->right = NULL; return n; }\n\nNode *build(const char *postfix) {\n    Node *st[100]; int top = -1;\n    for (int i = 0; postfix[i]; i++) {\n        Node *n = mk(postfix[i]);\n        if (!isdigit((unsigned char)postfix[i])) {   /* operator: pop right, then left */\n            n->right = st[top--];\n            n->left = st[top--];\n        }\n        st[++top] = n;\n    }\n    return st[top];\n}\nint eval(Node *n) {\n    if (isdigit((unsigned char)n->val)) return n->val - '0';\n    int l = eval(n->left), r = eval(n->right);\n    switch (n->val) {\n        case '+': return l + r;\n        case '-': return l - r;\n        case '*': return l * r;\n        default:  return l / r;\n    }\n}\nvoid infix(Node *n, char *out) {\n    if (n->left == NULL) { strncat(out, &n->val, 1); return; }\n    strcat(out, \"(\");\n    infix(n->left, out);\n    strncat(out, &n->val, 1);\n    infix(n->right, out);\n    strcat(out, \")\");\n}\nint main() {\n    Node *root = build(\"23*54*+9-\");\n    char s[100] = \"\";\n    infix(root, s);\n    printf(\"%s = %d\\n\", s, eval(root));\n    return 0;\n}\n"}}}, {"h": "Huffman coding", "p": ["Huffman coding compresses data using variable-length binary codes. Frequent characters get short codes and rare characters get long codes. It is a greedy algorithm that builds a binary tree bottom-up.", "The codes are prefix-free: no code is the start of another code. So a bit stream can be decoded without separators. Left edge = 0, right edge = 1, and every character sits at a leaf."], "pts": ["Step 1: create a leaf node for each character with its frequency", "Step 2: put all nodes in a min-heap (priority queue) by frequency", "Step 3: remove the two smallest nodes and join them under a new node whose frequency is their sum", "Step 4: insert the new node back in the heap", "Step 5: repeat until one node remains: that is the root", "Step 6: read codes by walking from root to each leaf (left 0, right 1)"]}, {"h": "Huffman example with verification", "p": ["Frequencies: a=5, b=9, c=12, d=13, e=16, f=45 (total 100 characters). Merge order:", "(a5 + b9) = 14, then (c12 + d13) = 25, then (14 + e16) = 30, then (25 + 30) = 55, then (f45 + 55) = 100.", "Fixed 3-bit codes need 100 x 3 = 300 bits. Huffman needs 45x1 + 12x3 + 13x3 + 5x4 + 9x4 + 16x3 = 224 bits, a saving of about 25%."], "tip": "Tie-breaking between equal frequencies can give different (but equally good) codes. Total bits stays the same.", "code": {"f": "Main.java", "c": "import java.util.*;\npublic class Main {\n    static class Node {\n        char ch; int freq; Node left, right;\n        Node(char c, int f) { ch = c; freq = f; }\n    }\n    static void codes(Node n, String path) {\n        if (n.left == null) { System.out.println(n.ch + \" \" + n.freq + \" -> \" + path); return; }\n        codes(n.left, path + \"0\");\n        codes(n.right, path + \"1\");\n    }\n    public static void main(String[] args) {\n        char[] c = {'a', 'b', 'c', 'd', 'e', 'f'};\n        int[] f = {5, 9, 12, 13, 16, 45};\n        PriorityQueue<Node> pq = new PriorityQueue<>((x, y) -> x.freq - y.freq);\n        for (int i = 0; i < c.length; i++) pq.add(new Node(c[i], f[i]));\n        while (pq.size() > 1) {\n            Node a = pq.poll(), b = pq.poll();     // two smallest\n            Node p = new Node('*', a.freq + b.freq);\n            p.left = a; p.right = b;\n            pq.add(p);\n        }\n        codes(pq.poll(), \"\");\n    }\n}", "out": "f 45 -> 0\nc 12 -> 100\nd 13 -> 101\na 5 -> 1100\nb 9 -> 1101\ne 16 -> 111", "cpp": {"f": "main.cpp", "c": "#include <iostream>\n#include <queue>\n#include <vector>\n#include <string>\nusing namespace std;\n\nstruct Node {\n    char ch; int freq; Node *left, *right;\n    Node(char c, int f) : ch(c), freq(f), left(nullptr), right(nullptr) {}\n};\nstruct Cmp {   // min-heap on freq\n    bool operator()(Node* x, Node* y) const { return x->freq > y->freq; }\n};\nvoid codes(Node* n, string path) {\n    if (n->left == nullptr) { cout << n->ch << \" \" << n->freq << \" -> \" << path << endl; return; }\n    codes(n->left, path + \"0\");\n    codes(n->right, path + \"1\");\n}\nint main() {\n    char c[] = {'a', 'b', 'c', 'd', 'e', 'f'};\n    int f[] = {5, 9, 12, 13, 16, 45};\n    priority_queue<Node*, vector<Node*>, Cmp> pq;\n    for (int i = 0; i < 6; i++) pq.push(new Node(c[i], f[i]));\n    while (pq.size() > 1) {\n        Node* a = pq.top(); pq.pop();\n        Node* b = pq.top(); pq.pop();     // two smallest\n        Node* p = new Node('*', a->freq + b->freq);\n        p->left = a; p->right = b;\n        pq.push(p);\n    }\n    codes(pq.top(), \"\");\n}\n"}, "clang": {"f": "main.c", "c": "#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\n\ntypedef struct Node { char ch; int freq; struct Node *left, *right; } Node;\nNode *mk(char c, int f) { Node *n = malloc(sizeof(Node)); n->ch = c; n->freq = f; n->left = n->right = NULL; return n; }\n\nNode *pq[20]; int size = 0;                 /* simple min-priority queue (array) */\nvoid push(Node *n) { pq[size++] = n; }\nNode *popMin() {                            /* O(n) scan for the smallest frequency */\n    int m = 0;\n    for (int i = 1; i < size; i++) if (pq[i]->freq < pq[m]->freq) m = i;\n    Node *r = pq[m]; pq[m] = pq[--size];\n    return r;\n}\nvoid codes(Node *n, char *path, int len) {\n    if (n->left == NULL) { path[len] = '\\0'; printf(\"%c %d -> %s\\n\", n->ch, n->freq, path); return; }\n    path[len] = '0'; codes(n->left, path, len + 1);\n    path[len] = '1'; codes(n->right, path, len + 1);\n}\nint main() {\n    char c[] = {'a', 'b', 'c', 'd', 'e', 'f'};\n    int f[] = {5, 9, 12, 13, 16, 45};\n    for (int i = 0; i < 6; i++) push(mk(c[i], f[i]));\n    while (size > 1) {\n        Node *a = popMin();\n        Node *b = popMin();                 /* two smallest */\n        Node *p = mk('*', a->freq + b->freq);\n        p->left = a; p->right = b;\n        push(p);\n    }\n    char path[20];\n    codes(pq[0], path, 0);\n    return 0;\n}\n"}}, "viz": {"type": "btree", "nodes": ["100", "f", "55", null, null, "25", "30", null, null, null, null, "c", "d", "14", "e", null, null, null, null, null, null, null, null, null, null, null, null, "a", "b"], "caption": "Huffman tree; left edge 0, right edge 1"}}, {"h": "Heap and priority queue", "p": ["A heap is a complete binary tree where every parent is smaller (min-heap) or larger (max-heap) than its children. Being complete, it is stored in an array: children of index i are at 2i+1 and 2i+2.", "A priority queue returns the highest-priority item first. With a heap, insert (add at end, bubble up) and delete-min (move last to root, bubble down) both take O(log n); peek is O(1). Heap sort and Dijkstra's algorithm use it."], "viz": {"type": "btree", "nodes": ["10", "20", "15", "30", "40", "25"], "caption": "Min-heap; array form [10,20,15,30,40,25]"}}, {"h": "BST as dictionary, decision trees, file systems", "p": ["Binary search tree: left subtree < node < right subtree. Search, insert and delete follow one root-to-leaf path, so they cost O(h): O(log n) on a balanced tree, O(n) in the worst (skewed) case. In-order traversal prints keys in sorted order, so a BST works as a sorted dictionary (key to value) and supports range queries. Balanced versions (AVL, Red-Black) back Java's TreeMap.", "Decision tree: each internal node asks a yes/no question and each leaf gives a decision. Used in machine learning, troubleshooting guides and games.", "File system: folders are internal nodes and files are leaves. Paths like /home/user/a.txt are root-to-node paths. General file systems are n-ary trees, but the same recursive ideas (traversal, size of folder) apply."], "table": {"head": ["Structure", "Search", "Insert", "Space"], "rows": [["BST (balanced)", "O(log n)", "O(log n)", "O(n)"], ["BST (skewed)", "O(n)", "O(n)", "O(n)"], ["Heap (min element)", "O(1) peek", "O(log n)", "O(n)"], ["Sorted array", "O(log n)", "O(n)", "O(n)"]]}}], "analogy": "A binary tree is like a family tree or an office chart: each person has at most two direct reports. Depending on the job (calculating, compressing, searching, deciding) we shape and use the same tree differently.", "hinglish": "Bhai binary tree sirf theory nahi hai, kaam ki cheez hai. Expression tree se calculator chalta hai, Huffman tree se file compress hoti hai, heap se priority queue banti hai, BST se fast search hota hai. Decision tree aur folder structure bhi tree hi hain.", "mistakes": ["Popping left before right when building the expression tree (reverses a-b and a/b).", "Saying Huffman codes are unique; only the total length is optimal, codes may differ on ties.", "Assuming BST is always O(log n); a sorted input makes it a linked list with O(n).", "Confusing heap with BST: a heap has no left < right ordering."], "remember": ["Expression tree: leaves = operands, internal nodes = operators.", "Post-order evaluation: left, right, then operator.", "Postfix to tree: operand -> push; operator -> pop right first, then left, push new node.", "In-order = infix, pre-order = prefix, post-order = postfix.", "Huffman coding is greedy: merge the two smallest frequencies each time.", "Huffman codes are prefix-free; left = 0, right = 1.", "Huffman uses a min-heap; build time O(n log n).", "Example a5 b9 c12 d13 e16 f45 -> f=0, c=100, d=101, a=1100, b=1101, e=111, total 224 bits vs 300.", "Heap: complete binary tree, array storage, children at 2i+1 and 2i+2.", "Heap insert and delete are O(log n); peek is O(1).", "BST search/insert/delete: O(log n) average, O(n) worst; in-order gives sorted keys.", "Decision tree: internal node = test, leaf = outcome.", "File system is a tree: folders internal, files leaves."], "uses": ["Compilers and calculators (expression parsing)", "File compression (ZIP, JPEG, MP3 use Huffman ideas)", "Task schedulers, Dijkstra, heap sort (priority queue)", "Databases and dictionaries (search trees)", "Machine learning decision trees, OS directories"], "pros": ["Hierarchical data is natural to model", "Fast search/insert on balanced trees", "Greedy Huffman gives optimal prefix code"], "cons": ["Pointer overhead per node", "BST degrades to O(n) if unbalanced", "Huffman needs two passes or a stored tree for decoding"], "def": "A binary tree stores data in a hierarchy where every node has at most two children. Because of this shape, many problems become simple recursion problems and many searches become O(log n)."}, "u5-t1": {"tldr": "A tree is a hierarchical structure of nodes: learn root, leaf, height, depth, and the types of binary trees.", "sections": [{"h": "What is a tree?", "p": ["Arrays, stacks and queues are linear: one item after another. A tree is different because one node can lead to many nodes. A tree with n nodes always has exactly n-1 edges."], "pts": ["Hierarchical: parent-child relationship", "Exactly one path between any two nodes", "No cycle, no loop", "n nodes -> n-1 edges"], "tip": "Quick test: if a connected structure with n nodes has n-1 edges and no cycle, it is a tree.", "viz": {"type": "tree", "root": "A", "kids": ["B", "C", "D"], "caption": "A is the root, B, C, D are its children"}}, {"h": "Basic terminology", "p": ["Learn these terms first. Every tree question in exams uses them. We use the tree below (A is the root) for all examples."], "pts": ["Root: the topmost node, it has no parent (A)", "Parent: a node that has children (B is parent of D and E)", "Child: a node below another node (D and E are children of B)", "Siblings: children of the same parent (D and E; also B and C)", "Leaf (external node): node with no children (D, E, F, G)", "Internal node: node with at least one child (A, B, C)"], "code": {"f": "Main.java", "c": "public class Main {\n    static class Node {\n        char v; Node l, r;\n        Node(char v) { this.v = v; }\n    }\n    static int leaves(Node n) {\n        if (n == null) return 0;\n        if (n.l == null && n.r == null) return 1;\n        return leaves(n.l) + leaves(n.r);\n    }\n    public static void main(String[] args) {\n        Node a = new Node('A'), b = new Node('B'), c = new Node('C');\n        a.l = b; a.r = c;\n        b.l = new Node('D'); b.r = new Node('E');\n        c.l = new Node('F'); c.r = new Node('G');\n        System.out.println(\"Leaf nodes = \" + leaves(a));\n        System.out.println(\"Internal nodes = \" + (7 - leaves(a)));\n    }\n}", "out": "Leaf nodes = 4\nInternal nodes = 3", "cpp": {"f": "main.cpp", "c": "#include <iostream>\nusing namespace std;\n\nstruct Node {\n    char v; Node *l, *r;\n    Node(char v) : v(v), l(nullptr), r(nullptr) {}\n};\nint leaves(Node* n) {\n    if (n == nullptr) return 0;\n    if (n->l == nullptr && n->r == nullptr) return 1;\n    return leaves(n->l) + leaves(n->r);\n}\nint main() {\n    Node *a = new Node('A'), *b = new Node('B'), *c = new Node('C');\n    a->l = b; a->r = c;\n    b->l = new Node('D'); b->r = new Node('E');\n    c->l = new Node('F'); c->r = new Node('G');\n    cout << \"Leaf nodes = \" << leaves(a) << endl;\n    cout << \"Internal nodes = \" << (7 - leaves(a)) << endl;\n}\n"}, "clang": {"f": "main.c", "c": "#include <stdio.h>\n#include <stdlib.h>\n\ntypedef struct Node { char v; struct Node *l, *r; } Node;\nNode *mk(char v) { Node *n = malloc(sizeof(Node)); n->v = v; n->l = n->r = NULL; return n; }\n\nint leaves(Node *n) {\n    if (n == NULL) return 0;\n    if (n->l == NULL && n->r == NULL) return 1;\n    return leaves(n->l) + leaves(n->r);\n}\nint main() {\n    Node *a = mk('A'), *b = mk('B'), *c = mk('C');\n    a->l = b; a->r = c;\n    b->l = mk('D'); b->r = mk('E');\n    c->l = mk('F'); c->r = mk('G');\n    printf(\"Leaf nodes = %d\\n\", leaves(a));\n    printf(\"Internal nodes = %d\\n\", 7 - leaves(a));\n    return 0;\n}\n"}}, "viz": {"type": "btree", "nodes": ["A", "B", "C", "D", "E", "F", "G"], "caption": "Root A; leaves D, E, F, G"}}, {"h": "Degree, level, height and depth", "p": ["These four terms measure size and position. Students often mix up height and depth, so read carefully.", "Degree of a node = number of its children. Degree of a tree = the maximum degree among all its nodes. Level of a node = distance from the root plus 1 (root is at level 1; some books start at 0, so always state your convention). Depth of a node = number of edges from the root to that node. Height of a node = number of edges on the longest path from that node down to a leaf. Height of the tree = height of the root."], "warn": "Height of a single node (leaf) is 0 in the edge convention. Some textbooks count nodes, which gives 1. Write which convention you use.", "code": {"f": "Main.java", "c": "public class Main {\n    static class Node {\n        int v; Node l, r;\n        Node(int v) { this.v = v; }\n    }\n    // height in edges; empty tree = -1\n    static int height(Node n) {\n        if (n == null) return -1;\n        return 1 + Math.max(height(n.l), height(n.r));\n    }\n    static int depth(Node root, Node t, int d) {\n        if (root == null) return -1;\n        if (root == t) return d;\n        int x = depth(root.l, t, d + 1);\n        return x != -1 ? x : depth(root.r, t, d + 1);\n    }\n    public static void main(String[] args) {\n        Node a = new Node(1), b = new Node(2), c = new Node(3), e = new Node(5);\n        a.l = b; a.r = c; b.r = e;\n        System.out.println(\"Height of tree = \" + height(a));\n        System.out.println(\"Height of node 2 = \" + height(b));\n        System.out.println(\"Depth of node 5 = \" + depth(a, e, 0));\n    }\n}", "out": "Height of tree = 2\nHeight of node 2 = 1\nDepth of node 5 = 2", "cpp": {"f": "main.cpp", "c": "#include <iostream>\n#include <algorithm>\nusing namespace std;\n\nstruct Node {\n    int v; Node *l, *r;\n    Node(int v) : v(v), l(nullptr), r(nullptr) {}\n};\n// height in edges; empty tree = -1\nint height(Node* n) {\n    if (n == nullptr) return -1;\n    return 1 + max(height(n->l), height(n->r));\n}\nint depth(Node* root, Node* t, int d) {\n    if (root == nullptr) return -1;\n    if (root == t) return d;\n    int x = depth(root->l, t, d + 1);\n    return x != -1 ? x : depth(root->r, t, d + 1);\n}\nint main() {\n    Node *a = new Node(1), *b = new Node(2), *c = new Node(3), *e = new Node(5);\n    a->l = b; a->r = c; b->r = e;\n    cout << \"Height of tree = \" << height(a) << endl;\n    cout << \"Height of node 2 = \" << height(b) << endl;\n    cout << \"Depth of node 5 = \" << depth(a, e, 0) << endl;\n}\n"}, "clang": {"f": "main.c", "c": "#include <stdio.h>\n#include <stdlib.h>\n\ntypedef struct Node { int v; struct Node *l, *r; } Node;\nNode *mk(int v) { Node *n = malloc(sizeof(Node)); n->v = v; n->l = n->r = NULL; return n; }\n\n/* height in edges; empty tree = -1 */\nint height(Node *n) {\n    if (n == NULL) return -1;\n    int hl = height(n->l), hr = height(n->r);\n    return 1 + (hl > hr ? hl : hr);\n}\nint depth(Node *root, Node *t, int d) {\n    if (root == NULL) return -1;\n    if (root == t) return d;\n    int x = depth(root->l, t, d + 1);\n    return x != -1 ? x : depth(root->r, t, d + 1);\n}\nint main() {\n    Node *a = mk(1), *b = mk(2), *c = mk(3), *e = mk(5);\n    a->l = b; a->r = c; b->r = e;\n    printf(\"Height of tree = %d\\n\", height(a));\n    printf(\"Height of node 2 = %d\\n\", height(b));\n    printf(\"Depth of node 5 = %d\\n\", depth(a, e, 0));\n    return 0;\n}\n"}}, "table": {"head": ["Term", "Meaning", "Example (tree above)"], "rows": [["Degree of node", "No. of children", "deg(A)=2, deg(D)=0"], ["Degree of tree", "Max node degree", "2"], ["Depth of node", "Edges root to node", "depth(E)=2"], ["Height of node", "Edges node to deepest leaf", "height(B)=1"], ["Height of tree", "Height of root", "2"], ["Level", "Depth + 1", "D is at level 3"]]}}, {"h": "Subtree, forest, path and ancestors", "p": ["Subtree: any node together with all its descendants forms a subtree. In the tree above, B with D and E is the left subtree of A. Forest: a collection of zero or more disjoint trees. If you delete the root of a tree, the subtrees left behind form a forest.", "Path: a sequence of nodes where each next node is a child of the previous one (A-B-E). Ancestors of a node are all nodes on the path from the root to it (ancestors of E: B and A). Descendants of a node are all nodes in its subtrees."], "pts": ["Edge: link between a parent and a child", "Ancestor: any node above on the path to root", "Descendant: any node below in its subtrees", "Size of a tree: total number of nodes"], "viz": {"type": "chain", "items": ["Tree", "remove root", "Forest (many trees)"], "caption": "Removing the root of a tree gives a forest"}}, {"h": "General tree vs binary tree", "p": ["A general tree allows any number of children for each node (for example a folder with many sub-folders). A binary tree allows at most two children per node, named left child and right child. Order matters in a binary tree: a node with only a left child is different from a node with only a right child.", "Binary trees are the most studied type because they are simple, map well to arrays and give fast search when kept ordered."], "table": {"head": ["Point", "General tree", "Binary tree"], "rows": [["Max children", "Any number", "2"], ["Child names", "1st, 2nd, ... nth", "left, right"], ["Empty tree", "Usually not allowed", "Allowed"], ["Example", "File system", "Expression tree, BST"]]}}, {"h": "Types of binary trees", "p": ["Binary trees are classified by how the nodes are filled. Know all four with a picture, they are asked very often.", "Below are the other three shapes. Notice that a perfect tree is always full and complete, but a full tree need not be complete.", "A skewed tree is the worst shape: height becomes n-1, so every operation on it costs O(n)."], "pts": ["Full (strict) binary tree: every node has 0 or 2 children, never exactly 1", "Complete binary tree: all levels are full except maybe the last, and the last level is filled from the left", "Perfect binary tree: all internal nodes have 2 children and all leaves are at the same level", "Skewed binary tree: every node has only one child (left-skewed or right-skewed), looks like a linked list"], "tip": "Picture of a full tree: 1 has children 2 and 3; 3 has children 4 and 5; 2 is a leaf.", "code": {"f": "Main.java", "c": "public class Main {\n    static class Node {\n        int v; Node l, r;\n        Node(int v) { this.v = v; }\n    }\n    static boolean isFull(Node n) {\n        if (n == null) return true;\n        if (n.l == null && n.r == null) return true;\n        if (n.l != null && n.r != null) return isFull(n.l) && isFull(n.r);\n        return false;\n    }\n    public static void main(String[] args) {\n        Node a = new Node(1);\n        a.l = new Node(2); a.r = new Node(3);\n        a.r.l = new Node(4); a.r.r = new Node(5);\n        System.out.println(\"Full? \" + isFull(a));\n        a.l.l = new Node(6);              // node 2 now has only one child\n        System.out.println(\"Full after adding 6? \" + isFull(a));\n    }\n}", "out": "Full? true\nFull after adding 6? false", "cpp": {"f": "main.cpp", "c": "#include <iostream>\nusing namespace std;\n\nstruct Node {\n    int v; Node *l, *r;\n    Node(int v) : v(v), l(nullptr), r(nullptr) {}\n};\nbool isFull(Node* n) {\n    if (n == nullptr) return true;\n    if (n->l == nullptr && n->r == nullptr) return true;\n    if (n->l != nullptr && n->r != nullptr) return isFull(n->l) && isFull(n->r);\n    return false;\n}\nint main() {\n    Node* a = new Node(1);\n    a->l = new Node(2); a->r = new Node(3);\n    a->r->l = new Node(4); a->r->r = new Node(5);\n    cout << boolalpha << \"Full? \" << isFull(a) << endl;\n    a->l->l = new Node(6);              // node 2 now has only one child\n    cout << \"Full after adding 6? \" << isFull(a) << endl;\n}\n"}, "clang": {"f": "main.c", "c": "#include <stdio.h>\n#include <stdlib.h>\n\ntypedef struct Node { int v; struct Node *l, *r; } Node;\nNode *mk(int v) { Node *n = malloc(sizeof(Node)); n->v = v; n->l = n->r = NULL; return n; }\n\nint isFull(Node *n) {\n    if (n == NULL) return 1;\n    if (n->l == NULL && n->r == NULL) return 1;\n    if (n->l != NULL && n->r != NULL) return isFull(n->l) && isFull(n->r);\n    return 0;\n}\nint main() {\n    Node *a = mk(1);\n    a->l = mk(2); a->r = mk(3);\n    a->r->l = mk(4); a->r->r = mk(5);\n    printf(\"Full? %s\\n\", isFull(a) ? \"true\" : \"false\");\n    a->l->l = mk(6);              /* node 2 now has only one child */\n    printf(\"Full after adding 6? %s\\n\", isFull(a) ? \"true\" : \"false\");\n    return 0;\n}\n"}}, "table": {"head": ["Type", "Rule", "Example shape"], "rows": [["Full", "0 or 2 children", "1 -> 2,3 ; 3 -> 4,5"], ["Complete", "Filled left to right, level by level", "Heap-like array shape"], ["Perfect", "All leaves same level", "7 nodes in 3 levels"], ["Skewed", "One child per node", "Like a linked list"]]}}, {"h": "Important formulas (binary tree)", "p": ["These counting results are standard exam questions. Take root at level 1 and height h in levels."], "pts": ["Maximum nodes at level i = 2^(i-1)", "Maximum nodes in a tree of height h (levels) = 2^h - 1", "Minimum nodes in a tree with h levels = h (skewed tree)", "If n0 = leaves and n2 = nodes with 2 children, then n0 = n2 + 1", "Minimum height (levels) for n nodes = ceil(log2(n+1))", "A tree with n nodes has n-1 edges"], "tip": "Example: a binary tree has 20 leaves. Then nodes with two children = 19.", "table": {"head": ["Levels (h)", "Max nodes 2^h-1", "Max leaves 2^(h-1)"], "rows": [["1", "1", "1"], ["2", "3", "2"], ["3", "7", "4"], ["4", "15", "8"]]}}, {"h": "Applications, pros and cons", "p": ["Trees appear wherever data has levels or needs quick ordered search: folders in an operating system, the DOM of a web page, syntax trees in compilers, indexes in databases and heaps in priority queues.", "The main trade-off: a balanced tree gives O(log n) operations, but a skewed tree falls back to O(n), and each node needs extra pointers."], "pts": ["Pro: models hierarchy naturally", "Pro: fast search when balanced", "Con: more complex than linear structures", "Con: skewed trees are as slow as a linked list"]}], "analogy": "A family tree or a company chart: the CEO is the root, managers are internal nodes, and employees with no team are leaves. Everyone has exactly one boss.", "hinglish": "Bhai tree ek hierarchical structure hai jisme ek root hota hai aur uske neeche children. Jis node ke koi child nahi wo leaf hai. Height matlab root se sabse door leaf tak edges, depth matlab root se us node tak edges. Binary tree me max 2 bache (left, right) hote hain, aur full, complete, perfect, skewed uske main types hain.", "mistakes": ["Mixing up height and depth: depth is counted from the root downwards, height from the node downwards to a leaf.", "Saying a full tree is the same as a perfect tree: full only needs 0 or 2 children.", "Forgetting to state whether root is level 0 or level 1.", "Calling a node with one child a leaf: a leaf has zero children."], "remember": ["Tree: non-linear hierarchical data structure; n nodes, n-1 edges, no cycles.", "Root: top node with no parent; leaf: node with no child.", "Siblings: nodes with the same parent.", "Degree of node = number of children; degree of tree = max degree.", "Depth of node = edges from root to node; height of node = edges to deepest leaf below it.", "Level of root is 1 (or 0, state convention); level = depth + 1.", "Subtree: node with all its descendants; forest: set of disjoint trees.", "Binary tree: each node has at most 2 children (left and right).", "Full: 0 or 2 children; complete: filled level by level from left; perfect: all leaves at same level.", "Skewed: only left or only right children; height = n-1.", "Max nodes at level i = 2^(i-1); max nodes in height h = 2^h - 1.", "Leaves n0 = nodes with degree 2 (n2) + 1."], "uses": ["File systems and folder structures", "HTML/XML DOM and organization charts", "Expression parsing in compilers", "Searching and indexing: BST, heaps, B-trees in databases", "Decision making: game trees, decision trees in AI"], "pros": ["Natural way to model hierarchy", "Fast search, insert and delete when balanced (O(log n))", "Flexible size, grows dynamically"], "cons": ["Non-linear, so harder to implement than arrays and lists", "Skewed shape degrades to O(n)", "Extra memory for child pointers"], "def": "A tree is a non-linear, hierarchical data structure made of nodes joined by edges. It has one special top node called the root. Every other node has exactly one parent, and there are no cycles."}, "u5-t2": {"tldr": "Store a binary tree with arrays or nodes, and visit it in preorder, inorder, postorder or level order.", "sections": [{"h": "Array (sequential) representation", "p": ["Store the nodes level by level in an array. If the root is at index 1, then for a node at index i: left child is at 2i, right child is at 2i+1 and parent is at i/2 (integer division). With 0-based indexing the formulas are 2i+1, 2i+2 and (i-1)/2.", "Missing nodes leave empty slots. A complete tree wastes no space, but a skewed tree of n nodes needs an array of size 2^n - 1."], "pts": ["Pro: no pointers, fast access to parent and children", "Con: wastes memory for sparse trees, size fixed, insertion/deletion costly"], "code": {"f": "Main.java", "c": "public class Main {\n    public static void main(String[] args) {\n        // 1-indexed array, 0 means empty\n        int[] t = {0, 1, 2, 3, 4, 5, 0, 6};\n        for (int i = 1; i < t.length; i++) {\n            if (t[i] == 0) continue;\n            int l = 2 * i, r = 2 * i + 1;\n            System.out.println(\"node \" + t[i] + \": left=\" + (l < t.length ? t[l] : 0)\n                + \" right=\" + (r < t.length ? t[r] : 0) + \" parent=\" + (i > 1 ? t[i / 2] : 0));\n        }\n    }\n}", "out": "node 1: left=2 right=3 parent=0\nnode 2: left=4 right=5 parent=1\nnode 3: left=0 right=6 parent=1\nnode 4: left=0 right=0 parent=2\nnode 5: left=0 right=0 parent=2\nnode 6: left=0 right=0 parent=3", "cpp": {"f": "main.cpp", "c": "#include <iostream>\n#include <vector>\nusing namespace std;\n\nint main() {\n    // 1-indexed array, 0 means empty\n    vector<int> t = {0, 1, 2, 3, 4, 5, 0, 6};\n    int n = t.size();\n    for (int i = 1; i < n; i++) {\n        if (t[i] == 0) continue;\n        int l = 2 * i, r = 2 * i + 1;\n        cout << \"node \" << t[i] << \": left=\" << (l < n ? t[l] : 0)\n             << \" right=\" << (r < n ? t[r] : 0) << \" parent=\" << (i > 1 ? t[i / 2] : 0) << endl;\n    }\n}\n"}, "clang": {"f": "main.c", "c": "#include <stdio.h>\n\nint main() {\n    /* 1-indexed array, 0 means empty */\n    int t[] = {0, 1, 2, 3, 4, 5, 0, 6};\n    int n = 8;\n    for (int i = 1; i < n; i++) {\n        if (t[i] == 0) continue;\n        int l = 2 * i, r = 2 * i + 1;\n        printf(\"node %d: left=%d right=%d parent=%d\\n\", t[i], l < n ? t[l] : 0, r < n ? t[r] : 0, i > 1 ? t[i / 2] : 0);\n    }\n    return 0;\n}\n"}}, "viz": {"type": "cells", "items": ["-", "1", "2", "3", "4", "5", "-", "6"], "labels": ["0", "1", "2", "3", "4", "5", "6", "7"], "hl": [1], "caption": "Array for the sample tree (index 0 unused, index 6 empty)"}}, {"h": "Linked representation", "p": ["Each node is an object with three fields: data, a pointer to the left child and a pointer to the right child. A missing child is null. The tree is accessed through a pointer to the root. Memory is used only for nodes that exist, and the tree can grow freely."], "pts": ["Pro: dynamic size, easy insert/delete, no wasted slots", "Con: extra memory for 2 pointers per node, no direct index access"], "code": {"f": "Main.java", "c": "public class Main {\n    static class Node {\n        int data; Node left, right;\n        Node(int data) { this.data = data; }   // left, right = null\n    }\n    public static void main(String[] args) {\n        Node root = new Node(1);\n        root.left = new Node(2);\n        root.right = new Node(3);\n        root.left.left = new Node(4);\n        System.out.println(root.data + \" has children \" + root.left.data + \" and \" + root.right.data);\n        System.out.println(\"Left of 4 is \" + root.left.left.left);\n    }\n}", "out": "1 has children 2 and 3\nLeft of 4 is null", "cpp": {"f": "main.cpp", "c": "#include <iostream>\nusing namespace std;\n\nstruct Node {\n    int data; Node *left, *right;\n    Node(int data) : data(data), left(nullptr), right(nullptr) {}   // left, right = null\n};\nint main() {\n    Node* root = new Node(1);\n    root->left = new Node(2);\n    root->right = new Node(3);\n    root->left->left = new Node(4);\n    cout << root->data << \" has children \" << root->left->data << \" and \" << root->right->data << endl;\n    cout << \"Left of 4 is \" << (root->left->left->left == nullptr ? \"null\" : \"something\") << endl;\n}\n"}, "clang": {"f": "main.c", "c": "#include <stdio.h>\n#include <stdlib.h>\n\nstruct Node { int data; struct Node *left, *right; };\nstruct Node *mk(int d) { struct Node *n = malloc(sizeof *n); n->data = d; n->left = n->right = NULL; return n; }\n\nint main() {\n    struct Node *root = mk(1);\n    root->left = mk(2);\n    root->right = mk(3);\n    root->left->left = mk(4);\n    printf(\"%d has children %d and %d\\n\", root->data, root->left->data, root->right->data);\n    printf(\"Left of 4 is %s\\n\", root->left->left->left == NULL ? \"null\" : \"something\");\n    return 0;\n}\n"}}, "table": {"head": ["Node"], "rows": [["data: 1"], ["left -> node 2"], ["right -> node 3"]]}}, {"h": "Traversal overview and complexity", "p": ["Traversal means visiting every node exactly once. Arrays and lists have one natural order, but a tree has many. The three depth-first orders differ only in when the root (N) is visited relative to the left (L) and right (R) subtrees. Level order is the breadth-first order.", "Each depth-first traversal is defined recursively: to traverse a tree, apply the same rule on its left and right subtrees.", "The sample tree: 1 is root, left child 2 (children 4, 5), right child 3 (right child 6)."], "pts": ["Every node is visited once with O(1) work, so time is O(n) for all four", "Depth-first space = recursion stack O(h): O(log n) balanced, O(n) skewed", "Level order space = queue O(w), up to O(n)"], "tip": "For a balanced tree h = log n, for a skewed tree h = n.", "table": {"head": ["Traversal", "Order", "Result", "Time / Space"], "rows": [["Preorder", "N L R", "1 2 4 5 3 6", "O(n) / O(h)"], ["Inorder", "L N R", "4 2 5 1 3 6", "O(n) / O(h)"], ["Postorder", "L R N", "4 5 2 6 3 1", "O(n) / O(h)"], ["Level order", "level by level", "1 2 3 4 5 6", "O(n) / O(w)"]]}}, {"h": "Preorder traversal (Root, Left, Right)", "p": ["Visit the root first, then the whole left subtree, then the whole right subtree. Preorder is used to copy a tree and to get the prefix form of an expression."], "pts": ["Step 1: if node is null, return", "Step 2: visit (print) the node", "Step 3: preorder(left subtree)", "Step 4: preorder(right subtree)"], "code": {"f": "Main.java", "c": "public class Main {\n    static class Node {\n        int v; Node l, r;\n        Node(int v) { this.v = v; }\n    }\n    static Node build() {\n        Node a = new Node(1);\n        a.l = new Node(2); a.r = new Node(3);\n        a.l.l = new Node(4); a.l.r = new Node(5);\n        a.r.r = new Node(6);\n        return a;\n    }\n    static void preorder(Node n) {\n        if (n == null) return;\n        System.out.print(n.v + \" \");\n        preorder(n.l);\n        preorder(n.r);\n    }\n    public static void main(String[] args) {\n        preorder(build());\n    }\n}", "out": "1 2 4 5 3 6 ", "cpp": {"f": "main.cpp", "c": "#include <iostream>\nusing namespace std;\n\nstruct Node {\n    int v; Node *l, *r;\n    Node(int v) : v(v), l(nullptr), r(nullptr) {}\n};\nNode* build() {\n    Node* a = new Node(1);\n    a->l = new Node(2); a->r = new Node(3);\n    a->l->l = new Node(4); a->l->r = new Node(5);\n    a->r->r = new Node(6);\n    return a;\n}\nvoid preorder(Node* n) {\n    if (n == nullptr) return;\n    cout << n->v << \" \";\n    preorder(n->l);\n    preorder(n->r);\n}\nint main() {\n    preorder(build());\n}\n"}, "clang": {"f": "main.c", "c": "#include <stdio.h>\n#include <stdlib.h>\n\ntypedef struct Node { int v; struct Node *l, *r; } Node;\nNode *mk(int v) { Node *n = malloc(sizeof(Node)); n->v = v; n->l = n->r = NULL; return n; }\nNode *build() {\n    Node *a = mk(1);\n    a->l = mk(2); a->r = mk(3);\n    a->l->l = mk(4); a->l->r = mk(5);\n    a->r->r = mk(6);\n    return a;\n}\nvoid preorder(Node *n) {\n    if (n == NULL) return;\n    printf(\"%d \", n->v);\n    preorder(n->l);\n    preorder(n->r);\n}\nint main() {\n    preorder(build());\n    return 0;\n}\n"}}, "table": {"head": ["Step", "What happens"], "rows": [["1. Visit 1", "root, print 1"], ["2. Go left: 2", "print 2, then left 4"], ["3. Visit 4, 5", "leaf 4, then right child 5"], ["4. Go right: 3", "print 3, then right child 6"]]}}, {"h": "Inorder traversal (Left, Root, Right)", "p": ["Go fully left, visit the node, then go right. For a binary search tree, inorder gives the keys in sorted order. Inorder is also what you read from an expression tree to get the infix form."], "pts": ["Step 1: if node is null, return", "Step 2: inorder(left subtree)", "Step 3: visit (print) the node", "Step 4: inorder(right subtree)"], "code": {"f": "Main.java", "c": "public class Main {\n    static class Node {\n        int v; Node l, r;\n        Node(int v) { this.v = v; }\n    }\n    static Node build() {\n        Node a = new Node(1);\n        a.l = new Node(2); a.r = new Node(3);\n        a.l.l = new Node(4); a.l.r = new Node(5);\n        a.r.r = new Node(6);\n        return a;\n    }\n    static void inorder(Node n) {\n        if (n == null) return;\n        inorder(n.l);\n        System.out.print(n.v + \" \");\n        inorder(n.r);\n    }\n    public static void main(String[] args) {\n        inorder(build());\n    }\n}", "out": "4 2 5 1 3 6 ", "cpp": {"f": "main.cpp", "c": "#include <iostream>\nusing namespace std;\n\nstruct Node {\n    int v; Node *l, *r;\n    Node(int v) : v(v), l(nullptr), r(nullptr) {}\n};\nNode* build() {\n    Node* a = new Node(1);\n    a->l = new Node(2); a->r = new Node(3);\n    a->l->l = new Node(4); a->l->r = new Node(5);\n    a->r->r = new Node(6);\n    return a;\n}\nvoid inorder(Node* n) {\n    if (n == nullptr) return;\n    inorder(n->l);\n    cout << n->v << \" \";\n    inorder(n->r);\n}\nint main() {\n    inorder(build());\n}\n"}, "clang": {"f": "main.c", "c": "#include <stdio.h>\n#include <stdlib.h>\n\ntypedef struct Node { int v; struct Node *l, *r; } Node;\nNode *mk(int v) { Node *n = malloc(sizeof(Node)); n->v = v; n->l = n->r = NULL; return n; }\nNode *build() {\n    Node *a = mk(1);\n    a->l = mk(2); a->r = mk(3);\n    a->l->l = mk(4); a->l->r = mk(5);\n    a->r->r = mk(6);\n    return a;\n}\nvoid inorder(Node *n) {\n    if (n == NULL) return;\n    inorder(n->l);\n    printf(\"%d \", n->v);\n    inorder(n->r);\n}\nint main() {\n    inorder(build());\n    return 0;\n}\n"}}, "table": {"head": ["Step", "What happens"], "rows": [["1. Reach leftmost: 4", "1 -> 2 -> 4, nothing left, print 4"], ["2. Back to 2", "print 2, then right child 5"], ["3. Back to 1", "print 1, then go right"], ["4. Node 3", "left empty, print 3, then 6"]]}}, {"h": "Postorder traversal (Left, Right, Root)", "p": ["Visit both subtrees first and the root last. Every node appears after its children, so postorder is used to delete a tree safely and to evaluate an expression tree (postfix form)."], "pts": ["Step 1: if node is null, return", "Step 2: postorder(left subtree)", "Step 3: postorder(right subtree)", "Step 4: visit (print) the node"], "code": {"f": "Main.java", "c": "public class Main {\n    static class Node {\n        int v; Node l, r;\n        Node(int v) { this.v = v; }\n    }\n    static Node build() {\n        Node a = new Node(1);\n        a.l = new Node(2); a.r = new Node(3);\n        a.l.l = new Node(4); a.l.r = new Node(5);\n        a.r.r = new Node(6);\n        return a;\n    }\n    static void postorder(Node n) {\n        if (n == null) return;\n        postorder(n.l);\n        postorder(n.r);\n        System.out.print(n.v + \" \");\n    }\n    public static void main(String[] args) {\n        postorder(build());\n    }\n}", "out": "4 5 2 6 3 1 ", "cpp": {"f": "main.cpp", "c": "#include <iostream>\nusing namespace std;\n\nstruct Node {\n    int v; Node *l, *r;\n    Node(int v) : v(v), l(nullptr), r(nullptr) {}\n};\nNode* build() {\n    Node* a = new Node(1);\n    a->l = new Node(2); a->r = new Node(3);\n    a->l->l = new Node(4); a->l->r = new Node(5);\n    a->r->r = new Node(6);\n    return a;\n}\nvoid postorder(Node* n) {\n    if (n == nullptr) return;\n    postorder(n->l);\n    postorder(n->r);\n    cout << n->v << \" \";\n}\nint main() {\n    postorder(build());\n}\n"}, "clang": {"f": "main.c", "c": "#include <stdio.h>\n#include <stdlib.h>\n\ntypedef struct Node { int v; struct Node *l, *r; } Node;\nNode *mk(int v) { Node *n = malloc(sizeof(Node)); n->v = v; n->l = n->r = NULL; return n; }\nNode *build() {\n    Node *a = mk(1);\n    a->l = mk(2); a->r = mk(3);\n    a->l->l = mk(4); a->l->r = mk(5);\n    a->r->r = mk(6);\n    return a;\n}\nvoid postorder(Node *n) {\n    if (n == NULL) return;\n    postorder(n->l);\n    postorder(n->r);\n    printf(\"%d \", n->v);\n}\nint main() {\n    postorder(build());\n    return 0;\n}\n"}}, "table": {"head": ["Step", "What happens"], "rows": [["1. Left of 2", "print 4, then 5"], ["2. Finish 2", "both children done, print 2"], ["3. Right of 1", "3 -> 6: print 6, then 3"], ["4. Finally root", "print 1"]]}}, {"h": "Level order traversal (Breadth First)", "p": ["Visit nodes level by level, left to right. A queue is used instead of recursion. Put the root in the queue. Repeatedly remove the front node, visit it and add its children at the rear."], "pts": ["Step 1: create an empty queue and add root", "Step 2: while queue is not empty, remove front node", "Step 3: visit the node", "Step 4: add its left child, then its right child, if they exist"], "code": {"f": "Main.java", "c": "public class Main {\n    static class Node {\n        int v; Node l, r;\n        Node(int v) { this.v = v; }\n    }\n    static Node build() {\n        Node a = new Node(1);\n        a.l = new Node(2); a.r = new Node(3);\n        a.l.l = new Node(4); a.l.r = new Node(5);\n        a.r.r = new Node(6);\n        return a;\n    }\n    static void levelOrder(Node root) {\n        Node[] q = new Node[100];          // simple array queue\n        int front = 0, rear = 0;\n        if (root != null) q[rear++] = root;\n        while (front < rear) {\n            Node n = q[front++];           // dequeue\n            System.out.print(n.v + \" \");\n            if (n.l != null) q[rear++] = n.l;   // enqueue children\n            if (n.r != null) q[rear++] = n.r;\n        }\n    }\n    public static void main(String[] args) {\n        levelOrder(build());\n    }\n}", "out": "1 2 3 4 5 6 ", "cpp": {"f": "main.cpp", "c": "#include <iostream>\nusing namespace std;\n\nstruct Node {\n    int v; Node *l, *r;\n    Node(int v) : v(v), l(nullptr), r(nullptr) {}\n};\nNode* build() {\n    Node* a = new Node(1);\n    a->l = new Node(2); a->r = new Node(3);\n    a->l->l = new Node(4); a->l->r = new Node(5);\n    a->r->r = new Node(6);\n    return a;\n}\nvoid levelOrder(Node* root) {\n    Node* q[100];                      // simple array queue\n    int front = 0, rear = 0;\n    if (root != nullptr) q[rear++] = root;\n    while (front < rear) {\n        Node* n = q[front++];          // dequeue\n        cout << n->v << \" \";\n        if (n->l != nullptr) q[rear++] = n->l;   // enqueue children\n        if (n->r != nullptr) q[rear++] = n->r;\n    }\n}\nint main() {\n    levelOrder(build());\n}\n"}, "clang": {"f": "main.c", "c": "#include <stdio.h>\n#include <stdlib.h>\n\ntypedef struct Node { int v; struct Node *l, *r; } Node;\nNode *mk(int v) { Node *n = malloc(sizeof(Node)); n->v = v; n->l = n->r = NULL; return n; }\nNode *build() {\n    Node *a = mk(1);\n    a->l = mk(2); a->r = mk(3);\n    a->l->l = mk(4); a->l->r = mk(5);\n    a->r->r = mk(6);\n    return a;\n}\nvoid levelOrder(Node *root) {\n    Node *q[100];                      /* simple array queue */\n    int front = 0, rear = 0;\n    if (root != NULL) q[rear++] = root;\n    while (front < rear) {\n        Node *n = q[front++];          /* dequeue */\n        printf(\"%d \", n->v);\n        if (n->l != NULL) q[rear++] = n->l;   /* enqueue children */\n        if (n->r != NULL) q[rear++] = n->r;\n    }\n}\nint main() {\n    levelOrder(build());\n    return 0;\n}\n"}}, "table": {"head": ["Step", "Queue (front to rear)", "Visited"], "rows": [["1", "1", "-"], ["2", "2 3", "1"], ["3", "3 4 5", "1 2"], ["4", "4 5 6", "1 2 3"], ["5", "5 6", "1 2 3 4"], ["6", "6", "1 2 3 4 5"], ["7", "empty", "1 2 3 4 5 6"]]}}, {"h": "Constructing a tree from traversals", "p": ["One traversal alone cannot rebuild a tree. But inorder together with either preorder or postorder gives a unique tree (if keys are distinct). Preorder + postorder is not enough in general.", "Idea with preorder + inorder: the first preorder element is the root. Find it in inorder: everything to its left is the left subtree, everything to its right is the right subtree. Repeat recursively. For inorder + postorder, the root is the last postorder element."], "pts": ["Step 1: root = next unused element of preorder", "Step 2: locate root in inorder to split left and right parts", "Step 3: build left subtree from the left part", "Step 4: build right subtree from the right part", "Time O(n^2) with linear search, O(n) with a hash map; space O(n)"], "warn": "Preorder + postorder cannot decide between a left-only and a right-only child, so the tree is not unique.", "code": {"f": "Main.java", "c": "public class Main {\n    static class Node {\n        int v; Node l, r;\n        Node(int v) { this.v = v; }\n    }\n    static int pi = 0;\n    // build tree from preorder + inorder (distinct keys)\n    static Node build(int[] pre, int[] in, int lo, int hi) {\n        if (lo > hi) return null;\n        Node root = new Node(pre[pi++]);\n        int k = lo;\n        while (in[k] != root.v) k++;           // find root in inorder\n        root.l = build(pre, in, lo, k - 1);\n        root.r = build(pre, in, k + 1, hi);\n        return root;\n    }\n    static void post(Node n) {\n        if (n == null) return;\n        post(n.l); post(n.r);\n        System.out.print(n.v + \" \");\n    }\n    public static void main(String[] args) {\n        int[] pre = {1, 2, 4, 5, 3, 6};\n        int[] in = {4, 2, 5, 1, 3, 6};\n        post(build(pre, in, 0, 5));\n    }\n}", "out": "4 5 2 6 3 1 ", "cpp": {"f": "main.cpp", "c": "#include <iostream>\n#include <vector>\nusing namespace std;\n\nstruct Node {\n    int v; Node *l, *r;\n    Node(int v) : v(v), l(nullptr), r(nullptr) {}\n};\nint pi = 0;\n// build tree from preorder + inorder (distinct keys)\nNode* build(vector<int>& pre, vector<int>& in, int lo, int hi) {\n    if (lo > hi) return nullptr;\n    Node* root = new Node(pre[pi++]);\n    int k = lo;\n    while (in[k] != root->v) k++;          // find root in inorder\n    root->l = build(pre, in, lo, k - 1);\n    root->r = build(pre, in, k + 1, hi);\n    return root;\n}\nvoid post(Node* n) {\n    if (n == nullptr) return;\n    post(n->l); post(n->r);\n    cout << n->v << \" \";\n}\nint main() {\n    vector<int> pre = {1, 2, 4, 5, 3, 6};\n    vector<int> in = {4, 2, 5, 1, 3, 6};\n    post(build(pre, in, 0, 5));\n}\n"}, "clang": {"f": "main.c", "c": "#include <stdio.h>\n#include <stdlib.h>\n\ntypedef struct Node { int v; struct Node *l, *r; } Node;\nNode *mk(int v) { Node *n = malloc(sizeof(Node)); n->v = v; n->l = n->r = NULL; return n; }\n\nint pi = 0;\n/* build tree from preorder + inorder (distinct keys) */\nNode *build(int pre[], int in[], int lo, int hi) {\n    if (lo > hi) return NULL;\n    Node *root = mk(pre[pi++]);\n    int k = lo;\n    while (in[k] != root->v) k++;          /* find root in inorder */\n    root->l = build(pre, in, lo, k - 1);\n    root->r = build(pre, in, k + 1, hi);\n    return root;\n}\nvoid post(Node *n) {\n    if (n == NULL) return;\n    post(n->l); post(n->r);\n    printf(\"%d \", n->v);\n}\nint main() {\n    int pre[] = {1, 2, 4, 5, 3, 6};\n    int in[] = {4, 2, 5, 1, 3, 6};\n    post(build(pre, in, 0, 5));\n    return 0;\n}\n"}}, "table": {"head": ["Step", "What happens"], "rows": [["1. Preorder gives root", "1; inorder splits into [4 2 5] and [3 6]"], ["2. Left part [4 2 5]", "next preorder is 2, so 4 is left, 5 is right"], ["3. Right part [3 6]", "next preorder is 3, so 6 is right child"]]}}], "analogy": "Visiting a building with floors and rooms: going deep into one wing before the other is depth-first (pre, in, post), while checking every room floor by floor is level order.", "hinglish": "Bhai binary tree ko array me ya linked nodes me store kar sakte hain. Traversal ke 4 tarike: preorder (root pehle), inorder (root beech me), postorder (root last) aur level order (queue se, floor by floor). Sab O(n) time lete hain, kyunki har node ek baar hi visit hota hai.", "mistakes": ["Writing the traversal name by the position of the root: pre = root first, in = root middle, post = root last.", "Forgetting the null check, which causes NullPointerException.", "Using a stack instead of a queue for level order.", "Saying preorder + postorder uniquely builds a tree."], "remember": ["Array (1-indexed): left = 2i, right = 2i+1, parent = i/2.", "0-indexed: left = 2i+1, right = 2i+2, parent = (i-1)/2.", "Skewed tree of n nodes needs array size 2^n - 1 in array form.", "Linked node: data, left pointer, right pointer.", "Preorder: Root, Left, Right.", "Inorder: Left, Root, Right (sorted for BST).", "Postorder: Left, Right, Root.", "Level order: queue, visit level by level, left to right.", "All traversals: time O(n); depth-first space O(h); level order space O(width).", "Sample tree: pre 1 2 4 5 3 6, in 4 2 5 1 3 6, post 4 5 2 6 3 1.", "Inorder + preorder or inorder + postorder gives a unique tree.", "Preorder + postorder alone does not give a unique tree."], "uses": ["Preorder: copy a tree, prefix expression", "Inorder: sorted output from a BST", "Postorder: delete a tree, evaluate postfix expressions", "Level order: shortest path in trees, BFS, printing by levels"], "pros": ["Recursive code is very short", "All orders run in O(n)", "Level order finds nodes closest to the root first"], "cons": ["Recursion can overflow the stack for deep, skewed trees", "Level order needs O(width) extra memory", "Array representation wastes space for sparse trees"], "def": "A binary tree can be stored in two ways: sequential (array) and linked. The sample tree below (1 is the root; 2 and 3 its children; 4, 5 under 2; 6 under 3) is used in every example of this topic."}, "u5-t3": {"tldr": "A threaded binary tree reuses the n+1 null pointers as threads to inorder neighbours, so inorder needs no stack.", "sections": [{"h": "Why do we need threads?", "p": ["A threaded binary tree reuses these null pointers. A null right pointer is made to point to the inorder successor, and a null left pointer to the inorder predecessor. These special pointers are called threads.", "With threads we can do inorder traversal without recursion and without a stack, because from any node we can jump directly to the next node."], "tip": "Remember: n+1 null links in any binary tree with n nodes.", "table": {"head": ["Item", "Count (n nodes)"], "rows": [["Total pointer fields", "2n"], ["Pointers to real children", "n-1"], ["NULL pointers", "2n - (n-1) = n+1"]]}}, {"h": "Types of threading", "p": ["One-way (single) threaded: only the null right pointers are threaded (to the inorder successor), or only null left pointers (to the predecessor). The common choice is the right-threaded tree.", "Two-way (double) threaded: both null left pointers (to inorder predecessor) and null right pointers (to inorder successor) are threaded. Then the tree can be walked forward and backward in inorder.", "Threads can also be made for preorder or postorder, but inorder threading is the syllabus standard."], "table": {"head": ["Point", "One-way threaded", "Two-way threaded"], "rows": [["Null right ptr", "-> inorder successor", "-> inorder successor"], ["Null left ptr", "stays null", "-> inorder predecessor"], ["Traversal", "forward only", "forward and backward"], ["Extra flags", "1 per node (rthread)", "2 per node"]]}}, {"h": "Node structure", "p": ["A real pointer and a thread are both stored in the same field, so we need a flag to tell which one it is. A flag (boolean) of true means 'this pointer is a thread'.", "Node of a two-way threaded tree: left pointer, left-thread flag, data, right-thread flag, right pointer."], "table": {"head": ["Threaded node"], "rows": [["lthread (boolean)"], ["left pointer"], ["data"], ["right pointer"], ["rthread (boolean)"]]}}, {"h": "One-way threaded tree: inorder traversal without stack", "p": ["Take the sample tree (1; children 2, 3; 2 has children 4, 5; 3 has right child 6). Inorder is 4 2 5 1 3 6. Null right pointers are: 4 (thread to 2), 5 (thread to 1) and 6 (last node, thread stays null).", "Algorithm: go to the leftmost node and print it. Then if its right pointer is a thread, jump along it. Otherwise move to the leftmost node of its right subtree. Repeat until null."], "pts": ["Step 1: cur = leftmost node of the tree", "Step 2: print cur.data", "Step 3: if cur.rthread is true, cur = cur.right", "Step 4: else cur = leftmost(cur.right)", "Step 5: repeat until cur is null"], "code": {"f": "Main.java", "c": "public class Main {\n    static class Node {\n        int data; Node left, right; boolean rthread;\n        Node(int d) { data = d; }\n    }\n    static Node leftmost(Node n) {\n        while (n != null && n.left != null) n = n.left;\n        return n;\n    }\n    // inorder traversal: no recursion, no stack\n    static void inorder(Node root) {\n        Node cur = leftmost(root);\n        while (cur != null) {\n            System.out.print(cur.data + \" \");\n            if (cur.rthread) cur = cur.right;        // follow thread\n            else cur = leftmost(cur.right);          // go to leftmost of right subtree\n        }\n    }\n    public static void main(String[] args) {\n        Node n1 = new Node(1), n2 = new Node(2), n3 = new Node(3);\n        Node n4 = new Node(4), n5 = new Node(5), n6 = new Node(6);\n        n1.left = n2; n1.right = n3; n2.left = n4; n2.right = n5; n3.right = n6;\n        n4.right = n2; n4.rthread = true;   // 4 -> successor 2\n        n5.right = n1; n5.rthread = true;   // 5 -> successor 1\n        n6.rthread = true;                  // 6 is last: thread is null\n        inorder(n1);\n    }\n}", "out": "4 2 5 1 3 6 ", "cpp": {"f": "main.cpp", "c": "#include <iostream>\nusing namespace std;\n\nstruct Node {\n    int data; Node *left, *right; bool rthread;\n    Node(int d) : data(d), left(nullptr), right(nullptr), rthread(false) {}\n};\nNode* leftmost(Node* n) {\n    while (n != nullptr && n->left != nullptr) n = n->left;\n    return n;\n}\n// inorder traversal: no recursion, no stack\nvoid inorder(Node* root) {\n    Node* cur = leftmost(root);\n    while (cur != nullptr) {\n        cout << cur->data << \" \";\n        if (cur->rthread) cur = cur->right;        // follow thread\n        else cur = leftmost(cur->right);           // go to leftmost of right subtree\n    }\n}\nint main() {\n    Node *n1 = new Node(1), *n2 = new Node(2), *n3 = new Node(3);\n    Node *n4 = new Node(4), *n5 = new Node(5), *n6 = new Node(6);\n    n1->left = n2; n1->right = n3; n2->left = n4; n2->right = n5; n3->right = n6;\n    n4->right = n2; n4->rthread = true;   // 4 -> successor 2\n    n5->right = n1; n5->rthread = true;   // 5 -> successor 1\n    n6->rthread = true;                   // 6 is last: thread is null\n    inorder(n1);\n}\n"}, "clang": {"f": "main.c", "c": "#include <stdio.h>\n#include <stdlib.h>\n\ntypedef struct Node { int data; struct Node *left, *right; int rthread; } Node;\nNode *mk(int d) { Node *n = malloc(sizeof(Node)); n->data = d; n->left = n->right = NULL; n->rthread = 0; return n; }\n\nNode *leftmost(Node *n) {\n    while (n != NULL && n->left != NULL) n = n->left;\n    return n;\n}\n/* inorder traversal: no recursion, no stack */\nvoid inorder(Node *root) {\n    Node *cur = leftmost(root);\n    while (cur != NULL) {\n        printf(\"%d \", cur->data);\n        if (cur->rthread) cur = cur->right;        /* follow thread */\n        else cur = leftmost(cur->right);           /* go to leftmost of right subtree */\n    }\n}\nint main() {\n    Node *n1 = mk(1), *n2 = mk(2), *n3 = mk(3), *n4 = mk(4), *n5 = mk(5), *n6 = mk(6);\n    n1->left = n2; n1->right = n3; n2->left = n4; n2->right = n5; n3->right = n6;\n    n4->right = n2; n4->rthread = 1;   /* 4 -> successor 2 */\n    n5->right = n1; n5->rthread = 1;   /* 5 -> successor 1 */\n    n6->rthread = 1;                   /* 6 is last: thread is null */\n    inorder(n1);\n    return 0;\n}\n"}}, "viz": {"type": "chain", "items": ["4", "2", "5", "1", "3", "6"], "labels": ["thread", "thread", "thread", "child", "child"], "caption": "Inorder visit order with how we reach each next node"}}, {"h": "Dry run", "p": ["Trace of the traversal on the sample tree. Only the right pointer decides the next node."], "table": {"head": ["cur", "Printed", "rthread?", "Next cur"], "rows": [["4 (leftmost)", "4", "true", "2 (thread)"], ["2", "2", "false", "leftmost(5) = 5"], ["5", "5", "true", "1 (thread)"], ["1", "1", "false", "leftmost(3) = 3"], ["3", "3", "false", "leftmost(6) = 6"], ["6", "6", "true", "null (end)"]]}}, {"h": "Two-way threading and code", "p": ["To build threads, do an inorder walk and remember the previously visited node (prev). For the current node n: if n.left is null, make it a thread to prev. If prev.right is null, make it a thread to n. Then set prev = n. The code below also walks the tree backward using left threads, which is the extra power of two-way threading."], "pts": ["First node has no predecessor: its left stays null", "Last node has no successor: its right stays null", "Forward walk uses right threads, backward walk uses left threads"], "warn": "Always check the thread flag before following a pointer. A thread treated as a child pointer makes the traversal loop forever.", "code": {"f": "Main.java", "c": "public class Main {\n    static class Node {\n        int data; Node left, right; boolean lt, rt;\n        Node(int d) { data = d; }\n    }\n    static Node prev = null;\n    // add threads to a normal tree using inorder order\n    static void thread(Node n) {\n        if (n == null) return;\n        if (!n.lt) thread(n.left);\n        if (n.left == null && prev != null) { n.left = prev; n.lt = true; }\n        if (prev != null && prev.right == null) { prev.right = n; prev.rt = true; }\n        prev = n;\n        if (!n.rt) thread(n.right);\n    }\n    static Node leftmost(Node n) { while (!n.lt && n.left != null) n = n.left; return n; }\n    static Node rightmost(Node n) { while (!n.rt && n.right != null) n = n.right; return n; }\n    public static void main(String[] args) {\n        Node a = new Node(1); a.left = new Node(2); a.right = new Node(3);\n        a.left.left = new Node(4); a.left.right = new Node(5); a.right.right = new Node(6);\n        thread(a);\n        for (Node c = leftmost(a); c != null; c = c.rt ? c.right : (c.right == null ? null : leftmost(c.right)))\n            System.out.print(c.data + \" \");\n        System.out.println();\n        for (Node c = rightmost(a); c != null; c = c.lt ? c.left : (c.left == null ? null : rightmost(c.left)))\n            System.out.print(c.data + \" \");\n    }\n}", "out": "4 2 5 1 3 6 \n6 3 1 5 2 4 ", "cpp": {"f": "main.cpp", "c": "#include <iostream>\nusing namespace std;\n\nstruct Node {\n    int data; Node *left, *right; bool lt, rt;\n    Node(int d) : data(d), left(nullptr), right(nullptr), lt(false), rt(false) {}\n};\nNode* last = nullptr;\n// add threads to a normal tree using inorder order\nvoid thread(Node* n) {\n    if (n == nullptr) return;\n    if (!n->lt) thread(n->left);\n    if (n->left == nullptr && last != nullptr) { n->left = last; n->lt = true; }\n    if (last != nullptr && last->right == nullptr) { last->right = n; last->rt = true; }\n    last = n;\n    if (!n->rt) thread(n->right);\n}\nNode* leftmost(Node* n) { while (!n->lt && n->left != nullptr) n = n->left; return n; }\nNode* rightmost(Node* n) { while (!n->rt && n->right != nullptr) n = n->right; return n; }\nint main() {\n    Node* a = new Node(1); a->left = new Node(2); a->right = new Node(3);\n    a->left->left = new Node(4); a->left->right = new Node(5); a->right->right = new Node(6);\n    thread(a);\n    for (Node* c = leftmost(a); c != nullptr; c = c->rt ? c->right : (c->right == nullptr ? nullptr : leftmost(c->right)))\n        cout << c->data << \" \";\n    cout << endl;\n    for (Node* c = rightmost(a); c != nullptr; c = c->lt ? c->left : (c->left == nullptr ? nullptr : rightmost(c->left)))\n        cout << c->data << \" \";\n}\n"}, "clang": {"f": "main.c", "c": "#include <stdio.h>\n#include <stdlib.h>\n\ntypedef struct Node { int data; struct Node *left, *right; int lt, rt; } Node;\nNode *mk(int d) { Node *n = malloc(sizeof(Node)); n->data = d; n->left = n->right = NULL; n->lt = n->rt = 0; return n; }\n\nNode *last = NULL;\n/* add threads to a normal tree using inorder order */\nvoid thread(Node *n) {\n    if (n == NULL) return;\n    if (!n->lt) thread(n->left);\n    if (n->left == NULL && last != NULL) { n->left = last; n->lt = 1; }\n    if (last != NULL && last->right == NULL) { last->right = n; last->rt = 1; }\n    last = n;\n    if (!n->rt) thread(n->right);\n}\nNode *leftmost(Node *n) { while (!n->lt && n->left != NULL) n = n->left; return n; }\nNode *rightmost(Node *n) { while (!n->rt && n->right != NULL) n = n->right; return n; }\nint main() {\n    Node *a = mk(1); a->left = mk(2); a->right = mk(3);\n    a->left->left = mk(4); a->left->right = mk(5); a->right->right = mk(6);\n    thread(a);\n    for (Node *c = leftmost(a); c != NULL; c = c->rt ? c->right : (c->right == NULL ? NULL : leftmost(c->right)))\n        printf(\"%d \", c->data);\n    printf(\"\\n\");\n    for (Node *c = rightmost(a); c != NULL; c = c->lt ? c->left : (c->left == NULL ? NULL : rightmost(c->left)))\n        printf(\"%d \", c->data);\n    return 0;\n}\n"}}, "viz": {"type": "btree", "nodes": ["1", "2", "3", "4", "5", null, "6"], "caption": "Sample tree; threads: 4->2, 5->1 (right), 5->2, 3->1, 6->3 (left), 2->4 (left)"}}, {"h": "Complexity", "p": ["Each node is visited once and each thread or child link is followed a constant number of times, so total time is O(n). No recursion and no stack are needed, so extra space is O(1). The cost: every node stores one or two extra boolean flags, and insertion and deletion must also update threads."], "pts": ["Building threads from a normal tree: O(n) time"], "table": {"head": ["Operation", "Normal binary tree", "Threaded binary tree"], "rows": [["Inorder traversal time", "O(n)", "O(n)"], ["Inorder traversal space", "O(h) stack", "O(1)"], ["Find inorder successor", "O(h)", "O(1) if rthread, else leftmost of right"], ["Node memory", "2 pointers", "2 pointers + 1 or 2 flags"]]}}], "analogy": "Think of a book with chapter pages that end with 'continue on page X'. The thread is that note: you jump directly to the next page instead of returning to the index (stack) each time.", "hinglish": "Bhai normal binary tree me n+1 pointers null hote hain, ye memory waste hai. Threaded tree me in null pointers ko inorder successor ya predecessor se jod dete hain. Isse inorder traversal bina recursion aur bina stack ke ho jata hai. Bas har node me ek flag rakhna padta hai ki pointer thread hai ya asli child.", "mistakes": ["Saying the number of null pointers is n-1 (correct is n+1).", "Not checking the thread flag and looping forever.", "Thinking threads point to parent: they point to inorder successor/predecessor.", "Using preorder/postorder order for an inorder-threaded tree."], "remember": ["Binary tree with n nodes: 2n pointers, n-1 used, n+1 null.", "Thread: a null pointer made to point to inorder successor/predecessor.", "Right thread -> inorder successor; left thread -> inorder predecessor.", "One-way threaded: only left or only right nulls are threaded.", "Two-way threaded: both left and right nulls are threaded.", "Node: lthread, left, data, right, rthread (flags are booleans).", "A flag true means the pointer is a thread, not a child link.", "Inorder: start at leftmost; if rthread follow right, else go to leftmost of right subtree.", "Time O(n), extra space O(1).", "Last node's right thread and first node's left thread are null (or point to a dummy header).", "Insertion/deletion must maintain threads.", "Without flags we could not separate threads from children."], "uses": ["Fast inorder traversal without a stack in memory-limited systems", "Finding inorder successor or predecessor in O(1)", "Symbol tables and compilers where repeated sorted traversal is needed"], "pros": ["Inorder traversal without recursion or stack, O(1) extra space", "Uses the otherwise wasted null pointers", "Successor/predecessor found quickly"], "cons": ["Insertion and deletion are more complex because threads must be updated", "Extra flag bit per pointer", "Harder to code and debug than a normal tree"], "def": "In a linked binary tree with n nodes there are 2n pointer fields but only n-1 of them point to real children. So n+1 pointers are NULL and wasted. For example, 6 nodes have 12 pointers, 5 are used, 7 are null."}, "u4-t1": {"tldr": "Find a key in an array: linear search checks one by one (O(n)); binary search halves a sorted array each step (O(log n)).", "sections": [{"h": "What is searching?", "p": ["The method we choose depends on whether the data is sorted and how big it is. The two standard methods in the syllabus are linear (sequential) search and binary search."], "viz": {"type": "chain", "items": ["Given array + key", "Compare / examine elements", "Found: return index", "Not found: return -1"], "caption": "Every search ends in one of two outcomes"}}, {"h": "Linear search: algorithm", "p": ["Linear (sequential) search starts at the first element and compares each element with the key one by one. It stops when the key is found or the array ends. The array need not be sorted."], "pts": ["Pseudocode: for i = 0 to n-1: if A[i] == key then return i; end for; return -1", "Works on arrays and linked lists, sorted or unsorted", "Returns the first index when the key repeats"], "code": {"f": "Main.java", "c": "public class Main {\n    // returns index of key, or -1\n    static int linearSearch(int[] a, int key) {\n        for (int i = 0; i < a.length; i++) {\n            if (a[i] == key) return i;\n        }\n        return -1;\n    }\n    public static void main(String[] args) {\n        int[] a = {34, 8, 51, 22, 9, 17};\n        System.out.println(\"search 22 -> index \" + linearSearch(a, 22));\n        System.out.println(\"search 99 -> index \" + linearSearch(a, 99));\n    }\n}", "out": "search 22 -> index 3\nsearch 99 -> index -1", "cpp": {"f": "main.cpp", "c": "#include <iostream>\n#include <vector>\nusing namespace std;\n\n// returns index of key, or -1\nint linearSearch(const vector<int>& a, int key) {\n    for (int i = 0; i < (int)a.size(); i++) {\n        if (a[i] == key) return i;\n    }\n    return -1;\n}\nint main() {\n    vector<int> a = {34, 8, 51, 22, 9, 17};\n    cout << \"search 22 -> index \" << linearSearch(a, 22) << endl;\n    cout << \"search 99 -> index \" << linearSearch(a, 99) << endl;\n}\n"}, "clang": {"f": "main.c", "c": "#include <stdio.h>\n\n/* returns index of key, or -1 */\nint linearSearch(int a[], int n, int key) {\n    for (int i = 0; i < n; i++) {\n        if (a[i] == key) return i;\n    }\n    return -1;\n}\nint main() {\n    int a[] = {34, 8, 51, 22, 9, 17};\n    printf(\"search 22 -> index %d\\n\", linearSearch(a, 6, 22));\n    printf(\"search 99 -> index %d\\n\", linearSearch(a, 6, 99));\n    return 0;\n}\n"}}, "table": {"head": ["Step", "What happens"], "rows": [["1. Start", "set i = 0"], ["2. Compare", "is A[i] == key ?"], ["3. If equal", "return i (found) and stop"], ["4. Else", "i = i + 1"], ["5. Repeat", "while i < n"], ["6. End", "return -1 (not found)"]]}}, {"h": "Linear search: traced example", "p": ["Array = {34, 8, 51, 22, 9, 17}, key = 22. We compare from index 0 until we hit 22."], "tip": "If the key were 17 (last element) it would take 6 comparisons (worst case). If it were 34 it would take just 1 (best case).", "code": {"f": "Main.java", "c": "public class Main {\n    public static void main(String[] args) {\n        int[] a = {34, 8, 51, 22, 9, 17};\n        int key = 22, comparisons = 0;\n        for (int i = 0; i < a.length; i++) {\n            comparisons++;\n            System.out.println(\"i=\" + i + \"  a[i]=\" + a[i] + (a[i] == key ? \"  == key, FOUND\" : \"  != key\"));\n            if (a[i] == key) break;\n        }\n        System.out.println(\"comparisons = \" + comparisons);\n    }\n}", "out": "i=0  a[i]=34  != key\ni=1  a[i]=8  != key\ni=2  a[i]=51  != key\ni=3  a[i]=22  == key, FOUND\ncomparisons = 4", "cpp": {"f": "main.cpp", "c": "#include <iostream>\n#include <vector>\nusing namespace std;\n\nint main() {\n    vector<int> a = {34, 8, 51, 22, 9, 17};\n    int key = 22, comparisons = 0;\n    for (int i = 0; i < (int)a.size(); i++) {\n        comparisons++;\n        cout << \"i=\" << i << \"  a[i]=\" << a[i] << (a[i] == key ? \"  == key, FOUND\" : \"  != key\") << endl;\n        if (a[i] == key) break;\n    }\n    cout << \"comparisons = \" << comparisons << endl;\n}\n"}, "clang": {"f": "main.c", "c": "#include <stdio.h>\n\nint main() {\n    int a[] = {34, 8, 51, 22, 9, 17}, n = 6;\n    int key = 22, comparisons = 0;\n    for (int i = 0; i < n; i++) {\n        comparisons++;\n        printf(\"i=%d  a[i]=%d%s\\n\", i, a[i], a[i] == key ? \"  == key, FOUND\" : \"  != key\");\n        if (a[i] == key) break;\n    }\n    printf(\"comparisons = %d\\n\", comparisons);\n    return 0;\n}\n"}}, "viz": {"type": "cells", "items": ["34", "8", "51", "22", "9", "17"], "labels": ["0", "1", "2", "3", "4", "5"], "hl": [3], "caption": "key 22 is found at index 3 after 4 comparisons"}}, {"h": "Linear search: complexity", "p": ["Time depends on where the key is. Space is O(1) because we only use a loop variable."], "table": {"head": ["Case", "When", "Comparisons", "Time"], "rows": [["Best", "key at first position", "1", "O(1)"], ["Average", "key equally likely anywhere", "(n+1)/2", "O(n)"], ["Worst", "key last or absent", "n", "O(n)"], ["Space", "only index variable", "-", "O(1)"]]}}, {"h": "Binary search: conditions and idea", "p": ["Binary search repeatedly divides the search range into two halves. It looks at the middle element: if it equals the key we are done; if the key is smaller we search only the left half; if larger, only the right half.", "This is a divide-and-conquer technique, and it is correct only when two conditions hold."], "pts": ["The array must be SORTED (ascending here)", "We must have random access (direct access to A[mid] in O(1)), so arrays are fine but plain linked lists are not", "Keep two pointers low and high; mid = low + (high - low) / 2 (avoids overflow of (low+high)/2)", "Stop when low > high: the key is not present"], "warn": "Binary search on an unsorted array gives wrong answers. Always sort first (or confirm it is sorted)."}, {"h": "Binary search: iterative algorithm and trace", "p": ["The iterative version uses a while loop with low and high. The code below prints each step so you can see the dry run."], "code": {"f": "Main.java", "c": "public class Main {\n    static int binarySearch(int[] a, int key) {\n        int low = 0, high = a.length - 1;\n        while (low <= high) {\n            int mid = low + (high - low) / 2;\n            System.out.println(\"low=\" + low + \" high=\" + high + \" mid=\" + mid + \" a[mid]=\" + a[mid]);\n            if (a[mid] == key) return mid;\n            else if (a[mid] < key) low = mid + 1;\n            else high = mid - 1;\n        }\n        return -1;\n    }\n    public static void main(String[] args) {\n        int[] a = {5, 12, 18, 25, 31, 42, 56, 70, 89};\n        System.out.println(\"Search 42:\");\n        System.out.println(\"index = \" + binarySearch(a, 42));\n        System.out.println(\"Search 20:\");\n        System.out.println(\"index = \" + binarySearch(a, 20));\n    }\n}", "out": "Search 42:\nlow=0 high=8 mid=4 a[mid]=31\nlow=5 high=8 mid=6 a[mid]=56\nlow=5 high=5 mid=5 a[mid]=42\nindex = 5\nSearch 20:\nlow=0 high=8 mid=4 a[mid]=31\nlow=0 high=3 mid=1 a[mid]=12\nlow=2 high=3 mid=2 a[mid]=18\nlow=3 high=3 mid=3 a[mid]=25\nindex = -1", "cpp": {"f": "main.cpp", "c": "#include <iostream>\n#include <vector>\nusing namespace std;\n\nint binarySearch(const vector<int>& a, int key) {\n    int low = 0, high = (int)a.size() - 1;\n    while (low <= high) {\n        int mid = low + (high - low) / 2;\n        cout << \"low=\" << low << \" high=\" << high << \" mid=\" << mid << \" a[mid]=\" << a[mid] << endl;\n        if (a[mid] == key) return mid;\n        else if (a[mid] < key) low = mid + 1;\n        else high = mid - 1;\n    }\n    return -1;\n}\nint main() {\n    vector<int> a = {5, 12, 18, 25, 31, 42, 56, 70, 89};\n    cout << \"Search 42:\" << endl;\n    int r1 = binarySearch(a, 42);          // C++ evaluates operands in unspecified order, so call first\n    cout << \"index = \" << r1 << endl;\n    cout << \"Search 20:\" << endl;\n    int r2 = binarySearch(a, 20);\n    cout << \"index = \" << r2 << endl;\n}\n"}, "clang": {"f": "main.c", "c": "#include <stdio.h>\n\nint binarySearch(int a[], int n, int key) {\n    int low = 0, high = n - 1;\n    while (low <= high) {\n        int mid = low + (high - low) / 2;\n        printf(\"low=%d high=%d mid=%d a[mid]=%d\\n\", low, high, mid, a[mid]);\n        if (a[mid] == key) return mid;\n        else if (a[mid] < key) low = mid + 1;\n        else high = mid - 1;\n    }\n    return -1;\n}\nint main() {\n    int a[] = {5, 12, 18, 25, 3
