function inl(t){ // safe inline markup: `code` and **bold**
  return escapeHtml(String(t==null?'':t)).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
}
function plain(t){ return String(t==null?'':t).replace(/`([^`]+)`/g,'$1').replace(/\*\*([^*]+)\*\*/g,'$1'); }
function mk(tag, cls, html){ const e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e; }
function lessonViz(v){
  const box=mk('div','lviz');
  if(v.type==='chain'){
    const row=mk('div','lviz-chain');
    v.items.forEach((it,i)=>{
      if(i) row.appendChild(mk('span','lviz-arrow',(v.labels&&v.labels[i-1]?'<small>'+inl(v.labels[i-1])+'</small>':'')+'→')).style.setProperty('--i',i*2-1);
      const n=mk('span','lviz-node',inl(it)); n.style.setProperty('--i',i*2); row.appendChild(n);
    });
    box.appendChild(row);
  } else if(v.type==='tree'){
    box.appendChild(Object.assign(mk('div','lviz-node root',inl(v.root)),{})).style.setProperty('--i',0);
    box.appendChild(mk('div','lviz-stem')).style.setProperty('--i',1);
    const kids=mk('div','lviz-kids');
    v.kids.forEach((k,i)=>{ const n=mk('span','lviz-node',inl(k)); n.style.setProperty('--i',i+2); kids.appendChild(n); });
    box.appendChild(kids);
  } else if(v.type==='merge'){
    const ps=mk('div','lviz-kids'); v.parents.forEach((k,i)=>{ const n=mk('span','lviz-node root',inl(k)); n.style.setProperty('--i',i); ps.appendChild(n); }); box.appendChild(ps);
    box.appendChild(mk('div','lviz-stem')).style.setProperty('--i',v.parents.length);
    const c=mk('div','lviz-node'+(v.bad?' bad':''),inl(v.child)+(v.bad?' ✖':'')); c.style.setProperty('--i',v.parents.length+1); box.appendChild(c);
  } else if(v.type==='cells'){
    const row=mk('div','lviz-cells'); const hl=v.hl||[];
    v.items.forEach((it,i)=>{ const w=mk('div','lviz-cw'); const n=mk('span','lviz-node lviz-cell'+(hl.indexOf(i)>=0?' root':''),inl(it)); n.style.setProperty('--i',i); w.appendChild(n); w.appendChild(mk('div','lviz-lab',v.labels&&v.labels[i]!=null?inl(v.labels[i]):'')); row.appendChild(w); });
    box.appendChild(row);
  } else if(v.type==='btree'){
    const N=v.nodes, md=Math.floor(Math.log2(N.length)), slots=Math.pow(2,md), CW=58, W=Math.max(slots*CW,120), H=md*58+50, NS='http://www.w3.org/2000/svg';
    const svg=document.createElementNS(NS,'svg'); svg.setAttribute('viewBox','0 0 '+W+' '+H); svg.setAttribute('class','lsv'); svg.style.maxWidth=W+'px';
    const pos=i=>{ const d=Math.floor(Math.log2(i+1)), sl=i+1-Math.pow(2,d), n=Math.pow(2,d); return {x:(sl+.5)/n*W, y:26+d*58, d}; };
    const add=(p,t,at,txt)=>{ const e=document.createElementNS(NS,t); for(const k in at) e.setAttribute(k,at[k]); if(txt!=null) e.textContent=txt; p.appendChild(e); return e; };
    N.forEach((x,i)=>{ if(x==null||i===0) return; const par=Math.floor((i-1)/2); if(N[par]==null) return; const a=pos(par), b=pos(i); const g=add(svg,'g',{class:'lsv-e'}); g.style.setProperty('--i',b.d); add(g,'line',{x1:a.x,y1:a.y,x2:b.x,y2:b.y}); });
    N.forEach((x,i)=>{ if(x==null) return; const p=pos(i); const g=add(svg,'g',{class:'lsv-n'+(i===0?' root':'')}); g.style.setProperty('--i',p.d); const w=Math.max(36,String(x).length*9+16); add(g,'rect',{x:p.x-w/2,y:p.y-16,width:w,height:32,rx:16}); add(g,'text',{x:p.x,y:p.y+4.5,'text-anchor':'middle'},String(x)); });
    box.appendChild(svg);
  } else if(v.type==='graph'){
    const N=v.nodes, n=N.length, R=n<=2?40:Math.min(110,28+n*16), W=R*2+90, H=R*2+70, cx=W/2, cy=H/2, NS='http://www.w3.org/2000/svg', r=19;
    const svg=document.createElementNS(NS,'svg'); svg.setAttribute('viewBox','0 0 '+W+' '+H); svg.setAttribute('class','lsv'); svg.style.maxWidth=W+'px';
    const add=(p,t,at,txt)=>{ const e=document.createElementNS(NS,t); for(const k in at) e.setAttribute(k,at[k]); if(txt!=null) e.textContent=txt; p.appendChild(e); return e; };
    const defs=add(svg,'defs',{}); const mkr=add(defs,'marker',{id:'arw',viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:7,markerHeight:7,orient:'auto-start-reverse'}); add(mkr,'path',{d:'M0 0L10 5L0 10z',fill:'currentColor'});
    const P={}; N.forEach((x,i)=>{ const ang=-Math.PI/2+i*2*Math.PI/n; P[x]={x:cx+R*Math.cos(ang), y:cy+R*Math.sin(ang), i}; });
    v.edges.forEach((e,k)=>{ const a=P[e[0]], b=P[e[1]]; if(!a||!b) return; const dx=b.x-a.x, dy=b.y-a.y, d=Math.hypot(dx,dy)||1, ux=dx/d, uy=dy/d; const g=add(svg,'g',{class:'lsv-e'}); g.style.setProperty('--i',1);
      const ln=add(g,'line',{x1:a.x+ux*r,y1:a.y+uy*r,x2:b.x-ux*(r+(v.directed?2:0)),y2:b.y-uy*(r+(v.directed?2:0))}); if(v.directed) ln.setAttribute('marker-end','url(#arw)');
      if(e[2]!=null) add(g,'text',{x:(a.x+b.x)/2+uy*9,y:(a.y+b.y)/2-ux*9+4,'text-anchor':'middle',class:'lsv-w'},String(e[2])); });
    N.forEach(x=>{ const p=P[x]; const g=add(svg,'g',{class:'lsv-n'}); g.style.setProperty('--i',0); add(g,'circle',{cx:p.x,cy:p.y,r}); add(g,'text',{x:p.x,y:p.y+4.5,'text-anchor':'middle'},String(x)); });
    box.appendChild(svg);
  } else if(v.type==='diamond'){
    const t=mk('div','lviz-node root',inl(v.top)); t.style.setProperty('--i',0); box.appendChild(t);
    const mid=mk('div','lviz-kids'); v.mid.forEach((k,i)=>{ const n=mk('span','lviz-node',inl(k)); n.style.setProperty('--i',i+1); mid.appendChild(n); }); box.appendChild(mid);
    const b=mk('div','lviz-node bad',inl(v.bottom)); b.style.setProperty('--i',4); box.appendChild(b);
  }
  if(v.caption) box.appendChild(mk('div','lviz-cap',inl(v.caption)));
  return box;
}
const LANG_KEY='dsaCourse_lang';
function getLang(){ try{ var v=localStorage.getItem(LANG_KEY); return (v==='cpp'||v==='c')?v:'java'; }catch(e){ return window.__lang||'java'; } }
function setLang(l){ window.__lang=l; try{ localStorage.setItem(LANG_KEY,l); }catch(e){} document.querySelectorAll('.lcode[data-hascpp]').forEach(w=>w._apply&&w._apply()); }
function lessonCode(c){
  const ed=mk('div','editor');
  ed.innerHTML='<div class="editor-bar"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div><span class="fname"></span><span class="langtog"></span></div><pre><code data-lang="java"></code></pre>';
  const wrap=mk('div','lcode'); wrap.appendChild(ed);
  const code=ed.querySelector('code'), fn=ed.querySelector('.fname');
  const apply=()=>{ const L0=getLang(); const alt=(L0==='cpp'&&c.cpp)?c.cpp:((L0==='c'&&c.clang)?c.clang:null); const cur=alt?L0:'java'; fn.textContent=alt?alt.f:(c.f||'Example.java'); code.textContent=alt?alt.c:c.c; code.dataset.done=''; code.innerHTML=highlightJava(code.textContent); code.dataset.done='1'; ed.querySelectorAll('.langtog button').forEach(b=>b.classList.toggle('on',b.dataset.l===cur)); };
  if(c.cpp||c.clang){ wrap.dataset.hascpp='1'; const tg=ed.querySelector('.langtog'); [['java','Java'],['cpp','C++'],['c','C']].filter(x=>x[0]==='java'||(x[0]==='cpp'&&c.cpp)||(x[0]==='c'&&c.clang)).forEach(([l,n])=>{ const b=mk('button',null,n); b.type='button'; b.dataset.l=l; b.onclick=()=>setLang(l); tg.appendChild(b); }); wrap._apply=apply; }
  apply();
  if(c.out){ const o=mk('div','lout'); o.appendChild(mk('span','lout-l','Output')); const pre=mk('pre'); pre.textContent=c.out; o.appendChild(pre); wrap.appendChild(o); }
  return wrap;
}
function lessonTable(t){
  const w=mk('div','ltbl'); const tb=mk('table','tbl');
  tb.innerHTML='<tr>'+t.head.map(h=>'<th>'+inl(h)+'</th>').join('')+'</tr>'+t.rows.map(r=>'<tr>'+r.map(c=>'<td>'+inl(c)+'</td>').join('')+'</tr>').join('');
  w.appendChild(tb); return w;

function lessonToText(L, title){
  const o=['# '+title,''];
  if(L.tldr) o.push('In one line: '+plain(L.tldr),'');
  if(L.def) o.push('## Definition',plain(L.def),'');
  (L.sections||[]).forEach(s=>{
    o.push('## '+plain(s.h));
    (s.p||[]).forEach(x=>o.push(plain(x)));
    (s.pts||[]).forEach(x=>o.push('- '+plain(x)));
    if(s.table){ o.push(s.table.head.map(plain).join(' | ')); s.table.rows.forEach(r=>o.push(r.map(plain).join(' | '))); }
    if(s.viz&&s.viz.items) o.push(s.viz.items.map(plain).join(' -> '));
    if(s.code){ const g=getLang(), al=(g==='cpp'&&s.code.cpp)?s.code.cpp:((g==='c'&&s.code.clang)?s.code.clang:null); o.push('```'+(al?g:'java'),'// '+((al?al.f:s.code.f)||''),al?al.c:s.code.c,'```'); }
    if(s.code&&s.code.out) o.push('Output: '+s.code.out);
    if(s.tip) o.push('Tip: '+plain(s.tip));
    if(s.warn) o.push('Warning: '+plain(s.warn));
    o.push('');
  });
  [['Where it is used','uses'],['Advantages','pros'],['Limitations','cons'],['Common mistakes','mistakes'],['Quick revision','remember']].forEach(([lb,k])=>{
    if(L[k]&&L[k].length){ o.push('## '+lb); L[k].forEach(x=>o.push('- '+plain(x))); o.push(''); }
  });
  return o.join('\n');
}
function loadNote(key){ try{ return (JSON.parse(localStorage.getItem(NOTES_KEY)||'{}'))[key]||''; }catch(e){ return ''; } }
function saveNote(key,val){ try{ const m=JSON.parse(localStorage.getItem(NOTES_KEY)||'{}'); if(val) m[key]=val; else delete m[key]; localStorage.setItem(NOTES_KEY,JSON.stringify(m)); }catch(e){} }

function renderLesson(body, unitId, topicId){
  const key=unitId+'-'+topicId, L=LESSONS[key];
  if(!L) return false;
  // keep only header + quizzes from the old template
  const eyebrow=body.querySelector('.topic-eyebrow'), title=body.querySelector('.topic-title'), hook=body.querySelector('.topic-hook');
  const quizzes=[...body.querySelectorAll('.mini-quiz')];
  const titleText=title?title.textContent:key;
  body.innerHTML='';
  [eyebrow,title,hook].forEach(e=>e&&body.appendChild(e));

  const root=mk('div','lesson');
  // toolbar
  const bar=mk('div','lbar');
  const bCopy=mk('button','neu-btn','📋 Copy notes'); bCopy.type='button';
  bCopy.onclick=()=>copyText(lessonToText(L,titleText),bCopy);
  const bPrint=mk('button','neu-btn','🖨️ Print / Save PDF'); bPrint.type='button';
  bPrint.onclick=()=>window.print();
  const bMy=mk('button','neu-btn','✍️ My notes'); bMy.type='button';
  bMy.onclick=()=>{ const n=document.getElementById('myNotes'); if(n){ n.scrollIntoView({behavior:'smooth',block:'center'}); n.focus(); } };
  [bCopy,bPrint,bMy].forEach(b=>bar.appendChild(b));
  root.appendChild(bar);

  // table of contents
  const secs=L.sections||[];
  const toc=mk('nav','ltoc'); toc.appendChild(mk('span','ltoc-l','On this page'));
  const tocItems=[['Definition','ls-def']].concat(secs.map((s,i)=>[plain(s.h),'ls-'+i]));
  if((L.uses||L.pros||L.cons||[]).length) tocItems.push(['Uses, pros & cons','ls-ufc']);
  tocItems.push(['Quick revision','ls-rev']);
  tocItems.forEach(([t,id])=>{ const a=mk('button','ltoc-a'); a.type='button'; a.textContent=t; a.onclick=()=>document.getElementById(id)?.scrollIntoView({behavior:'smooth',block:'start'}); toc.appendChild(a); });
  root.appendChild(toc);

  if(L.tldr){ const t=mk('div','ltldr reveal'); t.innerHTML='<span class="ltldr-l">⚡ In one line</span><p>'+inl(L.tldr)+'</p>'; root.appendChild(t); }
  if(L.def){ const d=mk('section','ldef reveal'); d.id='ls-def'; d.innerHTML='<div class="lh"><span class="lnum">★</span><h2>Definition</h2></div><p>'+inl(L.def)+'</p>'; root.appendChild(d); }

  secs.forEach((s,i)=>{
    const sec=mk('section','lsec reveal'); sec.id='ls-'+i;
    sec.appendChild(mk('div','lh','<span class="lnum">'+String(i+1).padStart(2,'0')+'</span><h2>'+inl(s.h)+'</h2>'+(s.x?'<span class="oos-pill">Not in syllabus</span>':'')));
    (s.p||[]).forEach(x=>sec.appendChild(mk('p','lp',inl(x))));
    if(s.viz) sec.appendChild(lessonViz(s.viz));
    if(s.pts&&s.pts.length){ const ul=mk('ul','lpts'); s.pts.forEach((x,j)=>{ const li=mk('li',null,inl(x)); li.style.setProperty('--i',j); ul.appendChild(li); }); sec.appendChild(ul); }
    if(s.table) sec.appendChild(lessonTable(s.table));
    if(s.code) sec.appendChild(lessonCode(s.code));
    if(s.tip) sec.appendChild(mk('div','lcall tip','<b>💡 Tip</b> '+inl(s.tip)));
    if(s.warn) sec.appendChild(mk('div','lcall warn','<b>⚠️ Careful</b> '+inl(s.warn)));
    root.appendChild(sec);

/* ---------- SCROLL REVEAL ---------- */
const observer = new IntersectionObserver((entries)=>{
  entries.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('visible'); } });
},{threshold:0.1});
function triggerReveal(){
  const targets = document.querySelectorAll('.reveal:not(.visible)');
  targets.forEach(el=>observer.observe(el));
  // Safety net: some embedded WebViews / preview iframes never fire
  // IntersectionObserver correctly, which would leave content stuck at
  // opacity:0 (looking like a permanent haze). Force it visible shortly
  // after render no matter what.
  setTimeout(()=>{
    document.querySelectorAll('.reveal:not(.visible)').forEach(el=>el.classList.add('visible'));
  }, 700);
}

/* ---------- CODE HIGHLIGHTER ---------- */
const JAVA_KEYWORDS = ['include','using','namespace','struct','template','typename','nullptr','auto','unsigned','void','bool','delete','cout','cin','endl','vector','string','NULL','typedef','sizeof','inline','virtual','operator','friend','abstract','assert','boolean','break','byte','case','catch','char','class','const','continue','default','do','double','else','enum','extends','final','finally','float','for','goto','if','implements','import','instanceof','int','interface','long','native','new','package','private','protected','public','return','short','static','strictfp','super','switch','synchronized','this','throw','throws','transient','try','void','volatile','while','true','false','null','var'];
function escapeHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
// Single-pass tokenizer: scans RAW source once, classifies each token, and never
// re-scans text it has already generated (avoids corrupting inserted <span> markup).
const HL_REGEX = new RegExp(
  '(\\/\\/[^\\n]*)' +                          // 1: line comment
  '|(\\/\\*[\\s\\S]*?\\*\\/)' +                  // 2: block comment
  '|("(?:[^"\\\\]|\\\\.)*")' +                   // 3: double-quoted string
  "|('(?:[^'\\\\]|\\\\.)*')" +                   // 4: single-quoted char
  '|(@[A-Za-z]+)' +                             // 5: annotation
  '|\\b(\\d+\\.?\\d*)\\b' +                      // 6: number
  '|\\b(' + JAVA_KEYWORDS.join('|') + ')\\b' +   // 7: keyword
  '|\\b([A-Z][A-Za-z0-9_]*)\\b'                 // 8: capitalized type/class name
  , 'g');
function highlightJava(raw){
  let out = '';
  let last = 0;
  let m;
  HL_REGEX.lastIndex = 0;
  while((m = HL_REGEX.exec(raw))){
    out += escapeHtml(raw.slice(last, m.index));
    const full = m[0];
    const safe = escapeHtml(full);
    if(m[1]||m[2]) out += `<span class="tok-com">${safe}</span>`;
    else if(m[3]||m[4]) out += `<span class="tok-str">${safe}</span>`;
    else if(m[5]) out += `<span class="tok-ann">${safe}</span>`;
    else if(m[6]!==undefined) out += `<span class="tok-num">${safe}</span>`;
    else if(m[7]!==undefined) out += `<span class="tok-kw">${safe}</span>`;
    else if(m[8]!==undefined) out += `<span class="tok-type">${safe}</span>`;
    else out += safe;
    last = HL_REGEX.lastIndex;
  }
  out += escapeHtml(raw.slice(last));
  return out;
}
function highlightAll(root){
  root.querySelectorAll('pre code[data-lang="java"]').forEach(block=>{
    if(block.dataset.done) return;
    block.innerHTML = highlightJava(block.textContent);
    block.dataset.done='1';
  });
  root.querySelectorAll('pre code[data-lang="bash"]').forEach(block=>{
    if(block.dataset.done) return;
    block.innerHTML = escapeHtml(block.textContent).replace(/(#.*$)/gm,'<span class="tok-com">$1</span>');
    block.dataset.done='1';
  });
}

/* ---------- RESPONSIVE TABLES ---------- */
function wrapTables(root){
  root.querySelectorAll('table.tbl').forEach(table=>{
    if(table.parentElement && table.parentElement.classList.contains('table-scroll')) return;
    const wrap = document.createElement('div');
    wrap.className = 'table-scroll';
    table.parentNode.insertBefore(wrap, table);
    wrap.appendChild(table);
  });
}

/* ---------- MINI QUIZ ---------- */
function wireQuizzes(root){
  root.querySelectorAll('[data-quiz]').forEach(q=>{
    const opts = q.querySelectorAll('.opt');
    const fb = q.querySelector('.fb');
    opts.forEach(opt=>{
      opt.addEventListener('click',()=>{
        if(opt.dataset.answered) return;
        opts.forEach(o=>o.dataset.answered='1');
        const correct = opt.dataset.correct === 'true';
        opts.forEach(o=>{
          if(o.dataset.correct==='true') o.classList.add('correct');
          else if(o===opt) o.classList.add('wrong');
        });
        fb.textContent = correct ? "✅ Correct! Nicely done." : "❌ Not quite — the right answer is highlighted above.";
        fb.classList.add('show');
      });
    });
  });
}

/* ---------- SEARCH ---------- */
document.getElementById('search').addEventListener('input', (e)=>{
  const q = e.target.value.toLowerCase().trim();
  document.querySelectorAll('.unit-block').forEach(block=>{
    let anyMatch = false;
    block.querySelectorAll('.topic-link').forEach(link=>{
      const text = link.textContent.toLowerCase();
      const match = text.includes(q);
      link.style.display = match ? 'flex' : 'none';
      if(match) anyMatch = true;
    });
    if(q){ block.classList.toggle('open', anyMatch); block.style.display = anyMatch ? '' : 'none'; }
    else { block.style.display=''; block.querySelectorAll('.topic-link').forEach(l=>l.style.display='flex'); }
  });
});

/* ---------- RESET PROGRESS ---------- */
document.getElementById('resetBtn')?.addEventListener('click', ()=>{
  if(!confirm('Reset your saved progress for this course? This clears every topic marked as done on this device.')) return;
  doneSet.clear();
  try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
  document.querySelectorAll('.topic-link').forEach(l=>{ l.classList.remove('done','active'); const c=l.querySelector('.check'); if(c) c.textContent=''; });
  updateXP();
  const t = document.getElementById('saveStatusText');
  if(t) t.textContent = 'Progress reset';
  if(!currentUnit) showHome();
});

/* ---------- MOBILE SIDEBAR ---------- */
function closeSidebar(){ document.getElementById('sidebar').classList.remove('open'); document.getElementById('overlay').classList.remove('show'); }
document.getElementById('menuBtn')?.addEventListener('click', ()=>{
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('overlay').classList.add('show');
});
document.getElementById('overlay').addEventListener('click', closeSidebar);
document.getElementById('sidebarCloseBtn')?.addEventListener('click', closeSidebar);

/* ---------- KEYBOARD NAV ---------- */
document.addEventListener('keydown',(e)=>{
  if(!currentUnit) return;
  if(e.key==='ArrowRight'){ const idx=flatOrder.findIndex(f=>f.unit===currentUnit&&f.topic===currentTopic); const n=flatOrder[idx+1]; if(n) loadTopic(n.unit,n.topic); }
  if(e.key==='ArrowLeft'){ const idx=flatOrder.findIndex(f=>f.unit===currentUnit&&f.topic===currentTopic); const p=flatOrder[idx-1]; if(p) loadTopic(p.unit,p.topic); }
});
</script>
