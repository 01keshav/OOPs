1, 42, 56, 70, 89};\n    printf(\"Search 42:\\n\");\n    printf(\"index = %d\\n\", binarySearch(a, 9, 42));\n    printf(\"Search 20:\\n\");\n    printf(\"index = %d\\n\", binarySearch(a, 9, 20));\n    return 0;\n}\n"}}, "table": {"head": ["Step", "What happens"], "rows": [["1. Init", "low = 0, high = n-1"], ["2. Loop", "while low <= high"], ["3. Mid", "mid = low + (high-low)/2"], ["4. Equal", "A[mid] == key: return mid"], ["5. Smaller", "A[mid] < key: low = mid+1"], ["6. Larger", "A[mid] > key: high = mid-1"], ["7. End", "loop over: return -1"]]}}, {"h": "Binary search: dry run table", "p": ["Array A = {5, 12, 18, 25, 31, 42, 56, 70, 89} (n = 9). Key = 42 is found in 3 steps. Key = 20 is not found after 4 steps, when low (3) becomes greater than high (2)."], "table": {"head": ["Step", "low", "high", "mid", "A[mid]", "Action"], "rows": [["1", "0", "8", "4", "31", "31 < 42, low = 5"], ["2", "5", "8", "6", "56", "56 > 42, high = 5"], ["3", "5", "5", "5", "42", "found at 5"], ["-", "-", "-", "-", "-", "-"], ["1", "0", "8", "4", "31", "31 > 20, high = 3"], ["2", "0", "3", "1", "12", "12 < 20, low = 2"], ["3", "2", "3", "2", "18", "18 < 20, low = 3"], ["4", "3", "3", "3", "25", "25 > 20, high = 2"], ["-", "3", "2", "-", "-", "low > high: not found"]]}}, {"h": "Binary search: recursive version", "p": ["The recursive version passes low and high as parameters. Each call solves a problem of half the size. It has two base cases: range empty (not found) and a[mid] == key (found).", "It uses stack space for about log2(n) calls, so its space is O(log n), while the iterative one is O(1)."], "code": {"f": "Main.java", "c": "public class Main {\n    static int binarySearch(int[] a, int key, int low, int high) {\n        if (low > high) return -1;               // base case: not found\n        int mid = low + (high - low) / 2;\n        if (a[mid] == key) return mid;           // base case: found\n        if (a[mid] < key)\n            return binarySearch(a, key, mid + 1, high);\n        return binarySearch(a, key, low, mid - 1);\n    }\n    public static void main(String[] args) {\n        int[] a = {5, 12, 18, 25, 31, 42, 56, 70, 89};\n        System.out.println(binarySearch(a, 70, 0, a.length - 1));\n        System.out.println(binarySearch(a, 6, 0, a.length - 1));\n    }\n}", "out": "7\n-1", "cpp": {"f": "main.cpp", "c": "#include <iostream>\n#include <vector>\nusing namespace std;\n\nint binarySearch(const vector<int>& a, int key, int low, int high) {\n    if (low > high) return -1;               // base case: not found\n    int mid = low + (high - low) / 2;\n    if (a[mid] == key) return mid;           // base case: found\n    if (a[mid] < key)\n        return binarySearch(a, key, mid + 1, high);\n    return binarySearch(a, key, low, mid - 1);\n}\nint main() {\n    vector<int> a = {5, 12, 18, 25, 31, 42, 56, 70, 89};\n    cout << binarySearch(a, 70, 0, a.size() - 1) << endl;\n    cout << binarySearch(a, 6, 0, a.size() - 1) << endl;\n}\n"}, "clang": {"f": "main.c", "c": "#include <stdio.h>\n\nint binarySearch(int a[], int key, int low, int high) {\n    if (low > high) return -1;               /* base case: not found */\n    int mid = low + (high - low) / 2;\n    if (a[mid] == key) return mid;           /* base case: found */\n    if (a[mid] < key)\n        return binarySearch(a, key, mid + 1, high);\n    return binarySearch(a, key, low, mid - 1);\n}\nint main() {\n    int a[] = {5, 12, 18, 25, 31, 42, 56, 70, 89};\n    printf(\"%d\\n\", binarySearch(a, 70, 0, 8));\n    printf(\"%d\\n\", binarySearch(a, 6, 0, 8));\n    return 0;\n}\n"}}}, {"h": "Complexity of binary search and comparison", "p": ["Each step halves the range: n, n/2, n/4, ... 1. The number of halvings is about log2(n), so the recurrence is T(n) = T(n/2) + c, which solves to O(log n). Worst case comparisons = floor(log2 n) + 1.", "1 million items need only about 20 comparisons with binary search, against up to 1,000,000 for linear search."], "code": {"f": "Main.java", "c": "public class Main {\n    static int steps(int n) {            // max comparisons of binary search on n items\n        int c = 0;\n        while (n > 0) { n /= 2; c++; }\n        return c;\n    }\n    public static void main(String[] args) {\n        int[] sizes = {7, 15, 1000, 1000000};\n        for (int n : sizes)\n            System.out.println(\"n = \" + n + \"  linear worst = \" + n + \"  binary worst = \" + steps(n));\n    }\n}", "out": "n = 7  linear worst = 7  binary worst = 3\nn = 15  linear worst = 15  binary worst = 4\nn = 1000  linear worst = 1000  binary worst = 10\nn = 1000000  linear worst = 1000000  binary worst = 20", "cpp": {"f": "main.cpp", "c": "#include <iostream>\n#include <vector>\nusing namespace std;\n\nint steps(int n) {            // max comparisons of binary search on n items\n    int c = 0;\n    while (n > 0) { n /= 2; c++; }\n    return c;\n}\nint main() {\n    vector<int> sizes = {7, 15, 1000, 1000000};\n    for (int n : sizes)\n        cout << \"n = \" << n << \"  linear worst = \" << n << \"  binary worst = \" << steps(n) << endl;\n}\n"}, "clang": {"f": "main.c", "c": "#include <stdio.h>\n\nint steps(int n) {            /* max comparisons of binary search on n items */\n    int c = 0;\n    while (n > 0) { n /= 2; c++; }\n    return c;\n}\nint main() {\n    int sizes[] = {7, 15, 1000, 1000000};\n    for (int i = 0; i < 4; i++) {\n        int n = sizes[i];\n        printf(\"n = %d  linear worst = %d  binary worst = %d\\n\", n, n, steps(n));\n    }\n    return 0;\n}\n"}}, "table": {"head": ["Point", "Linear search", "Binary search"], "rows": [["Sorted data needed", "No", "Yes"], ["Best case", "O(1)", "O(1)"], ["Average case", "O(n)", "O(log n)"], ["Worst case", "O(n)", "O(log n)"], ["Space", "O(1)", "O(1) iter, O(log n) rec"], ["Works on linked list", "Yes", "Not efficiently"], ["Technique", "Brute force", "Divide and conquer"]]}}], "analogy": "Linear search is looking for a friend's name by reading a messy guest list line by line. Binary search is finding a word in a dictionary: open the middle, see if your word is before or after, and throw away half the book each time.", "hinglish": "Bhai searching matlab array me key dhundhna. Linear search me shuru se ek-ek element check karte hain, isliye worst case O(n). Binary search sirf sorted array pe chalta hai: beech wala element dekho, key chhoti ho to left half, badi ho to right half. Har step me aadha data khatam, isliye O(log n).", "mistakes": ["Using binary search on an unsorted array.", "Writing (low + high)/2 and ignoring overflow for huge arrays; prefer low + (high - low)/2.", "Using while (low < high) and missing the case when one element is left; the condition is low <= high.", "Saying average case of linear search is n; it is (n+1)/2, which is still O(n).", "Forgetting mid + 1 / mid - 1, which causes an infinite loop."], "remember": ["Searching: find position of key; return index or -1.", "Linear search: compare sequentially from index 0; array may be unsorted.", "Linear search: best O(1), average O(n) ((n+1)/2), worst O(n), space O(1).", "Binary search needs a sorted array and random access.", "Binary search: mid = low + (high - low)/2; if A[mid]==key found; if A[mid]<key low=mid+1; else high=mid-1.", "Stop condition: low > high means not found.", "Binary search: best O(1), average and worst O(log n).", "Iterative binary search space O(1); recursive O(log n) due to call stack.", "Recurrence of binary search: T(n) = T(n/2) + c.", "Max comparisons in binary search = floor(log2 n) + 1.", "Binary search is divide and conquer; linear search is brute force.", "If the array is unsorted and searched once, linear search is cheaper than sort + binary search."], "uses": ["Looking up records in sorted databases and indexes", "Dictionary / phone-book style lookups and spell checkers", "Finding insertion position in sorted arrays", "Linear search for small or unsorted lists, and linked lists", "Binary search on answer (e.g. finding a threshold value)"], "pros": ["Linear: simple, needs no sorting, works on any structure", "Binary: extremely fast, only about log2(n) steps", "Binary iterative uses constant extra space"], "cons": ["Linear: slow for large n (O(n))", "Binary: needs sorted data, so sorting cost may be needed first", "Binary: needs random access, so poor on linked lists"], "def": "Searching is the process of finding the location of a given value (the key) in a collection of data. The result is either the index where the key is present (successful search) or a signal that it is absent (unsuccessful search, usually -1)."}, "u4-t6": {"tldr": "Compare the five sorting methods on time, space, stability and in-place use, and pick the right one for the job.", "sections": [{"h": "Why compare sorting methods?", "p": ["The standard properties are: time complexity (best, average, worst), space complexity, stability and whether the sort works in-place."], "pts": ["Time: how the number of steps grows with n.", "Space: extra memory used apart from the input array.", "Stable: equal keys keep their original order.", "In-place: needs only O(1) (or O(log n) stack) extra space."]}, {"h": "Comparison table", "p": ["This is the table every exam expects. n is the number of elements. Quick sort space O(log n) is the recursion stack."], "tip": "Selection sort does at most n-1 swaps, so it is useful when writing to memory is costly.", "table": {"head": ["Sort", "Best", "Average", "Worst", "Space", "Stable", "In-place"], "rows": [["Bubble", "O(n)", "O(n^2)", "O(n^2)", "O(1)", "Yes", "Yes"], ["Selection", "O(n^2)", "O(n^2)", "O(n^2)", "O(1)", "No", "Yes"], ["Insertion", "O(n)", "O(n^2)", "O(n^2)", "O(1)", "Yes", "Yes"], ["Merge", "O(n log n)", "O(n log n)", "O(n log n)", "O(n)", "Yes", "No"], ["Quick", "O(n log n)", "O(n log n)", "O(n^2)", "O(log n)", "No", "Yes"]]}}, {"h": "Properties of sorting", "p": ["Stable sort: if two records have equal keys, their relative order in the output is the same as in the input. Example: sorting students by marks keeps alphabetical order among equal marks only if the sort is stable.", "In-place sort: rearranges the elements inside the same array using only a small constant amount of extra memory.", "Adaptive sort: runs faster when the input is already (nearly) sorted. Insertion sort and flagged bubble sort are adaptive. Selection sort is not."], "pts": ["Internal sorting: all data fits in main memory (bubble, selection, insertion, quick, merge).", "External sorting: data is too large for RAM and lives on disk or tape. It sorts chunks in memory and then merges them (external merge sort).", "Comparison-based sorts cannot beat O(n log n) in the worst case."], "table": {"head": ["Property", "Meaning", "Example"], "rows": [["Stable", "Equal keys keep order", "Merge, insertion"], ["In-place", "O(1) extra space", "Quick, selection"], ["Adaptive", "Faster on sorted input", "Insertion"], ["Internal", "Data fits in RAM", "All five here"], ["External", "Data on disk", "External merge sort"]]}}, {"h": "Counting comparisons: a verified demo", "p": ["The program below sorts the same array {5, 2, 9, 1, 7, 3} with all five methods and counts how many times two elements are compared. Notice that the O(n log n) sorts do fewer comparisons than the O(n^2) ones, even for n = 6.", "Counts depend on the exact version of each algorithm (bubble with early exit, quick with last element as pivot, merge with middle split)."], "warn": "Comparison counts change with the input order and the variant used, so quote them only for the given array.", "code": {"f": "Main.java", "c": "import java.util.Arrays;\npublic class Main {\n    static int c;\n    static void bubble(int[] a) {\n        for (int i = 0; i < a.length - 1; i++) {\n            boolean swapped = false;\n            for (int j = 0; j < a.length - 1 - i; j++) {\n                c++;\n                if (a[j] > a[j + 1]) { int t = a[j]; a[j] = a[j + 1]; a[j + 1] = t; swapped = true; }\n            }\n            if (!swapped) break;\n        }\n    }\n    static void selection(int[] a) {\n        for (int i = 0; i < a.length - 1; i++) {\n            int m = i;\n            for (int j = i + 1; j < a.length; j++) { c++; if (a[j] < a[m]) m = j; }\n            int t = a[i]; a[i] = a[m]; a[m] = t;\n        }\n    }\n    static void insertion(int[] a) {\n        for (int i = 1; i < a.length; i++) {\n            int key = a[i], j = i - 1;\n            while (j >= 0) {\n                c++;\n                if (a[j] > key) { a[j + 1] = a[j]; j--; } else break;\n            }\n            a[j + 1] = key;\n        }\n    }\n    static void mergeSort(int[] a, int l, int r) {\n        if (l >= r) return;\n        int m = (l + r) / 2;\n        mergeSort(a, l, m); mergeSort(a, m + 1, r);\n        int[] t = new int[r - l + 1];\n        int i = l, j = m + 1, k = 0;\n        while (i <= m && j <= r) { c++; t[k++] = (a[i] <= a[j]) ? a[i++] : a[j++]; }\n        while (i <= m) t[k++] = a[i++];\n        while (j <= r) t[k++] = a[j++];\n        System.arraycopy(t, 0, a, l, t.length);\n    }\n    static void quick(int[] a, int lo, int hi) {\n        if (lo >= hi) return;\n        int p = a[hi], i = lo - 1;\n        for (int j = lo; j < hi; j++) {\n            c++;\n            if (a[j] < p) { i++; int t = a[i]; a[i] = a[j]; a[j] = t; }\n        }\n        int t = a[i + 1]; a[i + 1] = a[hi]; a[hi] = t;\n        quick(a, lo, i); quick(a, i + 2, hi);\n    }\n    static void run(String name, int[] src, int which) {\n        int[] a = src.clone(); c = 0;\n        switch (which) {\n            case 0 -> bubble(a);\n            case 1 -> selection(a);\n            case 2 -> insertion(a);\n            case 3 -> mergeSort(a, 0, a.length - 1);\n            default -> quick(a, 0, a.length - 1);\n        }\n        System.out.println(name + \" -> \" + Arrays.toString(a) + \"  comparisons = \" + c);\n    }\n    public static void main(String[] args) {\n        int[] data = {5, 2, 9, 1, 7, 3};\n        System.out.println(\"Input: \" + Arrays.toString(data));\n        String[] names = {\"Bubble   \", \"Selection \", \"Insertion \", \"Merge     \", \"Quick     \"};\n        for (int w = 0; w < 5; w++) run(names[w], data, w);\n    }\n}", "out": "Input: [5, 2, 9, 1, 7, 3]\nBubble    -> [1, 2, 3, 5, 7, 9]  comparisons = 14\nSelection  -> [1, 2, 3, 5, 7, 9]  comparisons = 15\nInsertion  -> [1, 2, 3, 5, 7, 9]  comparisons = 11\nMerge      -> [1, 2, 3, 5, 7, 9]  comparisons = 11\nQuick      -> [1, 2, 3, 5, 7, 9]  comparisons = 9", "cpp": {"f": "main.cpp", "c": "#include <iostream>\n#include <vector>\n#include <string>\n#include <algorithm>\nusing namespace std;\n\n// like Java's Arrays.toString\nstring str(const vector<int>& a) {\n    string s = \"[\";\n    for (size_t i = 0; i < a.size(); i++) s += (i ? \", \" : \"\") + to_string(a[i]);\n    return s + \"]\";\n}\nint c;\nvoid bubble(vector<int>& a) {\n    int n = a.size();\n    for (int i = 0; i < n - 1; i++) {\n        bool swapped = false;\n        for (int j = 0; j < n - 1 - i; j++) {\n            c++;\n            if (a[j] > a[j + 1]) { int t = a[j]; a[j] = a[j + 1]; a[j + 1] = t; swapped = true; }\n        }\n        if (!swapped) break;\n    }\n}\nvoid selection(vector<int>& a) {\n    int n = a.size();\n    for (int i = 0; i < n - 1; i++) {\n        int m = i;\n        for (int j = i + 1; j < n; j++) { c++; if (a[j] < a[m]) m = j; }\n        int t = a[i]; a[i] = a[m]; a[m] = t;\n    }\n}\nvoid insertion(vector<int>& a) {\n    for (int i = 1; i < (int)a.size(); i++) {\n        int key = a[i], j = i - 1;\n        while (j >= 0) {\n            c++;\n            if (a[j] > key) { a[j + 1] = a[j]; j--; } else break;\n        }\n        a[j + 1] = key;\n    }\n}\nvoid mergeSort(vector<int>& a, int l, int r) {\n    if (l >= r) return;\n    int m = (l + r) / 2;\n    mergeSort(a, l, m); mergeSort(a, m + 1, r);\n    vector<int> t(r - l + 1);\n    int i = l, j = m + 1, k = 0;\n    while (i <= m && j <= r) { c++; t[k++] = (a[i] <= a[j]) ? a[i++] : a[j++]; }\n    while (i <= m) t[k++] = a[i++];\n    while (j <= r) t[k++] = a[j++];\n    copy(t.begin(), t.end(), a.begin() + l);\n}\nvoid quick(vector<int>& a, int lo, int hi) {\n    if (lo >= hi) return;\n    int p = a[hi], i = lo - 1;\n    for (int j = lo; j < hi; j++) {\n        c++;\n        if (a[j] < p) { i++; int t = a[i]; a[i] = a[j]; a[j] = t; }\n    }\n    int t = a[i + 1]; a[i + 1] = a[hi]; a[hi] = t;\n    quick(a, lo, i); quick(a, i + 2, hi);\n}\nvoid run(string name, vector<int> a, int which) {   // a is a copy\n    c = 0;\n    switch (which) {\n        case 0: bubble(a); break;\n        case 1: selection(a); break;\n        case 2: insertion(a); break;\n        case 3: mergeSort(a, 0, a.size() - 1); break;\n        default: quick(a, 0, a.size() - 1);\n    }\n    cout << name << \" -> \" << str(a) << \"  comparisons = \" << c << endl;\n}\nint main() {\n    vector<int> data = {5, 2, 9, 1, 7, 3};\n    cout << \"Input: \" << str(data) << endl;\n    string names[] = {\"Bubble   \", \"Selection \", \"Insertion \", \"Merge     \", \"Quick     \"};\n    for (int w = 0; w < 5; w++) run(names[w], data, w);\n}\n"}, "clang": {"f": "main.c", "c": "#include <stdio.h>\n#include <stdlib.h>\n\n/* like Java's Arrays.toString */\nvoid prt(int a[], int n) {\n    printf(\"[\");\n    for (int i = 0; i < n; i++) printf(\"%s%d\", i ? \", \" : \"\", a[i]);\n    printf(\"]\");\n}\nint c;\nvoid bubble(int a[], int n) {\n    for (int i = 0; i < n - 1; i++) {\n        int swapped = 0;\n        for (int j = 0; j < n - 1 - i; j++) {\n            c++;\n            if (a[j] > a[j + 1]) { int t = a[j]; a[j] = a[j + 1]; a[j + 1] = t; swapped = 1; }\n        }\n        if (!swapped) break;\n    }\n}\nvoid selection(int a[], int n) {\n    for (int i = 0; i < n - 1; i++) {\n        int m = i;\n        for (int j = i + 1; j < n; j++) { c++; if (a[j] < a[m]) m = j; }\n        int t = a[i]; a[i] = a[m]; a[m] = t;\n    }\n}\nvoid insertion(int a[], int n) {\n    for (int i = 1; i < n; i++) {\n        int key = a[i], j = i - 1;\n        while (j >= 0) {\n            c++;\n            if (a[j] > key) { a[j + 1] = a[j]; j--; } else break;\n        }\n        a[j + 1] = key;\n    }\n}\nvoid mergeSort(int a[], int l, int r) {\n    if (l >= r) return;\n    int m = (l + r) / 2;\n    mergeSort(a, l, m); mergeSort(a, m + 1, r);\n    int t[20];\n    int i = l, j = m + 1, k = 0;\n    while (i <= m && j <= r) { c++; t[k++] = (a[i] <= a[j]) ? a[i++] : a[j++]; }\n    while (i <= m) t[k++] = a[i++];\n    while (j <= r) t[k++] = a[j++];\n    for (int x = 0; x < k; x++) a[l + x] = t[x];\n}\nvoid quick(int a[], int lo, int hi) {\n    if (lo >= hi) return;\n    int p = a[hi], i = lo - 1;\n    for (int j = lo; j < hi; j++) {\n        c++;\n        if (a[j] < p) { i++; int t = a[i]; a[i] = a[j]; a[j] = t; }\n    }\n    int t = a[i + 1]; a[i + 1] = a[hi]; a[hi] = t;\n    quick(a, lo, i); quick(a, i + 2, hi);\n}\nvoid run(const char *name, int src[], int n, int which) {\n    int a[20];\n    for (int i = 0; i < n; i++) a[i] = src[i];   /* work on a copy */\n    c = 0;\n    switch (which) {\n        case 0: bubble(a, n); break;\n        case 1: selection(a, n); break;\n        case 2: insertion(a, n); break;\n        case 3: mergeSort(a, 0, n - 1); break;\n        default: quick(a, 0, n - 1);\n    }\n    printf(\"%s -> \", name); prt(a, n); printf(\"  comparisons = %d\\n\", c);\n}\nint main() {\n    int data[] = {5, 2, 9, 1, 7, 3};\n    printf(\"Input: \"); prt(data, 6); printf(\"\\n\");\n    const char *names[] = {\"Bubble   \", \"Selection \", \"Insertion \", \"Merge     \", \"Quick     \"};\n    for (int w = 0; w < 5; w++) run(names[w], data, 6, w);\n    return 0;\n}\n"}}}, {"h": "When to use which", "p": ["Use the table and the data to decide. Here are the usual rules of thumb."], "pts": ["Insertion sort: small n (say below 20) or nearly sorted data. Also used inside hybrid sorts.", "Bubble sort: only for teaching, or to detect an already sorted list in O(n).", "Selection sort: when , "gives", "store / find"], "caption": "Key to index in one step"}}, {"h": "Hash functions", "p": ["A good hash function is fast to compute, spreads keys evenly over all slots and always gives the same index for the same key. Three classic methods are in the syllabus."], "pts": ["Division method: h(k) = k mod m. Choose m as a prime not close to a power of 2. Example: 85 mod 7 = 1.", "Mid-square method: square the key and take the middle digits. Example: k = 25, k^2 = 625, middle digit 2, so h(25) = 2.", "Folding method: split the key into equal parts, add the parts and take mod m. Example: k = 123456, parts 12 + 34 + 56 = 102, 102 mod 100 = 2."], "tip": "Division is the most used in exams because it is one line and easy to trace.", "table": {"head": ["Method", "Formula / idea", "Example (m = 10 or 100)"], "rows": [["Division", "k mod m", "85 mod 7 = 1"], ["Mid-square", "middle digits of k^2", "25^2 = 625 -> 2"], ["Folding", "add parts, then mod", "12+34+56 = 102 -> 02"]]}}, {"h": "Collisions", "p": ["A collision happens when two different keys give the same index, h(k1) = h(k2). Since there are far more possible keys than slots, collisions cannot be avoided completely. A good table design must handle them.", "Example with m = 7: keys 50 and 85 both give 1, so they collide."], "pts": ["Separate chaining: keep a list at each slot.", "Open addressing: find another free slot inside the table."], "viz": {"type": "cells", "items": ["700", "50", "", "", "", "", "76"], "labels": ["0", "1", "2", "3", "4", "5", "6"], "hl": [1], "caption": "Key 85 also maps to index 1: collision"}}, {"h": "Load factor", "p": ["Load factor (alpha) = n / m, where n is the number of stored keys and m the table size. It tells how full the table is.", "In chaining, alpha is the average chain length and can exceed 1. In open addressing alpha must stay below 1, and performance falls quickly once alpha goes above about 0.7. When alpha crosses a limit, the table is resized and all keys are rehashed."], "table": {"head": ["Alpha", "Meaning", "Effect"], "rows": [["0.2", "Mostly empty", "Very fast, wastes space"], ["0.7", "Good balance", "Common limit"], ["> 1", "Chaining only", "Long chains, slow"]]}}, {"h": "Chaining (separate chaining)", "p": ["Each slot of the table holds a linked list of all keys that hash to it. Insert adds the key to the list of its slot. Search walks only that one list. Delete removes the node from the list.", "The table never gets full, and deletion is easy. The cost is extra memory for pointers and slow search if one chain becomes long."], "pts": ["Insert: i = h(k); add node to list at table[i] (O(1) at head).", "Search: i = h(k); scan list at table[i], O(1 + alpha) average.", "Delete: find node in list and unlink it.", "Space O(m + n); worst case time O(n) when all keys land in one chain."], "tip": "Inserting at the head of the list keeps insert O(1), which is why 17 appears first in the chain.", "code": {"f": "Main.java", "c": "public class Main {\n    static class Node {\n        int key; Node next;\n        Node(int k) { key = k; }\n    }\n    static final int SIZE = 5;\n    static Node[] table = new Node[SIZE];\n    static void insert(int key) {\n        int i = key % SIZE;\n        Node n = new Node(key);\n        n.next = table[i];                    // add at head of chain\n        table[i] = n;\n    }\n    static boolean search(int key) {\n        for (Node p = table[key % SIZE]; p != null; p = p.next)\n            if (p.key == key) return true;\n        return false;\n    }\n    static void delete(int key) {\n        int i = key % SIZE;\n        Node p = table[i], prev = null;\n        while (p != null && p.key != key) { prev = p; p = p.next; }\n        if (p == null) return;\n        if (prev == null) table[i] = p.next; else prev.next = p.next;\n    }\n    static void print() {\n        for (int i = 0; i < SIZE; i++) {\n            StringBuilder sb = new StringBuilder(i + \": \");\n            for (Node p = table[i]; p != null; p = p.next) sb.append(p.key).append(\" -> \");\n            System.out.println(sb.append(\"null\"));\n        }\n    }\n    public static void main(String[] args) {\n        for (int k : new int[]{12, 22, 7, 17, 3, 10}) insert(k);\n        print();\n        System.out.println(\"search 17: \" + search(17));\n        delete(17);\n        System.out.println(\"search 17 after delete: \" + search(17));\n    }\n}", "out": "0: 10 -> null\n1: null\n2: 17 -> 7 -> 22 -> 12 -> null\n3: 3 -> null\n4: null\nsearch 17: true\nsearch 17 after delete: false", "cpp": {"f": "main.cpp", "c": "#include <iostream>\n#include <string>\nusing namespace std;\n\nstruct Node {\n    int key; Node* next;\n    Node(int k) : key(k), next(nullptr) {}\n};\nconst int SIZE = 5;\nNode* table[SIZE];                        // all nullptr (global)\nvoid insert(int key) {\n    int i = key % SIZE;\n    Node* n = new Node(key);\n    n->next = table[i];                   // add at head of chain\n    table[i] = n;\n}\nbool search(int key) {\n    for (Node* p = table[key % SIZE]; p != nullptr; p = p->next)\n        if (p->key == key) return true;\n    return false;\n}\nvoid del(int key) {\n    int i = key % SIZE;\n    Node *p = table[i], *prev = nullptr;\n    while (p != nullptr && p->key != key) { prev = p; p = p->next; }\n    if (p == nullptr) return;\n    if (prev == nullptr) table[i] = p->next; else prev->next = p->next;\n    delete p;\n}\nvoid print() {\n    for (int i = 0; i < SIZE; i++) {\n        string sb = to_string(i) + \": \";\n        for (Node* p = table[i]; p != nullptr; p = p->next) sb += to_string(p->key) + \" -> \";\n        cout << sb << \"null\" << endl;\n    }\n}\nint main() {\n    for (int k : {12, 22, 7, 17, 3, 10}) insert(k);\n    print();\n    cout << \"search 17: \" << boolalpha << search(17) << endl;\n    del(17);\n    cout << \"search 17 after delete: \" << search(17) << endl;\n}\n"}, "clang": {"f": "main.c", "c": "#include <stdio.h>\n#include <stdlib.h>\n#define SIZE 5\n\ntypedef struct Node { int key; struct Node *next; } Node;\nNode *table[SIZE];                        /* all NULL (global) */\nvoid insert(int key) {\n    int i = key % SIZE;\n    Node *n = malloc(sizeof(Node)); n->key = key;\n    n->next = table[i];                   /* add at head of chain */\n    table[i] = n;\n}\nint search(int key) {\n    for (Node *p = table[key % SIZE]; p != NULL; p = p->next)\n        if (p->key == key) return 1;\n    return 0;\n}\nvoid del(int key) {\n    int i = key % SIZE;\n    Node *p = table[i], *prev = NULL;\n    while (p != NULL && p->key != key) { prev = p; p = p->next; }\n    if (p == NULL) return;\n    if (prev == NULL) table[i] = p->next; else prev->next = p->next;\n    free(p);\n}\nvoid print() {\n    for (int i = 0; i < SIZE; i++) {\n        printf(\"%d: \", i);\n        for (Node *p = table[i]; p != NULL; p = p->next) printf(\"%d -> \", p->key);\n        printf(\"null\\n\");\n    }\n}\nint main() {\n    int keys[] = {12, 22, 7, 17, 3, 10};\n    for (int i = 0; i < 6; i++) insert(keys[i]);\n    print();\n    printf(\"search 17: %s\\n\", search(17) ? \"true\" : \"false\");\n    del(17);\n    printf(\"search 17 after delete: %s\\n\", search(17) ? \"true\" : \"false\");\n    return 0;\n}\n"}}, "viz": {"type": "chain", "items": ["table[2]", "17", "7", "22", "12", "null"], "labels": ["", "next", "next", "next", "next"], "caption": "Keys 12, 22, 7, 17 all give index 2 (m = 5)"}}, {"h": "Open addressing: linear probing", "p": ["In open addressing every key is stored in the table itself. If the slot h(k) is full, we probe (try) other slots in a fixed sequence until a free one is found. In linear probing the probe sequence is h(k), h(k)+1, h(k)+2, ... all taken mod m: index = (h(k) + i) mod m.", "Search follows the same sequence and stops at an empty slot (key absent). The weakness is primary clustering: long runs of filled slots build up and slow every operation. Deleting needs a special marker (tombstone), not simply emptying the slot."], "pts": ["Insert: i = k mod m; while table[i] is full, i = (i + 1) mod m; store key.", "Search: same probing; found if key matches, absent if an empty slot is reached.", "Trace (m = 7): 50 -> 1; 700 -> 0; 76 -> 6; 85 -> 1 full, 2 free; 92 -> 1, 2 full, 3 free."], "code": {"f": "Main.java", "c": "import java.util.Arrays;\npublic class Main {\n    static final int SIZE = 7;\n    static int[] table = new int[SIZE];      // 0 = empty slot (keys are positive)\n    static void insert(int key) {\n        int i = key % SIZE;\n        int tries = 0;\n        while (table[i] != 0 && tries < SIZE) {\n            System.out.println(\"  collision at \" + i + \" for key \" + key);\n            i = (i + 1) % SIZE;               // linear probe\n            tries++;\n        }\n        if (tries == SIZE) { System.out.println(\"Table full\"); return; }\n        table[i] = key;\n    }\n    static int search(int key) {\n        int i = key % SIZE;\n        for (int tries = 0; tries < SIZE && table[i] != 0; tries++) {\n            if (table[i] == key) return i;\n            i = (i + 1) % SIZE;\n        }\n        return -1;\n    }\n    public static void main(String[] args) {\n        for (int k : new int[]{50, 700, 76, 85, 92}) insert(k);\n        System.out.println(Arrays.toString(table));\n        System.out.println(\"search 85 -> index \" + search(85));\n        System.out.println(\"search 99 -> index \" + search(99));\n    }\n}", "out": "  collision at 1 for key 85\n  collision at 1 for key 92\n  collision at 2 for key 92\n[700, 50, 85, 92, 0, 0, 76]\nsearch 85 -> index 2\nsearch 99 -> index -1", "cpp": {"f": "main.cpp", "c": "#include <iostream>\n#include <string>\nusing namespace std;\n\nconst int SIZE = 7;\nint table[SIZE];      // 0 = empty slot (keys are positive)\n// print like Java's Arrays.toString\nstring str() {\n    string s = \"[\";\n    for (int i = 0; i < SIZE; i++) s += (i ? \", \" : \"\") + to_string(table[i]);\n    return s + \"]\";\n}\nvoid insert(int key) {\n    int i = key % SIZE;\n    int tries = 0;\n    while (table[i] != 0 && tries < SIZE) {\n        cout << \"  collision at \" << i << \" for key \" << key << endl;\n        i = (i + 1) % SIZE;               // linear probe\n        tries++;\n    }\n    if (tries == SIZE) { cout << \"Table full\" << endl; return; }\n    table[i] = key;\n}\nint search(int key) {\n    int i = key % SIZE;\n    for (int tries = 0; tries < SIZE && table[i] != 0; tries++) {\n        if (table[i] == key) return i;\n        i = (i + 1) % SIZE;\n    }\n    return -1;\n}\nint main() {\n    for (int k : {50, 700, 76, 85, 92}) insert(k);\n    cout << str() << endl;\n    cout << \"search 85 -> index \" << search(85) << endl;\n    cout << \"search 99 -> index \" << search(99) << endl;\n}\n"}, "clang": {"f": "main.c", "c": "#include <stdio.h>\n#define SIZE 7\n\nint table[SIZE];      /* 0 = empty slot (keys are positive) */\n/* print like Java's Arrays.toString */\nvoid str() {\n    printf(\"[\");\n    for (int i = 0; i < SIZE; i++) printf(\"%s%d\", i ? \", \" : \"\", table[i]);\n    printf(\"]\\n\");\n}\nvoid insert(int key) {\n    int i = key % SIZE;\n    int tries = 0;\n    while (table[i] != 0 && tries < SIZE) {\n        printf(\"  collision at %d for key %d\\n\", i, key);\n        i = (i + 1) % SIZE;               /* linear probe */\n        tries++;\n    }\n    if (tries == SIZE) { printf(\"Table full\\n\"); return; }\n    table[i] = key;\n}\nint search(int key) {\n    int i = key % SIZE;\n    for (int tries = 0; tries < SIZE && table[i] != 0; tries++) {\n        if (table[i] == key) return i;\n        i = (i + 1) % SIZE;\n    }\n    return -1;\n}\nint main() {\n    int keys[] = {50, 700, 76, 85, 92};\n    for (int i = 0; i < 5; i++) insert(keys[i]);\n    str();\n    printf(\"search 85 -> index %d\\n\", search(85));\n    printf(\"search 99 -> index %d\\n\", search(99));\n    return 0;\n}\n"}}, "viz": {"type": "cells", "items": ["700", "50", "85", "92", "", "", "76"], "labels": ["0", "1", "2", "3", "4", "5", "6"], "hl": [2, 3], "caption": "After inserting 50, 700, 76, 85, 92 (85 and 92 were shifted by probing)"}}, {"h": "Open addressing: quadratic probing and double hashing", "p": ["Quadratic probing uses index = (h(k) + i^2) mod m, so the probes jump 1, 4, 9, ... slots away. It removes primary clustering but causes a milder secondary clustering (keys with the same start follow the same path). To guarantee a free slot is found, keep m prime and alpha below 0.5.", "Double hashing uses a second hash function: index = (h1(k) + i * h2(k)) mod m, for example h2(k) = 5 - (k mod 5). The step size depends on the key, so different keys follow different paths and clustering is least. h2(k) must never be 0."], "tip": "Example, m = 11, key 27 collides at index 5: quadratic tries 6, 9, 3 ... (5+1, 5+4, 5+9 = 14 mod 11).", "table": {"head": ["Method", "Probe i-th slot", "Clustering"], "rows": [["Linear", "(h + i) mod m", "Primary"], ["Quadratic", "(h + i^2) mod m", "Secondary"], ["Double hashing", "(h1 + i*h2) mod m", "Least"]]}}, {"h": "Complexity, uses, pros and cons", "p": ["With a good hash function and a low load factor, the expected cost is O(1). In the worst case all keys collide and operations become O(n).", "Space is O(m) for open addressing and O(m + n) for chaining."], "table": {"head": ["Operation", "Average", "Worst", "Space"], "rows": [["Insert", "O(1)", "O(n)", "O(n)"], ["Search", "O(1)", "O(n)", "O(n)"], ["Delete", "O(1)", "O(n)", "O(n)"]]}}], "analogy": "A hash table is like a hostel with numbered lockers. Your roll number is converted into a locker number by a rule; you do not search all lockers. If two students get the same locker, you need a rule for who goes where.", "hinglish": "Bhai hashing me key ko ek formula (hash function) se array ke index me badal dete hain, isliye search lagbhag O(1) me ho jata hai. Jab do keys same index pe aayein to collision hota hai. Isse chaining ya open addressing (linear, quadratic, double hashing) se handle karte hain. Load factor = n/m, jitna kam utna acha.", "mistakes": ["Using a table size m that is a power of 2 or has many factors with division hashing.", "Deleting from open addressing by just emptying the slot; it breaks later searches (use a tombstone).", "Letting h2(k) be 0 in double hashing.", "Saying chaining needs load factor below 1; it can exceed 1."], "remember": ["Hashing maps a key to an index by a hash function; the array is the hash table.", "Division: h(k) = k mod m (m prime is best).", "Mid-square: square the key and take the middle digits.", "Folding: split key into parts, add them, then mod m.", "Collision: h(k1) = h(k2) for different keys.", "Chaining: each slot has a linked list; table never overflows.", "Open addressing: all keys stay in the table; probe for a free slot.", "Linear probing (h+i) mod m causes primary clustering.", "Quadratic probing (h+i^2) mod m causes secondary clustering.", "Double hashing (h1 + i*h2) mod m gives the least clustering.", "Load factor alpha = n / m; resize and rehash when too high.", "Average O(1) for insert, search, delete; worst O(n)."], "uses": ["Dictionaries, maps and sets (Java HashMap, HashSet).", "Database indexing and caches.", "Symbol tables in compilers.", "Password storage and checksums (cryptographic hashing).", "Counting frequencies and detecting duplicates quickly."], "pros": ["Average O(1) search, insert and delete.", "Simple to implement for key-value lookup.", "Works well for large data sets."], "cons": ["Worst case O(n) when many collisions occur.", "Does not keep keys in sorted order.", "Needs good hash function and resizing; open addressing is hard to delete from."], "def": "Hashing is a technique to store and find data directly using a key, without comparing against every element. A hash function h converts the key into an index of an array called the hash table."}, "u5-t4": {"tldr": "A BST keeps smaller keys on the left and larger keys on the right, so search, insert and delete follow one path.", "sections": [{"h": "What is a Binary Search Tree?", "p": ["BST property: for every node, all keys in its left subtree are smaller than the node's key, and all keys in its right subtree are greater. This must hold for every node, not only the root. Duplicates are usually not allowed (or kept on one fixed side)."], "pts": ["Each node stores key, left pointer and right pointer.", "The leftmost node is the minimum; the rightmost is the maximum."], "viz": {"type": "btree", "nodes": ["50", "30", "70", "20", "40", "60", "80"], "caption": "A valid BST: left < 50 < right at every node"}}, {"h": "Search", "p": ["Searching starts at the root and uses the BST property to decide the direction, so half of the remaining tree is ignored at each step."], "pts": ["Step 1: if the tree is empty, key not found.", "Step 2: if key equals root key, found.", "Step 3: if key < root key, search the left subtree.", "Step 4: otherwise search the right subtree.", "Time O(h): O(log n) balanced, O(n) skewed. Space O(h) for recursion (O(1) if iterative)."], "table": {"head": ["Step", "What happens"], "rows": [["1. Compare 60 with 50", "60 > 50, go right"], ["2. Compare 60 with 70", "60 < 70, go left"], ["3. Compare 60 with 60", "Equal: found"]]}}, {"h": "Insert", "p": ["A new key is always inserted as a leaf. We search for the key; when we reach a null link, a new node is created there. The tree shape depends on the insertion order."], "pts": ["Step 1: if root is null, create node and return it.", "Step 2: if key < root key, root.left = insert(root.left, key).", "Step 3: if key > root key, root.right = insert(root.right, key).", "Step 4: return root.", "Time O(h), space O(h)."], "viz": {"type": "btree", "nodes": ["50", "30", "70", "20", "40", "60", "80", null, null, null, "45"], "caption": "After inserting 45: 45 < 50, 45 > 30, 45 > 40, so it becomes the right child of 40"}}, {"h": "Delete: three cases", "p": ["Deletion is the hardest operation because the BST property must remain true afterwards. First find the node, then apply one of three cases."], "pts": ["Case 1, leaf (no child): simply remove it. Example: delete 20.", "Case 2, one child: replace the node by its only child. Example: delete 30 when 20 is gone (30 has only child 40).", "Case 3, two children: copy the inorder successor (smallest key of the right subtree) into the node, then delete that successor from the right subtree. The inorder predecessor works too. Example: delete 50, successor is 60.", "Time O(h), space O(h)."], "tip": "Inorder successor = go right once, then keep going left as far as possible.", "viz": {"type": "btree", "nodes": ["60", "40", "70", null, null, null, "80"], "caption": "Case 3 result: 50 deleted, replaced by successor 60 (30 and 20 deleted earlier)"}}, {"h": "Inorder traversal gives sorted order", "p": ["Inorder traversal visits left subtree, node, then right subtree. Because of the BST property, smaller keys are visited before larger ones, so the output is always in ascending order. This is the easiest way to check whether a tree is a valid BST, and the reason a BST can sort data (tree sort).", "For the tree shown earlier, inorder gives 20 30 40 50 60 70 80. Time O(n), space O(h)."], "viz": {"type": "chain", "items": ["20", "30", "40", "50", "60", "70", "80"], "caption": "Inorder output of the BST: ascending"}}, {"h": "Java code with a traced example", "p": ["The program builds the tree 50, 30, 70, 20, 40, 60, 80 and then deletes a leaf (20), a node with one child (30) and a node with two children (50). Each output line is the inorder traversal after the step. The new root after deleting 50 is its successor 60."], "code": {"f": "Main.java", "c": "public class Main {\n    static class Node {\n        int key; Node left, right;\n        Node(int k) { key = k; }\n    }\n    static Node insert(Node root, int key) {\n        if (root == null) return new Node(key);\n        if (key < root.key) root.left = insert(root.left, key);\n        else if (key > root.key) root.right = insert(root.right, key);\n        return root;                          // duplicates ignored\n    }\n    static boolean search(Node root, int key) {\n        if (root == null) return false;\n        if (key == root.key) return true;\n        return key < root.key ? search(root.left, key) : search(root.right, key);\n    }\n    static Node minNode(Node n) { while (n.left != null) n = n.left; return n; }\n    static Node delete(Node root, int key) {\n        if (root == null) return null;\n        if (key < root.key) root.left = delete(root.left, key);\n        else if (key > root.key) root.right = delete(root.right, key);\n        else {\n            if (root.left == null) return root.right;      // case 1 and 2\n            if (root.right == null) return root.left;      // case 2\n            Node s = minNode(root.right);                  // case 3: inorder successor\n            root.key = s.key;\n            root.right = delete(root.right, s.key);\n        }\n        return root;\n    }\n    static void inorder(Node r) {\n        if (r == null) return;\n        inorder(r.left); System.out.print(r.key + \" \"); inorder(r.right);\n    }\n    public static void main(String[] args) {\n        Node root = null;\n        for (int k : new int[]{50, 30, 70, 20, 40, 60, 80}) root = insert(root, k);\n        System.out.print(\"Inorder: \"); inorder(root); System.out.println();\n        System.out.println(\"search 60: \" + search(root, 60) + \", search 65: \" + search(root, 65));\n        root = delete(root, 20); System.out.print(\"Delete 20 (leaf): \"); inorder(root); System.out.println();\n        root = delete(root, 30); System.out.print(\"Delete 30 (one child): \"); inorder(root); System.out.println();\n        root = delete(root, 50); System.out.print(\"Delete 50 (two children): \"); inorder(root); System.out.println();\n        System.out.println(\"New root: \" + root.key);\n    }\n}", "out": "Inorder: 20 30 40 50 60 70 80 \nsearch 60: true, search 65: false\nDelete 20 (leaf): 30 40 50 60 70 80 \nDelete 30 (one child): 40 50 60 70 80 \nDelete 50 (two children): 40 60 70 80 \nNew root: 60", "cpp": {"f": "main.cpp", "c": "#include <iostream>\nusing namespace std;\n\nstruct Node {\n    int key; Node *left, *right;\n    Node(int k) : key(k), left(nullptr), right(nullptr) {}\n};\nNode* insert(Node* root, int key) {\n    if (root == nullptr) return new Node(key);\n    if (key < root->key) root->left = insert(root->left, key);\n    else if (key > root->key) root->right = insert(root->right, key);\n    return root;                          // duplicates ignored\n}\nbool search(Node* root, int key) {\n    if (root == nullptr) return false;\n    if (key == root->key) return true;\n    return key < root->key ? search(root->left, key) : search(root->right, key);\n}\nNode* minNode(Node* n) { while (n->left != nullptr) n = n->left; return n; }\nNode* del(Node* root, int key) {\n    if (root == nullptr) return nullptr;\n    if (key < root->key) root->left = del(root->left, key);\n    else if (key > root->key) root->right = del(root->right, key);\n    else {\n        if (root->left == nullptr) return root->right;      // case 1 and 2\n        if (root->right == nullptr) return root->left;      // case 2\n        Node* s = minNode(root->right);                     // case 3: inorder successor\n        root->key = s->key;\n        root->right = del(root->right, s->key);\n    }\n    return root;\n}\nvoid inorder(Node* r) {\n    if (r == nullptr) return;\n    inorder(r->left); cout << r->key << \" \"; inorder(r->right);\n}\nint main() {\n    Node* root = nullptr;\n    for (int k : {50, 30, 70, 20, 40, 60, 80}) root = insert(root, k);\n    cout << \"Inorder: \"; inorder(root); cout << endl;\n    cout << boolalpha << \"search 60: \" << search(root, 60) << \", search 65: \" << search(root, 65) << endl;\n    root = del(root, 20); cout << \"Delete 20 (leaf): \"; inorder(root); cout << endl;\n    root = del(root, 30); cout << \"Delete 30 (one child): \"; inorder(root); cout << endl;\n    root = del(root, 50); cout << \"Delete 50 (two children): \"; inorder(root); cout << endl;\n    cout << \"New root: \" << root->key << endl;\n}\n"}, "clang": {"f": "main.c", "c": "#include <stdio.h>\n#include <stdlib.h>\n\ntypedef struct Node { int key; struct Node *left, *right; } Node;\nNode *mk(int k) { Node *n = malloc(sizeof(Node)); n->key = k; n->left = n->right = NULL; return n; }\n\nNode *insert(Node *root, int key) {\n    if (root == NULL) return mk(key);\n    if (key < root->key) root->left = insert(root->left, key);\n    else if (key > root->key) root->right = insert(root->right, key);\n    return root;                          /* duplicates ignored */\n}\nint search(Node *root, int key) {\n    if (root == NULL) return 0;\n    if (key == root->key) return 1;\n    return key < root->key ? search(root->left, key) : search(root->right, key);\n}\nNode *minNode(Node *n) { while (n->left != NULL) n = n->left; return n; }\nNode *del(Node *root, int key) {\n    if (root == NULL) return NULL;\n    if (key < root->key) root->left = del(root->left, key);\n    else if (key > root->key) root->right = del(root->right, key);\n    else {\n        if (root->left == NULL) { Node *r = root->right; free(root); return r; }   /* case 1 and 2 */\n        if (root->right == NULL) { Node *l = root->left; free(root); return l; }   /* case 2 */\n        Node *s = minNode(root->right);                     /* case 3: inorder successor */\n        root->key = s->key;\n        root->right = del(root->right, s->key);\n    }\n    return root;\n}\nvoid inorder(Node *r) {\n    if (r == NULL) return;\n    inorder(r->left); printf(\"%d \", r->key); inorder(r->right);\n}\nint main() {\n    Node *root = NULL;\n    int keys[] = {50, 30, 70, 20, 40, 60, 80};\n    for (int i = 0; i < 7; i++) root = insert(root, keys[i]);\n    printf(\"Inorder: \"); inorder(root); printf(\"\\n\");\n    printf(\"search 60: %s, search 65: %s\\n\", search(root, 60) ? \"true\" : \"false\", search(root, 65) ? \"true\" : \"false\");\n    root = del(root, 20); printf(\"Delete 20 (leaf): \"); inorder(root); printf(\"\\n\");\n    root = del(root, 30); printf(\"Delete 30 (one child): \"); inorder(root); printf(\"\\n\");\n    root = del(root, 50); printf(\"Delete 50 (two children): \"); inorder(root); printf(\"\\n\");\n    printf(\"New root: %d\\n\", root->key);\n    return 0;\n}\n"}}}, {"h": "Complexity", "p": ["All operations walk one root-to-leaf path, so their cost is O(h) where h is the height. For a balanced tree h = log n. If keys come in sorted order, every node has one child and the tree becomes a linked list with h = n. Self-balancing trees like AVL fix this."], "table": {"head": ["Operation", "Best / balanced", "Worst (skewed)", "Space"], "rows": [["Search", "O(log n)", "O(n)", "O(h)"], ["Insert", "O(log n)", "O(n)", "O(h)"], ["Delete", "O(log n)", "O(n)", "O(h)"], ["Inorder", "O(n)", "O(n)", "O(h)"]]}}], "analogy": "A BST is like the number-guessing game: at each step you compare and throw away half of the choices. Each node asks 'is my key smaller or bigger?' and sends you left or right.", "hinglish": "Bhai BST me har node ke left me chhoti keys aur right me badi keys hoti hain. Isliye search me har step pe aadha tree chhod dete hain. Delete ke teen cases hain: leaf, ek child, do children (inorder successor se replace). Inorder traversal sorted output deta hai. Sorted input daalo to tree ek line ban jata hai aur O(n) lagta hai.", "mistakes": ["Checking only the parent and child instead of the whole subtree when validating a BST.", "Forgetting to handle the two-children case with the successor.", "Assuming BST operations are always O(log n); they are O(n) for a skewed tree.", "Inserting duplicates without a rule."], "remember": ["BST: binary tree where left subtree keys < node key < right subtree keys.", "The property holds at every node, not only at the root.", "Search / insert / delete follow one path: O(h).", "Insert always adds a new leaf.", "Delete case 1: leaf, just remove.", "Delete case 2: one child, replace node with that child.", "Delete case 3: two children, replace with inorder successor (or predecessor) and delete that node.", "Inorder successor = leftmost node of the right subtree.", "Inorder traversal of a BST is sorted ascending.", "Balanced BST: height log n, so O(log n). Skewed BST: O(n).", "Sorted insertion order gives a skewed tree.", "Min = leftmost node, max = rightmost node."], "uses": ["Dictionaries and sets with ordered keys (Java TreeMap and TreeSet use balanced variants).", "Database indexes and range queries.", "Sorting by inserting keys and doing inorder traversal.", "Finding floor, ceiling, minimum and maximum quickly."], "pros": ["Search, insert and delete are O(log n) when balanced.", "Keeps data sorted; inorder gives sorted output.", "Simple to implement with recursion."], "cons": ["Can degrade to O(n) for sorted input.", "Needs extra memory for two pointers per node.", "Deletion is more complex than insertion."], "def": "A Binary Search Tree (BST) is a binary tree in which every node has at most two children and the keys are arranged by a rule, called the BST property."}, "u5-t5": {"tldr": "An AVL tree is a self-balancing BST that keeps the height difference of subtrees within 1 using four rotations.", "sections": [{"h": "What is an AVL tree?", "p": ["A plain BST can become a long chain for sorted input, making operations O(n). An AVL tree fixes the shape after every insert or delete using rotations, so the height always stays O(log n)."], "viz": {"type": "btree", "nodes": ["30", "20", "40", "10", "25", null, "50"], "caption": "A valid AVL tree: no node has height difference above 1"}}, {"h": "Balance factor", "p": ["Balance factor (BF) of a node = height(left subtree) - height(right subtree). The height of an empty tree is 0 (some books use -1; the difference is the same).", "A node is balanced if BF is -1, 0 or +1. If BF becomes +2 or -2 the node is unbalanced and a rotation is needed. BF = +2 means left heavy; BF = -2 means right heavy."], "pts": ["The first unbalanced node found on the way back up from the inserted leaf is the one we fix.", "One fix (single or double rotation) restores balance for the whole tree after an insertion."], "table": {"head": ["BF", "Meaning", "Action"], "rows": [["0", "Equal heights", "None"], ["+1", "Left slightly taller", "None"], ["-1", "Right slightly taller", "None"], ["+2", "Left heavy", "Rotate right side"], ["-2", "Right heavy", "Rotate left side"]]}}, {"h": "Four imbalance cases and rotations", "p": ["Let z be the lowest unbalanced node and y its taller child. Depending on where the new key went, there are four cases. The rotation keeps the BST property: inorder order never changes.", "In each diagram below the three nodes involved are 10 < 20 < 30. After the rotation the middle value 20 becomes the root of that part."], "table": {"head": ["Case", "Where inserted", "BF of z", "Fix"], "rows": [["LL", "Left of left child", "+2", "Single right rotation"], ["RR", "Right of right child", "-2", "Single left rotation"], ["LR", "Right of left child", "+2", "Left rotate child, then right rotate z"], ["RL", "Left of right child", "-2", "Right rotate child, then left rotate z"]]}}, {"h": "LL case: right rotation", "p": ["The new key is inserted into the left subtree of the left child. The tree leans left in a straight line. Fix: rotate z to the right. The left child y becomes the root, z becomes y's right child, and y's old right subtree becomes z's left subtree.", "Example: inserting 10 after 30 and 20."], "pts": ["Step 1: y = z.left", "Step 2: z.left = y.right", "Step 3: y.right = z", "Step 4: update heights of z then y, return y"], "viz": {"type": "btree", "nodes": ["30", "20", null, "10"], "caption": "Before: 30 has BF +2 (LL case)"}}, {"h": "LL case - after rotation", "p": ["Result after the rotation. The inorder order 10, 20, 30 is unchanged, the height is reduced and every BF is 0."], "viz": {"type": "btree", "nodes": ["20", "10", "30"], "caption": "After right rotation at 30: balanced, 20 is the root"}}, {"h": "RR case: left rotation", "p": ["The new key goes into the right subtree of the right child. The tree leans right in a straight line. Fix: rotate z to the left. The right child y becomes the root, z becomes y's left child, and y's old left subtree becomes z's right subtree.", "Example: inserting 30 after 10 and 20."], "pts": ["Step 1: y = z.right", "Step 2: z.right = y.left", "Step 3: y.left = z", "Step 4: update heights of z then y, return y"], "viz": {"type": "btree", "nodes": ["10", null, "20", null, null, null, "30"], "caption": "Before: 10 has BF -2 (RR case)"}}, {"h": "RR case - after rotation", "p": ["Result after the rotation. The inorder order 10, 20, 30 is unchanged, the height is reduced and every BF is 0."], "viz": {"type": "btree", "nodes": ["20", "10", "30"], "caption": "After left rotation at 10: balanced"}}, {"h": "LR case: left-right double rotation", "p": ["The new key goes into the right subtree of the left child. The path bends (zig-zag), so one rotation is not enough. First rotate the left child to the left (this turns it into an LL case), then rotate z to the right.", "Example: inserting 20 after 30 and 10."], "pts": ["Step 1: z.left = rotateLeft(z.left)", "Step 2: return rotateRight(z)", "After step 1 the tree is 30 -> 20 -> 10 in a straight line (LL)."], "viz": {"type": "btree", "nodes": ["30", "10", null, null, "20"], "caption": "Before: 30 has BF +2, but its left child 10 leans right (LR case)"}}, {"h": "LR case - after rotation", "p": ["Result after the rotation. The inorder order 10, 20, 30 is unchanged, the height is reduced and every BF is 0."], "viz": {"type": "btree", "nodes": ["20", "10", "30"], "caption": "After left rotation at 10, then right rotation at 30"}}, {"h": "RL case: right-left double rotation", "p": ["The new key goes into the left subtree of the right child. Again the path bends. First rotate the right child to the right (turning it into an RR case), then rotate z to the left.", "Example: inserting 20 after 10 and 30."], "pts": ["Step 1: z.right = rotateRight(z.right)", "Step 2: return rotateLeft(z)", "After step 1 the tree is 10 -> 20 -> 30 in a straight line (RR)."], "viz": {"type": "btree", "nodes": ["10", null, "30", null, null, "20"], "caption": "Before: 10 has BF -2, but its right child 30 leans left (RL case)"}}, {"h": "RL case - after rotation", "p": ["Result after the rotation. The inorder order 10, 20, 30 is unchanged, the height is reduced and every BF is 0."], "viz": {"type": "btree", "nodes": ["20", "10", "30"], "caption": "After right rotation at 30, then left rotation at 10"}}, {"h": "Insertion algorithm", "p": ["Insertion is a normal BST insert followed by rebalancing on the way back up the recursion.", "Delete works the same way: do the BST delete, then update heights and rebalance each ancestor."], "pts": ["Step 1: insert the key as in a BST.", "Step 2: update the height of every ancestor.", "Step 3: compute BF of each ancestor.", "Step 4: if BF is +2 and key < left.key, LL: rotate right. If BF is +2 and key > left.key, LR.", "Step 5: if BF is -2 and key > right.key, RR: rotate left. If BF is -2 and key < right.key, RL.", "At most one rotation (single or double) is needed per insert. Time O(log n), space O(log n)."], "table": {"head": ["Step", "What happens"], "rows": [["1. BST insert", "Add key as a leaf"], ["2. Update heights", "On the way back up"], ["3. Check BF", "Is it +2 or -2?"], ["4. Rotate", "LL, RR, LR or RL"]]}}, {"h": "Java code: rotations and insert", "p": ["Each node stores its height. The program inserts 10, 20, 30, 40, 50, 25. Trace: inserting 30 triggers an RR rotation (root becomes 20); inserting 50 triggers an RR rotation at 30 (40 rises); inserting 25 makes node 20 unbalanced with BF -2 and is an RL case, so the tree ends with root 30. Inorder is sorted and the height is 3 for 6 nodes."], "code": {"f": "Main.java", "c": "public class Main {\n    static class Node {\n        int key, h = 1; Node left, right;\n        Node(int k) { key = k; }\n    }\n    static int h(Node n) { return n == null ? 0 : n.h; }\n    static int bf(Node n) { return n == null ? 0 : h(n.left) - h(n.right); }\n    static void upd(Node n) { n.h = 1 + Math.max(h(n.left), h(n.right)); }\n    static Node rotateRight(Node y) {         // fixes LL\n        Node x = y.left;\n        y.left = x.right;\n        x.right = y;\n        upd(y); upd(x);\n        return x;\n    }\n    static Node rotateLeft(Node x) {          // fixes RR\n        Node y = x.right;\n        x.right = y.left;\n        y.left = x;\n        upd(x); upd(y);\n        return y;\n    }\n    static Node insert(Node n, int key) {\n        if (n == null) return new Node(key);\n        if (key < n.key) n.left = insert(n.left, key);\n        else if (key > n.key) n.right = insert(n.right, key);\n        else return n;\n        upd(n);\n        int b = bf(n);\n        if (b > 1 && key < n.left.key) return rotateRight(n);             // LL\n        if (b < -1 && key > n.right.key) return rotateLeft(n);            // RR\n        if (b > 1 && key > n.left.key) { n.left = rotateLeft(n.left); return rotateRight(n); }   // LR\n        if (b < -1 && key < n.right.key) { n.right = rotateRight(n.right); return rotateLeft(n); } // RL\n        return n;\n    }\n    static void inorder(Node r) {\n        if (r == null) return;\n        inorder(r.left); System.out.print(r.key + \" \"); inorder(r.right);\n    }\n    static void preorder(Node r) {\n        if (r == null) return;\n        System.out.print(r.key + \" \"); preorder(r.left); preorder(r.right);\n    }\n    public static void main(String[] args) {\n        Node root = null;\n        for (int k : new int[]{10, 20, 30, 40, 50, 25}) root = insert(root, k);\n        System.out.print(\"Inorder:  \"); inorder(root); System.out.println();\n        System.out.print(\"Preorder: \"); preorder(root); System.out.println();\n        System.out.println(\"Root = \" + root.key + \", height = \" + h(root) + \", balance factor of root = \" + bf(root));\n    }\n}", "out": "Inorder:  10 20 25 30 40 50 \nPreorder: 30 20 10 25 40 50 \nRoot = 30, height = 3, balance factor of root = 0", "cpp": {"f": "main.cpp", "c": "#include <iostream>\n#include <algorithm>\nusing namespace std;\n\nstruct Node {\n    int key, h = 1; Node *left, *right;\n    Node(int k) : key(k), left(nullptr), right(nullptr) {}\n};\nint h(Node* n) { return n == nullptr ? 0 : n->h; }\nint bf(Node* n) { return n == nullptr ? 0 : h(n->left) - h(n->right); }\nvoid upd(Node* n) { n->h = 1 + max(h(n->left), h(n->right)); }\nNode* rotateRight(Node* y) {         // fixes LL\n    Node* x = y->left;\n    y->left = x->right;\n    x->right = y;\n    upd(y); upd(x);\n    return x;\n}\nNode* rotateLeft(Node* x) {          // fixes RR\n    Node* y = x->right;\n    x->right = y->left;\n    y->left = x;\n    upd(x); upd(y);\n    return y;\n}\nNode* insert(Node* n, int key) {\n    if (n == nullptr) return new Node(key);\n    if (key < n->key) n->left = insert(n->left, key);\n    else if (key > n->key) n->right = insert(n->right, key);\n    else return n;\n    upd(n);\n    int b = bf(n);\n    if (b > 1 && key < n->left->key) return rotateRight(n);             // LL\n    if (b < -1 && key > n->right->key) return rotateLeft(n);            // RR\n    if (b > 1 && key > n->left->key) { n->left = rotateLeft(n->left); return rotateRight(n); }   // LR\n    if (b < -1 && key < n->right->key) { n->right = rotateRight(n->right); return rotateLeft(n); } // RL\n    return n;\n}\nvoid inorder(Node* r) {\n    if (r == nullptr) return;\n    inorder(r->left); cout << r->key << \" \"; inorder(r->right);\n}\nvoid preorder(Node* r) {\n    if (r == nullptr) return;\n    cout << r->key << \" \"; preorder(r->left); preorder(r->right);\n}\nint main() {\n    Node* root = nullptr;\n    for (int k : {10, 20, 30, 40, 50, 25}) root = insert(root, k);\n    cout << \"Inorder:  \"; inorder(root); cout << endl;\n    cout << \"Preorder: \"; preorder(root); cout << endl;\n    cout << \"Root = \" << root->key << \", height = \" << h(root) << \", balance factor of root = \" << bf(root) << endl;\n}\n"}, "clang": {"f": "main.c", "c": "#include <stdio.h>\n#include <stdlib.h>\n\ntypedef struct Node { int key, h; struct Node *left, *right; } Node;\nNode *mk(int k) { Node *n = malloc(sizeof(Node)); n->key = k; n->h = 1; n->left = n->right = NULL; return n; }\n\nint max(int a, int b) { return a > b ? a : b; }\nint h(Node *n) { return n == NULL ? 0 : n->h; }\nint bf(Node *n) { return n == NULL ? 0 : h(n->left) - h(n->right); }\nvoid upd(Node *n) { n->h = 1 + max(h(n->left), h(n->right)); }\nNode *rotateRight(Node *y) {         /* fixes LL */\n    Node *x = y->left;\n    y->left = x->right;\n    x->right = y;\n    upd(y); upd(x);\n    return x;\n}\nNode *rotateLeft(Node *x) {          /* fixes RR */\n    Node *y = x->right;\n    x->right = y->left;\n    y->left = x;\n    upd(x); upd(y);\n    return y;\n}\nNode *insert(Node *n, int key) {\n    if (n == NULL) return mk(key);\n    if (key < n->key) n->left = insert(n->left, key);\n    else if (key > n->key) n->right = insert(n->right, key);\n    else return n;\n    upd(n);\n    int b = bf(n);\n    if (b > 1 && key < n->left->key) return rotateRight(n);             /* LL */\n    if (b < -1 && key > n->right->key) return rotateLeft(n);            /* RR */\n    if (b > 1 && key > n->left->key) { n->left = rotateLeft(n->left); return rotateRight(n); }   /* LR */\n    if (b < -1 && key < n->right->key) { n->right = rotateRight(n->right); return rotateLeft(n); } /* RL */\n    return n;\n}\nvoid inorder(Node *r) {\n    if (r == NULL) return;\n    inorder(r->left); printf(\"%d \", r->key); inorder(r->right);\n}\nvoid preorder(Node *r) {\n    if (r == NULL) return;\n    printf(\"%d \", r->key); preorder(r->left); preorder(r->right);\n}\nint main() {\n    Node *root = NULL;\n    int keys[] = {10, 20, 30, 40, 50, 25};\n    for (int i = 0; i < 6; i++) root = insert(root, keys[i]);\n    printf(\"Inorder:  \"); inorder(root); printf(\"\\n\");\n    printf(\"Preorder: \"); preorder(root); printf(\"\\n\");\n    printf(\"Root = %d, height = %d, balance factor of root = %d\\n\", root->key, h(root), bf(root));\n    return 0;\n}\n"}}}, {"h": "Complexity", "p": ["An AVL tree with n nodes has height at most about 1.44 log2(n), so every operation is O(log n) even in the worst case. A rotation takes O(1). Extra space is one height field per node."], "table": {"head": ["Operation", "Time (all cases)", "Space"], "rows": [["Search", "O(log n)", "O(1) iterative"], ["Insert", "O(log n)", "O(log n) recursion"], ["Delete", "O(log n)", "O(log n) recursion"], ["Rotation", "O(1)", "O(1)"]]}}], "analogy": "An AVL tree is like a see-saw that fixes itself: whenever one side gets two levels heavier than the other, a quick rotation moves the middle child up and levels it again.", "hinglish": "Bhai AVL tree ek self-balancing BST hai. Har node ka balance factor (left height minus right height) -1, 0 ya +1 hi hona chahiye. Agar +2 ya -2 ho jaye to rotation karte hain: LL me right rotate, RR me left rotate, LR aur RL me double rotation. Isse height hamesha log n rehti hai aur har operation O(log n) hota hai.", "mistakes": ["Using a single rotation for the LR or RL (zig-zag) case.", "Not updating heights after rotation (update the lower node first, then the new root).", "Mixing the direction: LL needs a right rotation, RR needs a left rotation.", "Checking BF only at the root instead of on every ancestor of the new node."], "remember": ["AVL tree: self-balancing BST; subtree heights of every node differ by at most 1.", "Balance factor = height(left) - height(right), allowed values -1, 0, +1.", "BF = +2 means left heavy; BF = -2 means right heavy.", "LL case (insert in left of left): single right rotation.", "RR case (insert in right of right): single left rotation.", "LR case: left rotation on left child, then right rotation on node.", "RL case: right rotation on right child, then left rotation on node.", "Rotations preserve the inorder (sorted) order.", "Insert = BST insert + update heights + rebalance ancestors.", "At most one rotation (single or double) fixes an insertion.", "Height <= 1.44 log2(n); search, insert, delete are O(log n).", "Each node stores an extra height (or balance) field."], "uses": ["Databases and in-memory indexes where lookups are more frequent than updates.", "Ordered dictionaries and sets with guaranteed O(log n).", "Real-time systems that need predictable worst-case time.", "Memory management and file system indexes."], "pros": ["Guaranteed O(log n) search, insert and delete.", "More strictly balanced than red-black trees, so lookups are faster.", "Simple rule: only four rotation cases."], "cons": ["Extra memory for height or balance factor in each node.", "Rotations make insert and delete more complex than plain BST.", "More rotations than red-black trees on frequent updates."], "def": "An AVL tree (named after Adelson-Velsky and Landis) is a self-balancing Binary Search Tree. It follows the BST property and, in addition, keeps the tree height-balanced: for every node, the heights of the left and right subtrees differ by at most 1."}, "u3-t4": {"tldr": "A linked list whose every node stores data plus two links, prev and next, so you can walk both forward and backward.", "sections": [{"h": "What is a doubly linked list?", "p": ["The list is reached through a `head` pointer (first node). Many implementations also keep a `tail` pointer (last node). The `prev` of the first node and the `next` of the last node are `null`."], "pts": ["Node = prev + data + next", "Elements are NOT in contiguous memory", "Size grows and shrinks at run time", "Needs head (and usually tail) pointer"], "viz": {"type": "chain", "items": ["null", "10", "20", "30", "null"], "caption": "head -> 10 <-> 20 <-> 30 <- tail"}}, {"h": "Structure of a node", "p": ["In Java a node is a small class with two self-references. A new node starts with both links `null`; we join it to the list by setting the links."], "tip": "To join A and B you must set TWO links: A.next = B and B.prev = A. Forgetting one is the most common DLL bug.", "code": {"f": "Main.java", "c": "public class Main {\n    static class Node {\n        int data;\n        Node prev;   // address of previous node\n        Node next;   // address of next node\n        Node(int d) { data = d; }   // prev, next start as null\n    }\n    public static void main(String[] args) {\n        Node a = new Node(10), b = new Node(20), c = new Node(30);\n        a.next = b; b.prev = a;\n        b.next = c; c.prev = b;\n        System.out.println(\"b.prev = \" + b.prev.data + \", b.next = \" + b.next.data);\n        System.out.println(\"a.prev = \" + a.prev + \", c.next = \" + c.next);\n    }\n}", "out": "b.prev = 10, b.next = 30\na.prev = null, c.next = null", "cpp": {"f": "main.cpp", "c": "#include <iostream>\nusing namespace std;\n\nstruct Node {\n    int data;\n    Node* prev;   // address of previous node\n    Node* next;   // address of next node\n    Node(int d) : data(d), prev(nullptr), next(nullptr) {}   // prev, next start as null\n};\nint main() {\n    Node *a = new Node(10), *b = new Node(20), *c = new Node(30);\n    a->next = b; b->prev = a;\n    b->next = c; c->prev = b;\n    cout << \"b.prev = \" << b->prev->data << \", b.next = \" << b->next->data << \"\\n\";\n    cout << \"a.prev = \" << (a->prev ? \"?\" : \"null\") << \", c.next = \" << (c->next ? \"?\" : \"null\") << \"\\n\";\n    delete a; delete b; delete c;\n    return 0;\n}\n"}, "clang": {"f": "main.c", "c": "#include <stdio.h>\n#include <stdlib.h>\n\ntypedef struct Node { int data; struct Node *prev, *next; } Node;\nNode *mk(int d) { Node *n = malloc(sizeof(Node)); n->data = d; n->prev = n->next = NULL; return n; }\n\nint main() {\n    Node *a = mk(10), *b = mk(20), *c = mk(30);\n    a->next = b; b->prev = a;\n    b->next = c; c->prev = b;\n    printf(\"b.prev = %d, b.next = %d\\n\", b->prev->data, b->next->data);\n    printf(\"a.prev = %s, c.next = %s\\n\", a->prev ? \"?\" : \"null\", c->next ? \"?\" : \"null\");\n    free(a); free(b); free(c);\n    return 0;\n}\n"}}, "table": {"head": ["Node"], "rows": [["prev : Node"], ["data : int"], ["next : Node"]]}}, {"h": "Traversal (forward and backward)", "p": ["Forward traversal starts at `head` and follows `next` until `null`. Backward traversal starts at `tail` and follows `prev` until `null`. This two-way walk is the main advantage over a singly list, where going back is impossible without re-scanning.", "Time O(n), extra space O(1)."], "pts": ["Forward: p = head; while p != null: visit p; p = p.next", "Backward: p = tail; while p != null: visit p; p = p.prev"], "code": {"f": "Main.java", "c": "public class Main {\n    static class Node {\n        int data; Node prev, next;\n        Node(int d) { data = d; }\n    }\n    static Node head, tail;\n\n    static void insertFront(int x) {\n        Node n = new Node(x);\n        if (head == null) { head = tail = n; return; }\n        n.next = head; head.prev = n; head = n;\n    }\n    static void insertEnd(int x) {\n        Node n = new Node(x);\n        if (head == null) { head = tail = n; return; }\n        tail.next = n; n.prev = tail; tail = n;\n    }\n    static void forward() {\n        for (Node p = head; p != null; p = p.next) System.out.print(p.data + \" <-> \");\n        System.out.println(\"null\");\n    }\n    static void backward() {\n        for (Node p = tail; p != null; p = p.prev) System.out.print(p.data + \" <-> \");\n        System.out.println(\"null\");\n    }\n    public static void main(String[] args) {\n        insertEnd(20); insertEnd(30); insertFront(10); insertEnd(40);\n        System.out.print(\"Forward : \"); forward();\n        System.out.print(\"Backward: \"); backward();\n    }\n}", "out": "Forward : 10 <-> 20 <-> 30 <-> 40 <-> null\nBackward: 40 <-> 30 <-> 20 <-> 10 <-> null", "cpp": {"f": "main.cpp", "c": "#include <iostream>\nusing namespace std;\n\nstruct Node {\n    int data; Node *prev, *next;\n    Node(int d) : data(d), prev(nullptr), next(nullptr) {}\n};\nNode *head = nullptr, *tail = nullptr;\n\nvoid insertFront(int x) {\n    Node* n = new Node(x);\n    if (head == nullptr) { head = tail = n; return; }\n    n->next = head; head->prev = n; head = n;\n}\nvoid insertEnd(int x) {\n    Node* n = new Node(x);\n    if (head == nullptr) { head = tail = n; return; }\n    tail->next = n; n->prev = tail; tail = n;\n}\nvoid forward() {\n    for (Node* p = head; p != nullptr; p = p->next) cout << p->data << \" <-> \";\n    cout << \"null\\n\";\n}\nvoid backward() {\n    for (Node* p = tail; p != nullptr; p = p->prev) cout << p->data << \" <-> \";\n    cout << \"null\\n\";\n}\nint main() {\n    insertEnd(20); insertEnd(30); insertFront(10); insertEnd(40);\n    cout << \"Forward : \"; forward();\n    cout << \"Backward: \"; backward();\n    while (head) { Node* t = head; head = head->next; delete t; }   // free\n    return 0;\n}\n"}, "clang": {"f": "main.c", "c": "#include <stdio.h>\n#include <stdlib.h>\n\ntypedef struct Node { int data; struct Node *prev, *next; } Node;\nNode *mk(int d) { Node *n = malloc(sizeof(Node)); n->data = d; n->prev = n->next = NULL; return n; }\nNode *head = NULL, *tail = NULL;\n\nvoid insertFront(int x) {\n    Node *n = mk(x);\n    if (head == NULL) { head = tail = n; return; }\n    n->next = head; head->prev = n; head = n;\n}\nvoid insertEnd(int x) {\n    Node *n = mk(x);\n    if (head == NULL) { head = tail = n; return; }\n    tail->next = n; n->prev = tail; tail = n;\n}\nvoid forward() {\n    for (Node *p = head; p != NULL; p = p->next) printf(\"%d <-> \", p->data);\n    printf(\"null\\n\");\n}\nvoid backward() {\n    for (Node *p = tail; p != NULL; p = p->prev) printf(\"%d <-> \", p->data);\n    printf(\"null\\n\");\n}\nint main() {\n    insertEnd(20); insertEnd(30); insertFront(10); insertEnd(40);\n    printf(\"Forward : \"); forward();\n    printf(\"Backward: \"); backward();\n    while (head) { Node *t = head; head = head->next; free(t); }   /* free */\n    return 0;\n}\n"}}}, {"h": "Insertion", "p": ["Insertion has three cases: at the beginning, at the end, and after a given node. Each needs the new node's two links and the neighbours' links updated, in the right order so that no link is lost.", "Beginning: new.next = head; head.prev = new; head = new. With a tail pointer the end is O(1) too: tail.next = new; new.prev = tail; tail = new. Empty list: head = tail = new."], "warn": "Order matters. If you write p.next = n first, you lose the old successor of p. Also check p.next != null before p.next.prev = n, otherwise NullPointerException at the last node.", "code": {"f": "Main.java", "c": "public class Main {\n    static class Node {\n        int data; Node prev, next;\n        Node(int d) { data = d; }\n    }\n    static Node head;\n\n    static void insertEnd(int x) {\n        Node n = new Node(x);\n        if (head == null) { head = n; return; }\n        Node p = head;\n        while (p.next != null) p = p.next;\n        p.next = n; n.prev = p;\n    }\n    // insert x after the node holding 'key'\n    static void insertAfter(int key, int x) {\n        Node p = head;\n        while (p != null && p.data != key) p = p.next;\n        if (p == null) { System.out.println(key + \" not found\"); return; }\n        Node n = new Node(x);\n        n.next = p.next;      // 1\n        n.prev = p;           // 2\n        if (p.next != null) p.next.prev = n;  // 3\n        p.next = n;           // 4\n    }\n    static void show() {\n        for (Node p = head; p != null; p = p.next) System.out.print(p.data + \" \");\n        System.out.println();\n    }\n    public static void main(String[] args) {\n        insertEnd(10); insertEnd(20); insertEnd(40);\n        insertAfter(20, 30);\n        insertAfter(40, 50);\n        insertAfter(99, 1);\n        show();\n    }\n}", "out": "99 not found\n10 20 30 40 50 ", "cpp": {"f": "main.cpp", "c": "#include <iostream>\nusing namespace std;\n\nstruct Node {\n    int data; Node *prev, *next;\n    Node(int d) : data(d), prev(nullptr), next(nullptr) {}\n};\nNode* head = nullptr;\n\nvoid insertEnd(int x) {\n    Node* n = new Node(x);\n    if (head == nullptr) { head = n; return; }\n    Node* p = head;\n    while (p->next != nullptr) p = p->next;\n    p->next = n; n->prev = p;\n}\n// insert x after the node holding 'key'\nvoid insertAfter(int key, int x) {\n    Node* p = head;\n    while (p != nullptr && p->data != key) p = p->next;\n    if (p == nullptr) { cout << key << \" not found\\n\"; return; }\n    Node* n = new Node(x);\n    n->next = p->next;      // 1\n    n->prev = p;            // 2\n    if (p->next != nullptr) p->next->prev = n;  // 3\n    p->next = n;            // 4\n}\nvoid show() {\n    for (Node* p = head; p != nullptr; p = p->next) cout << p->data << \" \";\n    cout << \"\\n\";\n}\nint main() {\n    insertEnd(10); insertEnd(20); insertEnd(40);\n    insertAfter(20, 30);\n    insertAfter(40, 50);\n    insertAfter(99, 1);\n    show();\n    while (head) { Node* t = head; head = head->next; delete t; }   // free\n    return 0;\n}\n"}, "clang": {"f": "main.c", "c": "#include <stdio.h>\n#include <stdlib.h>\n\ntypedef struct Node { int data; struct Node *prev, *next; } Node;\nNode *mk(int d) { Node *n = malloc(sizeof(Node)); n->data = d; n->prev = n->next = NULL; return n; }\nNode *head = NULL;\n\nvoid insertEnd(int x) {\n    Node *n = mk(x);\n    if (head == NULL) { head = n; return; }\n    Node *p = head;\n    while (p->next != NULL) p = p->next;\n    p->next = n; n->prev = p;\n}\n/* insert x after the node holding 'key' */\nvoid insertAfter(int key, int x) {\n    Node *p = head;\n    while (p != NULL && p->data != key) p = p->next;\n    if (p == NULL) { printf(\"%d not found\\n\", key); return; }\n    Node *n = mk(x);\n    n->next = p->next;      /* 1 */\n    n->prev = p;            /* 2 */\n    if (p->next != NULL) p->next->prev = n;  /* 3 */\n    p->next = n;            /* 4 */\n}\nvoid show() {\n    for (Node *p = head; p != NULL; p = p->next) printf(\"%d \", p->data);\n    printf(\"\\n\");\n}\nint main() {\n    insertEnd(10); insertEnd(20); insertEnd(40);\n    insertAfter(20, 30);\n    insertAfter(40, 50);\n    insertAfter(99, 1);\n    show();\n    while (head) { Node *t = head; head = head->next; free(t); }   /* free */\n    return 0;\n}\n"}}, "table": {"head": ["Step", "What happens"], "rows": [["1. Create node", "n = new Node(x)"], ["2. n.next = p.next", "n points forward to p's old successor"], ["3. n.prev = p", "n points back to p"], ["4. If p.next != null", "p.next.prev = n"], ["5. p.next = n", "p now points forward to n"]]}}, {"h": "Deletion", "p": ["To delete a node p we only need p. Its neighbours are p.prev and p.next, so we link them to each other: p.prev.next = p.next and p.next.prev = p.prev. Special cases: p is the head (then head = p.next) or p is the tail (then tail = p.prev).", "In a singly list we must first find the previous node, which costs O(n). In a DLL, if we already hold the node, delete is O(1). Finding a node by value is still O(n)."], "code": {"f": "Main.java", "c": "public class Main {\n    static class Node {\n        int data; Node prev, next;\n        Node(int d) { data = d; }\n    }\n    static Node head, tail;\n\n    static void insertEnd(int x) {\n        Node n = new Node(x);\n        if (head == null) { head = tail = n; return; }\n        tail.next = n; n.prev = tail; tail = n;\n    }\n    static void delete(int key) {\n        Node p = head;\n        while (p != null && p.data != key) p = p.next;\n        if (p == null) { System.out.println(key + \" not found\"); return; }\n        if (p.prev != null) p.prev.next = p.next; else head = p.next;\n        if (p.next != null) p.next.prev = p.prev; else tail = p.prev;\n    }\n    static void show() {\n        for (Node p = head; p != null; p = p.next) System.out.print(p.data + \" \");\n        System.out.println();\n    }\n    public static void main(String[] args) {\n        for (int i = 10; i <= 50; i += 10) insertEnd(i);\n        delete(30); show();   // middle\n        delete(10); show();   // first\n        delete(50); show();   // last\n        delete(77);\n    }\n}", "out": "10 20 40 50 \n20 40 50 \n20 40 \n77 not found", "cpp": {"f": "main.cpp", "c": "#include <iostream>\nusing namespace std;\n\nstruct Node {\n    int data; Node *prev, *next;\n    Node(int d) : data(d), prev(nullptr), next(nullptr) {}\n};\nNode *head = nullptr, *tail = nullptr;\n\nvoid insertEnd(int x) {\n    Node* n = new Node(x);\n    if (head == nullptr) { head = tail = n; return; }\n    tail->next = n; n->prev = tail; tail = n;\n}\nvoid del(int key) {   // 'delete' is a C++ keyword\n    Node* p = head;\n    while (p != nullptr && p->data != key) p = p->next;\n    if (p == nullptr) { cout << key << \" not found\\n\"; return; }\n    if (p->prev != nullptr) p->prev->next = p->next; else head = p->next;\n    if (p->next != nullptr) p->next->prev = p->prev; else tail = p->prev;\n    delete p;\n}\nvoid show() {\n    for (Node* p = head; p != nullptr; p = p->next) cout << p->data << \" \";\n    cout << \"\\n\";\n}\nint main() {\n    for (int i = 10; i <= 50; i += 10) insertEnd(i);\n    del(30); show();   // middle\n    del(10); show();   // first\n    del(50); show();   // last\n    del(77);\n    while (head) { Node* t = head; head = head->next; delete t; }   // free\n    return 0;\n}\n"}, "clang": {"f": "main.c", "c": "#include <stdio.h>\n#include <stdlib.h>\n\ntypedef struct Node { int data; struct Node *prev, *next; } Node;\nNode *mk(int d) { Node *n = malloc(sizeof(Node)); n->data = d; n->prev = n->next = NULL; return n; }\nNode *head = NULL, *tail = NULL;\n\nvoid insertEnd(int x) {\n    Node *n = mk(x);\n    if (head == NULL) { head = tail = n; return; }\n    tail->next = n; n->prev = tail; tail = n;\n}\nvoid del(int key) {\n    Node *p = head;\n
