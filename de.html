path class=\"w\" d=\"M248,162.0 H262\"/><text class=\"tl\" x=\"268\" y=\"166.0\" text-anchor=\"start\">I4<\/text><path class=\"w\" d=\"M248,196.5 H262\"/><text class=\"tl\" x=\"268\" y=\"200.5\" text-anchor=\"start\">I3<\/text><path class=\"w\" d=\"M248,231.0 H262\"/><text class=\"tl\" x=\"268\" y=\"235.0\" text-anchor=\"start\">I2<\/text><path class=\"w\" d=\"M248,265.5 H262\"/><text class=\"tl\" x=\"268\" y=\"269.5\" text-anchor=\"start\">I1<\/text><path class=\"w\" d=\"M392,93.0 H406\"/><text class=\"tl\" x=\"386\" y=\"97.0\" text-anchor=\"end\">D2<\/text><path class=\"w\" d=\"M392,162.0 H406\"/><text class=\"tl\" x=\"386\" y=\"166.0\" text-anchor=\"end\">D1<\/text><path class=\"w\" d=\"M392,231.0 H406\"/><text class=\"tl\" x=\"386\" y=\"235.0\" text-anchor=\"end\">D0<\/text><text class=\"tb\" x=\"327\" y=\"18\" text-anchor=\"middle\">Priority encoder<\/text><path class=\"w\" d=\"M210,40 L236,40 L236,58.5 L248,58.5\"/><path class=\"w\" d=\"M210,78 L236,78 L236,93.0 L248,93.0\"/><path class=\"w\" d=\"M210,116 L236,116 L236,127.5 L248,127.5\"/><path class=\"w\" d=\"M210,154 L236,154 L236,162.0 L248,162.0\"/><path class=\"w\" d=\"M210,192 L236,192 L236,196.5 L248,196.5\"/><path class=\"w\" d=\"M210,230 L236,230 L236,231.0 L248,231.0\"/><path class=\"w\" d=\"M210,268 L236,268 L236,265.5 L248,265.5\"/><path class=\"w\" d=\"M406,93.0 L436,93.0\"/><text class=\"t\" x=\"442\" y=\"97.0\" text-anchor=\"start\">D2 (MSB)<\/text><path class=\"w\" d=\"M406,162.0 L436,162.0\"/><text class=\"t\" x=\"442\" y=\"166.0\" text-anchor=\"start\">D1<\/text><path class=\"w\" d=\"M406,231.0 L436,231.0\"/><text class=\"t\" x=\"442\" y=\"235.0\" text-anchor=\"start\">D0 (LSB)<\/text>", "caption": "3-bit parallel-comparator (flash) ADC: 2^n - 1 = 7 comparators compare Vin with taps of a resistor ladder; the priority encoder gives the binary code. Fastest ADC, but needs many comparators"}}, {"h": "Flash ADC example", "table": {"head": ["Vin", "Comparators ON", "Output D2D1D0"], "rows": [["0.5 V", "0", "000"], ["1.5 V", "1", "001"], ["2.7 V", "2", "010"], ["4.2 V", "4", "100"], ["5.9 V", "5", "101"], ["7.4 V", "7", "111"]]}}], "analogy": "ADC = a photographer with a limited colour pencil box: take a photo of a moment (sample), then choose the nearest colour (quantize), then give the colour a number (encode).", "hinglish": "ADC me pehle sample and hold, phir quantization aur encoding hoti hai. Flash ADC me 2^n - 1 comparators lagte hain, isliye fast hai par mehnga.", "mistakes": ["Confusing the number of levels (2^n) with comparators (2^n - 1).", "Sampling below the Nyquist rate (aliasing)."], "remember": ["ADC steps: sample and hold, quantization, encoding", "Nyquist: fs >= 2 fmax", "Sample-and-hold: switch + capacitor + buffer", "Resolution = Vref/2^n; error ±1/2 LSB", "Flash ADC: 2^n - 1 comparators + priority encoder; fastest"], "def": "1. **Sample and hold**: take the value at an instant and keep it constant. 2. **Quantization**: round to one of 2^n levels. 3. **Encoding**: write the level as an n-bit code. The **sampling rate must be at least twice the highest signal frequency (Nyquist)**."}, "u4-t3": {"tldr": "Other ADC types trade speed for accuracy and hardware: SAR is a good all-rounder, dual slope is very accurate but slow.", "sections": [{"h": "Successive approximation (SAR) ADC", "p": [], "viz": {"type": "svg", "w": 560, "h": 210, "svg": "<rect class=\"g0\" x=\"90\" y=\"40\" width=\"90\" height=\"60\" rx=\"5\"/><text class=\"tb\" x=\"135.0\" y=\"74.0\" text-anchor=\"middle\">Comparator<\/text><rect class=\"g0\" x=\"250\" y=\"40\" width=\"110\" height=\"60\" rx=\"5\"/><text class=\"tb\" x=\"305.0\" y=\"70.0\" text-anchor=\"middle\">SAR<\/text><text class=\"t\" x=\"305.0\" y=\"86.0\" text-anchor=\"middle\">register + control<\/text><rect class=\"g0\" x=\"150\" y=\"140\" width=\"150\" height=\"40\" rx=\"5\"/><text class=\"tb\" x=\"225.0\" y=\"164.0\" text-anchor=\"middle\">D/A converter<\/text><text class=\"tb\" x=\"70\" y=\"52\" text-anchor=\"end\">Vin<\/text><path class=\"w\" d=\"M76,48 L90,48\"/><path class=\"w\" d=\"M180,70 L250,70\"/><text class=\"t\" x=\"215\" y=\"64\" text-anchor=\"middle\">out<\/text><text class=\"t\" x=\"305\" y=\"22\" text-anchor=\"middle\">CLK, Start<\/text><path class=\"w\" d=\"M305,26 L305,40\"/><path class=\"w\" d=\"M360,70 L450,70\"/><text class=\"tb\" x=\"456\" y=\"74\" text-anchor=\"start\">Digital out<\/text><circle class=\"jn\" cx=\"400\" cy=\"70\" r=\"3.5\"/><path class=\"w hi\" d=\"M400,70 L400,160 L300,160\"/><path class=\"w hi\" d=\"M150,160 L60,160 L60,92 L90,92\"/><text class=\"t\" x=\"75\" y=\"128\" text-anchor=\"end\">Vdac<\/text>", "caption": "Successive-approximation ADC: the SAR tries bits from MSB to LSB; the comparator tells whether the DAC output is above or below Vin. n bits need n clocks"}}, {"h": "SAR example (computed)", "table": {"head": ["Clock", "Trial code", "DAC out", "Decision"], "rows": [["1", "1000", "5.000 V", "Keep 1"], ["2", "1100", "7.500 V", "Clear to 0"], ["3", "1010", "6.250 V", "Keep 1"], ["4", "1011", "6.875 V", "Clear to 0"]]}}, {"h": "Counting (digital ramp) ADC", "p": ["A counter counts up, the DAC output rises like a staircase, and the comparator stops the counter when **Vdac >= Vin**. The count is the output. Simple, but **slow: up to 2^n clock pulses**, and time depends on Vin."], "viz": {"type": "svg", "w": 560, "h": 210, "svg": "<rect class=\"g0\" x=\"90\" y=\"40\" width=\"90\" height=\"60\" rx=\"5\"/><text class=\"tb\" x=\"135.0\" y=\"74.0\" text-anchor=\"middle\">Comparator<\/text><rect class=\"g0\" x=\"260\" y=\"40\" width=\"110\" height=\"60\" rx=\"5\"/><text class=\"tb\" x=\"315.0\" y=\"74.0\" text-anchor=\"middle\">Binary counter<\/text><rect class=\"g0\" x=\"150\" y=\"140\" width=\"150\" height=\"40\" rx=\"5\"/><text class=\"tb\" x=\"225.0\" y=\"164.0\" text-anchor=\"middle\">D/A converter<\/text><text class=\"tb\" x=\"70\" y=\"52\" text-anchor=\"end\">Vin<\/text><path class=\"w\" d=\"M76,48 L90,48\"/><path class=\"g\" d=\"M200,48 H224.2 A17.0,17.0 0 0 1 224.2,82 H200 Z\"/><path class=\"w\" d=\"M180,70 L190,70 L190,56.5 L200,56.5\"/><path class=\"w\" d=\"M188,73.5 L200,73.5\"/><text class=\"t\" x=\"228\" y=\"112\" text-anchor=\"middle\">CLK<\/text><path class=\"w\" d=\"M241.2,65.0 L252,65.0 L252,70 L260,70\"/><path class=\"w\" d=\"M370,70 L460,70\"/><text class=\"tb\" x=\"466\" y=\"74\" text-anchor=\"start\">Digital out<\/text><circle class=\"jn\" cx=\"410\" cy=\"70\" r=\"3.5\"/><path class=\"w hi\" d=\"M410,70 L410,160 L300,160\"/><path class=\"w hi\" d=\"M150,160 L60,160 L60,92 L90,92\"/><text class=\"t\" x=\"75\" y=\"128\" text-anchor=\"end\">Vdac<\/text>", "caption": "Counting (ramp) ADC: the counter increments while the DAC output is below Vin; counting stops when they match, and the count is the result. Slow: up to 2^n clocks"}}, {"h": "Dual-slope ADC", "p": ["**Phase 1**: integrate Vin for a **fixed time T1**. **Phase 2**: integrate -Vref until the output returns to 0, taking time T2. **T2 = T1 x Vin/Vref**. Independent of R, C and clock drift, so very **accurate and noise rejecting**; slow. Used in **digital voltmeters**. Example: T1 = 1000 clocks, Vin = 3.2 V, Vref = 5 V gives T2 = 640 clocks (output = 640)."], "viz": {"type": "svg", "w": 520, "h": 230, "svg": "<line class=\"w\" x1=\"40\" y1=\"40\" x2=\"40\" y2=\"200\"/><line class=\"w\" x1=\"40\" y1=\"200\" x2=\"480\" y2=\"200\"/><text class=\"t\" x=\"40\" y=\"30\" text-anchor=\"middle\">Vo<\/text><text class=\"t\" x=\"480\" y=\"218\" text-anchor=\"end\">time<\/text><path class=\"w hi\" d=\"M40,200 L200,70 L400,200\"/><path class=\"w\" d=\"M200,70 L200,200\" stroke-dasharray=\"3 4\"/><path class=\"w\" d=\"M200,200 L300,200\"/><path class=\"w\" d=\"M40,60 L440,60\" stroke-dasharray=\"2 5\" opacity=\".0\"/><text class=\"tb\" x=\"120\" y=\"196\" text-anchor=\"middle\" style=\"font-size:11px\">T1 (fixed)<\/text><text class=\"tb\" x=\"300\" y=\"196\" text-anchor=\"middle\" style=\"font-size:11px\">T2 (varies)<\/text><text class=\"t\" x=\"120\" y=\"110\" text-anchor=\"middle\">slope ∝ Vin<\/text><text class=\"t\" x=\"320\" y=\"110\" text-anchor=\"middle\">slope ∝ -Vref<\/text>", "caption": "Dual-slope ADC: integrate Vin for fixed time T1, then integrate -Vref until the output returns to zero. T2/T1 = Vin/Vref, so count in T2 = digital output"}}, {"h": "Voltage-to-frequency and voltage-to-time conversion", "p": ["**V to F**: a **VCO** or integrator with reset gives a pulse frequency proportional to Vin; a counter measures the pulses in a fixed gate time. **V to time**: a ramp is compared with Vin; the comparator output pulse width is proportional to Vin and is measured by counting clock pulses. Both are simple and noise immune (used for remote sensing)."]}, {"h": "Comparison of ADC types", "table": {"head": ["Type", "Speed", "Hardware", "Accuracy"], "rows": [["Flash", "Fastest", "Most", "Medium"], ["SAR", "Fast", "Medium", "Good"], ["Counting", "Slow", "Least", "Good"], ["Dual slope", "Slowest", "Medium", "Very high"]]}}, {"h": "ADC specifications and ICs", "p": ["**Resolution**, **conversion time**, **accuracy**, **quantization error (±1/2 LSB)**, **linearity**, **input range**, **sampling rate**. ICs: **ADC0804** (8-bit SAR), **ADC0808/0809** (8-bit, 8 channel), **ADC0820** (flash), **ICL7107** (dual slope, 3.5 digit), **AD574** (12-bit SAR)."]}], "analogy": "SAR = the 20-questions game (is it above half? yes? then is it above 3/4?). Counting = climbing stairs one at a time. Dual slope = fill a bucket for a fixed time, then see how long it takes to empty.", "hinglish": "SAR ADC MSB se LSB tak ek-ek bit test karta hai, n bit ke liye n clock. Counting ADC slow hai. Dual slope accurate hai aur T2 = T1 x Vin/Vref.", "mistakes": ["Saying SAR needs 2^n clocks (that is the counting ADC).", "Forgetting that dual slope result is independent of R and C."], "remember": ["SAR: n clocks for n bits, MSB first", "Counting ADC: slow, up to 2^n clocks", "Dual slope: T2 = T1 Vin/Vref; accurate, slow", "V to F and V to time conversion", "Flash fastest, dual slope slowest", "ICs: ADC0804, ADC0808, ICL7107"], "def": "Uses a **SAR register, a DAC and a comparator**. It **tests one bit per clock from MSB to LSB**: set the bit, compare the DAC output with Vin, keep the bit if DAC <= Vin otherwise clear it. **n clocks for n bits**, independent of Vin. Fast and medium cost: the most common ADC (ADC0804, ADC0808)."}, "u5-t1": {"tldr": "A memory is a large array of storage cells addressed by a binary number. Chips can be combined to make bigger or wider memory.", "sections": [{"h": "Memory organization", "p": [], "viz": {"type": "svg", "w": 560, "h": 260, "svg": "<rect class=\"g0\" x=\"60\" y=\"60\" width=\"100\" height=\"100\" rx=\"5\"/><text class=\"tb\" x=\"110.0\" y=\"110.0\" text-anchor=\"middle\">Address<\/text><text class=\"t\" x=\"110.0\" y=\"126.0\" text-anchor=\"middle\">decoder<\/text><rect class=\"g0\" x=\"250\" y=\"40\" width=\"150\" height=\"140\" rx=\"5\"/><text class=\"tb\" x=\"325.0\" y=\"110.0\" text-anchor=\"middle\">Memory array<\/text><text class=\"t\" x=\"325.0\" y=\"126.0\" text-anchor=\"middle\">2^n words x m bits<\/text><text class=\"t\" x=\"30\" y=\"80\" text-anchor=\"end\">A0<\/text><path class=\"w\" d=\"M34,76 L60,76\"/><text class=\"t\" x=\"30\" y=\"102\" text-anchor=\"end\">A1<\/text><path class=\"w\" d=\"M34,98 L60,98\"/><text class=\"t\" x=\"30\" y=\"124\" text-anchor=\"end\">A2<\/text><path class=\"w\" d=\"M34,120 L60,120\"/><text class=\"t\" x=\"30\" y=\"146\" text-anchor=\"end\">A3<\/text><path class=\"w\" d=\"M34,142 L60,142\"/><path class=\"w\" d=\"M160,70 L250,70\"/><text class=\"t\" x=\"205\" y=\"67\" text-anchor=\"middle\">W0<\/text><path class=\"w\" d=\"M160,100 L250,100\"/><text class=\"t\" x=\"205\" y=\"97\" text-anchor=\"middle\">W1<\/text><path class=\"w\" d=\"M160,130 L250,130\"/><text class=\"t\" x=\"205\" y=\"127\" text-anchor=\"middle\">W2<\/text><path class=\"w\" d=\"M160,160 L250,160\"/><text class=\"tl\" x=\"205\" y=\"190\" text-anchor=\"middle\">word lines<\/text><path class=\"w\" d=\"M400,80 L470,80\" marker-end=\"url(#da)\"/><text class=\"tb\" x=\"476\" y=\"84\" text-anchor=\"start\">Data<\/text><text class=\"t\" x=\"476\" y=\"100\" text-anchor=\"start\">(m bits)<\/text><text class=\"t\" x=\"325\" y=\"214\" text-anchor=\"middle\">R/W, CS (control)<\/text><path class=\"w\" d=\"M325,200 L325,180\" marker-end=\"url(#da)\"/>", "caption": "Memory organization: n address lines select one of 2^n words through the decoder; the data bus carries m bits"}}, {"h": "Capacity examples (computed)", "tip": "1 K = 1024 = 2^10, 1 M = 2^20, 1 G = 2^30.", "table": {"head": ["Address lines n", "Data bits m", "Words 2^n", "Size", "Total bits"], "rows": [["10", "8", "1024", "1 KB", "8192"], ["11", "8", "2048", "2 KB", "16384"], ["12", "8", "4096", "4 KB", "32768"], ["16", "8", "65536", "64 KB", "524288"], ["16", "16", "65536", "128 KB", "1048576"], ["20", "8", "1048576", "1024 KB", "8388608"]]}}, {"h": "Read and write operation", "p": ["**Read**: put the address on the address bus, activate CS, set R/W = read; the data appears on the data bus. **Write**: put address and data, activate CS, give a write pulse. **Access time** = delay between the address and valid data."]}, {"h": "Expanding memory size", "p": ["**Word size expansion**: connect chips in parallel with the **same address**; the data lines join to give a wider word (two 1K x 8 = 1K x 16). **Word number (capacity) expansion**: use extra address lines with a **decoder** to select one chip at a time (two 1K x 8 = 2K x 8). Number of chips = (required total bits) / (chip bits)."], "viz": {"type": "svg", "w": 560, "h": 170, "svg": "<rect class=\"g0\" x=\"150\" y=\"40\" width=\"110\" height=\"50\" rx=\"5\"/><text class=\"tb\" x=\"205.0\" y=\"65.0\" text-anchor=\"middle\">Chip 1<\/text><text class=\"t\" x=\"205.0\" y=\"81.0\" text-anchor=\"middle\">1K x 8<\/text><rect class=\"g0\" x=\"320\" y=\"40\" width=\"110\" height=\"50\" rx=\"5\"/><text class=\"tb\" x=\"375.0\" y=\"65.0\" text-anchor=\"middle\">Chip 2<\/text><text class=\"t\" x=\"375.0\" y=\"81.0\" text-anchor=\"middle\">1K x 8<\/text><path class=\"w\" d=\"M70,20 L480,20\"/><text class=\"t\" x=\"66\" y=\"24\" text-anchor=\"end\">A9..A0<\/text><circle class=\"jn\" cx=\"205\" cy=\"20\" r=\"3.5\"/><circle class=\"jn\" cx=\"375\" cy=\"20\" r=\"3.5\"/><path class=\"w\" d=\"M205,20 L205,40\" marker-end=\"url(#da)\"/><path class=\"w\" d=\"M375,20 L375,40\" marker-end=\"url(#da)\"/><path class=\"w\" d=\"M205,90 L205,130\" marker-end=\"url(#da)\"/><path class=\"w\" d=\"M375,90 L375,130\" marker-end=\"url(#da)\"/><text class=\"tb\" x=\"205\" y=\"148\" text-anchor=\"middle\">D7..D0<\/text><text class=\"tb\" x=\"375\" y=\"148\" text-anchor=\"middle\">D15..D8<\/text>", "caption": "Word-size expansion: two 1K x 8 chips with the same address give a 1K x 16 memory"}}, {"h": "Word-number expansion", "viz": {"type": "svg", "w": 560, "h": 260, "svg": "<rect class=\"g0\" x=\"60\" y=\"120\" width=\"90\" height=\"50\" rx=\"5\"/><text class=\"tb\" x=\"105.0\" y=\"145.0\" text-anchor=\"middle\">1-to-2<\/text><text class=\"t\" x=\"105.0\" y=\"161.0\" text-anchor=\"middle\">decoder<\/text><rect class=\"g0\" x=\"260\" y=\"50\" width=\"110\" height=\"50\" rx=\"5\"/><text class=\"tb\" x=\"315.0\" y=\"75.0\" text-anchor=\"middle\">Chip 1<\/text><text class=\"t\" x=\"315.0\" y=\"91.0\" text-anchor=\"middle\">1K x 8<\/text><rect class=\"g0\" x=\"260\" y=\"150\" width=\"110\" height=\"50\" rx=\"5\"/><text class=\"tb\" x=\"315.0\" y=\"175.0\" text-anchor=\"middle\">Chip 2<\/text><text class=\"t\" x=\"315.0\" y=\"191.0\" text-anchor=\"middle\">1K x 8<\/text><text class=\"tb\" x=\"30\" y=\"134\" text-anchor=\"end\">A10<\/text><path class=\"w\" d=\"M34,130 L60,130\"/><path class=\"w\" d=\"M150,135 L210,135 L210,65 L260,65\"/><text class=\"t\" x=\"205\" y=\"60\" text-anchor=\"end\">CS1<\/text><path class=\"w\" d=\"M150,155 L210,155 L210,175 L260,175\"/><text class=\"t\" x=\"205\" y=\"190\" text-anchor=\"end\">CS2<\/text><text class=\"t\" x=\"190\" y=\"24\" text-anchor=\"end\">A9..A0<\/text><path class=\"w\" d=\"M196,20 L240,20 L240,190 L260,190\" marker-end=\"url(#da)\"/><circle class=\"jn\" cx=\"240\" cy=\"85\" r=\"3.5\"/><path class=\"w\" d=\"M240,85 L260,85\" marker-end=\"url(#da)\"/><path class=\"w\" d=\"M450,75 L450,175\"/><path class=\"w\" d=\"M370,75 L450,75\"/><path class=\"w\" d=\"M370,175 L450,175\"/><circle class=\"jn\" cx=\"450\" cy=\"75\" r=\"3.5\"/><circle class=\"jn\" cx=\"450\" cy=\"175\" r=\"3.5\"/><path class=\"w\" d=\"M450,125 L500,125\" marker-end=\"url(#da)\"/><text class=\"tb\" x=\"506\" y=\"129\" text-anchor=\"start\">D7..D0<\/text>", "caption": "Word-number expansion: A10 selects chip 1 or chip 2 through the decoder; the lower addresses go to both chips; the data lines are shared (only the selected chip drives them) giving 2K x 8"}}, {"h": "Example", "p": ["A 4K x 8 memory from 1K x 8 chips: chips needed = 4K x 8 / (1K x 8) = **4**. Address lines needed = 12; 10 go to all chips, the top 2 (A11, A10) go to a **2-to-4 decoder** which drives the chip selects."]}], "analogy": "Memory = a huge apartment block. The address is the flat number and the data is the person inside. More flats (expansion) = more buildings or more floors.", "hinglish": "Memory me n address lines se 2^n words milte hain, har word m bit ka. Chips parallel jodne se word size badhta hai, decoder se capacity.", "mistakes": ["Connecting data lines of two chips together without a chip-select decoder (bus conflict).", "Mixing 1K = 1000: actually 1024."], "remember": ["Capacity = 2^n x m bits", "Address bus selects word; data bus width = m", "Control: CS, R/W, OE", "Word-size expansion: parallel chips, same address", "Word-number expansion: decoder on extra address lines", "Chips needed = total bits / chip bits"], "def": "A memory stores **2^n words of m bits** each. **n address lines** choose one word, and the **data bus** carries m bits. Control lines: **CS/CE** (chip select), **R/W** (read/write), **OE** (output enable). **Capacity = 2^n x m bits**."}, "u5-t2": {"tldr": "Semiconductor memories differ in whether they can be written, lose data without power, and how fast they are.", "sections": [{"h": "Classification and characteristics", "p": [], "table": {"head": ["Type", "Volatile?", "Write", "Used for"], "rows": [["ROM / PROM", "No", "Once or never", "Firmware, boot code"], ["EPROM / EEPROM / Flash", "No", "Erase and rewrite (slow)", "BIOS, pen drives, SSD"], ["SRAM", "Yes", "Fast, any time", "Cache, registers"], ["DRAM", "Yes (needs refresh)", "Fast, any time", "Main memory (RAM)"], ["CAM", "Yes", "Fast", "Cache tag, routers"]]}}, {"h": "Sequential memory", "p": ["Data are read **in order**, e.g. **shift registers, CCD, magnetic tape**. The access time depends on the location. Cheap and dense, used for serial data like images and audio."]}, {"h": "ROM (Read Only Memory)", "p": ["Non-volatile; the data are stored during manufacture or programming. Types: **Mask ROM** (factory), **PROM** (programmed once with fuses), **EPROM** (erased by UV light), **EEPROM** (erased electrically, byte by byte), **Flash** (block erase, high density). Uses: BIOS, firmware, look-up tables, code converters."], "viz": {"type": "svg", "w": 500, "h": 260, "svg": "<text class=\"tl\" x=\"24\" y=\"28\" text-anchor=\"start\">Address<\/text><rect class=\"g\" x=\"70\" y=\"50\" width=\"80\" height=\"120\" rx=\"6\"/><text class=\"tb\" x=\"110.0\" y=\"110.0\" text-anchor=\"middle\">2-to-4<\/text><path class=\"w\" d=\"M56,90.0 H70\"/><text class=\"tl\" x=\"76\" y=\"94.0\" text-anchor=\"start\">A1<\/text><path class=\"w\" d=\"M56,130.0 H70\"/><text class=\"tl\" x=\"76\" y=\"134.0\" text-anchor=\"start\">A0<\/text><path class=\"w\" d=\"M150,74.0 H164\"/><text class=\"tl\" x=\"144\" y=\"78.0\" text-anchor=\"end\">0<\/text><path class=\"w\" d=\"M150,98.0 H164\"/><text class=\"tl\" x=\"144\" y=\"102.0\" text-anchor=\"end\">1<\/text><path class=\"w\" d=\"M150,122.0 H164\"/><text class=\"tl\" x=\"144\" y=\"126.0\" text-anchor=\"end\">2<\/text><path class=\"w\" d=\"M150,146.0 H164\"/><text class=\"tl\" x=\"144\" y=\"150.0\" text-anchor=\"end\">3<\/text><path class=\"w\" d=\"M40,90.0 L56,90.0\"/><text class=\"t\" x=\"36\" y=\"94.0\" text-anchor=\"end\">A1<\/text><path class=\"w\" d=\"M40,130.0 L56,130.0\"/><text class=\"t\" x=\"36\" y=\"134.0\" text-anchor=\"end\">A0<\/text><path class=\"w\" d=\"M280,40 L280,200\"/><text class=\"tb\" x=\"280\" y=\"230\" text-anchor=\"middle\">D2<\/text><path class=\"w\" d=\"M340,40 L340,200\"/><text class=\"tb\" x=\"340\" y=\"230\" text-anchor=\"middle\">D1<\/text><path class=\"w\" d=\"M400,40 L400,200\"/><text class=\"tb\" x=\"400\" y=\"230\" text-anchor=\"middle\">D0<\/text><path class=\"w\" d=\"M164,74.0 L430,74.0\"/><path class=\"g0\" d=\"M274,69.0 L286,69.0 L280,79.0 Z\"/><circle class=\"jn\" cx=\"280\" cy=\"74.0\" r=\"3.5\"/><path class=\"g0\" d=\"M394,69.0 L406,69.0 L400,79.0 Z\"/><circle class=\"jn\" cx=\"400\" cy=\"74.0\" r=\"3.5\"/><path class=\"w\" d=\"M164,98.0 L430,98.0\"/><path class=\"g0\" d=\"M334,93.0 L346,93.0 L340,103.0 Z\"/><circle class=\"jn\" cx=\"340\" cy=\"98.0\" r=\"3.5\"/><path class=\"g0\" d=\"M394,93.0 L406,93.0 L400,103.0 Z\"/><circle class=\"jn\" cx=\"400\" cy=\"98.0\" r=\"3.5\"/><path class=\"w\" d=\"M164,122.0 L430,122.0\"/><path class=\"g0\" d=\"M274,117.0 L286,117.0 L280,127.0 Z\"/><circle class=\"jn\" cx=\"280\" cy=\"122.0\" r=\"3.5\"/><path class=\"g0\" d=\"M334,117.0 L346,117.0 L340,127.0 Z\"/><circle class=\"jn\" cx=\"340\" cy=\"122.0\" r=\"3.5\"/><path class=\"w\" d=\"M164,146.0 L430,146.0\"/><path class=\"g0\" d=\"M394,141.0 L406,141.0 L400,151.0 Z\"/><circle class=\"jn\" cx=\"400\" cy=\"146.0\" r=\"3.5\"/><text class=\"t\" x=\"340\" y=\"30\" text-anchor=\"middle\">Diode = stored 1<\/text>", "caption": "ROM as a diode matrix: the decoder activates one word line; a diode at a crossing stores a 1, no diode stores a 0 (here 4 words x 3 bits)"}}, {"h": "ROM contents", "table": {"head": ["A1 A0", "D2", "D1", "D0"], "rows": [["00", "1", "0", "1"], ["01", "0", "1", "1"], ["10", "1", "1", "0"], ["11", "0", "0", "1"]]}}, {"h": "RAM (Random Access Memory)", "p": ["Read/write, volatile. **SRAM**: each cell is a latch (6 transistors): fast, no refresh, costly and low density: used in **cache**. **DRAM**: 1 transistor + 1 capacitor: dense and cheap, but charge leaks so it needs **refreshing every few ms**: used in **main memory**."], "viz": {"type": "svg", "w": 520, "h": 210, "svg": "<text class=\"tl\" x=\"110\" y=\"16\" text-anchor=\"middle\">DRAM cell (1T + 1C)<\/text><text class=\"tl\" x=\"400\" y=\"16\" text-anchor=\"middle\">SRAM cell (latch)<\/text><line class=\"w\" x1=\"40\" y1=\"60\" x2=\"220\" y2=\"60\"/><text class=\"t\" x=\"225\" y=\"64\" text-anchor=\"start\">Bit line<\/text><path class=\"g0\" d=\"M100,60 L100,90\"/><rect class=\"g0\" x=\"86\" y=\"90\" width=\"28\" height=\"28\" rx=\"3\"/><text class=\"t\" x=\"100\" y=\"108\" text-anchor=\"middle\">T<\/text><line class=\"w\" x1=\"30\" y1=\"104\" x2=\"86\" y2=\"104\"/><text class=\"t\" x=\"30\" y=\"96\" text-anchor=\"start\">Word line<\/text><path class=\"w\" d=\"M100,118 L100,140\"/><line class=\"g0\" x1=\"86\" y1=\"140\" x2=\"114\" y2=\"140\"/><line class=\"g0\" x1=\"86\" y1=\"148\" x2=\"114\" y2=\"148\"/><path class=\"w\" d=\"M100,148 L100,170\"/><text class=\"tb\" x=\"100\" y=\"186\" text-anchor=\"middle\">GND<\/text><text class=\"t\" x=\"122\" y=\"148\" text-anchor=\"start\">C stores the bit<\/text><path class=\"g\" d=\"M330,80 L360.8,97.0 L330,114 Z\"/><circle class=\"g\" cx=\"365.3\" cy=\"97.0\" r=\"4.5\"/><path class=\"g\" d=\"M420,80 L450.8,97.0 L420,114 Z\"/><circle class=\"g\" cx=\"455.3\" cy=\"97.0\" r=\"4.5\"/><path class=\"w\" d=\"M369.8,97.0 L420,97.0\"/><path class=\"w hi\" d=\"M459.8,97.0 L500,97.0 L500,150 L300,150 L300,97.0 L330,97.0\"/><text class=\"tl\" x=\"400\" y=\"176\" text-anchor=\"middle\">Cross-coupled inverters<\/text>", "caption": "Left: DRAM cell stores charge on a capacitor (needs refresh). Right: SRAM cell is a latch (no refresh, faster, bigger)"}}, {"h": "CAM (Content Addressable Memory)", "p": ["Instead of giving an address you give the **data (content)**; the CAM compares it with **all stored words in parallel** and returns the address (or match flag) of the matching word. Very fast search but costly. Used in **cache controllers, network routers, look-up tables**."]}, {"h": "CCD (Charge Coupled Device) memory", "p": ["Information is stored as **packets of charge** in MOS capacitors which are **shifted along** under clock pulses. Serial (sequential) access, dense, volatile. Used in **image sensors (cameras)** and old serial memories."]}, {"h": "Commonly used memory chips", "p": ["**2716** (2K x 8 EPROM), **2764** (8K x 8 EPROM), **27256**, **28C16** (EEPROM), **6116** (2K x 8 SRAM), **6264** (8K x 8 SRAM), **62256** (32K x 8 SRAM), **4164** (64K x 1 DRAM), **41256** (256K x 1 DRAM), **2114** (1K x 4 SRAM)."]}], "analogy": "ROM = a printed textbook (read only). RAM = a whiteboard (write and erase anytime, but wiped when the lights go out). CAM = asking \"who has this number?\" and the answer shouts back.", "hinglish": "ROM non-volatile hai, RAM volatile. SRAM latch hai aur fast, DRAM capacitor hai aur refresh maangta hai. CAM content se search karta hai, CCD me charge shift hota hai.", "mistakes": ["Saying DRAM does not need refresh.", "Confusing RAM (random access) with volatile; flash is random access and non-volatile."], "remember": ["ROM non-volatile; RAM volatile", "SRAM: latch, fast, cache; DRAM: capacitor, refresh, main memory", "CAM: search by content, parallel compare", "CCD: charge packets, serial access", "Chips: 2716, 2764, 6116, 6264, 4164", "ROM types: mask, PROM, EPROM, EEPROM, flash"], "def": "**Volatile**: loses data when power is off (RAM). **Non-volatile**: keeps data (ROM, flash). **Random access**: any location in the same time. **Sequential access**: must go through earlier data (tapes, shift register memory, CCD). Key characteristics: **capacity, access time, cycle time, power, cost per bit, volatility**."}, "u5-t3": {"tldr": "Because a ROM has all 2^n minterms ready, programming its OR plane lets it implement any truth table.", "sections": [{"h": "Idea", "p": [], "viz": {"type": "svg", "w": 480, "h": 260, "svg": "<text class=\"tl\" x=\"240\" y=\"16\" text-anchor=\"middle\">ROM = fixed AND array (decoder) + programmable OR array<\/text><rect class=\"g\" x=\"40\" y=\"40\" width=\"100\" height=\"150\" rx=\"6\"/><text class=\"tb\" x=\"90.0\" y=\"115.0\" text-anchor=\"middle\">Decoder<\/text><path class=\"w\" d=\"M26,77.5 H40\"/><text class=\"tl\" x=\"46\" y=\"81.5\" text-anchor=\"start\">A<\/text><path class=\"w\" d=\"M26,115.0 H40\"/><text class=\"tl\" x=\"46\" y=\"119.0\" text-anchor=\"start\">B<\/text><path class=\"w\" d=\"M26,152.5 H40\"/><text class=\"tl\" x=\"46\" y=\"156.5\" text-anchor=\"start\">C<\/text><path class=\"w\" d=\"M140,56.66666666666667 H154\"/><text class=\"tl\" x=\"134\" y=\"60.66666666666667\" text-anchor=\"end\">m0<\/text><path class=\"w\" d=\"M140,73.33333333333334 H154\"/><text class=\"tl\" x=\"134\" y=\"77.33333333333334\" text-anchor=\"end\">m1<\/text><path class=\"w\" d=\"M140,90.0 H154\"/><text class=\"tl\" x=\"134\" y=\"94.0\" text-anchor=\"end\">m2<\/text><path class=\"w\" d=\"M140,106.66666666666667 H154\"/><text class=\"tl\" x=\"134\" y=\"110.66666666666667\" text-anchor=\"end\">m3<\/text><path class=\"w\" d=\"M140,123.33333333333333 H154\"/><text class=\"tl\" x=\"134\" y=\"127.33333333333333\" text-anchor=\"end\">m4<\/text><path class=\"w\" d=\"M140,140.0 H154\"/><text class=\"tl\" x=\"134\" y=\"144.0\" text-anchor=\"end\">m5<\/text><path class=\"w\" d=\"M140,156.66666666666669 H154\"/><text class=\"tl\" x=\"134\" y=\"160.66666666666669\" text-anchor=\"end\">m6<\/text><path class=\"w\" d=\"M140,173.33333333333334 H154\"/><text class=\"tl\" x=\"134\" y=\"177.33333333333334\" text-anchor=\"end\">m7<\/text><path class=\"w\" d=\"M16,77.5 L26,77.5\"/><text class=\"t\" x=\"12\" y=\"81.5\" text-anchor=\"end\">A<\/text><path class=\"w\" d=\"M16,115.0 L26,115.0\"/><text class=\"t\" x=\"12\" y=\"119.0\" text-anchor=\"end\">B<\/text><path class=\"w\" d=\"M16,152.5 L26,152.5\"/><text class=\"t\" x=\"12\" y=\"156.5\" text-anchor=\"end\">C<\/text><path class=\"w\" d=\"M260,40 L260,200\"/><text class=\"tb\" x=\"260\" y=\"224\" text-anchor=\"middle\">F1<\/text><path class=\"w\" d=\"M154,56.66666666666667 L380,56.66666666666667\"/><path class=\"w\" d=\"M154,73.33333333333334 L380,73.33333333333334\"/><circle class=\"jn\" cx=\"260\" cy=\"73.33333333333334\" r=\"3.5\"/><path class=\"w\" d=\"M154,90.0 L380,90.0\"/><circle class=\"jn\" cx=\"260\" cy=\"90.0\" r=\"3.5\"/><path class=\"w\" d=\"M154,106.66666666666667 L380,106.66666666666667\"/><path class=\"w\" d=\"M154,123.33333333333333 L380,123.33333333333333\"/><circle class=\"jn\" cx=\"260\" cy=\"123.33333333333333\" r=\"3.5\"/><path class=\"w\" d=\"M154,140.0 L380,140.0\"/><path class=\"w\" d=\"M154,156.66666666666669 L380,156.66666666666669\"/><path class=\"w\" d=\"M154,173.33333333333334 L380,173.33333333333334\"/><circle class=\"jn\" cx=\"260\" cy=\"173.33333333333334\" r=\"3.5\"/><path class=\"w\" d=\"M330,40 L330,200\"/><text class=\"tb\" x=\"330\" y=\"224\" text-anchor=\"middle\">F2<\/text><circle class=\"jn\" cx=\"330\" cy=\"106.66666666666667\" r=\"3.5\"/><circle class=\"jn\" cx=\"330\" cy=\"140.0\" r=\"3.5\"/><circle class=\"jn\" cx=\"330\" cy=\"156.66666666666669\" r=\"3.5\"/><circle class=\"jn\" cx=\"330\" cy=\"173.33333333333334\" r=\"3.5\"/>", "caption": "ROM used as a PLD: any function of 3 variables is programmed as a sum of minterms. Dots mark the programmed connections. F1 = sum m(1,2,4,7) (3-input XOR), F2 = sum m(3,5,6,7) (majority)"}}, {"h": "Example: full adder or XOR with a ROM", "p": ["A 3-input, 2-output function (like F1 = XOR of three inputs, F2 = majority) needs only an **8 x 2 ROM**. Contents are copied directly from the truth table: this is exactly a full adder (sum and carry)."]}, {"h": "Types of PLDs", "table": {"head": ["PLD", "AND array", "OR array"], "rows": [["ROM", "Fixed", "Programmable"], ["PLA", "Programmable", "Programmable"], ["PAL", "Programmable", "Fixed"]]}}, {"h": "Limits", "p": ["The ROM size doubles for every extra input (**2^n words**), so large functions waste space: that led to **PLA and PAL** which only generate the product terms that are needed."], "warn": "ROM is efficient only for functions with few inputs."}], "analogy": "ROM as PLD = a lookup book. Instead of building a circuit, you just write the answer for every input in the book.", "hinglish": "ROM me AND array fixed (decoder) hoti hai aur OR array programmable. Isliye koi bhi truth table ROM me likh kar function bana sakte hain.", "mistakes": ["Forgetting that the ROM AND array is fixed.", "Using a ROM for a function with many inputs."], "remember": ["ROM = fixed AND (decoder) + programmable OR", "Programs any truth table (sum of minterms)", "8 x 2 ROM implements a full adder", "PLD types: ROM, PLA, PAL", "ROM size grows as 2^n"], "def": "A ROM with **n address lines** is a **fixed decoder** (AND array giving all 2^n minterms) followed by a **programmable OR array**. Each output is a **sum of minterms**. So **any combinational function** can be programmed as a ROM truth table. The address inputs are the logic inputs and the data outputs are the functions."}, "u6-t1": {"tldr": "PLA and PAL are small programmable chips with an AND plane and an OR plane. You program the connections to build your own logic functions.", "sections": [{"h": "PLA (Programmable Logic Array)", "p": ["**Both the AND array and OR array are programmable**. Product terms can be **shared** between outputs (AB is used in both F1 and F2). Most flexible but **slower and costlier**."], "viz": {"type": "svg", "w": 520, "h": 248, "svg": "<path class=\"w\" d=\"M70,50 L70,168\"/><text class=\"tb\" x=\"70\" y=\"42\" text-anchor=\"middle\">A<\/text><path class=\"w\" d=\"M104,50 L104,168\"/><text class=\"tb\" x=\"104\" y=\"42\" text-anchor=\"middle\">A'<\/text><path class=\"w\" d=\"M138,50 L138,168\"/><text class=\"tb\" x=\"138\" y=\"42\" text-anchor=\"middle\">B<\/text><path class=\"w\" d=\"M172,50 L172,168\"/><text class=\"tb\" x=\"172\" y=\"42\" text-anchor=\"middle\">B'<\/text><path class=\"w\" d=\"M206,50 L206,168\"/><text class=\"tb\" x=\"206\" y=\"42\" text-anchor=\"middle\">C<\/text><path class=\"w\" d=\"M240,50 L240,168\"/><text class=\"tb\" x=\"240\" y=\"42\" text-anchor=\"middle\">C'<\/text><path class=\"w\" d=\"M50,76 L280,76\"/><text class=\"tb\" x=\"44\" y=\"80\" text-anchor=\"end\">P1<\/text><path class=\"g0\" d=\"M65,71 L75,81 M65,81 L75,71\"/><path class=\"g0\" d=\"M133,71 L143,81 M133,81 L143,71\"/><path class=\"w\" d=\"M50,112 L280,112\"/><text class=\"tb\" x=\"44\" y=\"116\" text-anchor=\"end\">P2<\/text><path class=\"g0\" d=\"M99,107 L109,117 M99,117 L109,107\"/><path class=\"g0\" d=\"M201,107 L211,117 M201,117 L211,107\"/><path class=\"w\" d=\"M50,148 L280,148\"/><text class=\"tb\" x=\"44\" y=\"152\" text-anchor=\"end\">P3<\/text><path class=\"g0\" d=\"M133,143 L143,153 M133,153 L143,143\"/><path class=\"g0\" d=\"M235,143 L245,153 M235,153 L245,143\"/><path class=\"w\" d=\"M340,50 L340,168\"/><text class=\"tb\" x=\"340\" y=\"188\" text-anchor=\"middle\">F1<\/text><path class=\"w\" d=\"M390,50 L390,168\"/><text class=\"tb\" x=\"390\" y=\"188\" text-anchor=\"middle\">F2<\/text><path class=\"w\" d=\"M280,76 L410,76\"/><path class=\"w\" d=\"M280,112 L410,112\"/><path class=\"w\" d=\"M280,148 L410,148\"/><circle class=\"jn\" cx=\"340\" cy=\"76\" r=\"3.5\"/><circle class=\"jn\" cx=\"390\" cy=\"76\" r=\"3.5\"/><circle class=\"jn\" cx=\"340\" cy=\"112\" r=\"3.5\"/><circle class=\"jn\" cx=\"390\" cy=\"148\" r=\"3.5\"/><text class=\"tb\" x=\"150\" y=\"236\" text-anchor=\"middle\">AND array<\/text><text class=\"t\" x=\"365.0\" y=\"236\" text-anchor=\"middle\"><\/text><text class=\"tb\" x=\"365\" y=\"38\" text-anchor=\"middle\">OR array<\/text>", "caption": "PLA: both AND and OR arrays are programmable. X = programmed AND input, dot = programmed OR connection. F1 = AB + A'C, F2 = AB + BC' (product P1 = AB is shared)"}}, {"h": "PAL (Programmable Array Logic)", "p": ["**AND array programmable, OR array fixed**. Each output ORs only a fixed number of product terms (e.g. 2 or 4), so the terms **cannot be shared**. **Cheaper and faster**; the most popular. Often has **output flip-flops (registered PAL)** and feedback (e.g. PAL16R8, PAL16L8, GAL)."], "viz": {"type": "svg", "w": 520, "h": 284, "svg": "<path class=\"w\" d=\"M70,50 L70,204\"/><text class=\"tb\" x=\"70\" y=\"42\" text-anchor=\"middle\">A<\/text><path class=\"w\" d=\"M104,50 L104,204\"/><text class=\"tb\" x=\"104\" y=\"42\" text-anchor=\"middle\">A'<\/text><path class=\"w\" d=\"M138,50 L138,204\"/><text class=\"tb\" x=\"138\" y=\"42\" text-anchor=\"middle\">B<\/text><path class=\"w\" d=\"M172,50 L172,204\"/><text class=\"tb\" x=\"172\" y=\"42\" text-anchor=\"middle\">B'<\/text><path class=\"w\" d=\"M206,50 L206,204\"/><text class=\"tb\" x=\"206\" y=\"42\" text-anchor=\"middle\">C<\/text><path class=\"w\" d=\"M240,50 L240,204\"/><text class=\"tb\" x=\"240\" y=\"42\" text-anchor=\"middle\">C'<\/text><path class=\"w\" d=\"M50,76 L280,76\"/><text class=\"tb\" x=\"44\" y=\"80\" text-anchor=\"end\">P1<\/text><path class=\"g0\" d=\"M65,71 L75,81 M65,81 L75,71\"/><path class=\"g0\" d=\"M133,71 L143,81 M133,81 L143,71\"/><path class=\"w\" d=\"M50,112 L280,112\"/><text class=\"tb\" x=\"44\" y=\"116\" text-anchor=\"end\">P2<\/text><path class=\"g0\" d=\"M99,107 L109,117 M99,117 L109,107\"/><path class=\"g0\" d=\"M201,107 L211,117 M201,117 L211,107\"/><path class=\"w\" d=\"M50,148 L280,148\"/><text class=\"tb\" x=\"44\" y=\"152\" text-anchor=\"end\">P3<\/text><path class=\"g0\" d=\"M133,143 L143,153 M133,153 L143,143\"/><path class=\"g0\" d=\"M235,143 L245,153 M235,153 L245,143\"/><path class=\"w\" d=\"M50,184 L280,184\"/><text class=\"tb\" x=\"44\" y=\"188\" text-anchor=\"end\">P4<\/text><path class=\"g0\" d=\"M65,179 L75,189 M65,189 L75,179\"/><path class=\"g0\" d=\"M133,179 L143,189 M133,189 L143,179\"/><path class=\"w\" d=\"M340,50 L340,204\"/><text class=\"tb\" x=\"340\" y=\"224\" text-anchor=\"middle\">F1<\/text><path class=\"w\" d=\"M390,50 L390,204\"/><text class=\"tb\" x=\"390\" y=\"224\" text-anchor=\"middle\">F2<\/text><path class=\"w\" d=\"M280,76 L410,76\"/><path class=\"w\" d=\"M280,112 L410,112\"/><path class=\"w\" d=\"M280,148 L410,148\"/><path class=\"w\" d=\"M280,184 L410,184\"/><rect class=\"g0\" x=\"336\" y=\"72\" width=\"8\" height=\"8\"/><rect class=\"g0\" x=\"336\" y=\"108\" width=\"8\" height=\"8\"/><rect class=\"g0\" x=\"386\" y=\"144\" width=\"8\" height=\"8\"/><rect class=\"g0\" x=\"386\" y=\"180\" width=\"8\" height=\"8\"/><text class=\"tb\" x=\"150\" y=\"272\" text-anchor=\"middle\">AND array<\/text><text class=\"t\" x=\"365.0\" y=\"272\" text-anchor=\"middle\"><\/text><text class=\"tb\" x=\"365\" y=\"38\" text-anchor=\"middle\">OR array<\/text>", "caption": "PAL: AND array programmable, OR array fixed (each output gets its own product terms; no sharing, so AB appears twice). F1 = P1 + P2, F2 = P3 + P4"}}, {"h": "Comparison", "table": {"head": ["Feature", "ROM", "PLA", "PAL"], "rows": [["AND array", "Fixed", "Programmable", "Programmable"], ["OR array", "Programmable", "Programmable", "Fixed"], ["Flexibility", "Low", "Highest", "Medium"], ["Cost", "Low", "High", "Lowest"], ["Speed", "Medium", "Slower", "Fastest"], ["Product term sharing", "All minterms", "Yes", "No"]]}}, {"h": "Programming", "x": 1, "p": ["**Fuse-link (PROM type)**: burn unwanted links. **EPROM/EEPROM (reprogrammable)**: GAL devices. **SRAM-based**: FPGAs (reprogrammed at power-up). Programming is done from a truth table or Boolean equations using a **PLD programmer**."]}], "analogy": "A PLA is a blank LEGO board where you can choose both which bricks to join (AND) and how to group them (OR). A PAL is a board where the grouping is fixed and only the joins are your choice.", "hinglish": "PLA me AND aur OR dono arrays programmable hote hain, PAL me sirf AND. PAL sasta aur fast hai, PLA zyada flexible.", "mistakes": ["Sharing product terms in a PAL (not possible: OR array is fixed).", "Drawing a crossing as a connection when no X is present."], "remember": ["PLD: AND array then OR array", "PLA: both arrays programmable; terms shared", "PAL: AND programmable, OR fixed; no sharing", "PAL is cheaper and faster than PLA", "Fuse, EPROM/EEPROM, SRAM based", "GAL = reprogrammable PAL"], "def": "Instead of wiring many gates (SSI/MSI chips), a **PLD** is **one chip** programmed to the needed function. Any Boolean function is a **sum of products**, so PLDs have an **AND array (products)** followed by an **OR array (sums)**, with programmable fuse/antifuse/EPROM links at the crossings."}, "u6-t2": {"tldr": "CPLD and FPGA are large programmable chips that can hold a whole digital system, from counters to processors.", "sections": [{"h": "CPLD (Complex PLD)", "p": [], "viz": {"type": "svg", "w": 560, "h": 300, "svg": "<rect class=\"g0\" x=\"40\" y=\"40\" width=\"110\" height=\"70\" rx=\"5\"/><text class=\"tb\" x=\"95.0\" y=\"75.0\" text-anchor=\"middle\">Logic block<\/text><text class=\"t\" x=\"95.0\" y=\"91.0\" text-anchor=\"middle\">PAL-like<\/text><rect class=\"g0\" x=\"190\" y=\"40\" width=\"110\" height=\"70\" rx=\"5\"/><text class=\"tb\" x=\"245.0\" y=\"75.0\" text-anchor=\"middle\">Logic block<\/text><text class=\"t\" x=\"245.0\" y=\"91.0\" text-anchor=\"middle\">PAL-like<\/text><rect class=\"g0\" x=\"40\" y=\"140\" width=\"110\" height=\"70\" rx=\"5\"/><text class=\"tb\" x=\"95.0\" y=\"175.0\" text-anchor=\"middle\">Logic block<\/text><text class=\"t\" x=\"95.0\" y=\"191.0\" text-anchor=\"middle\">PAL-like<\/text><rect class=\"g0\" x=\"190\" y=\"140\" width=\"110\" height=\"70\" rx=\"5\"/><text class=\"tb\" x=\"245.0\" y=\"175.0\" text-anchor=\"middle\">Logic block<\/text><text class=\"t\" x=\"245.0\" y=\"191.0\" text-anchor=\"middle\">PAL-like<\/text><rect class=\"g0\" x=\"360\" y=\"40\" width=\"90\" height=\"170\" rx=\"5\"/><text class=\"tb\" x=\"405.0\" y=\"125.0\" text-anchor=\"middle\">Switch<\/text><text class=\"t\" x=\"405.0\" y=\"141.0\" text-anchor=\"middle\">matrix<\/text><path class=\"w\" d=\"M150,75 L190,75\"/><path class=\"w\" d=\"M300,75 L360,75\"/><path class=\"w\" d=\"M150,175 L190,175\"/><path class=\"w\" d=\"M300,175 L360,175\"/><text class=\"tb\" x=\"280\" y=\"256\" text-anchor=\"middle\">I/O blocks around the edge, global clock and control<\/text><path class=\"w\" d=\"M450,125 L520,125\" marker-end=\"url(#da)\"/><text class=\"tb\" x=\"526\" y=\"129\" text-anchor=\"start\">I/O<\/text>", "caption": "CPLD: several PAL-like logic blocks joined by one central programmable interconnect (switch matrix) and surrounded by I/O blocks"}}, {"h": "FPGA (Field Programmable Gate Array)", "p": ["An FPGA is a **grid of CLBs (configurable logic blocks)** connected by **programmable routing** and surrounded by **I/O blocks**. Most FPGAs store the configuration in **SRAM**, so they are **reprogrammed at power-up** from external memory. Capacity: millions of gates; also include **block RAM, multipliers (DSP), PLLs**. Examples: **Xilinx Spartan/Artix, Altera Cyclone**."], "viz": {"type": "svg", "w": 560, "h": 345, "svg": "<rect class=\"g0\" x=\"90\" y=\"50\" width=\"50\" height=\"34\" rx=\"4\"/><text class=\"tb\" x=\"115\" y=\"71\" text-anchor=\"middle\">CLB<\/text><rect class=\"g0\" x=\"180\" y=\"50\" width=\"50\" height=\"34\" rx=\"4\"/><text class=\"tb\" x=\"205\" y=\"71\" text-anchor=\"middle\">CLB<\/text><rect class=\"g0\" x=\"270\" y=\"50\" width=\"50\" height=\"34\" rx=\"4\"/><text class=\"tb\" x=\"295\" y=\"71\" text-anchor=\"middle\">CLB<\/text><rect class=\"g0\" x=\"360\" y=\"50\" width=\"50\" height=\"34\" rx=\"4\"/><text class=\"tb\" x=\"385\" y=\"71\" text-anchor=\"middle\">CLB<\/text><rect class=\"g0\" x=\"90\" y=\"110\" width=\"50\" height=\"34\" rx=\"4\"/><text class=\"tb\" x=\"115\" y=\"131\" text-anchor=\"middle\">CLB<\/text><rect class=\"g0\" x=\"180\" y=\"110\" width=\"50\" height=\"34\" rx=\"4\"/><text class=\"tb\" x=\"205\" y=\"131\" text-anchor=\"middle\">CLB<\/text><rect class=\"g0\" x=\"270\" y=\"110\" width=\"50\" height=\"34\" rx=\"4\"/><text class=\"tb\" x=\"295\" y=\"131\" text-anchor=\"middle\">CLB<\/text><rect class=\"g0\" x=\"360\" y=\"110\" width=\"50\" height=\"34\" rx=\"4\"/><text class=\"tb\" x=\"385\" y=\"131\" text-anchor=\"middle\">CLB<\/text><rect class=\"g0\" x=\"90\" y=\"170\" width=\"50\" height=\"34\" rx=\"4\"/><text class=\"tb\" x=\"115\" y=\"191\" text-anchor=\"middle\">CLB<\/text><rect class=\"g0\" x=\"180\" y=\"170\" width=\"50\" height=\"34\" rx=\"4\"/><text class=\"tb\" x=\"205\" y=\"191\" text-anchor=\"middle\">CLB<\/text><rect class=\"g0\" x=\"270\" y=\"170\" width=\"50\" height=\"34\" rx=\"4\"/><text class=\"tb\" x=\"295\" y=\"191\" text-anchor=\"middle\">CLB<\/text><rect class=\"g0\" x=\"360\" y=\"170\" width=\"50\" height=\"34\" rx=\"4\"/><text class=\"tb\" x=\"385\" y=\"191\" text-anchor=\"middle\">CLB<\/text><rect class=\"g0\" x=\"90\" y=\"230\" width=\"50\" height=\"34\" rx=\"4\"/><text class=\"tb\" x=\"115\" y=\"251\" text-anchor=\"middle\">CLB<\/text><rect class=\"g0\" x=\"180\" y=\"230\" width=\"50\" height=\"34\" rx=\"4\"/><text class=\"tb\" x=\"205\" y=\"251\" text-anchor=\"middle\">CLB<\/text><rect class=\"g0\" x=\"270\" y=\"230\" width=\"50\" height=\"34\" rx=\"4\"/><text class=\"tb\" x=\"295\" y=\"251\" text-anchor=\"middle\">CLB<\/text><rect class=\"g0\" x=\"360\" y=\"230\" width=\"50\" height=\"34\" rx=\"4\"/><text class=\"tb\" x=\"385\" y=\"251\" text-anchor=\"middle\">CLB<\/text><line class=\"w\" x1=\"115\" y1=\"42\" x2=\"115\" y2=\"284\" stroke-dasharray=\"2 4\" opacity=\".6\"/><line class=\"w\" x1=\"205\" y1=\"42\" x2=\"205\" y2=\"284\" stroke-dasharray=\"2 4\" opacity=\".6\"/><line class=\"w\" x1=\"295\" y1=\"42\" x2=\"295\" y2=\"284\" stroke-dasharray=\"2 4\" opacity=\".6\"/><line class=\"w\" x1=\"385\" y1=\"42\" x2=\"385\" y2=\"284\" stroke-dasharray=\"2 4\" opacity=\".6\"/><line class=\"w\" x1=\"76\" y1=\"67\" x2=\"416\" y2=\"67\" stroke-dasharray=\"2 4\" opacity=\".6\"/><line class=\"w\" x1=\"76\" y1=\"127\" x2=\"416\" y2=\"127\" stroke-dasharray=\"2 4\" opacity=\".6\"/><line class=\"w\" x1=\"76\" y1=\"187\" x2=\"416\" y2=\"187\" stroke-dasharray=\"2 4\" opacity=\".6\"/><line class=\"w\" x1=\"76\" y1=\"247\" x2=\"416\" y2=\"247\" stroke-dasharray=\"2 4\" opacity=\".6\"/><rect class=\"g0\" x=\"100\" y=\"14\" width=\"30\" height=\"18\" rx=\"3\"/><text class=\"t\" x=\"115\" y=\"27\" text-anchor=\"middle\">I/O<\/text><rect class=\"g0\" x=\"100\" y=\"290\" width=\"30\" height=\"18\" rx=\"3\"/><text class=\"t\" x=\"115\" y=\"303\" text-anchor=\"middle\">I/O<\/text><rect class=\"g0\" x=\"190\" y=\"14\" width=\"30\" height=\"18\" rx=\"3\"/><text class=\"t\" x=\"205\" y=\"27\" text-anchor=\"middle\">I/O<\/text><rect class=\"g0\" x=\"190\" y=\"290\" width=\"30\" height=\"18\" rx=\"3\"/><text class=\"t\" x=\"205\" y=\"303\" text-anchor=\"middle\">I/O<\/text><rect class=\"g0\" x=\"280\" y=\"14\" width=\"30\" height=\"18\" rx=\"3\"/><text class=\"t\" x=\"295\" y=\"27\" text-anchor=\"middle\">I/O<\/text><rect class=\"g0\" x=\"280\" y=\"290\" width=\"30\" height=\"18\" rx=\"3\"/><text class=\"t\" x=\"295\" y=\"303\" text-anchor=\"middle\">I/O<\/text><rect class=\"g0\" x=\"370\" y=\"14\" width=\"30\" height=\"18\" rx=\"3\"/><text class=\"t\" x=\"385\" y=\"27\" text-anchor=\"middle\">I/O<\/text><rect class=\"g0\" x=\"370\" y=\"290\" width=\"30\" height=\"18\" rx=\"3\"/><text class=\"t\" x=\"385\" y=\"303\" text-anchor=\"middle\">I/O<\/text><text class=\"tl\" x=\"280\" y=\"334\" text-anchor=\"middle\">Dotted lines: programmable routing channels with switch matrices<\/text>", "caption": "FPGA architecture: an array of configurable logic blocks (CLBs), programmable routing and I/O blocks. The configuration is stored in SRAM"}}, {"h": "CLB and LUT", "p": ["A CLB contains **look-up tables (LUTs)**, **flip-flops** and **multiplexers**. A **4-input LUT** is a 16-bit SRAM and can implement any of **65536** functions of 4 variables. The flip-flop makes it registered (sequential logic)."], "viz": {"type": "svg", "w": 480, "h": 180, "svg": "<rect class=\"g0\" x=\"70\" y=\"40\" width=\"120\" height=\"90\" rx=\"5\"/><text class=\"tb\" x=\"130.0\" y=\"85.0\" text-anchor=\"middle\">4-input LUT<\/text><text class=\"t\" x=\"130.0\" y=\"101.0\" text-anchor=\"middle\">16 x 1 SRAM<\/text><rect class=\"g0\" x=\"260\" y=\"50\" width=\"80\" height=\"60\" rx=\"5\"/><text class=\"tb\" x=\"300.0\" y=\"84.0\" text-anchor=\"middle\">D FF<\/text><text class=\"tb\" x=\"30\" y=\"56\" text-anchor=\"end\">A<\/text><path class=\"w\" d=\"M36,52 L70,52\"/><text class=\"tb\" x=\"30\" y=\"76\" text-anchor=\"end\">B<\/text><path class=\"w\" d=\"M36,72 L70,72\"/><text class=\"tb\" x=\"30\" y=\"96\" text-anchor=\"end\">C<\/text><path class=\"w\" d=\"M36,92 L70,92\"/><text class=\"tb\" x=\"30\" y=\"116\" text-anchor=\"end\">D<\/text><path class=\"w\" d=\"M36,112 L70,112\"/><path class=\"w\" d=\"M190,85 L260,85\"/><text class=\"t\" x=\"225\" y=\"78\" text-anchor=\"middle\">f<\/text><path class=\"w\" d=\"M340,85 L380,85\"/><path class=\"g0\" d=\"M380,70 L400,78 L400,110 L380,118 Z\"/><path class=\"w\" d=\"M340,85 L380,85\"/><text class=\"tb\" x=\"392\" y=\"138\" text-anchor=\"middle\">MUX<\/text><path class=\"w\" d=\"M225,85 L225,128 L372,128 L372,108 L380,108\"/><path class=\"w\" d=\"M400,94 L450,94\" marker-end=\"url(#da)\"/><text class=\"tb\" x=\"456\" y=\"98\" text-anchor=\"start\">Out<\/text><text class=\"t\" x=\"300\" y=\"40\" text-anchor=\"middle\">CLK<\/text>", "caption": "Inside a CLB: a look-up table (LUT) implements any function of its inputs, followed by an optional flip-flop and a multiplexer"}}, {"h": "CPLD vs FPGA", "table": {"head": ["Feature", "CPLD", "FPGA"], "rows": [["Architecture", "Few PAL-like blocks", "Large array of CLBs + routing"], ["Capacity", "Thousands of gates", "Millions of gates"], ["Memory", "EEPROM/flash (non-volatile)", "SRAM (volatile; needs boot)"], ["Timing", "Predictable", "Depends on routing"], ["Power", "Low", "Higher"], ["Used for", "Glue logic, control", "Complex systems, DSP, processors"]]}}, {"h": "Design flow", "x": 1, "p": ["Design entry (**VHDL/Verilog** or schematic) → **synthesis** → **place and route** → **bitstream** → program the device → test. Applications: **prototyping ASICs, DSP, image processing, networking, soft-core CPUs**."]}], "analogy": "CPLD = a few big offices (PAL blocks) joined by one corridor. FPGA = a whole city of tiny shops (CLBs) with roads (routing) you can redraw any time.", "hinglish": "CPLD me kai PAL-jaise blocks aur ek switch matrix hota hai, non-volatile. FPGA me CLB ka array aur routing hoti hai, SRAM based. CLB = LUT + flip-flop + mux.", "mistakes": ["Calling an FPGA non-volatile (SRAM-based FPGAs lose the configuration at power-off).", "Mixing up the CLB with the I/O block."], "remember": ["CPLD: PAL-like blocks + switch matrix; non-volatile", "FPGA: CLB array + routing + I/O; SRAM based", "CLB = LUT + FF + MUX", "4-input LUT = 16-bit SRAM", "CPLD: small and predictable; FPGA: large and flexible", "Design flow: HDL, synthesis, place and route, bitstream"], "def": "A CPLD has **several PAL-like logic blocks** (each with product terms and macrocells with flip-flops) joined by a **programmable interconnect (switch matrix)**, plus **I/O blocks**. Configuration is stored in **EEPROM/flash** so it is **non-volatile** (instant on). Delay is predictable. Typical capacity: thousands of gates. Examples: **Xilinx XC9500, Altera MAX**."}};
const ELI5 = {"u1-t1": {"story": "Socho tum 'sab milke chalo' bol ke trip plan karte ho. **AND gate** wo group hai jahan **ek bhi dost** na aaye to trip cancel (sabka yes chahiye). **OR gate** wo hai jahan ek bhi bol de 'chalo' to trip pakka (ek bhi hamesha ready rehta hai). **NOT gate** wo dost hai jo hamesha ulta bolta hai: tum 'haan' bolo to wo 'nahi'. **XOR** wo couple hai jo tabhi khush rehta hai jab dono **alag** mood me ho: dono gusse me ho to ladai, dono khush ho to bhi ladai. Aur **NAND** AND ka ulta, jo universal hai, jaise ek sasta Jio recharge jisse sab kuch ho jaata hai.", "items": [["🚪", "AND", "Sabka yes chahiye."], ["🔔", "OR", "Ek bhi yes kaafi."], ["🙃", "NOT", "Ulta bolne wala dost."], ["🌍", "NAND/NOR", "Sirf inse poora computer ban sakta hai."]], "line": "Gate = input rules se decide karne wala chhota bouncer; NAND/NOR universal hain."}, "u1-t2": {"story": "Boolean algebra ka kaam hai **circuit ka size kam karna**, bilkul waise jaise shaadi ki guest list kam karna jab budget nahi hai. Expression `A + A'B` me 3 cheezein hain, par simplify karke `A + B` bacha: matlab ek gate aur ek wire bach gaya, aur bacha hua paisa tum chai par udao. **De Morgan** ka funda: 'NOT (tum aur main)' ka matlab 'tum nahi YA main nahi'. Jaise ex bolti hai 'hum dono saath nahi hain' to matlab ya to tum ya wo, kam se kam ek ne chhoda hai. Bar tod do, sign badal do, aur dard bhi badal jata hai.", "items": [["✂️", "Simplify", "Kam gates = kam cost, kam power, zyada speed."], ["🪞", "Duality", "Sab kuch ulta karo, rule phir bhi sahi."], ["🔔", "De Morgan", "Bar todo, sign badlo."], ["📜", "Laws", "Ordinary algebra jaisi, bas distributive double hai."]], "line": "Boolean algebra se expression chhota karte hain; De Morgan sabse zyada poochha jata hai."}, "u1-t3": {"story": "Number system sirf ek **language** hai. Jaise tumhari mummy ko 'beta kab shaadi karoge' har language me samajh aata hai, wahi sawal Hindi, English aur Bhojpuri me alag lagta hai par matlab same. Computer sirf **binary** samajhta hai (ON ya OFF), jaise tumhari girlfriend ka mood: kuch beech me nahi hota. **Hex** ek shortcut hai: 16 ke 4 bits, taaki lambe 1010101 likhne ki jagah 'AF' likho aur dikhao ki tum programmer ho.", "items": [["🔟", "Decimal", "Insaanon ki bhasha."], ["0️⃣", "Binary", "Computer ki bhasha: 0 aur 1."], ["🔡", "Hex", "Binary ka chhota form, 4 bits = 1 digit."], ["🔁", "Conversion", "Divide ya multiply by base."]], "line": "Base badlo, value wahi rehti hai; 3 bits = octal digit, 4 bits = hex digit."}, "u1-t4": {"story": "Computer ko **subtract karna aata hi nahi**, wo sirf jodna jaanta hai. To wo trick lagata hai: '13 - 6' ko '13 + (-6)' bana deta hai. Bilkul jaise tum ex ko 'block' nahi karte, bas 'minus' kar dete ho: negative ko complement se banate ho aur wapas jod dete ho. **2's complement** ka funda: sab bits ulta karo aur 1 jodo. **Overflow** tab hota hai jab tum 4-bit ki jagah me 5 jitna bada number rakhne ki koshish karo, jaise 2BHK me 8 dost ghusana: kuch na kuch bahar gir jata hai (aur wo sign bit hota hai).", "items": [["🔄", "1's complement", "Bas flip."], ["➕", "2's complement", "Flip plus 1. Ek hi zero."], ["🚫", "Carry", "2's comp me carry discard, 1's me wapas jodo."], ["💥", "Overflow", "Jab answer n bits me na samaye."]], "line": "Subtraction = addition of 2's complement; carry batata hai answer positive hai ya negative."}, "u1-t5": {"story": "Socho tum WhatsApp par 'tum meri jaan ho' bhej rahe ho aur network kharab hai. Receiver ko mila 'tum meri jaan ho' ya 'tum meri **jaan lo**'? Dono me bas ek bit ka farak hai, par matlab me 180 degree. **Parity bit** wo dost hai jo bolta hai 'bhai count check kar, kuch gadbad lag rahi hai', par ye nahi batata ki **kya** gadbad hai. **Hamming code** wo dost hai jo bolta hai 'teesra letter galat hai, ye le sahi wala', yani error pakda bhi aur theek bhi kiya. Isliye isko ECC memory me use karte hain, taaki server ka data tumhare relationship status ki tarah achanak na badal jaye.", "items": [["🧿", "Parity", "Ek extra bit, error detect, correct nahi."], ["🩹", "Hamming", "Error detect aur correct dono."], ["🔁", "Gray", "Ek baar me ek hi bit badalta hai."], ["🔤", "ASCII", "Letters ko numbers me badalta hai."]], "line": "Parity = detect, Hamming = detect + correct; syndrome = error ki position."}, "u1-t6": {"story": "**TTL** wo purane, strict teacher jaisa hai: fast kaam, par poora din bijli (chai) peeta hai. **CMOS** wo topper hai jo energy bachata hai, par thoda slow tha (ab speed bhi aa gayi). **Fan-out** matlab ek aadmi kitne logon ko manage kar sakta hai: tumhara fan-out zero hai jab teen jagah 'haan abhi aata hu' bol deta ho. **Tri-state** ek hi WhatsApp group me teen log ek saath bolne lage to sab kuch confusion, isliye ek time par sirf ek ko 'enable' milta hai, baaki Hi-Z (chup, jaise group me hamesha rehne wala silent dost).", "items": [["🏎️", "TTL", "Fast, zyada power."], ["🔋", "CMOS", "Kam power, high noise margin."], ["🪄", "Schottky", "Saturation roko, speed badhao."], ["🤐", "Tri-state", "0, 1 aur Hi-Z: bus share karne ke liye."]], "line": "TTL = speed, CMOS = power saving; tri-state se ek bus par kai devices."}, "u2-t1": {"story": "**K-map** ek seating chart hai jahan padosi seats me sirf **ek** cheez alag hoti hai. Isliye tum 00, 01, **11**, 10 likhte ho (11 pehle, 10 baad me), kyunki Gray code me ek step me ek hi bit badalta hai. Ye wahi hai jaise class ki seating jahan do paas wale dost sirf ek cheez me alag hain: ek ke paas notes, doosre ke paas nahi. Aur K-map **gol** hai: left aur right edge milte hain, top aur bottom bhi, jaise social media pe sabka sab se connection 6 degree me hai. Minterm = 'ye exact row jahan answer 1 aaya', maxterm = 'ye exact row jahan answer 0 aaya'.", "items": [["🧩", "Minterm", "AND term, ek row par 1."], ["🔗", "Maxterm", "OR term, ek row par 0."], ["🧬", "Gray order", "00 01 11 10, ek bit ka farak."], ["🔄", "Wrap-around", "Edges aur corners padosi hain."]], "line": "K-map = truth table ka Gray-order picture; padosi cells jodo to variable hat jata hai."}, "u2-t2": {"story": "K-map simplification matlab **dosti ke groups banana**: jo 1s paas-paas hain unhe ek rubber band me baandh do. Group jitna bada, answer utna chhota. Ek rule jo har banda bhool jata hai: group **2, 4, 8** ka hona chahiye, 3 ka nahi, jaise friend group me 3 log hamesha ek ko akela chhod dete hain. **Don't care** wo hai jo kehta hai 'mujhe farak nahi padta, jo tum chaho kar lo', yaani ek aisa dost jo ghar me khaana banane me bhi ready aur movie me bhi ready, use jahan fit ho wahan daalo. Aur haan, K-map wrap hota hai, to corners ke 4 cells bhi ek family hain, chahe family WhatsApp group me ho ya nahi.", "items": [["📦", "Group size", "1, 2, 4, 8, 16 only."], ["🔄", "Wrap", "Edges aur corners paas hain."], ["🤷", "Don't care", "X ko 1 maano agar group bada ho."], ["✂️", "Variables", "Jo change ho wo hat jaye."]], "line": "Bade-se-bade power-of-2 groups banao; jo variable badle wo hatao."}, "u2-t3": {"story": "**Q-M method** K-map ka **sarkari babu** version hai: jo bhi kaam K-map me aankh se hota tha, yahan table aur form bhar ke hota hai. Slow hai, par kabhi galat nahi hota (bas tumhari handwriting hoti hai). Rule simple: do numbers jinme **sirf ek bit ka farak** ho, unhe jodo aur us bit ki jagah dash daal do. Jaise do dost jinme sirf ek hi problem hai (dono single hain), unhe set kar do. Jo kisi se nahi mila wo **prime implicant** hai: akela, independent, aur shaadi ke liye ready.", "items": [["🔢", "Group by ones", "Compare sirf paas wale groups me."], ["➖", "Dash", "Eliminated variable."], ["⭐", "Prime implicant", "Jo aur nahi jud sakta."], ["📊", "PI chart", "Essential primes ko pehchano."]], "line": "Q-M: bits me ek farak wale terms jodte jao, prime implicants ka chart banao."}, "u2-t4": {"story": "**Half adder** wo banda hai jo sirf do cheezein jod sakta hai: A aur B. Par jaise hi 'carry' (pichli class ka bacha hua backlog) aata hai, wo bol deta hai 'mere se nahi hoga bhai'. **Full adder** wo senior hai jo teen cheezein sambhal leta hai: A, B aur pichhla carry. **Ripple carry adder** me har adder pichhle ka wait karta hai, bilkul sarkari office jahan har table 'pehle us table se sign karwa ke aao' bolta hai: bit jitna zyada, line utni lambi. **BCD adder** me answer 9 se upar gaya to 6 jodna padta hai, kyunki 10 se 15 BCD me valid hi nahi, jaise 'F' grade valid hi nahi college ke notice board par (sabko 'detained' likha hota hai).", "items": [["➕", "Half adder", "2 bits: XOR aur AND."], ["➕", "Full adder", "3 bits: 2 half adders + OR."], ["⛓️", "Ripple", "Carry ek se doosre tak ghoomta hai: slow."], ["🔟", "BCD", "Sum > 9 to +6."]], "line": "Adder: S = XOR, C = majority; subtractor = adder + XOR on B."}, "u2-t5": {"story": "**Ripple adder** office ka wo kaam hai jisme 4 log hain aur har ek ko pichle ke sign ka wait karna padta hai. **CLA** ek manager hai jo bolta hai 'main pehle hi dekh leta hu kiska sign kahan se aayega' aur sab ek saath kaam shuru kar dete hain. **Generate** matlab 'main khud carry bana dunga' (self-made), **propagate** matlab 'main sirf aage pass karunga' (jaise group me forwarded message). **Serial adder** wo banda hai jo 4 log ka kaam akela, ek ek karke, 4 din me karta hai: sasta hai par slow. **ALU** computer ka wo dimaag hai jo ek hi jagah jodta bhi hai aur AND-OR bhi karta hai: jaise ek hi banda jo clerk, accountant aur chai wala sab hai.", "items": [["🔮", "Generate", "Khud carry banata hai."], ["➡️", "Propagate", "Aaye hue carry ko aage badhata hai."], ["🐢", "Serial", "1 FA, n clock."], ["🧠", "ALU", "Arithmetic + logic ek block me."]], "line": "CLA = parallel carry, serial = tiny hardware, ALU = MUX se function chunna."}, "u2-t6": {"story": "**MUX** wo mummy hai jo ghar me 5 bachhon ki shikayatein sunti hai par **ek time par ek hi ko** jawab deti hai (select line uski mood). Chaar inputs aaye, ek output gaya. **DEMUX** ulta: ek hi banda (Sharma ji ka beta) sabko ek saath nahi, **ek-ek ko** examples deta hai: aaj Y2 ka din hai. Aur MUX ka secret: usse koi bhi function bana sakte ho, bas data inputs me 0, 1, C ya C' laga do. Matlab ek hi chai wale se tum tea, coffee aur kadha sab bana sakte ho, bas select dabao.", "items": [["🎚️", "Select lines", "Kaun sa input aage jayega."], ["🛤️", "DEMUX", "Ek input, kai raaste."], ["🧮", "Function generator", "Data inputs me 0, 1, C, C' lagao."], ["🔲", "74151", "8:1 MUX chip."]], "line": "MUX = many to one, DEMUX = one to many; select lines raasta chunti hain."}, "u2-t7": {"story": "**Decoder** wo receptionist hai jo 'room number 5' sunte hi sirf 5 number ki batti jalata hai, baaki sab off. Isliye ye ek minterm hota hai: ek combination = ek output. **Encoder** ulta karta hai: 'kisne button dabaya?' pooch ke uska number likhta hai. Par agar do bachhe ek saath button daba de (jaise lift me hamesha hota hai), to **normal encoder confuse** ho jata hai, isliye **priority encoder** hota hai jo bolta hai 'jo bada hai wahi suna jayega' (jaise ghar me papa ki aawaz ke aage kisi ki nahi chalti). **7-segment** wo calculator wali screen hai jisme 8 banane ke liye saare 7 danda jalte hain, aur 1 ke liye sirf do.", "items": [["🔓", "Decoder", "Binary code se ek line active."], ["🔒", "Encoder", "Active line se binary code."], ["🥇", "Priority", "Zyada priority wala jeetega."], ["7️⃣", "7-segment", "a se g tak 7 LED."]], "line": "Decoder: code to line; encoder: line to code; 7447 BCD ko segments me badalta hai."}, "u2-t8": {"story": "**Comparator** ek judge hai jo teen hi faisle deta hai: 'tum bade ho', 'barabar ho' ya 'chhote ho', bilkul jaise tumhara CGPA topper ke saamne. Hamesha **MSB se compare** karo: pehle hazaar wala digit dekho, wahan farak mila to baaki bits ka farak matter hi nahi karta (jaise salary: 1 lakh vs 99,999: baaki digits kisi kaam ke nahi). **Parity** wo friend hai jo exam hall me count karta hai: 'bhai kitne 1 hain? Odd hai, kuch gadbad hai.' **Code converter** ek translator hai: BCD ko Excess-3 me bolne ke liye 3 jod do aur kaam khatam.", "items": [["⚖️", "Comparator", "Greater, equal, less."], ["🔝", "MSB first", "Bade bit se compare shuru."], ["🧿", "Parity", "XOR chain se count odd ya even."], ["🔄", "Converter", "Code A ko code B me badalna."]], "line": "Comparator MSB se compare karta hai; parity XOR se; converters truth table se."}, "u3-t1": {"story": "**Latch** wo dost hai jise tum ek baar 'haan' bol do to wo hamesha 'haan' pe atka rehta hai jab tak koi 'nahi' na bole. Do inverters ek doosre ko feedback dete hain, jaise do log ek doosre ki baat ka jawab dete rehte hain aur baat kabhi khatam nahi hoti. **SR latch** me S dabao to ON, R dabao to OFF, kuch mat dabao to **jo pehle tha wahi** (yaadasht!). Par **S aur R dono ek saath** dabaye to kya hoga? Wahi jo ek shaadi me dono saas aur bahu ek saath bol dein: koi nahi jaanta kaun jeeta (isliye forbidden state).", "items": [["♻️", "Bistable", "Do stable states = 1 bit."], ["🔓", "S aur R", "Set aur reset."], ["⛔", "S=R=1", "Forbidden state."], ["🚪", "Clocked", "Clock aane par hi badlo."]], "line": "Latch = feedback wali 1-bit memory; S set, R reset, 11 allowed nahi."}, "u3-t2": {"story": "**Flip-flop** ek camera hai: flash (clock) chamka tabhi photo (state) kheenchta hai, baaki time kuch bhi hoga to ignore. **D flip-flop** wo dost hai jo tumhari baat ek second ke liye sunta hai (clock edge par) aur wahi dohra deta hai, bilkul jaise tumhara dost jo gossip sirf wahi yaad rakhta hai jo party me ek moment par sunaayi gayi. **JK** me ek special trick hai: dono 1 do to wo **ulta** ho jata hai (toggle), jaise relationship status: 'It's complicated' ke baad seedha ulta. **T flip-flop** toggle ke liye hi bana hai, aur har clock par ulta hota hai, isliye frequency aadhi: tumhari motivation ki tarah.", "items": [["📸", "Edge trigger", "Clock edge par hi sample."], ["📥", "D FF", "Q+ = D."], ["🔁", "JK FF", "11 = toggle."], ["🔄", "T FF", "Toggle: frequency divide by 2."]], "line": "Flip-flop edge par badalta hai; JK toggle karta hai; T divide-by-2 karta hai."}, "u3-t3": {"story": "**Shift register** ek line hai jisme har clock par sab ek kadam aage khiskte hain, jaise college canteen ki queue jisme tum peeche se aate ho aur aage wala bahar nikal jata hai. **Serial to parallel**: pehle ek-ek bit line me aata hai, phir sab ek saath bahar. **Ring counter** wo dost hai jo group me hamesha 'baari-baari' ka rule lagata hai: ek hi 1 chakkar kaat raha hai, aur jiske paas 1 hai wahi 'bolega'. **Johnson counter** me ulta feedback hai, jaise relationship me fight ke baad ulta manana: bits dheere dheere bhar kar phir khali hote hain.", "items": [["🚂", "Queue", "Bit ek kadam aage."], ["🔌", "S to P", "Ek ek karke aao, ek saath jao."], ["💍", "Ring", "Ek 1 ghoomta hai."], ["🌀", "Johnson", "MOD 2n."]], "line": "Shift register bits ko ek kadam khiskata hai; ring MOD n, Johnson MOD 2n."}, "u3-t4": {"story": "**Ripple counter** domino jaisa hai: pehla gira, dusra gira, teesra gira. Har ek ko pichhle ke girne ka wait karna padta hai, bilkul jaise group project me sab last wale ka intezar karte hain. Isiliye **slow**. Har stage frequency ko aadha karta hai, jaise tumhari attendance har semester aadhi hoti jaati hai. **MOD-6** banane ke liye jab 6 pe pahunche to **CLEAR** daba do: jaise hostel me 11 baje warden ne light kaat di.", "items": [["🐢", "Slow", "Delay jodte jaate hain."], ["➗", "Divide by 2", "Har stage frequency aadhi."], ["✂️", "MOD-N", "NAND se clear."], ["⬇️", "Down", "Q' use karo."]], "line": "Ripple: Q agle ka clock; MOD-N clear se; delay ki wajah se slow."}, "u3-t5": {"story": "**Synchronous counter** me sab flip-flops ko ek hi clock milta hai, jaise class me sab ek saath 'present sir' bolte hain, koi proxy ka wait nahi. Isliye **fast** hai. Par iske liye extra AND gates lagte hain, jaise bhai ne asli sir se proxy ke liye extra recharge karwaya. **Design** me hum pehle table banate hain, phir excitation table se inputs nikalte hain, phir K-map. Unused states ko **don't care** bol do: unka kya, wo to aaye hi nahi, bilkul exam me wo chapter jo syllabus me hai par kabhi poocha nahi.", "items": [["🥁", "Common clock", "Sab ek saath."], ["⚙️", "Excitation", "State change se input."], ["🗺️", "K-map", "Equation chhoti."], ["🔒", "Lock-out", "Unused state me atak jana."]], "line": "Synchronous = common clock, fast; design = state table + excitation + K-map."}, "u3-t6": {"story": "**Counter IC** readymade chapati hai: khud banane ki zarurat nahi. 7490 decade counter 0 se 9 gintaa hai aur wapas 0, jaise Sunday ke baad Monday ka dard. **Cascade** karne par MOD gunaa hota hai. **Asynchronous circuit** me clock nahi hota: koi bole aur turant reaction, jaise hostel me jab mess me kisi ne bola 'maggi bani hai' aur 5 second me line lag gayi. Par wahan **race** ho sakti hai, jaise do log ek hi Maggi ke liye.", "items": [["🧩", "ICs", "7490, 7493, 74193."], ["🔟", "Decade", "0 se 9."], ["📡", "Async", "Clock nahi."], ["🏁", "Race", "Do variable ek saath badle."]], "line": "Counter ICs ready hain; async me clock nahi aur race ka khatra hai."}, "u4-t1": {"story": "**DAC** ek sound mixer hai: har bit ek knob, MSB ka knob sabse bhaari, LSB ka dhimi aawaaz. **Weighted resistor** me har bit ke liye alag resistor lagta hai: 1 bit ko R, doosre ko 2R, aur 8 bit tak jaate jaate resistor aise ho jaate hain jaise tumhare dost ki list: ek ne 100 diye, ek ne 12800. **R-2R ladder** smart hai: sirf do value ke resistor, isliye sasta aur accurate, jaise ek hi dukaan se sab kuch lena.", "items": [["⚖️", "Weighted", "Bahut resistors."], ["🪜", "R-2R", "Do hi value."], ["📏", "Resolution", "Vref/2^n."], ["⏱️", "Settling", "Time lagta hai."]], "line": "DAC bits ko voltage me badalta hai; R-2R ladder accurate aur easy."}, "u4-t2": {"story": "**ADC** ek aisa photographer hai jo ek moment ki photo khichta hai (sample), phir sabse paas wala rang chunta hai (quantize), aur us rang ko number deta hai (encode). **Sample and hold**: capacitor ek balti hai: switch band to paani bhar gaya, switch khula to paani wahi ruk gaya jab tak converter naap le. **Flash ADC** wo hai jisme har level ke liye ek bouncer (comparator) hai: sab ek saath check karte hain, isliye **bahut fast**, par 8-bit me 255 bouncers: bahut mehnga, jaise shaadi me har mehmaan ke liye alag waiter.", "items": [["📸", "Sample", "Ek moment ka value."], ["🪣", "Hold", "Capacitor me ruka."], ["📶", "Quantize", "Nearest level."], ["⚡", "Flash", "2^n-1 comparators."]], "line": "ADC: sample, quantize, encode; flash sabse fast lekin hardware zyada."}, "u4-t3": {"story": "**SAR ADC** 20 questions ka game hai: 'kya aadhe se bada hai?' haan, 'kya teen-chauthai se bada?' nahi... aur 4 sawaal me number pakad liya. **Counting ADC** seedhi ek-ek seedhi chadhna: bahut slow, jaise subah 6 baje ek-ek alarm snooze karna. **Dual slope**: pehle tumhari salary jitna paani balti me daalo fixed time, phir dekho khaali hone me kitna time lagta hai: jitna zyada time, utni zyada salary (wo bhi mahine ke end me kitna time lagta hai khatam hone me). Slow hai par bahut accurate.", "items": [["🎯", "SAR", "n clocks, MSB first."], ["🪜", "Counting", "Slow, 2^n."], ["⏳", "Dual slope", "Accurate, slow."], ["⚡", "Flash", "Sabse fast."]], "line": "SAR fast aur common; counting slow; dual slope accurate."}, "u5-t1": {"story": "**Memory** ek bada apartment hai: **address** flat number hai, **data** andar rehne wala banda. **Expansion**: ek building kam pad gayi to doosri bana lo (chip jodo), aur decoder gate ka watchman hai jo batata hai ki kaunsi building me jana hai. **Word size** badhana matlab flats me aur kamre jodna. Aur 1 K = 1024, hostel ka wifi jaisa 'unlimited' nahi, exact value hai.", "items": [["🏢", "Address", "Flat number."], ["🧱", "Expansion", "Chips jodo."], ["🚪", "Decoder", "Chip select."], ["📖", "R/W", "Padho ya likho."]], "line": "Memory = 2^n words x m bits; chips ko decoder ke saath jodkar bada banate hain."}, "u5-t2": {"story": "**ROM** chhapi hui kitaab hai: padh sakte ho, mita nahi sakte. **RAM** whiteboard hai: likho, mitao, par light gayi to sab saaf, jaise exam ke baad tumhe sab bhool jata hai. **DRAM** ko har kuch millisecond me **refresh** karna padta hai, bilkul jaise tumhare dost ko 'bhai kaisa hai' wala message har kuch din me bhejna padta hai warna dosti mar jati hai. **SRAM** latch hai: fast aur yaad rakhta hai par mehnga, jaise premium subscription. **CAM**: 'kiske paas ye number hai?' bolo to sab ek saath jawab dete hain.", "items": [["📕", "ROM", "Padhne ke liye."], ["📝", "RAM", "Likho aur mitao."], ["🔄", "DRAM", "Refresh chahiye."], ["🔍", "CAM", "Content se dhundo."]], "line": "ROM non-volatile, RAM volatile; DRAM refresh; CAM content se search."}, "u5-t3": {"story": "**ROM as PLD**: koi circuit banane ki zarurat nahi, bas truth table ki kitaab likh do. Jaise exam me answer rataa maarna: sawal (input) aaya, kitaab me dekho, jawab (output) likh do. Par har naye input bit par kitaab **double** moti ho jaati hai, jaise tumhara syllabus aakhri raat ko.", "items": [["📕", "ROM", "Fixed AND, programmable OR."], ["📖", "Lookup", "Truth table likh do."], ["📈", "2^n", "Size double hota hai."], ["🧩", "PLA/PAL", "Chhoti alternatives."]], "line": "ROM = decoder + OR array jisse koi bhi truth table program ho jaati hai."}, "u6-t1": {"story": "**PLA** ek khaali breadboard hai jisme AND aur OR dono tum decide karte ho: full freedom, jaise gf-bf ka relationship: dono decide karte hain. **PAL** me OR fixed hai: sirf ek side decide kar sakti hai, jaise arranged marriage me ek side ka rishta pehle se tay hota hai. PAL sasta aur fast hai, PLA lachila par mehnga.", "items": [["🔲", "PLA", "Dono arrays programmable."], ["🔳", "PAL", "OR fixed."], ["♻️", "Sharing", "PLA me product share."], ["🔥", "Program", "Fuse ya EEPROM."]], "line": "PLA me AND+OR programmable, PAL me sirf AND; PAL sasta aur fast."}, "u6-t2": {"story": "**CPLD** chhoti si company hai: kuch bade departments (PAL blocks) aur beech me ek corridor (switch matrix). **FPGA** poora shehar hai: hazaron dukaane (CLB), aur sadkein tum jaise chaaho banao. Light jaaye to SRAM wali FPGA sab bhool jaati hai, jaise exam hall se nikalte hi tumhe formulae bhool jaate hain, isliye har baar bitstream se dobara padhaana padta hai. **LUT** ek cheat sheet hai: har input ka jawab pehle se likha hua.", "items": [["🏢", "CPLD", "Kuch blocks + corridor."], ["🏙️", "FPGA", "CLB ka shehar."], ["📒", "LUT", "Cheat sheet."], ["⚡", "SRAM", "Power off = config gone."]], "line": "CPLD chhota non-volatile; FPGA bada SRAM based; CLB = LUT + FF."}};
const NOTES_KEY = 'deCourse_notes_105301';
function inl(t){ // safe inline markup: `code` and **bold**
  return escapeHtml(String(t==null?'':t)).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
}
function plain(t){ return String(t==null?'':t).replace(/`([^`]+)`/g,'$1').replace(/\*\*([^*]+)\*\*/g,'$1'); }
function mk(tag, cls, html){ const e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e; }
function lessonViz(v){
  const box=mk('div','lviz');
  if(v.type==='chain'){
    const row=mk('div','lviz-chain');
    v.items.forEach((it,i)=>{
      if(i) row.appendChild(mk('span','lviz-arrow',(v.labels&&v.labels[i-1]?'<small>'+inl(v.labels[i-1])+'</small>':'')+'→')).style.setProperty('--i',i*2-1);
      const n=mk('span','lviz-node',inl(it)); n.style.setProperty('--i',i*2); row.appendChild(n);
    });
    box.appendChild(row);
  } else if(v.type==='tree'){
    box.appendChild(Object.assign(mk('div','lviz-node root',inl(v.root)),{})).style.setProperty('--i',0);
    box.appendChild(mk('div','lviz-stem')).style.setProperty('--i',1);
    const kids=mk('div','lviz-kids');
    v.kids.forEach((k,i)=>{ const n=mk('span','lviz-node',inl(k)); n.style.setProperty('--i',i+2); kids.appendChild(n); });
    box.appendChild(kids);
  } else if(v.type==='merge'){
    const ps=mk('div','lviz-kids'); v.parents.forEach((k,i)=>{ const n=mk('span','lviz-node root',inl(k)); n.style.setProperty('--i',i); ps.appendChild(n); }); box.appendChild(ps);
    box.appendChild(mk('div','lviz-stem')).style.setProperty('--i',v.parents.length);
    const c=mk('div','lviz-node'+(v.bad?' bad':''),inl(v.child)+(v.bad?' ✖':'')); c.style.setProperty('--i',v.parents.length+1); box.appendChild(c);
  } else if(v.type==='merge'){
    const ps=mk('div','lviz-kids'); v.parents.forEach((k,i)=>{ const n=mk('span','lviz-node root',inl(k)); n.style.setProperty('--i',i); ps.appendChild(n); }); box.appendChild(ps);
    box.appendChild(mk('div','lviz-stem')).style.setProperty('--i',v.parents.length);
    const c=mk('div','lviz-node'+(v.bad?' bad':''),inl(v.child)+(v.bad?' ✖':'')); c.style.setProperty('--i',v.parents.length+1); box.appendChild(c);
  } else if(v.type==='cells'){
    const row=mk('div','lviz-cells'); const hl=v.hl||[];
    v.items.forEach((it,i)=>{ const w=mk('div','lviz-cw'); const n=mk('span','lviz-node lviz-cell'+(hl.indexOf(i)>=0?' root':''),inl(it)); n.style.setProperty('--i',i); w.appendChild(n); w.appendChild(mk('div','lviz-lab',v.labels&&v.labels[i]!=null?inl(v.labels[i]):'')); row.appendChild(w); });
    box.appendChild(row);
  } else if(v.type==='layers'){
    v.items.forEach((it,i)=>{ const n=mk('div','lviz-node lviz-layer'+(i===v.items.length-1?' root':''),inl(it)); n.style.setProperty('--i',i); n.style.width=(100-Math.min(i,4)*6)+'%'; box.appendChild(n); });
  } else if(v.type==='mem'){
    const NS='http://www.w3.org/2000/svg', tot=v.segs.reduce((a,s)=>a+(+s[1]||1),0), H=300, minH=36, bw=Math.max(170,Math.max(...v.segs.map(s=>String(s[0]).length))*7.4+28), W=bw+90;

function lessonTable(t){
  const w=mk('div','ltbl'); const tb=mk('table','tbl');
  tb.innerHTML='<tr>'+t.head.map(h=>'<th>'+inl(h)+'</th>').join('')+'</tr>'+t.rows.map(r=>'<tr>'+r.map(c=>'<td>'+inl(c)+'</td>').join('')+'</tr>').join('');
