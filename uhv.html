">Pranic<\/text><circle class=\"g\" cx=\"150\" cy=\"170\" r=\"34\"/><text class=\"tl\" x=\"150\" y=\"174\" text-anchor=\"middle\">Pranic<\/text><circle class=\"g\" cx=\"330\" cy=\"170\" r=\"34\"/><text class=\"tl\" x=\"330\" y=\"174\" text-anchor=\"middle\">Animal<\/text><circle class=\"g\" cx=\"470\" cy=\"170\" r=\"34\"/><text class=\"tl\" x=\"470\" y=\"174\" text-anchor=\"middle\">Human<\/text><text class=\"tl\" x=\"280\" y=\"236\" text-anchor=\"middle\">Units (nature) exist in space and are interconnected<\/text>", "caption": "Units (nature) exist in space; existence is co-existence"}}, {"h": "Co-existence at all levels", "p": ["Co-existence is seen at **every level**: **in an atom** (electron and nucleus), **in the body** (organs), **in the human being** (Self and Body), **in the family** (members), **in society** (families), **in nature** (four orders) and **in the whole existence** (units in space)."], "table": {"head": ["Level", "Co-existence of"], "rows": [["Atom", "Electrons, protons, neutrons"], ["Human being", "Self and Body"], ["Family", "Members"], ["Society", "Families"], ["Nature", "Four orders"], ["Existence", "Units in space"]]}}, {"h": "Space and units", "p": ["Each **unit** exists in space, is **bounded by space** and **recognises** (relates to) space and other units. Units are **always in a state of co-existence**; they never exist alone. If they were **isolated**, they would not exist. **To exist is to co-exist.**"]}, {"h": "Why understand it?", "p": ["Understanding that **existence is co-existence** removes **the feeling of separateness** (\"I am alone, I am separate\") and gives a **feeling of relatedness** to all, which is the basis of **love, trust and respect**. This is the **holistic perception**, the last step of value education."], "tip": "Memory line: \"Existence = space + nature. Everything exists in space. Co-existence at all levels.\""}], "analogy": "Imagine the whole sky as a single big cricket ground (space) where players (units) play; no player exists outside the ground and no one plays alone. That is co-existence.", "hinglish": "Existence = space + prakriti. Sab kuch space me hai aur sab ek dusre ke saath (co-existence) hain. Isi samajh se akelepan ka bhram khatam hota hai.", "mistakes": ["Thinking space is just empty emptiness; it is where everything exists.", "Writing co-existence only at the human or family level."], "remember": ["Existence = space + nature", "Space is all-pervasive; units exist in space", "Co-existence at atom, human, family, society, nature and existence levels", "To exist is to co-exist", "Understanding it gives relatedness with all"], "def": "**Existence** is **everything that is**; it consists of **space** (all-pervasive, in which everything is) and **units** (the things of nature) that **exist in space**. **Co-existence** means that all units **exist together** and **are related** to each other."}, "u4-t4": {"tldr": "The holistic perception sees harmony at all levels together: Self, family, society, nature and existence. When I see this, I live in harmony.", "sections": [{"h": "What is holistic perception?", "p": ["Holistic means **whole**. So far we learnt harmony **one level at a time**: in the human being (Unit 2), in the family and society (Unit 3), and in nature/existence (Unit 4). **Holistic perception** puts them together: **I am a part of a family, society, nature and existence**, and my **harmony is linked to all**."], "viz": {"type": "svg", "w": 560, "h": 270, "svg": "<rect class=\"g\" x=\"180\" y=\"10\" width=\"200\" height=\"38\" rx=\"9\"/><text class=\"tb\" x=\"280.0\" y=\"25.5\" text-anchor=\"middle\">Existence<\/text><text class=\"tb\" x=\"280.0\" y=\"40.5\" text-anchor=\"middle\">co-existence<\/text><rect class=\"g\" x=\"180\" y=\"70\" width=\"200\" height=\"38\" rx=\"9\"/><text class=\"tb\" x=\"280.0\" y=\"85.5\" text-anchor=\"middle\">Nature<\/text><text class=\"tb\" x=\"280.0\" y=\"100.5\" text-anchor=\"middle\">four orders in harmony<\/text><rect class=\"g\" x=\"180\" y=\"130\" width=\"200\" height=\"38\" rx=\"9\"/><text class=\"tb\" x=\"280.0\" y=\"145.5\" text-anchor=\"middle\">Society<\/text><text class=\"tb\" x=\"280.0\" y=\"160.5\" text-anchor=\"middle\">undivided, just<\/text><rect class=\"g\" x=\"180\" y=\"190\" width=\"200\" height=\"38\" rx=\"9\"/><text class=\"tb\" x=\"280.0\" y=\"205.5\" text-anchor=\"middle\">Family<\/text><text class=\"tb\" x=\"280.0\" y=\"220.5\" text-anchor=\"middle\">trust, respect<\/text><path class=\"w\" d=\"M280,48 L280,70\" marker-end=\"url(#da)\"/><path class=\"w\" d=\"M280,108 L280,130\" marker-end=\"url(#da)\"/><path class=\"w\" d=\"M280,168 L280,190\" marker-end=\"url(#da)\"/><text class=\"tb\" x=\"470\" y=\"100\" text-anchor=\"middle\">Holistic<\/text><text class=\"tb\" x=\"470\" y=\"115\" text-anchor=\"middle\">perception<\/text><text class=\"tb\" x=\"90\" y=\"100\" text-anchor=\"middle\">Self (I)<\/text><text class=\"tb\" x=\"90\" y=\"115\" text-anchor=\"middle\">at the centre<\/text>", "caption": "Holistic perception: from existence down to the family and the Self"}}, {"h": "Summary of the four levels", "table": {"head": ["Level", "Harmony means", "Key ideas"], "rows": [["Self (I)", "Desire, thought, expectation aligned", "Natural acceptance, sanyam, swasthya"], ["Family", "Trust and respect with all members", "Justice, nine feelings"], ["Society", "Undivided society and universal order", "Five dimensions"], ["Nature", "Mutual fulfilment among four orders", "Recyclability, self-regulation"], ["Existence", "Co-existence in space", "Units in space"]]}}, {"h": "Result of holistic perception", "p": ["(1) **Right understanding** of the relation with all. (2) **Right feeling** (trust, respect, love for all). (3) **Right action**: I use my **skills and technology** for the **good of all**. This becomes the basis for **ethical conduct** and **professional ethics** (next units)."], "viz": {"type": "chain", "items": ["Holistic perception", "Right understanding", "Right feelings", "Right actions and ethical conduct"], "labels": null, "caption": "What holistic perception leads to"}}, {"h": "From Self to existence", "p": ["The journey of UHV is: **understand myself** (Self and Body) → **my relationships** (family) → **society** → **nature** → **existence**. After understanding all, I **live with it** in my work and profession."], "tip": "The final answer of Unit 4: \"Existence is co-existence; harmony at all levels is the natural way of living.\""}], "analogy": "Think of Google Maps: you see your location (self), your street (family), your city (society), your country (nature) and the whole world (existence) in one view. Holistic perception is zooming out, not looking only at your own dot.", "hinglish": "Holistic perception ka matlab hai sab levels ek saath dekhna: self, parivaar, samaj, prakriti aur astitva. Isse sahi samajh, sahi bhaavna aur sahi kaam aate hain.", "mistakes": ["Treating each unit of the syllabus separately.", "Not linking harmony in the Self with harmony in nature and existence."], "remember": ["Holistic = whole, all levels together", "Harmony at self, family, society, nature, existence", "Results in right understanding, right feeling, right action", "Basis for ethical conduct and professional ethics", "Existence is co-existence"], "def": "**Holistic perception of harmony** is the ability to **see the harmony at all levels** (self, family, society, nature and existence) **at once**, and to realise that **everything is related**. It results in **right understanding, right feeling and right action**."}, "u5-t1": {"tldr": "Ethical human conduct is the natural, definite way of living based on natural acceptance, values, policy and character. It is the same for everyone.", "sections": [{"h": "Natural acceptance", "p": ["**Natural acceptance** is the inner feeling of **what is right**: everyone wants **trust, respect, justice and happiness** and nobody wants **cheating, humiliation and injustice**. Because it is **common to all**, **human conduct can be defined**. It is not a matter of opinion."], "viz": {"type": "svg", "w": 560, "h": 180, "svg": "<rect class=\"g\" x=\"10\" y=\"60\" width=\"120\" height=\"56\" rx=\"9\"/><text class=\"tb\" x=\"70.0\" y=\"84.5\" text-anchor=\"middle\">Natural<\/text><text class=\"tb\" x=\"70.0\" y=\"99.5\" text-anchor=\"middle\">acceptance<\/text><rect class=\"g\" x=\"170\" y=\"60\" width=\"120\" height=\"56\" rx=\"9\"/><text class=\"tb\" x=\"230.0\" y=\"84.5\" text-anchor=\"middle\">Right<\/text><text class=\"tb\" x=\"230.0\" y=\"99.5\" text-anchor=\"middle\">understanding<\/text><rect class=\"g\" x=\"330\" y=\"60\" width=\"100\" height=\"56\" rx=\"9\"/><text class=\"tb\" x=\"380.0\" y=\"92.0\" text-anchor=\"middle\">Values<\/text><rect class=\"g\" x=\"470\" y=\"60\" width=\"80\" height=\"56\" rx=\"9\"/><text class=\"tb\" x=\"510.0\" y=\"92.0\" text-anchor=\"middle\">Policy<\/text><path class=\"w hi\" d=\"M130,88 L170,88\" marker-end=\"url(#da)\"/><path class=\"w hi\" d=\"M290,88 L330,88\" marker-end=\"url(#da)\"/><path class=\"w hi\" d=\"M430,88 L470,88\" marker-end=\"url(#da)\"/><rect class=\"g0\" x=\"130\" y=\"140\" width=\"300\" height=\"34\" rx=\"9\"/><text class=\"t\" x=\"280.0\" y=\"161.0\" text-anchor=\"middle\">Character -&gt; ethical human conduct<\/text><path class=\"w\" d=\"M510,116 L510,157 L430,157\" marker-end=\"url(#da)\"/><text class=\"tb\" x=\"280\" y=\"30\" text-anchor=\"middle\">How ethical conduct is built<\/text>", "caption": "Natural acceptance to right understanding, values, policy and character"}}, {"h": "Definitiveness of ethical human conduct", "p": ["Since natural acceptance is the same for all, we can **define human conduct**: it must **ensure mutual happiness and prosperity** of all. This **definiteness** means **right and wrong** are **not decided by culture or convenience**. So ethics is **universal**, not relative."]}, {"h": "Values, policy and character", "table": {"head": ["Term", "Meaning", "Example"], "rows": [["Values", "Feelings and qualities accepted by all (trust, respect, justice...)", "Honesty in dealing with a customer"], ["Policy", "Set of rules framed to implement values in a situation", "Quality standards, safety rules"], ["Character", "Habit of living by those values consistently", "Behaviour even when no one is watching"]]}}, {"h": "Ethical vs unethical", "p": ["**Ethical**: ensures **mutual fulfilment** (win for all). **Unethical**: **benefits one at the cost of others** (e.g., selling adulterated food). Unethical conduct is accepted by **no one** when it happens to **them**, so it is **against natural acceptance**."], "warn": "Do not define ethics as \"following the rules\". Rules without understanding can be broken or become unfair. Ethics = living by natural acceptance."}, {"h": "Human conduct: 3 levels", "p": ["**Acceptance** (natural acceptance, same for all), **Understanding** (right understanding of harmony) and **Living** (values, policy and character in action). Ethical conduct is **living** what is **accepted and understood**."], "tip": "Link for the exam: \"Natural acceptance -> right understanding -> values -> policy -> character -> ethical human conduct\"."}], "analogy": "A traffic signal is red at 2 a.m. and no one is around. If you stop, you are ethical (values and character). If you only stop when the police are watching, it is a rule, not ethics.", "hinglish": "Naitik manav aacharan natural acceptance par tika hai, jo sab me same hota hai. Isliye aacharan definite hai: mulya (values), niti (policy) aur charitra (character).", "mistakes": ["Defining ethics as only obedience to rules and law.", "Thinking right and wrong depend on culture or convenience."], "remember": ["Ethical conduct = based on natural acceptance, values, policy, character", "Natural acceptance is common to all, hence conduct is definite", "Values -> policy -> character", "Ethical = mutual fulfilment; unethical = benefit at others' cost", "Character = living values even when unobserved"], "def": "**Ethical human conduct** is the **definite conduct** (behaviour) of a human being that is **based on natural acceptance, right understanding and values**. It is **definite** because natural acceptance is **the same for all**, so values, policy and character are **universal**."}, "u5-t2": {"tldr": "Holistic understanding changes education, the constitution and the whole order of society: from facility-oriented to right-understanding-oriented.", "sections": [{"h": "Humanistic education", "p": ["Present education focuses on **physical facility** (job, degree). **Humanistic education** adds **understanding of Self, family, society and nature**. It gives **both skills and values**, so that a graduate is a **good professional and a good human being**."], "viz": {"type": "svg", "w": 560, "h": 230, "svg": "<rect class=\"g\" x=\"10\" y=\"20\" width=\"240\" height=\"50\" rx=\"9\"/><text class=\"tb\" x=\"130.0\" y=\"41.5\" text-anchor=\"middle\">Humanistic education<\/text><text class=\"tb\" x=\"130.0\" y=\"56.5\" text-anchor=\"middle\">(right understanding + sanskar)<\/text><rect class=\"g\" x=\"310\" y=\"20\" width=\"240\" height=\"50\" rx=\"9\"/><text class=\"tb\" x=\"430.0\" y=\"41.5\" text-anchor=\"middle\">Humanistic constitution<\/text><text class=\"tb\" x=\"430.0\" y=\"56.5\" text-anchor=\"middle\">(rights, order, justice)<\/text><rect class=\"g\" x=\"150\" y=\"140\" width=\"260\" height=\"50\" rx=\"9\"/><text class=\"tb\" x=\"280.0\" y=\"161.5\" text-anchor=\"middle\">Universal Human Order<\/text><text class=\"tb\" x=\"280.0\" y=\"176.5\" text-anchor=\"middle\">(undivided society)<\/text><path class=\"w\" d=\"M130,70 L130,105 L280,105 L280,140\" marker-end=\"url(#da)\"/><path class=\"w\" d=\"M430,70 L430,105 L280,105\" marker-end=\"url(#da)\"/>", "caption": "Humanistic education and constitution lead to a universal human order"}}, {"h": "Basis of humanistic education", "p": ["Its **basis** is **natural acceptance** and **right understanding**. The **content** should be **universal**: understanding **human values**, **harmony in the family and society** and **mutual fulfilment with nature**. The **process** is **self-exploration**, not memorising."], "table": {"head": ["Present education", "Humanistic education"], "rows": [["Only skills", "Skills + values"], ["For a job", "For a happy and just life"], ["Competition", "Cooperation"], ["Ignores nature", "Harmony with nature"]]}}, {"h": "Humanistic constitution", "p": ["A **constitution** is the **basic framework** of society. A **humanistic constitution** has the goal of **right living, health, justice, production and exchange** (five dimensions) for **all human beings**, based on **values**. Such a constitution aims at **mutual fulfilment** rather than **domination**."]}, {"h": "Universal human order", "p": ["When humanistic education and a humanistic constitution **work together** we get the **universal human order**: a **society** with **trust, justice and prosperity**, where every individual lives **with harmony at all four levels**. The **change starts with the individual**, and then spreads through the family and society."], "tip": "A good conclusion line for a long answer: \"Humanistic education makes the individual, and the humanistic constitution makes the society.\""}], "analogy": "A cooking class that only teaches recipes (skills) but not hygiene or ethics produces cooks who may poison customers. Add values and the same recipes feed people.", "hinglish": "Manavvadi shiksha me skill ke saath samajh aur mulya bhi aate hain. Manavvadi samvidhan nyay aur sab ki khushi ka dhancha banata hai. Dono milkar sarvabhaum vyavastha banate hain.", "mistakes": ["Thinking only a new law (constitution) can change society without education.", "Writing the universal human order as the same as a single world government."], "remember": ["Humanistic education = skills + right understanding + values", "Basis: natural acceptance and self-exploration", "Humanistic constitution = framework for justice and mutual happiness", "Both lead to the universal human order", "Change starts with the individual"], "def": "**Humanistic education** develops **right understanding and right feeling** along with skills. A **humanistic constitution** is a **set of rules and goals** that ensures **justice, mutual happiness and prosperity** for all human beings. Together they lead to the **universal human order**."}, "u5-t3": {"tldr": "A professional must use skills for the universal human order, understand people-friendly and eco-friendly production systems and build suitable technologies and management patterns.", "sections": [{"h": "Three competences", "p": ["**1. Use of professional competence for universal human order**: my skill (coding, designing, construction) should **help all**, not harm anyone. **2. Identify people-friendly and eco-friendly production systems**: production that **meets needs**, is **safe for people** and **protects nature**. **3. Develop appropriate technologies and management patterns**: choose **technology and management** that fit **local needs** and **resources**."], "viz": {"type": "svg", "w": 560, "h": 240, "svg": "<rect class=\"g\" x=\"120\" y=\"10\" width=\"320\" height=\"48\" rx=\"9\"/><text class=\"tb\" x=\"280.0\" y=\"38.0\" text-anchor=\"middle\">Competence in professional ethics<\/text><rect class=\"g0\" x=\"10\" y=\"110\" width=\"174\" height=\"70\" rx=\"9\"/><text class=\"tl\" x=\"97.0\" y=\"134.0\" text-anchor=\"middle\">Utilise professional<\/text><text class=\"tl\" x=\"97.0\" y=\"149.0\" text-anchor=\"middle\">competence for universal<\/text><text class=\"tl\" x=\"97.0\" y=\"164.0\" text-anchor=\"middle\">human order<\/text><path class=\"w\" d=\"M280,58 L280,85 L97,85 L97,110\" marker-end=\"url(#da)\"/><rect class=\"g0\" x=\"196\" y=\"110\" width=\"174\" height=\"70\" rx=\"9\"/><text class=\"tl\" x=\"283.0\" y=\"134.0\" text-anchor=\"middle\">Identify people-friendly<\/text><text class=\"tl\" x=\"283.0\" y=\"149.0\" text-anchor=\"middle\">and eco-friendly<\/text><text class=\"tl\" x=\"283.0\" y=\"164.0\" text-anchor=\"middle\">production systems<\/text><path class=\"w\" d=\"M280,58 L280,85 L283,85 L283,110\" marker-end=\"url(#da)\"/><rect class=\"g0\" x=\"382\" y=\"110\" width=\"174\" height=\"70\" rx=\"9\"/><text class=\"tl\" x=\"469.0\" y=\"134.0\" text-anchor=\"middle\">Develop appropriate<\/text><text class=\"tl\" x=\"469.0\" y=\"149.0\" text-anchor=\"middle\">technologies and<\/text><text class=\"tl\" x=\"469.0\" y=\"164.0\" text-anchor=\"middle\">management patterns<\/text><path class=\"w\" d=\"M280,58 L280,85 L469,85 L469,110\" marker-end=\"url(#da)\"/><text class=\"tl\" x=\"280\" y=\"215\" text-anchor=\"middle\">Three abilities expected from a value-based professional<\/text>", "caption": "Three competences in professional ethics"}}, {"h": "Professional ethics", "p": ["**Ethics in profession** means: **honesty**, **no harm to others**, **respect for law and values**, **quality work**, **safety** and **concern for nature**. A professional with **competence + values** is a **trusted** professional. Skills without ethics lead to **scams, accidents and pollution**."], "table": {"head": ["Without ethics", "With ethics"], "rows": [["Cheap, unsafe products", "Safe and quality products"], ["Profit over people", "Fair profit and welfare"], ["Pollution and waste", "Eco-friendly"], ["Distrust in society", "Trust and prosperity"]]}}, {"h": "Features of people-friendly, eco-friendly production", "p": ["(1) **Need based** (not for creating artificial demand). (2) **Local resources** used wisely. (3) **Safe for workers and consumers**. (4) **Minimum waste**, **recycling**. (5) **Renewable energy** where possible. (6) **Fair work and wages**."]}, {"h": "Examples", "p": ["**Bad**: unsafe buildings made with cheap cement, **software with hidden data theft**, **pollution from factories**. **Good**: **solar-powered tools**, **recycled materials**, **apps for rural farmers**, **drinking-water filters** for villages."], "tip": "In the exam, link all three competences with one example from your own branch (e.g., software, civil, mechanical, electrical)."}], "analogy": "A civil engineer builds a bridge. If he uses the correct cement (competence), tells the truth about the design (honesty) and makes it safe for all (universal human order), the bridge stands for 100 years. If he takes a commission and cuts cement, the bridge falls in 2 years and the engineer becomes news.", "hinglish": "Professional ethics me teen kabiliyatein: apni skill se sab ka bhala, people-friendly aur eco-friendly production ki pehchaan, aur sahi technology aur management banana.", "mistakes": ["Thinking professional ethics is only \"do not take bribes\".", "Ignoring the environmental part (eco-friendly)."], "remember": ["Competence in professional ethics = 3 abilities", "Use skills for universal human order", "Identify people-friendly and eco-friendly production systems", "Develop appropriate technology and management patterns", "Ethics + skill = trust"], "def": "**Competence in professional ethics** means the **ability** to use my **professional skills** in a way that **supports the universal human order**. It includes three abilities: (a) **utilising professional competence for augmenting the universal human order**, (b) **identifying the scope and characteristics of people-friendly and eco-friendly production systems**, (c) **identifying and developing appropriate technologies and management patterns** for such systems."}, "u6-t1": {"tldr": "Holistic technology, production systems and management models are those that fit human needs, respect nature and ensure justice for all.", "sections": [{"h": "Holistic technologies", "p": ["A **holistic technology** looks at **the whole system** (people, society, nature) and not only at **profit or speed**. It should be **appropriate** (suitable to local conditions), **safe**, **durable**, **repairable** and **energy-efficient**."], "viz": {"type": "svg", "w": 560, "h": 230, "svg": "<rect class=\"g\" x=\"10\" y=\"20\" width=\"160\" height=\"50\" rx=\"9\"/><text class=\"tb\" x=\"90.0\" y=\"49.0\" text-anchor=\"middle\">Holistic technology<\/text><rect class=\"g\" x=\"200\" y=\"20\" width=\"160\" height=\"50\" rx=\"9\"/><text class=\"tb\" x=\"280.0\" y=\"49.0\" text-anchor=\"middle\">Production system<\/text><rect class=\"g\" x=\"390\" y=\"20\" width=\"160\" height=\"50\" rx=\"9\"/><text class=\"tb\" x=\"470.0\" y=\"49.0\" text-anchor=\"middle\">Management model<\/text><path class=\"w\" d=\"M90,70 L90,110\" marker-end=\"url(#da)\"/><path class=\"w\" d=\"M280,70 L280,110\" marker-end=\"url(#da)\"/><path class=\"w\" d=\"M470,70 L470,110\" marker-end=\"url(#da)\"/><rect class=\"g0\" x=\"10\" y=\"110\" width=\"160\" height=\"80\" rx=\"9\"/><text class=\"tl\" x=\"90.0\" y=\"139.0\" text-anchor=\"middle\">Eco-friendly,<\/text><text class=\"tl\" x=\"90.0\" y=\"154.0\" text-anchor=\"middle\">people-friendly,<\/text><text class=\"tl\" x=\"90.0\" y=\"169.0\" text-anchor=\"middle\">appropriate<\/text><rect class=\"g0\" x=\"200\" y=\"110\" width=\"160\" height=\"80\" rx=\"9\"/><text class=\"tl\" x=\"280.0\" y=\"139.0\" text-anchor=\"middle\">Need based,<\/text><text class=\"tl\" x=\"280.0\" y=\"154.0\" text-anchor=\"middle\">local resources,<\/text><text class=\"tl\" x=\"280.0\" y=\"169.0\" text-anchor=\"middle\">minimum waste<\/text><rect class=\"g0\" x=\"390\" y=\"110\" width=\"160\" height=\"80\" rx=\"9\"/><text class=\"tl\" x=\"470.0\" y=\"139.0\" text-anchor=\"middle\">Participation,<\/text><text class=\"tl\" x=\"470.0\" y=\"154.0\" text-anchor=\"middle\">justice, trust,<\/text><text class=\"tl\" x=\"470.0\" y=\"169.0\" text-anchor=\"middle\">mutual fulfilment<\/text>", "caption": "Holistic technology, production system and management model"}}, {"h": "Production systems", "p": ["A **value-based production system** is: **need-based** (produces what people really need), uses **local and renewable resources**, **minimises waste**, **creates employment** and **protects the environment**. Products are **durable and safe**."], "table": {"head": ["Feature", "Conventional", "Holistic"], "rows": [["Aim", "Maximum profit", "Fulfil needs, mutual prosperity"], ["Resource use", "Over-exploitation", "Need-based, renewable"], ["Waste", "High", "Minimum, recycled"], ["Workers", "Cost", "Partners"]]}}, {"h": "Management models", "p": ["A **management model** is the **way of organising** people. **Holistic management** treats **workers as human beings** (not machines), takes **decisions with participation**, ensures **justice and trust** and aims at **mutual fulfilment** (win for all), not at **domination**."], "pts": ["Workers participate in decisions.", "Rewards are fair.", "Concern for environment and community."]}, {"h": "Linking all three", "p": ["A good **technology** needs a good **production system** which needs a good **management model**; all three should be **aligned with the universal human order**."], "tip": "Memory line: \"Holistic = people-friendly + eco-friendly + need-based + just.\""}], "analogy": "A mess run by a cook with fixed weekly menus, local vegetables and workers who share in the profits. Food is fresh, waste is low and the cook is happy. That is a holistic production and management model on a small scale.", "hinglish": "Holistic technology, production aur management wahi jo logon aur prakriti dono ke liye achha ho, zaroorat ke hisaab se ho aur nyay par aadharit ho.", "mistakes": ["Thinking holistic means \"old and primitive technology\". It means appropriate and responsible technology.", "Treating workers only as resources, not partners."], "remember": ["Holistic technology = people-friendly, eco-friendly, appropriate", "Production system = need based, local resources, minimum waste", "Management model = participation, justice, mutual fulfilment", "All three align with universal human order", "Not against technology, but against misuse"], "def": "**Holistic technologies** are technologies that are **people-friendly and eco-friendly**, which meet **real human needs** without harming nature. **Production systems** make goods for **human needs**, using **local resources**. **Management models** organise people and resources **with justice, trust and cooperation**."}, "u6-t2": {"tldr": "Real examples such as Hiware Bazar, Ralegan Siddhi, Amul, Grameen Bank and Barefoot College show how value-based, community-oriented systems work.", "sections": [{"h": "Why case studies?", "p": ["Theory becomes believable when we **see it working**. These cases show **ordinary people** creating **development without destroying nature or relationships**. In the exam, you can quote **any two or three** with the lesson from each."]}, {"h": "Typical cases", "table": {"head": ["Case", "What was done", "Lesson"], "rows": [["Hiware Bazar (Maharashtra)", "Villagers led by the sarpanch Popatrao Pawar did watershed development, tree plantation, banned open grazing and liquor", "Water conservation + community decisions = prosperity"], ["Ralegan Siddhi (Maharashtra)", "Anna Hazare led the village in watershed development, tree plantation and alcohol control", "Individual leadership + participation"], ["Amul (Gujarat)", "Farmers formed a cooperative dairy under Verghese Kurien; farmers own the business", "Cooperation, fair price, local ownership"], ["Grameen Bank (Bangladesh)", "Muhammad Yunus gave small loans to poor women without collateral", "Trust-based finance, empowerment"], ["Barefoot College (Rajasthan)", "Trains rural men and women (even illiterate grandmothers) as solar engineers, teachers and doctors", "Appropriate technology, local skills"]]}}, {"h": "Common features", "p": ["(1) **Community participation**. (2) **Local resources** and **local needs**. (3) **Justice and trust**. (4) **Care for nature** (water, trees, soil). (5) **Leadership with values**. (6) **Mutual benefit**, not exploitation."], "viz": {"type": "chain", "items": ["Right understanding and leader with values", "Community participation and trust", "Local resources and appropriate technology", "Prosperity + care for nature"], "labels": null, "caption": "What the successful models have in common"}}, {"h": "What can we learn?", "p": ["The **same human values** work in a village, a cooperative or a company. Development is **not only GDP**, it is **mutual happiness and prosperity**. So an engineer must ask: \"**For whom, with whom and at what cost to nature?**\""], "warn": "Quote only facts you are sure of. In the exam, write the case name, one main action and one lesson; never invent numbers."}], "analogy": "It is like a college fest: when students (not only the management) plan, share work and respect the environment (no plastic), the fest is better and everyone is happy.", "hinglish": "Hiware Bazar, Ralegan Siddhi, Amul, Grameen Bank aur Barefoot College dikhate hain ki mulya aadharit, sahyog wale model sach me kaam karte hain.", "mistakes": ["Mixing up the places and leaders in the case studies.", "Writing only the story and skipping the lesson."], "remember": ["Case studies show values in practice", "Hiware Bazar and Ralegan Siddhi: watershed, village participation", "Amul: cooperative ownership", "Grameen Bank: trust-based micro-credit", "Barefoot College: appropriate technology and local skills"], "def": "**Case studies** are real examples of communities or organisations that **applied values** (trust, justice, cooperation, concern for nature) to **create prosperity**. They show that the **holistic way is practical**, not just an idea."}, "u6-t3": {"tldr": "To move from the present fragmented way to a value-based way, start with the individual, then the family, then work and systems, step by step.", "sections": [{"h": "Why a strategy?", "p": ["Knowing the right way is not enough. **Habits, pressures and systems** keep us in the old pattern. So we need **steps**: **start small**, **verify through living**, **expand gradually**."], "viz": {"type": "svg", "w": 560, "h": 260, "svg": "<rect class=\"g\" x=\"180\" y=\"10\" width=\"200\" height=\"40\" rx=\"9\"/><text class=\"tb\" x=\"280.0\" y=\"26.5\" text-anchor=\"middle\">Value-based life<\/text><text class=\"tb\" x=\"280.0\" y=\"41.5\" text-anchor=\"middle\">and profession<\/text><rect class=\"g0\" x=\"10\" y=\"100\" width=\"126\" height=\"80\" rx=\"9\"/><text class=\"tl\" x=\"73.0\" y=\"129.0\" text-anchor=\"middle\">Individual<\/text><text class=\"tl\" x=\"73.0\" y=\"144.0\" text-anchor=\"middle\">self-exploration<\/text><text class=\"tl\" x=\"73.0\" y=\"159.0\" text-anchor=\"middle\">and practice<\/text><path class=\"w\" d=\"M280,50 L280,75 L73,75 L73,100\" marker-end=\"url(#da)\"/><rect class=\"g0\" x=\"146\" y=\"100\" width=\"126\" height=\"80\" rx=\"9\"/><text class=\"tl\" x=\"209.0\" y=\"129.0\" text-anchor=\"middle\">Family<\/text><text class=\"tl\" x=\"209.0\" y=\"144.0\" text-anchor=\"middle\">trust, respect,<\/text><text class=\"tl\" x=\"209.0\" y=\"159.0\" text-anchor=\"middle\">justice<\/text><path class=\"w\" d=\"M280,50 L280,75 L209,75 L209,100\" marker-end=\"url(#da)\"/><rect class=\"g0\" x=\"282\" y=\"100\" width=\"126\" height=\"80\" rx=\"9\"/><text class=\"tl\" x=\"345.0\" y=\"129.0\" text-anchor=\"middle\">Society<\/text><text class=\"tl\" x=\"345.0\" y=\"144.0\" text-anchor=\"middle\">honest work,<\/text><text class=\"tl\" x=\"345.0\" y=\"159.0\" text-anchor=\"middle\">participation<\/text><path class=\"w\" d=\"M280,50 L280,75 L345,75 L345,100\" marker-end=\"url(#da)\"/><rect class=\"g0\" x=\"418\" y=\"100\" width=\"126\" height=\"80\" rx=\"9\"/><text class=\"tl\" x=\"481.0\" y=\"129.0\" text-anchor=\"middle\">Systems<\/text><text class=\"tl\" x=\"481.0\" y=\"144.0\" text-anchor=\"middle\">technology, law,<\/text><text class=\"tl\" x=\"481.0\" y=\"159.0\" text-anchor=\"middle\">management<\/text><path class=\"w\" d=\"M280,50 L280,75 L481,75 L481,100\" marker-end=\"url(#da)\"/><text class=\"tl\" x=\"280\" y=\"215\" text-anchor=\"middle\">Transition at four levels, starting from the individual<\/text>", "caption": "Transition at four levels"}}, {"h": "Steps for the individual", "p": ["(1) **Self-exploration**: observe my natural acceptance. (2) **Correct** my beliefs (happiness through facility). (3) **Live** the values in daily life: **be honest**, **respect everyone**, **take care of the body**, **use resources wisely**. (4) **Review regularly**: where did I break the harmony today?"], "table": {"head": ["Step", "Action", "Example"], "rows": [["Understand", "Self-exploration", "Why do I get angry?"], ["Decide", "Choose what is right", "No cheating in exams"], ["Live", "Practise daily", "Help a junior without being asked"], ["Review", "Check and correct", "Weekly reflection"]]}}, {"h": "Steps in the profession", "p": ["(1) **Choose work** that benefits all. (2) **Keep competence high** and **be honest** about limits. (3) **Do not take or give bribes**; follow safety and quality standards. (4) **Work with people** (justice, trust, fair treatment). (5) **Use technology and resources appropriately**. (6) **Support** **eco-friendly** practices."], "pts": ["Be a role model: people learn by watching.", "Start with your own team or project.", "Share the idea through discussion, not force."]}, {"h": "Transition in society and systems", "p": ["Change **education** (add value education), **organisations** (fair management), **law and policy** (support eco-friendly and people-friendly production) and **media**. Change in **systems** supports individuals, and individuals support systems."], "tip": "For the answer: \"Transition = understanding + living + spreading\". Draw the four-level diagram and give two lines for each level."}, {"h": "Practical points for a student", "p": ["**Start now**: be punctual, honest in assignments, respectful to staff and juniors, careful with electricity, water and plastic, and **keep studying UHV with questions**. Small actions repeated every day change the person, then the family, then the society."], "warn": "Transition is gradual. Do not try to change everyone at once, and do not expect perfection; start with yourself."}], "analogy": "Switching from junk food to healthy food: you do not throw all junk food in a day. You replace one meal at a time, track how you feel and keep going. A value-based life is built the same way.", "hinglish": "Badlav ek din me nahi hota. Pehle khud se shuru, phir parivaar, phir kaam, phir samaj aur system. Samajh, jeena aur phailana, ye teen steps hain.", "mistakes": ["Expecting the whole world to change at once.", "Knowing the values but not practising daily."], "remember": ["Transition = gradual shift to a value-based way", "Four levels: individual, family, society, systems", "Start with self-exploration and daily practice", "Profession: honesty, competence, fair treatment, eco-friendly", "Understanding + living + spreading"], "def": "**Transition** is the **gradual shift** from the **present way of living** (facility-oriented, competition) to the **value-based way** (understanding, harmony, cooperation). It needs a **strategy at all four levels**: individual, family, society and systems."}};
const ELI5 = {"u1-t1": {"story": "Socho tumhare paas Ferrari hai (skill) par GPS nahi (values). Tum bahut tez ja rahe ho, bas pata nahi kidhar. **Value education** wo GPS hai. Aaj ka college system tumhe engineer bana deta hai jo satellite bana sakta hai par ghar pe mummy se baat karne ka tarika nahi aata. Aur placement ke baad bhi 'life me khushi kyun nahi hai' wala sawal wahi rehta hai, bilkul jaise exam ke baad 'syllabus me ye tha hi nahi' wala dukh.", "items": [["🧭", "Value", "Jo sab ko sahi lage."], ["🛠️", "Skill", "Kaise karna hai."], ["🎯", "Direction", "Kyun aur kis liye."], ["🔍", "Verify", "Khud check karo."]], "line": "Skill bataye kaise, value bataye kyun."}, "u1-t2": {"story": "Tumhari mummy bolti hain 'beta shaadi karle'. **Proposal** aaya. Ab tum andar jaake pooch: 'kya mujhe sach me chahiye?' ye **natural acceptance**. Phir ek mahina date karke dekha, ye hai **experiential validation** (ya fir ek hafte me hi pata chal jata hai). Jo cheez andar se bhi sahi lage aur jeene par bhi khushi de, wahi sahi. Baaki sab rishtedaar ki raay hai, jo hamesha free me milti hai aur hamesha kaam ki nahi hoti.", "items": [["📢", "Proposal", "Kisi ne bataya."], ["❤️", "Natural acceptance", "Andar ki awaaz."], ["🏃", "Experience", "Jee ke dekha."], ["✅", "Right", "Dono pass."]], "line": "Pehle andar se check, phir jeekar check."}, "u1-t3": {"story": "Tumne naya iPhone liya (**physical facility**) par girlfriend ne block kar diya (**relationship**) aur tumhe samajh nahi aa raha kyun (**right understanding**). Phone ki screen chamak rahi hai, tum andar se bujhe hue ho. Isliye teeno chahiye. Sirf phone se khushi aati to har Apple user ka chehra Diwali jaisa hota.", "items": [["📱", "Facility", "Zaroori par limited."], ["🤝", "Rishte", "Bina count ke."], ["🧠", "Samajh", "Sahi galat ki."], ["🌈", "Khushi", "Teeno ka natija."]], "line": "Facility zaroori hai, par khushi ke liye samajh aur rishte chahiye."}, "u1-t4": {"story": "Hostel ka Maggi wala bhaiya Rs 300 kamake khush hai, aur ek IAS ka beta Rs 3 lakh salary me bhi 'bhai kuch chal nahi raha' bol raha hai. **Prosperity feeling hai, balance nahi.** Aur **happiness** wo hai jo tab bhi rahe jab Wi-Fi band ho, crush ne reply na kiya ho aur mess me phir se lauki bani ho. Excitement wo hai jo IPL ke last over me aata hai, bas ek raat chalta hai.", "items": [["😊", "Sukh", "Lagataar khushi."], ["💰", "Samriddhi", "Zaroorat se zyada hone ka ehsaas."], ["📉", "Deprivation", "Kuch nahi hai wala feel."], ["🎢", "Excitement", "Aata hai, jaata hai."]], "line": "Khushi aur samriddhi dono ek feeling hain, kisi cheez ka count nahi."}, "u1-t5": {"story": "Subah uthke chai, phir canteen, phir lecture me neend, phir Instagram, phir mess, phir sona. Ye **animal consciousness** ka perfect routine hai, ek kutta bhi isse zyada productive hai kyunki wo kam se kam ghar ki rakhwali karta hai. **Human consciousness** ye puchta hai: 'main ye sab kyun kar raha hu, aur kya isse mujhe sach me khushi mil rahi hai?' Jis din ye sawal aaya, samajho tum insaan ban gaye.", "items": [["🐕", "Animal", "Sirf jism ki zaroorat."], ["🧑", "Human", "Samajh + rishte + suvidha."], ["🪞", "Awareness", "Khud ko dekhna."], ["⬆️", "Shift", "Animal se human."]], "line": "Body ki zaroorat poori karna jaruri hai, par kaafi nahi."}, "u1-t6": {"story": "Aaj ka insaan LinkedIn par 'grateful and humbled' likhta hai aur raat 2 baje thanda khana kha ke sochta hai 'life kya hai'. Hum chaand par pahunch gaye, par apne ghar me dadi se baat karne ka time nahi nikalte. Government kehti hai **vikas**, hum bolte hain **vikas ho gaya**, aur raat ko neend nahi aati. Ye wahi **current scenario** hai jo textbook me 4 levels me likha hai.", "items": [["😵", "Individual", "Stress aur loneliness."], ["💔", "Family", "Rishte toot rahe."], ["⚔️", "Society", "Anyay aur hinsa."], ["🌫️", "Nature", "Pollution."]], "line": "Sab jagah wahi gadbad: facility badhi, samajh nahi badhi."}, "u1-t7": {"story": "Tum apne dost ke saath perfect ho (self-level pe sahi), par ghar par papa se 3 din se baat nahi (family fail), colony ki gali me kachra phek ke aate ho (society fail), aur plastic ki bottle nadi me (nature fail). To tumhari **harmony sirf 25% hai**. UHV bolta hai: sabhi 4 level par samjho aur jeeyo, tab full marks. Warna ye wahi hai jaise ek subject me 90 aur baaki me backlog.", "items": [["🧍", "Self", "Pehla level."], ["👨‍👩‍👧", "Family", "Dusra."], ["🏘️", "Society", "Teesra."], ["🌍", "Nature", "Chautha."]], "line": "Chaaron level par samjho, chaaron level par jeeyo."}, "u2-t1": {"story": "Jab tum bolte ho 'main motaa ho gaya', to asal me body mota hua hai, **tum** nahi. Aur jab ex ki yaad aati hai, to body ko kuch nahi hota, par Self ka dil bhaari ho jata hai. Dekha, dono alag hain! Body ko fridge me rakh do, wo khush rahegi. Self ko fridge me rakho to tension me aa jayega. Isliye **Self = driver, body = gaadi**. Driver ko stand par chhod ke gaadi ko dhona band karo.", "items": [["🧑‍✈️", "Self", "Driver, chetan."], ["🚗", "Body", "Gaadi, jad."], ["🔗", "Co-existence", "Dono saath."], ["❓", "I", "Main body nahi, Self hu."]], "line": "Main Self hu, body mera instrument hai."}, "u2-t2": {"story": "Breakup hua, tum Zomato kholke 3 biryani mangaate ho. **Biryani body ke liye thi, dard Self ka tha.** Body ko to bas ek plate chahiye thi, baaki do plate ne sirf EMI badhayi. Isi tarah 6 jodi sneakers kharidne se confidence nahi aata, wo aata hai jab koi tumhari baat dhyan se sune. Self ki bhookh respect se bharti hai, Swiggy se nahi.", "items": [["🧠", "Self need", "Sukh, bharosa, izzat."], ["🍕", "Body need", "Khana, kapde, ghar."], ["❌", "Galti", "Dukh me shopping."], ["✅", "Sahi", "Har need ka sahi upay."]], "line": "Self ki zaroorat samajh se, body ki zaroorat suvidha se."}, "u2-t3": {"story": "Tumhare haath ne Instagram pe 'follow' dabaya, par haath ko to pata bhi nahi tha ki wo ex ki profile hai. **Faisla Self ka tha, body ne sirf click kiya.** Isliye 'galti haath ki hai' bolna waisa hi hai jaise cricket me bat ko dosh dena. Bas ko chalane wala (Self) hi asli zimmedar hai, aur bas me diesel (khana) wahi daalo jo chahiye.", "items": [["👀", "Seer", "Self jaanta hai."], ["✋", "Doer", "Self faisla leta hai."], ["😋", "Enjoyer", "Self anubhav karta hai."], ["🛠️", "Instrument", "Body sirf karta hai."]], "line": "Self malik hai, body upkaran."}, "u2-t4": {"story": "Raat 1 baje: **desire** hai ki Netflix dekhe, **thought** hai ki kal subah 8 baje test hai, **expectation** hai ki topper bane. Teeno apni apni disha me bhaag rahe hain aur Self bechara beech me phata hua hai. Ye **conflict** hai. Jis din teeno bolen 'bhai pehle padh lo' aur tum so jao, wo **harmony** hai. Warna wahi hota hai jo coaching ke bad me hota hai: sabke plan alag, results same.", "items": [["❤️", "Desire", "Chaah."], ["💭", "Thought", "Vichar."], ["🎯", "Expectation", "Ichchha."], ["☮️", "Harmony", "Teeno same disha me."]], "line": "Teeno andar ke saathi ek hi disha me hon to Self shaant."}, "u2-t5": {"story": "Raat ko 3 baje Maggi, subah 11 baje uthna, college me neend, evening me 'bhai jim ja ke aata hu' (ja ke nahi aata). Body bol rahi hai 'bhai main kaam karne wali machine hu, mujhe diesel to sahi do'. **Sanyam** ka matlab hai Self ne body ko apni zimmedari maana, jaise tum phone ko 100% charge karte ho par apni neend ko 4% par chhod dete ho. Dono ka khayal rakho, phone aur body, warna dono band ho jaate hain.", "items": [["🥗", "Nurturing", "Sahi khana, neend."], ["🛡️", "Protection", "Chot, bimari se bachav."], ["🏋️", "Right use", "Sahi kaam me body."], ["💪", "Swasthya", "Fit aur active."]], "line": "Body ka khayal rakhna Self ki zimmedari hai."}, "u3-t1": {"story": "Ghar me sab ek saath baithe hain, par sab apne apne phone me. Dadi bol rahi hain 'beta khana kha', aur tum 'haan haan bas 2 min' bolke 40 min baad aate ho. Ye **family hai par harmony nahi**. Aur shaadi ke sawal par papa ka ek hi dialogue: 'society kya kahegi'. Society ko tumhare bills se koi matlab nahi hai bro, wo bas WhatsApp status dekhti hai.", "items": [["🏠", "Parivaar", "Pehli ikai."], ["💞", "Rishta", "Feelings ka connection."], ["🤝", "Mutual", "Dono ki khushi."], ["🧱", "Samaj", "Parivaaron se bana."]], "line": "Parivaar me rishte feelings se chalte hain, cheezon se nahi."}, "u3-t2": {"story": "Dost ne tumhara phone repair karne ke naam par uska screen tod diya. Ab do cases hain: (a) 'ye jaanbujhke karta hai' (intention galat), ya (b) 'ye naya hai, practice nahi hai' (competence kam). Sach me sab ka intention theek hota hai, bas kabiliyat Google se seekhi hoti hai. Tum apne liye wahi sochte ho (mera intention to acha tha), dusre ke liye wahi nahi. Isiliye ladaai hoti hai, aur isiliye shaadi me 'tune jaanbujhke kiya' wala dialogue har ghar me hit hai.", "items": [["🎯", "Intention", "Kya chahta hai."], ["🛠️", "Competence", "Kar sakta hai ya nahi."], ["🤝", "Trust", "Intention par yakeen."], ["👀", "Galti", "Dono ko mix karna."]], "line": "Intention par bharosa, competence par mehnat."}, "u3-t3": {"story": "Tum principal ke saamne 'Good morning sir' bol ke jhuk jaate ho, aur sweeper ko dekh ke aankh phir leti ho. Ye **differentiation** hai. **Respect** ka matlab hai dono ko insaan ki tarah dekhna. Aur hamare yahan to shaadi ke card par bhi 'bade ghar ka ladka' likha jata hai, jaise hum insaan nahi, flat ki BHK hain.", "items": [["⚖️", "Right evaluation", "Jaisa hai, waisa."], ["📈", "Over", "Zyada dena."], ["📉", "Under", "Kam dena."], ["🧳", "Otherwise", "Galat aadhar."]], "line": "Insaan ko insaan ki tarah dekho, post ya paise ki tarah nahi."}, "u3-t4": {"story": "**Affection** wo hai jab maa bolti hain 'beta kuch khaya?' (aur tumne Maggi kha li hai). **Care** wo hai jab tum fever me ho aur roommate raat ko 2 baje paracetamol laaye. **Guidance** wo hai jab senior bole 'ye DSA ka code aise likh'. **Gratitude** wo hai jab tum job lagne ke baad us senior ko chai pilao. **Love** wo hai jab tum sab ko apna samjho, yaha Instagram ka 'love' nahi, wahi UHV wala. Ye sab bhaavnaaye cheezein hain jo placement me nahi milti par zindagi me kaam aati hain.", "items": [["🍼", "Affection", "Parvarish ki zimmedari."], ["💊", "Care", "Body ki dekhbhal."], ["🧭", "Guidance", "Samajh badhana."], ["🙏", "Gratitude", "Shukriya."]], "line": "Sab bhaavnayein rishte ko poora karti hain."}, "u3-t5": {"story": "Group assignment me 4 log: ek ne PPT banaya, ek ne coding ki, ek ne 'moral support' diya, aur ek ne sirf naam likhwaya. Marks sabko barabar mile. **Ye anyay hai.** Nyay ke chaar steps ho jaate agar pehle wala sabko pehchanta (roles), sab apna kaam karte, teacher dekhta, aur sab khush hote. Baaki bhaiya, aapka 'moral support' bhi kaam hai, par uska certificate nahi milta.", "items": [["🔍", "Recognition", "Mulya pehchano."], ["✅", "Fulfilment", "Nibhao."], ["🧮", "Evaluation", "Check karo."], ["😊", "Mutual happiness", "Dono khush."]], "line": "Nyay = rishte ke mulya poore hona, saza nahi."}, "u3-t6": {"story": "Cricket match me India-Pakistan ho to poora desh ek ho jata hai (UHV: 'undivided'), par agle din ki bus me seat ke liye apni hi colony ke log lad rahe hain. Politics wale to election ke time poora **akhand samaj** hote hain: 'bhaiyo aur behno, hum sab ek hain', aur result ke baad sab alag. **Sarvabhaum vyavastha** ka matlab hai ye 'ek hain' wala feel permanent ho, sirf campaign ke time nahi.", "items": [["🏠", "Parivaar", "Chhota samaj."], ["🌐", "Akhand samaj", "Sab ek."], ["5️⃣", "5 ayam", "Shiksha se vinimay tak."], ["🕊️", "Vyavastha", "Shanti ka dhancha."]], "line": "Parivaar ka pyaar poore vishwa tak badhana."}, "u4-t1": {"story": "Pani ka cycle dekho: samundar -> baadal -> baarish -> nadi -> samundar. Isme koi 'waste' nahi, aur kisi ko salary bhi nahi di. Ab dekho insaan: plastic bana, use hua, nadi me gaya, machhli ke pet me gaya, wapas tumhari plate me aaya. Prakriti ne bola 'recycle karo', aur hum 'micro-plastic me recycle ho gaya' samajh gaye. **Self-regulation** ye hai ki Delhi ki hawa ne bola 'bas ab 500 AQI', aur hum bole 'abhi toh 5000 hona baaki hai'.", "items": [["🪨", "Padarth", "Jadi cheezein."], ["🌳", "Pran", "Ped paudhe."], ["🐄", "Jeev", "Janwar."], ["🧑", "Gyan", "Insaan."]], "line": "Prakriti me sab recycle hota hai aur khud balance karta hai."}, "u4-t2": {"story": "Bees phool se ras leti hain aur phool ko pollination milta hai. **Mutual fulfilment.** Insaan ped se kaagaz leta hai, kaagaz par 'Save Trees' likhta hai, aur phir kaagaz ke bina bhi wo poster print karta hai. Prakriti me har kisi ka role hai, bas hamara role 'consumer' me jaakar atak gaya, jaise Netflix me sirf 'watching' chal raha hai, 'contributing' nahi. UHV ka matlab: thoda contribute karo, sirf consume mat karo.", "items": [["🔄", "Interconnected", "Sab jude hain."], ["🤲", "Mutual", "Dena aur lena."], ["🧑", "Human role", "Poshan, suraksha, upyog."], ["🌲", "Example", "Jungle aur baarish."]], "line": "Prakriti me sab ek dusre ko poora karte hain, insaan bhi."}, "u4-t3": {"story": "Tumhe lagta hai tum akele ho (post-breakup mode). Par tumhare saath hawa hai, dost hain, mummy ke call hain, mosquito hai, aur 4G ka tower bhi. Pura **existence co-existence** hai. Akele sirf tab ho jab Wi-Fi password galat ho. Isko samajh lo to **'I am alone' wala emotion patla ho jata hai**, aur 'sab mere saath hain' wala feel aata hai. Free me therapy, bas UHV ka 4th chapter.", "items": [["🌌", "Space", "Sab ismein."], ["🔗", "Co-existence", "Akela koi nahi."], ["🧬", "All levels", "Atom se universe tak."], ["💞", "Relatedness", "Sab se jud gaye."]], "line": "Existence ka matlab hai sab saath, akela koi nahi."}, "u4-t4": {"story": "Google Maps me pehle sirf tumhara blue dot dikhta hai (**self**), phir zoom out karo to galli (**family**), sheher (**society**), desh (**nature**) aur poori duniya (**existence**) dikhti hai. Pehle tum sochte the 'mera dot ka kya hoga'. Zoom out ke baad: 'arre sabka ek hi map hai'. Yahi **holistic perception** hai. Aur haan, jab tak tum bina zoom out kiye sirf apna dot dekhte ho, to Maps tumhe wahi dikhayega: 'Kahin na pahuchte hue' (you have reached nowhere).", "items": [["🔵", "Self", "Apna dot."], ["🔍", "Zoom out", "Parivaar, samaj."], ["🌍", "Existence", "Poori duniya."], ["🧩", "Holistic", "Sab ek saath."]], "line": "Sab levels ek saath dekhna hi holistic perception hai."}, "u5-t1": {"story": "Raat ke 2 baje red signal. Koi nahi hai. Agar tum ruke, to **character** hai. Agar tum police ki wajah se ruke, to **rule** hai, character nahi. Aur agar tum is hisaab se chalo ki 'jab tak pakda na jaaye' to ye ethics nahi, **risk management** hai. **Natural acceptance** ye hai ki jab tum khud kisi se cheat hote ho, to bura lagta hai. Isliye sach me kisi ko cheat karna sab ki natural acceptance ke khilaaf hai, chahe wo ex ho ya Ola driver.", "items": [["❤️", "Natural acceptance", "Andar ki sahi awaaz."], ["📜", "Mulya", "Sab ko manya."], ["📏", "Niti", "Mulya ko lagu karna."], ["🧱", "Charitra", "Aadat se jeena."]], "line": "Naitik aacharan wahi jo natural acceptance se aaye, jo sab me same hai."}, "u5-t2": {"story": "Aaj ki padhai ka lakshya: 'placement ho jaye'. **Humanistic education** ka lakshya: 'placement ho jaye aur raat ko neend bhi aaye'. Aur constitution ki baat karein to hamare yahan har party kehti hai 'hum samvidhan bachayenge' (aur bachane ke naam par rally me kursi tod dete hain). **Humanistic constitution** ka matlab hai jo kaagaz me likha hai, wahi dil me bhi ho, aur sirf election ke time nahi.", "items": [["🎓", "Education", "Skill + samajh."], ["📘", "Constitution", "Nyay ka dhancha."], ["🌐", "Universal order", "Dono ka natija."], ["🌱", "Shuruaat", "Vyakti se."]], "line": "Shiksha vyakti banati hai, samvidhan samaj, dono milke vyavastha."}, "u5-t3": {"story": "Engineer ne bridge banaya. Cement thoda kam daala, commission thoda zyada liya, aur utghatan me neta ne ribbon kaata. Do saal baad bridge ne neeche aane ka decision liya. **Ye competence ki kami nahi, ethics ki kami thi.** Professional ethics ka matlab hai ki tumhari degree sirf resume ki shobha nahi, kisi ki jaan ki guarantee bhi hai. Aur haan, 'sab karte hain' wala excuse bhi isi category me aata hai.", "items": [["🏗️", "Skill", "Sabke bhale ke liye."], ["🏭", "Production", "People + eco friendly."], ["⚙️", "Technology", "Zaroorat ke hisaab se."], ["🤝", "Ethics", "Trust ki guarantee."]], "line": "Skill + values = achha professional."}, "u6-t1": {"story": "Company ne naya phone launch kiya jo 1 saal me kharaab ho jata hai, **taaki tum agle saal naya lo**. Ye profit-oriented technology hai. **Holistic technology** wo hai jo 5 saal chale aur repair ho sake. Aur management me boss ka 'work from office, tum sab ka parivaar jaaye bhaad me' wala attitude holistic nahi hai. Holistic boss wo hai jo bole 'bhai deadline hai, par chaay pee lo'.", "items": [["🌱", "Holistic tech", "Insaan + prakriti dono."], ["🏭", "Production", "Zaroorat ke hisaab se."], ["👥", "Management", "Nyay aur sahyog."], ["♻️", "Waste", "Kam se kam."]], "line": "Technology wahi jo insaan aur prakriti dono ka bhala kare."}, "u6-t2": {"story": "Ek gaon jaha logon ne decide kiya ki sharab band, ped lagao, paani bachao. Aur kuch saalon me gaon crorepati ho gaya (**Hiware Bazar**). Dusri taraf hum hain: ek WhatsApp group me bhi kaam decide nahi hota, kyunki 'meri baat suni nahi gayi'. Gaon wale kar sakte hain to hum bhi kar sakte hain, bas pehle apne hostel ke mess ka committee theek karo.", "items": [["💧", "Hiware Bazar", "Paani aur nasha."], ["🥛", "Amul", "Cooperative."], ["💸", "Grameen", "Bharose ka loan."], ["☀️", "Barefoot", "Solar didi."]], "line": "Mulya sach me kaam karte hain, ye log dikha chuke hain."}, "u6-t3": {"story": "January me gym ka membership, February me 'bhai is mahine busy hu'. **Transition** ka matlab hai ye resolution ek hafte se zyada chale. UHV ka formula: chhote kadam. Aaj assignment me copy mat karo. Kal mess me thali bina waste ke khatam karo. Parso kisi junior ko bina maange help karo. Aur 1 saal baad tum wo banda ho jisse log pooch rahe hain 'bhai tu itna shaant kaise hai', aur tum bologe 'bas thoda sa UHV padha tha'.", "items": [["🌱", "Start small", "Chhote kadam."], ["🔁", "Practice", "Roz jeeyo."], ["🧭", "Review", "Check karo."], ["📣", "Spread", "Ek se dusra."]], "line": "Khud se shuru karo, roz jeeyo, phir phailao."}};
const NOTES_KEY = 'uhvCourse_notes_105306';
function inl(t){ // safe inline markup: `code` and **bold**
  return escapeHtml(String(t==null?'':t)).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
}
function plain(t){ return String(t==null?'':t).replace(/`([^`]+)`/g,'$1').replace(/\*\*([^*]+)\*\*/g,'$1'); }
function mk(tag, cls, html){ const e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e; }
function lessonViz(v){
  const box=mk('div','lviz');
  if(v.type==='chain'){
    const row=mk('div','lviz-chain');
    v.items.forEach((it,i)=>{
      if(i) row.appendChild(mk('span','lviz-arrow',(v.labels&&v.labels[i-1]?'<small>'+inl(v.labels[i-1])+'</small>':'')+'→')).style.setProperty('--i',i*2-1);
      const n=mk('span','lviz-node',inl(it)); n.style.setProperty('--i',i*2); row.appendChild(n);
    });
    box.appendChild(row);
  } else if(v.type==='tree'){
    box.appendChild(Object.assign(mk('div','lviz-node root',inl(v.root)),{})).style.setProperty('--i',0);
    box.appendChild(mk('div','lviz-stem')).style.setProperty('--i',1);
    const kids=mk('div','lviz-kids');
    v.kids.forEach((k,i)=>{ const n=mk('span','lviz-node',inl(k)); n.style.setProperty('--i',i+2); kids.appendChild(n); });
    box.appendChild(kids);
  } else if(v.type==='merge'){
    const ps=mk('div','lviz-kids'); v.parents.forEach((k,i)=>{ const n=mk('span','lviz-node root',inl(k)); n.style.setProperty('--i',i); ps.appendChild(n); }); box.appendChild(ps);
    box.appendChild(mk('div','lviz-stem')).style.setProperty('--i',v.parents.length);
    const c=mk('div','lviz-node'+(v.bad?' bad':''),inl(v.child)+(v.bad?' ✖':'')); c.style.setProperty('--i',v.parents.length+1); box.appendChild(c);
  } else if(v.type==='merge'){
    const ps=mk('div','lviz-kids'); v.parents.forEach((k,i)=>{ const n=mk('span','lviz-node root',inl(k)); n.style.setProperty('--i',i); ps.appendChild(n); }); box.appendChild(ps);
    box.appendChild(mk('div','lviz-stem')).style.setProperty('--i',v.parents.length);
    const c=mk('div','lviz-node'+(v.bad?' bad':''),inl(v.child)+(v.bad?' ✖':'')); c.style.setProperty('--i',v.parents.length+1); box.appendChild(c);
  } else if(v.type==='cells'){
    const row=mk('div','lviz-cells'); const hl=v.hl||[];
    v.items.forEach((it,i)=>{ const w=mk('div','lviz-cw'); const n=mk('span','lviz-node lviz-cell'+(hl.indexOf(i)>=0?' root':''),inl(it)); n.style.setProperty('--i',i); w.appendChild(n); w.appendChild(mk('div','lviz-lab',v.labels&&v.labels[i]!=null?inl(v.labels[i]):'')); row.appendChild(w); });
    box.appendChild(row);
  } else if(v.type==='layers'){
    v.items.forEach((it,i)=>{ const n=mk('div','lviz-node lviz-layer'+(i===v.items.length-1?' root':''),inl(it)); n.style.setProperty('--i',i); n.style.width=(100-Math.min(i,4)*6)+'%'; box.appendChild(n); });
  } else if(v.type==='mem'){

function lessonTable(t){

  tb.innerHTML='<tr>'+t.head.map(h=>'<th>'+inl(h)+'</th>').join('')+'</tr>'+t.rows.map(r=>'<tr>'+r.map(c=>'<td>'+inl(c)+'</td>').join('')+'</tr>').join('');

function lessonToText(L, title){
  const o=['# '+title,''];
  if(L.tldr) o.push('In one line: '+plain(L.tldr),'');
  if(L.def) o.push('## Definition',plain(L.def),'');
  (L.sections||[]).forEach(s=>{
    o.push('## '+plain(s.h));
    (s.p||[]).forEach(x=>o.push(plain(x)));
    (s.pts||[]).forEach(x=>o.push('- '+plain(x)));
    if(s.table){ o.push(s.table.head.map(plain).join(' | ')); s.table.rows.forEach(r=>o.push(r.map(plain).join(' | '))); }
    if(s.viz&&s.viz.items) o.push(s.viz.items.map(plain).join(' -> '));
    if(s.code) o.push('```java','// '+(s.code.f||''),s.code.c,'```');
    if(s.code&&s.code.out) o.push('Output: '+s.code.out);
    if(s.tip) o.push('Tip: '+plain(s.tip));
    if(s.warn) o.push('Warning: '+plain(s.warn));
    o.push('');
  });
  [['Where it is used','uses'],['Advantages','pros'],['Limitations','cons'],['Common mistakes','mistakes'],['Quick revision','remember']].forEach(([lb,k])=>{
    if(L[k]&&L[k].length){ o.push('## '+lb); L[k].forEach(x=>o.push('- '+plain(x))); o.push(''); }
  });
  return o.join('\n');
}
function loadNote(key){ try{ return (JSON.parse(localStorage.getItem(NOTES_KEY)||'{}'))[key]||''; }catch(e){ return ''; } }

function renderLesson(body, unitId, topicId){
  const key=unitId+'-'+topicId, L=LESSONS[key];
  if(!L) return false;
  // keep only header + quizzes from the old template
  const eyebrow=body.querySelector('.topic-eyebrow'), title=body.querySelector('.topic-title'), hook=body.querySelector('.topic-hook');

  body.innerHTML='';

  const root=mk('div','lesson');
  // toolbar
  const bar=mk('div','lbar');
  const bCopy=mk('button','neu-btn','📋 Copy notes'); bCopy.type='button';

  const bPrint=mk('button','neu-btn','🖨️ Print / Save PDF'); bPrint.type='button';
  bPrint.onclick=()=>window.print();

  [bCopy,bPrint,bMy].forEach(b=>bar.appendChild(b));
  root.appendChild(bar);

  // table of contents
  const secs=L.sections||[];
  const toc=mk('nav','ltoc'); toc.appendChild(mk('span','ltoc-l','On this page'));
  const tocItems=[['Definition','ls-def']].concat(secs.map((s,i)=>[plain(s.h),'ls-'+i]));
  if((L.uses||L.pros||L.cons||[]).length) tocItems.push(['Uses, pros & cons','ls-ufc']);
  tocItems.push(['Quick revision','ls-rev']);
  tocItems.forEach(([t,id])=>{ const a=mk('button','ltoc-a'); a.type='button'; a.textContent=t; a.onclick=()=>document.getElementById(id)?.scrollIntoView({behavior:'smooth',block:'start'}); toc.appendChild(a); });
  root.appendChild(toc);

  if(L.tldr){ const t=mk('div','ltldr reveal'); t.innerHTML='<span class="ltldr-l">⚡ In one line</span><p>'+inl(L.tldr)+'</p>'; root.appendChild(t); }
  if(L.def){ const d=mk('section','ldef reveal'); d.id='ls-def'; d.innerHTML='<div class="lh"><span class="lnum">★</span><h2>Definition</h2></div><p>'+inl(L.def)+'</p>'; root.appendChild(d); }

  secs.forEach((s,i)=>{
    const sec=mk('section','lsec reveal'); sec.id='ls-'+i;
    sec.appendChild(mk('div','lh','<span class="lnum">'+String(i+1).padStart(2,'0')+'</span><h2>'+inl(s.h)+'</h2>'+(s.x?'<span class="oos-pill">Not in syllabus</span>':'')));
    (s.p||[]).forEach(x=>sec.appendChild(mk('p','lp',inl(x))));
    if(s.viz) sec.appendChild(lessonViz(s.viz));
    if(s.pts&&s.pts.length){ const ul=mk('ul','lpts'); s.pts.forEach((x,j)=>{ const li=mk('li',null,inl(x)); li.style.setProperty('--i',j); ul.appendChild(li); }); sec.appendChild(ul); }
    if(s.table) sec.appendChild(lessonTable(s.table));
    if(s.code) sec.appendChild(lessonCode(s.code));
    if(s.tip) sec.appendChild(mk('div','lcall tip','<b>💡 Tip</b> '+inl(s.tip)));
    if(s.warn) sec.appendChild(mk('div','lcall warn','<b>⚠️ Careful</b> '+inl(s.warn)));
    root.appendChild(sec);
  });

  if(L.analogy||L.hinglish){
    const g=mk('div','lpair reveal');
    if(L.analogy) g.appendChild(mk('div','lbox ana','<div class="lbox-l">🎭 Real-life analogy</div><p>'+inl(L.analogy)+'</p>'));
    if(L.hinglish) g.appendChild(mk('div','lbox hin','<div class="lbox-l">💬 Hinglish mein</div><p>'+inl(L.hinglish)+'</p>'));
    root.appendChild(g);
  }

  const ufc=[['🎯 Where it is used','uses','u'],['✅ Advantages','pros','p'],['⛔ Limitations','cons','c']].filter(x=>(L[x[1]]||[]).length);
  if(ufc.length){
    const sec=mk('section','lsec reveal'); sec.id='ls-ufc';
    sec.appendChild(mk('div','lh','<span class="lnum">＋</span><h2>Uses, advantages &amp; limitations</h2>'));
    const grid=mk('div','lgrid');
    ufc.forEach(([lb,k,c])=>{ const card=mk('div','lcard '+c,'<div class="lcard-l">'+lb+'</div>'); const ul=mk('ul'); L[k].forEach(x=>ul.appendChild(mk('li',null,inl(x)))); card.appendChild(ul); grid.appendChild(card); });
    sec.appendChild(grid); root.appendChild(sec);
  }
  if((L.mistakes||[]).length){
    const m=mk('div','lmist reveal','<div class="lbox-l">⚠️ Common mistakes</div>'); const ul=mk('ul'); L.mistakes.forEach(x=>ul.appendChild(mk('li',null,inl(x)))); m.appendChild(ul); root.appendChild(m);
  }
  const rev=mk('section','lrev reveal'); rev.id='ls-rev';
  rev.appendChild(mk('div','lh','<span class="lnum">⭐</span><h2>Quick revision</h2>'));
  const rl=mk('ul'); (L.remember||[]).forEach(x=>rl.appendChild(mk('li',null,inl(x)))); rev.appendChild(rl); root.appendChild(rev);

    const inner=mk('div','eli5-body');
    if(E5.story) inner.appendChild(mk('div','eli5-story','<div class="lbox-l">🎈 The simple story</div><p>'+inl(E5.story)+'</p>'));
    const grid=mk('div','eli5-grid');

    inner.appendChild(grid);

    det.appendChild(inner); root.insertBefore(det, root.firstChild);
  }

  // my notes
  const nb=mk('section','lnotes reveal','<div class="lbox-l">✍️ My notes <span class="lnotes-s">saved on this device</span></div>');
  const ta=document.createElement('textarea'); ta.id='myNotes'; ta.placeholder='Write your own notes for this topic here…'; ta.value=loadNote(key);
  let tm; ta.addEventListener('input',()=>{ clearTimeout(tm); tm=setTimeout(()=>saveNote(key,ta.value),400); });
  nb.appendChild(ta); root.appendChild(nb);

  body.appendChild(root);
  quizzes.forEach(q=>body.appendChild(q));
  return true;
}

function renderDeep(body, unitId, topicId){
  const d = DEEP[unitId+'-'+topicId];
  if(!d) return;
  const wrap=document.createElement('div'); wrap.className='detail deep';
  const h=document.createElement('h3'); h.textContent='\uD83D\uDCDA In Detail'; wrap.appendChild(h);
  const row=(label,cls)=>{
    const r=document.createElement('div'); r.className='drow';
    const lb=document.createElement('div'); lb.className='dlbl '+cls; lb.textContent=label;
    const tx=document.createElement('div'); tx.className='dtxt';
    r.appendChild(lb); r.appendChild(tx); wrap.appendChild(r);
    return tx;
  };
  const fill=(tx,content)=>{
    if(Array.isArray(content)){
      const ul=document.createElement('ul');
      content.forEach(t=>{ const li=document.createElement('li'); li.textContent=t; ul.appendChild(li); });
      tx.appendChild(ul);
    } else { tx.textContent=content; }
  };
  fill(row('\uD83D\uDCD6 Definition','a'), d.d);
  fill(row('\uD83D\uDD0E Explained in detail','b'), d.a);
  if(d.x){
    const tx=row('\uD83D\uDCBB Example','a');
    const ed=document.createElement('div'); ed.className='editor';
    ed.innerHTML='<div class="editor-bar"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div><span class="fname"></span></div><pre><code data-lang="java"></code></pre>';
    ed.querySelector('.fname').textContent=d.x.f;
    ed.querySelector('code').textContent=d.x.c;
    tx.appendChild(ed);
  }
  fill(row('\uD83C\uDFAF Where and why it is used','a'), d.u);
  fill(row('\u2705 Advantages','b'), d.p);
  fill(row('\u26A0\uFE0F Limitations and common mistakes','c'), d.c);
  body.appendChild(wrap);
}

    const done=()=>{ toast.classList.add('show'); setTimeout(()=>toast.classList.remove('show'),1400); };
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(url).then(done).catch(done); }
    else { const ta=document.createElement('textarea'); ta.value=url; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');}catch(err){} ta.remove(); done(); }
    return;
  }
  window.open(links[kind],'_blank','noopener');
}

function currentTheme(){ return document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark'; }
function syncThemeButton(){

const TOTAL_TOPICS = UNITS.reduce((s,u)=>s+u.topics.length,0);
const STORAGE_KEY = 'uhvCourse_progress_105306';

/* ---------- PERSISTENCE (progress saved in this browser) ---------- */
function loadProgress(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return new Set();
    const arr = JSON.parse(raw);
    if(Array.isArray(arr)) return new Set(arr);
    return new Set();
  }catch(e){
    return new Set();
  }
}
function saveProgress(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(Array.from(doneSet)));
    flashSaveStatus();
  }catch(e){
    const t = document.getElementById('saveStatusText');
    if(t) t.textContent = "Couldn't save (private browsing?)";
  }
}
function flashSaveStatus(){
  const el = document.getElementById('saveStatus');
  const t = document.getElementById('saveStatusText');
  if(!el || !t) return;
  t.textContent = 'Saved just now';
  el.classList.add('flash');
  clearTimeout(flashSaveStatus._timer);
  flashSaveStatus._timer = setTimeout(()=>{ t.textContent = 'Progress saved on this device'; el.classList.remove('flash'); }, 1600);
}

let currentUnit = null, currentTopic = null;
const flatOrder = [];
UNITS.forEach(u => u.topics.forEach(t => flatOrder.push({unit:u.id, topic:t.id})));

/* ---------- SIDEBAR ---------- */
function buildSidebar(){
  const nav = document.getElementById('unit-list');
  nav.innerHTML='';
  UNITS.forEach((u,idx)=>{
    const block = document.createElement('div');
    block.className='unit-block';
    block.dataset.unit = u.id;
    const toggle = document.createElement('button');
    toggle.className='unit-toggle';
    toggle.innerHTML = `<span class="num">${idx+1}</span><span class="label"><span class="name">${u.name}</span><span class="hrs">${u.hrs} · ${u.topics.length} topics</span></span><span class="chev">▶</span>`;
    toggle.addEventListener('click',()=>{
      block.classList.toggle('open');
    });
    block.appendChild(toggle);
    const tlist = document.createElement('div');
    tlist.className='topic-list';
    u.topics.forEach(t=>{
      const link = document.createElement('div');
      link.className='topic-link'+(t.oos?' oos':'');
      link.dataset.unit=u.id; link.dataset.topic=t.id;
      link.innerHTML = `<span class="check"></span><span>${t.title}</span>`;
      if(doneSet.has(u.id+'-'+t.id)){
        link.classList.add('done');
        link.querySelector('.check').textContent='✓';
      }
      link.addEventListener('click',()=>{ if(currentUnit===u.id && currentTopic===t.id){ if(doneSet.has(u.id+'-'+t.id)){ setTopicDone(u.id,t.id,false); syncCompleteBtn(); } } else loadTopic(u.id,t.id); if(document.getElementById('sidebar').classList.contains('open')) closeSidebar(); });
      tlist.appendChild(link);
    });
    block.appendChild(tlist);
    nav.appendChild(block);
  });
  updateXP();
}

function setTopicDone(unitId, topicId, done){
  const key = unitId+'-'+topicId;
  if(done) doneSet.add(key); else doneSet.delete(key);
  const link = document.querySelector(`.topic-link[data-unit="${unitId}"][data-topic="${topicId}"]`);
  if(link){
    link.classList.toggle('done', done);
    const c = link.querySelector('.check'); if(c) c.textContent = done ? '✓' : '';
  }
  updateXP();
  saveProgress();
}

function updateXP(){
  const pct = Math.round((doneSet.size/TOTAL_TOPICS)*100);
  document.getElementById('xpFill').style.width = pct+'%';
  document.getElementById('xpLabel').textContent = `${doneSet.size} / ${TOTAL_TOPICS} topics done`;
  document.getElementById('progress-bar').style.width = pct+'%';
  const hp=document.getElementById('heroProgress'); if(hp) hp.textContent = `${doneSet.size} / ${TOTAL_TOPICS} topics done`;
}

  body.innerHTML='';
  body.appendChild(tpl.content.cloneNode(true));
  const cardsWrap = document.getElementById('homeCards');

    const doneInUnit = u.topics.filter(t=>doneSet.has(u.id+'-'+t.id)).length;

}

/* ---------- LOAD TOPIC ---------- */
const oosOK = new Set();
function isOos(unitId, topicId){ const u=UNITS.find(x=>x.id===unitId); const t=u&&u.topics.find(x=>x.id===topicId); return !!(t&&t.oos); }
function skipOos(unitId, topicId){
  const i=flatOrder.findIndex(f=>f.unit===unitId&&f.topic===topicId);
  for(let j=i+1;j<flatOrder.length;j++){ if(!isOos(flatOrder[j].unit,flatOrder[j].topic)){ loadTopic(flatOrder[j].unit,flatOrder[j].topic); return; } }
  showHome();
}
function askOos(unitId, topicId){
  const old=document.getElementById('oosModal'); if(old) old.remove();
  const m=document.createElement('div'); m.id='oosModal'; m.className='oos-modal';
  m.innerHTML='<div class="oos-card" role="dialog" aria-modal="true" aria-labelledby="oosT"><div class="oos-ico">!</div><h3 id="oosT">This topic is not in your syllabus</h3><p>This topic is not part of your course syllabus (105306). It will not be asked in your exam.</p><p>But if you still want to study it, you are welcome to. Read it when you have free time.</p><div class="oos-act"><button type="button" class="neu-btn oos-skip">Skip this topic</button><button type="button" class="neu-btn oos-go">I have time, let me read</button></div></div>';
  document.body.appendChild(m);
  m.querySelector('.oos-skip').onclick=()=>{ m.remove(); skipOos(unitId,topicId); };
  m.querySelector('.oos-go').onclick=()=>{ m.remove(); oosOK.add(unitId+'-'+topicId); loadTopic(unitId,topicId); };
}
function loadTopic(unitId, topicId){
  if(isOos(unitId,topicId) && !oosOK.has(unitId+'-'+topicId)){ askOos(unitId,topicId); return; }
  const tplId = `tpl-${unitId}-${topicId}`;
  const tpl = document.getElementById(tplId);
  if(!tpl) return;
  currentUnit = unitId; currentTopic = topicId;

  const body = document.getElementById('topic-body');
  body.classList.remove('show');
  setTimeout(()=>{
    body.innerHTML='';
    body.appendChild(tpl.content.cloneNode(true));
    const hasLesson = renderLesson(body, unitId, topicId);
    wrapTables(body);
    wireQuizzes(body);
    if(!hasLesson) renderDeep(body, unitId, topicId);
    highlightAll(body);
    if(!hasLesson) renderDetail(body, unitId, topicId);
    renderPractice(body, unitId, topicId);
    buildTopicNav(body);
    if(isOos(unitId,topicId)){ const b=document.createElement('div'); b.className='oos-banner'; b.innerHTML='<b>Not in your syllabus.</b> You can skip this topic. Read it only if you have extra time.'; const t=body.querySelector('.topic-title'); if(t&&t.parentNode) t.parentNode.insertBefore(b,t.nextSibling); }
    requestAnimationFrame(()=>{ body.classList.add('show'); triggerReveal(); });
  }, 180);

  // crumb
  const u = UNITS.find(x=>x.id===unitId);
  const t = u.topics.find(x=>x.id===topicId);
  const uIdx = UNITS.indexOf(u)+1;
  document.getElementById('crumb').innerHTML = `<span class="u">UNIT ${uIdx}</span> / ${t.title}`;

  // sidebar active state + mark done (persisted to this browser)
  document.querySelectorAll('.topic-link').forEach(l=>l.classList.remove('active'));
  const activeLink = document.querySelector(`.topic-link[data-unit="${unitId}"][data-topic="${topicId}"]`);
  if(activeLink) activeLink.classList.add('active');
  updateXP();

  window.scrollTo({top:0,behavior:'smooth'});
  document.querySelector('.content-wrap')?.scrollTo?.(0,0);
  document.getElementById('main').scrollTo?.(0,0);
}

/* ---------- PREV/NEXT NAV ---------- */
function syncCompleteBtn(){
  const btn=document.getElementById('completeBtn'); if(!btn) return;
  const d=doneSet.has(currentUnit+'-'+currentTopic);
  btn.classList.toggle('is-done',d);
  btn.querySelector('.cb-txt').textContent = d ? 'Completed — tap to undo' : 'Mark as complete';
  btn.setAttribute('aria-pressed', d?'true':'false');
}
function buildTopicNav(body){
  const idx = flatOrder.findIndex(f=>f.unit===currentUnit && f.topic===currentTopic);
  const prev = flatOrder[idx-1];
  const next = flatOrder[idx+1];
  const wrap = document.createElement('div');
  wrap.className='topic-nav-wrap reveal';

  const cb = document.createElement('button');
  cb.type='button'; cb.id='completeBtn'; cb.className='complete-btn';
  cb.innerHTML='<span class="cb-ico"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span><span class="cb-txt"></span>';
  cb.addEventListener('click',()=>{ setTopicDone(currentUnit,currentTopic,!doneSet.has(currentUnit+'-'+currentTopic)); syncCompleteBtn(); });
  wrap.appendChild(cb);

  const nav = document.createElement('div');
  nav.className='topic-nav';
  const arrow='<svg class="pn-arrow" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
  const prevBtn = document.createElement('button'); prevBtn.type='button';
  prevBtn.className='pn-btn pn-prev'+(prev?'':' disabled');
  if(prev){
    const pu=UNITS.find(u=>u.id===prev.unit), pt=pu.topics.find(t=>t.id===prev.topic);
    prevBtn.innerHTML = `${arrow}<span class="pn-txt"><span class="dir">Previous</span><span class="ttl">${pt.title}</span></span>`;
    prevBtn.addEventListener('click',()=>loadTopic(prev.unit,prev.topic));
  }
  const nextBtn = document.createElement('button'); nextBtn.type='button';
  nextBtn.className='pn-btn pn-next'+(next?'':' disabled');
  if(next){
    const nu=UNITS.find(u=>u.id===next.unit), nt=nu.topics.find(t=>t.id===next.topic);
    nextBtn.innerHTML = `<span class="pn-txt"><span class="dir">Next</span><span class="ttl">${nt.title}</span></span>${arrow}`;
    nextBtn.addEventListener('click',()=>loadTopic(next.unit,next.topic));
  }
  nav.appendChild(prevBtn); nav.appendChild(nextBtn);
  wrap.appendChild(nav);
  body.appendChild(wrap);
  syncCompleteBtn();
}

/* ---------- SCROLL REVEAL ---------- */
const observer = new IntersectionObserver((entries)=>{
  entries.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('visible'); } });
},{threshold:0.1});
function triggerReveal(){
  const targets = document.querySelectorAll('.reveal:not(.visible)');
  targets.forEach(el=>observer.observe(el));
  // Safety net: some embedded WebViews / preview iframes never fire
  // IntersectionObserver correctly, which would leave content stuck at
  // opacity:0 (looking like a permanent haze). Force it visible shortly
  // after render no matter what.
  setTimeout(()=>{
    document.querySelectorAll('.reveal:not(.visible)').forEach(el=>el.classList.add('visible'));
  }, 700);
}

/* ---------- CODE HIGHLIGHTER ---------- */
const JAVA_KEYWORDS = ['abstract','assert','boolean','break','byte','case','catch','char','class','const','continue','default','do','double','else','enum','extends','final','finally','float','for','goto','if','implements','import','instanceof','int','interface','long','native','new','package','private','protected','public','return','short','static','strictfp','super','switch','synchronized','this','throw','throws','transient','try','void','volatile','while','true','false','null','var'];
function escapeHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
// Single-pass tokenizer: scans RAW source once, classifies each token, and never
// re-scans text it has already generated (avoids corrupting inserted <span> markup).
const HL_REGEX = new RegExp(
  '(\\/\\/[^\\n]*)' +                          // 1: line comment
  '|(\\/\\*[\\s\\S]*?\\*\\/)' +                  // 2: block comment
  '|("(?:[^"\\\\]|\\\\.)*")' +                   // 3: double-quoted string
  "|('(?:[^'\\\\]|\\\\.)*')" +                   // 4: single-quoted char
  '|(@[A-Za-z]+)' +                             // 5: annotation
  '|\\b(\\d+\\.?\\d*)\\b' +                      // 6: number
  '|\\b(' + JAVA_KEYWORDS.join('|') + ')\\b' +   // 7: keyword
  '|\\b([A-Z][A-Za-z0-9_]*)\\b'                 // 8: capitalized type/class name
  , 'g');
function highlightJava(raw){
  let out = '';
  let last = 0;
  let m;
  HL_REGEX.lastIndex = 0;
  while((m = HL_REGEX.exec(raw))){
    out += escapeHtml(raw.slice(last, m.index));
    const full = m[0];
    const safe = escapeHtml(full);
    if(m[1]||m[2]) out += `<span class="tok-com">${safe}</span>`;
    else if(m[3]||m[4]) out += `<span class="tok-str">${safe}</span>`;
    else if(m[5]) out += `<span class="tok-ann">${safe}</span>`;
    else if(m[6]!==undefined) out += `<span class="tok-num">${safe}</span>`;
    else if(m[7]!==undefined) out += `<span class="tok-kw">${safe}</span>`;
    else if(m[8]!==undefined) out += `<span class="tok-type">${safe}</span>`;
    else out += safe;
    last = HL_REGEX.lastIndex;
  }
  out += escapeHtml(raw.slice(last));
  return out;
}
function highlightAll(root){
  root.querySelectorAll('pre code[data-lang="java"]').forEach(block=>{
    if(block.dataset.done) return;
    block.innerHTML = highlightJava(block.textContent);
    block.dataset.done='1';
  });
  root.querySelectorAll('pre code[data-lang="bash"]').forEach(block=>{
    if(block.dataset.done) return;
    block.innerHTML = escapeHtml(block.textContent).replace(/(#.*$)/gm,'<span class="tok-com">$1</span>');
    block.dataset.done='1';
  });
}

/* ---------- RESPONSIVE TABLES ---------- */
function wrapTables(root){
  root.querySelectorAll('table.tbl').forEach(table=>{
    if(table.parentElement && table.parentElement.classList.contains('table-scroll')) return;
    const wrap = document.createElement('div');
    wrap.className = 'table-scroll';
    table.parentNode.insertBefore(wrap, table);
    wrap.appendChild(table);
  });
}

/* ---------- MINI QUIZ ---------- */
function wireQuizzes(root){
  root.querySelectorAll('[data-quiz]').forEach(q=>{
    const opts = q.querySelectorAll('.opt');
    const fb = q.querySelector('.fb');
    opts.forEach(opt=>{
      opt.addEventListener('click',()=>{
        if(opt.dataset.answered) return;
        opts.forEach(o=>o.dataset.answered='1');
        const correct = opt.dataset.correct === 'true';
        opts.forEach(o=>{
          if(o.dataset.correct==='true') o.classList.add('correct');
          else if(o===opt) o.classList.add('wrong');
        });
        fb.textContent = correct ? "✅ Correct! Nicely done." : "❌ Not quite — the right answer is highlighted above.";
        fb.classList.add('show');
      });
    });
  });
}

/* ---------- SEARCH ---------- */
document.getElementById('search').addEventListener('input', (e)=>{
  const q = e.target.value.toLowerCase().trim();
  document.querySelectorAll('.unit-block').forEach(block=>{
    let anyMatch = false;
    block.querySelectorAll('.topic-link').forEach(link=>{
      const text = link.textContent.toLowerCase();
      const match = text.includes(q);
      link.style.display = match ? 'flex' : 'none';
      if(match) anyMatch = true;
    });
    if(q){ block.classList.toggle('open', anyMatch); block.style.display = anyMatch ? '' : 'none'; }
    else { block.style.display=''; block.querySelectorAll('.topic-link').forEach(l=>l.style.display='flex'); }
  });
});

document.getElementById('resetBtn')?.addEventListener('click', ()=>{
  if(!confirm('Reset your saved progress for this course? This clears every topic marked as done on this device.')) return;
  doneSet.clear();
  try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
  document.querySelectorAll('.topic-link').forEach(l=>{ l.classList.remove('done','active'); const c=l.querySelector('.check'); if(c) c.textContent=''; });
  updateXP();
  const t = document.getElementById('saveStatusText');
  if(t) t.textContent = 'Progress reset';
  if(!currentUnit) showHome();
});

document.getElementById('menuBtn')?.addEventListener('click', ()=>{

  document.getElementById('overlay').classList.add('show');
});

document.getElementById('sidebarCloseBtn')?.addEventListener('click', closeSidebar);

document.addEventListener('keydown',(e)=>{
  if(!currentUnit) return;
  if(e.key==='ArrowRight'){ const idx=flatOrder.findIndex(f=>f.unit===currentUnit&&f.topic===currentTopic); const n=flatOrder[idx+1]; if(n) loadTopic(n.unit,n.topic); }
  if(e.key==='ArrowLeft'){ const idx=flatOrder.findIndex(f=>f.unit===currentUnit&&f.topic===currentTopic); const p=flatOrder[idx-1]; if(p) loadTopic(p.unit,p.topic); }
});
