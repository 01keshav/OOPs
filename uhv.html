tion** is the process of **exploring oneself** to find out what is right for me. A proposal is first checked on **natural acceptance** (what I really want inside) and then on **experiential validation** (does it work when I live it)."}, "u1-t3": {"tldr": "Humans need right understanding, relationship and physical facility together. Most people chase only physical facility, and that is why happiness stays missing.", "sections": [{"h": "The three requirements", "p": ["Every human being needs three things to live happily: **Right understanding** (knowing what is real and what is right), **Relationship** (living with trust and respect with other people) and **Physical facility** (food, clothes, shelter, medicine, gadgets)."], "viz": {"type": "svg", "w": 560, "h": 250, "svg": "<rect class=\"g\" x=\"10\" y=\"10\" width=\"170\" height=\"50\" rx=\"9\"/><text class=\"tb\" x=\"95.0\" y=\"31.5\" text-anchor=\"middle\">Right<\/text><text class=\"tb\" x=\"95.0\" y=\"46.5\" text-anchor=\"middle\">understanding<\/text><rect class=\"g\" x=\"10\" y=\"100\" width=\"170\" height=\"50\" rx=\"9\"/><text class=\"tb\" x=\"95.0\" y=\"129.0\" text-anchor=\"middle\">Relationship<\/text><rect class=\"g\" x=\"10\" y=\"190\" width=\"170\" height=\"50\" rx=\"9\"/><text class=\"tb\" x=\"95.0\" y=\"211.5\" text-anchor=\"middle\">Physical<\/text><text class=\"tb\" x=\"95.0\" y=\"226.5\" text-anchor=\"middle\">facility<\/text><rect class=\"g0\" x=\"380\" y=\"95\" width=\"170\" height=\"60\" rx=\"9\"/><text class=\"tb\" x=\"465.0\" y=\"121.5\" text-anchor=\"middle\">Happiness and<\/text><text class=\"tb\" x=\"465.0\" y=\"136.5\" text-anchor=\"middle\">prosperity<\/text><path class=\"w\" d=\"M180,35 L280,35 L280,125 L380,125\" marker-end=\"url(#da)\"/><path class=\"w\" d=\"M180,125 L280,125 L280,125 L380,125\" marker-end=\"url(#da)\"/><path class=\"w\" d=\"M180,215 L280,215 L280,125 L380,125\" marker-end=\"url(#da)\"/><text class=\"t\" x=\"300\" y=\"125\" text-anchor=\"middle\"><\/text>", "caption": "Happiness and prosperity need all three, not only physical facility"}}, {"h": "How are they different?", "table": {"head": ["Feature", "Right understanding / Relationship", "Physical facility"], "rows": [["Need", "For happiness", "For the body"], ["Quantity", "Cannot be counted", "Can be counted"], ["Limit", "Not limited", "Limited, needed in definite amount"], ["Duration", "Continuous", "Temporary"], ["Example", "Trust with a friend", "Mobile, food, house"]]}}, {"h": "Present education: where is the gap?", "p": ["Today we spend almost all our energy on **physical facility** (degree, job, salary). We spend **very little** on understanding and relationship. So we **earn more, but are not happier**: people are rich but depressed, connected on WhatsApp but lonely."]}, {"h": "Role of education", "p": ["The role of education is **holistic development**: to make us capable of **right understanding**, **good relationships** and **right use of physical facility**. Education + **sanskar** (values in daily living) should give a human being the ability to **live in harmony** and not just to earn."], "tip": "Common long question: \"Explain the role of education in holistic development.\" Write the three requirements with a diagram."}], "analogy": "A bike needs fuel (physical facility), a rider who knows the road (understanding) and a pillion who trusts you (relationship). A bike with only fuel and a drunk rider reaches only the hospital.", "hinglish": "Khushi ke liye teen cheezein chahiye: samajh, rishte aur suvidha. Hum sirf suvidha ke peeche daudte hain, isliye khushi door rehti hai.", "mistakes": ["Thinking physical facility alone gives happiness.", "Writing relationship as \"friendship only\"; it also includes family and society."], "remember": ["Three requirements: right understanding, relationship, physical facility", "Physical facility is limited and countable", "Understanding and relationship are for happiness", "Holistic development needs all three", "Role of education: prepare for all three"], "def": "**Holistic development** means developing **right understanding**, **relationship** with other human beings and **physical facility**, all together. **Education** should prepare us for all three, not only for physical facility."}, "u1-t4": {"tldr": "Every human being wants continuous happiness and prosperity. Happiness is a state of the Self, and prosperity is the feeling of having more than enough physical facility.", "sections": [{"h": "Happiness", "p": ["**Happiness** is a state in which I **live in harmony**: I have no conflict inside and I am **in tune with others**. We want it to be **continuous**, not for a few hours. A Saturday night party gives excitement, but excitement is **not** continuous happiness."]}, {"h": "Prosperity", "p": ["**Prosperity** is the **feeling of having or being able to have more than required physical facility**. It is a **feeling**, so a person with less money can feel prosperous, and a billionaire can feel deprived. To feel prosperous I must first know **how much is enough**.", "**Deprivation** is the opposite: feeling that **I do not have enough**, even when I have a lot."], "viz": {"type": "svg", "w": 560, "h": 250, "svg": "<circle class=\"g0\" cx=\"150\" cy=\"105\" r=\"80\"/><text class=\"tb\" x=\"150\" y=\"103\" text-anchor=\"middle\">Happiness<\/text><text class=\"tb\" x=\"150\" y=\"118\" text-anchor=\"middle\">(sukh)<\/text><circle class=\"g0\" cx=\"290\" cy=\"105\" r=\"80\"/><circle class=\"g0\" cx=\"430\" cy=\"105\" r=\"80\"/><text class=\"tb\" x=\"430\" y=\"103\" text-anchor=\"middle\">Prosperity<\/text><text class=\"tb\" x=\"430\" y=\"118\" text-anchor=\"middle\">(samriddhi)<\/text><text class=\"t\" x=\"290\" y=\"100\" text-anchor=\"middle\">Basic human<\/text><text class=\"t\" x=\"290\" y=\"115\" text-anchor=\"middle\">aspirations<\/text><text class=\"tl\" x=\"150\" y=\"205\" text-anchor=\"middle\">Feeling of being<\/text><text class=\"tl\" x=\"150\" y=\"220\" text-anchor=\"middle\">in harmony, continuously<\/text><text class=\"tl\" x=\"430\" y=\"205\" text-anchor=\"middle\">Feeling of having more<\/text><text class=\"tl\" x=\"430\" y=\"220\" text-anchor=\"middle\">than required facility<\/text>", "caption": "Two basic aspirations: happiness and prosperity"}}, {"h": "Happiness vs prosperity", "table": {"head": ["Point", "Happiness", "Prosperity"], "rows": [["Meaning", "Being in harmony continuously", "Feeling of having more than required facility"], ["Depends on", "Right understanding and relationship", "Knowing the need and producing more than that"], ["Related to", "The Self (I)", "The Body (physical facility)"], ["Wrong belief", "\"More things = more happy\"", "\"More money = prosperous\""]]}}, {"h": "Why do they go wrong today?", "p": ["We try to get **happiness from things** and **prosperity from accumulation** (more and more money). Since the **need for facility is limited**, but the **desire for accumulation is unlimited**, we never feel prosperous. This is the root of the **rat race**."], "warn": "Do not define prosperity as \"having a lot of money\". The key word is the FEELING of having more than required facility."}], "analogy": "Two friends have Rs 500. One says \"I can eat out and still save some\" and feels prosperous. The other says \"everyone has a car, I have nothing\" and feels poor. The money is the same; the feeling is different.", "hinglish": "Do basic aspirations hain: sukh (khushi) jo continuous ho, aur samriddhi, yaani ye feeling ki mere paas zaroorat se zyada suvidha hai.", "mistakes": ["Taking excitement or fun as continuous happiness.", "Defining prosperity as only the amount of money or property."], "remember": ["Two basic aspirations: happiness and prosperity", "Happiness = living in harmony, continuous", "Prosperity = feeling of having more than required facility", "Need for facility is limited, desire to accumulate is unlimited", "Deprivation = feeling of not having enough"], "def": "**Basic human aspirations** are the two things everyone wants: **continuous happiness** (being in a state of harmony, all the time) and **prosperity** (the **feeling** of having **more than needed** physical facility)."}, "u1-t5": {"tldr": "Human consciousness means living with right understanding, relationship and physical facility. Animal consciousness means living only for the needs of the body.", "sections": [{"h": "What is consciousness?", "p": ["**Consciousness** is the ability to be **aware**: to know, to want, to think. In human beings consciousness shows up as **desire, thought and expectation** (the activities of the Self), and the ability to **understand**."]}, {"h": "Animal consciousness vs human consciousness", "p": ["An animal lives to fulfil the **needs of its body** in a **fixed pattern**. A human being has these needs **and also** needs happiness, relationships and understanding. If a human lives only for body needs, it is called **living with animal consciousness**."], "viz": {"type": "svg", "w": 560, "h": 230, "svg": "<rect class=\"g0\" x=\"10\" y=\"30\" width=\"250\" height=\"170\" rx=\"9\"/><text class=\"tb\" x=\"135.0\" y=\"119.0\" text-anchor=\"middle\"><\/text><text class=\"tb\" x=\"135\" y=\"52\" text-anchor=\"middle\">ANIMAL consciousness<\/text><text class=\"tl\" x=\"135\" y=\"85\" text-anchor=\"middle\">Lives for food, sleep,<\/text><text class=\"tl\" x=\"135\" y=\"100\" text-anchor=\"middle\">fear, reproduction<\/text><text class=\"tl\" x=\"135\" y=\"125\" text-anchor=\"middle\">Behaviour is fixed<\/text><text class=\"tl\" x=\"135\" y=\"140\" text-anchor=\"middle\">by instinct<\/text><text class=\"tl\" x=\"135\" y=\"165\" text-anchor=\"middle\">No question of values<\/text><rect class=\"g0\" x=\"300\" y=\"30\" width=\"250\" height=\"170\" rx=\"9\"/><text class=\"tb\" x=\"425.0\" y=\"119.0\" text-anchor=\"middle\"><\/text><text class=\"tb\" x=\"425\" y=\"52\" text-anchor=\"middle\">HUMAN consciousness<\/text><text class=\"tl\" x=\"425\" y=\"85\" text-anchor=\"middle\">Lives with right<\/text><text class=\"tl\" x=\"425\" y=\"100\" text-anchor=\"middle\">understanding<\/text><text class=\"tl\" x=\"425\" y=\"125\" text-anchor=\"middle\">Relationship + facility<\/text><text class=\"tl\" x=\"425\" y=\"140\" text-anchor=\"middle\">+ understanding<\/text><text class=\"tl\" x=\"425\" y=\"165\" text-anchor=\"middle\">Can choose and verify<\/text><path class=\"w\" d=\"M260,115 L300,115\" marker-end=\"url(#da)\"/>", "caption": "Human consciousness includes the body needs, plus understanding and relationship"}}, {"h": "Comparison table", "table": {"head": ["Point", "Animal consciousness", "Human consciousness"], "rows": [["Goal", "Physical needs", "Happiness + prosperity"], ["Basis", "Instinct", "Understanding"], ["Relationship", "Needed for survival", "Needed for trust and respect"], ["Result", "Conflict over resources", "Harmony"]]}}, {"h": "Why explore it?", "p": ["If we are **not aware** of our own consciousness we become a **machine with an alarm clock**: wake up, eat, work, scroll, sleep. By exploring our **natural acceptance** we learn what is good for us, and move from **animal consciousness** to **human consciousness**."], "tip": "Exam line: \"Human = Self + Body; living only for body = animal consciousness; living for the Self and the Body in harmony = human consciousness.\""}], "analogy": "A pet dog needs food and a bed. A human with the same needs and nothing more would be exactly like the dog, except that the dog is cuter and does not have exam stress.", "hinglish": "Insaan ki chetna ka matlab hai samajh ke saath jeena. Agar sirf khana, sona, darna aur maze ke liye jeete hain to ye animal consciousness hai.", "mistakes": ["Calling every human behaviour \"human consciousness\" even when it is only for the body.", "Forgetting that humans also have physical needs; they are included, not removed."], "remember": ["Human consciousness = living with right understanding, relationship, facility", "Animal consciousness = living only for body needs", "Human has needs of both Self and Body", "Understanding is the key difference", "Explore natural acceptance to move to human consciousness"], "def": "**Human consciousness** is the state in which a human being lives with **right understanding**, **good relationships** and **right use of physical facility**. **Animal consciousness** means living only for **physical needs** (food, sleep, fear, reproduction)."}, "u1-t6": {"tldr": "Today most of us run after money and things, but the result is stress, broken relationships and a damaged environment. This is the current scenario at four levels.", "sections": [{"h": "Present beliefs", "p": ["We think happiness comes from **more money**, **more things** and **a better position**. So we **accumulate** and **compare**. Since our desire to accumulate has **no limit**, we **never feel prosperous**."]}, {"h": "The result at four levels", "table": {"head": ["Level", "Symptoms today", "Reason"], "rows": [["Individual", "Stress, depression, loneliness, addiction, suicides", "Lack of right understanding"], ["Family", "Fights, distrust, divorces, generation gap", "Lack of trust and respect"], ["Society", "Corruption, violence, terrorism, communal tension", "Lack of justice, undivided society"], ["Nature", "Pollution, global warming, loss of species", "Exploiting nature for accumulation"]]}}, {"h": "Look at the trend", "p": ["**Wealth, technology and population have grown**, but **peace and trust have not**. Examples: **terrorism**, **drugs**, **pollution**, **breaking of joint families**, **exam stress**. These are signs of a **fragmented** way of living."], "viz": {"type": "chain", "items": ["Wrong belief: things = happiness", "Accumulation without limit", "Competition and exploitation", "Stress, conflict, pollution"], "labels": null, "caption": "How the wrong belief becomes the problems of today"}}, {"h": "Is technology the problem?", "p": ["No. **Technology is only a tool.** Problems arise when we use it **without right understanding**, only for profit and accumulation. A mobile phone can link a family or break it; the **choice** is ours."], "warn": "Do not blame technology or science directly in the exam. Blame the lack of right understanding behind how we use them."}], "analogy": "An all-you-can-eat buffet. You pay once and eat until you feel bad (more and more), but you feel happy only for the first plate. Our society is stuck on the third plate.", "hinglish": "Aaj ke samay me dhan, technology sab badha, par tension, rishton me doori aur pollution bhi badha. Wajah hai galat samajh: \"zyada cheezein = zyada khushi\".", "mistakes": ["Blaming only science and technology.", "Writing problems only at the individual level and not at all four levels."], "remember": ["Wrong belief: accumulation gives happiness", "Problems at individual, family, society and nature levels", "Technology is a tool; the user needs right understanding", "Result: stress, conflict, injustice, pollution", "Need: shift from fragmented to holistic living"], "def": "The **current scenario** shows that **happiness is missing** at every level: **individual** (stress, depression), **family** (conflict, divorce), **society** (violence, injustice) and **nature** (pollution, resource depletion), because we work only for physical facility."}, "u1-t7": {"tldr": "To fulfil the aspirations we must understand harmony at all four levels (self, family, society, nature) and live accordingly, by right understanding, right feeling and right use of physical facility.", "sections": [{"h": "What is needed?", "p": ["**Right understanding** of myself, of other human beings and of nature. This understanding gives **right feeling** (trust, respect, affection...) and a clear idea of **how much physical facility is needed**."], "viz": {"type": "chain", "items": ["Right understanding", "Right feelings and relationships", "Right use of physical facility", "Continuous happiness + prosperity"], "labels": null, "caption": "Method: from understanding to living"}}, {"h": "Four levels of living", "p": ["**Level 1: Self** (the human being). **Level 2: Family** (the first group). **Level 3: Society** (larger groups). **Level 4: Nature / Existence** (the whole). Harmony must be understood and lived at **all four** levels."], "viz": {"type": "svg", "w": 560, "h": 300, "svg": "<circle class=\"g0\" cx=\"280\" cy=\"150\" r=\"140\"/><circle class=\"g0\" cx=\"280\" cy=\"150\" r=\"105\"/><circle class=\"g0\" cx=\"280\" cy=\"150\" r=\"70\"/><circle class=\"g0\" cx=\"280\" cy=\"150\" r=\"35\"/><text class=\"tb\" x=\"280\" y=\"154\" text-anchor=\"middle\">Self<\/text><text class=\"t\" x=\"280\" y=\"102\" text-anchor=\"middle\">Family<\/text><text class=\"t\" x=\"280\" y=\"67\" text-anchor=\"middle\">Society<\/text><text class=\"t\" x=\"280\" y=\"32\" text-anchor=\"middle\">Nature / Existence<\/text><text class=\"tb\" x=\"460\" y=\"70\" text-anchor=\"middle\">Four levels<\/text><text class=\"tb\" x=\"460\" y=\"85\" text-anchor=\"middle\">of living<\/text><text class=\"tl\" x=\"460\" y=\"100\" text-anchor=\"middle\">(Self, Family,<\/text><text class=\"tl\" x=\"460\" y=\"115\" text-anchor=\"middle\">Society, Nature)<\/text>", "caption": "The four levels of living"}}, {"h": "Current vs the desired way", "table": {"head": ["Point", "Current way", "Desired way"], "rows": [["Belief", "Happiness through things", "Happiness through harmony"], ["Focus", "Physical facility only", "Understanding + relationship + facility"], ["Relation with others", "Competition", "Cooperation, trust"], ["Relation with nature", "Exploitation", "Mutual fulfilment"]]}}, {"h": "How do we start?", "p": ["Start with **self-exploration** (natural acceptance and experiential validation), then **work on understanding**, then **live it** in family, society and with nature. Change begins with the individual, but it must reach all four levels."], "tip": "The whole syllabus of this subject is just this method. Units 2 to 4 explain harmony at the four levels, and Units 5 and 6 apply it to the profession."}], "analogy": "Your phone has Wi-Fi, mobile data, Bluetooth and GPS. If only one works, the phone is half useful. Harmony works at all four levels together; only then we feel fully connected.", "hinglish": "Tareeka simple hai: self, family, society aur nature, chaaron level par harmony samjho aur usi ke hisaab se jeeyo. Isse khushi aur samriddhi dono milti hain.", "mistakes": ["Trying to be harmonious at one level only (e.g. with friends but not with family or nature).", "Thinking right understanding alone is enough without living it."], "remember": ["Method: understand harmony at four levels and live accordingly", "Four levels: self, family, society, nature/existence", "Understanding gives right feelings and right facility use", "Self-exploration is the starting point", "Aim: continuous happiness and prosperity"], "def": "The **method to fulfil basic human aspirations** is: **understand harmony at all four levels of living** (in myself, in family, in society and in nature/existence) and **live in accordance** with this understanding."}, "u2-t1": {"tldr": "A human being is not only the body. A human being is the co-existence of the conscious Self (I) and the material Body, and both have their own needs.", "sections": [{"h": "Who am I?", "p": ["When we say \"**I**\" we usually mean the body: my height, my weight, my face. But when we say \"**my body**\" we treat the body as something **owned by I**. So \"I\" and \"body\" are **different**: I am the **Self**, the one who **sees, wants and understands**; the body is the **instrument** I use."]}, {"h": "Self and Body", "p": ["The **Self** is **conscious**: it has the activities of **desire, thought, expectation, understanding and realization**. The **Body** is **material**: it has activities such as **breathing, digestion, growth**. When the Self leaves, the body remains but does **not feel or know**."], "viz": {"type": "svg", "w": 560, "h": 230, "svg": "<rect class=\"g0\" x=\"20\" y=\"50\" width=\"200\" height=\"130\" rx=\"9\"/><text class=\"tb\" x=\"120.0\" y=\"119.0\" text-anchor=\"middle\"><\/text><text class=\"tb\" x=\"120\" y=\"75\" text-anchor=\"middle\">SELF (I)<\/text><text class=\"tl\" x=\"120\" y=\"105\" text-anchor=\"middle\">Conscious, sentient<\/text><text class=\"tl\" x=\"120\" y=\"125\" text-anchor=\"middle\">Desires, thinks, expects,<\/text><text class=\"tl\" x=\"120\" y=\"142\" text-anchor=\"middle\">understands, is happy<\/text><text class=\"tl\" x=\"120\" y=\"164\" text-anchor=\"middle\">Needs: happiness<\/text><rect class=\"g0\" x=\"340\" y=\"50\" width=\"200\" height=\"130\" rx=\"9\"/><text class=\"tb\" x=\"440.0\" y=\"119.0\" text-anchor=\"middle\"><\/text><text class=\"tb\" x=\"440\" y=\"75\" text-anchor=\"middle\">BODY<\/text><text class=\"tl\" x=\"440\" y=\"105\" text-anchor=\"middle\">Material, physico-chemical<\/text><text class=\"tl\" x=\"440\" y=\"125\" text-anchor=\"middle\">Eats, breathes, moves,<\/text><text class=\"tl\" x=\"440\" y=\"142\" text-anchor=\"middle\">grows, ages<\/text><text class=\"tl\" x=\"440\" y=\"164\" text-anchor=\"middle\">Needs: physical facility<\/text><path class=\"w hi\" d=\"M220,90 L340,90\" marker-end=\"url(#da)\"/><path class=\"w hi\" d=\"M340,140 L220,140\" marker-end=\"url(#da)\"/><text class=\"tl\" x=\"280\" y=\"82\" text-anchor=\"middle\">instructs<\/text><text class=\"tl\" x=\"280\" y=\"160\" text-anchor=\"middle\">feeds back<\/text>", "caption": "A human being = Self (I) + Body, with mutual exchange between the two"}}, {"h": "Difference between Self and Body", "table": {"head": ["Point", "Self (I)", "Body"], "rows": [["Nature", "Conscious (sentient)", "Material (insentient)"], ["Activities", "Desire, thought, expectation, understanding", "Eating, breathing, moving, growing"], ["Needs", "Happiness, trust, respect", "Food, clothes, shelter, medicine"], ["Needs are", "Continuous, qualitative", "Temporary, quantitative"]]}}, {"h": "Co-existence", "p": ["The Self and the Body **exist together** and **act together**: the Self wants and the body does. If there is a **gap** between what I want and what the body does, there is **disharmony**. The aim of this unit is to make both **work in harmony**."], "tip": "Easy line for the exam: \"Human being = I (Self) + Body. I is conscious and decides; Body is material and acts.\""}], "analogy": "A driver and a car. The car (body) has an engine and tyres; the driver (Self) decides the direction. A car without a driver is useless; a driver without a car cannot reach anywhere.", "hinglish": "Insaan = Self (main) + Body (jism). Self chetan hai, body jad hai. Dono saath rehte hain aur dono ki alag zarooratein hain.", "mistakes": ["Saying \"I am the body\" (I am 70 kg). The body is 70 kg, not I.", "Thinking the Self is only the mind or brain."], "remember": ["Human being = Self (I) + Body", "Self is conscious; body is material", "Self has desire, thought, expectation, understanding", "Needs of Self: happiness; needs of body: physical facility", "Co-existence: both act together"], "def": "A **human being** is the **co-existence of the Self (I) and the Body**. The **Self** is the **conscious** part (the one who desires, thinks, understands and is happy). The **Body** is the **material** part (made of physico-chemical elements)."}, "u2-t2": {"tldr": "The Self needs happiness; the Body needs physical facility. We often try to fulfil the Self's need with physical things, and that is why we remain unhappy.", "sections": [{"h": "What does the Self need?", "p": ["The Self needs **happiness**, which comes from **right understanding**, **trust**, **respect** and **healthy relationships**. These are **not material**, cannot be counted, and are needed **continuously**."]}, {"h": "What does the Body need?", "p": ["The Body needs **physical facility** (food, clothes, shelter, medicine, equipment). These are **material**, **quantifiable** (can be counted) and needed **for a limited time and in limited amount**. Too much food does not make the body healthier; it makes it sick."], "viz": {"type": "svg", "w": 560, "h": 240, "svg": "<rect class=\"g0\" x=\"10\" y=\"10\" width=\"240\" height=\"40\" rx=\"9\"/><text class=\"tb\" x=\"130.0\" y=\"34.0\" text-anchor=\"middle\">NEEDS OF SELF (I)<\/text><rect class=\"g0\" x=\"310\" y=\"10\" width=\"240\" height=\"40\" rx=\"9\"/><text class=\"tb\" x=\"430.0\" y=\"34.0\" text-anchor=\"middle\">NEEDS OF BODY<\/text><rect class=\"g\" x=\"10\" y=\"66\" width=\"240\" height=\"32\" rx=\"9\"/><text class=\"tb\" x=\"130.0\" y=\"86.0\" text-anchor=\"middle\">Happiness (sukh)<\/text><rect class=\"g\" x=\"10\" y=\"106\" width=\"240\" height=\"32\" rx=\"9\"/><text class=\"tb\" x=\"130.0\" y=\"126.0\" text-anchor=\"middle\">Trust and respect<\/text><rect class=\"g\" x=\"10\" y=\"146\" width=\"240\" height=\"32\" rx=\"9\"/><text class=\"tb\" x=\"130.0\" y=\"166.0\" text-anchor=\"middle\">Right understanding<\/text><rect class=\"g\" x=\"10\" y=\"186\" width=\"240\" height=\"32\" rx=\"9\"/><text class=\"tb\" x=\"130.0\" y=\"206.0\" text-anchor=\"middle\">Relationship<\/text><rect class=\"g\" x=\"310\" y=\"66\" width=\"240\" height=\"32\" rx=\"9\"/><text class=\"tb\" x=\"430.0\" y=\"86.0\" text-anchor=\"middle\">Food and water<\/text><rect class=\"g\" x=\"310\" y=\"106\" width=\"240\" height=\"32\" rx=\"9\"/><text class=\"tb\" x=\"430.0\" y=\"126.0\" text-anchor=\"middle\">Clothes<\/text><rect class=\"g\" x=\"310\" y=\"146\" width=\"240\" height=\"32\" rx=\"9\"/><text class=\"tb\" x=\"430.0\" y=\"166.0\" text-anchor=\"middle\">Shelter<\/text><rect class=\"g\" x=\"310\" y=\"186\" width=\"240\" height=\"32\" rx=\"9\"/><text class=\"tb\" x=\"430.0\" y=\"206.0\" text-anchor=\"middle\">Medicine, gadgets<\/text><text class=\"tb\" x=\"280\" y=\"120\" text-anchor=\"middle\">vs<\/text>", "caption": "Needs of the Self and the Body are different"}}, {"h": "Comparison", "table": {"head": ["Point", "Needs of Self", "Needs of Body"], "rows": [["Example", "Trust, respect, happiness", "Food, clothes, house"], ["Nature", "Non-material", "Material"], ["Measurement", "Not countable", "Countable"], ["Duration", "Continuous", "Temporary"], ["Fulfilled by", "Understanding, relationship", "Physical facility"]]}}, {"h": "The common mistake", "p": ["We try to **fulfil the Self's need (happiness) through physical things** (buying, eating, shopping, binge-watching). The thing gives **temporary pleasure through the body**, which fades, and then we **buy more**. This confusion is the root of our dissatisfaction."], "warn": "Writing \"happiness comes from physical facility\" is the most common wrong statement in this subject."}], "analogy": "You are sad because your best friend ignored you (need of Self). You eat a pizza (need of Body). The stomach is full, the heart is still empty, and you now have both sadness and acidity.", "hinglish": "Self ko khushi chahiye (samajh, bharosa, izzat), body ko suvidha chahiye (khana, kapde, ghar). Dukh me pizza kha lene se dukh nahi jaata, bas pizza jaata hai.", "mistakes": ["Mixing the two needs and filling the Self's need with physical things.", "Saying body needs are unlimited; they are limited and countable."], "remember": ["Self needs happiness; body needs physical facility", "Needs of Self: continuous, non-material", "Needs of Body: temporary, material, countable", "Mistake: trying to get happiness from things", "Right understanding separates the two"], "def": "The **need of the Self** is **happiness** (sukh), and the **need of the Body** is **physical facility** (suvidha). They are **different**, so one cannot be fulfilled by the other's means."}, "u2-t3": {"tldr": "The Self is the seer, doer and enjoyer; the Body is only the instrument through which the Self sees, acts and enjoys.", "sections": [{"h": "Seer, doer, enjoyer", "p": ["**Seer**: the Self *knows* and *understands*; eyes only receive light. **Doer**: the Self *decides* and the body acts. **Enjoyer**: the Self *feels* happiness or sadness; the body only senses the touch, taste, etc."], "viz": {"type": "svg", "w": 560, "h": 230, "svg": "<rect class=\"g\" x=\"190\" y=\"10\" width=\"180\" height=\"44\" rx=\"9\"/><text class=\"tb\" x=\"280.0\" y=\"28.5\" text-anchor=\"middle\">SELF (I)<\/text><text class=\"tb\" x=\"280.0\" y=\"43.5\" text-anchor=\"middle\">Seer, Doer, Enjoyer<\/text><rect class=\"g\" x=\"190\" y=\"150\" width=\"180\" height=\"44\" rx=\"9\"/><text class=\"tb\" x=\"280.0\" y=\"168.5\" text-anchor=\"middle\">BODY<\/text><text class=\"tb\" x=\"280.0\" y=\"183.5\" text-anchor=\"middle\">Instrument<\/text><path class=\"w hi\" d=\"M240,54 L240,150\" marker-end=\"url(#da)\"/><path class=\"w hi\" d=\"M320,150 L320,54\" marker-end=\"url(#da)\"/><text class=\"tl\" x=\"150\" y=\"95\" text-anchor=\"end\">Desire, thought,<\/text><text class=\"tl\" x=\"150\" y=\"110\" text-anchor=\"end\">decision<\/text><text class=\"tl\" x=\"380\" y=\"95\" text-anchor=\"start\">Sensations,<\/text><text class=\"tl\" x=\"380\" y=\"110\" text-anchor=\"start\">feedback<\/text><rect class=\"g0\" x=\"10\" y=\"160\" width=\"150\" height=\"30\" rx=\"9\"/><text class=\"t\" x=\"85.0\" y=\"179.0\" text-anchor=\"middle\">Eyes, ears, hands<\/text><rect class=\"g0\" x=\"400\" y=\"160\" width=\"150\" height=\"30\" rx=\"9\"/><text class=\"t\" x=\"475.0\" y=\"179.0\" text-anchor=\"middle\">Organs, muscles<\/text>", "caption": "The Self instructs, the Body carries out and sends feedback"}}, {"h": "How the body acts as an instrument", "p": ["The Self **desires to read**; the **eyes and hands** do the reading. The Self **decides to speak**; the **tongue** speaks. The body has **no intention** of its own, it just follows. When the Self gives wrong instructions (anger), the body does wrong actions (shouting)."], "table": {"head": ["Self decides", "Body performs"], "rows": [["I want to learn", "Eyes read, hands write"], ["I want to help", "Legs walk, hands lift"], ["I am angry", "Face turns red, voice rises"], ["I feel hungry", "Hands feed the mouth"]]}}, {"h": "Identification with the body", "p": ["When I identify myself as the body (\"I am fat\", \"I am handsome\"), I **start living for the body**: only looks, comfort, brand. This creates **dissatisfaction**, since the body is **only a means**, not the purpose."], "warn": "Do not write \"body is useless\". Body is important, but as an instrument; its care is the Self's responsibility."}, {"h": "Importance", "p": ["Once I understand this, I take **responsibility for the body** (health, diet, exercise), without **becoming obsessed** with it. This is the basis of **self-regulation and health** (the last topic of this unit)."]}], "analogy": "A pen and a writer. The pen (body) cannot write a poem by itself. The poet (Self) decides what to write. Care for the pen, but do not worship the pen.", "hinglish": "Self dekhne wala, karne wala aur anand lene wala hai. Body sirf upkaran (instrument) hai. Body care zaroori hai par body ke liye jeena galat.", "mistakes": ["Believing the body decides on its own (e.g. \"my hands did it\").", "Neglecting the body completely, saying it is only an instrument."], "remember": ["Self = seer, doer, enjoyer", "Body = instrument of the Self", "Body follows the Self's instruction", "Identification with body causes dissatisfaction", "Self is responsible for body care"], "def": "The **Body is an instrument of the Self**. The **Self** is the **seer** (the one who sees and knows), the **doer** (the one who decides and wills) and the **enjoyer** (the one who feels happy or unhappy). The Body only **carries out** the Self's decisions."}, "u2-t4": {"tldr": "Harmony in the Self means my desires, thoughts and expectations are in line with my natural acceptance. Conflict inside is the main source of unhappiness.", "sections": [{"h": "Activities of the Self", "p": ["The Self has three activities in its **imagination**: **Desire** (what I want), **Thought** (what I think and analyse) and **Expectation** (what I choose and expect from myself and others). Beyond these, the Self has **natural acceptance** and the capacity for **realization and understanding**."], "viz": {"type": "svg", "w": 560, "h": 260, "svg": "<rect class=\"g0\" x=\"180\" y=\"10\" width=\"200\" height=\"44\" rx=\"9\"/><text class=\"tb\" x=\"280.0\" y=\"28.5\" text-anchor=\"middle\">Natural acceptance<\/text><text class=\"tb\" x=\"280.0\" y=\"43.5\" text-anchor=\"middle\">(what I really want)<\/text><rect class=\"g\" x=\"20\" y=\"110\" width=\"150\" height=\"60\" rx=\"9\"/><text class=\"tb\" x=\"95.0\" y=\"136.5\" text-anchor=\"middle\">Desire<\/text><text class=\"tb\" x=\"95.0\" y=\"151.5\" text-anchor=\"middle\">(chaah)<\/text><rect class=\"g\" x=\"205\" y=\"110\" width=\"150\" height=\"60\" rx=\"9\"/><text class=\"tb\" x=\"280.0\" y=\"136.5\" text-anchor=\"middle\">Thought<\/text><text class=\"tb\" x=\"280.0\" y=\"151.5\" text-anchor=\"middle\">(vichar)<\/text><rect class=\"g\" x=\"390\" y=\"110\" width=\"150\" height=\"60\" rx=\"9\"/><text class=\"tb\" x=\"465.0\" y=\"136.5\" text-anchor=\"middle\">Expectation<\/text><text class=\"tb\" x=\"465.0\" y=\"151.5\" text-anchor=\"middle\">(ichchha)<\/text><path class=\"w\" d=\"M95,110 L95,80 L180,80\" stroke-dasharray=\"4 5\"/><path class=\"w\" d=\"M280,110 L280,54\" stroke-dasharray=\"4 5\"/><path class=\"w\" d=\"M465,110 L465,80 L380,80\" stroke-dasharray=\"4 5\"/><path class=\"w\" d=\"M170,140 L205,140\" marker-end=\"url(#da)\"/><path class=\"w\" d=\"M355,140 L390,140\" marker-end=\"url(#da)\"/><rect class=\"g0\" x=\"180\" y=\"205\" width=\"200\" height=\"40\" rx=\"9\"/><text class=\"tb\" x=\"280.0\" y=\"229.0\" text-anchor=\"middle\">Harmony = all three agree<\/text><path class=\"w hi\" d=\"M280,170 L280,205\" marker-end=\"url(#da)\"/>", "caption": "Harmony in the Self: desire, thought and expectation aligned with natural acceptance"}}, {"h": "Conflict vs harmony", "p": ["**Conflict**: I desire to relax but think about exams and expect 90 marks. All three pull in different directions and I feel **stressed**. **Harmony**: I desire, think and expect the same thing (e.g., study now, rest later) and feel **peaceful**."], "table": {"head": ["State", "Desire", "Thought", "Expectation", "Result"], "rows": [["Conflict", "Party", "Study", "Topper", "Stress"], ["Harmony", "Study now", "Study now", "Pass well", "Peace"]]}}, {"h": "How do we get harmony?", "p": ["(1) Understand **natural acceptance**: what do I really want? (2) Check whether my **desires, thoughts and expectations** match it. (3) **Change** the wrong ones by **right understanding**. This is a **continuous process** of self-observation."]}, {"h": "Ignoring natural acceptance", "p": ["If we **ignore** our natural acceptance (e.g., we know that cheating is wrong, yet we do it), we feel **guilt and tension**. Pre-conditioning (peer pressure, advertisement, tradition) often **overrides** it."], "tip": "When asked \"What is harmony in the Self?\" write: \"desire = thought = expectation, all in line with natural acceptance\"."}], "analogy": "Three friends planning a trip: one wants a beach, one wants the mountains, one wants to stay home. The trip never happens and everyone is angry. Harmony in the Self is when all three friends inside you agree on one plan.", "hinglish": "Self me harmony tab hai jab chaah, vichar aur ichchha teeno natural acceptance ke saath ek hi disha me hon. Teeno alag ho to tension.", "mistakes": ["Confusing natural acceptance with desire, which keeps changing.", "Thinking harmony means having no desires."], "remember": ["Harmony in Self = desire, thought, expectation aligned with natural acceptance", "Conflict inside = stress", "Natural acceptance is stable; desires change", "Process: observe, compare, correct", "Pre-conditioning can override natural acceptance"], "def": "**Harmony in the Self** means that the **imagination** of the Self (**desire, thoughts, expectations**) is **in line with natural acceptance** and right understanding, so there is **no conflict inside**."}, "u2-t5": {"tldr": "Harmony of the Self with the Body means the Self takes responsibility for the body (self-regulation, sanyam) and the body is healthy (swasthya), acting as a good instrument.", "sections": [{"h": "Self-regulation (Sanyam)", "p": ["**Self-regulation** means the Self **feels responsible** for the body. It has **three parts**: **Nurturing** (giving proper food, rest, exercise), **Protection** (saving it from injury, disease, extremes of weather) and **Right utilization** (using the body for useful, good work, not for harmful things)."], "viz": {"type": "svg", "w": 560, "h": 260, "svg": "<rect class=\"g0\" x=\"190\" y=\"10\" width=\"180\" height=\"44\" rx=\"9\"/><text class=\"tb\" x=\"280.0\" y=\"28.5\" text-anchor=\"middle\">SELF (I)<\/text><text class=\"tb\" x=\"280.0\" y=\"43.5\" text-anchor=\"middle\">takes responsibility<\/text><rect class=\"g\" x=\"10\" y=\"110\" width=\"160\" height=\"50\" rx=\"9\"/><text class=\"tb\" x=\"90.0\" y=\"131.5\" text-anchor=\"middle\">Sanyam<\/text><text class=\"tb\" x=\"90.0\" y=\"146.5\" text-anchor=\"middle\">(self-regulation)<\/text><rect class=\"g\" x=\"390\" y=\"110\" width=\"160\" height=\"50\" rx=\"9\"/><text class=\"tb\" x=\"470.0\" y=\"131.5\" text-anchor=\"middle\">Swasthya<\/text><text class=\"tb\" x=\"470.0\" y=\"146.5\" text-anchor=\"middle\">(health)<\/text><path class=\"w\" d=\"M190,40 L90,40 L90,110\" marker-end=\"url(#da)\"/><path class=\"w\" d=\"M370,40 L470,40 L470,110\" marker-end=\"url(#da)\"/><path class=\"w hi\" d=\"M170,135 L390,135\" marker-end=\"url(#da)\"/><text class=\"tl\" x=\"280\" y=\"128\" text-anchor=\"middle\">leads to<\/text><rect class=\"g0\" x=\"10\" y=\"195\" width=\"160\" height=\"50\" rx=\"9\"/><text class=\"tl\" x=\"90.0\" y=\"209.0\" text-anchor=\"middle\">Nurturing<\/text><text class=\"tl\" x=\"90.0\" y=\"224.0\" text-anchor=\"middle\">Protection<\/text><text class=\"tl\" x=\"90.0\" y=\"239.0\" text-anchor=\"middle\">Right use<\/text><rect class=\"g0\" x=\"390\" y=\"195\" width=\"160\" height=\"50\" rx=\"9\"/><text class=\"tl\" x=\"470.0\" y=\"216.5\" text-anchor=\"middle\">Body fit and<\/text><text class=\"tl\" x=\"470.0\" y=\"231.5\" text-anchor=\"middle\">acting as instrument<\/text><path class=\"w\" d=\"M90,160 L90,195\" marker-end=\"url(#da)\"/><path class=\"w\" d=\"M470,160 L470,195\" marker-end=\"url(#da)\"/>", "caption": "Sanyam (self-regulation) leads to Swasthya (health)"}}, {"h": "Health (Swasthya)", "p": ["**Health** means the **body is fit** and **performs its role** as the Self's instrument properly. Its signs: all **organs work properly**, there is **no abnormal pain**, and the body **responds to the Self's will**. Health is also a **feeling**: the Self feels **free of worry about the body**."]}, {"h": "Tests of harmony", "p": ["Two simple questions: (1) **Am I feeling responsible** for my body (food, sleep, exercise)? (2) **Is my body healthy** and doing what I want it to do? If both answers are \"yes\", **Self and body are in harmony**."], "table": {"head": ["Question", "Self-regulation", "Health"], "rows": [["Who?", "Self (feeling of responsibility)", "Body (fitness)"], ["What?", "Nurture, protect, right use", "Fit, functioning well"], ["Result", "Control of habits", "Energy, no disease"], ["Sign", "Eat only what is needed", "Active, light body"]]}}, {"h": "Programme for self-regulation", "p": ["**Nurturing**: need-based diet (aahar), **exercise** (vihar), **rest**, cleanliness. **Protection**: clothing, shelter, **medical care**, avoiding addiction. **Right utilization**: **productive work**, **helping others**, no abuse of the body (no vaping, no all-nighters)."], "tip": "In the exam, list the three words: Nurturing, Protection, Right utilization, and give one example each."}, {"h": "Common problems", "p": ["**Junk food**, late nights, addiction to screens, **skipping exercise**, extreme dieting or overeating are **failures of sanyam**. They give **temporary pleasure** and then **long-term disease**."], "warn": "Self-regulation is NOT torturing the body. It is **responsible care**, neither neglect nor obsession."}], "analogy": "A vehicle owner who services the bike on time (nurturing), keeps it in the garage during rain (protection) and uses it to go to work, not to race on the highway (right utilization). The bike stays healthy and the owner stays happy.", "hinglish": "Self ki zimmedari hai body ke liye: sahi khana (poshan), bachav (suraksha) aur sahi upyog. Isse body swasth rehti hai aur Self ko chinta nahi hoti.", "mistakes": ["Treating self-regulation as punishing the body.", "Saying health = no disease only. Health includes fitness and response to the Self."], "remember": ["Sanyam = responsibility of the Self for the body", "Three parts: nurturing, protection, right utilization", "Swasthya = body fit and acts as instrument", "Harmony test: responsibility + health", "Avoid addiction, junk food, bad routine"], "def": "**Harmony of the Self with the Body** is achieved by the **programme of self-regulation (sanyam) and health (swasthya)**. **Sanyam** is the Self's **responsibility** for the **nurturing, protection and right utilization** of the body. **Swasthya** is the body being **fit** and acting as an **instrument** of the Self."}, "u3-t1": {"tldr": "The family is the first place where we learn to live with other human beings. Harmony starts here, through right feelings in relationships.", "sections": [{"h": "Why the family?", "p": ["A child learns **language, habits, feelings and values** in the family. It is where we first experience **relationship**. If the family is in harmony, the individual is **stable**, and if the family is fragmented, the individual feels **insecure**. The **society is made of families**, so the **harmony of society** begins at home."], "viz": {"type": "svg", "w": 560, "h": 230, "svg": "<circle class=\"g0\" cx=\"280\" cy=\"115\" r=\"46\"/><text class=\"tb\" x=\"280\" y=\"119\" text-anchor=\"middle\">Family<\/text><path class=\"w\" d=\"M236.7741394438482,130.73292659298076 L176.63381171355007,142.3616114660535\" marker-end=\"url(#da)\"/><rect class=\"g\" x=\"136.63381171355007\" y=\"125.36161146605349\" width=\"80\" height=\"34\" rx=\"9\"/><text class=\"t\" x=\"176.63381171355007\" y=\"146.3616114660535\" text-anchor=\"middle\">Respect<\/text><path class=\"w\" d=\"M280.0,161.0 L280.0,195.0\" marker-end=\"url(#da)\"/><rect class=\"g\" x=\"240.0\" y=\"178.0\" width=\"80\" height=\"34\" rx=\"9\"/><text class=\"t\" x=\"280.0\" y=\"199.0\" text-anchor=\"middle\">Trust<\/text><path class=\"w\" d=\"M323.2258605561518,130.73292659298076 L383.3661882864499,142.3616114660535\" marker-end=\"url(#da)\"/><rect class=\"g\" x=\"343.3661882864499\" y=\"125.36161146605349\" width=\"80\" height=\"34\" rx=\"9\"/><text class=\"t\" x=\"383.3661882864499\" y=\"146.3616114660535\" text-anchor=\"middle\">Care<\/text><path class=\"w\" d=\"M295.7329265929808,71.77413944384821 L317.62221576582357,39.82459033712733\" marker-end=\"url(#da)\"/><rect class=\"g\" x=\"277.62221576582357\" y=\"22.824590337127333\" width=\"80\" height=\"34\" rx=\"9\"/><text class=\"t\" x=\"317.62221576582357\" y=\"43.82459033712733\" text-anchor=\"middle\">Love<\/text><path class=\"w\" d=\"M250.4317699544192,79.76195561652702 L209.29336293448068,53.71644455048176\" marker-end=\"url(#da)\"/><rect class=\"g\" x=\"169.29336293448068\" y=\"36.71644455048176\" width=\"80\" height=\"34\" rx=\"9\"/><text class=\"t\" x=\"209.29336293448068\" y=\"57.71644455048176\" text-anchor=\"middle\">Guidance<\/text>", "caption": "A harmonious family is built on feelings such as trust, respect, care, guidance and love"}}, {"h": "Relationship is between two human beings", "p": ["A **relationship** is a **connection between two persons** based on **feelings**, not on **things**. First we need to **recognise the relationship** (e.g., son, friend, teacher) and the **feelings** that belong to it. Then we **live those feelings**. Relationships are meant for **mutual happiness**."]}, {"h": "Relationship and physical facility", "table": {"head": ["Point", "Relationship", "Physical facility"], "rows": [["Need", "Mutual happiness", "Body needs"], ["Based on", "Feelings (values)", "Things (quantity)"], ["Result", "Trust, bonding", "Comfort"], ["Wrong approach", "\"I give you a gift, so you must obey\"", "Treating people as sources of facility"]]}}, {"h": "Reasons for conflict in families", "p": ["(1) **No trust** in the intentions of others. (2) **Wrong evaluation** (not respecting, comparing, differentiating). (3) **Focus on accumulating facility** instead of **taking care of relationships**. (4) **Expecting** instead of **understanding**."], "tip": "Syllabus line: \"Harmony in the family - the basic unit of human interaction\". Write: relationship + feelings + mutual happiness + prosperity."}], "analogy": "A family is like a WhatsApp group. If everyone only forwards good-morning images and nobody actually talks, the group looks active but is dead. Harmony means real conversations.", "hinglish": "Parivaar insaani rishton ki sabse chhoti ikai hai. Yahan bharosa, samman, sneh aur dekhbhal se harmony aati hai. Samaj parivaar se hi banta hai.", "mistakes": ["Taking family harmony as \"everyone obeys the elder\".", "Thinking facilities (gifts, money) are the relationship itself."], "remember": ["Family = basic unit of human interaction", "Relationship = connection of two persons based on feelings", "Purpose: mutual happiness and mutual prosperity", "Society is made of families", "Reasons of conflict: no trust, wrong evaluation, facility focus"], "def": "**Family** is the **basic unit of human interaction**: a group of people related by **feelings (values)**, who live together to **fulfil their needs**. **Harmony in the family** means every member lives with **trust, respect, affection and care**."}, "u3-t2": {"tldr": "Trust means assuming that the other person has the intention to make me happy, and judging intention separately from competence.", "sections": [{"h": "Intention and competence", "p": ["Every person has two parts: **Intention** (what the person naturally wants: to be happy and make others happy) and **Competence** (the ability to fulfil that intention). **Intention** is always the **same in everyone** (right, according to natural acceptance), but **competence** may be **low or high**. Trust means **trusting the intention**."], "viz": {"type": "svg", "w": 560, "h": 250, "svg": "<path class=\"w\" d=\"M60,20 L60,220 L520,220\"/><text class=\"tb\" x=\"290\" y=\"245\" text-anchor=\"middle\">Competence (ability)<\/text><text class=\"tb\" x=\"62\" y=\"12\" text-anchor=\"start\">Intention<\/text><rect class=\"g0\" x=\"80\" y=\"20\" width=\"190\" height=\"90\" rx=\"9\"/><text class=\"tl\" x=\"175.0\" y=\"54.0\" text-anchor=\"middle\">Good intention<\/text><text class=\"tl\" x=\"175.0\" y=\"69.0\" text-anchor=\"middle\">Low competence<\/text><text class=\"tl\" x=\"175.0\" y=\"84.0\" text-anchor=\"middle\">help and train<\/text><rect class=\"g\" x=\"300\" y=\"20\" width=\"220\" height=\"90\" rx=\"9\"/><text class=\"tl\" x=\"410.0\" y=\"54.0\" text-anchor=\"middle\">Good intention<\/text><text class=\"tl\" x=\"410.0\" y=\"69.0\" text-anchor=\"middle\">Good competence<\/text><text class=\"tl\" x=\"410.0\" y=\"84.0\" text-anchor=\"middle\">TRUST (ideal)<\/text><rect class=\"g0\" x=\"80\" y=\"120\" width=\"190\" height=\"90\" rx=\"9\"/><text class=\"tl\" x=\"175.0\" y=\"154.0\" text-anchor=\"middle\">Bad intention<\/text><text class=\"tl\" x=\"175.0\" y=\"169.0\" text-anchor=\"middle\">Low competence<\/text><text class=\"tl\" x=\"175.0\" y=\"184.0\" text-anchor=\"middle\">avoid<\/text><rect class=\"g0\" x=\"300\" y=\"120\" width=\"220\" height=\"90\" rx=\"9\"/><text class=\"tl\" x=\"410.0\" y=\"154.0\" text-anchor=\"middle\">Bad intention<\/text><text class=\"tl\" x=\"410.0\" y=\"169.0\" text-anchor=\"middle\">Good competence<\/text><text class=\"tl\" x=\"410.0\" y=\"184.0\" text-anchor=\"middle\">danger<\/text>", "caption": "Trust is about intention; competence is something to be developed"}}, {"h": "Difference", "table": {"head": ["Point", "Intention", "Competence"], "rows": [["Meaning", "What the person wants to do", "Ability to do it"], ["Natural acceptance", "Right (same for all)", "Can be developed"], ["Judged by", "Understanding the person", "Testing, training"], ["If lacking", "Misunderstanding", "Needs practice"]]}}, {"h": "What goes wrong today?", "p": ["We **judge people by competence** (marks, skills) and then **doubt their intention**; or we **judge ourselves by intention** but **judge others by competence**. This **mismatch** creates **distrust**: \"I meant well, but you only saw the mistake.\""], "pts": ["**Self**: I assume my own good intention and ignore my competence gaps.", "**Others**: I see their mistakes and conclude bad intention."]}, {"h": "Importance of trust", "p": ["Trust is the **base of all relationships**. Without trust there is **fear, suspicion and control**; with trust there is **openness and cooperation**. Trust at home leads to **trust in society**, which leads to a **safe world**."], "tip": "A very common 5-mark question: \"What is trust? Differentiate between intention and competence.\""}, {"h": "How to develop trust", "p": ["(1) **Understand** that everyone's natural intention is right. (2) **Evaluate your own competence** honestly. (3) **Help others** improve competence, not **doubt** them. (4) **Ensure your own intention** is clean."]}], "analogy": "A new driver (competence low) wants to take mom to the temple safely (intention good). Mom does not call him a murderer; she says \"slowly beta\". That is trust in intention, helping with competence.", "hinglish": "Bharosa matlab samne wale ki neeyat par yakeen (ki wo meri khushi chahta hai). Neeyat aur kabiliyat alag hain. Kabiliyat badh sakti hai, neeyat sab ki sahi hai.", "mistakes": ["Mixing intention with competence: \"he failed so he does not care\".", "Judging others by competence and ourselves by intention."], "remember": ["Trust = assurance of the other's right intention", "Intention is the same for all and right", "Competence can be developed", "Foundation of all relationships", "Mismatch between self-judgement and other-judgement causes distrust"], "def": "**Trust** is the **foundational value in relationship**. It is the **assurance that the other person intends to make me happy and prosperous**. Trust is about **intention**; it is **not** about **competence**."}, "u3-t3": {"tldr": "Respect is accepting the other person as they are, because they are a human being like me. Respect is right evaluation; the opposite is over, under and otherwise evaluation.", "sections": [{"h": "Right evaluation", "p": ["To respect is to **evaluate correctly**: (1) The other person is **like me** (same natural acceptance, same intention). (2) They have **different competence**, which can be **developed**. So I give them **the same value as myself**, and **help** improve their competence."], "viz": {"type": "svg", "w": 560, "h": 230, "svg": "<rect class=\"g\" x=\"10\" y=\"40\" width=\"170\" height=\"60\" rx=\"9\"/><text class=\"tb\" x=\"95.0\" y=\"66.5\" text-anchor=\"middle\">Right evaluation<\/text><text class=\"tb\" x=\"95.0\" y=\"81.5\" text-anchor=\"middle\">= RESPECT<\/text><rect class=\"g0\" x=\"200\" y=\"10\" width=\"170\" height=\"50\" rx=\"9\"/><text class=\"tb\" x=\"285.0\" y=\"31.5\" text-anchor=\"middle\">Over-evaluation<\/text><text class=\"tb\" x=\"285.0\" y=\"46.5\" text-anchor=\"middle\">(too high)<\/text><rect class=\"g0\" x=\"200\" y=\"90\" width=\"170\" height=\"50\" rx=\"9\"/><text class=\"tb\" x=\"285.0\" y=\"111.5\" text-anchor=\"middle\">Under-evaluation<\/text><text class=\"tb\" x=\"285.0\" y=\"126.5\" text-anchor=\"middle\">(too low)<\/text><rect class=\"g0\" x=\"200\" y=\"170\" width=\"170\" height=\"50\" rx=\"9\"/><text class=\"tb\" x=\"285.0\" y=\"199.0\" text-anchor=\"middle\">Otherwise evaluation<\/text><path class=\"w\" d=\"M180,70 L200,35\" marker-end=\"url(#da)\"/><path class=\"w\" d=\"M180,70 L200,115\" marker-end=\"url(#da)\"/><path class=\"w\" d=\"M180,70 L200,195\" marker-end=\"url(#da)\"/><text class=\"tl\" x=\"470\" y=\"35\" text-anchor=\"middle\">Flattery,<\/text><text class=\"tl\" x=\"470\" y=\"50\" text-anchor=\"middle\">false praise<\/text><text class=\"tl\" x=\"470\" y=\"115\" text-anchor=\"middle\">Insult, ignoring,<\/text><text class=\"tl\" x=\"470\" y=\"130\" text-anchor=\"middle\">comparison<\/text><text class=\"tl\" x=\"470\" y=\"195\" text-anchor=\"middle\">Judging by gender,<\/text><text class=\"tl\" x=\"470\" y=\"210\" text-anchor=\"middle\">wealth, age, post<\/text>", "caption": "Respect = right evaluation; wrong evaluation can be over, under or otherwise"}}, {"h": "Wrong evaluation", "table": {"head": ["Type", "Meaning", "Example"], "rows": [["Over-evaluation", "Giving more than is true", "Flattering the boss, worshipping celebrities"], ["Under-evaluation", "Giving less than is true", "Calling a junior \"useless\""], ["Otherwise evaluation", "Judging on the wrong basis", "By gender, caste, looks, post, money"]]}}, {"h": "Respect vs differentiation", "p": ["**Differentiation** means judging people by **body, wealth, age, gender, post, religion or caste**. These are **temporary or external** and do not define the **Self**. **Respect** treats all as **equal in intention** and **different in competence only**. Differentiation leads to **exploitation, discrimination and conflict**."], "table": {"head": ["Respect", "Differentiation"], "rows": [["Based on the Self", "Based on body/post/wealth"], ["Right evaluation", "Wrong evaluation"], ["Leads to equality", "Leads to discrimination"], ["Same for all", "Changes with person"]]}}, {"h": "How respect feels", "p": ["When I am respected, I feel **secure and happy**; when I am insulted, I feel **hurt**. So **I know from natural acceptance** that everybody wants respect. **Everyone wants to be respected** and **no one likes being disrespected**, so respect must be given to all."], "tip": "Write the definition as: \"Respect = right evaluation = accepting the other as the same as me in intention, and different only in competence\"."}], "analogy": "You respect your teacher (age) and ignore the canteen uncle (post). Then the canteen uncle gives you credit for chai when you are broke, and the teacher gives you a 0. Evaluate by being human, not by designation.", "hinglish": "Samman ka matlab hai sahi mulyankan: samne wala bhi mere jaisa insaan hai. Umar, paisa, post ya jaati ke hisaab se alag dekhna differentiation hai, samman nahi.", "mistakes": ["Thinking respect means only obeying elders.", "Treating respect and differentiation as the same."], "remember": ["Respect = right evaluation", "Same natural acceptance in all; different competence", "Over, under and otherwise evaluation are wrong", "Differentiation (by body, wealth, age, caste) causes conflict", "Everyone wants respect"], "def": "**Respect** is the **right evaluation**: I accept the other person as **a human being, like myself**, who has **the same natural acceptance and the same need for happiness**. It is **not** based on body, age, post or wealth."}, "u3-t4": {"tldr": "Beside trust and respect, we have other feelings in relationships (affection, care, guidance, reverence, glory, gratitude, love). Together they make a complete relationship.", "sections": [{"h": "The feelings", "p": ["**Trust** and **respect** are the base. The other feelings follow from them."], "table": {"head": ["Feeling", "Meaning", "Example"], "rows": [["Affection", "Feeling of being responsible for the other's upbringing", "Mother and child"], ["Care", "Feeling responsible for nurturing and protecting the body of the other", "Looking after a sick friend"], ["Guidance", "Feeling of making the other understand and improving his competence", "Teacher and student"], ["Reverence", "Acceptance of excellence in the other", "Respect for a saint or mentor"], ["Glory", "Acceptance of those who are working for the good of all", "Respect for freedom fighters"], ["Gratitude", "Feeling thankful for those who helped in my development", "Thanks to parents, teachers"], ["Love", "Feeling of being related to all", "Universal love"]]}}, {"h": "Stages of feelings", "p": ["The feelings **grow** with understanding: from **trust and respect** (basic) to **affection, care, guidance** (feelings towards those who are younger or equal), **reverence, glory, gratitude** (feelings towards those who are better) and finally **love** (towards all)."], "viz": {"type": "chain", "items": ["Trust", "Respect", "Affection, Care, Guidance", "Reverence, Glory, Gratitude", "Love"], "labels": null, "caption": "From basic to universal feelings in relationships"}}, {"h": "Why do these matter?", "p": ["These feelings tell us **how to behave** in each relationship. If we **recognise** the feeling and **live** it, the relationship is **fulfilled**. If we **ignore** it (e.g., a child without gratitude), the relationship stays **empty**."]}, {"h": "Today's situation", "p": ["We **know** the formal relation (father, boss, friend) but we **do not live the feelings** that belong to it. So the relationships exist **only in name** (titles), not in **feeling**."], "tip": "For the 10-mark answer, draw the table of the 9 values and give one example for each."}], "analogy": "A restaurant menu with many dishes. Trust and respect are rice and dal (the base). Affection, care and others are the sabzis, and love is the sweet at the end. A thali without rice is not a meal.", "hinglish": "Trust aur respect ke alawa sneh, dekhbhal, margdarshan, shraddha, gaurav, kritagyata aur prem bhi rishton ki bhaavnayein hain. Inhe samjhkar jeene se rishte poore hote hain.", "mistakes": ["Learning the names but not the meaning of each feeling.", "Taking love as only the romantic feeling; here it means a feeling of relatedness to all."], "remember": ["Nine values: trust, respect, affection, care, guidance, reverence, glory, gratitude, love", "Affection = responsibility for upbringing", "Guidance = improving competence", "Reverence = acceptance of excellence", "Love = feeling of relatedness with all"], "def": "The **other feelings** in a relationship are **affection, care, guidance, reverence, glory, gratitude and love**. Along with **trust and respect** they form the **nine universal values** of human relationships."}, "u3-t5": {"tldr": "Justice is recognising the values in a relationship, fulfilling them, evaluating the fulfilment and ensuring mutual happiness.", "sections": [{"h": "What is justice?", "p": ["Justice is **a relationship between persons** that fulfils **the feelings (values) in it**, and **ensures mutual happiness**. When all four steps are done, the relationship is **just**. Justice **leads to order**; **injustice leads to conflict**."], "viz": {"type": "svg", "w": 560, "h": 160, "svg": "<rect class=\"g\" x=\"10\" y=\"50\" width=\"110\" height=\"50\" rx=\"9\"/><text class=\"tb\" x=\"65.0\" y=\"71.5\" text-anchor=\"middle\">1. Recognition<\/text><text class=\"tb\" x=\"65.0\" y=\"86.5\" text-anchor=\"middle\">of values<\/text><rect class=\"g\" x=\"150\" y=\"50\" width=\"110\" height=\"50\" rx=\"9\"/><text class=\"tb\" x=\"205.0\" y=\"71.5\" text-anchor=\"middle\">2. Fulfilment<\/text><text class=\"tb\" x=\"205.0\" y=\"86.5\" text-anchor=\"middle\">of values<\/text><rect class=\"g\" x=\"290\" y=\"50\" width=\"110\" height=\"50\" rx=\"9\"/><text class=\"tb\" x=\"345.0\" y=\"71.5\" text-anchor=\"middle\">3. Evaluation<\/text><text class=\"tb\" x=\"345.0\" y=\"86.5\" text-anchor=\"middle\">of fulfilment<\/text><rect class=\"g\" x=\"430\" y=\"50\" width=\"120\" height=\"50\" rx=\"9\"/><text class=\"tb\" x=\"490.0\" y=\"71.5\" text-anchor=\"middle\">4. Mutual<\/text><text class=\"tb\" x=\"490.0\" y=\"86.5\" text-anchor=\"middle\">happiness<\/text><path class=\"w hi\" d=\"M120,75 L150,75\" marker-end=\"url(#da)\"/><path class=\"w hi\" d=\"M260,75 L290,75\" marker-end=\"url(#da)\"/><path class=\"w hi\" d=\"M400,75 L430,75\" marker-end=\"url(#da)\"/><text class=\"tb\" x=\"280\" y=\"25\" text-anchor=\"middle\">Justice in four steps<\/text><text class=\"tl\" x=\"280\" y=\"135\" text-anchor=\"middle\">Justice -&gt; mutual happiness -&gt; trust in society<\/text>", "caption": "Four steps of justice"}}, {"h": "The four steps", "p": ["(1) **Recognition of values**: I recognise the feelings in the relationship (trust, respect, etc.). (2) **Fulfilment of values**: I **live those feelings** with the other person. (3) **Evaluation**: I **assess** whether the feelings were fulfilled, to **improve**. (4) **Mutual happiness**: the **result**, both feel happy."], "table": {"head": ["Step", "Meaning", "Example (teacher and student)"], "rows": [["Recognition", "Know the values in the relationship", "Guidance, respect, gratitude"], ["Fulfilment", "Act on those values", "Teacher explains; student listens"], ["Evaluation", "Check results", "Test, feedback"], ["Mutual happiness", "Both are satisfied", "Teacher happy, student confident"]]}}, {"h": "Justice vs the usual idea", "p": ["In the **usual** idea, justice means **punishment** or **law courts**. In **UHV**, justice is **internal**: if I **fulfil the values** in each relationship, **injustice does not arise** and there is **no need for courts**. Courts only fix what **already went wrong**."], "warn": "Do not define justice as \"punishing the guilty\". For this syllabus, justice = recognising and fulfilling values and ensuring mutual happiness."}, {"h": "Justice leads to society", "p": ["When **justice is ensured in the family**, we extend it to **society**. A society where justice prevails has **trust and order**, so **people can live peacefully** and **develop competence**. This leads to the **universal human order**."], "tip": "Learn the four words: Recognition - Fulfilment - Evaluation - Mutual happiness (R-F-E-M). It is a common 10-mark question."}], "analogy": "Group project: first you recognise that everyone has to contribute (recognition), everyone does their part (fulfilment), the teacher checks the marks and feedback (evaluation) and the whole group is happy (mutual happiness). When one person does nothing and gets full credit, that is injustice.", "hinglish": "Nyay ke 4 charan: mulya pehchano, nibhao, mulyankan karo, aur dono ki khushi sunishchit karo. Nyay saza nahi, rishte ki poorti hai.", "mistakes": ["Equating justice with punishment.", "Skipping the \"evaluation\" step in the answer."], "remember": ["Justice: recognition, fulfilment, evaluation, mutual happiness", "Justice = fulfilment of values in relationship", "Leads to order and trust", "Injustice leads to conflict", "Justice in family extends to society"], "def": "**Justice** in a human-to-human relationship consists of **four steps**: **recognition of values** (feelings), **fulfilment of values**, **evaluation of fulfilment** and **ensuring mutual happiness**. Justice is **not punishment**; it is the **feeling of mutual fulfilment**."}, "u3-t6": {"tldr": "Harmony in society means undivided society and universal human order, where the family-like trust extends to all humankind and five dimensions of human endeavour work in harmony.", "sections": [{"h": "From family to society", "p": ["The society is an **extension of the family**. **Trust, respect, affection** felt in the family are extended to the **neighbourhood, community, nation and world**. This is called **undivided society**: \"**one family of all human beings**\"."], "viz": {"type": "svg", "w": 560, "h": 230, "svg": "<rect class=\"g\" x=\"10\" y=\"40\" width=\"98\" height=\"54\" rx=\"9\"/><text class=\"t\" x=\"59.0\" y=\"71.0\" text-anchor=\"middle\">Family<\/text><path class=\"w\" d=\"M108,67 L118,67\" marker-end=\"url(#da)\"/><rect class=\"g\" x=\"118\" y=\"40\" width=\"98\" height=\"54\" rx=\"9\"/><text class=\"t\" x=\"167.0\" y=\"63.5\" text-anchor=\"middle\">Family<\/text><text class=\"t\" x=\"167.0\" y=\"78.5\" text-anchor=\"middle\">group<\/text><path class=\"w\" d=\"M216,67 L226,67\" marker-end=\"url(#da)\"/><rect class=\"g\" x=\"226\" y=\"40\" width=\"98\" height=\"54\" rx=\"9\"/><text class=\"t\" x=\"275.0\" y=\"71.0\" text-anchor=\"middle\">Village<\/text><path class=\"w\" d=\"M324,67 L334,67\" marker-end=\"url(#da)\"/><rect class=\"g\" x=\"334\" y=\"40\" width=\"98\" height=\"54\" rx=\"9\"/><text class=\"t\" x=\"383.0\" y=\"71.0\" text-anchor=\"middle\">Nation<\/text><path class=\"w\" d=\"M432,67 L442,67\" marker-end=\"url(#da)\"/><rect class=\"g\" x=\"442\" y=\"40\" width=\"98\" height=\"54\" rx=\"9\"/><text class=\"t\" x=\"491.0\" y=\"63.5\" text-anchor=\"middle\">World<\/text><text class=\"t\" x=\"491.0\" y=\"78.5\" text-anchor=\"middle\">family<\/text><text class=\"tb\" x=\"280\" y=\"20\" text-anchor=\"middle\">Undivided society = family extended step by step<\/text><text class=\"tl\" x=\"280\" y=\"130\" text-anchor=\"middle\">Five dimensions of human endeavour in the Universal Human Order:<\/text><rect class=\"g0\" x=\"10\" y=\"150\" width=\"98\" height=\"54\" rx=\"9\"/><text class=\"t\" x=\"59.0\" y=\"181.0\" text-anchor=\"middle\">Education<\/text><rect class=\"g0\" x=\"118\" y=\"150\" width=\"98\" height=\"54\" rx=\"9\"/><text class=\"t\" x=\"167.0\" y=\"181.0\" text-anchor=\"middle\">Health<\/text><rect class=\"g0\" x=\"226\" y=\"150\" width=\"98\" height=\"54\" rx=\"9\"/><text class=\"t\" x=\"275.0\" y=\"181.0\" text-anchor=\"middle\">Justice<\/text><rect class=\"g0\" x=\"334\" y=\"150\" width=\"98\" height=\"54\" rx=\"9\"/><text class=\"t\" x=\"383.0\" y=\"181.0\" text-anchor=\"middle\">Production<\/text><rect class=\"g0\" x=\"442\" y=\"150\" width=\"98\" height=\"54\" rx=\"9\"/><text class=\"t\" x=\"491.0\" y=\"181.0\" text-anchor=\"middle\">Exchange<\/text>", "caption": "Undivided society and the five dimensions of human order"}}, {"h": "Vision for the Universal Human Order", "p": ["The **universal human order** has **five dimensions** of human endeavour: **Education-right living**, **Health-self-regulation**, **Justice-preservation**, **Production-work** and **Exchange-storage**. When all five are in harmony, **society is in order**."], "table": {"head": ["Dimension", "Meaning", "Purpose"], "rows": [["Education and right living", "Develop right understanding and values", "Right living"], ["Health and self-regulation", "Keep body fit and balanced", "Sanyam, health"], ["Justice and preservation", "Ensure justice, protect relations and nature", "Trust and security"], ["Production and work", "Produce goods to meet needs", "Prosperity"], ["Exchange and storage", "Distribute and store resources", "Fairness"]]}}, {"h": "Present problems", "p": ["Today the world is divided by **religion, caste, nation, language and wealth**, which creates **conflict, war, terrorism and exploitation**. Each community tries to **dominate** others. This is **fragmented society**."], "warn": "Do not write \"universal human order = one government\". It means a harmonious living order based on values, not on force."}, {"h": "How to move towards it?", "p": ["By **right understanding** in every individual, **justice in relationships**, and **organisation** in the five dimensions. The change starts with the **individual and the family**, and spreads to **society**. Education plays a major role."], "tip": "A common question: \"Explain the vision for the universal human order.\" Draw the five boxes and one line each."}], "analogy": "A cricket team: each player has a role, the captain does not fight the bowler, the crowd cheers all (not their own player only). If every player plays for himself, the team loses. A society works the same way.", "hinglish": "Samaj ka matlab hai parivaar ka vistaar. Akhand samaj me sab ek parivaar jaise rehte hain. Sarvabhaum vyavastha ke 5 ayam hain: shiksha, swasthya, nyay, utpadan, vinimay.", "mistakes": ["Writing only the names of the five dimensions without their meaning.", "Thinking undivided society means everyone must be the same; it means everyone is treated with the same respect."], "remember": ["Society = extension of family", "Undivided society: akhand samaj", "Universal human order: sarvabhaum vyavastha", "Five dimensions: education, health, justice, production, exchange", "Present society is divided by religion, caste, nation, wealth"], "def": "**Harmony in society** means **living in an undivided society (akhand samaj)**, with **justice and order** that extend from the **family** to the **world family**. The vision is the **Universal Human Order (sarvabhaum vyavastha)**."}, "u4-t1": {"tldr": "Nature is made of four orders (material, pranic, animal, human). Each order is self-regulated and recyclable, and together they form a harmonious whole.", "sections": [{"h": "The four orders", "viz": {"type": "svg", "w": 560, "h": 250, "svg": "<rect class=\"g\" x=\"10\" y=\"50\" width=\"126\" height=\"64\" rx=\"9\"/><text class=\"t\" x=\"73.0\" y=\"86.0\" text-anchor=\"middle\">Material order<\/text><text class=\"tl\" x=\"73\" y=\"136\" text-anchor=\"middle\">soil, water,<\/text><text class=\"tl\" x=\"73\" y=\"151\" text-anchor=\"middle\">air, rocks<\/text><path class=\"w\" d=\"M136,82 L146,82\" marker-end=\"url(#da)\"/><rect class=\"g\" x=\"146\" y=\"50\" width=\"126\" height=\"64\" rx=\"9\"/><text class=\"t\" x=\"209.0\" y=\"86.0\" text-anchor=\"middle\">Pranic order<\/text><text class=\"tl\" x=\"209\" y=\"136\" text-anchor=\"middle\">plants, trees,<\/text><text class=\"tl\" x=\"209\" y=\"151\" text-anchor=\"middle\">herbs<\/text><path class=\"w\" d=\"M272,82 L282,82\" marker-end=\"url(#da)\"/><rect class=\"g\" x=\"282\" y=\"50\" width=\"126\" height=\"64\" rx=\"9\"/><text class=\"t\" x=\"345.0\" y=\"86.0\" text-anchor=\"middle\">Animal order<\/text><text class=\"tl\" x=\"345\" y=\"136\" text-anchor=\"middle\">birds, fish,<\/text><text class=\"tl\" x=\"345\" y=\"151\" text-anchor=\"middle\">animals<\/text><path class=\"w\" d=\"M408,82 L418,82\" marker-end=\"url(#da)\"/><rect class=\"g\" x=\"418\" y=\"50\" width=\"126\" height=\"64\" rx=\"9\"/><text class=\"t\" x=\"481.0\" y=\"86.0\" text-anchor=\"middle\">Human order<\/text><text class=\"tl\" x=\"481\" y=\"136\" text-anchor=\"middle\">human beings<\/text><text class=\"tb\" x=\"280\" y=\"26\" text-anchor=\"middle\">Four orders of nature<\/text><text class=\"tl\" x=\"280\" y=\"190\" text-anchor=\"middle\">Each order has recyclability and self-regulation<\/text><text class=\"tl\" x=\"280\" y=\"210\" text-anchor=\"middle\">Each lower order supports the higher orders<\/text>", "caption": "Four orders of nature"}, "table": {"head": ["Order", "Examples", "Main feature"], "rows": [["Material (padarth)", "Soil, water, air, rocks, metals", "Composition, decomposition; no growth"], ["Pranic (pran)", "Plants, trees, herbs", "Growth, seed-to-tree, nourishing"], ["Animal (jeev)", "Birds, fish, animals", "Have instinct, movement, need"], ["Human (gyan)", "Human beings", "Can understand and choose"]]}}, {"h": "Recyclability", "p": ["In nature, **everything is recycled**. Water becomes vapour, cloud, rain and river again. Fallen leaves become soil and then new plants. **Nothing is wasted** in nature, and no unit **vanishes**: it only **changes form**."], "viz": {"type": "chain", "items": ["Water in sea", "Evaporation", "Clouds", "Rain", "Rivers, soil, plants"], "labels": null, "caption": "Recycling of water: an example of recyclability"}}, {"h": "Self-regulation", "p": ["Every unit **keeps itself in balance** and plays **its role** in the larger order. A tree sheds leaves and gives fruits at the right time; an animal does not **hoard food** for years; the body temperature of humans stays about 37 degrees. This is **self-regulation**, which means **balance without outside control**."], "table": {"head": ["Feature", "Meaning", "Example"], "rows": [["Recyclability", "Process of recycling, giving back", "Water cycle, nitrogen cycle"], ["Self-regulation", "Balanced, systematic functioning", "Population of animals in a forest"]]}}, {"h": "Humans and nature", "p": ["Only the **human order** can **understand** this harmony and **choose** to protect or break it. Today, humans cause **pollution, deforestation and extinction** because we **do not follow** the self-regulation and recyclability of nature. So we have to **learn from nature**."], "tip": "Exam line: \"Nature = four orders; each shows recyclability and self-regulation; all are in mutual fulfilment.\""}], "analogy": "A well-run hostel mess: nothing is wasted (leftovers become compost), roles are fixed (cook, helper, server), and the system runs without a warden shouting. Nature is a mess that works all by itself, until humans arrive with a bulldozer.", "hinglish": "Prakriti me 4 order hain: padarth, pran, jeev aur gyan (insaan). Har order me recyclability (cheezein badal kar wapas) aur self-regulation (apne aap balance) hota hai.", "mistakes": ["Treating humans as separate from nature.", "Writing recyclability as \"recycling of plastic\" only."], "remember": ["Four orders: material, pranic, animal, human", "Recyclability = everything changes form and returns", "Self-regulation = balance on its own", "Human order can understand and choose", "Pollution comes from ignoring these laws"], "def": "**Nature** is the **collection of units** (things) in space, classified into **four orders**: **material order** (soil, water, air), **pranic order** (plants), **animal order** (animals, birds) and **human order**. Each order has **recyclability** and **self-regulation**."}, "u4-t2": {"tldr": "All four orders are interconnected. Each helps the others and is helped by them. Humans, having understanding, must ensure mutual fulfilment.", "sections": [{"h": "Interconnectedness", "p": ["Plants take **carbon dioxide and water** from the material order and give **oxygen** and food. Animals eat plants and give **manure**. Soil receives them and **feeds plants again**. Humans use all, so **our actions affect all four orders**. Nothing in nature **stands alone**."], "viz": {"type": "svg", "w": 560, "h": 280, "svg": "<rect class=\"g\" x=\"225\" y=\"10\" width=\"110\" height=\"40\" rx=\"9\"/><text class=\"t\" x=\"280.0\" y=\"34.0\" text-anchor=\"middle\">Material<\/text><rect class=\"g\" x=\"5\" y=\"110\" width=\"110\" height=\"40\" rx=\"9\"/><text class=\"t\" x=\"60.0\" y=\"134.0\" text-anchor=\"middle\">Pranic<\/text><rect class=\"g\" x=\"445\" y=\"110\" width=\"110\" height=\"40\" rx=\"9\"/><text class=\"t\" x=\"500.0\" y=\"134.0\" text-anchor=\"middle\">Animal<\/text><rect class=\"g\" x=\"225\" y=\"200\" width=\"110\" height=\"40\" rx=\"9\"/><text class=\"t\" x=\"280.0\" y=\"224.0\" text-anchor=\"middle\">Human<\/text><path class=\"w\" d=\"M280,30 L60,130\" marker-end=\"url(#da)\" stroke-dasharray=\"4 5\"/><path class=\"w\" d=\"M280,30 L500,130\" marker-end=\"url(#da)\" stroke-dasharray=\"4 5\"/><path class=\"w\" d=\"M60,130 L280,220\" marker-end=\"url(#da)\" stroke-dasharray=\"4 5\"/><path class=\"w\" d=\"M500,130 L280,220\" marker-end=\"url(#da)\" stroke-dasharray=\"4 5\"/><path class=\"w\" d=\"M280,30 L280,220\" marker-end=\"url(#da)\" stroke-dasharray=\"4 5\"/><path class=\"w\" d=\"M60,130 L500,130\" marker-end=\"url(#da)\" stroke-dasharray=\"4 5\"/><!-- boxes on top --><rect class=\"g\" x=\"225\" y=\"10\" width=\"110\" height=\"40\" rx=\"9\"/><text class=\"t\" x=\"280.0\" y=\"34.0\" text-anchor=\"middle\">Material<\/text><rect class=\"g\" x=\"5\" y=\"110\" width=\"110\" height=\"40\" rx=\"9\"/><text class=\"t\" x=\"60.0\" y=\"134.0\" text-anchor=\"middle\">Pranic<\/text><rect class=\"g\" x=\"445\" y=\"110\" width=\"110\" height=\"40\" rx=\"9\"/><text class=\"t\" x=\"500.0\" y=\"134.0\" text-anchor=\"middle\">Animal<\/text><rect class=\"g\" x=\"225\" y=\"200\" width=\"110\" height=\"40\" rx=\"9\"/><text class=\"t\" x=\"280.0\" y=\"224.0\" text-anchor=\"middle\">Human<\/text><text class=\"tl\" x=\"280\" y=\"268\" text-anchor=\"middle\">Every order depends on the others (arrows: support)<\/text>", "caption": "Interconnectedness of the four orders"}}, {"h": "Mutual fulfilment", "p": ["**Mutual fulfilment** means each order **helps the others** at its level. The **material order** supports the **pranic order** (soil nourishes plants); the **pranic** supports the **animal** (food); the **animal** supports the **human** (milk, farming). In return, the **human order** should **nourish, protect and enrich** all lower orders."], "table": {"head": ["Order", "What it gives", "What it needs"], "rows": [["Material", "Soil, water, air, minerals", "Not to be polluted or over-mined"], ["Pranic", "Food, oxygen, medicine", "Water, soil, protection"], ["Animal", "Milk, manure, balance in ecosystem", "Habitat, food"], ["Human", "Understanding, protection", "To ensure all others are fulfilled"]]}}, {"h": "Role of the human being", "p": ["Only humans can understand the **mutually fulfilling** relation. So the **human order** has **three duties**: **nurture** (enrich), **protect** (save from harm) and **use rightly** (use only as needed). If a human only **exploits**, mutual fulfilment breaks, which leads to **pollution, floods, climate change and extinction**."], "viz": {"type": "chain", "items": ["Understand the relation", "Nurture and protect nature", "Use only what is needed", "Mutual fulfilment among all orders"], "labels": null, "caption": "The human role in mutual fulfilment"}}, {"h": "Examples", "p": ["**Forest and rain**: forests bring rain and hold soil; rain gives water to forests. **Bees and flowers**: bees get nectar and flowers get pollination. **Agriculture**: cow dung gives manure for crops; crops give fodder for cows."], "tip": "Four-mark answer format: definition of mutual fulfilment, a small table of the four orders, and one line on the human duty."}], "analogy": "A fully working family: Dad earns, Mom manages, kids study and grandparents guide. Everyone gives and receives. If only one person takes and nobody gives (the human), the family goes bankrupt.", "hinglish": "Chaaron order ek dusre par nirbhar hain aur ek dusre ko poora karte hain. Insaan ke paas samajh hai, isliye uski zimmedari hai ki wo sab ko poshan, suraksha aur sahi upyog de.", "mistakes": ["Thinking only humans benefit and others just serve.", "Forgetting the human duty to nourish, protect and use rightly."], "remember": ["Interconnectedness = every unit depends on others", "Mutual fulfilment = each order supports the others", "Human duties: nurture, protect, right use", "Breaking it causes pollution and climate change", "Examples: forest and rain, bees and flowers"], "def": "**Interconnectedness** means every unit of nature **depends on and supports** the others. **Mutual fulfilment** means each order **plays its role** to help the others and in return is **helped** by them. The human being should **ensure mutual fulfilment**."}, "u4-t3": {"tldr": "Existence is the coexistence of units in space. Every unit exists in space and is related to the others at all levels, from atoms to the universe.", "sections": [{"h": "Existence = Space + Nature", "p": ["**Space** is **all-pervasive**: it is **everywhere**, it contains all the units and is the **medium** in which they exist. **Nature** is the **collection of units** in space: material, pranic, animal and human order. **Existence** = **space + nature**."], "viz": {"type": "svg", "w": 560, "h": 260, "svg": "<rect class=\"g0\" x=\"10\" y=\"10\" width=\"540\" height=\"240\" rx=\"9\"/><text class=\"tb\" x=\"280.0\" y=\"134.0\" text-anchor=\"middle\"><\/text><text class=\"tb\" x=\"280\" y=\"32\" text-anchor=\"middle\">SPACE (all-pervasive, everything exists in it)<\/text><circle class=\"g\" cx=\"90\" cy=\"90\" r=\"34\"/><text class=\"tl\" x=\"90\" y=\"94\" text-anchor=\"middle\">Material<\/text><circle class=\"g\" cx=\"230\" cy=\"80\" r=\"34\"/><text class=\"tl\" x=\"230\" y=\"84\" text-anchor=\"middle\">Material<\/text><circle class=\"g\" cx=\"400\" cy=\"90\" r=\"34\"/><text class=\"tl\" x=\"400\" y=\"94\" text-anchor=\"middle\
