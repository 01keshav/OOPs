<template id="tpl-u5-t6">
<div class="topic-eyebrow">Unit 5 · Topic 6</div>
<h1 class="topic-title">Inter-Thread Communication</h1>
<p class="topic-hook">How threads "talk" to each other — wait and notify.</p>

<div class="block reveal">
  <h3><span class="ico">🧠</span> ELI5</h3>
  <p>Java provides <code>wait()</code>, <code>notify()</code>, and <code>notifyAll()</code> methods (defined in the Object class) so threads can <b>coordinate</b> with each other — like in the Producer-Consumer problem.</p>
</div>

<div class="editor reveal">
  <div class="editor-bar"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div><span class="fname">SharedResource.java</span></div>
  <pre><code data-lang="java">class SharedResource {
    synchronized void produce() throws InterruptedException {
        System.out.println("Producing...");
        wait();       // releases the lock and waits
        System.out.println("Resumed after notify");
    }
    synchronized void consume() {
        System.out.println("Consuming and notifying...");
        notify();     // wakes up one waiting thread
    }
}</code></pre>
</div>

<table class="tbl reveal">
  <tr><th>Method</th><th>What It Does</th></tr>
  <tr><td><code>wait()</code></td><td>The current thread releases its lock and waits</td></tr>
  <tr><td><code>notify()</code></td><td>Wakes up ONE waiting thread</td></tr>
  <tr><td><code>notifyAll()</code></td><td>Wakes up ALL waiting threads</td></tr>
  <tr><td><code>join()</code></td><td>Makes the calling thread wait until the target thread finishes</td></tr>
  <tr><td><code>sleep(ms)</code></td><td>Pauses the current thread for the given number of milliseconds</td></tr>
</table>

<div class="keypoints reveal">
  <div class="lbl">🔑 Unit 5 Summary</div>

  const t = u.topics.find(x=>x.id===topicId);
  const uIdx = UNITS.indexOf(u)+1;
  document.getElementById('crumb').innerHTML = `<span class="u">UNIT ${uIdx}</span> / ${t.title}`;

  // sidebar active state + mark done (persisted to this browser)
  document.querySelectorAll('.topic-link').forEach(l=>l.classList.remove('active'));
  const activeLink = document.querySelector(`.topic-link[data-unit="${unitId}"][data-topic="${topicId}"]`);
  if(activeLink){ activeLink.classList.add('active'); activeLink.classList.add('done'); activeLink.querySelector('.check').textContent='✓'; }
  const key = unitId+'-'+topicId;
  const wasNew = !doneSet.has(key);
  doneSet.add(key);
  updateXP();
  if(wasNew) saveProgress();

  window.scrollTo({top:0,behavior:'smooth'});
  document.querySelector('.content-wrap')?.scrollTo?.(0,0);
  document.getElementById('main').scrollTo?.(0,0);
}

/* ---------- PREV/NEXT NAV ---------- */
function buildTopicNav(body){
  const idx = flatOrder.findIndex(f=>f.unit===currentUnit && f.topic===currentTopic);
  const prev = flatOrder[idx-1];
  const next = flatOrder[idx+1];
  const nav = document.createElement('div');
  nav.className='topic-nav reveal';
  const prevBtn = document.createElement('div');
  prevBtn.className='nav-btn'+(prev?'':' disabled');
  if(prev){
    const pu=UNITS.find(u=>u.id===prev.unit), pt=pu.topics.find(t=>t.id===prev.topic);
    prevBtn.innerHTML = `<div class="dir">← Previous</div><div class="ttl">${pt.title}</div>`;
    prevBtn.addEventListener('click',()=>loadTopic(prev.unit,prev.topic));
  }
  const nextBtn = document.createElement('div');
  nextBtn.className='nav-btn next'+(next?'':' disabled');
  if(next){
    const nu=UNITS.find(u=>u.id===next.unit), nt=nu.topics.find(t=>t.id===next.topic);
    nextBtn.innerHTML = `<div class="dir">Next →</div><div class="ttl">${nt.title}</div>`;
    nextBtn.addEventListener('click',()=>loadTopic(next.unit,next.topic));
  }
  nav.appendChild(prevBtn); nav.appendChild(nextBtn);
  body.appendChild(nav);
}

/* ---------- SCROLL REVEAL ---------- */
const observer = new IntersectionObserver((entries)=>{
  entries.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('visible'); } });
},{threshold:0.1});
function triggerReveal(){
  document.querySelectorAll('.reveal:not(.visible)').forEach(el=>observer.observe(el));
}

/* ---------- CODE HIGHLIGHTER ---------- */
const JAVA_KEYWORDS = ['abstract','assert','boolean','break','byte','case','catch','char','class','const','continue','default','do','double','else','enum','extends','final','finally','float','for','goto','if','implements','import','instanceof','int','interface','long','native','new','package','private','protected','public','return','short','static','strictfp','super','switch','synchronized','this','throw','throws','transient','try','void','volatile','while','true','false','null','var'];
function escapeHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
// Single-pass tokenizer: scans RAW source once, classifies each token, and never
// re-scans text it has already generated (avoids corrupting inserted <span> markup).
const HL_REGEX = new RegExp(
  '(\\/\\/[^\\n]*)' +                          // 1: line comment
  '|(\\/\\*[\\s\\S]*?\\*\\/)' +                  // 2: block comment
  '|("(?:[^"\\\\]|\\\\.)*")' +                   // 3: double-quoted string
  "|('(?:[^'\\\\]|\\\\.)*')" +                   // 4: single-quoted char
  '|(@[A-Za-z]+)' +                             // 5: annotation
  '|\\b(\\d+\\.?\\d*)\\b' +                      // 6: number
  '|\\b(' + JAVA_KEYWORDS.join('|') + ')\\b' +   // 7: keyword
  '|\\b([A-Z][A-Za-z0-9_]*)\\b'                 // 8: capitalized type/class name
  , 'g');
function highlightJava(raw){
  let out = '';
  let last = 0;
  let m;
  HL_REGEX.lastIndex = 0;
  while((m = HL_REGEX.exec(raw))){
    out += escapeHtml(raw.slice(last, m.index));
    const full = m[0];
    const safe = escapeHtml(full);
    if(m[1]||m[2]) out += `<span class="tok-com">${safe}</span>`;
    else if(m[3]||m[4]) out += `<span class="tok-str">${safe}</span>`;
    else if(m[5]) out += `<span class="tok-ann">${safe}</span>`;
    else if(m[6]!==undefined) out += `<span class="tok-num">${safe}</span>`;
    else if(m[7]!==undefined) out += `<span class="tok-kw">${safe}</span>`;
    else if(m[8]!==undefined) out += `<span class="tok-type">${safe}</span>`;
    else out += safe;
    last = HL_REGEX.lastIndex;
  }
  out += escapeHtml(raw.slice(last));
  return out;
}
function highlightAll(root){
  root.querySelectorAll('pre code[data-lang="java"]').forEach(block=>{
    if(block.dataset.done) return;
    block.innerHTML = highlightJava(block.textContent);
    block.dataset.done='1';
  });
  root.querySelectorAll('pre code[data-lang="bash"]').forEach(block=>{
    if(block.dataset.done) return;
    block.innerHTML = escapeHtml(block.textContent).replace(/(#.*$)/gm,'<span class="tok-com">$1</span>');
    block.dataset.done='1';
  });
}

/* ---------- RESPONSIVE TABLES ---------- */
function wrapTables(root){
  root.querySelectorAll('table.tbl').forEach(table=>{
    if(table.parentElement && table.parentElement.classList.contains('table-scroll')) return;
    const wrap = document.createElement('div');
    wrap.className = 'table-scroll';
    table.parentNode.insertBefore(wrap, table);
    wrap.appendChild(table);
  });
}

/* ---------- MINI QUIZ ---------- */
function wireQuizzes(root){
  root.querySelectorAll('[data-quiz]').forEach(q=>{
    const opts = q.querySelectorAll('.opt');
    const fb = q.querySelector('.fb');
    opts.forEach(opt=>{
      opt.addEventListener('click',()=>{
        if(opt.dataset.answered) return;
        opts.forEach(o=>o.dataset.answered='1');
        const correct = opt.dataset.correct === 'true';
        opts.forEach(o=>{
          if(o.dataset.correct==='true') o.classList.add('correct');
          else if(o===opt) o.classList.add('wrong');
        });
        fb.textContent = correct ? "✅ Correct! Nicely done." : "❌ Not quite — the right answer is highlighted above.";
        fb.classList.add('show');
      });
    });
  });
}

/* ---------- SEARCH ---------- */
document.getElementById('search').addEventListener('input', (e)=>{
  const q = e.target.value.toLowerCase().trim();
  document.querySelectorAll('.unit-block').forEach(block=>{
    let anyMatch = false;
    block.querySelectorAll('.topic-link').forEach(link=>{
      const text = link.textContent.toLowerCase();
      const match = text.includes(q);
      link.style.display = match ? 'flex' : 'none';
      if(match) anyMatch = true;
    });
    if(q){ block.classList.toggle('open', anyMatch); block.style.display = anyMatch ? '' : 'none'; }
    else { block.style.display=''; block.querySelectorAll('.topic-link').forEach(l=>l.style.display='flex'); }
  });
});

/* ---------- RESET PROGRESS ---------- */
document.getElementById('resetBtn')?.addEventListener('click', ()=>{
  if(!confirm('Reset your saved progress for this course? This clears every topic marked as done on this device.')) return;
  doneSet.clear();
  try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
  document.querySelectorAll('.topic-link').forEach(l=>{ l.classList.remove('done','active'); const c=l.querySelector('.check'); if(c) c.textContent=''; });
  updateXP();
  const t = document.getElementById('saveStatusText');
  if(t) t.textContent = 'Progress reset';
  if(!currentUnit) showHome();
});

/* ---------- MOBILE SIDEBAR ---------- */
function closeSidebar(){ document.getElementById('sidebar').classList.remove('open'); document.getElementById('overlay').classList.remove('show'); }
document.getElementById('menuBtn')?.addEventListener('click', ()=>{
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('overlay').classList.add('show');
});
document.getElementById('overlay').addEventListener('click', closeSidebar);

/* ---------- KEYBOARD NAV ---------- */
document.addEventListener('keydown',(e)=>{
  if(!currentUnit) return;
  if(e.key==='ArrowRight'){ const idx=flatOrder.findIndex(f=>f.unit===currentUnit&&f.topic===currentTopic); const n=flatOrder[idx+1]; if(n) loadTopic(n.unit,n.topic); }
  if(e.key==='ArrowLeft'){ const idx=flatOrder.findIndex(f=>f.unit===currentUnit&&f.topic===currentTopic); const p=flatOrder[idx-1]; if(p) loadTopic(p.unit,p.topic); }
});
</script>
