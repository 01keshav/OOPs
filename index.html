that matches. The rest are skipped.", "uses": ["Handling different problems in different ways (file missing vs bad format)", "Logging an error locally and still reporting it upward"], "pros": ["Fine-grained handling for each type of failure", "Cleaner separation of concerns"], "cons": ["Wrong order of catch blocks", "Deeply nested try blocks reduce readability", "Swallowing the exception after logging when the caller needed to know"]}, "u4-t5": {"tldr": "Create your own exception class by extending Exception (checked) or RuntimeException (unchecked).", "sections": [{"h": "What is a custom exception?", "p": ["Built-in exceptions like `ArithmeticException` are generic. A custom name tells exactly what went wrong in your business logic."], "pts": ["Created by extending `Exception` (checked) or `RuntimeException` (unchecked)", "Thrown with `throw`, declared with `throws`, caught like any other exception", "Name should end with `Exception`"], "viz": {"type": "tree", "root": "Exception", "kids": ["IOException", "RuntimeException", "InvalidAgeException (custom)"], "caption": "A custom class joins the existing hierarchy"}}, {"h": "Why create one?", "p": ["Reasons to write your own exception class:"], "pts": ["Clear, meaningful names make code self-explaining", "Can carry extra data (error code, amount, id)", "Callers can catch exactly your problem and nothing else", "Separates business rules errors from system errors"]}, {"h": "Steps to create a custom exception", "p": ["Creating one is easy and has only a few steps."], "table": {"head": ["Step", "What happens"], "rows": [["1. Pick a parent", "`Exception` (checked) or `RuntimeException` (unchecked)"], ["2. Write a class", "`class MyException extends Exception`"], ["3. Add constructors", "Usually one taking a message, passed to `super(message)`"], ["4. Throw it", "`throw new MyException(\"msg\")`"], ["5. Handle it", "`try-catch` or `throws`"]]}}, {"h": "Custom checked exception", "p": ["Extend `Exception` (not `RuntimeException`). The compiler now forces everyone who calls the risky method to catch it or declare it. Use it when the caller can realistically recover, for example 'insufficient balance, ask for another amount'.", "Pass the message to the parent using `super(message)`. Then `getMessage()` works automatically."], "warn": "Because it is checked, `check()` must declare `throws InvalidAgeException`, and `main` must catch or declare it.", "code": {"f": "Main.java", "c": "class InvalidAgeException extends Exception {\n    InvalidAgeException(String message) {\n        super(message);\n    }\n}\npublic class Main {\n    static void check(int age) throws InvalidAgeException {\n        if (age < 18) throw new InvalidAgeException(\"Age \" + age + \" is below 18\");\n        System.out.println(\"Age \" + age + \" accepted\");\n    }\n    public static void main(String[] args) {\n        try {\n            check(21);\n            check(12);\n        } catch (InvalidAgeException e) {\n            System.out.println(\"Caught: \" + e.getMessage());\n        }\n    }\n}", "out": "Age 21 accepted\nCaught: Age 12 is below 18"}}, {"h": "Custom unchecked exception", "p": ["Extend `RuntimeException`. No `throws` or `try-catch` is forced. Use it for programming errors or rule violations that callers usually cannot recover from, like invalid arguments or invalid state."], "tip": "This ends with an uncaught exception, so the stack trace shows your custom class name.", "code": {"f": "Main.java", "c": "class InvalidAmountException extends RuntimeException {\n    InvalidAmountException(String message) {\n        super(message);\n    }\n}\npublic class Main {\n    static void deposit(double amount) {\n        if (amount <= 0) throw new InvalidAmountException(\"Amount must be positive\");\n        System.out.println(\"Deposited \" + amount);\n    }\n    public static void main(String[] args) {\n        deposit(500);\n        deposit(-20);   // not caught: program ends\n    }\n}", "out": "Deposited 500.0\nException in thread \"main\" InvalidAmountException: Amount must be positive\n\tat Main.deposit(Main.java:8)\n\tat Main.main(Main.java:13)"}}, {"h": "Custom checked vs unchecked", "p": ["Which parent to choose? Use this table."], "table": {"head": ["Point", "Checked (extends Exception)", "Unchecked (extends RuntimeException)"], "rows": [["Compiler check", "Yes, catch or declare", "No"], ["Use when", "Caller can recover", "Bug or invalid use"], ["throws needed", "Yes", "No"], ["Example", "InsufficientFundsException", "InvalidAmountException"], ["Downside", "Boilerplate in callers", "Easy to forget handling"]]}}, {"h": "Constructors, cause and extra fields", "p": ["A good custom exception usually provides a message constructor and a message+cause constructor, so it supports chaining. It can also hold extra data with getters.", "Here the exception carries the missing amount, so the caller can show how much more money is needed."], "code": {"f": "Main.java", "c": "class InsufficientFundsException extends Exception {\n    private final double shortBy;\n    InsufficientFundsException(String msg, double shortBy) {\n        super(msg);\n        this.shortBy = shortBy;\n    }\n    InsufficientFundsException(String msg, Throwable cause) {\n        super(msg, cause);\n        this.shortBy = 0;\n    }\n    double getShortBy() { return shortBy; }\n}\npublic class Main {\n    static void withdraw(double bal, double amt) throws InsufficientFundsException {\n        if (amt > bal) throw new InsufficientFundsException(\"Not enough balance\", amt - bal);\n        System.out.println(\"Withdrawn \" + amt);\n    }\n    public static void main(String[] args) {\n        try {\n            withdraw(1000, 400);\n            withdraw(1000, 1500);\n        } catch (InsufficientFundsException e) {\n            System.out.println(e.getMessage() + \", short by \" + e.getShortBy());\n        }\n    }\n}", "out": "Withdrawn 400.0\nNot enough balance, short by 500.0"}}, {"h": "Best practices", "p": ["Follow these habits when writing exception classes."], "pts": ["End the class name with `Exception`", "Prefer built-in exceptions (`IllegalArgumentException`) when they fit; create a new one only when needed", "Always give a clear message", "Keep original cause when wrapping another exception", "Create one base exception for your app and extend it for specific cases", "Do not use exceptions for normal flow control such as loop ends"], "viz": {"type": "tree", "root": "AppException", "kids": ["UserNotFoundException", "PaymentFailedException", "InvalidInputException"], "caption": "A base exception for your whole app"}}], "analogy": "A hospital does not just say 'illness'. It has specific labels like 'fracture' or 'fever'. A custom exception is a specific label for your own application's problem.", "hinglish": "Bhai apni khud ki exception class banao jab built-in exceptions se kaam na chale. Exception extend karo to checked (compiler force karega), RuntimeException extend karo to unchecked. Constructor mein super(message) likhna mat bhoolna, phir throw new MyException(\"msg\") se phenko.", "mistakes": ["Extending `Throwable` or `Error` directly instead of `Exception`.", "Forgetting `super(message)`: `getMessage()` returns null.", "Forgetting `throws` on a method that throws a checked custom exception.", "Writing a custom class for every tiny case when `IllegalArgumentException` would do.", "Using `throw` with a class that is not a `Throwable`."], "remember": ["Custom/user-defined exception: a class created by the programmer for application-specific errors.", "Extend `Exception` for a checked custom exception.", "Extend `RuntimeException` for an unchecked custom exception.", "Call `super(message)` so that `getMessage()` returns it.", "Checked custom exception must be caught or declared with `throws`.", "Unchecked custom exception needs no declaration.", "Throw it with `throw new MyException(\"msg\");`.", "Add a (message, cause) constructor to support exception chaining.", "Extra fields (like error code) can be added with getters.", "Naming convention: class name ends with `Exception`.", "Use checked when the caller can recover; unchecked for programming errors.", "Prefer standard exceptions when they already describe the problem."], "def": "A custom (user-defined) exception is a class you write yourself to represent a problem specific to your application, such as `InsufficientBalanceException` or `InvalidAgeException`.", "uses": ["Business rules such as insufficient balance, invalid age or duplicate username", "Giving clear, meaningful error messages to the user and to developers"], "pros": ["Clear, readable error handling", "Business errors are separated from system errors"], "cons": ["Forgetting super(message) so the message is lost", "Creating custom exceptions when a built-in one already fits (IllegalArgumentException)", "Using a checked exception when callers cannot do anything useful about it"]}, "u5-t1": {"tldr": "A process is a running program with its own memory; a thread is a lightweight task inside a process sharing its memory.", "sections": [{"h": "What is multitasking?", "p": ["There are two types: process-based multitasking (many programs) and thread-based multitasking (many tasks inside one program). Java's multithreading is the second type."], "table": {"head": ["Type", "Unit", "Example"], "rows": [["Process-based", "Process (program)", "Browser + Music player + IDE"], ["Thread-based", "Thread (task inside a program)", "Browser: download + render + UI"]]}}, {"h": "What is a process?", "p": ["A process is a program in execution. When you double-click an application, the OS creates a process for it with its own memory (code, data, heap, stack) and its own resources.", "Processes are isolated from each other. One process cannot directly read the memory of another. To talk, they need special channels called inter-process communication (IPC)."], "pts": ["Heavy: creating it costs time and memory", "Has its own separate address space", "Context switch between processes is slow", "If one process crashes, others usually stay safe"], "table": {"head": ["Process"], "rows": [["Code"], ["Data"], ["Heap"], ["Stack"], ["Open files / resources"]]}}, {"h": "What is a thread?", "p": ["A thread is the smallest unit of execution inside a process. It is a lightweight sub-process. One process can have many threads, and all of them run inside the same process.", "Every thread has its own stack and program counter, but all threads of a process share the same heap, code and data. That makes communication easy and cheap, but it also creates risks (data conflicts), which we handle with synchronization."], "pts": ["Lightweight: cheap to create and switch", "Shares memory with other threads of the same process", "Has own stack and own program counter", "A process always has at least one thread (the main thread)"], "table": {"head": ["One process, many threads"], "rows": [["Shared: Code, Data, Heap"], ["Thread 1: own stack"], ["Thread 2: own stack"], ["Thread 3: own stack"]]}}, {"h": "Process vs thread", "p": ["This table is a favourite exam question."], "table": {"head": ["Point", "Process", "Thread"], "rows": [["Meaning", "Program in execution", "Unit of execution inside a process"], ["Weight", "Heavyweight", "Lightweight"], ["Memory", "Separate address space", "Shares memory of the process"], ["Creation cost", "High", "Low"], ["Context switch", "Slow", "Fast"], ["Communication", "Needs IPC (pipes, sockets)", "Easy, through shared objects"], ["Independence", "Independent", "Dependent on its process"], ["Failure", "Does not affect others", "May bring down the whole process"]]}}, {"h": "Why do we need multithreading?", "p": ["Without threads a program does one thing at a time. If one step is slow (reading a file, waiting for the network), the whole program waits and the screen freezes.", "With multithreading, one thread can wait while others keep working."], "pts": ["Responsive apps: UI thread stays alive while a background thread works", "Better CPU use on multi-core machines", "Faster completion of independent tasks", "Examples: games, web servers (one thread per request), video players, editors with auto-save"], "viz": {"type": "chain", "items": ["Without threads: task A", "then task B", "then task C"], "caption": "Sequential: total time = A + B + C"}}, {"h": "The main thread", "p": ["When a Java program starts, the JVM creates one thread automatically that runs the `main()` method. It is called the `main` thread. Other threads you create are started from it.", "You can get the current thread with `Thread.currentThread()`."], "code": {"f": "Main.java", "c": "public class Main {\n    public static void main(String[] args) {\n        Thread t = Thread.currentThread();\n        System.out.println(\"Name: \" + t.getName());\n        System.out.println(\"Priority: \" + t.getPriority());\n        System.out.println(\"Group: \" + t.getThreadGroup().getName());\n    }\n}", "out": "Name: main\nPriority: 5\nGroup: main"}}, {"h": "A first look at two threads", "p": ["Here the main thread starts a second thread. The second thread prints its own name. `join()` makes main wait until the thread finishes, so the output order is fixed. The next topic explains how to create threads in detail."], "code": {"f": "Main.java", "c": "public class Main {\n    public static void main(String[] args) throws InterruptedException {\n        Thread t = new Thread(() ->\n            System.out.println(\"Running in: \" + Thread.currentThread().getName()));\n        t.start();\n        t.join();\n        System.out.println(\"Back in: \" + Thread.currentThread().getName());\n    }\n}", "out": "Running in: Thread-0\nBack in: main"}}, {"h": "Concurrency vs parallelism", "p": ["Concurrency: many tasks make progress by taking turns on one CPU core (time slicing). Parallelism: many tasks truly run at the same instant on different cores.", "A single-core machine can be concurrent but not parallel. Java threads give you both, depending on the hardware."], "table": {"head": ["", "Concurrency", "Parallelism"], "rows": [["Idea", "Tasks interleave", "Tasks run at same instant"], ["Needs", "One core is enough", "Multiple cores"], ["Analogy", "One cook, many dishes", "Many cooks, many dishes"]]}}], "analogy": "A process is a restaurant with its own kitchen and stock. Threads are the cooks working inside the same kitchen: they share ingredients (memory) but each handles a separate order.", "hinglish": "Bhai process ek chalta hua program hai jiski apni alag memory hoti hai, bhaari hota hai. Thread uske andar ka chhota kaam hai, halka hota hai aur process ki memory share karta hai. Java mein main() ek main thread pe chalta hai. Multithreading se app freeze nahi hoti aur CPU ka better use hota hai.", "mistakes": ["Saying threads have separate heap: they share the heap, only stacks are separate.", "Believing multithreading always makes a program faster: overhead and locking can slow it.", "Mixing up concurrency (switching) with parallelism (simultaneous).", "Forgetting that a process always has at least one thread."], "remember": ["Multitasking: performing multiple tasks at the same time. Process-based and thread-based.", "Process: a program in execution; has own address space; heavyweight.", "Thread: smallest unit of execution within a process; lightweight.", "Threads of one process share code, data and heap; each has own stack and program counter.", "Context switching between threads is faster than between processes.", "Inter-thread communication is easy (shared memory); inter-process needs IPC.", "Process is independent; threads are dependent on their process.", "Every Java program has a `main` thread created by the JVM.", "`Thread.currentThread()` returns the running thread.", "Multithreading benefits: responsiveness, resource sharing, better CPU utilization, economy.", "Drawbacks: complexity, race conditions, deadlocks, hard debugging.", "Concurrency = interleaving; parallelism = simultaneous execution on multiple cores."], "def": "Multitasking means doing more than one job at the same time. On a computer, you listen to music, download a file and type in an editor together. The operating system switches between jobs so fast that they look simultaneous.", "uses": ["Responsive GUIs (UI thread plus background work)", "Web servers handling many requests at once", "Downloading, rendering and processing at the same time"], "pros": ["Better CPU use and faster execution of independent tasks", "Responsive applications", "Lightweight compared to processes"], "cons": ["Shared data can be corrupted without synchronization (race conditions)", "Deadlocks are possible", "Harder to debug because results can change from run to run"]}, "u3-t1": {"tldr": "A child class reuses the fields and methods of a parent class using extends.", "sections": [{"h": "What is inheritance?", "p": ["In Java we write it with the `extends` keyword. The child gets everything accessible from the parent, and can add its own members on top."], "pts": ["Superclass / parent / base class: the class whose members are inherited", "Subclass / child / derived class: the class that inherits", "`extends` is the keyword used for class inheritance", "Child = parent's accessible members + its own new members"], "viz": {"type": "tree", "root": "Animal (parent)", "kids": ["Dog (child)"], "caption": "Dog IS-A Animal"}}, {"h": "Why do we need it?", "p": ["Without inheritance, every class repeats the same code. A `Dog`, `Cat` and `Cow` all need `name` and `eat()`. Writing it three times is slow and bug-prone.", "With inheritance we write common code once in the parent. Children reuse it and only add what is special about them."], "pts": ["Code reusability: write once, use in many classes", "Easy maintenance: fix a bug in one place (the parent)", "Method overriding: child can change parent behaviour (runtime polymorphism)", "Natural modelling of real-world hierarchies", "Extensibility: add new child classes without touching old code"]}, {"h": "Syntax and first example", "p": ["Syntax: `class Child extends Parent { ... }`. Create an object of the child and you can call both its own methods and the inherited ones."], "tip": "`Dog` never declared `name` or `eat()`, yet `d.eat()` works. That is inheritance.", "code": {"f": "Main.java", "c": "class Animal {\n    String name = \"Tommy\";\n    void eat() { System.out.println(name + \" is eating\"); }\n}\nclass Dog extends Animal {\n    void bark() { System.out.println(name + \" is barking\"); }\n}\npublic class Main {\n    public static void main(String[] args) {\n        Dog d = new Dog();\n        d.eat();   // inherited from Animal\n        d.bark();  // own method\n    }\n}", "out": "Tommy is eating\nTommy is barking"}}, {"h": "What gets inherited and what does not", "p": ["A child does not get everything. It depends on access modifiers and the member type."], "table": {"head": ["Member", "Inherited?", "Reason"], "rows": [["public / protected", "Yes", "Visible to child"], ["default (package-private)", "Only same package", "Package access rule"], ["private", "No (not accessible)", "Hidden inside parent"], ["static members", "Accessible, not overridden", "Belong to class"], ["Constructors", "No", "Not members; use super()"], ["Initializer blocks", "Run, not inherited", "Run during construction"]]}}, {"h": "Constructors in inheritance", "p": ["When you create a child object, the parent part is built first. Java secretly puts `super();` as the first line of every child constructor if you do not write one. So the parent constructor runs before the child constructor.", "Constructors are never inherited. They are only chained."], "warn": "If the parent has no no-arg constructor, the child must call `super(args)` explicitly, else compile error.", "code": {"f": "Main.java", "c": "class Parent {\n    Parent() { System.out.println(\"Parent constructor\"); }\n}\nclass Child extends Parent {\n    Child() { System.out.println(\"Child constructor\"); }\n}\npublic class Main {\n    public static void main(String[] args) {\n        new Child();\n    }\n}", "out": "Parent constructor\nChild constructor"}}, {"h": "Private members and the Object class", "p": ["A `private` field of the parent exists inside the child object in memory, but the child cannot touch it directly. Use public getters/setters of the parent instead.", "Also, every class in Java silently extends `java.lang.Object` if you do not write `extends`. That is why every object has `toString()`, `equals()` and `hashCode()`."], "code": {"f": "Main.java", "c": "class Account {\n    private int balance = 500;\n    int getBalance() { return balance; }\n}\nclass Savings extends Account {\n    void show() {\n        // System.out.println(balance); // error: balance has private access\n        System.out.println(\"Balance: \" + getBalance());\n    }\n}\npublic class Main {\n    public static void main(String[] args) {\n        Savings s = new Savings();\n        s.show();\n        System.out.println(s instanceof Object);\n    }\n}", "out": "Balance: 500\ntrue"}}, {"h": "Is-A vs Has-A", "p": ["Use inheritance only for a true IS-A relationship. For HAS-A (a `Car` has an `Engine`) use composition: keep an object of the other class as a field.", "Rule of thumb: if you only want to reuse code and the IS-A sentence sounds wrong, prefer composition."], "table": {"head": ["", "Inheritance (IS-A)", "Composition (HAS-A)"], "rows": [["Keyword", "extends", "object as a field"], ["Example", "Dog is an Animal", "Car has an Engine"], ["Coupling", "Tight", "Loose"], ["Flexibility", "Fixed at compile time", "Can change at runtime"]]}}, {"h": "Advantages, limits and use cases", "p": ["Advantages: reuse, less code, easy to extend, enables polymorphism. Limits: tight coupling (parent change affects all children), deep hierarchies are hard to understand, and Java allows only ONE parent class.", "Used heavily in frameworks (Exception hierarchy, GUI components, Android `Activity`) and in domain models (Employee -> Manager)."]}], "analogy": "Like a child getting eye colour and height from parents without doing anything, a Dog class gets eat() and name from Animal without rewriting them.", "hinglish": "Bhai simple hai: ek class doosri class ka code reuse kar leti hai `extends` se. Parent ka sab kuch (private chhodke) child ko mil jata hai, aur child apna extra bhi add kar sakta hai. Pehle parent ka constructor chalta hai, phir child ka.", "mistakes": ["Thinking private members are not present at all: they exist in the object but are not accessible.", "Using inheritance for HAS-A relationships (Car extends Engine is wrong).", "Forgetting that the parent needs a matching constructor call via `super(...)` when it has no default constructor.", "Saying constructors are inherited. They are not.", "Trying `class C extends A, B`. Not allowed."], "remember": ["Inheritance = child class acquires fields and methods of a parent class.", "Keyword: `extends`. Syntax: `class B extends A { }`.", "Parent = superclass/base; child = subclass/derived.", "Represents IS-A relationship.", "Benefits: reusability, maintainability, extensibility, runtime polymorphism.", "Private members are not accessible in the child; use getters.", "Constructors are not inherited; parent constructor runs first via `super()`.", "Java compiler adds `super();` automatically as the first statement.", "Every class implicitly extends `Object`.", "A class can extend only one class (no multiple inheritance with classes).", "HAS-A (composition) is different from IS-A (inheritance).", "Static members are accessible in child but are hidden, not overridden."], "def": "Inheritance is an OOP feature where a new class (the subclass or child) acquires the fields and methods of an existing class (the superclass or parent). It models an IS-A relationship: a `Dog` IS-A `Animal`.", "uses": ["Reusing common code in a parent class", "Building class hierarchies such as Animal, Dog, Cat or Employee, Manager", "Enabling runtime polymorphism"], "pros": ["Code reusability", "Less duplication, easier maintenance", "Natural way to model is-a relationships"], "cons": ["Tight coupling between parent and child", "Changes in the parent can break children", "Using inheritance when a has-a (composition) relationship fits better", "Deep hierarchies become hard to understand"]}, "u3-t2": {"tldr": "Single, multilevel and hierarchical work with classes; multiple and hybrid only through interfaces.", "sections": [{"h": "What are types of inheritance?", "p": [], "table": {"head": ["Type", "Shape", "With classes?", "With interfaces?"], "rows": [["Single", "A -> B", "Yes", "Yes"], ["Multilevel", "A -> B -> C", "Yes", "Yes"], ["Hierarchical", "A -> B, A -> C", "Yes", "Yes"], ["Multiple", "A, B -> C", "No", "Yes"], ["Hybrid", "Mix of types", "Not with classes alone", "Yes"]]}}, {"h": "Single inheritance", "p": ["Definition: one child class extends exactly one parent class. It is the simplest form.", "Here `Bike` extends `Vehicle` and reuses `start()`."], "code": {"f": "Main.java", "c": "class Vehicle {\n    void start() { System.out.println(\"Vehicle starts\"); }\n}\nclass Bike extends Vehicle {\n    void ride() { System.out.println(\"Bike rides\"); }\n}\npublic class Main {\n    public static void main(String[] args) {\n        Bike b = new Bike();\n        b.start();\n        b.ride();\n    }\n}", "out": "Vehicle starts\nBike rides"}, "viz": {"type": "chain", "items": ["Vehicle", "Bike"], "caption": "Single: one parent, one child"}}, {"h": "Multilevel inheritance", "p": ["Definition: a chain of inheritance. A class extends a class which itself extends another class. The last class gets members of all ancestors.", "Here `Puppy` -> `Dog` -> `Animal`. A `Puppy` object can call `eat()`, `bark()` and `weep()`."], "tip": "Constructors run top-down: Animal, then Dog, then Puppy.", "code": {"f": "Main.java", "c": "class Animal {\n    void eat() { System.out.println(\"eating\"); }\n}\nclass Dog extends Animal {\n    void bark() { System.out.println(\"barking\"); }\n}\nclass Puppy extends Dog {\n    void weep() { System.out.println(\"weeping\"); }\n}\npublic class Main {\n    public static void main(String[] args) {\n        Puppy p = new Puppy();\n        p.eat();\n        p.bark();\n        p.weep();\n    }\n}", "out": "eating\nbarking\nweeping"}, "viz": {"type": "chain", "items": ["Animal", "Dog", "Puppy"], "caption": "Multilevel: grandparent -> parent -> child"}}, {"h": "Hierarchical inheritance", "p": ["Definition: one parent class has many child classes. Common code stays in the parent, each child adds its own behaviour.", "Here `Dog` and `Cat` both extend `Animal`. The two children are siblings and know nothing about each other."], "code": {"f": "Main.java", "c": "class Animal {\n    void eat() { System.out.println(\"eating\"); }\n}\nclass Dog extends Animal {\n    void bark() { System.out.println(\"barking\"); }\n}\nclass Cat extends Animal {\n    void meow() { System.out.println(\"meowing\"); }\n}\npublic class Main {\n    public static void main(String[] args) {\n        Dog d = new Dog();\n        d.eat();\n        d.bark();\n        Cat c = new Cat();\n        c.eat();\n        c.meow();\n    }\n}", "out": "eating\nbarking\neating\nmeowing"}, "viz": {"type": "tree", "root": "Animal", "kids": ["Dog", "Cat", "Cow"], "caption": "Hierarchical: one parent, many children"}}, {"h": "Multiple inheritance (not allowed with classes)", "p": ["Definition: one class has more than one direct parent class, like `class C extends A, B`. Java does NOT allow this for classes. The compiler gives an error.", "Reason: the Diamond Problem. Suppose `B` and `C` both extend `A` and both override `show()`. Now `D` extends both `B` and `C`. If we call `d.show()`, which version should run: B's or C's? Also, which copy of `A`'s fields does D have? This ambiguity is the diamond problem. Java avoids it by allowing only one parent class.", "So `class D extends B, C` gives: `error: '{' expected`. Java's solution is interfaces (see the last type)."], "warn": "`class C extends A, B` is a compile-time error in Java. Do not write it in exams as valid.", "viz": {"type": "merge", "parents": ["Class B", "Class C"], "child": "Class D", "bad": true, "caption": "Diamond problem: D has two paths to A.show()"}}, {"h": "Hybrid inheritance", "p": ["Definition: a combination of two or more types of inheritance, for example hierarchical + multiple. Because multiple inheritance is not possible with classes, hybrid inheritance in Java is also achieved only with interfaces.", "Below, `B` and `C` extend `A` (hierarchical) and `D` implements both (multiple). This diamond shape is legal with interfaces because they have no instance state, and `D` must give one clear `show()`."], "code": {"f": "Main.java", "c": "interface A { void show(); }\ninterface B extends A { }\ninterface C extends A { }\nclass D implements B, C {\n    public void show() { System.out.println(\"D shows once, no confusion\"); }\n}\npublic class Main {\n    public static void main(String[] args) {\n        new D().show();\n    }\n}", "out": "D shows once, no confusion"}, "viz": {"type": "merge", "parents": ["Interface B", "Interface C"], "child": "Class D", "bad": false, "caption": "Hybrid via interfaces (A is the common top)"}}, {"h": "Multiple inheritance through interfaces", "p": ["Definition: a class can implement many interfaces, so it gets multiple types of behaviour. This is how Java gives the benefit of multiple inheritance safely. A class uses `implements` and separates names by commas.", "If two interfaces have a default method with the same signature, the class must override it and may pick one with `Interface.super.method()`."], "tip": "Class extends ONE class but can implement MANY interfaces: `class X extends P implements I1, I2`.", "code": {"f": "Main.java", "c": "interface Flyable { default void move() { System.out.println(\"fly\"); } }\ninterface Swimmable { default void move() { System.out.println(\"swim\"); } }\nclass Duck implements Flyable, Swimmable {\n    public void move() {          // must resolve the clash\n        Flyable.super.move();\n        Swimmable.super.move();\n    }\n}\npublic class Main {\n    public static void main(String[] args) {\n        new Duck().move();\n    }\n}", "out": "fly\nswim"}, "viz": {"type": "merge", "parents": ["Flyable", "Swimmable"], "child": "Duck", "bad": false, "caption": "Duck implements both interfaces"}}, {"h": "Quick comparison", "p": ["Remember: with classes only the first three work. Use interfaces for the rest."], "table": {"head": ["Type", "Parents of one class", "Example"], "rows": [["Single", "1", "Bike extends Vehicle"], ["Multilevel", "1 (chain)", "Puppy -> Dog -> Animal"], ["Hierarchical", "1 (shared by many)", "Dog, Cat -> Animal"], ["Multiple", "2+", "Duck implements Flyable, Swimmable"], ["Hybrid", "Mixed", "D implements B, C"]]}}], "analogy": "A family tree: grandfather -> father -> son is multilevel; one father with many kids is hierarchical. But a child cannot have two \"main\" fathers giving conflicting orders, so Java allows only one parent class.", "hinglish": "Bhai types yaad rakh: single (ek parent ek child), multilevel (chain), hierarchical (ek parent many child). Multiple classes se allowed nahi hai kyunki diamond problem aata hai, confusion ki kaunsa method chalega. Uska solution interfaces hain.", "mistakes": ["Writing `class C extends A, B` as valid Java.", "Confusing multilevel (chain) with hierarchical (many siblings).", "Saying Java does not support multiple inheritance at all. It does, via interfaces.", "Forgetting that a class implementing two interfaces with the same default method must override it."], "remember": ["Types: single, multilevel, hierarchical, multiple, hybrid.", "Single: one parent -> one child (A -> B).", "Multilevel: chain A -> B -> C. Last class gets all ancestors' members.", "Hierarchical: one parent -> many children.", "Multiple: many parents -> one child. NOT supported by classes in Java.", "Reason: Diamond Problem (ambiguity about which inherited method/field to use).", "Java supports multiple inheritance of type through interfaces (`implements A, B`).", "Hybrid = combination of types; only possible via interfaces in Java.", "A class can extend only one class but implement any number of interfaces.", "Default-method clash in two interfaces must be resolved in the class using `X.super.m()`.", "In multilevel, constructors run from top ancestor to bottom.", "Interface can extend multiple interfaces: `interface C extends A, B`."], "def": "The type of inheritance tells us the shape of the class relationship: how many parents a class has and how many levels deep the chain goes. Java supports single, multilevel and hierarchical inheritance with classes. Multiple and hybrid inheritance are possible only through interfaces.", "uses": ["Choosing the right class design for a problem", "Answering exam questions on which type of inheritance Java allows"], "pros": ["Each type fits a different design need", "Interfaces give the benefits of multiple inheritance safely"], "cons": ["Writing class C extends A, B (compile error)", "Mixing up multilevel and hierarchical", "Long multilevel chains make code hard to follow"]}, "u3-t3": {"tldr": "super lets a child reach its parent: variables, methods and constructors; access modifiers decide what is visible.", "sections": [{"h": "What is super?", "p": ["It has exactly three uses: parent's variable, parent's method, parent's constructor."], "table": {"head": ["Use", "Syntax", "When"], "rows": [["Parent variable", "super.name", "Child has same-name variable"], ["Parent method", "super.show()", "Child overrode show()"], ["Parent constructor", "super(args)", "Initialise parent part"]]}}, {"h": "super with variables", "p": ["If parent and child both declare a field with the same name, the child's field hides the parent's. Plain `color` means the child's. `super.color` means the parent's."], "tip": "Fields are hidden, not overridden. Field access depends on the reference type, not the object.", "code": {"f": "Main.java", "c": "class Animal {\n    String color = \"white\";\n}\nclass Dog extends Animal {\n    String color = \"black\";\n    void printColor() {\n        System.out.println(\"Child: \" + color);\n        System.out.println(\"Parent: \" + super.color);\n    }\n}\npublic class Main {\n    public static void main(String[] args) {\n        new Dog().printColor();\n    }\n}", "out": "Child: black\nParent: white"}}, {"h": "super with methods", "p": ["When a child overrides a method, `super.method()` still runs the parent's version. This is useful to extend the parent's behaviour instead of replacing it fully."], "code": {"f": "Main.java", "c": "class Animal {\n    void sound() { System.out.println(\"Animal makes a sound\"); }\n}\nclass Dog extends Animal {\n    @Override\n    void sound() {\n        super.sound();\n        System.out.println(\"Dog barks\");\n    }\n}\npublic class Main {\n    public static void main(String[] args) {\n        new Dog().sound();\n    }\n}", "out": "Animal makes a sound\nDog barks"}}, {"h": "super() with constructors", "p": ["`super(...)` calls a parent constructor. It must be the FIRST statement of the child constructor. If you do not write it, the compiler inserts `super();` (the no-arg call).", "If the parent has only a parameterised constructor, the child must call it explicitly, otherwise compilation fails."], "warn": "`super(...)` and `this(...)` both must be the first line, so you cannot use both in one constructor.", "code": {"f": "Main.java", "c": "class Person {\n    String name;\n    Person(String name) {\n        this.name = name;\n        System.out.println(\"Person: \" + name);\n    }\n}\nclass Student extends Person {\n    int roll;\n    Student(String name, int roll) {\n        super(name);          // first line\n        this.roll = roll;\n        System.out.println(\"Student roll: \" + roll);\n    }\n}\npublic class Main {\n    public static void main(String[] args) {\n        new Student(\"Ravi\", 21);\n    }\n}", "out": "Person: Ravi\nStudent roll: 21"}}, {"h": "Rules of super", "p": ["Keep these rules handy for exams."], "pts": ["`super(...)` must be the first statement in a constructor", "Implicit `super();` is added by the compiler if you write nothing", "Cannot use `super` in a static method or static block (no object exists)", "`super` cannot be used to go up two levels: `super.super.x` is invalid", "`super` is not a variable you can assign or print alone", "`this(...)` and `super(...)` cannot both appear in the same constructor"], "tip": "Chain order: object creation goes top-down (Object -> ... -> Parent -> Child)."}, {"h": "Member access rules (access modifiers)", "p": ["Which parent members a child can use depends on the access modifier. Java has four levels."], "table": {"head": ["Modifier", "Same class", "Same package", "Subclass (other pkg)", "Anywhere"], "rows": [["private", "Yes", "No", "No", "No"], ["default", "Yes", "Yes", "No", "No"], ["protected", "Yes", "Yes", "Yes", "No"], ["public", "Yes", "Yes", "Yes", "Yes"]]}}, {"h": "Access rules in a parent-child example", "p": ["The child can use public and protected members of the parent directly. Private members only through public methods of the parent."], "warn": "`protected` in a different package: the child can use it only through itself (this/child reference), not through a plain parent reference.", "code": {"f": "Main.java", "c": "class Parent {\n    private int a = 1;\n    int b = 2;           // default\n    protected int c = 3;\n    public int d = 4;\n    int getA() { return a; }\n}\nclass Child extends Parent {\n    void show() {\n        // System.out.println(a);   // error: private\n        System.out.println(getA() + \" \" + b + \" \" + c + \" \" + d);\n    }\n}\npublic class Main {\n    public static void main(String[] args) {\n        new Child().show();\n    }\n}", "out": "1 2 3 4"}}, {"h": "super vs this", "p": ["Both are references to objects, but they point to different parts."], "table": {"head": ["", "this", "super"], "rows": [["Refers to", "Current class object", "Parent class part"], ["Variable", "this.x", "super.x"], ["Method", "this.m()", "super.m()"], ["Constructor", "this(...)", "super(...)"], ["Use in static", "No", "No"]]}}], "analogy": "A child saying \"my dad's way of doing it\" is super. Dad's locker (private) stays locked, the family cupboard (protected) the kids can open, the hall (public) anyone can enter.", "hinglish": "Bhai super matlab parent ka reference. Parent ka variable chahiye to `super.x`, parent ka method to `super.m()`, aur constructor ke liye `super(...)` jo hamesha pehli line me hota hai. Access me private sabse tight, public sabse khula.", "mistakes": ["Writing `super(...)` after another statement in the constructor.", "Using `super` inside a static method.", "Assuming a child can directly read a parent private field.", "Forgetting that the compiler adds `super();` and then failing when the parent has no no-arg constructor.", "Confusing field hiding with method overriding."], "remember": ["`super` refers to the immediate parent class part of the object.", "Uses: `super.var`, `super.method()`, `super(args)`.", "`super(...)` must be the first statement in a constructor.", "Compiler auto-adds `super();` if not written.", "If parent lacks no-arg constructor, child must call `super(args)` explicitly.", "`super` cannot be used in static context.", "Cannot chain `super.super`.", "`this(...)` and `super(...)` cannot be used together in one constructor.", "private: only within class. default: same package. protected: same package + subclasses. public: everywhere.", "Private members are not inherited (not accessible); use getters.", "Field with same name in child hides parent's field; use `super.field`.", "`super.method()` calls the parent version of an overridden method."], "def": "`super` is a reference keyword that points to the parent-class part of the current object. A child class uses it to reach things of the parent that the child has hidden or overridden.", "uses": ["Reusing parent initialisation code in the child constructor", "Extending, instead of completely replacing, a parent method"], "pros": ["Avoids code duplication", "Gives clear control over parent and child behaviour"], "cons": ["Putting super(...) anywhere except the first line", "Parent has only a parameterized constructor and the child forgets to call it", "Using super in a static method"]}, "u3-t4": {"tldr": "final locks things: a variable becomes constant, a method cannot be overridden, a class cannot be extended.", "sections": [{"h": "What is final?", "p": ["The effect depends on where you use it."], "table": {"head": ["Applied to", "Meaning", "Violation gives"], "rows": [["Variable", "Value cannot change (constant)", "Compile error on reassign"], ["Method", "Cannot be overridden", "Compile error in child"], ["Class", "Cannot be extended", "Compile error on extends"]]}}, {"h": "final variable", "p": ["A final variable can be assigned only once. By convention, constants are written in UPPER_CASE. A `static final` field is a true class-level constant."], "tip": "Common example: `Math.PI` is `public static final double`.", "code": {"f": "Main.java", "c": "public class Main {\n    static final double PI = 3.14159;\n    public static void main(String[] args) {\n        final int max = 10;\n        // max = 20;   // error: cannot assign a value to final variable max\n        System.out.println(max + \" \" + PI);\n    }\n}", "out": "10 3.14159"}}, {"h": "Blank final variable", "p": ["A final field with no value at declaration is a blank final. It must be assigned exactly once, in every constructor (for instance fields) or in a static block (for static fields). This gives each object its own constant value."], "warn": "Forgetting to assign a blank final in a constructor gives: variable might not have been initialized.", "code": {"f": "Main.java", "c": "class Student {\n    final int roll;\n    Student(int roll) { this.roll = roll; }\n}\npublic class Main {\n    public static void main(String[] args) {\n        Student a = new Student(1), b = new Student(2);\n        System.out.println(a.roll + \" \" + b.roll);\n    }\n}", "out": "1 2"}}, {"h": "final reference variable", "p": ["For objects, final locks the reference, not the object's content. You cannot point it to a new object, but you can change the fields of the same object."], "code": {"f": "Main.java", "c": "class Box { int size = 5; }\npublic class Main {\n    public static void main(String[] args) {\n        final Box b = new Box();\n        b.size = 50;            // allowed: object changes\n        // b = new Box();       // error: reference is final\n        System.out.println(b.size);\n        final int[] arr = {1, 2};\n        arr[0] = 9;             // allowed\n        System.out.println(arr[0]);\n    }\n}", "out": "50\n9"}}, {"h": "final method", "p": ["A final method cannot be overridden by a child class. Use it when the method's logic is critical and must stay the same. The child can still call it.", "Final methods can be inherited and used normally. Private methods are implicitly not overridable."], "code": {"f": "Main.java", "c": "class Bank {\n    final void rules() { System.out.println(\"KYC is mandatory\"); }\n    void rate() { System.out.println(\"Base rate\"); }\n}\nclass SBI extends Bank {\n    // void rules() { }   // error: cannot override final method\n    @Override void rate() { System.out.println(\"SBI rate\"); }\n}\npublic class Main {\n    public static void main(String[] args) {\n        SBI s = new SBI();\n        s.rules();\n        s.rate();\n    }\n}", "out": "KYC is mandatory\nSBI rate"}}, {"h": "final class", "p": ["A final class cannot be extended at all. Use it for security and immutability. Famous final classes: `String`, `Integer` and other wrapper classes, `Math`.", "All methods of a final class are effectively final. The class itself can be used and instantiated normally."], "warn": "A class cannot be both `abstract` and `final`. Abstract needs a child, final forbids one.", "code": {"f": "Main.java", "c": "final class Vehicle {\n    void run() { System.out.println(\"running\"); }\n}\n// class Car extends Vehicle { }   // error: cannot inherit from final Vehicle\npublic class Main {\n    public static void main(String[] args) {\n        new Vehicle().run();\n    }\n}", "out": "running"}}, {"h": "final parameters and other gotchas", "p": ["A final method parameter cannot be reassigned inside the method. Final local variables are also needed for lambdas: a captured local must be final or effectively final.", "Constructors cannot be final (they are not inherited anyway). Do not confuse the three look-alikes."], "table": {"head": ["Name", "What it is"], "rows": [["final", "Keyword: variable / method / class lock"], ["finally", "Block after try-catch, always runs"], ["finalize()", "Old method of Object called by GC (deprecated)"]]}}], "analogy": "A sealed lock on a box: you cannot swap the lock (final reference), but you can still change what is inside the box (object state).", "hinglish": "Bhai `final` ka matlab \"ab aur change nahi\". Variable pe lagao to constant, method pe lagao to override nahi hoga, class pe lagao to koi extend nahi kar sakta. Object ke saath reference lock hota hai, andar ka data badal sakta hai.", "mistakes": ["Thinking a final object is immutable. Only the reference is fixed.", "Declaring a class both abstract and final.", "Not initialising a blank final in the constructor.", "Confusing final, finally and finalize().", "Trying to override a final method and expecting it to work."], "remember": ["`final` = cannot be changed / extended / overridden.", "final variable: constant, assigned once. Use UPPER_CASE.", "static final = class-level constant (e.g. `Math.PI`).", "Blank final: assigned once in constructor (or static block).", "final reference: cannot point to another object, but object's state can change.", "final method: cannot be overridden but can be inherited and called.", "final class: cannot be extended (String, Integer, Math).", "A class cannot be abstract and final together.", "Constructors cannot be final.", "final parameter cannot be reassigned in the method.", "Lambdas can use only final or effectively final local variables.", "final, finally and finalize() are three different things."], "def": "`final` is a non-access modifier that means no more change. Once something is final, it is locked. It can be applied to variables, methods and classes (also parameters).", "uses": ["Constants and configuration values", "Creating immutable classes", "Protecting security-critical behaviour from being overridden"], "pros": ["Safety and predictability", "Helps create immutable, thread-safe objects", "Allows some compiler optimisations"], "cons": ["Trying to reassign a final variable", "Believing a final object cannot change inside (only the reference is fixed)", "Making classes final without need, which blocks useful extension"]}, "u3-t5": {"tldr": "Overloading: same method name, different parameters, chosen by the compiler.", "sections": [{"h": "What is polymorphism?", "p": [], "viz": {"type": "tree", "root": "Polymorphism", "kids": ["Compile-time (Overloading)", "Run-time (Overriding)"], "caption": "Two kinds of polymorphism"}}, {"h": "What is method overloading and why use it?", "p": ["Overloading means writing several methods with the SAME name but DIFFERENT parameter lists in one class (or in parent and child). Without it you would need names like `addInt`, `addDouble`, `addThree`.", "It makes the code readable: the caller remembers one name, and the compiler picks the right version from the arguments. `System.out.println()` is overloaded for int, String, char, double and more."], "viz": {"type": "chain", "items": ["add(2,3)", "Compiler checks args", "Picks add(int,int)"], "caption": "Chosen at compile time (static binding)"}}, {"h": "Rules of overloading", "p": ["Overloaded methods must differ in the parameter list. Everything else is free to change."], "pts": ["Same method name", "Different number, type or order of parameters", "Return type alone is NOT enough to overload", "Access modifier and exceptions can be different", "Can be in the same class or between parent and child", "Can be `static` or non-static, and constructors can be overloaded too"]}, {"h": "By number of parameters", "p": ["The easiest way: same name, different count of arguments."], "code": {"f": "Main.java", "c": "class Calc {\n    int add(int a, int b)        { return a + b; }\n    int add(int a, int b, int c) { return a + b + c; }\n}\npublic class Main {\n    public static void main(String[] args) {\n        Calc c = new Calc();\n        System.out.println(c.add(2, 3));\n        System.out.println(c.add(2, 3, 4));\n    }\n}", "out": "5\n9"}}, {"h": "By type of parameters", "p": ["Same count, different data types. The compiler matches the argument type."], "code": {"f": "Main.java", "c": "class Calc {\n    int add(int a, int b)          { return a + b; }\n    double add(double a, double b) { return a + b; }\n    String add(String a, String b) { return a + b; }\n}\npublic class Main {\n    public static void main(String[] args) {\n        Calc c = new Calc();\n        System.out.println(c.add(2, 3));\n        System.out.println(c.add(2.5, 3.5));\n        System.out.println(c.add(\"Ja\", \"va\"));\n    }\n}", "out": "5\n6.0\nJava"}}, {"h": "By order of parameters", "p": ["Same types in a different order also counts, but it is confusing, so use it rarely."], "code": {"f": "Main.java", "c": "class Show {\n    void print(String s, int n) { System.out.println(\"String, int: \" + s + n); }\n    void print(int n, String s) { System.out.println(\"int, String: \" + n + s); }\n}\npublic class Main {\n    public static void main(String[] args) {\n        Show x = new Show();\n        x.print(\"A\", 1);\n        x.print(1, \"A\");\n    }\n}", "out": "String, int: A1\nint, String: 1A"}}, {"h": "Return type alone does not overload", "p": ["If two methods differ only in return type, the compiler cannot decide which to call from the call `m(5)`. It reports: method is already defined. The parameter list must differ."], "warn": "`int get(int a)` and `double get(int a)` in the same class is a compile-time error."}, {"h": "Type promotion and which method is picked", "p": ["If no exact match exists, Java tries in this order: (1) exact match, (2) widening (byte -> short -> int -> long -> float -> double), (3) boxing/unboxing, (4) varargs. Here `show(5)` has no `int` version, so `int` widens to `long`.", "If two methods fit equally well, the call is ambiguous and gives a compile error."], "tip": "Passing `null` to `show(String)` and `show(Object)`: the most specific, `String`, wins.", "code": {"f": "Main.java", "c": "public class Main {\n    static void show(long x)    { System.out.println(\"long \" + x); }\n    static void show(double x)  { System.out.println(\"double \" + x); }\n    static void show(Integer x) { System.out.println(\"Integer \" + x); }\n    static void show(int... x)  { System.out.println(\"varargs\"); }\n    public static void main(String[] args) {\n        show(5);        // widening beats boxing and varargs\n        show('a');      // char widens to long\n        show(5.5f);     // float widens to double\n    }\n}", "out": "long 5\nlong 97\ndouble 5.5"}}, {"h": "Overloading constructors, and overloading vs overriding", "p": ["Constructors can be overloaded to create objects in different ways. Use `this(...)` to reuse one from another.", "Overloading is resolved by the compiler using the reference type, so it is called static (early) binding."], "code": {"f": "Main.java", "c": "class Point {\n    int x, y;\n    Point()           { this(0, 0); }\n    Point(int x, int y) { this.x = x; this.y = y; }\n}\npublic class Main {\n    public static void main(String[] args) {\n        Point p = new Point();\n        Point q = new Point(3, 4);\n        System.out.println(p.x + \",\" + p.y + \" \" + q.x + \",\" + q.y);\n    }\n}", "out": "0,0 3,4"}, "table": {"head": ["", "Overloading", "Overriding"], "rows": [["Where", "Same class (or sub)", "Parent and child"], ["Parameters", "Must differ", "Must be same"], ["Binding", "Compile time", "Run time"], ["Return type", "Can differ", "Same or covariant"], ["Also called", "Static polymorphism", "Dynamic polymorphism"]]}}], "analogy": "Telling your printer \"print\": a photo, a document or a ticket all use the same command, but what actually happens depends on what you give it.", "hinglish": "Bhai overloading me method ka naam same rehta hai, bas parameters alag hote hain (number, type ya order). Compiler khud decide kar leta hai kaunsa chalega, isliye ye compile-time polymorphism hai. Sirf return type alag karne se overloading nahi hoti.", "mistakes": ["Trying to overload by changing only the return type.", "Thinking overloading happens at runtime. It is compile time.", "Ambiguous calls such as `m(null)` with unrelated types, or passing int to `m(long,int)` and `m(int,long)`.", "Believing the object type decides the overloaded method. The declared (reference) type decides."], "remember": ["Polymorphism = one name, many forms. Two kinds: compile-time and run-time.", "Method overloading = same name, different parameter list.", "Differ by number, type or order of parameters.", "Return type alone cannot overload.", "Resolved at compile time -> static / early binding -> compile-time polymorphism.", "Access modifier, return type and throws clause may differ.", "Resolution order: exact -> widening -> boxing -> varargs.", "Ambiguous call causes a compile-time error.", "Constructors can be overloaded; use `this(...)` to chain.", "`static` methods can be overloaded; `main` can be overloaded but JVM calls only `main(String[])`.", "Overloading is decided by reference/argument type, not object type.", "Examples: `println()`, `Math.max()`, `String.valueOf()`."], "def": "Polymorphism means many forms. One name, many behaviours. In Java it comes in two kinds: compile-time (method overloading) and run-time (method overriding). This topic covers overloading.", "uses": ["Giving one clear name to similar operations (add, print, display)", "Offering different ways to create or call something, such as constructors with optional values"], "pros": ["Readable and consistent method names", "Flexible, convenient APIs"], "cons": ["Trying to overload by changing only the return type", "Ambiguous calls, for example when passing null to overloaded methods", "Too many overloads confuse users"]}});

(function(){
  LESSONS['u3-t13']={"tldr": "Object is the parent of every Java class. Its methods (toString, equals, hashCode, getClass, clone) are available on every object.", "def": "The `Object` class (in `java.lang`) is the root of the Java class hierarchy. Every class extends `Object`, directly or indirectly, so every object you create can use its methods.", "sections": [{"h": "Object: the parent of every class", "p": ["If you write `class Student { }` without `extends`, Java silently makes it `class Student extends Object`. So `Object` sits at the top of every inheritance chain.", "Because of this, a variable of type `Object` can hold a reference to any object, and every class gets the same set of basic methods."], "viz": {"type": "tree", "root": "Object", "kids": ["String", "Integer", "Student", "Dog"], "caption": "Every class is a child (direct or indirect) of Object"}}, {"h": "Methods of the Object class at a glance", "p": ["These are the methods you should know for exams and for real code."], "table": {"head": ["Method", "What it does", "Usually overridden?"], "rows": [["`toString()`", "Returns a text form of the object", "Yes"], ["`equals(Object o)`", "Checks whether two objects are logically equal", "Yes"], ["`hashCode()`", "Returns an int used by hash-based collections", "Yes, with equals()"], ["`getClass()`", "Returns the runtime class of the object", "No (final)"], ["`clone()`", "Creates a copy of the object", "Sometimes"], ["`finalize()`", "Called by the garbage collector (deprecated)", "No"], ["`wait()`, `notify()`, `notifyAll()`", "Thread communication", "No (final)"]]}}, {"h": "toString(): the default version", "p": ["`toString()` returns a String that represents the object. The default version in `Object` prints the class name, an `@` sign and the hash code in hexadecimal, like `Student@1b6d3586`. That is rarely useful.", "`println(obj)` and string concatenation call `toString()` for you automatically."], "code": {"f": "Main.java", "c": "class Student {\n    String name; int roll;\n    Student(String name, int roll) { this.name = name; this.roll = roll; }\n}\npublic class Main {\n    public static void main(String[] args) {\n        Student s = new Student(\"Ravi\", 1);\n        String text = s.toString();\n        System.out.println(text.startsWith(\"Student@\"));\n        Object o = s;\n        System.out.println(o instanceof Student);\n    }\n}", "out": "true\ntrue"}, "tip": "The exact hash after @ changes between runs, so the program above only checks that the text starts with `Student@`."}, {"h": "Overriding toString()", "p": ["Override `toString()` to show meaningful data. Now `println(s)` and `\"Details: \" + s` both print readable text."], "code": {"f": "Main.java", "c": "class Student {\n    String name; int roll;\n    Student(String name, int roll) { this.name = name; this.roll = roll; }\n    @Override\n    public String toString() { return \"Student[name=\" + name + \", roll=\" + roll + \"]\"; }\n}\npublic class Main {\n    public static void main(String[] args) {\n        Student s = new Student(\"Ravi\", 1);\n        System.out.println(s);\n        System.out.println(\"Details: \" + s);\n    }\n}", "out": "Student[name=Ravi, roll=1]\nDetails: Student[name=Ravi, roll=1]"}, "tip": "Always add `@Override` so the compiler catches a spelling mistake in the method name."}, {"h": "equals(): == vs equals()", "p": ["`==` compares references (are both variables pointing to the same object?). The default `equals()` in `Object` does exactly the same thing, so by default two different objects with the same data are not equal."], "code": {"f": "Main.java", "c": "class Student {\n    String name; int roll;\n    Student(String name, int roll) { this.name = name; this.roll = roll; }\n}\npublic class Main {\n    public static void main(String[] args) {\n        Student a = new Student(\"Ravi\", 1);\n        Student b = new Student(\"Ravi\", 1);\n        System.out.println(a == b);\n        System.out.println(a.equals(b));\n    }\n}", "out": "false\nfalse"}, "warn": "For your own classes, `equals()` behaves like `==` until you override it. (String and wrapper classes already override it to compare content.)"}, {"h": "Overriding equals()", "p": ["Override `equals()` to compare the fields that make two objects the same. The standard pattern: same reference, then null check, then class check, then compare fields."], "code": {"f": "Main.java", "c": "class Student {\n    String name; int roll;\n    Student(String name, int roll) { this.name = name; this.roll = roll; }\n    @Override\n    public boolean equals(Object obj) {\n        if (this == obj) return true;\n        if (obj == null || getClass() != obj.getClass()) return false;\n        Student other = (Student) obj;\n        return roll == other.roll && name.equals(other.name);\n    }\n}\npublic class Main {\n    public static void main(String[] args) {\n        Student a = new Student(\"Ravi\", 1);\n        Student b = new Student(\"Ravi\", 1);\n        System.out.println(a == b);\n        System.out.println(a.equals(b));\n        System.out.println(a.equals(null));\n    }\n}", "out": "false\ntrue\nfalse"}, "pts": ["**Reflexive:** `x.equals(x)` is true", "**Symmetric:** if `x.equals(y)` then `y.equals(x)`", "**Transitive:** if x equals y and y equals z, then x equals z", "**Consistent:** same answer on repeated calls", "`x.equals(null)` must return false"]}, {"h": "hashCode() and the equals/hashCode contract", "p": ["`hashCode()` returns an int. Hash-based collections like `HashSet` and `HashMap` use it to decide where to store an object.", "The contract: if two objects are equal by `equals()`, they must return the same `hashCode()`. So whenever you override `equals()`, override `hashCode()` too. `Objects.hash(...)` is the easy way."], "code": {"f": "Main.java", "c": "import java.util.HashSet;\nimport java.util.Objects;\nclass Student {\n    String name; int roll;\n    Student(String name, int roll) { this.name = name; this.roll = roll; }\n    @Override\n    public boolean equals(Object obj) {\n        if (this == obj) return true;\n        if (obj == null || getClass() != obj.getClass()) return false;\n        Student o = (Student) obj;\n        return roll == o.roll && name.equals(o.name);\n    }\n    @Override\n    public int hashCode() { return Objects.hash(name, roll); }\n}\npublic class Main {\n    public static void main(String[] args) {\n        HashSet<Student> set = new HashSet<>();\n        set.add(new Student(\"Ravi\", 1));\n        set.add(new Student(\"Ravi\", 1));\n        System.out.println(set.size());\n        System.out.println(new Student(\"Ravi\", 1).hashCode() == new Student(\"Ravi\", 1).hashCode());\n    }\n}", "out": "1\ntrue"}, "warn": "Override only equals() and a HashSet may store duplicates, because equal objects can land in different buckets."}, {"h": "getClass(): the runtime class", "p": ["`getClass()` returns a `Class` object describing the real type of the object at runtime, even if the variable type is the parent. It is `final`, so you cannot override it.", "It is also what `equals()` uses to make sure both objects are the same class."], "code": {"f": "Main.java", "c": "class Animal { }\nclass Dog extends Animal { }\npublic class Main {\n    public static void main(String[] args) {\n        Animal a = new Dog();\n        System.out.println(a.getClass().getName());\n        System.out.println(a.getClass().getSimpleName());\n        System.out.println(a.getClass() == Dog.class);\n        System.out.println(a.getClass() == Animal.class);\n        System.out.println(a instanceof Animal);\n    }\n}", "out": "Dog\nDog\ntrue\nfalse\ntrue"}, "tip": "`getClass() ==` checks the exact class. `instanceof` also accepts subclasses."}, {"h": "clone(): copying an object", "p": ["`clone()` creates a copy of an object. To use it, the class must implement the marker interface `Cloneable`, and `clone()` must be overridden (made public or protected access) and may throw `CloneNotSupportedException`.", "The default clone is a shallow copy: fields are copied one by one, but objects inside are shared, not duplicated."], "code": {"f": "Main.java", "c": "class Point implements Cloneable {\n    int x, y;\n    Point(int x, int y) { this.x = x; this.y = y; }\n    @Override\n    protected Object clone() throws CloneNotSupportedException { return super.clone(); }\n}\npublic class Main {\n    public static void main(String[] args) throws Exception {\n        Point p1 = new Point(3, 4);\n        Point p2 = (Point) p1.clone();\n        p2.x = 99;\n        System.out.println(p1.x + \" \" + p2.x);\n        System.out.println(p1 == p2);\n    }\n}", "out": "3 99\nfalse"}, "warn": "If a class does not implement `Cloneable`, calling `super.clone()` throws `CloneNotSupportedException`."}, {"h": "finalize(), wait(), notify() and notifyAll()", "p": ["`finalize()` was called by the garbage collector before removing an object. It is deprecated since Java 9, so do not rely on it.", "`wait()`, `notify()` and `notifyAll()` are used for inter-thread communication. They are final and are covered in the Multithreading unit."]}, {"h": "Object as a universal type", "p": ["Since every class is a child of `Object`, an `Object` reference can hold anything: a String, an Integer, your own class. This is how methods and old-style collections accept any type.", "Use `getClass()` or `instanceof` to find the real type when you need it."], "code": {"f": "Main.java", "c": "public class Main {\n    static void show(Object o) { System.out.println(\"Got: \" + o); }\n    public static void main(String[] args) {\n        show(\"Java\");\n        show(42);\n        show(3.5);\n        Object[] items = {\"text\", 10, 2.5, 'c'};\n        for (Object o : items) System.out.println(o.getClass().getSimpleName());\n    }\n}", "out": "Got: Java\nGot: 42\nGot: 3.5\nString\nInteger\nDouble\nCharacter"}}], "analogy": "Think of Object as the 'human being' template: every person (class) automatically has a name tag, a way to introduce themselves (toString), a way to tell if they are the same person as someone else (equals), and an ID number (hashCode).", "hinglish": "Bhai simple hai: Java mein har class ka baap Object hai. Isliye har object pe toString, equals, hashCode jaise methods milte hain. Apni class mein inhe override karo taaki print readable ho aur compare sahi chale. equals override karo to hashCode bhi karo, warna HashSet mein gadbad.", "uses": ["Printing objects in a readable form (toString)", "Comparing objects by content (equals)", "Storing objects in HashSet and HashMap (hashCode + equals)", "Writing generic code that accepts any type (Object reference)", "Finding the real class at runtime (getClass)"], "pros": ["One common base gives every class the same basic behaviour", "Allows generic methods that accept any object", "Methods can be overridden to suit your class"], "cons": ["Default toString, equals and hashCode are rarely useful as they are", "Using Object everywhere loses type safety and needs casting", "clone() is awkward (shallow copy, Cloneable marker)"], "mistakes": ["Overriding equals() but not hashCode()", "Writing `equals(Student s)` instead of `equals(Object o)`: that overloads, it does not override", "Using `==` to compare Strings or objects when content comparison is needed", "Forgetting `@Override`, so a typo silently creates a new method"], "remember": ["Object is the root class of Java, in java.lang", "Every class extends Object by default", "toString(): default is ClassName@hash; override it for readable output", "equals(): default is the same as ==; override to compare content", "hashCode(): override together with equals()", "equal objects must have equal hashCodes", "getClass(): returns the runtime class, final", "clone(): needs Cloneable, gives a shallow copy", "finalize(): deprecated", "wait/notify/notifyAll: thread communication, final", "An Object reference can hold any object"]};
  function ins(key, afterH, secs){ const L=LESSONS[key] && LESSONS[key].sections; if(!L) return; const i=L.findIndex(x=>x.h===afterH); L.splice(i<0?L.length:i+1,0,...secs); }
  ins('u6-t1','Buffered streams: BufferedReader and BufferedWriter',[{"h": "Binary I/O: DataOutputStream and DataInputStream", "p": ["Text streams store characters. Binary streams store the raw bytes of primitive values. `DataOutputStream` writes `int`, `double`, `boolean` and `String` (as UTF) in binary form, and `DataInputStream` reads them back.", "A binary file is smaller and faster to read for numbers, but you cannot open it in a text editor and read it."], "code": {"f": "Main.java", "c": "import java.io.*;\npublic class Main {\n    public static void main(String[] args) throws IOException {\n        try (DataOutputStream out = new DataOutputStream(new FileOutputStream(\"data.bin\"))) {\n            out.writeInt(101);\n            out.writeDouble(95.5);\n            out.writeUTF(\"Ravi\");\n            out.writeBoolean(true);\n        }\n        try (DataInputStream in = new DataInputStream(new FileInputStream(\"data.bin\"))) {\n            int id = in.readInt();\n            double marks = in.readDouble();\n            String name = in.readUTF();\n            boolean pass = in.readBoolean();\n            System.out.println(id + \" \" + marks + \" \" + name + \" \" + pass);\n        }\n        System.out.println(\"File size: \" + new File(\"data.bin\").length() + \" bytes\");\n    }\n}", "out": "101 95.5 Ravi true\nFile size: 19 bytes"}, "warn": "Read the values in exactly the same order and type you wrote them. A wrong order gives garbage values or an `EOFException`."}, {"h": "Text I/O vs binary I/O", "p": ["Choose the stream based on what the file holds."], "table": {"head": ["Point", "Text I/O", "Binary I/O"], "rows": [["Classes", "`FileReader`, `FileWriter`, `BufferedReader`", "`DataInputStream`, `DataOutputStream`, `FileInputStream`"], ["Stores", "Characters", "Raw bytes of values"], ["Readable in editor", "Yes", "No"], ["Good for", "Names, messages, logs", "Numbers, images, objects"], ["Example", "`writer.write(\"101\")`", "`out.writeInt(101)`"]]}}]);
  ins('u3-t6','Rules of overriding',[{"h": "Overriding and exceptions", "p": ["When you override a method, the throws clause has rules. The overriding method may throw: no exception, the same exception, a narrower (child) checked exception, or any unchecked exception.", "In the example, the parent throws `IOException`. The child throws the narrower `FileNotFoundException`, and an unchecked `ArithmeticException` is always allowed."], "code": {"f": "Main.java", "c": "import java.io.*;\nclass Parent {\n    void read() throws IOException { System.out.println(\"Parent reads\"); }\n    void calc() { System.out.println(\"Parent calc\"); }\n}\nclass Child extends Parent {\n    @Override\n    void read() throws FileNotFoundException { System.out.println(\"Child reads (narrower exception)\"); }\n    @Override\n    void calc() throws ArithmeticException { System.out.println(\"Child calc (unchecked is fine)\"); }\n}\npublic class Main {\n    public static void main(String[] args) throws IOException {\n        Parent p = new Child();\n        p.read();\n        p.calc();\n    }\n}", "out": "Child reads (narrower exception)\nChild calc (unchecked is fine)"}}, {"h": "What is not allowed: a broader checked exception", "p": ["The overriding method cannot throw a new or broader checked exception than the parent method. Here the parent `calc()` throws nothing, so the child cannot add `IOException`."], "code": {"f": "Main.java", "c": "import java.io.*;\nclass Parent {\n    void calc() { }\n}\nclass Child extends Parent {\n    @Override\n    void calc() throws IOException { }\n}\npublic class Main { public static void main(String[] a) { } }", "out": "error: calc() in Child cannot override calc() in Parent\n  overridden method does not throw IOException"}, "tip": "Why? Code that uses the parent type only handles the parent's exceptions. A surprise checked exception from the child would break that code."}]);

  PRACTICE['u3-t13']=[["easy", "Create a class Book and print an object of it without overriding toString(). Then override toString() to print the title and price.", "Override: public String toString()"], ["medium", "Create two Student objects with the same name and roll. Compare them using == and equals() before and after overriding equals().", "== compares references"], ["medium", "Put two equal Student objects in a HashSet. Show the size with only equals() overridden, then after adding hashCode().", "Use Objects.hash(name, roll)"], ["hard", "Write a method that takes an Object and prints its class name using getClass(). Call it with a String, an Integer and your own class.", "getClass().getSimpleName()"]];
