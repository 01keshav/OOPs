pdates for many years."], "tip": "Java 8 is the most asked version in interviews because of lambdas and streams.", "table": {"head": ["Version", "Year", "Big feature"], "rows": [["JDK 1.0", "1996", "First release, applets"], ["Java 2 (1.2)", "1998", "Collections, Swing"], ["Java 5", "2004", "Generics, enhanced for, annotations"], ["Java 8 (LTS)", "2014", "Lambda, Stream API"], ["Java 9", "2017", "Module system"], ["Java 11 (LTS)", "2018", "var in lambda, HTTP client"], ["Java 17 (LTS)", "2021", "Sealed classes, records"], ["Java 21 (LTS)", "2023", "Virtual threads"]]}}, {"h": "What are Java buzzwords?", "p": ["Buzzwords are the key features that make Java popular. The original Sun white paper listed 11 of them: Simple, Object-Oriented, Distributed, Robust, Secure, Architecture-Neutral, Portable, Interpreted, High Performance, Multithreaded and Dynamic. Many books also add Platform Independent as a 12th point, so know both counts."], "table": {"head": ["Buzzword", "One-line meaning"], "rows": [["Simple", "Clean syntax, no pointers, auto memory cleanup"], ["Object-Oriented", "Programs built from classes and objects"], ["Platform Independent", "Same bytecode runs on any OS"], ["Secure", "No pointers, bytecode verifier, sandbox"], ["Robust", "Strong type checking, exceptions, garbage collection"], ["Multithreaded", "Many tasks run at once inside one program"], ["Architecture Neutral", "Bytecode not tied to one CPU"], ["Portable", "Same size of data types on all machines"], ["High Performance", "JIT compiler speeds up bytecode"], ["Distributed", "Built-in networking, RMI"], ["Dynamic", "Classes loaded at runtime when needed"], ["Interpreted", "JVM executes bytecode"]]}}, {"h": "Platform independent, architecture neutral, portable", "p": ["A C program is compiled into machine code for one CPU and one OS. Move it to another system and you must recompile. Java compiles to bytecode instead. Bytecode is not for any real CPU - it is for the imaginary JVM machine.", "Each OS has its own JVM. All JVMs understand the same bytecode. So the same .class file runs on Windows, Linux and macOS. That is platform independence. Because bytecode does not depend on a CPU type, Java is also architecture neutral.", "Java is portable too: an int is always 4 bytes on every machine. In C, the size of int can change between systems."], "tip": "Java is platform independent, but the JVM is platform dependent. Remember this one - it is asked often.", "viz": {"type": "chain", "items": ["Hello.java", "javac", "Hello.class (bytecode)", "JVM (any OS)", "Output"], "caption": "Compile once, run on any JVM"}}, {"h": "Simple, object-oriented, secure and robust", "p": ["Simple: Java removed hard parts of C++ such as pointers, operator overloading, header files and multiple inheritance of classes. Garbage collector frees unused memory for you.", "Object-oriented: everything except the 8 primitive values lives inside a class. Java supports encapsulation, inheritance, polymorphism and abstraction.", "Secure: no explicit pointers, so you cannot touch random memory. The bytecode verifier checks code before running, and the security manager/sandbox limits what untrusted code can do.", "Robust: strong type checking at compile time, exception handling for run-time errors, and automatic garbage collection. A Java program usually reports an error instead of crashing the whole machine."], "code": {"f": "RobustDemo.java", "c": "public class RobustDemo {\n    public static void main(String[] args) {\n        int[] a = new int[3];\n        try {\n            a[5] = 10;               // invalid index\n        } catch (ArrayIndexOutOfBoundsException e) {\n            System.out.println(\"Caught: \" + e.getMessage());\n        }\n        System.out.println(\"Program keeps running\");\n    }\n}", "out": "Caught: Index 5 out of bounds for length 3\nProgram keeps running"}}, {"h": "Multithreaded, distributed, dynamic", "p": ["Multithreaded: a thread is a small path of execution. Java has built-in thread support (Thread class, Runnable), so one program can download, play and draw at the same time.", "Distributed: Java has a rich networking API (java.net), plus RMI and sockets, so programs can work across computers.", "Dynamic: classes are loaded only when needed, even at run time, using the class loader. New code can be added to a running program without restarting everything."], "tip": "Multithreading and dynamic loading are the two buzzwords students most often forget in the list.", "code": {"f": "ThreadDemo.java", "c": "public class ThreadDemo {\n    public static void main(String[] args) throws Exception {\n        Thread t = new Thread(() -> System.out.println(\"Hello from thread\"));\n        t.start();\n        t.join();                    // wait for t to finish\n        System.out.println(\"Main done\");\n    }\n}", "out": "Hello from thread\nMain done"}}, {"h": "High performance and interpreted", "p": ["Java source is compiled to bytecode by javac, and then the JVM interprets that bytecode. Pure interpretation is slow, so the JVM has a JIT (Just-In-Time) compiler. It finds the hot (often-used) code and converts it into native machine code while the program runs. The next calls use this fast native code.", "So Java is both compiled and interpreted: compiled to bytecode, interpreted/JIT-compiled by the JVM. It is slower than C in raw speed, but much faster than old pure interpreters."], "warn": "Do not write 'Java is only interpreted' or 'only compiled'. Correct answer: both.", "viz": {"type": "chain", "items": ["Source code", "javac (compiler)", "Bytecode", "JVM interpreter + JIT", "Machine code"], "caption": "Both compiled and interpreted"}}], "analogy": "Java is like a universal travel adapter. You carry one plug (bytecode) and it works in any country (OS) as long as a local socket (JVM) is there.", "hinglish": "Bhai Java ko James Gosling ne Sun Microsystems me banaya tha, pehle naam Oak tha. Isse ek baar likho aur kahin bhi chalao (WORA), kyunki code bytecode ban ke JVM pe chalta hai. Buzzwords exam me pakka aate hain, to list yaad rakho.", "mistakes": ["Writing that Java is 'platform independent' because the JVM is platform independent. The JVM is platform dependent; bytecode is what is independent.", "Saying Java was made for the internet. It was made for electronic devices under the Green Project.", "Saying Java is pure object-oriented. It has 8 primitive types that are not objects, so it is not 100% pure OOP.", "Mixing up the owner: Java was created by Sun Microsystems, and it is owned by Oracle today."], "remember": ["Java was created by James Gosling and team (Green Project) at Sun Microsystems, started 1991, released 1995.", "First name was Oak; renamed Java in 1995 (Oak was a trademarked name).", "Java was first meant for consumer electronic devices, then became popular because of the internet.", "Oracle Corporation acquired Sun Microsystems in 2010 and now owns Java.", "LTS versions: 8, 11, 17, 21. A new Java version comes every 6 months.", "WORA = Write Once, Run Anywhere.", "Compiler javac converts .java source into .class bytecode.", "Bytecode is run by the JVM. Bytecode is platform independent; JVM is platform dependent.", "Simple: no pointers, no operator overloading, no multiple inheritance of classes, garbage collection.", "Robust: strong typing, exception handling, garbage collection.", "Secure: no pointers, bytecode verifier, class loader, sandbox.", "Multithreaded: many threads run in one program. Distributed: networking, RMI.", "Dynamic: classes loaded at run time. High performance: JIT compiler.", "Java is both compiled (to bytecode) and interpreted (by the JVM)."], "def": "Java is a high-level, class-based, object-oriented programming language. It is used to build desktop apps, web back-ends, Android apps, banking systems and big-data tools.", "uses": ["Android apps and enterprise back-end systems", "Banking, insurance and e-commerce software", "Web servers and microservices (for example with Spring Boot)", "Big-data tools, desktop apps and embedded systems"], "pros": ["Platform independence through bytecode and the JVM", "Automatic memory management with garbage collection", "Very large standard library and a huge community", "Strong security: no explicit pointers, bytecode verification, class loader"], "cons": ["Slower start-up and higher memory use than native languages like C or C++", "Code is more verbose than in languages like Python", "Common mistake: saying Java is only interpreted. It is first compiled to bytecode, then the JVM runs it", "Common mistake: saying Sun still owns Java. Oracle does since 2010"]}, "u1-t2": {"tldr": "Procedural code is built from functions; OOP is built from objects that carry their own data.", "sections": [{"h": "What is a programming paradigm?", "p": [], "pts": ["Procedural: think in steps and functions (C, Pascal, early BASIC)", "Object-oriented: think in objects that hold data and behaviour (Java, C++, Python)"]}, {"h": "Procedural programming", "p": ["In procedural programming a program is a list of instructions grouped into procedures (functions). The program runs top to bottom, calling functions when needed. The focus is on what to do (the steps).", "Data is usually kept separate from functions, often as global variables. Any function can read or change that data."], "pts": ["Approach is top-down: break the big problem into smaller functions", "Functions are reusable, but data is not protected", "Examples: C, FORTRAN, COBOL, Pascal"], "viz": {"type": "chain", "items": ["Data (global)", "function 1", "function 2", "function 3"], "caption": "All functions work on shared data"}}, {"h": "Procedural style in action", "p": ["Here is a bank balance written in a procedural way (Java allows it with static methods and a shared variable). Notice that any code can change `balance`, even wrongly."], "warn": "No protection: balance became negative because nothing guards the data.", "code": {"f": "ProcDemo.java", "c": "public class ProcDemo {\n    static double balance = 1000;           // shared data\n\n    static void deposit(double amt)  { balance += amt; }\n    static void withdraw(double amt) { balance -= amt; }\n\n    public static void main(String[] args) {\n        deposit(500);\n        withdraw(200);\n        balance = -9999;                    // anyone can break it!\n        System.out.println(\"Balance: \" + balance);\n    }\n}", "out": "Balance: -9999.0"}}, {"h": "Object-oriented programming", "p": ["In OOP, a program is a group of objects that talk to each other. An object bundles its data (fields) and the functions that work on it (methods) in one unit. The blueprint of objects is called a class.", "The focus is on who does the work (objects), not just what steps are done. The approach is bottom-up: first build small, tested objects, then join them into a bigger system."], "pts": ["Real-world things (Student, Car, Account) map directly to classes", "Data is hidden and only changed through methods"], "table": {"head": ["Object: BankAccount"], "rows": [["data: balance (private)"], ["method: deposit()"], ["method: withdraw()"], ["method: getBalance()"]]}}, {"h": "The same problem in OOP", "p": ["Now the balance is `private` inside the class. Outside code cannot set it directly. It must call `deposit` or `withdraw`, and those methods can check the rules."], "tip": "Writing `a.balance = -9999;` in main would give a compile error because balance is private.", "code": {"f": "OopDemo.java", "c": "class Account {\n    private double balance = 1000;\n\n    void deposit(double amt) { balance += amt; }\n\n    void withdraw(double amt) {\n        if (amt <= balance) balance -= amt;\n        else System.out.println(\"Insufficient funds\");\n    }\n\n    double getBalance() { return balance; }\n}\n\npublic class OopDemo {\n    public static void main(String[] args) {\n        Account a = new Account();\n        a.deposit(500);\n        a.withdraw(5000);                   // rejected by the rule\n        System.out.println(\"Balance: \" + a.getBalance());\n    }\n}", "out": "Insufficient funds\nBalance: 1500.0"}}, {"h": "Why do we need OOP?", "p": ["When programs grow to lakhs of lines, procedural code becomes hard to manage: any function can touch any data, so one change can break many places. OOP was created to control this complexity."], "pts": ["Models real life naturally (objects with state and behaviour)", "Data security through encapsulation", "Code reuse through inheritance", "Flexibility through polymorphism (one name, many forms)", "Easy maintenance: change one class, others stay safe", "Teams can build different classes in parallel"]}, {"h": "The four pillars of OOP", "p": ["Almost every OOP question asks for these four ideas. You will study each one in detail in later units. For now, know one line for each."], "table": {"head": ["Pillar", "Meaning", "Real-life example"], "rows": [["Encapsulation", "Wrap data + methods, hide data", "Medicine capsule"], ["Inheritance", "Child class gets parent features", "Child inherits father's surname"], ["Polymorphism", "One name, many forms", "Person is student, son, friend"], ["Abstraction", "Show what, hide how", "Driving a car without engine knowledge"]]}}, {"h": "Procedural vs OOP - comparison", "p": ["Use this table directly in exam answers."], "table": {"head": ["Feature", "Procedural", "OOP"], "rows": [["Focus", "Functions / steps", "Objects / data"], ["Approach", "Top-down", "Bottom-up"], ["Data and functions", "Separate", "Bundled in class"], ["Data security", "Low, global data", "High, private data"], ["Code reuse", "Copy / call functions", "Inheritance, composition"], ["Real-world modelling", "Hard", "Natural"], ["Adding new features", "May change many functions", "Add or extend a class"], ["Examples", "C, Pascal", "Java, C++, Python"]]}}, {"h": "Advantages and limitations of OOP", "p": ["OOP is not magic. It has costs too, so a balanced answer earns marks."], "pts": ["Advantage: reuse, security, easy maintenance, modular design", "Advantage: good for large and long-living software", "Limitation: needs more planning and design before coding", "Limitation: more memory and a bit slower than simple procedural code for tiny programs", "Limitation: beginners need time to understand classes and objects"], "tip": "Java is not purely OOP because it has primitive types (int, char...) that are not objects. Still, we call it an object-oriented language."}], "analogy": "Procedural is a roadside stall where one open kitchen serves everything and anyone can touch anything. OOP is a restaurant where kitchen, billing and storage each have their own staff and rules.", "hinglish": "Bhai procedural me hum functions ke steps likhte hain aur data sab ke liye open rehta hai. OOP me data aur functions ek object ke andar band hote hain, to security aur reuse milta hai. Java OOP hai, C procedural.", "mistakes": ["Saying procedural is 'bad' and OOP is 'always better'. Small scripts are fine in procedural style.", "Writing that OOP is bottom-up and procedural is bottom-up too. Procedural = top-down, OOP = bottom-up.", "Confusing class and object. A class is just a design; memory is used when an object is created.", "Thinking encapsulation means only 'hiding'. It is bundling data and methods together; hiding comes through access control."], "remember": ["Procedural programming = program is a set of procedures/functions; focus on steps; top-down.", "OOP = program is a set of objects holding data and methods; focus on data; bottom-up.", "In procedural code data is global and unprotected; in OOP data is hidden inside objects.", "Class = blueprint; object = real instance of a class.", "Four pillars of OOP: Encapsulation, Inheritance, Polymorphism, Abstraction.", "Encapsulation: bundling data and methods and hiding data using private + getters/setters.", "Inheritance: new class reuses properties of an existing class (extends).", "Polymorphism: one name, many forms (overloading, overriding).", "Abstraction: show only essential details, hide implementation.", "OOP gives reuse, security, easier maintenance and natural real-world modelling.", "Examples: procedural - C, Pascal; OOP - Java, C++, Python.", "Java is not 100% pure OOP because of primitive data types."], "def": "A paradigm is a style or way of thinking about how to write programs. The same problem can be solved in different styles. Two common styles you must compare in exams are procedural programming and object-oriented programming (OOP).", "uses": ["Procedural: small scripts, simple utilities, system-level code", "OOP: large applications such as banking systems, games, GUIs and web back-ends"], "pros": ["Reusability through classes and inheritance", "Easier to maintain and extend large programs", "Data protection through encapsulation", "Models real-world things naturally"], "cons": ["Steeper learning curve for beginners", "Extra classes and structure make very small programs heavier than needed", "Careful design is required for class hierarchies", "Common mistake: thinking OOP just means writing classes. The real idea is bundling and protecting data with behaviour"]}, "u1-t3": {"tldr": "JDK = tools to write code, JRE = what is needed to run it, JVM = the engine that executes bytecode.", "sections": [{"h": "Why do we have three terms?", "p": [], "tip": "Remember: JDK > JRE > JVM (bigger contains smaller).", "table": {"head": ["JDK (develop + run)"], "rows": [["Dev tools: javac, jar, javadoc, jdb"], ["JRE (run only)"], ["JRE = JVM + class libraries"], ["JVM = executes bytecode"]]}}, {"h": "JVM - Java Virtual Machine", "p": ["The JVM is a software (virtual) computer that runs Java bytecode. It is the part that actually executes your program. Source code never goes to the CPU directly; it goes through the JVM.", "JVM is platform dependent: there is a separate JVM for Windows, Linux and macOS. But all of them understand the same bytecode. This gives Java its platform independence.", "A JVM does three jobs: load classes, verify and manage memory, and execute bytecode."], "pts": ["Input: .class file (bytecode)", "Output: program behaviour on the real machine", "Also does garbage collection and security checks"]}, {"h": "JVM architecture - the main parts", "p": ["Inside the JVM there are three big blocks. The class loader subsystem brings .class files into memory. The runtime data areas store everything while the program runs. The execution engine runs the instructions."], "pts": ["Class loader: loads, links (verify, prepare, resolve) and initialises classes", "Execution engine: interpreter, JIT compiler and garbage collector", "Native Method Interface connects to C/C++ libraries when needed"], "viz": {"type": "chain", "items": ["Class Loader", "Runtime Data Areas", "Execution Engine", "Native Interface / OS"], "caption": "Flow inside the JVM"}}, {"h": "JVM memory areas", "p": ["The JVM divides memory into areas. Exam questions often ask you to name them."], "tip": "Garbage collector works on the heap. When no reference points to an object, it becomes garbage and is freed.", "table": {"head": ["Area", "Stores", "Shared by threads?"], "rows": [["Method area / Metaspace", "Class info, static variables, constants", "Yes"], ["Heap", "All objects and arrays", "Yes"], ["Stack", "Method frames, local variables", "No (one per thread)"], ["PC register", "Address of current instruction", "No"], ["Native method stack", "Frames of native (C) methods", "No"]]}}, {"h": "JRE - Java Runtime Environment", "p": ["The JRE is the package needed only to run Java programs. It contains the JVM plus the core class libraries (java.lang, java.util, java.io and so on) and supporting files.", "An ordinary user who just wants to run a Java application needs only the JRE. It has no compiler, so you cannot compile new programs with it."], "pts": ["JRE = JVM + core libraries + supporting files", "Gives the run-time environment, not development tools", "Note: since Java 11, Oracle does not ship a separate JRE download; the JDK is used (a small runtime can be made with jlink)"]}, {"h": "JDK - Java Development Kit", "p": ["The JDK is the full kit for developers. It contains the JRE and all the tools to write, compile, debug and package programs. You install the JDK on your laptop to do Java coding."], "pts": ["JDK = JRE + development tools", "Available in editions like OpenJDK and Oracle JDK"], "table": {"head": ["Tool", "Purpose"], "rows": [["javac", "Compiles .java to .class"], ["java", "Starts the JVM and runs a class"], ["javadoc", "Makes HTML documentation"], ["jar", "Packs classes into a .jar file"], ["jdb", "Command line debugger"], ["javap", "Shows bytecode / class details"], ["jshell", "Try Java code line by line (REPL)"]]}}, {"h": "How they work together", "p": ["You write source code and the JDK compiler turns it to bytecode. When you run it, the JRE's class loader and JVM take over. The JVM interprets the bytecode and the JIT compiler turns hot code into fast native code."], "tip": "Line 1 prints the loader of your own class (app). Line 2 prints null because core classes like String are loaded by the bootstrap loader, which is native code.", "code": {"f": "JvmDemo.java", "c": "public class JvmDemo {\n    public static void main(String[] args) {\n        System.out.println(JvmDemo.class.getClassLoader().getName());\n        System.out.println(String.class.getClassLoader());\n        System.out.println(\"Running on a JVM\");\n    }\n}", "out": "app\nnull\nRunning on a JVM"}, "viz": {"type": "chain", "items": ["Hello.java", "javac (JDK)", "Hello.class", "JVM (in JRE)", "Output"], "caption": "Develop with JDK, run with JRE/JVM"}}, {"h": "JDK vs JRE vs JVM - comparison", "p": ["One table to revise before the exam."], "warn": "All three are platform dependent. Only bytecode is platform independent.", "table": {"head": ["Point", "JVM", "JRE", "JDK"], "rows": [["Full form", "Java Virtual Machine", "Java Runtime Environment", "Java Development Kit"], ["Purpose", "Executes bytecode", "Provides run-time environment", "Develop and run programs"], ["Contains", "Class loader, engine, memory", "JVM + libraries", "JRE + dev tools"], ["Has compiler (javac)?", "No", "No", "Yes"], ["Platform dependent?", "Yes", "Yes", "Yes"], ["Who needs it", "Part of JRE", "End user", "Developer"]]}}], "analogy": "JVM is your stomach that digests food, JRE is the plate, cutlery and you ready to eat, and JDK is the whole kitchen so you can cook and eat.", "hinglish": "Bhai JVM wo engine hai jo bytecode chalata hai. JRE me JVM aur libraries hoti hain, sirf program run karne ke liye. JDK me JRE ke saath javac jaise tools bhi hote hain, to developer ko JDK chahiye.", "mistakes": ["Saying JVM is platform independent. JVM is platform dependent, bytecode is independent.", "Believing JRE has the compiler. Only JDK has javac.", "Thinking the JVM compiles source code. javac compiles; the JVM runs bytecode.", "Mixing heap and stack: objects live on the heap, local variables and method calls on the stack."], "remember": ["JVM = Java Virtual Machine: runs bytecode; platform dependent; does memory management and GC.", "JRE = Java Runtime Environment = JVM + core libraries; used only to run programs.", "JDK = Java Development Kit = JRE + development tools (javac, jar, javadoc, jdb); used to develop programs.", "Relation: JDK contains JRE, JRE contains JVM.", "javac compiles .java into .class bytecode; java runs it on the JVM.", "JVM architecture: class loader subsystem, runtime data areas, execution engine.", "Class loading steps: loading, linking (verify, prepare, resolve), initialisation.", "Runtime data areas: method area, heap, stack, PC register, native method stack.", "Heap and method area are shared by all threads; stack and PC register are per thread.", "Execution engine = interpreter + JIT compiler + garbage collector.", "JIT converts frequently used bytecode to native machine code for speed.", "Bytecode is the same everywhere; each OS needs its own JVM implementation."], "def": "JDK, JRE and JVM sound alike but have different jobs. One runs bytecode, one gives libraries to run it, and one gives tools to write it. Think of them as three layers, each one sitting inside the next.", "uses": ["End users need a runtime to run Java applications", "Developers need the JDK to write, compile, package and debug code", "Servers run the JVM to host Java back-end applications"], "pros": ["The same bytecode runs on Windows, Linux and macOS", "JIT compilation gives good speed", "Built-in security checks and automatic memory management"], "cons": ["Installing only a runtime and then wondering why javac is not found", "Saying the JVM is platform independent. The bytecode is platform independent, the JVM itself is platform specific", "JVM start-up time and memory overhead for very small programs"]}, "u1-t4": {"tldr": "Data types decide what a variable can store; Java has 8 primitives plus reference types.", "sections": [{"h": "What are variables and data types?", "p": ["Declaration gives the type and name. Initialisation gives the first value. You can do both in one line."], "pts": ["Variable names can use letters, digits, _ and $, but cannot start with a digit", "Names are case sensitive: age and Age are different", "Keywords (int, class, static...) cannot be used as names", "Convention: camelCase for variables, e.g. studentName"], "code": {"f": "Basics.java", "c": "public class Basics {\n    public static void main(String[] args) {\n        int age;                 // declaration\n        age = 20;                // initialisation\n        double marks = 89.5;     // both together\n        char grade = 'A';\n        boolean passed = true;\n        String name = \"Keshav\";\n        System.out.println(name + \" \" + age + \" \" + marks + \" \" + grade + \" \" + passed);\n    }\n}", "out": "Keshav 20 89.5 A true"}, "viz": {"type": "tree", "root": "Java Data Types", "kids": ["Primitive (8 types)", "Non-primitive (reference)"], "caption": "Two main categories"}}, {"h": "Primitive data types - sizes and ranges", "p": ["Java has exactly 8 primitive types. They store the actual value directly and are not objects. Their size is fixed on every machine (this is why Java is portable)."], "tip": "Memory trick for whole numbers: 1, 2, 4, 8 bytes = byte, short, int, long. Default type for whole numbers is int; for decimals it is double.", "warn": "Default values apply only to instance and static variables. Local variables have NO default and must be initialised before use.", "table": {"head": ["Type", "Size", "Range / precision", "Default"], "rows": [["byte", "1 byte", "-128 to 127", "0"], ["short", "2 bytes", "-32,768 to 32,767", "0"], ["int", "4 bytes", "-2^31 to 2^31-1 (about +-2.1 billion)", "0"], ["long", "8 bytes", "-2^63 to 2^63-1", "0L"], ["float", "4 bytes", "about 6-7 decimal digits", "0.0f"], ["double", "8 bytes", "about 15-16 decimal digits", "0.0d"], ["char", "2 bytes", "0 to 65,535 (Unicode)", "'\\u0000'"], ["boolean", "JVM dependent (1 bit of info)", "true or false", "false"]]}}, {"h": "Integer types: byte, short, int, long", "p": ["These store whole numbers (no decimal part). Use `int` in most cases. Use `byte` and `short` to save memory in big arrays. Use `long` for very large values such as phone numbers, population or time in milliseconds; a long literal must end with `L`.", "If a value goes past the range, it does not give an error. It wraps around (overflow). You can write numbers in decimal, binary (0b), octal (0) and hex (0x), and use underscores for readability."], "warn": "Writing `long x = 3000000000;` is a compile error: the number is read as int first. Write 3000000000L.", "code": {"f": "IntegerTypes.java", "c": "public class IntegerTypes {\n    public static void main(String[] args) {\n        byte b = 127;\n        b++;                              // overflow\n        System.out.println(b);\n        int big = Integer.MAX_VALUE;\n        System.out.println(big + 1);      // wraps to negative\n        long pop = 1_400_000_000L;        // L suffix, underscores\n        System.out.println(pop);\n        System.out.println(0b101 + \" \" + 017 + \" \" + 0xFF);\n    }\n}", "out": "-128\n-2147483648\n1400000000\n5 15 255"}}, {"h": "Floating-point types: float and double", "p": ["These store numbers with a decimal part. `double` is the default and more precise. A `float` literal needs an `f` suffix, otherwise Java treats 3.14 as double and refuses to put it in a float.", "Floating-point numbers are stored in binary, so some decimals cannot be exact. For money, use `BigDecimal`, not float or double."], "warn": "`float f = 3.14;` gives error: possible lossy conversion from double to float.", "code": {"f": "FloatTypes.java", "c": "public class FloatTypes {\n    public static void main(String[] args) {\n        float f = 3.14f;\n        double d = 3.14;\n        System.out.println(f + \" \" + d);\n        System.out.println(0.1 + 0.2);        // not exactly 0.3\n        System.out.println(10 / 3);           // int division\n        System.out.println(10 / 3.0);         // double division\n        System.out.println(1.0f / 3);         // float precision\n    }\n}", "out": "3.14 3.14\n0.30000000000000004\n3\n3.3333333333333335\n0.33333334"}}, {"h": "char and boolean", "p": ["`char` holds one character in single quotes. It is 2 bytes because Java uses Unicode (UTF-16), so it can store letters from many languages. Internally a char is just a number (its Unicode code), so you can do arithmetic on it.", "`boolean` has only two values: `true` and `false`. It is used in conditions. Unlike C, Java does not allow 0 or 1 as a boolean."], "warn": "`boolean b = 1;` is an error in Java. Only true or false is allowed.", "code": {"f": "CharBool.java", "c": "public class CharBool {\n    public static void main(String[] args) {\n        char c = 'A';\n        System.out.println(c + 1);            // int arithmetic\n        System.out.println((char) (c + 1));   // cast back to char\n        char d = 65;                          // code point\n        char e = '\\u0041';                    // unicode escape\n        System.out.println(d + \" \" + e);\n        boolean ok = 5 > 3;\n        System.out.println(ok);\n    }\n}", "out": "66\nB\nA A\ntrue"}}, {"h": "Non-primitive (reference) data types", "p": ["Reference types are classes, interfaces, arrays and enums, for example `String`, `int[]`, `Scanner` or your own class `Student`. The variable does not hold the object itself. It holds a reference (address) to the object stored in heap memory.", "The default value of any reference variable is `null`, which means it points to nothing. Using a null reference to call a method causes NullPointerException."], "code": {"f": "RefDemo.java", "c": "public class RefDemo {\n    public static void main(String[] args) {\n        String s1 = \"hi\";\n        String s2 = new String(\"hi\");\n        System.out.println(s1 == s2);         // compares references\n        System.out.println(s1.equals(s2));    // compares content\n        int[] a = {1, 2, 3};\n        int[] b = a;                          // same object\n        b[0] = 99;\n        System.out.println(a[0]);\n        String n = null;\n        System.out.println(n);\n    }\n}", "out": "false\ntrue\n99\nnull"}, "table": {"head": ["Point", "Primitive", "Reference"], "rows": [["Stores", "Actual value", "Address of object"], ["Memory", "Stack (as local)", "Object on heap"], ["Size", "Fixed", "Depends on object"], ["Default", "0 / false", "null"], ["Has methods?", "No", "Yes"], ["Examples", "int, char", "String, arrays, classes"]]}}, {"h": "Type conversion: widening and narrowing", "p": ["Sometimes you assign one type to another. Java has two kinds of conversion.", "Widening (implicit) goes from a smaller to a larger type, so no data is lost. Java does it automatically: byte -> short -> int -> long -> float -> double (char -> int also). Narrowing (explicit casting) goes from larger to smaller. Data can be lost, so you must write the cast yourself using `(type)`.", "Also remember type promotion: in an expression, byte, short and char are promoted to int first. So `byte + byte` gives an int."], "warn": "Narrowing cuts the decimal part, it does not round: (int) 9.99 is 9.", "code": {"f": "Casting.java", "c": "public class Casting {\n    public static void main(String[] args) {\n        int i = 10;\n        double d = i;                 // widening, automatic\n        System.out.println(d);\n        double pi = 9.99;\n        int x = (int) pi;             // narrowing, cast needed\n        System.out.println(x);        // fraction cut, not rounded\n        int big = 130;\n        byte b = (byte) big;          // overflow in narrowing\n        System.out.println(b);\n        byte p = 10, q = 20;\n        int sum = p + q;              // promoted to int\n        System.out.println(sum);\n    }\n}", "out": "10.0\n9\n-126\n30"}, "viz": {"type": "chain", "items": ["byte", "short", "int", "long", "float", "double"], "caption": "Widening direction (automatic). Reverse needs a cast."}}, {"h": "Types of variables: local, instance, static", "p": ["Based on where it is declared, a variable is one of three kinds.", "Local variable: declared inside a method, constructor or block. It lives only while that code runs, is stored on the stack and has no default value. Instance variable: declared in a class but outside methods and without `static`. Every object gets its own copy; it lives on the heap and gets a default value. Static variable: declared with `static` in a class. Only one copy exists and it is shared by all objects; it belongs to the class."], "code": {"f": "VarKinds.java", "c": "public class VarKinds {\n    int id;                       // instance variable\n    static int count = 0;         // static variable\n\n    VarKinds() { count++; }\n\n    public static void main(String[] args) {\n        VarKinds a = new VarKinds();\n        VarKinds b = new VarKinds();\n        a.id = 1;\n        int local = 5;            // local variable\n        System.out.println(a.id + \" \" + b.id);       // each has own id\n        System.out.println(VarKinds.count);          // shared count\n        System.out.println(local);\n    }\n}", "out": "1 0\n2\n5"}, "table": {"head": ["Point", "Local", "Instance", "Static"], "rows": [["Declared", "Inside method", "In class, no static", "In class with static"], ["Copies", "One per call", "One per object", "One per class"], ["Default value", "None", "Yes (0, null...)", "Yes (0, null...)"], ["Access with", "Name only", "Object reference", "ClassName.var"], ["Lives until", "Method ends", "Object is garbage collected", "Class unloaded"]]}}, {"h": "Scope and lifetime of variables", "p": ["Scope is the area of the program where a variable can be used. Lifetime is how long it stays in memory. In Java, a variable is visible from its declaration to the end of the block `{ }` where it was declared.", "A variable declared inside a loop or if-block is not visible outside it. You also cannot declare a local variable with the same name as another local variable that is still in scope (no shadowing between locals). A local can share a name with an instance variable; the local then hides the field, and `this.name` reaches the field."], "tip": "Use `final` to make a constant, e.g. `final double PI = 3.14159;`. Its value cannot change after assignment.", "warn": "Using a local variable before giving it a value is a compile error: variable might not have been initialized.", "code": {"f": "ScopeDemo.java", "c": "public class ScopeDemo {\n    int x = 100;                          // instance variable\n\n    void show() {\n        int x = 5;                        // hides the field\n        System.out.println(x + \" \" + this.x);\n    }\n\n    public static void main(String[] args) {\n        for (int i = 0; i < 2; i++) {\n            int sq = i * i;               // block scope\n            System.out.println(sq);\n        }\n        // System.out.println(i);         // error: i not visible here\n        new ScopeDemo().show();\n    }\n}", "out": "0\n1\n5 100"}}], "analogy": "Variables are labelled kitchen containers. Small box for spices (int), big box for flour (double), a yes/no tin (boolean). The label is the variable name; the container size is the data type.", "hinglish": "Bhai data type batata hai ki variable me kya aur kitna data aayega. Java me 8 primitive types hain aur baaki sab (String, array, class) reference types hain. Chhote se bade me conversion apne aap hota hai, bade se chhote me cast likhna padta hai. Local variable ko value dena zaroori hai, instance aur static ko default value milti hai.", "mistakes": ["Writing `float f = 3.14;` or `long l = 3000000000;`. Missing f / L suffix gives a compile error.", "Thinking (int) 9.99 gives 10. Casting truncates, so the answer is 9.", "Using a local variable without initialising it. Only fields get default values.", "Comparing Strings with `==` instead of `.equals()`.", "Thinking boolean can be 0 or 1 like in C."], "remember": ["Variable = named memory location; data type decides size and kind of value.", "Java is statically typed: declare the type before use.", "8 primitive types: byte(1), short(2), int(4), long(8), float(4), double(8), char(2), boolean.", "Default type of whole number literal = int; of decimal literal = double.", "long literal needs L suffix; float literal needs f suffix.", "char is 2 bytes, Unicode (UTF-16); boolean only true/false (no 0/1).", "Reference types: String, arrays, classes, interfaces; hold address of object on heap; default null.", "Widening (automatic): small -> large type. Narrowing (explicit cast): large -> small, may lose data.", "Type promotion: byte/short/char become int in expressions.", "Local variable: inside method, no default value, stack. Instance variable: per object, heap, default value. Static variable: one per class, shared.", "Scope = region where variable is visible, usually the enclosing { } block.", "Variable naming: letters, digits, _ and $; cannot start with a digit; cannot be a keyword; camelCase by convention.", "final variable = constant, cannot be reassigned."], "def": "A variable is a named place in memory that stores a value. A data type tells Java what kind of value the variable can hold and how much memory it needs. Java is statically typed: you must declare the type before using a variable, and the type cannot change later.", "uses": ["Storing user input, calculation results and object state", "Choosing the right type saves memory (for example byte or short for small values) and avoids overflow"], "pros": ["Type checking catches many errors at compile time", "Primitives are fast and memory efficient", "Clear, predictable sizes on every platform"], "cons": ["Writing float f = 5.5; without the letter f. Decimals are double by default, so this fails", "Integer overflow: an int that goes past its maximum silently wraps around", "Using a local variable without initialising it", "Forgetting that String is a class (reference type), not a primitive"]}, "u4-t1": {"tldr": "Errors are serious JVM problems you cannot fix; exceptions are problems your program can catch and handle.", "sections": [{"h": "What is an exception?", "p": ["In Java an exception is an object. When something goes wrong, the JVM (or your code) creates an exception object, fills it with details (type, message, stack trace) and hands it to the runtime system. This is called throwing an exception."], "pts": ["If nobody handles it, the program stops and prints a stack trace", "Handling it lets the program recover or end cleanly", "All exception objects are instances of classes under `java.lang.Throwable`"], "code": {"f": "Main.java", "c": "public class Main {\n    public static void main(String[] args) {\n        System.out.println(\"Start\");\n        int a = 10 / 0;   // exception thrown here\n        System.out.println(\"End\");   // never runs\n    }\n}", "out": "Start\nException in thread \"main\" java.lang.ArithmeticException: / by zero\n\tat Main.main(Main.java:4)"}}, {"h": "Why do we handle exceptions?", "p": ["Without handling, one small problem kills the whole program and the lines after it never run. With handling, we catch the problem, show a friendly message and continue.", "Good exception handling keeps the normal logic separate from the error logic and keeps the program alive."], "pts": ["Prevents abrupt program termination", "Separates error-handling code from normal code", "Lets us report meaningful messages to the user", "Helps resources (files, connections) get closed properly"], "viz": {"type": "chain", "items": ["Normal code", "Problem occurs", "Exception object", "Handler (catch)", "Program continues"], "caption": "Flow of an exception"}}, {"h": "The Throwable hierarchy", "p": ["Everything that can be thrown is a `Throwable`. It has two direct children: `Error` and `Exception`. Only objects of `Throwable` (or its subclasses) can be used with `throw` and `catch`.", "`Exception` further splits into `RuntimeException` (unchecked) and all other exceptions like `IOException` (checked). `Error` and `RuntimeException` are both unchecked."], "tip": "`Throwable` has useful methods: `getMessage()`, `printStackTrace()`, `getCause()`, `toString()`.", "code": {"f": "Main.java", "c": "public class Main {\n    public static void main(String[] args) {\n        Class<?> c = ArithmeticException.class;\n        while (c != null) {\n            System.out.println(c.getSimpleName());\n            c = c.getSuperclass();\n        }\n    }\n}", "out": "ArithmeticException\nRuntimeException\nException\nThrowable\nObject"}, "viz": {"type": "tree", "root": "Throwable", "kids": ["Error", "Exception"], "caption": "Top of the hierarchy (java.lang)"}}, {"h": "Error: serious JVM problems", "p": ["An `Error` shows a serious problem in the JVM or system, not in your logic. Examples: `OutOfMemoryError` (heap full), `StackOverflowError` (too deep recursion), `VirtualMachineError`, `AssertionError`.", "Errors are unchecked and normally not handled. The program usually cannot recover, so the best fix is to correct the code (for example, stop infinite recursion)."], "pts": ["Belongs to `java.lang.Error`", "Caused by the environment/JVM, not by user input", "Not required to be caught or declared", "Technically catchable, but not recommended"], "warn": "Catching an `Error` only to demonstrate is fine. In real code do not hide it; fix the root cause.", "code": {"f": "Main.java", "c": "public class Main {\n    static void recurse() { recurse(); }   // never stops\n    public static void main(String[] args) {\n        try {\n            recurse();\n        } catch (StackOverflowError e) {\n            System.out.println(\"Caught: \" + e.getClass().getName());\n        }\n    }\n}", "out": "Caught: java.lang.StackOverflowError"}, "viz": {"type": "tree", "root": "Error", "kids": ["OutOfMemoryError", "StackOverflowError", "AssertionError", "NoClassDefFoundError"], "caption": "Common Errors"}}, {"h": "Exception: problems your program can handle", "p": ["An `Exception` represents a condition that a reasonable program may want to catch and recover from. Wrong user input, missing file, network down: all are exceptions.", "Exceptions are of two kinds: checked (compiler forces you to handle) and unchecked (compiler does not force you). Each has its own rules, explained next."], "pts": ["Belongs to `java.lang.Exception`", "Caused by program logic, user input or external resources", "Can and should be handled with `try-catch` or declared with `throws`"], "viz": {"type": "tree", "root": "Exception", "kids": ["IOException", "SQLException", "RuntimeException", "ClassNotFoundException"], "caption": "Exception and some children"}}, {"h": "Checked exceptions", "p": ["A checked exception is checked by the compiler at compile time. If code can throw it, you must either catch it with `try-catch` or declare it with `throws`. Otherwise the program will not compile.", "All subclasses of `Exception` except `RuntimeException` (and its children) are checked. They usually come from outside your control: files, network, database."], "pts": ["Examples: `IOException`, `FileNotFoundException`, `SQLException`, `ClassNotFoundException`, `InterruptedException`", "Compiler enforces the 'catch or declare' rule", "Use for recoverable situations the caller must think about"], "warn": "Remove the `try-catch` and the compiler gives: `unreported exception FileNotFoundException; must be caught or declared to be thrown`.", "code": {"f": "Main.java", "c": "import java.io.FileReader;\nimport java.io.FileNotFoundException;\n\npublic class Main {\n    public static void main(String[] args) {\n        try {\n            FileReader fr = new FileReader(\"missing.txt\");\n        } catch (FileNotFoundException e) {\n            System.out.println(\"Caught: \" + e.getClass().getSimpleName());\n        }\n    }\n}", "out": "Caught: FileNotFoundException"}, "viz": {"type": "chain", "items": ["Code that can throw", "Compiler check", "Handle or declare", "Compiles"], "caption": "Checked exception = compile-time check"}}, {"h": "Unchecked exceptions", "p": ["Unchecked exceptions are `RuntimeException` and its subclasses. The compiler does not force you to handle them. They happen at run time, mostly because of programmer mistakes.", "`Error` and its subclasses are also unchecked. Best practice: avoid unchecked exceptions by writing correct code (check for null, check array length), and catch them only where you can do something useful."], "pts": ["Examples: `ArithmeticException`, `NullPointerException`, `ArrayIndexOutOfBoundsException`, `NumberFormatException`, `ClassCastException`", "No compile-time check", "Usually bugs in logic"], "code": {"f": "Main.java", "c": "public class Main {\n    public static void main(String[] args) {\n        int[] arr = {1, 2, 3};\n        try {\n            System.out.println(arr[5]);\n        } catch (ArrayIndexOutOfBoundsException e) {\n            System.out.println(\"Caught: \" + e.getMessage());\n        }\n    }\n}", "out": "Caught: Index 5 out of bounds for length 3"}, "viz": {"type": "tree", "root": "RuntimeException", "kids": ["ArithmeticException", "NullPointerException", "IndexOutOfBoundsException", "IllegalArgumentException", "ClassCastException"], "caption": "Unchecked exceptions"}}, {"h": "Error vs Exception: quick comparison", "p": ["Both are children of `Throwable`, but they are used for very different situations."], "table": {"head": ["Point", "Error", "Exception"], "rows": [["Package", "java.lang.Error", "java.lang.Exception"], ["Cause", "JVM / system problem", "Program or input problem"], ["Recoverable?", "Usually no", "Usually yes"], ["Checked?", "Unchecked", "Checked and unchecked"], ["Should we catch?", "Normally no", "Yes, where meaningful"], ["Examples", "OutOfMemoryError, StackOverflowError", "IOException, ArithmeticException"]]}}], "analogy": "A flat tyre on a trip is an exception: you can fix it and continue. The road collapsing under you is an error: nothing you do in the car will help.", "hinglish": "Bhai simple hai: Throwable ke do bachhe hain, Error aur Exception. Error JVM ki badi problem hai (jaise memory khatam), usse hum handle nahi karte. Exception wo problem hai jo program handle kar sakta hai, jaise 10/0 ya file na milna. Checked exception compiler pakadta hai, unchecked run time pe aata hai.", "mistakes": ["Thinking all exceptions are checked: `RuntimeException` and its children are unchecked.", "Catching `Error` and ignoring it; it hides real JVM problems.", "Believing `Error` is a child of `Exception`: both are siblings under `Throwable`.", "Confusing `FileNotFoundException` (checked) with `ArithmeticException` (unchecked) in exam answers."], "remember": ["Exception = unwanted event that disturbs normal program flow at run time.", "Exception handling = a way to handle run-time problems and keep the program flow normal.", "Root class of all exceptions/errors: `java.lang.Throwable`.", "`Throwable` has two children: `Error` and `Exception`.", "`Error`: serious JVM/system problem (OutOfMemoryError, StackOverflowError). Unchecked, not handled normally.", "`Exception`: recoverable problem. Can be handled.", "Checked exception: checked at compile time; must catch or declare (IOException, SQLException).", "Unchecked exception: `RuntimeException` and subclasses; not checked by compiler (ArithmeticException, NullPointerException).", "`Error` is also unchecked.", "Unhandled exception: program terminates and stack trace is printed.", "Useful methods: `getMessage()`, `printStackTrace()`, `toString()`, `getCause()`.", "Only `Throwable` objects can be thrown or caught."], "def": "An exception is an unwanted event that happens while a program is running and breaks its normal flow. Examples: dividing by zero, opening a file that does not exist, using an index outside an array.", "uses": ["Handling invalid input, missing files, network failures and database errors gracefully", "Keeping a program running instead of crashing"], "pros": ["Separates error handling from normal logic", "Makes programs robust", "Stack trace helps debugging"], "cons": ["Trying to catch Errors as if they were normal exceptions", "Confusing checked and unchecked exceptions", "Ignoring exceptions silently"]}, "u4-t2": {"tldr": "try holds risky code, catch handles the exception, finally runs cleanup code every time.", "sections": [{"h": "What is try-catch-finally?", "p": ["Syntax: `try { ... } catch (ExceptionType e) { ... } finally { ... }`. A `try` must be followed by at least one `catch` or a `finally` (or be a try-with-resources)."], "pts": ["`try`: code that may throw an exception", "`catch`: handles one type of exception", "`finally`: cleanup, runs whether or not an exception happened"], "code": {"f": "Main.java", "c": "public class Main {\n    public static void main(String[] args) {\n        try {\n            int r = 10 / 0;\n            System.out.println(r);\n        } catch (ArithmeticException e) {\n            System.out.println(\"Cannot divide by zero\");\n        } finally {\n            System.out.println(\"Done\");\n        }\n        System.out.println(\"Program continues\");\n    }\n}", "out": "Cannot divide by zero\nDone\nProgram continues"}, "viz": {"type": "chain", "items": ["try { risky }", "catch { handle }", "finally { cleanup }"], "caption": "Order of blocks"}}, {"h": "The try block", "p": ["Put only the code that may throw an exception inside `try`. The moment an exception is thrown, Java stops executing the rest of the `try` block and jumps to the matching `catch`.", "Variables declared inside `try` are local to it. You cannot use them in `catch` or `finally`."], "warn": "Do not wrap the whole program in one big `try`. Keep it small so you know which line failed.", "code": {"f": "Main.java", "c": "public class Main {\n    public static void main(String[] args) {\n        try {\n            System.out.println(\"Line 1\");\n            int x = Integer.parseInt(\"abc\");   // throws here\n            System.out.println(\"Line 2\");      // skipped\n        } catch (NumberFormatException e) {\n            System.out.println(\"Bad number\");\n        }\n    }\n}", "out": "Line 1\nBad number"}}, {"h": "The catch block", "p": ["A `catch` block receives the exception object. Its parameter type decides which exceptions it handles. It also handles all subclasses of that type.", "Inside `catch` you can print `e.getMessage()` (short text), `e.toString()` (class + message) or `e.printStackTrace()` (full trace)."], "pts": ["`getMessage()` gives only the message", "`toString()` gives class name and message", "`printStackTrace()` prints the full call trace to the error stream"], "tip": "Catching the parent type `Exception` also catches every child, but it is less precise.", "code": {"f": "Main.java", "c": "public class Main {\n    public static void main(String[] args) {\n        try {\n            String s = null;\n            System.out.println(s.length());\n        } catch (NullPointerException e) {\n            System.out.println(\"Caught NullPointerException\");\n        }\n        try {\n            int[] a = new int[2];\n            a[2] = 5;\n        } catch (Exception e) {\n            System.out.println(e);\n        }\n    }\n}", "out": "Caught NullPointerException\njava.lang.ArrayIndexOutOfBoundsException: Index 2 out of bounds for length 2"}}, {"h": "The finally block", "p": ["`finally` contains cleanup code such as closing a file, a database connection or a network socket. It runs whether an exception occurred or not, and whether it was caught or not.", "It is optional. It is placed after all `catch` blocks."], "pts": ["Runs after `try` if no exception", "Runs after `catch` if exception was handled", "Runs even if the exception is NOT handled (before the program dies)", "Runs even if `try` or `catch` has a `return`"], "code": {"f": "Main.java", "c": "public class Main {\n    public static void main(String[] args) {\n        try {\n            System.out.println(\"Opening resource\");\n            int x = 5 / 0;\n        } catch (ArithmeticException e) {\n            System.out.println(\"Handled\");\n        } finally {\n            System.out.println(\"Closing resource\");\n        }\n    }\n}", "out": "Opening resource\nHandled\nClosing resource"}}, {"h": "Execution flow: all three cases", "p": ["There are three possible paths. Understanding them is the most asked exam question on this topic."], "code": {"f": "Main.java", "c": "public class Main {\n    static void test(int d) {\n        try {\n            System.out.println(\"try \" + (10 / d));\n        } catch (ArithmeticException e) {\n            System.out.println(\"catch\");\n        } finally {\n            System.out.println(\"finally\");\n        }\n    }\n    public static void main(String[] args) {\n        test(2);\n        test(0);\n    }\n}", "out": "try 5\nfinally\ncatch\nfinally"}, "table": {"head": ["Case", "try", "catch", "finally"], "rows": [["No exception", "Runs fully", "Skipped", "Runs"], ["Exception, matching catch", "Stops at the error line", "Runs", "Runs"], ["Exception, no matching catch", "Stops at the error line", "Skipped", "Runs, then program terminates"]]}}, {"h": "finally with return", "p": ["`finally` runs even when `try` or `catch` executes a `return`. The return value is first saved, then `finally` runs, then the method returns.", "If `finally` itself has a `return`, it overrides the earlier return value (and even swallows an exception). This is legal but a very bad habit."], "warn": "Never put `return` inside `finally`. It hides exceptions and confuses readers.", "code": {"f": "Main.java", "c": "public class Main {\n    static int a() {\n        try {\n            return 1;\n        } finally {\n            System.out.println(\"finally in a()\");\n        }\n    }\n    @SuppressWarnings(\"finally\")\n    static int b() {\n        try {\n            return 1;\n        } finally {\n            return 2;   // overrides\n        }\n    }\n    static int c() {\n        int x = 10;\n        try {\n            return x;\n        } finally {\n            x = 99;     // does not change saved value\n        }\n    }\n    public static void main(String[] args) {\n        System.out.println(a());\n        System.out.println(b());\n        System.out.println(c());\n    }\n}", "out": "finally in a()\n1\n2\n10"}}, {"h": "When finally does NOT run", "p": ["`finally` is almost guaranteed, but not always. It will not run if the JVM stops before reaching it."], "pts": ["`System.exit(0)` is called in `try` or `catch`", "The JVM crashes or the process is killed", "The thread is killed or an infinite loop runs inside `try`", "Power failure or fatal error"], "code": {"f": "Main.java", "c": "public class Main {\n    public static void main(String[] args) {\n        try {\n            System.out.println(\"In try\");\n            System.exit(0);\n        } finally {\n            System.out.println(\"finally\");   // not printed\n        }\n    }\n}", "out": "In try"}}, {"h": "try-with-resources", "p": ["Closing resources manually in `finally` is long and error-prone. Since Java 7, try-with-resources closes them automatically. Declare the resource in parentheses after `try`. It must implement `AutoCloseable`.", "Resources are closed automatically at the end of the block, in reverse order of creation, even if an exception occurs. No `finally` needed."], "pts": ["Syntax: `try (Resource r = new Resource()) { ... }`", "Works with files, streams, connections, scanners", "Can declare several resources separated by `;`", "Closing order is reverse of opening"], "tip": "Closing happens BEFORE the `catch` block runs, as the output shows.", "code": {"f": "Main.java", "c": "class Res implements AutoCloseable {\n    String name;\n    Res(String n) { name = n; System.out.println(\"open \" + n); }\n    public void close() { System.out.println(\"close \" + name); }\n}\npublic class Main {\n    public static void main(String[] args) {\n        try (Res a = new Res(\"A\"); Res b = new Res(\"B\")) {\n            System.out.println(\"working\");\n            throw new RuntimeException(\"boom\");\n        } catch (RuntimeException e) {\n            System.out.println(\"caught \" + e.getMessage());\n        }\n    }\n}", "out": "open A\nopen B\nworking\nclose B\nclose A\ncaught boom"}}, {"h": "Valid and invalid combinations", "p": ["Not every mix of the three blocks is allowed."], "table": {"head": ["Combination", "Valid?"], "rows": [["try + catch", "Yes"], ["try + catch + finally", "Yes"], ["try + finally", "Yes"], ["try alone", "No (compile error)"], ["catch or finally without try", "No"], ["Code between try and catch", "No"]]}}], "analogy": "Cooking on a gas stove: try = cook the food, catch = put out a fire if it starts, finally = switch off the gas in every case.", "hinglish": "Bhai try mein risky code likho, catch mein uska solution, aur finally mein cleanup jo har haal mein chalega, chahe exception aaye ya na aaye. Sirf System.exit() se finally skip hota hai. File ya connection band karne ke liye try-with-resources use karo, wo khud close kar deta hai.", "mistakes": ["Writing `try` with no `catch` and no `finally`: compile error.", "Using a `try` variable in `finally`; it is out of scope.", "Putting `return` in `finally`; it silently discards exceptions.", "Thinking `finally` always runs: not after `System.exit()`.", "Expecting statements after the error line inside `try` to run."], "remember": ["`try` block contains code that may throw an exception.", "`catch(Type e)` handles exceptions of that type and its subclasses.", "`finally` runs always: after try, or after catch, or before an unhandled exception moves up.", "`try` must be followed by `catch` or `finally` (or use try-with-resources).", "After an exception, the rest of the `try` block is skipped.", "Variables declared in `try` are not visible in `catch`/`finally`.", "`finally` does not run if `System.exit()` is called or JVM crashes.", "`return` in `try` still executes `finally` first; `return` in `finally` overrides it.", "Common methods: `getMessage()`, `toString()`, `printStackTrace()`.", "try-with-resources (Java 7) auto-closes `AutoCloseable` resources in reverse order.", "Resources close before the `catch` block runs.", "One `try` can have many `catch` blocks but only one `finally`."], "def": "These three blocks are the core of exception handling in Java. `try` holds risky code, `catch` handles the exception if it occurs, and `finally` holds cleanup code that must run in every case.", "uses": ["Closing files, connections and streams safely", "Preventing a program crash on bad input"], "pros": ["Programs keep running after an error", "Cleanup is guaranteed with finally"], "cons": ["Writing an empty catch block, which hides bugs", "Catching Exception everywhere instead of specific exceptions", "Putting code that must always run outside finally"]}, "u4-t3": {"tldr": "`throw` throws one exception object now; `throws` declares which exceptions a method may pass to its caller.", "sections": [{"h": "Two keywords, two jobs", "p": ["Think of `throw` as the action and `throws` as the declaration."], "table": {"head": ["", "throw", "throws"], "rows": [["Where", "Inside method body", "In method signature"], ["Job", "Throws an exception object", "Declares possible exceptions"], ["Followed by", "One object (`new X()`)", "One or more class names"]]}}, {"h": "throw: throwing an exception manually", "p": ["Java throws many exceptions automatically (like `/ by zero`). With `throw` you throw your own, usually when your business rule is broken, such as age below 18 or negative amount.", "Syntax: `throw new ExceptionType(\"message\");`. The expression after `throw` must be an object of `Throwable` or its subclass. The moment `throw` runs, the method stops and the exception travels up."], "pts": ["Used to enforce rules and validate data", "Can throw built-in or custom exceptions", "Only one exception per `throw` statement", "Statements after `throw` are unreachable"], "tip": "`IllegalArgumentException` is the best built-in choice for bad arguments.", "code": {"f": "Main.java", "c": "public class Main {\n    static void vote(int age) {\n        if (age < 18) {\n            throw new ArithmeticException(\"Not eligible to vote\");\n        }\n        System.out.println(\"Eligible to vote\");\n    }\n    public static void main(String[] args) {\n        vote(20);\n        try {\n            vote(15);\n        } catch (ArithmeticException e) {\n            System.out.println(\"Caught: \" + e.getMessage());\n        }\n    }\n}", "out": "Eligible to vote\nCaught: Not eligible to vote"}}, {"h": "throw with unchecked exceptions", "p": ["If you throw an unchecked exception (a `RuntimeException`), the compiler does not force anything. You may skip both `try-catch` and `throws`.", "If nobody catches it, the program ends with a stack trace."], "code": {"f": "Main.java", "c": "public class Main {\n    static void setAge(int age) {\n        if (age < 0) throw new IllegalArgumentException(\"Age cannot be negative\");\n        System.out.println(\"Age = \" + age);\n    }\n    public static void main(String[] args) {\n        setAge(20);\n        try {\n            setAge(-5);\n        } catch (IllegalArgumentException e) {\n            System.out.println(e.getMessage());\n        }\n    }\n}", "out": "Age = 20\nAge cannot be negative"}}, {"h": "throw with checked exceptions", "p": ["If you throw a checked exception (like `Exception` or `IOException`), the compiler forces you to handle it. Either catch it in the same method or declare it using `throws`.", "This is where `throw` and `throws` work together."], "warn": "Without the `try-catch` (or `throws Exception` on `main`) this does not compile: `unreported exception`.", "code": {"f": "Main.java", "c": "public class Main {\n    public static void main(String[] args) {\n        try {\n            throw new Exception(\"Checked problem\");\n        } catch (Exception e) {\n            System.out.println(\"Handled: \" + e.getMessage());\n        }\n    }\n}", "out": "Handled: Checked problem"}}, {"h": "throws: declaring exceptions", "p": ["`throws` goes in the method signature after the parameter list. It says: 'this method may throw these checked exceptions; the caller must deal with them'. It shifts the responsibility from the method to its caller.", "Syntax: `returnType method() throws Ex1, Ex2 { ... }`. The caller must either catch them or declare `throws` again."], "pts": ["Mainly needed for checked exceptions", "Can list many exceptions, separated by commas", "Declaring does not mean it will definitely be thrown", "Constructors can also use `throws`"], "code": {"f": "Main.java", "c": "import java.io.IOException;\n\npublic class Main {\n    static void readData() throws IOException {\n        throw new IOException(\"Disk not ready\");\n    }\n    public static void main(String[] args) {\n        try {\n            readData();\n        } catch (IOException e) {\n            System.out.println(\"Caught: \" + e.getMessage());\n        }\n    }\n}", "out": "Caught: Disk not ready"}, "viz": {"type": "chain", "items": ["m3() throws", "m2() calls m3", "m1() catches"], "caption": "Exception travels up the call chain to whoever handles it"}}, {"h": "throws with multiple exceptions and main", "p": ["List several exceptions with commas. The caller can handle them with separate `catch` blocks or one parent `catch`.", "You can also write `throws` on `main()`. Then the JVM itself handles the exception: it prints the stack trace and ends the program. This is quick for demos but poor for real apps."], "code": {"f": "Main.java", "c": "import java.io.IOException;\n\npublic class Main {\n    static void work(int n) throws IOException, InterruptedException {\n        if (n == 1) throw new IOException(\"IO problem\");\n        if (n == 2) throw new InterruptedException(\"Interrupted\");\n        System.out.println(\"No problem\");\n    }\n    public static void main(String[] args) throws Exception {\n        work(0);\n        try {\n            work(1);\n        } catch (IOException | InterruptedException e) {\n            System.out.println(\"Caught \" + e.getMessage());\n        }\n    }\n}", "out": "No problem\nCaught IO problem"}}, {"h": "Rules for throws in overriding", "p": ["When a child class overrides a method, its `throws` clause cannot be broader for checked exceptions than the parent's method."], "pts": ["Parent has no `throws`: child cannot add a checked exception", "Parent `throws IOException`: child may throw `IOException`, a subclass, or nothing", "Child cannot throw a bigger/new checked exception such as `Exception`", "Unchecked exceptions are always allowed"], "code": {"f": "Main.java", "c": "import java.io.IOException;\n\nclass Parent {\n    void show() throws IOException {\n        System.out.println(\"Parent\");\n    }\n}\nclass Child extends Parent {\n    @Override\n    void show() {                 // narrower: no throws\n        System.out.println(\"Child\");\n    }\n}\npublic class Main {\n    public static void main(String[] args) throws IOException {\n        Parent p = new Child();\n        p.show();\n    }\n}", "out": "Child"}}, {"h": "throw vs throws: comparison", "p": ["Exam favourite. Learn this table."], "table": {"head": ["Point", "throw", "throws"], "rows": [["Meaning", "Throws an exception explicitly", "Declares exceptions a method may throw"], ["Location", "Inside method or block", "Method signature"], ["Followed by", "Instance: `new X()`", "Class names, comma separated"], ["Count", "One exception at a time", "Many exceptions allowed"], ["Handles checked?", "Needs try-catch or throws", "Passes duty to caller"], ["Example", "`throw new IOException();`", "`void f() throws IOException`"]]}}], "analogy": "`throw` is a referee actually showing a red card. `throws` is the rule-book note that says a red card may be shown in this match.", "hinglish": "Bhai throw ek statement hai jo method ke andar exception phek deta hai (throw new Exception()). throws method ki signature mein likhte hain, matlab 'is method se ye exception aa sakta hai, caller sambhal lena'. Throw ek time pe ek object, throws mein comma se kai exceptions.", "mistakes": ["Writing `throws new Exception()`: `throws` takes class names, not objects.", "Writing `throw IOException;` instead of `throw new IOException();`.", "Forgetting `throws` or `try-catch` for a thrown checked exception: compile error.", "Adding a new checked exception in an overriding method.", "Placing a statement after `throw` in the same block."], "remember": ["`throw` is used to explicitly throw one exception object.", "Syntax: `throw new ExceptionType(\"message\");`", "`throw` appears inside a method or block; `throws` appears in method signature.", "`throws` declares exceptions: `void m() throws IOException, SQLException`.", "Checked exceptions thrown with `throw` must be caught or declared with `throws`.", "Unchecked exceptions need neither.", "Code after `throw` is unreachable (compile error).", "Only `Throwable` objects can follow `throw`; `throw null` gives NullPointerException.", "`throws` passes responsibility to the caller.", "Overriding method cannot throw broader checked exceptions than the parent method.", "`throws` on `main()` hands the exception to the JVM.", "Constructors can use `throws` too."], "def": "`throw` and `throws` look similar but do different jobs. `throw` is a statement that actually creates a problem: it throws one exception object right now. `throws` is a warning label on a method: it tells callers which exceptions this method may pass on.", "uses": ["Validating arguments and rejecting bad data", "Passing responsibility for an exception to the calling method"], "pros": ["Clear communication of what can go wrong", "Callers are forced to handle checked problems"], "cons": ["Mixing up throw and throws", "Declaring throws Exception everywhere, which hides useful information", "Throwing a checked exception without handling or declaring it (compile error)"]}, "u4-t4": {"tldr": "Handle different exceptions with many catch blocks or `|`, nest try blocks, re-throw, and chain causes.", "sections": [{"h": "Multiple catch blocks", "p": ["Use this when each exception needs a different reaction."], "code": {"f": "Main.java", "c": "public class Main {\n    static void test(int choice) {\n        try {\n            if (choice == 0) { int x = 5 / 0; }\n            if (choice == 1) { int[] a = new int[1]; a[3] = 1; }\n            if (choice == 2) { String s = null; s.length(); }\n        } catch (ArithmeticException e) {\n            System.out.println(\"Arithmetic problem\");\n        } catch (ArrayIndexOutOfBoundsException e) {\n            System.out.println(\"Array problem\");\n        } catch (Exception e) {\n            System.out.println(\"Some other problem\");\n        }\n    }\n    public static void main(String[] args) {\n        test(0); test(1); test(2);\n    }\n}", "out": "Arithmetic problem\nArray problem\nSome other problem"}, "viz": {"type": "chain", "items": ["try", "catch A?", "catch B?", "catch C?"], "caption": "Checked top to bottom, first match wins"}}, {"h": "Order of catch blocks", "p": ["Rule: child (specific) exceptions first, parent (general) exceptions last. If a parent `catch` comes first, it would catch everything and the child `catch` could never run. The compiler detects this and gives an error: `exception X has already been caught`.", "So always keep `catch (Exception e)` at the very end."], "warn": "Writing `catch (Exception e)` before `catch (IOException e)` will not compile.", "code": {"f": "Main.java", "c": "public class Main {\n    public static void main(String[] args) {\n        try {\n            Object o = \"text\";\n            Integer i = (Integer) o;\n        } catch (ClassCastException e) {      // specific first\n            System.out.println(\"ClassCastException\");\n        } catch (RuntimeException e) {        // more general\n            System.out.println(\"RuntimeException\");\n        } catch (Exception e) {               // most general last\n            System.out.println(\"Exception\");\n        }\n    }\n}", "out": "ClassCastException"}, "table": {"head": ["Order", "Result"], "rows": [["Child then Parent", "Valid"], ["Parent then Child", "Compile error (unreachable catch)"], ["Two unrelated types, any order", "Valid"]]}}, {"h": "Multi-catch with the | operator", "p": ["From Java 7, one `catch` can handle several exceptions using `|`. Use it when the handling code is the same for all of them. It avoids copy-pasted catch blocks.", "Syntax: `catch (TypeA | TypeB e) { ... }`."], "code": {"f": "Main.java", "c": "public class Main {\n    static void test(String s) {\n        try {\n            int n = Integer.parseInt(s);\n            int[] a = new int[2];\n            a[n] = 1;\n            System.out.println(\"ok \" + n);\n        } catch (NumberFormatException | ArrayIndexOutOfBoundsException e) {\n            System.out.println(\"Bad input: \" + e.getClass().getSimpleName());\n        }\n    }\n    public static void main(String[] args) {\n        test(\"1\"); test(\"abc\"); test(\"9\");\n    }\n}", "out": "ok 1\nBad input: NumberFormatException\nBad input: ArrayIndexOutOfBoundsException"}}, {"h": "Rules of multi-catch", "p": ["Multi-catch has strict rules, which are popular exam questions."], "pts": ["The types must NOT be related by inheritance (`IOException | Exception` is an error, as one is parent of the other)", "The catch parameter `e` is implicitly `final`: you cannot assign a new value to it", "Type of `e` becomes the common supertype of the listed types", "Each alternative is separated by a single `|`, not `||`", "Works for checked and unchecked exceptions"], "code": {"f": "Main.java", "c": "import java.io.FileNotFoundException;\nimport java.io.IOException;\n\npublic class Main {\n    public static void main(String[] args) {\n        try {\n            if (args.length == 0) throw new FileNotFoundException(\"no file\");\n        } catch (FileNotFoundException | IllegalStateException e) {\n            // e = null;   // error: e is implicitly final\n            System.out.println(e.getMessage());\n        }\n        // catch (FileNotFoundException | IOException e)  -> compile error: related types\n    }\n}", "out": "no file"}}, {"h": "Nested try blocks", "p": ["A `try` block can contain another `try` block inside it. The inner `try` handles its own exceptions. If the inner `catch` does not match, the exception moves out to the outer `try`'s catch blocks.", "Use it when one part of a block needs separate handling, but the rest of the block still needs protection."], "tip": "The inner catch wanted `ArithmeticException`, but an array exception came, so the outer catch handled it.", "code": {"f": "Main.java", "c": "public class Main {\n    public static void main(String[] args) {\n        try {\n            System.out.println(\"Outer try\");\n            try {\n                int[] a = new int[2];\n                a[5] = 10;\n            } catch (ArithmeticException e) {\n                System.out.println(\"Inner catch\");\n            }\n            System.out.println(\"After inner\");   // skipped\n        } catch (ArrayIndexOutOfBoundsException e) {\n            System.out.println(\"Outer catch: handled\");\n        }\n    }\n}", "out": "Outer try\nOuter catch: handled"}, "table": {"head": ["Step", "What happens"], "rows": [["1. Inner try throws", "Inner catch checked first"], ["2. Match found", "Handled inside, outer continues"], ["3. No match", "Exception goes to outer catch"], ["4. No match anywhere", "Program terminates"]]}}, {"h": "Nested try with finally", "p": ["Each `try` can have its own `finally`. The inner `finally` runs when the inner block ends. The outer `finally` runs at the end of the outer block. Order is always inside-out."], "code": {"f": "Main.java", "c": "public class Main {\n    public static void main(String[] args) {\n        try {\n            try {\n                System.out.println(\"inner try\");\n                throw new RuntimeException(\"error\");\n            } finally {\n                System.out.println(\"inner finally\");\n            }\n        } catch (RuntimeException e) {\n            System.out.println(\"outer catch: \" + e.getMessage());\n        } finally {\n            System.out.println(\"outer finally\");\n        }\n    }\n}", "out": "inner try\ninner finally\nouter catch: error\nouter finally"}}, {"h": "Re-throwing an exception", "p": ["Sometimes a method catches an exception, does a small job (like logging or cleanup), and then throws the same exception again for the caller to handle. This is called re-throwing.", "Use `throw e;` inside the `catch` block. The original exception object, with its original stack trace, travels on."], "code": {"f": "Main.java", "c": "public class Main {\n    static void process() {\n        try {\n            int x = 10 / 0;\n        } catch (ArithmeticException e) {\n            System.out.println(\"process(): logging error\");\n            throw e;                      // re-throw\n        }\n    }\n    public static void main(String[] args) {\n        try {\n            process();\n        } catch (ArithmeticException e) {\n            System.out.println(\"main(): \" + e.getMessage());\n        }\n    }\n}", "out": "process(): logging error\nmain(): / by zero"}, "viz": {"type": "chain", "items": ["Error occurs", "catch: log it", "throw e", "Caller catches"], "caption": "Catch, act, then pass it on"}}, {"h": "Chained exceptions (wrapping)", "p": ["Often a low-level exception causes a higher-level problem. A chained exception wraps the original (the cause) inside a new exception, so no information is lost. Callers see a meaningful high-level exception, but can still read the root cause using `getCause()`.", "Pass the cause to the constructor: `new Exception(\"msg\", cause)`, or use `initCause()`."], "pts": ["`new RuntimeException(\"message\", cause)`", "`e.getCause()` returns the wrapped exception", "Common when converting a checked exception into an unchecked or application-level one"], "code": {"f": "Main.java", "c": "public class Main {\n    static void level2() {\n        throw new ArithmeticException(\"divide failed\");\n    }\n    static void level1() {\n        try {\n            level2();\n        } catch (ArithmeticException e) {\n            throw new IllegalStateException(\"Report failed\", e);   // wrap\n        }\n    }\n    public static void main(String[] args) {\n        try {\n            level1();\n        } catch (IllegalStateException e) {\n            System.out.println(\"Error: \" + e.getMessage());\n            System.out.println(\"Cause: \" + e.getCause());\n        }\n    }\n}", "out": "Error: Report failed\nCause: java.lang.ArithmeticException: divide failed"}}], "analogy": "Like a hospital: reception (inner try) sends a patient to a specialist doctor (catch). If no specialist fits, the case goes to the senior doctor (outer catch), who may refer it further (re-throw).", "hinglish": "Bhai ek try ke saath kai catch likh sakte ho, upar se neeche check hota hai aur pehla match chalta hai, isliye pehle chhota (child) exception, last mein Exception. Java 7 mein | se ek hi catch mein kai exception. Nested try mein inner catch match na kare to outer try pakadta hai. throw e se re-throw, aur cause pass karke chaining.", "mistakes": ["Putting `catch (Exception e)` before specific catches: compile error.", "Using `catch (IOException | Exception e)`: related types not allowed.", "Assigning to the multi-catch variable `e`.", "Wrapping an exception but forgetting to pass the cause, losing the root problem.", "Believing both an inner and outer catch run for one exception: only one handles it."], "remember": ["A `try` can have multiple `catch` blocks; only the first matching one runs.", "Catch order: subclass first, superclass last, otherwise compile error.", "Multi-catch syntax: `catch (A | B e)` (Java 7+).", "Multi-catch types must not be in a parent-child relationship.", "Multi-catch parameter is implicitly `final`.", "Nested try: a `try` inside another `try`/`catch`/`finally`.", "If inner catch does not match, exception goes to the outer try's catch blocks.", "Inner `finally` runs before outer `finally`.", "Re-throwing: `catch (Ex e) { ...; throw e; }`.", "Chained exception: `new XException(\"msg\", cause)`; read it with `getCause()`.", "Wrapping hides low-level details but keeps the root cause.", "`catch (Exception e)` last works as a catch-all."], "def": "One `try` block can throw different kinds of exceptions. We can attach many `catch` blocks to it, one for each type. Java checks them from top to bottom and runs only the first one
