Object.assign(ELI5,{"u4-t1": {"story": "Socho tum cycle chala rahe ho. Agar chain utar jaye to tum theek kar sakte ho (Exception). Par agar cycle ka frame hi toot jaye to kuch nahi kar sakte (Error). Java mein bhi galtiyan do tarah ki hoti hain.", "items": [["💥", "Error", "Badi gambhir problem jo tum sambhal nahi sakte, jaise memory khatam (`OutOfMemoryError`). Program ko rokna padta hai."], ["🩹", "Exception", "Aisi galti jo tum sambhal sakte ho, jaise zero se divide. try-catch lagake bacha sakte ho."], ["📢", "Checked exception", "Compile karte waqt hi compiler bolta hai \"isko sambhalo ya batao\". Jaise file na milna (`IOException`)."], ["🕵️", "Unchecked exception", "Chalte waqt aati hai, compiler zabardasti nahi karta. Jaise `ArithmeticException`, `NullPointerException`."]], "line": "Error = sambhal nahi sakte. Exception = sambhal sakte ho (checked ya unchecked)."}, "u4-t2": {"story": "try-catch-finally ek safety net hai. try mein risky kaam karo (rassi pe chalna), catch mein gir gaye to kya karna hai, aur finally mein wo kaam jo har haal mein hoga, jaise ant mein jaake haath dhona.", "items": [["🎪", "try", "Risky code yahan likho, jaise 10 ko 0 se divide karna."], ["🥅", "catch", "Agar try mein galti aayi to yahan pakdo aur sambhalo."], ["🧼", "finally", "Galti aaye ya na aaye, ye hamesha chalega. Jaise file band karna."], ["🔄", "try-with-resources", "Cheez ko khud band kar deta hai, tumhe finally mein close() nahi likhna padta."]], "line": "try = risky kaam, catch = galti sambhalo, finally = har haal mein chalega."}, "u4-t3": {"story": "`throw` aur `throws` mein fark samjho. `throw` = tum khud bolte ho 'ye galti hui!' (galti phenkna). `throws` = tum method ke upar chetawni likhte ho 'is method mein galti aa sakti hai'.", "items": [["🏐", "throw", "Ek exception object khud phenkna: `throw new ArithmeticException(\"galat\");` Method ke andar likhte hain."], ["⚠️", "throws", "Method ke naam ke baad warning board: `void read() throws IOException`. Jo bulayega use sambhalna padega."], ["🔍", "Fark", "throw = action (ek baar mein ek exception). throws = declaration (kai exceptions likh sakte ho)."], ["🧳", "Kab kya", "Khud galti pakad ke batani ho to throw. Galti sambhalni nahi, aage bhejni ho to throws."]], "line": "throw = exception phenkna (kaam). throws = chetawni likhna (declaration)."}, "u4-t4": {"story": "Kabhi ek try mein kai tarah ki galtiyan ho sakti hain. Ek se zyada catch laga ke har galti ka alag ilaaj karo, jaise doctor ke paas alag bimari ki alag dawai.", "items": [["🧰", "Multiple catch", "Ek try ke baad kai catch: har exception ke liye alag. Pehle chhoti (specific), phir badi (general) exception rakho."], ["🪆", "Nested try", "try ke andar ek aur try, jaise gudiya ke andar gudiya. Andar wali galti nahi pakdi to bahar wali pakadti hai."], ["🔁", "Re-throw", "Galti pakdi, thoda kaam kiya, aur phir se aage phenk di taaki upar wala bhi jaane."], ["🧩", "Multi-catch", "Ek catch mein kai exceptions: `catch (A | B e)`. Jab dono ka ilaaj ek jaisa ho."]], "line": "Multiple catch: specific pehle, general baad mein. Nested try andar-bahar, re-throw aage bhejna."}, "u4-t5": {"story": "Java ki apni galtiyon ke naam hote hain, par kabhi tumhari app ko apna naam chahiye, jaise 'UmarGalatException'. Tum khud ek custom exception class bana sakte ho.", "items": [["🏷️", "Custom exception", "Apni class jo `Exception` ko extend karti hai: `class AgeException extends Exception`."], ["📬", "Message dena", "Constructor mein `super(message)` se saaf message do, jaise \"Umar 18 se kam hai\"."], ["✅", "Checked custom", "`Exception` se extend karo: compiler zabardasti sambhalne ko bolega."], ["🕵️", "Unchecked custom", "`RuntimeException` se extend karo: compiler zabardasti nahi karega."], ["🎯", "Use", "`throw new AgeException(\"...\")` jab tumhare rule ki galti ho, jaise voting age."]], "line": "Custom exception = apni class jo Exception ya RuntimeException ko extend karti hai."}, "u5-t1": {"story": "Process ek poori kitchen hai, jisme apna saaman aur jagah hoti hai. Thread us kitchen ke andar kaam karne wala ek cook hai. Ek kitchen mein kai cooks ek saath kaam kar sakte hain aur saaman share karte hain.", "items": [["🏭", "Process", "Ek chalta hua program, jaise Chrome. Uski apni alag memory hoti hai. Bhaari hai."], ["🧑‍🍳", "Thread", "Process ke andar ka ek chhota kaam karne wala. Halka hai, memory share karta hai."], ["🤹", "Multitasking / multithreading", "Music sunte hue homework: ek saath kai kaam. Program mein bhi ek se zyada thread ek time pe."], ["⚖️", "Fark", "Process alag-alag ghar, thread ek hi ghar ke kai log. Threads ke beech baat karna aasan hai."], ["🧵", "Main thread", "Jab program shuru hota hai, ek thread pehle se hota hai: `main`."]], "line": "Process = alag ghar. Thread = ek ghar ke kai log jo saath kaam karte hain."}, "u5-t2": {"story": "Naya thread banane ke do tareeke hain. Ya to tum khud ek cook ban jao (Thread class extend karo), ya cook ko ek kaam ki parchi (Runnable) de do aur wo kar dega.", "items": [["🧑‍🍳", "Way 1: extends Thread", "Class `Thread` ko extend karo aur `run()` mein kaam likho. Phir `start()` bulao."], ["📝", "Way 2: implements Runnable", "Class Runnable implement karo, `run()` likho, aur `new Thread(obj).start()` karo. Zyada flexible kyunki class kisi aur ko bhi extend kar sakti hai."], ["▶️", "start() vs run()", "`start()` naya thread banata hai. `run()` seedha bulaya to wo normal method ki tarah chalega, naya thread nahi banega."], ["🥇", "Kaun sa better", "Runnable zyada pasand kiya jata hai, kyunki Java mein sirf ek class extend kar sakte hain."]], "line": "Thread banane ke 2 tareeke: extends Thread ya implements Runnable. Hamesha `start()` bulao."}, "u5-t3": {"story": "Thread ki zindagi ek student jaisi hai: paida hua, line mein laga, test dene gaya, kabhi ruka, aur aakhir mein pass hoke bahar gaya.", "items": [["👶", "New", "Thread ban gaya par abhi `start()` nahi hua. Jaise bachcha paida hua."], ["🚦", "Runnable", "`start()` hua. Line mein khada hai, CPU milne ka intezaar. Jaise exam hall ke bahar line."], ["🏃", "Running", "CPU mil gaya, kaam chal raha hai. Jaise exam de raha hai."], ["⏸️", "Blocked / Waiting", "Kisi cheez ka intezaar: lock, ya dusre thread ka. Jaise teacher ka ruk jana."], ["😴", "Timed waiting", "Kuch time ke liye soya hua: `sleep(1000)`. Jaise 10 minute ka break."], ["🏁", "Terminated", "Kaam khatam ho gaya. Thread ki zindagi poori. Dobara start nahi kar sakte."]], "line": "New → Runnable → Running → (Blocked/Waiting) → Terminated."}, "u5-t4": {"story": "Kuch threads VIP hote hain (zyada priority) aur CPU unhe pehle chance de sakta hai. Aur kabhi kisi sote hue thread ko 'uth jao!' bolna padta hai, wo interrupt hai.", "items": [["⭐", "Priority", "1 se 10 tak. Zyada number matlab pehle chance milne ki zyada sambhavna (pakka nahi). Default 5."], ["💤", "sleep()", "Thread ko kuch der soo jaane do, jaise 2 second ka ruk jana."], ["🤝", "join()", "Doosre thread ke khatam hone ka intezaar karna. Jaise dost ke aane tak ruk ke khana shuru karna."], ["🔔", "interrupt()", "Soye hue ya wait kar rahe thread ko jagaana. Wo `InterruptedException` ke saath uthta hai."], ["🙏", "yield()", "Thread kehta hai \"mera turn doosre ko de do\", par pakka nahi ki dega."]], "line": "Priority = chance badhata hai (guarantee nahi). interrupt() = thread ko jagana."}, "u5-t5": {"story": "Do log ek hi ATM se ek saath paise nikalne ki koshish karen to gadbad ho sakti hai. Isliye ATM ke darwaze pe taala lagate hain: ek ke baad ek jaaye. Threads mein ye synchronization hai.", "items": [["💥", "Race condition", "Do threads ek hi data ko ek saath badlein to answer galat aa jata hai. Jaise do log ek hi diary mein ek saath likhein."], ["🔒", "synchronized", "Method ya block pe taala: ek time pe sirf ek thread andar ja sakta hai, baaki bahar intezaar karte hain."], ["🧱", "Block vs method", "Poore method ko lock karna ya sirf zaruri hisse ko. Chhota block zyada tez hota hai."], ["🧪", "Static synchronized", "Class level ka taala: us class ke sab objects ke liye ek hi."], ["🐢", "Nuksaan", "Threads ko intezaar karna padta hai, to thoda dheema hota hai."]], "line": "Synchronized = ek time pe ek hi thread andar. Race condition se bachata hai."}, "u5-t6": {"story": "Producer-consumer samjho: chef khana banata hai aur waiter khana le jaata hai. Agar counter khaali hai to waiter ruk ke intezaar karta hai. Chef jaise hi khana rakhta hai, waiter ko bulata hai. Ye threads ki aapas ki baat hai.", "items": [["✋", "wait()", "Thread ruk ke intezaar karta hai aur lock chhod deta hai. \"Jab kaam ho jaye mujhe bula lena.\""], ["🔔", "notify()", "Intezaar kar rahe ek thread ko jagata hai. \"Khana aa gaya, ek waiter uth jao.\""], ["📣", "notifyAll()", "Sab intezaar karne walon ko jagata hai."], ["🍽️", "Producer-Consumer", "Producer maal banata hai, consumer use leta hai. wait/notify se dono ek-dusre ke saath tal-mel mein chalte hain."], ["🧷", "Zaruri rule", "wait/notify sirf `synchronized` block ke andar chalte hain."]], "line": "wait() = ruk ke intezaar. notify() = ek ko jagao. notifyAll() = sabko."}, "u6-t1": {"story": "Stream ek pipe hai jisme se data behta hai. File se program mein aane wala pipe (input), program se file mein jane wala pipe (output). Bytes ke pipe alag, characters ke alag.", "items": [["📦", "Byte stream", "Kachche bytes: images, audio, kuch bhi. `FileInputStream` aur `FileOutputStream`."], ["🔤", "Character stream", "Text ke liye. `FileReader` aur `FileWriter` akshron ko samajhte hain."], ["🚚", "Buffered", "Thaila bhar ke bhejna: ek ek cheez nahi, ek saath bahut. `BufferedReader` tez hota hai."], ["🧮", "Binary I/O", "Numbers ko seedha bytes mein likhna: `DataOutputStream.writeInt(5)`. File chhoti, par editor mein padhne layak nahi."], ["🔚", "close()", "Kaam ke baad pipe band karo. try-with-resources khud band kar deta hai."]], "line": "Byte stream = kisi bhi file. Character stream = text. Buffered = tez."}, "u6-t2": {"story": "File class file ka 'avatar' hai, jisse tum file ke baare mein poochh sakte ho: hai ya nahi, kitni badi hai, naam kya hai. RandomAccessFile ek book ki tarah hai jisme tum seedha kisi bhi page pe khol ke padh ya likh sakte ho.", "items": [["🗂️", "File class", "File ya folder ki jaankari: `exists()`, `length()`, `getName()`, `mkdir()`. Andar ka data nahi padhti."], ["📂", "Folder list", "`list()` se folder ke andar ki files dekho."], ["📖", "RandomAccessFile", "Padhna aur likhna ek hi object se. Jahan chaaho wahan jump kar sakte ho."], ["📍", "seek()", "Pointer ko kisi bhi jagah le jao, jaise kitab mein bookmark lagana. `getFilePointer()` batata hai abhi kahan ho."], ["🔑", "Mode", "`\"r\"` sirf padhna, `\"rw\"` padhna aur likhna dono."]], "line": "File class = file ki jaankari. RandomAccessFile = kahin se bhi padho/likho (seek)."}, "u6-t3": {"story": "Collections framework ek bada godown hai jisme cheezein rakhne ke kai tareeke hain: line mein (List), bina dohraye (Set), line se bahar niklo (Queue), ya naam-value ki jodi (Map). Sabke apne rules hain.", "items": [["🏗️", "Collection", "Sabka base idea: objects ka group. `java.util` package mein."], ["📋", "List", "Line mein, order yaad rakhta hai, dohrane allowed. Jaise class ki attendance sheet."], ["🎯", "Set", "Koi cheez dohrayi nahi ja sakti. Jaise unique roll numbers."], ["🎟️", "Queue", "Pehle aao, pehle jao (FIFO), jaise ticket ki line."], ["📒", "Map", "Key-value jodi, jaise phone book: naam se number. (Collection ke andar nahi aata.)"], ["🌳", "Hierarchy", "Upar interfaces (Collection, List, Set, Queue), neeche unki classes (ArrayList, HashSet ...)."]], "line": "List = order+duplicates. Set = unique. Queue = FIFO. Map = key-value."}, "u6-t4": {"story": "Ab har godown ki asli classes dekho. Har class ka apna swabhav hai: koi tez padhti hai, koi tez jodti hai, koi sorted rakhti hai.", "items": [["📓", "ArrayList", "Badhne wali array. Kisi bhi number pe seedha pahunchna tez, beech mein daalna dheema."], ["⛓️", "LinkedList", "Chain jaisa. Beech mein jodna-hatana tez, par index se dhoondhna dheema."], ["🎯", "HashSet", "Unique cheezein, koi order nahi. Bahut tez dhoondhta hai."], ["🗂️", "TreeSet", "Unique aur hamesha sorted (chhote se bade)."], ["🏆", "PriorityQueue", "Line mein sabse zaroori (chhota number) sabse pehle bahar. Jaise hospital mein emergency patient."], ["↔️", "ArrayDeque", "Dono taraf se jodo/hatao. Stack aur queue dono ki tarah chalta hai."], ["📒", "HashMap (syllabus ke bahar)", "Key se value tez milti hai. Phone book jaisa."]], "line": "ArrayList = tez access. LinkedList = tez insert/delete. HashSet = unique. TreeSet = sorted. PriorityQueue = zaroori pehle."}, "u6-t5": {"story": "JDBC Java ka database se baat karne ka phone call hai. Pehle driver (translator) lagao, phir number lagao (connection), sawaal poochho (query), jawab padho (result), aur phone rakh do (close).", "items": [["🔌", "Driver", "Translator jo Java aur database ko ek-dusre ki bhasha samjhata hai."], ["📞", "Connection", "Database se phone jodna: `DriverManager.getConnection(url, user, pass)`."], ["❓", "Statement", "Sawaal bhejne wala. `PreparedStatement` safe aur tez hai, bachata hai SQL attack se."], ["📄", "ResultSet", "Jawab ki table. `next()` se ek-ek row aage badhte hue padho."], ["✏️", "executeQuery / executeUpdate", "`executeQuery` = SELECT (data padho). `executeUpdate` = INSERT/UPDATE/DELETE (data badlo)."], ["📴", "close()", "Kaam ke baad connection band karo, nahi to line busy rahegi."]], "line": "JDBC steps: driver → connection → statement → execute → ResultSet → close."}, "u3-t1": {"story": "Beta ko papa ki aankhein, rang aur kuch aadatein apne aap mil jati hain, usko kuch seekhna nahi padta. Java mein bhi child class parent class ki cheezein free mein le leti hai, aur apni nayi cheezein bhi jod sakti hai.", "items": [["👨‍👦", "Parent aur Child", "Parent = super class (jisse milta hai). Child = sub class (jo leta hai). `class Dog extends Animal`."], ["🎁", "Free mein milta hai", "Dog ko `eat()` nahi likhna padta, Animal se mil gaya. Code dohrana nahi padta (code reuse)."], ["➕", "Nayi cheez jodna", "Child apna extra kaam bhi rakh sakta hai, jaise Dog ka `bark()`."], ["🔒", "Private nahi milta", "Parent ki private cheez child ko seedhe nahi milti, jaise papa ki personal diary."], ["🧬", "Object class", "Java mein har class ka sabse bada baap `Object` hai."]], "line": "Inheritance = child ko parent ki cheezein free mein milti hain. Keyword: `extends`."}, "u3-t2": {"story": "Family ke alag-alag shape hote hain. Kahin ek papa-ek beta, kahin dada-papa-pota ki line, kahin ek papa ke kai bachche. Inheritance ke bhi yahi shape hain.", "items": [["👨‍👦", "Single", "Ek papa, ek beta. A → B. Sabse simple: Dog extends Animal."], ["🪜", "Multilevel", "Dada → Papa → Pota. Pota ko dono se cheezein milti hain. A → B → C, ek chain."], ["🌳", "Hierarchical", "Ek papa ke kai bachche: Animal ke neeche Dog, Cat aur Bird. A → B, A → C."], ["🚫", "Multiple (classes se)", "Ek bachche ke do papa nahi ho sakte. Java mein `class C extends A, B` allowed nahi hai, kyunki confusion hota hai (diamond problem)."], ["🔌", "Multiple (interface se)", "Par ek bachcha kai interfaces implement kar sakta hai. Jaise ek insaan student bhi aur sportsman bhi."], ["🧩", "Hybrid", "Kai shapes ka mix. Classes se seedha nahi, interfaces ke saath ban sakta hai."]], "line": "Java mein classes se: single, multilevel, hierarchical. Multiple aur hybrid sirf interfaces se."}, "u3-t3": {"story": "`super` ka matlab 'mere papa'. Jab bachcha kehta hai 'papa se pooch ke aata hu', wo parent ko bula raha hai. Waise hi `super` child se parent class tak pahunchne ka raasta hai.", "items": [["👆", "super.variable", "Parent ka variable chhoona, jab child ke variable ka naam same ho."], ["📞", "super.method()", "Parent ka version bulana, jab child ne method override kar diya ho."], ["🏗️", "super()", "Parent ka constructor bulana. Child banne se pehle parent tayyar hota hai, jaise pehle neev phir chhat."], ["🔑", "Member access rules", "private = sirf apni class. protected/public = child ko mil jata hai. Parent ki private cheez child ko nahi."], ["⚖️", "super vs this", "`this` = main khud. `super` = mere papa."]], "line": "super = parent class tak pahunchne ka raasta (variable, method, constructor)."}, "u3-t13": {"story": "Socho har insaan ka ek 'maa-baap ka baap' hai jo sabka common hai, aur usne sabko kuch basic cheezein sikha di hain: naam batana, pehchaan, pareeksha. Java mein wo `Object` class hai. Har class ka sabse upar ka baap.", "items": [["👑", "Object", "Har class automatically isse extend karti hai. Isliye har object pe kuch methods free mein milte hain."], ["🪪", "toString()", "Object ka introduction card. Default mein kuch ajeeb sa deta hai (`Student@1a2b`), override karke \"Ravi, roll 1\" jaisa achha banao."], ["🤝", "equals()", "Do object ek jaise hain ya nahi? Default mein poochta hai \"kya ye ek hi object hai?\". Override karke data compare karo."], ["🔢", "hashCode()", "Object ka ek number, jaise roll number. equals() override karo to hashCode() bhi karo."], ["🔍", "getClass()", "Object ki asli pehchaan: wo kis class ka hai."], ["🐑", "clone()", "Object ki copy banana, jaise Dolly sheep."]], "line": "Object = Java ki har class ka baap. toString, equals, hashCode har object ko free mein milte hain."}, "u3-t4": {"story": "`final` ka matlab 'ab isko badalna mana hai'. Jaise pakki seal laga di: ab koi ise chhed nahi sakta.", "items": [["🧊", "final variable", "Ek baar value di, ab badal nahi sakti. Jaise paththar pe likha naam: `final double PI = 3.14;`"], ["🚫", "final method", "Child is method ko override nahi kar sakta. Jaise family ka pakka rule."], ["🔐", "final class", "Is class se koi extend nahi kar sakta. Jaise bina bachchon wala parivaar. Example: `String` class."], ["🎯", "Kab use karein", "Jab kuch bhi badalna nahi chahiye: constants, safe methods, secure classes."]], "line": "final variable = badalega nahi. final method = override nahi. final class = extend nahi."}, "u3-t5": {"story": "Overloading ek naam, kai kaam. Dukaandar se 'chai do' bolo to wo cup mein, glass mein ya kulhad mein de sakta hai, depend karta hai tumne kya maanga. Naam same, input alag.", "items": [["🔀", "Overloading", "Ek class mein same naam ke kai methods, par parameters alag. `add(int,int)` aur `add(double,double)`."], ["📏", "Kaise alag karein", "Parameters ki ginti, type ya order alag hona chahiye. Sirf return type alag karne se nahi chalega."], ["⏰", "Compile time", "Java compile karte waqt hi tay kar leti hai kaun sa method chalega (static binding)."], ["💡", "Kyun useful", "Ek hi naam yaad rakhna padta hai, aur code padhne mein saaf rehta hai."]], "line": "Overloading = same naam, alag parameters, ek hi class, compile time pe tay."}, "u3-t6": {"story": "Overriding mein bachcha papa ka kaam apne tareeke se karta hai. Papa kehta tha 'roti banao', beta wahi kaam apne style mein karta hai. Naam wahi, kaam badla hua.", "items": [["🔁", "Overriding", "Child apne parent ka method dobara likhta hai, same naam aur same parameters ke saath, par naye tareeke se."], ["🏷️", "@Override", "Ek label jo compiler ko bolta hai \"mai override kar raha hu\", galti hogi to wo pakad lega."], ["⏳", "Runtime pe tay", "`Animal a = new Dog();` `a.sound()` Dog ka chalega, kyunki chalte waqt asli object dekha jata hai (dynamic binding)."], ["🚧", "Kya override nahi hota", "`final`, `static` aur `private` methods override nahi hote."], ["⚠️", "Exception ka rule", "Override karte waqt parent se bada checked exception nahi daal sakte, chhota ya koi nahi chalega."], ["⚖️", "Overloading se fark", "Overloading = ek class, compile time. Overriding = parent-child, runtime."]], "line": "Overriding = child parent ke method ko apne tareeke se likhta hai. Runtime pe tay hota hai."}, "u3-t7": {"story": "Abstract class ek adhoora naksha hai: kuch hissa bana hua, kuch 'tum khud bharo'. Jaise 'Shape' bolne par kuch pata nahi chalta kaise draw karna hai, par Circle aur Square ko apna draw likhna padega.", "items": [["🎨", "Abstract class", "Aisi class jiska object nahi bana sakte. Sirf doosri classes ke liye base hai. `abstract class Shape`."], ["❓", "Abstract method", "Sirf naam, body nahi: `abstract void draw();`. Child ko ise zaroor poora karna padta hai."], ["✅", "Normal methods bhi", "Abstract class mein poore bane methods aur variables bhi ho sakte hain."], ["🏗️", "Constructor", "Abstract class mein constructor ho sakta hai, jo child ke banne par chalta hai."], ["🎬", "Abstraction", "Zaruri cheez dikhao, andar ki detail chhupao. ATM mein paise nikalna aata hai, andar ka system nahi dikhta."]], "line": "Abstract class = adhoora naksha. Object nahi banta, child poora karta hai."}, "u3-t8": {"story": "Interface ek contract hai. Jaise driving license ke rules: jo bhi gaadi chalayega use ye sab aana chahiye. Interface batata hai 'kya karna hai', class batati hai 'kaise karna hai'.", "items": [["📜", "Interface", "Sirf rules (methods ke naam). `interface Flyable { void fly(); }`"], ["✍️", "implements", "Class contract pe sign karti hai aur saare methods poore likhti hai: `class Bird implements Flyable`."], ["👥", "Kai interfaces", "Ek class kai interfaces implement kar sakti hai. Ek insaan student bhi, player bhi."], ["🎁", "default aur static methods", "Java 8 se interface mein ready-made method bhi de sakte hain, jise class chahe to badal le."], ["🔗", "Interface reference", "`Flyable f = new Bird();` Contract ke naam se asli cheez ko bulana."], ["🌿", "extends interface", "Ek interface doosre interface ko extend kar sakta hai, jaise rules ke upar aur rules."]], "line": "Interface = contract. Class `implements` karke wo sab methods poore likhti hai."}, "u3-t9": {"story": "Abstract class ek adhoora ghar hai (kuch bana hua, kuch baaki). Interface sirf rule-book hai. Ghar adhoora ho sakta hai, par rule-book mein koi kaam hota hi nahi.", "items": [["🏠", "Abstract class", "Poore methods + abstract methods dono. Variables rakh sakti hai. Ek class sirf ek se extend kar sakti hai."], ["📜", "Interface", "Mostly sirf rules (abstract methods). Variables sirf constants. Ek class kai implement kar sakti hai."], ["🔑", "Keyword", "Abstract class ke liye `extends`, interface ke liye `implements`."], ["🤔", "Kab kya", "Kuch common code bhi share karna hai to abstract class. Sirf contract chahiye ya multiple chahiye to interface."]], "line": "Abstract class = adhoora ghar (single extend). Interface = rule-book (multiple implement)."}, "u3-t10": {"story": "Rishte do tarah ke hote hain. 'Hai' wala: kutta ek janwar HAI. 'Rakhta hai' wala: gaadi ke paas ek engine HAI. Pehla inheritance (IS-A), dusra ek class ke andar doosri class (HAS-A).", "items": [["🐕", "IS-A (inheritance)", "Dog IS-A Animal. `extends` se banta hai."], ["🚗", "HAS-A", "Car HAS-A Engine. Class ke andar doosri class ka object rakho."], ["🤝", "Association", "Do alag objects jo ek-dusre ko jaante hain: teacher aur student."], ["🧺", "Aggregation", "Kamzor HAS-A. Department mein teachers hain, par department band ho jaye to teachers kahin aur ja sakte hain."], ["🫀", "Composition", "Majboot HAS-A. Ghar aur uske kamre: ghar toot gaya to kamre bhi khatam."]], "line": "IS-A = extends (Dog is an Animal). HAS-A = object rakhna (Car has an Engine)."}, "u3-t11": {"story": "Encapsulation ek capsule jaisa hai: andar ki dawai bahar se nahi dikhti aur tum seedha haath nahi laga sakte. Data ko private karke, getter-setter naam ke chhote darwaazon se hi andar jaane do.", "items": [["💊", "Data ko chhupao", "Variables `private` karo taaki koi bahar se seedha na badal sake."], ["🚪", "Getter / Setter", "Public methods jo data padhne (`getAge`) aur badalne (`setAge`) dete hain."], ["🛡️", "Safety ka faayda", "Setter mein check laga sakte ho: umar -5 nahi ho sakti. Jaise bank mein PIN ke bina paise nahi nikalte."], ["📖", "Read-only", "Sirf getter do, setter nahi. Data sirf padh sakte ho, badal nahi sakte."], ["⚖️", "Abstraction se fark", "Encapsulation = data ko chhupana. Abstraction = detail chhupa ke sirf zaruri dikhana."]], "line": "Encapsulation = private data + public getters/setters, safe darwaaze ke saath."}, "u3-t12": {"story": "Package ek folder hai jisme related classes rakhi hoti hain, jaise school bag mein subject-wise copies. Isse classes organized rehti hain aur naam ki takkar nahi hoti.", "items": [["📁", "Package", "Related classes ka folder. `package com.school;` file ke sabse upar."], ["📥", "import", "Dusre folder se class ko apne paas bulana: `import java.util.Scanner;`"], ["🧰", "Built-in packages", "Java ke paas pehle se bane folders hain: `java.lang`, `java.util`, `java.io`."], ["🛠️", "User-defined", "Tum khud apne packages bana sakte ho."], ["🗺️", "CLASSPATH", "Java ko batane wala map: \"classes kahan dhoondhni hain\". Isse JVM tumhare packages ka folder dhoondhta hai."]], "line": "Package = classes ka folder. `import` se use karo, CLASSPATH se Java ko raasta batao."}, "u2-t1": {"story": "Class ek ghar ka naksha (blueprint) hai. Naksha pe ghar nahi rehta, par us naksha se jitne chaho utne ghar ban sakte hain. Class batati hai ghar mein kya hoga (kamre, darwaze) aur kya kar sakte ho (light jalana).", "items": [["📐", "Class = naksha", "Sirf plan hai. Isse kuch chalta nahi, jab tak asli ghar (object) na banao."], ["🏷️", "Fields (data)", "Ghar ki properties: rang, kamron ki ginti. Class mein variables ki tarah likhte hain."], ["⚙️", "Methods (kaam)", "Ghar jo kar sakta hai: darwaza kholna, light jalana. Class mein functions."], ["✍️", "Syntax", "`class Student { String name; void study() { } }` Ye ek naksha hai Student ka."]], "line": "Class = naksha. Usse banne wale asli ghar = objects."}, "u2-t2": {"story": "Naksha se jab asli ghar banta hai to wo object hai. Ek naksha se 100 ghar ban sakte hain, har ghar ka apna rang aur apni cheezein. `new` keyword wo builder hai jo ghar khada karta hai.", "items": [["🏠", "Object", "Class ka asli roop. `Student s = new Student();` ye ek asli student bana."], ["🔨", "new keyword", "Builder ki tarah: memory mein jagah banata hai aur object ko jaan deta hai."], ["🔑", "Reference variable", "Ghar ki chaabi/pata. `s` object nahi hai, sirf us tak pahunchne ka raasta hai."], ["👆", "Dot operator", "Ghar ke andar ki cheez chhoone ke liye: `s.name`, `s.study()`."], ["👻", "Anonymous object", "Bina naam wala object, jaise ek baar ke liye bulaya mehmaan: `new Student().study();`"], ["🕳️", "null", "Chaabi hai par kisi ghar ki nahi. Us par kuch karoge to NullPointerException aayega."]], "line": "Object = class ka asli roop, `new` se bante hain, reference se use karte hain."}, "u2-t3": {"story": "Method ek recipe card hai. Ek baar likh do ('chai banao'), phir jab chahiye bas naam bolo. Har baar poori recipe nahi likhni padti.", "items": [["📇", "Method kya hai", "Ek naam wala kaam ka block. Ek baar likho, kitni baar bhi bulao."], ["📥", "Parameters", "Recipe ke saaman: \"chai banao, 2 cup\". Method ko bahar se diya hua data."], ["📤", "return", "Kaam hone ke baad wapas diya hua jawab, jaise chai ka cup. `void` matlab kuch wapas nahi."], ["📄", "Pass by value", "Photocopy dena: method ko original nahi, copy milti hai. Primitive badalne se original nahi badalta."], ["🔀", "Overloading", "Ek naam, alag inputs: `add(2,3)` aur `add(2,3,4)`. Jaise \"khana do\" bolne par thali ya bowl dono ho sakte hain."], ["🎒", "Varargs", "`int... nums` matlab jitne chaho utne input, jaise thaile mein jitne fal rakh sako."]], "line": "Method = naam wala reusable kaam. Input (parameters) lo, jawab (return) do."}, "u2-t4": {"story": "Array of objects ek class ka register hai. Ek hi class ke bahut saare students ki list: Student[0], Student[1], Student[2]. Jaise class mein roll number wali line.", "items": [["📚", "Array of objects", "Ek list jisme har jagah ek object ka reference hota hai: `Student[] arr = new Student[3];`"], ["📭", "Khali dabbe", "Array banate hi dabbe khali (`null`) hote hain. Har dabbe mein `new Student()` alag se daalna padta hai."], ["🔄", "Loop se kaam", "`for` loop se har student ko ek-ek karke bulao, jaise attendance lena."], ["⚠️", "NullPointerException", "Khali dabbe ko use kiya to crash. Pehle object banao, phir use karo."]], "line": "Array of objects = students ka register. Har dabbe mein pehle object banao."}, "u2-t5": {"story": "Constructor wo setup hai jo naya phone khulte hi chalta hai: language chuno, naam daalo. Jaise hi object banta hai, constructor apne aap chalta hai aur usko tayyar kar deta hai.", "items": [["🧰", "Constructor kya hai", "Class ke naam wala special method, koi return type nahi. `new` karte hi chalta hai."], ["🆓", "Default constructor", "Agar tumne nahi likha to Java khud ek khali bana deti hai, jaise phone ka factory setting."], ["🎛️", "Parameterized", "Banate waqt hi values do: `new Student(\"Ravi\", 1)`. Jaise ghar ka rang pehle se chunna."], ["🖨️", "Copy constructor", "Ek object se doosra bilkul waisa hi banana, jaise photocopy."], ["🔀", "Overloading", "Ek class mein kai constructors alag inputs ke saath. Ghar banane ke kai tareeke."], ["⛓️", "this() chaining", "Ek constructor doosre ko bula leta hai taaki kaam dohraana na pade."]], "line": "Constructor = object ka birth-time setup. Class ke naam wala, bina return type."}, "u2-t6": {"story": "Method binding ka matlab: jab tum method bulate ho, Java kaise decide karti hai ki kaun sa method chalana hai. Do tareeke: pehle se tay (compile time) ya chalte waqt tay (runtime).", "items": [["📌", "Static binding (early)", "Pehle se pata hai kaun sa method chalega. Jaise pehle se booked taxi. `static`, `private`, `final` aur overloading mein hota hai."], ["🎲", "Dynamic binding (late)", "Chalte waqt pata chalta hai. Jaise restaurant mein waiter aakar poochta hai kya order karoge. Overriding mein hota hai."], ["🐕", "Example", "`Animal a = new Dog(); a.sound();` Variable Animal hai par chalega Dog ka `sound()`."], ["🧠", "Yaad rakhne ka tareeka", "Overloading = compile time. Overriding = runtime."]], "line": "Static binding = compile time (overloading). Dynamic binding = runtime (overriding)."}, "u2-t7": {"story": "Class ke andar do tarah ki cheezein hoti hain. Instance member har object ki apni hoti hai, jaise har bachche ka apna bag. Static member poori class ki ek common hoti hai, jaise class ki diwar pe laga ek hi time-table sabke liye.", "items": [["👤", "Instance (non-static) member", "Har object ki apni copy. Do students ka naam alag-alag. Isko object se bulate hain."], ["🧾", "Static variable", "Sabka ek hi copy. School ka naam sab bachchon ke liye ek: `static String school`. Ek jagah badla to sab ke liye badla."], ["🛠️", "Static method", "Bina object banaye bula sakte ho, jaise school ki ghanti: `Student.bell()`."], ["🚦", "Static block", "Class load hote hi sabse pehle ek baar chalta hai, jaise school khulte hi prayer."], ["🏘️", "Static nested class", "Class ke andar ek alag chhota ghar jo bahar wale object ke bina bhi ban sakta hai."], ["⚖️", "Fark", "Static = poori class ka, object ke bina. Dynamic/instance = har object ka apna, object banana padega."]], "line": "Static = ek common cheez class ki. Instance = har object ki apni cheez."}, "u2-t8": {"story": "Access modifiers ghar ke darwaaze ke taale hain: kaun andar aa sakta hai. Public = khula darwaza, private = sirf apna kamra.", "items": [["🌐", "public", "Sab ke liye khula: poori duniya dekh sakti hai. Jaise park."], ["🔒", "private", "Sirf us class ke andar. Jaise tumhari personal diary."], ["👪", "protected", "Ghar ke log aur rishtedar (child classes). Same package wale bhi dekh sakte hain."], ["🏘️", "default (kuch nahi likha)", "Sirf apne mohalle (same package) mein. Bahar walon ke liye band."], ["📊", "Yaad rakhne ka order", "public > protected > default > private. Sabse khula se sabse band."]], "line": "public = sab, protected = family + package, default = package, private = sirf class."}, "u2-t9": {"story": "`this` ka matlab 'main khud'. Jab tum bolte ho 'mera naam Ravi hai', 'mera' ka matlab tum khud. Waise hi `this` current object ko batata hai.", "items": [["🙋", "this.variable", "Jab variable aur parameter ka naam same ho: `this.name = name;` yani \"mere (object ke) name mein ye naam daalo\"."], ["📞", "this.method()", "Apni hi class ka dusra method bulana."], ["⛓️", "this()", "Apne hi dusre constructor ko bulana, jaise kaam dohrane se bachna."], ["📮", "this as argument", "Apne aap ko kisi aur ko dena: \"ye lo mera pata\"."]], "line": "this = current object ka reference, yani 'main khud'."}, "u2-t10": {"story": "Garbage collector ghar ka safai-karmchari hai. Jo object ab koi use nahi kar raha (kisi ke paas uska pata nahi), usko wo uthakar fenk deta hai aur jagah khali kar deta hai. Tumhe khud safai nahi karni padti.", "items": [["🧹", "Garbage Collection", "JVM ka automatic safai kaam. Bekar objects ki memory wapas free karta hai."], ["🗑️", "Kaun kachra banta hai", "Jab object ka koi reference nahi bachta, jaise `s = null;` ya object ke bahar jaana."], ["📣", "System.gc()", "Safai-wale ko request: \"aa jao\". Wo aayega ya nahi, pakka nahi."], ["👋", "finalize()", "Fenkne se pehle ka aakhri kaam. Purana aur deprecated hai, ab use mat karo."]], "line": "Garbage collector bekar objects ko khud hata deta hai. `finalize()` purana hai."}, "u2-t11": {"story": "Nested class ek class ke andar ek aur class hai, jaise ghar ke andar ek chhota kamra jo sirf us ghar ke liye hai.", "items": [["🏘️", "Static nested class", "Bahar wali class ka object banaye bina use kar sakte ho. Jaise society ke andar ek alag block."], ["🛏️", "Inner class (member)", "Bahar wale object ke saath bandha hua. Jaise ghar ke andar ka kamra, ghar ke bina nahi ban sakta."], ["📍", "Local class", "Kisi method ke andar likhi class, sirf wahin kaam aati hai. Jaise ek din ka temporary tent."], ["🎭", "Anonymous class", "Bina naam wali class, ek hi baar use ke liye. Jaise mehmaan ke liye ek baar ki disposable plate."]], "line": "Nested class = class ke andar class. 4 types: static nested, inner, local, anonymous."}, "u2-t12": {"story": "String ek chitthi hai jo ek baar likh di to badal nahi sakti. Badalna ho to nayi chitthi likhni padti hai. Isko immutable kehte hain.", "items": [["✉️", "Immutable", "Ek baar bana string badalta nahi. `s.toUpperCase()` naya string deta hai, purana waise hi rehta hai."], ["🏊", "String pool", "Ek common talaab: same text ke liye Java ek hi string rakhti hai taaki memory bache."], ["🆕", "Literal vs new", "`\"Hi\"` pool mein jaata hai. `new String(\"Hi\")` hamesha naya object banata hai."], ["✏️", "StringBuilder", "Pencil se likha hua jo mitaya ja sakta hai. Tez hai aur string badalne ke liye achha."], ["🔐", "StringBuffer", "StringBuilder jaisa hi, par thread-safe (taale wala), thoda dheema."], ["🧰", "Common methods", "`length()`, `charAt()`, `substring()`, `equals()`, `indexOf()`: string ko naapne, kaatne aur compare karne ke tools."]], "line": "String immutable hai. Baar-baar badalna ho to StringBuilder use karo."}, "u1-t1": {"story": "Socho ek aisa magic language chahiye jo har phone, laptop aur TV pe chale. 1995 mein Sun Microsystems ke James Gosling ne Java banayi, pehle iska naam Oak tha. Ek baar likho, kahin bhi chalao: ye Java ka sabse bada jaadu hai.", "items": [["📅", "History", "Java 1991 mein shuru hui, 1995 mein release hui. Baad mein Oracle ne Sun ko khareed liya, jaise bade bhaiya ne chhote ki dukaan le li."], ["🧸", "Simple", "Java ke rules LEGO jaise aasan hain. C++ ke complicated pointers nahi hain, to galti kam hoti hai."], ["🧱", "Object-Oriented", "Sab kuch object hai, jaise ghar mein har cheez ki apni jagah aur kaam hota hai: pankha, TV, fridge."], ["🌍", "Platform Independent", "Tumhara tiffin kisi bhi school mein khul jata hai, waise hi Java ka code Windows, Mac aur Linux sab pe chalta hai."], ["🔒", "Secure", "Ghar ke gate pe guard hai. Java bina permission ke tumhare computer ki files ko haath nahi lagata."], ["💪", "Robust", "Mazboot gaadi jaise: galti hone par bhi puri tarah toot nahi jati. Java galti pakadti hai aur exceptions sambhalti hai."], ["🧵", "Multithreaded", "Ek hi time pe music sunna aur homework karna. Java bhi ek saath kai kaam kar sakti hai."], ["🚀", "High Performance", "Java ka JIT compiler tez rasta yaad rakhta hai, jaise roz ke school route ko tum bina sochey cross kar lete ho."]], "line": "Java = ek baar likho, kahin bhi chalao (Write Once, Run Anywhere)."}, "u1-t2": {"story": "Maggi banane ke do tareeke hain. Pehla: ek lambi recipe, step 1, step 2, step 3, bas. Dusra: ek chef (object) jise pata hai Maggi kaise banti hai, tum sirf bolte ho 'Maggi bana do'. Pehla procedural hai, dusra object-oriented.", "items": [["📋", "Procedural", "Recipe ki list: pehle ye, phir ye. Kaam functions mein bata hota hai aur data sabke liye khula hota hai."], ["🧑‍🍳", "Object-Oriented", "Data aur kaam ek saath ek object mein. Jaise chef ke paas saaman bhi hai aur banana bhi aata hai."], ["🛡️", "Encapsulation", "Medicine capsule: andar ki dawai bahar se nahi dikhti. Data chhupa ke rakho aur sirf ek safe darwaze se do."], ["🎭", "Polymorphism", "Ek hi \"awaaz karo\" bolne par kutta bhonkta hai, billi meow karti hai. Ek naam, kai roop."], ["👪", "Inheritance", "Bachche ko papa ki aankhein mil jati hain. Naya class purane class ki cheezein free mein le leta hai."], ["🎬", "Abstraction", "TV chalane ke liye remote dabate ho, andar ka circuit nahi dekhte. Sirf zaruri cheez dikhao."]], "line": "Procedural = steps ki list. OOP = objects ki duniya, jahan har object apna kaam jaanta hai."}, "u1-t3": {"story": "Socho tum cricket khelna chahte ho. JVM khilaadi hai jo khelta hai. JRE poora ground aur saaman hai jahan khel chal sakta hai. JDK poora academy hai jahan khel sikhne, banane aur khelne ka sab kuch milta hai.", "items": [["🏏", "JVM", "Ye khilaadi hai. Tumhara bytecode (`.class` file) padhta hai aur usko computer ki bhasha mein chalata hai."], ["🏟️", "JRE", "Ground + saaman. Java program ko chalane ke liye JVM aur zaruri libraries. Sirf chalana hai to itna kaafi."], ["🏫", "JDK", "Poori academy. Isme JRE ke saath `javac` compiler jaise tools bhi hain, jo program banane ke liye chahiye."], ["🔄", "Bytecode", "Ek aisi common bhasha jo sab computers ka JVM samajhta hai, jaise English duniya mein sab samajh lete hain."]], "line": "JDK ⊃ JRE ⊃ JVM. Banana hai to JDK, chalana hai to JRE, asli kaam JVM karta hai."}, "u1-t4": {"story": "Variable ek dabba hai jispe naam likha hota hai. Data type batata hai dabbe mein kya rakh sakte ho: paani ki bottle mein paani, tiffin mein khana. Galat cheez rakhoge to Java mana kar degi.", "items": [["🔢", "int", "Poore number jaise 5, 100, -3. Jaise gintee ke pencil."], ["🔣", "double", "Point wale number jaise 3.14. Jaise naap-tol mein 2.5 kg."], ["🔤", "char", "Sirf ek akshar, single quote mein: `'A'`. Jaise ek stamp."], ["✅", "boolean", "Sirf haan ya na: `true` ya `false`. Jaise light ON ya OFF."], ["📝", "String", "Akshron ki line, jaise naam \"Ravi\". Ye primitive nahi, ek class hai."], ["📦", "byte, short, long, float", "Dabbe ke alag size. byte chhota, long bahut bada. Zarurat ke hisaab se chuno."], ["🏠", "Local, instance, static variable", "Local: sirf kamre ke andar. Instance: har bachche ka apna bag. Static: poori class ka ek common board."], ["🔁", "Type casting", "Chhote glass ka paani bade glass mein dalna safe hai (widening). Ulta karoge to kuch gir sakta hai (narrowing), isliye saavdhani se."]], "line": "Variable = naam wala dabba. Data type = us dabbe mein kya aa sakta hai."}, "u1-t5": {"story": "Operators calculator ke buttons hain. Plus, minus, compare karna, 'aur/ya' sochna: sab operators ka kaam hai.", "items": [["➕", "Arithmetic", "`+ - * / %` jaise maths. `%` bachi hui cheez batata hai: 7 chocolate 3 bachon mein baanto to 1 bachta hai."], ["⚖️", "Relational", "`> < == !=` do cheezon ko tarazu pe tolna. Jawab true ya false."], ["🤝", "Logical", "`&&` = dono sach hone chahiye (chai AUR biscuit). `||` = ek bhi kaafi (chai YA coffee). `!` = ulta."], ["📥", "Assignment", "`=` dabbe mein cheez rakhna. `+=` jo hai usme aur jodna, jaise piggy bank mein aur paise."], ["☝️", "Unary", "`++` aur `--`: ek se badhana ya ghatana, jaise lift mein ek floor upar ya neeche."], ["❓", "Ternary", "`condition ? haan : na`. Ek line ka sawaal-jawab: baarish hai ? chhata : topi."], ["🔌", "Bitwise", "`& | ^ << >>` bits (0 aur 1) pe kaam. Jaise light ke switches ko ek-ek karke dekhna."]], "line": "Operator = ek chhota sa tool jo values pe kaam karke naya result deta hai."}, "u1-t6": {"story": "Control structures traffic signal jaise hain. Konsa rasta lena hai (decision), kitni baar chakkar lagana hai (loop), kahan ruk jana hai (break): sab yahi batate hain.", "items": [["🔀", "if / else", "Agar baarish hai to chhata lo, warna nahi. Ek condition dekho aur raasta chuno."], ["🍽️", "switch", "Restaurant ka menu number: 1 dabao to dosa, 2 dabao to idli. Ek value ke hisaab se alag-alag option."], ["🔁", "for loop", "Jab pata ho kitni baar: 10 baar uthak-baithak karo."], ["⏳", "while loop", "Jab tak condition sach hai tab tak karo: jab tak bhookh hai khana khao."], ["🔂", "do-while", "Pehle ek baar karo, phir poocho. Jaise chai ek ghoont pehle piyo, phir socho aur chahiye ya nahi."], ["🛑", "break", "Loop ke beech mein rukna: aam mil gaya, ab dhoondhna band."], ["⏭️", "continue", "Is baar chhodo, agli baar karo: kharab aam ko haath lagaye bina aage badh jao."], ["📚", "for-each", "Poori list mein se ek-ek cheez uthana, jaise bag se ek-ek kitab nikalna."]], "line": "if/switch = decision. for/while/do-while = repeat. break/continue = loop ko control karna."}, "u1-t7": {"story": "Pehla Java program ek chitthi bhejne jaisa hai. Tum chitthi likhte ho (`.java`), post office use sort karke ek standard form mein badalta hai (`javac` se `.class`), aur phir postman (`java` command / JVM) use padhke deliver karta hai.", "items": [["🏠", "public class Main", "Program ka ghar. File ka naam aur public class ka naam same hona chahiye."], ["🚪", "main method", "Gate number 1. Java yahin se program shuru karti hai: `public static void main(String[] args)`."], ["📢", "System.out.println", "Screen pe likhne ka loudspeaker. Bracket mein jo likhoge wo print hoga."], ["🛠️", "javac", "Translator. Tumhara code padhke bytecode (`.class`) banata hai. Galti ho to yahin batata hai."], ["▶️", "java", "Chalane wala. JVM ko bolta hai: ab ye `.class` file chalao."], ["🔗", "Poora flow", "Likho (`.java`) → Compile (`javac`) → Bytecode (`.class`) → Chalao (`java`)."]], "line": "Hello World = likho, `javac` se compile karo, `java` se chalao."}});
const NOTES_KEY = 'oopJavaCourse_notes_105303';
function inl(t){ // safe inline markup: `code` and **bold**
  return escapeHtml(String(t==null?'':t)).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
}
function plain(t){ return String(t==null?'':t).replace(/`([^`]+)`/g,'$1').replace(/\*\*([^*]+)\*\*/g,'$1'); }
function mk(tag, cls, html){ const e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e; }
function lessonViz(v){
  const box=mk('div','lviz');
  if(v.type==='chain'){
    const row=mk('div','lviz-chain');
    v.items.forEach((it,i)=>{
      if(i) row.appendChild(mk('span','lviz-arrow','→')).style.setProperty('--i',i*2-1);
      const n=mk('span','lviz-node',inl(it)); n.style.setProperty('--i',i*2); row.appendChild(n);
    });
    box.appendChild(row);
  } else if(v.type==='tree'){
    box.appendChild(Object.assign(mk('div','lviz-node root',inl(v.root)),{})).style.setProperty('--i',0);
    box.appendChild(mk('div','lviz-stem')).style.setProperty('--i',1);
    const kids=mk('div','lviz-kids');
    v.kids.forEach((k,i)=>{ const n=mk('span','lviz-node',inl(k)); n.style.setProperty('--i',i+2); kids.appendChild(n); });
    box.appendChild(kids);
  } else if(v.type==='merge'){
    const ps=mk('div','lviz-kids'); v.parents.forEach((k,i)=>{ const n=mk('span','lviz-node root',inl(k)); n.style.setProperty('--i',i); ps.appendChild(n); }); box.appendChild(ps);
    box.appendChild(mk('div','lviz-stem')).style.setProperty('--i',v.parents.length);
    const c=mk('div','lviz-node'+(v.bad?' bad':''),inl(v.child)+(v.bad?' ✖':'')); c.style.setProperty('--i',v.parents.length+1); box.appendChild(c);
  } else if(v.type==='diamond'){
    const t=mk('div','lviz-node root',inl(v.top)); t.style.setProperty('--i',0); box.appendChild(t);
    const mid=mk('div','lviz-kids'); v.mid.forEach((k,i)=>{ const n=mk('span','lviz-node',inl(k)); n.style.setProperty('--i',i+1); mid.appendChild(n); }); box.appendChild(mid);
    const b=mk('div','lviz-node bad',inl(v.bottom)); b.style.setProperty('--i',4); box.appendChild(b);
  }
  if(v.caption) box.appendChild(mk('div','lviz-cap',inl(v.caption)));
  return box;
}

  tb.innerHTML='<tr>'+t.head.map(h=>'<th>'+inl(h)+'</th>').join('')+'</tr>'+t.rows.map(r=>'<tr>'+r.map(c=>'<td>'+inl(c)+'</td>').join('')+'</tr>').join('');

function lessonToText(L, title){
  const o=['# '+title,''];
  if(L.tldr) o.push('In one line: '+plain(L.tldr),'');
  if(L.def) o.push('## Definition',plain(L.def),'');
  (L.sections||[]).forEach(s=>{
    o.push('## '+plain(s.h));
    (s.p||[]).forEach(x=>o.push(plain(x)));
    (s.pts||[]).forEach(x=>o.push('- '+plain(x)));
    if(s.table){ o.push(s.table.head.map(plain).join(' | ')); s.table.rows.forEach(r=>o.push(r.map(plain).join(' | '))); }
    if(s.viz&&s.viz.items) o.push(s.viz.items.map(plain).join(' -> '));
    if(s.code) o.push('```java','// '+(s.code.f||''),s.code.c,'```');
    if(s.code&&s.code.out) o.push('Output: '+s.code.out);
    if(s.tip) o.push('Tip: '+plain(s.tip));
    if(s.warn) o.push('Warning: '+plain(s.warn));
    o.push('');
  });
  [['Where it is used','uses'],['Advantages','pros'],['Limitations','cons'],['Common mistakes','mistakes'],['Quick revision','remember']].forEach(([lb,k])=>{
    if(L[k]&&L[k].length){ o.push('## '+lb); L[k].forEach(x=>o.push('- '+plain(x))); o.push(''); }
  });
  return o.join('\n');
}

function renderDeep(body, unitId, topicId){

  const wrap=document.createElement('div'); wrap.className='detail deep';
  const h=document.createElement('h3'); h.textContent='\uD83D\uDCDA In Detail'; wrap.appendChild(h);
  const row=(label,cls)=>{
    const r=document.createElement('div'); r.className='drow';
    const lb=document.createElement('div'); lb.className='dlbl '+cls; lb.textContent=label;
    const tx=document.createElement('div'); tx.className='dtxt';
    r.appendChild(lb); r.appendChild(tx); wrap.appendChild(r);
    return tx;
  };
  const fill=(tx,content)=>{
    if(Array.isArray(content)){
      const ul=document.createElement('ul');
      content.forEach(t=>{ const li=document.createElement('li'); li.textContent=t; ul.appendChild(li); });
      tx.appendChild(ul);
    } else { tx.textContent=content; }
  };
  fill(row('\uD83D\uDCD6 Definition','a'), d.d);
  fill(row('\uD83D\uDD0E Explained in detail','b'), d.a);
  if(d.x){
    const tx=row('\uD83D\uDCBB Example','a');
    const ed=document.createElement('div'); ed.className='editor';

  fill(row('\u2705 Advantages','b'), d.p);
  fill(row('\u26A0\uFE0F Limitations and common mistakes','c'), d.c);
  body.appendChild(wrap);

      const link = document.createElement('div');

      link.innerHTML = `<span class="check"></span><span>${t.title}</span>`;
      if(doneSet.has(u.id+'-'+t.id)){

      tlist.appendChild(link);

function setTopicDone(unitId, topicId, done){
  const key = unitId+'-'+topicId;
  if(done) doneSet.add(key); else doneSet.delete(key);
  const link = document.querySelector(`.topic-link[data-unit="${unitId}"][data-topic="${topicId}"]`);
  if(link){
    link.classList.toggle('done', done);
    const c = link.querySelector('.check'); if(c) c.textContent = done ? '✓' : '';
  }
  updateXP();
  saveProgress();
}

function updateXP(){
  const pct = Math.round((doneSet.size/TOTAL_TOPICS)*100);
  document.getElementById('xpFill').style.width = pct+'%';
  document.getElementById('xpLabel').textContent = `${doneSet.size} / ${TOTAL_TOPICS} topics done`;
  document.getElementById('progress-bar').style.width = pct+'%';
  const hp=document.getElementById('heroProgress'); if(hp) hp.textContent = `${doneSet.size} / ${TOTAL_TOPICS} topics done`;

    });
    cardsWrap.appendChild(card);
  });
  requestAnimationFrame(()=>{ body.classList.add('show'); triggerReveal(); });
  document.querySelectorAll('.topic-link').forEach(l=>l.classList.remove('active'));
  updateXP();
  const hs=document.getElementById('heroStats');
  if(hs){ const q=Object.values(PRACTICE).reduce((s,a)=>s+a.length,0); hs.innerHTML=`<div class="neu-stat"><b>${UNITS.length}</b><span>Units</span></div><div class="neu-stat"><b>${TOTAL_TOPICS}</b><span>Topics</span></div><div class="neu-stat"><b>${q}</b><span>Questions</span></div>`; }
}

/* ---------- LOAD TOPIC ---------- */
const oosOK = new Set();
function isOos(unitId, topicId){ const u=UNITS.find(x=>x.id===unitId); const t=u&&u.topics.find(x=>x.id===topicId); return !!(t&&t.oos); }
function skipOos(unitId, topicId){
  const i=flatOrder.findIndex(f=>f.unit===unitId&&f.topic===topicId);
  for(let j=i+1;j<flatOrder.length;j++){ if(!isOos(flatOrder[j].unit,flatOrder[j].topic)){ loadTopic(flatOrder[j].unit,flatOrder[j].topic); return; } }
  showHome();
}
function askOos(unitId, topicId){
  const old=document.getElementById('oosModal'); if(old) old.remove();
  const m=document.createElement('div'); m.id='oosModal'; m.className='oos-modal';
  m.innerHTML='<div class="oos-card" role="dialog" aria-modal="true" aria-labelledby="oosT"><div class="oos-ico">!</div><h3 id="oosT">This topic is not in your syllabus</h3><p>This topic is not part of your course syllabus (105303). It will not be asked in your exam.</p><p>But if you still want to study it, you are welcome to. Read it when you have free time.</p><div class="oos-act"><button type="button" class="neu-btn oos-skip">Skip this topic</button><button type="button" class="neu-btn oos-go">I have time, let me read</button></div></div>';
  document.body.appendChild(m);
  m.querySelector('.oos-skip').onclick=()=>{ m.remove(); skipOos(unitId,topicId); };
  m.querySelector('.oos-go').onclick=()=>{ m.remove(); oosOK.add(unitId+'-'+topicId); loadTopic(unitId,topicId); };
}
function loadTopic(unitId, topicId){
  if(isOos(unitId,topicId) && !oosOK.has(unitId+'-'+topicId)){ askOos(unitId,topicId); return; }
  const tplId = `tpl-${unitId}-${topicId}`;
  const tpl = document.getElementById(tplId);
  if(!tpl) return;
  currentUnit = unitId; currentTopic = topicId;

  const body = document.getElementById('topic-body');
  body.classList.remove('show');
  setTimeout(()=>{
    body.innerHTML='';
    body.appendChild(tpl.content.cloneNode(true));
    const hasLesson = renderLesson(body, unitId, topicId);
    wrapTables(body);
    wireQuizzes(body);
    if(!hasLesson) renderDeep(body, unitId, topicId);
    highlightAll(body);
    if(!hasLesson) renderDetail(body, unitId, topicId);
    renderPractice(body, unitId, topicId);
    buildTopicNav(body);
    if(isOos(unitId,topicId)){ const b=document.createElement('div'); b.className='oos-banner'; b.innerHTML='<b>Not in your syllabus.</b> You can skip this topic. Read it only if you have extra time.'; const t=body.querySelector('.topic-title'); if(t&&t.parentNode) t.parentNode.insertBefore(b,t.nextSibling); }
    requestAnimationFrame(()=>{ body.classList.add('show'); triggerReveal(); });
  }, 180);

  // crumb
  const u = UNITS.find(x=>x.id===unitId);
  const t = u.topics.find(x=>x.id===topicId);
  const uIdx = UNITS.indexOf(u)+1;
  document.getElementById('crumb').innerHTML = `<span class="u">UNIT ${uIdx}</span> / ${t.title}`;

  // sidebar active state + mark done (persisted to this browser)
  document.querySelectorAll('.topic-link').forEach(l=>l.classList.remove('active'));
  const activeLink = document.querySelector(`.topic-link[data-unit="${unitId}"][data-topic="${topicId}"]`);
  if(activeLink) activeLink.classList.add('active');
  updateXP();

  window.scrollTo({top:0,behavior:'smooth'});
  document.querySelector('.content-wrap')?.scrollTo?.(0,0);
  document.getElementById('main').scrollTo?.(0,0);
}

/* ---------- PREV/NEXT NAV ---------- */
function syncCompleteBtn(){
  const btn=document.getElementById('completeBtn'); if(!btn) return;
  const d=doneSet.has(currentUnit+'-'+currentTopic);
  btn.classList.toggle('is-done',d);
  btn.querySelector('.cb-txt').textContent = d ? 'Completed — tap to undo' : 'Mark as complete';
  btn.setAttribute('aria-pressed', d?'true':'false');
}
function buildTopicNav(body){
  const idx = flatOrder.findIndex(f=>f.unit===currentUnit && f.topic===currentTopic);
  const prev = flatOrder[idx-1];
  const next = flatOrder[idx+1];
  const wrap = document.createElement('div');
  wrap.className='topic-nav-wrap reveal';

  const cb = document.createElement('button');
  cb.type='button'; cb.id='completeBtn'; cb.className='complete-btn';
  cb.innerHTML='<span class="cb-ico"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span><span class="cb-txt"></span>';
  cb.addEventListener('click',()=>{ setTopicDone(currentUnit,currentTopic,!doneSet.has(currentUnit+'-'+currentTopic)); syncCompleteBtn(); });
  wrap.appendChild(cb);

  const nav = document.createElement('div');
  nav.className='topic-nav';
  const arrow='<svg class="pn-arrow" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
  const prevBtn = document.createElement('button'); prevBtn.type='button';
  prevBtn.className='pn-btn pn-prev'+(prev?'':' disabled');
  if(prev){
    const pu=UNITS.find(u=>u.id===prev.unit), pt=pu.topics.find(t=>t.id===prev.topic);
    prevBtn.innerHTML = `${arrow}<span class="pn-txt"><span class="dir">Previous</span><span class="ttl">${pt.title}</span></span>`;
    prevBtn.addEventListener('click',()=>loadTopic(prev.unit,prev.topic));
  }
  const nextBtn = document.createElement('button'); nextBtn.type='button';
  nextBtn.className='pn-btn pn-next'+(next?'':' disabled');
  if(next){
    const nu=UNITS.find(u=>u.id===next.unit), nt=nu.topics.find(t=>t.id===next.topic);
    nextBtn.innerHTML = `<span class="pn-txt"><span class="dir">Next</span><span class="ttl">${nt.title}</span></span>${arrow}`;
    nextBtn.addEventListener('click',()=>loadTopic(next.unit,next.topic));
  }
  nav.appendChild(prevBtn); nav.appendChild(nextBtn);
  wrap.appendChild(nav);
  body.appendChild(wrap);
  syncCompleteBtn();
}

/* ---------- SCROLL REVEAL ---------- */
const observer = new IntersectionObserver((entries)=>{
  entries.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('visible'); } });
},{threshold:0.1});
function triggerReveal(){
  const targets = document.querySelectorAll('.reveal:not(.visible)');
  targets.forEach(el=>observer.observe(el));
  // Safety net: some embedded WebViews / preview iframes never fire
  // IntersectionObserver correctly, which would leave content stuck at
  // opacity:0 (looking like a permanent haze). Force it visible shortly
  // after render no matter what.
  setTimeout(()=>{
    document.querySelectorAll('.reveal:not(.visible)').forEach(el=>el.classList.add('visible'));
  }, 700);
}

/* ---------- CODE HIGHLIGHTER ---------- */
const JAVA_KEYWORDS = ['abstract','assert','boolean','break','byte','case','catch','char','class','const','continue','default','do','double','else','enum','extends','final','finally','float','for','goto','if','implements','import','instanceof','int','interface','long','native','new','package','private','protected','public','return','short','static','strictfp','super','switch','synchronized','this','throw','throws','transient','try','void','volatile','while','true','false','null','var'];
function escapeHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
// Single-pass tokenizer: scans RAW source once, classifies each token, and never
// re-scans text it has already generated (avoids corrupting inserted <span> markup).
const HL_REGEX = new RegExp(
  '(\\/\\/[^\\n]*)' +                          // 1: line comment
  '|(\\/\\*[\\s\\S]*?\\*\\/)' +                  // 2: block comment
  '|("(?:[^"\\\\]|\\\\.)*")' +                   // 3: double-quoted string
  "|('(?:[^'\\\\]|\\\\.)*')" +                   // 4: single-quoted char
  '|(@[A-Za-z]+)' +                             // 5: annotation
  '|\\b(\\d+\\.?\\d*)\\b' +                      // 6: number
  '|\\b(' + JAVA_KEYWORDS.join('|') + ')\\b' +   // 7: keyword
  '|\\b([A-Z][A-Za-z0-9_]*)\\b'                 // 8: capitalized type/class name
  , 'g');
function highlightJava(raw){
  let out = '';
  let last = 0;
  let m;
  HL_REGEX.lastIndex = 0;
  while((m = HL_REGEX.exec(raw))){
    out += escapeHtml(raw.slice(last, m.index));
    const full = m[0];
    const safe = escapeHtml(full);
    if(m[1]||m[2]) out += `<span class="tok-com">${safe}</span>`;
    else if(m[3]||m[4]) out += `<span class="tok-str">${safe}</span>`;
    else if(m[5]) out += `<span class="tok-ann">${safe}</span>`;
    else if(m[6]!==undefined) out += `<span class="tok-num">${safe}</span>`;
    else if(m[7]!==undefined) out += `<span class="tok-kw">${safe}</span>`;
    else if(m[8]!==undefined) out += `<span class="tok-type">${safe}</span>`;
    else out += safe;
    last = HL_REGEX.lastIndex;
  }
  out += escapeHtml(raw.slice(last));
  return out;
}
function highlightAll(root){
  root.querySelectorAll('pre code[data-lang="java"]').forEach(block=>{
    if(block.dataset.done) return;
    block.innerHTML = highlightJava(block.textContent);
    block.dataset.done='1';
  });
  root.querySelectorAll('pre code[data-lang="bash"]').forEach(block=>{
    if(block.dataset.done) return;
    block.innerHTML = escapeHtml(block.textContent).replace(/(#.*$)/gm,'<span class="tok-com">$1</span>');
    block.dataset.done='1';
  });
}

/* ---------- RESPONSIVE TABLES ---------- */
function wrapTables(root){
  root.querySelectorAll('table.tbl').forEach(table=>{
    if(table.parentElement && table.parentElement.classList.contains('table-scroll')) return;
    const wrap = document.createElement('div');
    wrap.className = 'table-scroll';
    table.parentNode.insertBefore(wrap, table);
    wrap.appendChild(table);
  });
}

/* ---------- MINI QUIZ ---------- */
function wireQuizzes(root){
  root.querySelectorAll('[data-quiz]').forEach(q=>{
    const opts = q.querySelectorAll('.opt');
    const fb = q.querySelector('.fb');
    opts.forEach(opt=>{
      opt.addEventListener('click',()=>{
        if(opt.dataset.answered) return;
        opts.forEach(o=>o.dataset.answered='1');
        const correct = opt.dataset.correct === 'true';
        opts.forEach(o=>{
          if(o.dataset.correct==='true') o.classList.add('correct');
          else if(o===opt) o.classList.add('wrong');
        });
        fb.textContent = correct ? "✅ Correct! Nicely done." : "❌ Not quite — the right answer is highlighted above.";
        fb.classList.add('show');
      });
    });
  });
}

/* ---------- SEARCH ---------- */
document.getElementById('search').addEventListener('input', (e)=>{
  const q = e.target.value.toLowerCase().trim();
  document.querySelectorAll('.unit-block').forEach(block=>{
    let anyMatch = false;
    block.querySelectorAll('.topic-link').forEach(link=>{
      const text = link.textContent.toLowerCase();
      const match = text.includes(q);
      link.style.display = match ? 'flex' : 'none';
      if(match) anyMatch = true;
    });
    if(q){ block.classList.toggle('open', anyMatch); block.style.display = anyMatch ? '' : 'none'; }
    else { block.style.display=''; block.querySelectorAll('.topic-link').forEach(l=>l.style.display='flex'); }
  });
});

/* ---------- RESET PROGRESS ---------- */
document.getElementById('resetBtn')?.addEventListener('click', ()=>{
  if(!confirm('Reset your saved progress for this course? This clears every topic marked as done on this device.')) return;
  doneSet.clear();
  try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
  document.querySelectorAll('.topic-link').forEach(l=>{ l.classList.remove('done','active'); const c=l.querySelector('.check'); if(c) c.textContent=''; });
  updateXP();
  const t = document.getElementById('saveStatusText');
  if(t) t.textContent = 'Progress reset';
  if(!currentUnit) showHome();
});

/* ---------- MOBILE SIDEBAR ---------- */
function closeSidebar(){ document.getElementById('sidebar').classList.remove('open'); document.getElementById('overlay').classList.remove('show'); }
document.getElementById('menuBtn')?.addEventListener('click', ()=>{
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('overlay').classList.add('show');
});
document.getElementById('overlay').addEventListener('click', closeSidebar);
document.getElementById('sidebarCloseBtn')?.addEventListener('click', closeSidebar);

/* ---------- KEYBOARD NAV ---------- */
document.addEventListener('keydown',(e)=>{
  if(!currentUnit) return;
  if(e.key==='ArrowRight'){ const idx=flatOrder.findIndex(f=>f.unit===currentUnit&&f.topic===currentTopic); const n=flatOrder[idx+1]; if(n) loadTopic(n.unit,n.topic); }
  if(e.key==='ArrowLeft'){ const idx=flatOrder.findIndex(f=>f.unit===currentUnit&&f.topic===currentTopic); const p=flatOrder[idx-1]; if(p) loadTopic(p.unit,p.topic); }
});
</script>
