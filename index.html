<template id="tpl-u3-t6">
<div class="topic-eyebrow">Unit 3 · Topic 6</div>
<h1 class="topic-title">Polymorphism (Part 2) — Method Overriding</h1>
<p class="topic-hook">When a child class REDEFINES a parent's method in its own way.</p>

<div class="block reveal">
  <h3><span class="ico">🧠</span> ELI5</h3>
  <p>Overriding happens when a child class redefines its parent class's method with the <b>SAME name and SAME parameters</b> — but gives it its own behavior. It's decided at <b>runtime</b> which version runs, based on the <b>actual object</b>.</p>
</div>

<div class="editor reveal">
  <div class="editor-bar"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div><span class="fname">Override.java</span></div>
  <pre><code data-lang="java">class Animal {
    void sound() { System.out.println("Animal makes sound"); }
}
class Dog extends Animal {
    @Override
    void sound() { System.out.println("Dog barks"); }
}
public class Main {
    public static void main(String[] args) {
        Animal a = new Dog();   // Reference type is Animal, object is Dog
        a.sound();               // Output: "Dog barks"
    }
}</code></pre>
</div>
<div class="breakdown reveal">
  <div class="lbl">🔍 The Most Important Point</div>
  <div class="row"><span class="k">Animal a = new Dog()</span><span class="v">The reference TYPE is Animal, but the actual OBJECT is Dog</span></div>
  <div class="row"><span class="k">a.sound()</span><span class="v">The JVM IGNORES the reference type and runs the method of the actual object (Dog) — that's why "Dog barks" gets printed, not "Animal makes sound"!</span></div>
  <div class="row"><span class="k">@Override</span><span class="v">This is an annotation that tells the compiler "I'm overriding this" — if the spelling or signature is wrong, the compiler will immediately throw an error. It's good practice to write it</span></div>
</div>

<table class="tbl reveal">
  <tr><th>Feature</th><th>Overloading</th><th>Overriding</th></tr>
  <tr><td>When It's Decided</td><td>Compile-time</td><td>Run-time</td></tr>
  <tr><td>Where It Happens</td><td>Same class</td><td>Different classes (Inheritance)</td></tr>
  <tr><td>Parameters</td><td>Must be different</td><td>Must be the same</td></tr>
  <tr><td>Binding</td><td>Static</td><td>Dynamic</td></tr>
</table>

<div class="keypoints reveal">
  <div class="lbl">🔑 Rules for Overriding</div>
  <ul>
    <li>Method name, return type, and parameters must match exactly</li>
    <li>The access modifier can't be MORE restrictive than the parent's</li>
    <li><code>private</code>, <code>static</code>, and <code>final</code> methods CANNOT be overridden</li>
  </ul>
</div>

<div class="mini-quiz reveal" data-quiz>
  <div class="lbl">🎯 Quick Check</div>
  <div class="q">In <code>Animal a = new Dog();</code>, which method runs when you call <code>a.sound()</code>?</div>
  <button class="opt" data-correct="false">Animal's sound() (based on the reference type)</button>
  <button class="opt" data-correct="true">Dog's sound() (based on the actual object)</button>
  <div class="fb"></div>
</div>
</template>

<template id="tpl-u3-t7">
<div class="topic-eyebrow">Unit 3 · Topic 7</div>
<h1 class="topic-title">Abstraction &amp; Abstract Classes</h1>
<p class="topic-hook">Show WHAT happens, hide HOW it happens.</p>

<div class="block reveal">
  <h3><span class="ico">🧠</span> ELI5</h3>
  <p>Abstraction means <b>hiding the implementation details</b> and showing only the essential features.</p>
  <div class="analogy">
    <div class="lbl">🔦 Real-Life Analogy</div>
    <p>When you drive a car, you just need to know the steering, accelerator, and brake (WHAT the car does). You don't need to know exactly what's happening inside the engine (HOW). That's Abstraction!</p>
  </div>
</div>

<div class="block reveal">
  <h3><span class="ico">🏗️</span> Abstract Class</h3>
  <p>A class whose <b>object CANNOT be created</b>. It can contain 2 kinds of methods:</p>
  <ul>
    <li><b>Abstract methods</b> — no body, just a declaration (the child MUST implement it)</li>
    <li><b>Concrete methods</b> — a normal method, with a body</li>
  </ul>
  <table class="tbl">
    <tr><th>What's Allowed Inside an Abstract Class?</th><th>Allowed?</th></tr>
    <tr><td>Abstract Methods</td><td>✅</td></tr>
    <tr><td>Concrete Methods</td><td>✅</td></tr>
    <tr><td>Constructors</td><td>✅</td></tr>
    <tr><td>Instance Variables</td><td>✅</td></tr>
    <tr><td>Static Methods</td><td>✅</td></tr>
    <tr><td>Object Creation</td><td>❌</td></tr>
  </table>
</div>

<div class="editor reveal">
  <div class="editor-bar"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div><span class="fname">Shape.java</span></div>
  <pre><code data-lang="java">abstract class Shape {
    abstract void draw();        // abstract method (no body)
    void color() {                // concrete method (has a body)
        System.out.println("Color is set");
    }
}
class Circle extends Shape {
    void draw() { System.out.println("Drawing Circle"); }   // had to implement it
}</code></pre>
</div>
<div class="breakdown reveal">
  <div class="lbl">🔍 Breakdown</div>
  <div class="row"><span class="k">abstract void draw();</span><span class="v">There's no body (it just ends with a semicolon) — meaning "every child class must define this itself"</span></div>
  <div class="row"><span class="k">class Circle extends Shape</span><span class="v">Circle extends Shape, so it's COMPULSORY for Circle to implement <code>draw()</code> — otherwise Circle would also have to be made abstract</span></div>
</div>

<div class="keypoints reveal">
  <div class="lbl">🔑 Important Notes</div>
  <ul>
    <li>You <b>CANNOT</b> create an object of an abstract class — <code>new Shape()</code> ❌ will error out</li>
    <li>If a class extends an abstract class, it MUST implement ALL its abstract methods (or become abstract itself)</li>
  </ul>
</div>
</template>

<template id="tpl-u3-t8">
<div class="topic-eyebrow">Unit 3 · Topic 8</div>
<h1 class="topic-title">Interface</h1>
<p class="topic-hook">A "contract" that tells a class what it must do.</p>

<div class="block reveal">
  <h3><span class="ico">🧠</span> ELI5</h3>
  <p>An interface is a <b>blueprint of a class</b> — a "contract" that says which methods a class must implement, but doesn't say HOW to do it. It only contains abstract methods (public + abstract by default) and constants.</p>
  <div class="analogy">
    <div class="lbl">🔦 Real-Life Analogy</div>
    <p>Think of a job contract — "the employee must show up and hit their targets" — it sets EXPECTATIONS, but exactly how they get there is up to the employee. An interface is exactly that kind of contract.</p>
  </div>
</div>

<div class="editor reveal">
  <div class="editor-bar"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div><span class="fname">Animal.java</span></div>
  <pre><code data-lang="java">interface Animal {
    void sound();     // default: public and abstract
}
class Dog implements Animal {
    public void sound() { System.out.println("Dog barks"); }
}
class Main {
    public static void main(String[] args) {
        Animal a = new Dog();
        a.sound();     // Output: Dog barks
    }
}</code></pre>
</div>
<div class="breakdown reveal">
  <div class="lbl">🔍 Breakdown</div>
  <div class="row"><span class="k">interface Animal</span><span class="v">The <code>interface</code> keyword is used instead of <code>class</code></span></div>
  <div class="row"><span class="k">class Dog implements Animal</span><span class="v">A class doesn't "extend" an interface, it <code>implements</code> it — and it's COMPULSORY to define ALL of its abstract methods</span></div>
</div>

<div class="block reveal">
  <h3><span class="ico">⚡</span> Modern Java Interface Methods (Java 8+)</h3>
  <table class="tbl">
    <tr><th>Type</th><th>Has a Body?</th><th>Since</th></tr>
    <tr><td>Abstract Method</td><td>No</td><td>Always</td></tr>
    <tr><td>Default Method</td><td>Yes</td><td>Java 8</td></tr>
    <tr><td>Static Method</td><td>Yes</td><td>Java 8</td></tr>
    <tr><td>Private Method</td><td>Yes (only as a helper inside the interface)</td><td>Java 9</td></tr>
  </table>
  <div class="editor">
    <div class="editor-bar"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div><span class="fname">Vehicle.java</span></div>
    <pre><code data-lang="java">interface Vehicle {
    void start();                          // abstract
    default void stop() {                  // default method — has a body
        System.out.println("Vehicle Stopped");
    }
}
class Car implements Vehicle {
    public void start() { System.out.println("Car Started"); }
    // no need to override stop() -> the default will be used
}</code></pre>
  </div>
</div>

<div class="block reveal">
  <h3><span class="ico">🔗</span> Multiple Inheritance via Interface</h3>
  <p>A class can implement MULTIPLE interfaces — this is how Java solves the multiple inheritance problem:</p>
  <div class="editor">
    <div class="editor-bar"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div><span class="fname">Multi.java</span></div>
    <pre><code data-lang="java">interface Runnable2 { void run(); }
interface Serializable2 { void save(); }
class MyTask implements Runnable2, Serializable2 {
    public void run() { System.out.println("Running"); }
    public void save() { System.out.println("Saving"); }
}</code></pre>
  </div>
</div>
</template>

<template id="tpl-u3-t9">
<div class="topic-eyebrow">Unit 3 · Topic 9</div>
<h1 class="topic-title">Interface vs Abstract Class</h1>
<p class="topic-hook">Both give you "abstraction" — but when should you use which one?</p>

<table class="tbl reveal">
  <tr><th>Feature</th><th>Abstract Class</th><th>Interface</th></tr>
  <tr><td>Keyword</td><td><code>abstract</code></td><td><code>interface</code></td></tr>
  <tr><td>Methods</td><td>Abstract + Concrete</td><td>Abstract only (default/static too, in Java 8+)</td></tr>
  <tr><td>Instance Variables</td><td>✅</td><td>❌ (constants only)</td></tr>
  <tr><td>Constructor</td><td>✅</td><td>❌</td></tr>
  <tr><td>Multiple Inheritance</td><td>❌ (can only extend one class)</td><td>✅ (can implement many interfaces)</td></tr>
  <tr><td>Object Creation</td><td>❌</td><td>❌</td></tr>
  <tr><td>State (Data)</td><td>Can maintain it</td><td>No</td></tr>
  <tr><td>Use Case</td><td>Need common implementation + state</td><td>Just need to define a contract/behavior</td></tr>
</table>

<div class="diagram reveal">
  <div class="diagram-title">Quick Decision Guide</div>
  <div class="flow-down">
    <div class="flow-node acc">Need common implementation + state?</div>
    <div class="flow-arrow">⌄ Yes</div>
    <div class="flow-node teal">Use an Abstract Class</div>
  </div>
  <div class="flow-down" style="margin-top:10px;">
    <div class="flow-node acc">Need multiple behaviors implemented?</div>
    <div class="flow-arrow">⌄ Yes</div>
    <div class="flow-node teal">Use an Interface</div>
  </div>
</div>

<div class="block reveal">
  <h3><span class="ico">🔥</span> Bonus — Functional Interface &amp; Lambda (Java 8)</h3>
  <p>An interface with <b>only ONE abstract method</b> is called a "Functional Interface." We use a <b>Lambda Expression</b> to implement it in a compact way.</p>
  <div class="editor">
    <div class="editor-bar"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div><span class="fname">Lambda.java</span></div>
    <pre><code data-lang="java">@FunctionalInterface
interface MyFunctional {
    void show(String msg);
}
public class Test {
    public static void main(String[] args) {
        MyFunctional mf = (msg) -> System.out.println(msg);   // Lambda!
        mf.show("Hello Java 8");
    }
}</code></pre>
  </div>
  <div class="hinglish">
    <div class="lbl">💬 The Simple Way to Understand It</div>
    <p><code>(msg) -> System.out.println(msg)</code> — this is a compact way of writing a method, without creating a whole class. Read <code>-></code> as "goes to": "msg goes to System.out.println(msg)."</p>
  </div>
</div>
</template>

<template id="tpl-u3-t10">
<div class="topic-eyebrow">Unit 3 · Topic 10</div>
<h1 class="topic-title">IS-A vs HAS-A Relationship</h1>
<p class="topic-hook">How do we define the relationship between two classes?</p>

<div class="block reveal">
  <h3><span class="ico">🧠</span> ELI5</h3>
  <p><b>IS-A</b> (Inheritance) = "this IS A type of that thing" → <code>Dog IS-A Animal</code>. <b>HAS-A</b> (Composition) = "this HAS another thing inside it" → <code>Car HAS-A Engine</code>.</p>
</div>

<table class="tbl reveal">
  <tr><th>Aspect</th><th>IS-A (Inheritance)</th><th>HAS-A (Composition)</th></tr>
  <tr><td>Keyword</td><td><code>extends</code></td><td>Holding an object as a field</td></tr>
  <tr><td>Coupling</td><td>Tight (more tightly linked)</td><td>Loose (less tightly linked)</td></tr>
  <tr><td>Flexibility</td><td>Less</td><td>More</td></tr>
</table>

<div class="editor reveal">
  <div class="editor-bar"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div><span class="fname">Relations.java</span></div>
  <pre><code data-lang="java">// IS-A
class Animal { }
class Dog extends Animal { }      // Dog IS-A Animal

// HAS-A
class Engine { }
class Car {
    Engine engine = new Engine();  // Car HAS-A Engine
}</code></pre>
</div>

<div class="keypoints reveal">
  <div class="lbl">🔑 Best Practice</div>
  <p style="font-size:14.5px;">Whenever possible, <b>Composition (HAS-A)</b> is considered better than <b>Inheritance (IS-A)</b> — it keeps code loosely coupled and flexible. Only use IS-A when there's a TRUE parent-child relationship.</p>
</div>
</template>

<template id="tpl-u3-t11">
<div class="topic-eyebrow">Unit 3 · Topic 11</div>
<h1 class="topic-title">Encapsulation</h1>
<p class="topic-hook">Keeping data in a secure "box" — the fourth pillar of OOP.</p>

<div class="block reveal">
  <h3><span class="ico">🧠</span> ELI5</h3>
  <p>Encapsulation means wrapping data (variables) and code (methods) into ONE unit, and <b>protecting the data from direct access</b>.</p>
  <div class="analogy">
    <div class="lbl">🔦 Real-Life Analogy</div>
    <p>Think of a medicine capsule — you don't eat the medicine inside it directly, you take the whole capsule (in a controlled way). Similarly, we don't access a class's data directly, we go through "getter/setter" methods.</p>
  </div>
  <div class="keypoints">
    <div class="lbl">Key Points</div>
    <ul>
      <li>Achieved by using access modifiers</li>
      <li>Class variables should be kept <b>private</b></li>
      <li>Access is given through public <b>getter and setter</b> methods</li>
      <li>Protects data from accidental modification</li>
    </ul>
  </div>
</div>

<div class="editor reveal">
  <div class="editor-bar"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div><span class="fname">Student.java</span></div>
  <pre><code data-lang="java">class Student {
    private int id;         // private -> no direct access from outside
    private String name;

    public int getId() { return id; }              // GETTER
    public void setId(int id) { this.id = id; }     // SETTER

    public String getName() { return name; }
    public void setName(String name) { this.name = name; }
}</code></pre>
</div>
<div class="breakdown reveal">
  <div class="lbl">🔍 Breakdown</div>
  <div class="row"><span class="k">private int id</span><span class="v">No one outside can directly write <code>obj.id = 5</code> — it'll cause a compile error</span></div>
  <div class="row"><span class="k">getId() / setId()</span><span class="v">These are "public gates" — you read or set id through them in a controlled way (you can even add validation inside the setter, like "id can't be negative")</span></div>
</div>

<div class="diagram reveal">
  <div class="diagram-title">How It Works</div>
  <div class="flow-down">
    <div class="flow-node">Client Code: obj.setId(101)</div>
    <div class="flow-arrow">⌄ through</div>
    <div class="flow-node acc">Public setId() method (gate)</div>
    <div class="flow-arrow">⌄</div>
    <div class="flow-node teal">Private id (protected data)</div>
  </div>
</div>

<div class="keypoints reveal">
  <div class="lbl">🔑 Remember This</div>
  <p style="font-size:14.5px;">Make variables private → provide public getters/setters → access/modify data only through those methods.</p>
</div>
</template>

<div class="topic-eyebrow">Unit 4 · Topic 1</div>
<h1 class="topic-title">Error vs Exception</h1>
<p class="topic-hook">When something goes wrong in a program — what do we call it, and what types are there?</p>

<div class="block reveal">
  <h3><span class="ico">🧠</span> ELI5</h3>
  <p>An exception is an <b>unwanted/unexpected event</b> that stops the program's normal flow (like dividing by 0, or accessing an invalid array index).</p>
  <div class="analogy">
    <div class="lbl">🔦 Real-Life Analogy</div>
    <p>Imagine you're driving and suddenly get a flat tire — that's an "exception." You can stop, put on the spare tire, and continue (handle it) — there's no need to cancel the whole trip.</p>
  </div>
</div>

<table class="tbl reveal">
  <tr><th>Aspect</th><th>Error</th><th>Exception</th></tr>
  <tr><td>Meaning</td><td>A serious problem, generally can't be handled</td><td>A problem that CAN be caught and handled</td></tr>
  <tr><td>Cause</td><td>System-level (JVM/hardware)</td><td>Program-level (logic/input issue)</td></tr>
  <tr><td>Example</td><td>OutOfMemoryError, StackOverflowError</td><td>ArithmeticException, NullPointerException</td></tr>
  <tr><td>Recovery</td><td>Generally not possible</td><td>Can be recovered with try-catch</td></tr>
</table>

<div class="diagram reveal">
  <div class="diagram-title">Exception Hierarchy</div>

  </div>

    </div>

      <div class="flow-arrow">⌄ ⌄</div>

        <div class="flow-node">Checked<br><span style="font-size:10.5px;color:var(--text-faint);">IOException, SQLException</span></div>
        <div class="flow-node">Unchecked (RuntimeException)<br><span style="font-size:10.5px;color:var(--text-faint);">ArithmeticException, NullPointerException</span></div>

<template id="tpl-u4-t2">
<div class="topic-eyebrow">Unit 4 · Topic 2</div>
<h1 class="topic-title">try, catch, finally</h1>
<p class="topic-hook">Java's way of safely handling risky code.</p>

<div class="block reveal">
  <h3><span class="ico">🧠</span> ELI5</h3>
  <p><b>try</b> = "attempt this risky operation." <b>catch</b> = "if something goes wrong, catch it here." <b>finally</b> = "no matter what happens, this part ALWAYS runs" (for cleanup).</p>
</div>

<div class="editor reveal">
  <div class="editor-bar"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div><span class="fname">TryCatch.java</span></div>
  <pre><code data-lang="java">public class Main {
    public static void main(String[] args) {
        try {
            int a = 10, b = 0;
            int result = a / b;             // exception gets thrown here
            System.out.println(result);
        } catch (ArithmeticException e) {
            System.out.println("Cannot divide by zero: " + e.getMessage());
        } finally {
            System.out.println("This always runs (cleanup)");
        }
        System.out.println("Program continues normally");
    }
}</code></pre>
</div>
<div class="breakdown reveal">
  <div class="lbl">🔍 Line-by-Line</div>
  <div class="row"><span class="k">a / b</span><span class="v">Doing 10 ÷ 0 throws an <code>ArithmeticException</code></span></div>
  <div class="row"><span class="k">catch (ArithmeticException e)</span><span class="v">This block "catches" that exception, so the program doesn't crash</span></div>
  <div class="row"><span class="k">finally</span><span class="v">This runs EVERY time, exception or not — perfect for closing files or connections</span></div>
  <div class="row"><span class="k">"Program continues normally"</span><span class="v">This also gets printed — meaning the program did NOT crash, the exception was handled</span></div>
</div>

<table class="tbl reveal">
  <tr><th>Keyword</th><th>Meaning</th></tr>
  <tr><td><code>try</code></td><td>The block of risky code</td></tr>
  <tr><td><code>catch</code></td><td>Handles the exception</td></tr>
  <tr><td><code>finally</code></td><td>ALWAYS runs — for cleanup</td></tr>
  <tr><td><code>throw</code></td><td>Manually raises an exception</td></tr>
  <tr><td><code>throws</code></td><td>Declares in the method signature that an exception might occur</td></tr>
</table>
</template>

<template id="tpl-u4-t3">
<div class="topic-eyebrow">Unit 4 · Topic 3</div>
<h1 class="topic-title">throw vs throws</h1>
<p class="topic-hook">Two very similar-looking keywords, but completely different jobs.</p>

<div class="block reveal">
  <h3><span class="ico">🧠</span> ELI5</h3>
  <p><b>throw</b> = "I am throwing an exception right now" (an action, used at one specific point). <b>throws</b> = "this method MIGHT throw an exception, watch out" (a warning, written in the method signature).</p>
</div>

<div class="editor reveal">
  <div class="editor-bar"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div><span class="fname">ThrowDemo.java</span></div>

    }

}
public static void main(String[] args) {
    try {
        new Main().checkAge(15);
    } catch (Exception e) {

</div>

</div>

<h1 class="topic-title">Multiple Catch, Nested Try &amp; Re-throwing</h1>
<p class="topic-hook">When more than one kind of exception can occur, or when one try sits inside another.</p>

<div class="block reveal">
  <h3><span class="ico">📚</span> Multiple Catch Clauses</h3>
  <div class="editor">
    <div class="editor-bar"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div><span class="fname">Multiple.java</span></div>

    <p>Catch specific exceptions FIRST, and the general one (<code>Exception</code>) always LAST — otherwise you'll get a compile error ("unreachable catch block").</p>

</div>

    }
    int[] arr = new int[3];
    arr[5] = 10;                    // gets caught by the outer catch
} catch (ArrayIndexOutOfBoundsException e) {

<template id="tpl-u4-t5">
<div class="topic-eyebrow">Unit 4 · Topic 5</div>
<h1 class="topic-title">Custom (User-Defined) Exceptions</h1>
<p class="topic-hook">Building your own exception class — for when the built-in exceptions aren't enough.</p>

<div class="block reveal">
  <h3><span class="ico">🧠</span> ELI5</h3>
  <p>Sometimes you need your own specific error message (like "Insufficient Balance"). For this, you can extend the <code>Exception</code> class and create your own exception.</p>
</div>

<div class="editor reveal">
  <div class="editor-bar"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div><span class="fname">BankAccount.java</span></div>
  <pre><code data-lang="java">// Custom checked exception
class InsufficientBalanceException extends Exception {
    InsufficientBalanceException(String message) {
        super(message);      // pass the message to the Exception class
    }
}
class BankAccount {
    double balance = 1000;
    void withdraw(double amount) throws InsufficientBalanceException {
        if (amount > balance) {
            throw new InsufficientBalanceException("Insufficient balance!");
        }
        balance -= amount;
        System.out.println("Withdrawal successful. Balance: " + balance);
    }
}
public class Main {
    public static void main(String[] args) {
        BankAccount acc = new BankAccount();
        try {
            acc.withdraw(5000);
        } catch (InsufficientBalanceException e) {
            System.out.println("Error: " + e.getMessage());
        }
    }
}</code></pre>
</div>

  <div class="row"><span class="k">extends Exception</span><span class="v">By inheriting from Java's Exception class, we're creating a new exception TYPE</span></div>
  <div class="row"><span class="k">super(message)</span><span class="v">We're passing the message to the parent (Exception) constructor, so <code>getMessage()</code> works</span></div>
  <div class="row"><span class="k">throw new InsufficientBalanceException(...)</span><span class="v">We're raising our own custom exception when the condition matches</span></div>
</div>
<div class="hinglish reveal">
  <div class="lbl">💬 Tip</div>
  <p>Extend <code>Exception</code> = Checked exception (must be handled). Extend <code>RuntimeException</code> = Unchecked exception (handling is optional).</p>
</div>

<template id="tpl-u5-t1">
<div class="topic-eyebrow">Unit 5 · Topic 1</div>
<h1 class="topic-title">Process vs Thread</h1>
<p class="topic-hook">Before starting multithreading, understand the difference between these two.</p>

<div class="block reveal">
  <h3><span class="ico">🧠</span> ELI5</h3>
  <div class="analogy">
    <div class="lbl">🔦 Real-Life Analogy</div>
    <p><b>Process</b> = an entire restaurant (its own kitchen, staff, resources — independent). <b>Thread</b> = the workers inside the restaurant (waiter, chef) who SHARE the SAME kitchen/resources, each doing different work at the same time.</p>
  </div>
</div>

<table class="tbl reveal">
  <tr><th>Aspect</th><th>Process</th><th>Thread</th></tr>
  <tr><td>Meaning</td><td>An independently running program, with its own memory</td><td>A lightweight part of a process, sharing its memory</td></tr>
  <tr><td>Memory</td><td>Separate</td><td>Shared with sibling threads</td></tr>
  <tr><td>Communication</td><td>Slow (needs IPC)</td><td>Fast (shared memory)</td></tr>
  <tr><td>Creation Cost</td><td>Heavy</td><td>Light</td></tr>
  <tr><td>Example</td><td>Chrome and VS Code = 2 processes</td><td>Chrome downloading a file while also rendering the page = 2 threads</td></tr>
</table>

<div class="keypoints reveal">
  <div class="lbl">🔑 Why Multithreading?</div>
  <p style="font-size:14.5px;">It achieves parallelism → better use of the CPU, and independent tasks execute faster (like a game rendering graphics while also processing user input, at the same time).</p>
</div>
</template>

<template id="tpl-u5-t2">
<div class="topic-eyebrow">Unit 5 · Topic 2</div>
<h1 class="topic-title">Creating Threads — 2 Ways</h1>
<p class="topic-hook">Two ways to start multithreading in Java.</p>

<div class="block reveal">
  <h3><span class="ico">1️⃣</span> Extending Thread Class</h3>
  <div class="editor">
    <div class="editor-bar"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div><span class="fname">MyThread.java</span></div>
    <pre><code data-lang="java">class MyThread extends Thread {
    public void run() {                 // write the task inside run()
        for (int i = 1; i <= 3; i++) {
            System.out.println("MyThread: " + i);
        }
    }
}
public class Main {
    public static void main(String[] args) {
        MyThread t1 = new MyThread();
        t1.start();          // start() -> creates a new thread, calls run() inside it
    }
}</code></pre>
  </div>
</div>

<div class="block reveal">
  <h3><span class="ico">2️⃣</span> Implementing Runnable (Recommended)</h3>
  <div class="editor">
    <div class="editor-bar"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div><span class="fname">MyTask.java</span></div>
    <pre><code data-lang="java">class MyTask implements Runnable {
    public void run() {
        for (int i = 1; i <= 3; i++) {
            System.out.println("MyTask: " + i);
        }
    }
}
public class Main {
    public static void main(String[] args) {
        Thread t1 = new Thread(new MyTask());
        t1.start();
    }
}</code></pre>
  </div>
  <div class="hinglish">
    <div class="lbl">💬 Which One Is Better?</div>
    <p>Implementing <code>Runnable</code> is better, because in Java a class can only extend ONE class. If you extend Thread, you can't extend any other class. <code>Runnable</code> doesn't have this restriction.</p>
  </div>
</div>

<div class="keypoints reveal">
  <div class="lbl">🔑 Important</div>
  <p style="font-size:14.5px;">Always call <code>start()</code>, <b>NEVER call <code>run()</code> directly</b> — calling <code>run()</code> directly does NOT create a new thread, it just runs like a normal method call.</p>
</div>
</template>

<template id="tpl-u5-t5">
<div class="topic-eyebrow">Unit 5 · Topic 5</div>
<h1 class="topic-title">Synchronizing Threads</h1>
<p class="topic-hook">When two threads touch the SAME data, how do we avoid the resulting confusion (race condition)?</p>

<div class="block reveal">
  <h3><span class="ico">🧠</span> ELI5 — What's the Problem?</h3>
  <p>When multiple threads access/modify shared data AT THE SAME TIME, the data can become <b>inconsistent (wrong)</b> — this is called a "Race Condition."</p>
  <div class="analogy">
    <div class="lbl">🔦 Real-Life Analogy</div>
    <p>Imagine 2 people trying to withdraw money from the same bank account AT THE SAME TIME, and both think the balance is currently ₹1000. If both withdraw simultaneously without checking, the balance ends up wrong. <code>synchronized</code> puts everyone in a "line/queue" — only ONE person can transact at a time.</p>
  </div>
</div>

<div class="editor reveal">
  <div class="editor-bar"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div><span class="fname">Counter.java</span></div>
  <pre><code data-lang="java">class Counter {
    int count = 0;
    synchronized void increment() {    // only ONE thread at a time
        count++;
    }
}
class MyThread extends Thread {
    Counter counter;
    MyThread(Counter c) { this.counter = c; }
    public void run() {
        for (int i = 0; i < 1000; i++) counter.increment();
    }
}
public class Main {
    public static void main(String[] args) throws InterruptedException {
        Counter counter = new Counter();
        MyThread t1 = new MyThread(counter);
        MyThread t2 = new MyThread(counter);
        t1.start(); t2.start();
        t1.join(); t2.join();
        System.out.println("Final count: " + counter.count);   // reliably 2000
    }
}</code></pre>
</div>
<div class="breakdown reveal">
  <div class="lbl">🔍 Breakdown</div>
  <div class="row"><span class="k">synchronized void increment()</span><span class="v">Places a "lock" — only one thread can run this method at a time, the other thread will wait</span></div>
  <div class="row"><span class="k">t1.join()</span><span class="v">Pauses the main thread until t1 finishes its work</span></div>
</div>
<div class="hinglish reveal">
  <div class="lbl">💬 What Happens Without Synchronized?</div>
  <p>Without <code>synchronized</code>, both threads can modify the same variable simultaneously, and the final result can come out <b>wrong</b> (some random number instead of 2000, like 1850). <code>synchronized</code> reliably keeps it at 2000.</p>
</div>
</template>

<template id="tpl-u5-t6">
<div class="topic-eyebrow">Unit 5 · Topic 6</div>
<h1 class="topic-title">Inter-Thread Communication</h1>
<p class="topic-hook">How threads "talk" to each other — wait and notify.</p>

<div class="block reveal">
  <h3><span class="ico">🧠</span> ELI5</h3>
  <p>Java provides <code>wait()</code>, <code>notify()</code>, and <code>notifyAll()</code> methods (defined in the Object class) so threads can <b>coordinate</b> with each other — like in the Producer-Consumer problem.</p>
</div>

<div class="editor reveal">
  <div class="editor-bar"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div><span class="fname">SharedResource.java</span></div>
  <pre><code data-lang="java">class SharedResource {
    synchronized void produce() throws InterruptedException {
        System.out.println("Producing...");
        wait();       // releases the lock and waits
        System.out.println("Resumed after notify");
    }
    synchronized void consume() {
        System.out.println("Consuming and notifying...");
        notify();     // wakes up one waiting thread
    }
}</code></pre>
</div>

<table class="tbl reveal">
  <tr><th>Method</th><th>What It Does</th></tr>
  <tr><td><code>wait()</code></td><td>The current thread releases its lock and waits</td></tr>
  <tr><td><code>notify()</code></td><td>Wakes up ONE waiting thread</td></tr>
  <tr><td><code>notifyAll()</code></td><td>Wakes up ALL waiting threads</td></tr>
  <tr><td><code>join()</code></td><td>Makes the calling thread wait until the target thread finishes</td></tr>
  <tr><td><code>sleep(ms)</code></td><td>Pauses the current thread for the given number of milliseconds</td></tr>
</table>

<div class="keypoints reveal">
  <div class="lbl">🔑 Unit 5 Summary</div>
  <p style="font-size:14.5px;">Create a thread via the Thread class or the Runnable interface → use <code>start()</code>, not <code>run()</code> → avoid race conditions with <code>synchronized</code> → threads communicate using <code>wait()</code>/<code>notify()</code>.</p>
</div>
</template>

  <h3><span class="ico">🛡️</span> PreparedStatement — Safer Way</h3>
  <div class="editor">
    <div class="editor-bar"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div><span class="fname">Prepared.java</span></div>
    <pre><code data-lang="java">String sql = "INSERT INTO students (id, name, marks) VALUES (?, ?, ?)";
PreparedStatement ps = con.prepareStatement(sql);
ps.setInt(1, 6);
ps.setString(2, "Neha");
ps.setDouble(3, 91.5);
ps.executeUpdate();</code></pre>
  </div>
  <div class="hinglish">
    <div class="lbl">💬 Why Is It Better?</div>
    <p>With <code>Statement</code> you build the query string manually — this carries a SQL Injection risk. With <code>PreparedStatement</code>, <code>?</code> placeholders let you set values safely. In real projects, ALWAYS use <code>PreparedStatement</code>.</p>
  </div>
</div>

function copyText(text, btn){
  const done=()=>{ const o=btn.textContent; btn.textContent='Copied!'; setTimeout(()=>btn.textContent=o,1200); };
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(done).catch(done); }
  else { const t=document.createElement('textarea'); t.value=text; document.body.appendChild(t); t.select(); try{document.execCommand('copy');}catch(e){} t.remove(); done(); }
}
const DETAIL = {
'u1-t1':['Java was built by James Gosling and his team at Sun Microsystems in 1995. It was first called Oak, then renamed Java. Oracle owns it since 2010.','Think of a startup that changes its boring name after launch. Oak sounded like a tree, Java sounded like coffee, and programmers run on coffee. Good rebrand.','Saying Sun still owns Java. It does not, Oracle bought Sun in 2010.','Remember WORA: Write Once, Run Anywhere. If the exam asks one Java feature, write this.'],
'u1-t2':['Procedural code is a list of steps (functions). OOP packs data and the functions that use that data inside objects.','Procedural is a street food stall: one open kitchen, everybody grabs everything. OOP is a restaurant: kitchen, billing and storage each have their own staff and rules.','Thinking OOP is only "using classes". The real point is bundling data with behaviour and hiding it.','Procedural = functions first. OOP = objects first.'],
'u1-t3':['JVM runs bytecode. JRE = JVM + libraries, so you can run programs. JDK = JRE + compiler and tools, so you can also write programs.','You want to bake and eat a cake. JVM is your mouth and stomach. JRE adds plate and spoon. JDK adds the whole kitchen. Do not try to eat the kitchen.','Installing only JRE and wondering why javac is not found. javac lives in the JDK.','JDK contains JRE, JRE contains JVM. Draw three boxes inside each other.'],
'u1-t4':['A variable is a named box in memory. Its data type tells Java what kind of thing may live in the box: whole number, decimal, letter, true/false, or text.','Your kitchen has a small jar for spices (int), a big tin for flour (double) and a sticky note for yes/no (boolean). Putting flour in the sticky note will not end well.','Writing float f = 5.5; without the f. Decimals are double by default, so Java complains.','8 primitive types. String is NOT primitive, it is a class.'],
'u1-t5':['Operators are symbols that do work on values: + - * / % for maths, == != > < for comparing, && || ! for combining conditions.','The % operator is like sharing 10 samosas among 3 friends. Everyone gets 3 and 1 samosa is left over. That leftover is the remainder, and fights usually start there.','Using = (assign) instead of == (compare) inside an if.','a++ uses the value first, ++a changes first and then uses it.'],
'u1-t6':['Control structures decide what runs and how many times. if/else and switch choose a path. for, while, do-while repeat work.','if-else: if it rains take an umbrella, else take sunglasses. Loop: keep eating until the plate is empty (or until mom says stop).','Infinite loops, like forgetting i++ inside while. Your laptop fan will tell you about it.','for = known count, while = unknown count, do-while = run at least once.'],
'u1-t7':['You write .java source code, javac converts it to .class bytecode, and the JVM runs the bytecode. main() is the starting gate.','Like writing a letter in Hindi (source), a translator converts it to a neutral language (bytecode), and every country has a local reader (JVM) who understands that neutral language.','File name not matching the public class name. HelloWorld.java must hold public class HelloWorld.','javac to compile, java to run. Two steps, always.'],
'u2-t1':['A class is a blueprint that describes what an object will have (fields) and do (methods). It takes no memory by itself.','A class is the architect drawing of a house. Nobody can live in a drawing. Objects are the real houses built from it.','Thinking writing a class creates something in memory. Only new creates an object.','Class = design. Object = real thing.'],
'u2-t2':['An object is a real instance of a class. new creates it in heap memory and gives you a reference to find it again.','The class is the iPhone design. Your phone, your friend phone and the shop phone are objects. Each has its own battery percentage (mostly yours at 4%).','Believing Student b = a creates a new student. It only creates a second remote control for the same TV.','Reference = remote control, object = TV.'],
'u2-t3':['A method is a named block of code that does one job. It can take inputs (parameters) and give back a result (return).','A method is a button on the TV remote. Volume up only raises volume. It does one job, and you do not need to know the wiring inside.','Forgetting return in a method that promises to return something, or putting code after return.','void means "I return nothing".'],
'u2-t4':['An array of objects holds many objects of one class, like Student[]. The array only has empty slots at first, each is null.','A class of 30 students needs 30 chairs. new Student[30] only brings 30 empty chairs, not 30 students. You must still make each student sit.','Using arr[0].name before creating arr[0] with new. Hello NullPointerException.','Create the array first, then create each object.'],
'u2-t5':['A constructor has the same name as the class, no return type, and runs automatically when an object is created. It sets the starting values.','Creating an Instagram account: the app asks name, email, password at the very start. That setup moment is the constructor.','Writing a return type, which makes it a normal method and not a constructor.','If you write no constructor, Java gives a free default one. If you write any, the free one disappears.'],
'u2-t6':['Overloading is same method name, different parameters, decided at compile time. Overriding is a child redefining a parent method, decided at runtime.','Overloading: a waiter saying "chai" and "chai with ginger" are two different orders under one name. Overriding: the son doing his father task but in his own way.','Trying to overload by changing only the return type. Java does not allow that.','Compile time = overloading, run time = overriding.'],
'u2-t7':['static means it belongs to the class, not to any single object. There is one shared copy for everyone.','The college name is the same for every student, so it is static. Roll number differs per student, so it is not static.','Using a non-static variable inside a static method without an object.','Access static members with the class name: Counter.count.'],
'u2-t8':['Access modifiers control who may see a member: private (only own class), default (same package), protected (package + children), public (everyone).','private is your diary, default is the family WhatsApp group, protected is the family plus relatives who moved abroad, public is your Instagram post.','Making every field public "because it is easier". That removes protection.','Order from strict to open: private, default, protected, public.'],
'u2-t9':['this means "the current object". It fixes the name clash between a field and a parameter, and can call another constructor or return the object.','When you say "I am hungry", the "I" is this. Without it, the computer does not know which hungry person you mean.','Writing name = name; in a constructor. It assigns the parameter to itself and the field stays empty.','this.name = name; means field = parameter.'],
'u2-t10':['Java cleans memory automatically. When no reference points to an object, the Garbage Collector may delete it.','Like a robot vacuum that picks up stuff nobody is using. It decides when to run, so you cannot shout "clean now" and expect obedience.','Trusting System.gc() to run immediately, or relying on finalize(), which is deprecated.','No reference = eligible for garbage collection.'],
'u2-t11':['A nested class is a class inside another class. A static nested class needs no outer object. An inner class needs an outer object and can use even private members of the outer class.','A car (outer) has an engine (inner). The engine cannot work without its car, and it can use the car fuel without asking.','Creating an inner class object like a normal class. It needs outer.new Inner().','Static nested = independent. Inner = tightly attached.'],
'u2-t12':['String is a class, and Strings are immutable: they never change. Every change makes a new String.','A printed wedding card cannot be edited. If the date changes, you print a new card. Same with Strings.','Comparing Strings with ==. It compares addresses. Use equals() to compare content.','Many changes in a loop? Use StringBuilder.'],
'u3-t1':['Inheritance lets a child class reuse the fields and methods of a parent class using extends. It models an IS-A relationship.','You inherit your surname and maybe your dad nose without doing any work. The child class gets parent features for free and can add its own.','Thinking private members are inherited for direct use. They exist, but the child cannot touch them directly.','Dog IS-A Animal. Use extends.'],
'u3-t2':['Single: one parent, one child. Multilevel: a chain, grandparent to parent to child. Hierarchical: one parent, many children. Multiple (via classes) is not allowed in Java. Hybrid is a mix.','Single is father and son. Multilevel is grandfather, father, son. Hierarchical is one dad with three kids fighting over the remote.','Writing class C extends A, B. Java refuses it because of the Diamond Problem.','Multiple inheritance in Java = only through interfaces.'],
'u3-t3':['super points to the parent. super.x uses the parent variable, super.method() calls the parent method, super(...) calls the parent constructor.','When a child says "my dad also does this in his own way", that is super. The child can still call dad for the original version.','Putting super(...) anywhere except the very first line of the constructor.','Parent constructor always runs before the child constructor.'],
'u3-t4':['final stops change. A final variable becomes a constant, a final method cannot be overridden, a final class cannot be extended.','final is like a "Do Not Disturb" sign on a hotel room door. Nothing can enter or change it.','Trying to change a final variable after giving it a value.','String is a final class. That is why Strings are safe to share.'],
'u3-t5':['Polymorphism means one name, many forms. Overloading is the compile-time form: same method name, different parameter lists.','A printer command "print" works differently for a photo and a document, but you still just say print.','Calling an overloaded method with a value that matches two versions, causing confusion or ambiguity.','Overloading = same class, same name, different parameters.'],
'u3-t6':['Overriding means the child gives its own version of a parent method with the same signature. At runtime Java checks the real object, not the reference type.','Animal a = new Dog(); a.sound(); prints Dog barks. The label says Animal, but the creature inside is a Dog, and the dog speaks.','Forgetting @Override and mistyping the method name, which silently creates a new method.','Object type decides at runtime, reference type decides what you may call.'],
'u3-t7':['An abstract class cannot be instantiated. It can hold abstract methods (no body) that children must implement, and normal methods too.','"Vehicle" is abstract. Nobody buys just "a vehicle", they buy a car or a bike. The parent only describes what every vehicle must be able to do.','Trying new Shape(). It will not compile.','Abstract method = promise. Child must keep the promise.'],
'u3-t8':['An interface is a contract: it lists methods a class must provide. A class uses implements, and can implement many interfaces.','A job contract says "show up and finish the work". How you do it is your problem. An interface says what, not how.','Forgetting that methods implemented from an interface must be public.','Interface = what to do. Class = how to do it.'],
'u3-t9':['Both give abstraction. Abstract class: can have state, constructors and normal methods, but single inheritance. Interface: a pure contract, with multiple inheritance.','Abstract class is a parent with some property to leave behind. Interface is a skills certificate: one person can hold many.','Using an abstract class when you only need a contract, which blocks other inheritance.','Need shared code and state? Abstract class. Need only a contract? Interface.'],
'u3-t10':['IS-A uses inheritance (Dog IS-A Animal). HAS-A uses composition (Car HAS-A Engine), where one class holds another as a field.','A student IS-A person, but a student HAS-A bag. Nobody inherits a bag from their parents (hopefully).','Using inheritance just to reuse code, even when IS-A is false.','Prefer HAS-A when unsure. It is more flexible.'],
'u3-t11':['Encapsulation bundles data and methods in one class and hides data using private plus public getters and setters.','A medicine capsule: you take it as one unit, and you do not mix the powder inside yourself.','Making fields public and calling it encapsulation.','Private fields + public getters/setters + validation.'],
'u3-t12':['A package is a folder that groups related classes and avoids name clashes. import brings classes from other packages. CLASSPATH tells Java where to find .class files.','Packages are folders on your laptop: College, Projects, Photos. Two files can have the same name if they live in different folders.','Forgetting the package line at the very top, or running a class from the wrong folder.','Reverse-domain naming: com.company.project.'],
'u4-t1':['An exception is an unexpected event during execution that breaks the normal flow, like dividing by zero. Errors are serious JVM problems you cannot really fix.','Exception: flat tyre, you can fix it and continue. Error: the road collapsed, you cannot fix that with a spare wheel.','Catching Error types as if they were normal exceptions.','Checked = compiler forces you to handle. Unchecked = runtime surprise.'],
'u4-t2':['try holds risky code, catch handles a problem, finally runs always, whether there was a problem or not.','try: attempt to cook. catch: the milk spills, you clean. finally: wash the dishes regardless. No one escapes the dishes.','Writing an empty catch block, which hides bugs silently.','finally = cleanup, runs almost always.'],
'u4-t3':['throw actually creates and throws an exception right now. throws is a warning in the method signature that the method might throw one.','throws is the warning board "Slippery floor". throw is you pouring the water yourself.','Mixing the two words. throw = one object, throws = list of types.','throw is a statement, throws is a declaration.'],
'u4-t4':['One try can have many catch blocks, from specific to general. Try blocks can be nested, and a caught exception can be re-thrown to the caller.','Many catch blocks are like airport security lanes: specific lanes first (liquids), the general lane (everything else) last.','Putting catch (Exception e) first. The specific ones become unreachable.','Specific first, general last.'],
'u4-t5':['You can create your own exception class by extending Exception (checked) or RuntimeException (unchecked) to show a message that fits your problem.','Like a custom ATM message: "Insufficient balance, maybe skip the biryani this week" instead of "Error 77".','Forgetting to call super(message) so the message disappears.','Extend Exception = must handle. Extend RuntimeException = optional.'],
'u5-t1':['A process is a running program with its own memory. A thread is a small worker inside a process that shares its memory.','A process is a restaurant. Threads are the cooks and waiters inside it, sharing one kitchen and, sadly, one fridge.','Thinking threads are separate programs. They are parts of one program.','Threads are cheaper than processes and share memory.'],
'u5-t2':['You create a thread by extending Thread or implementing Runnable, and then calling start(). Runnable is preferred because Java allows only one parent class.','Hiring a worker: either make them your direct employee (extends Thread) or give them a task paper (Runnable) and let anyone do it.','Calling run() instead of start(). That is a normal method call, with no new thread.','start() creates a thread, run() does not.'],
'u5-t3':['A thread goes through states: NEW, RUNNABLE, RUNNING, WAITING/BLOCKED, TERMINATED.','New = a person born. Runnable = standing in the queue. Running = at the counter. Waiting = told to come after lunch. Terminated = went home.','Starting the same thread twice. A finished thread cannot restart.','start() moves NEW to RUNNABLE.'],
'u5-t4':['Priority (1 to 10) hints the scheduler which thread is more important. interrupt() asks a sleeping or waiting thread to wake up and stop.','Priority is VIP queue stickers. Interrupt is a friend shaking your shoulder in class: "Wake up!".','Believing a high priority guarantees running first. It is only a hint.','Default priority is 5.'],
'u5-t5':['When many threads change the same data at the same time, results go wrong (race condition). synchronized lets only one thread in at a time.','Two people withdrawing from one joint account together. synchronized is a queue at the bank counter: one at a time.','Synchronizing too much, which makes everything slow.','synchronized = one thread at a time, using a lock.'],
'u5-t6':['wait(), notify() and notifyAll() let threads talk. wait releases the lock and sleeps, notify wakes one waiting thread.','Producer cook and consumer waiter: the waiter waits until the cook rings the bell (notify).','Calling wait() outside a synchronized block, which throws an exception.','Always use wait/notify inside synchronized code.'],
'u6-t1':['Streams move data in and out. Byte streams handle any file. Character streams handle text. Always close the file after use.','A stream is a water pipe: data flows from a file into your program or back out. Forgetting to close it is like leaving the tap running.','Forgetting to close a file, causing resource leaks.','Byte = InputStream/OutputStream, Character = Reader/Writer.'],
'u6-t2':['The File class tells you about files and folders (exists, size, delete). RandomAccessFile lets you jump to any position and read or write there.','File is the file label on the shelf. RandomAccessFile is a book where you open any page directly instead of reading from page 1.','Thinking File reads content. It does not, it only describes the file.','seek(n) jumps to byte position n.'],
'u6-t3':['The Collections Framework gives ready data structures: List, Set, Queue and Map, which grow automatically, unlike arrays.','An array is a fixed tiffin box. A collection is a magic tiffin box that grows when your mom packs extra.','Thinking Map is a Collection. It has a separate hierarchy.','List = order, Set = unique, Queue = line, Map = key-value.'],
'u6-t4':['ArrayList keeps order and allows duplicates. HashSet keeps only unique items. TreeSet keeps them sorted. HashMap stores key to value pairs.','List is your to-do list, Set is a guest list with no repeated names, Map is your phone contacts (name to number).','Using ArrayList.contains() on huge data repeatedly. Use a HashSet instead.','TreeSet = automatically sorted.'],
'u6-t5':['JDBC lets Java talk to a database using SQL. Steps: load driver, connect, create statement, execute, process result, close.','JDBC is a translator between your Java program and the database, like a Hindi-English friend in a foreign shop.','Building SQL by joining user input, which allows SQL injection. Use PreparedStatement.','6 steps, and PreparedStatement is the safe way.']
};

System.out.println(t.getState());   // RUNNABLE (or TIMED_WAITING)

function renderDeep(body, unitId, topicId){
  const d = DEEP[unitId+'-'+topicId];
  if(!d) return;
  const wrap=document.createElement('div'); wrap.className='detail deep';
  const h=document.createElement('h3'); h.textContent='\uD83D\uDCDA In Detail'; wrap.appendChild(h);
  const row=(label,cls)=>{
    const r=document.createElement('div'); r.className='drow';
    const lb=document.createElement('div'); lb.className='dlbl '+cls; lb.textContent=label;
    const tx=document.createElement('div'); tx.className='dtxt';
    r.appendChild(lb); r.appendChild(tx); wrap.appendChild(r);
    return tx;
  };
  const fill=(tx,content)=>{
    if(Array.isArray(content)){
      const ul=document.createElement('ul');
      content.forEach(t=>{ const li=document.createElement('li'); li.textContent=t; ul.appendChild(li); });
      tx.appendChild(ul);
    } else { tx.textContent=content; }
  };
  fill(row('\uD83D\uDCD6 Definition','a'), d.d);
  fill(row('\uD83D\uDD0E Explained in detail','b'), d.a);
  if(d.x){
    const tx=row('\uD83D\uDCBB Example','a');
    const ed=document.createElement('div'); ed.className='editor';
    ed.innerHTML='<div class="editor-bar"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div><span class="fname"></span></div><pre><code data-lang="java"></code></pre>';
    ed.querySelector('.fname').textContent=d.x.f;
    ed.querySelector('code').textContent=d.x.c;
    tx.appendChild(ed);
  }
  fill(row('\uD83C\uDFAF Where and why it is used','a'), d.u);
  fill(row('\u2705 Advantages','b'), d.p);
  fill(row('\u26A0\uFE0F Limitations and common mistakes','c'), d.c);
  body.appendChild(wrap);
}

function renderDetail(body, unitId, topicId){
  const d = DETAIL[unitId+'-'+topicId];
  if(!d) return;
  const wrap=document.createElement('div'); wrap.className='detail';
  const h=document.createElement('h3'); h.textContent='\uD83E\uDDE9 Explained Simply'; wrap.appendChild(h);
  const labels=[['\uD83D\uDCD6 In simple words','a'],['\uD83C\uDFAD Real-life example','b'],['\u26A0\uFE0F Common mistake','c'],['\u2B50 Remember this','d']];

function renderPractice(body, unitId, topicId){
  const list = PRACTICE[unitId+'-'+topicId];
  if(!list) return;
  const wrap=document.createElement('div');
  wrap.className='practice';
  const h=document.createElement('h3'); h.textContent='\uD83C\uDFAF Practice Time';
  const sub=document.createElement('div'); sub.className='sub';
  sub.textContent='Start with the easy one, finish with the hard one. Try each one on your own first. Stuck? Hit Copy question and paste it into your favourite AI for the answer.';
  wrap.appendChild(h); wrap.appendChild(sub);
  list.forEach((item,i)=>{
    const [diff,q,hint]=item;
    const box=document.createElement('div'); box.className='pq';
    const head=document.createElement('div'); head.className='pq-head';
    const tag=document.createElement('span'); tag.className='diff '+diff; tag.textContent=diff;
    const num=document.createElement('span'); num.style.cssText='font-family:var(--font-code);font-size:12px;color:var(--text-faint)'; num.textContent='Q'+(i+1);
    head.appendChild(num); head.appendChild(tag);
    const qt=document.createElement('div'); qt.className='pq-q'; qt.textContent=q;
    const ht=document.createElement('div'); ht.className='pq-hint'; ht.textContent='\uD83D\uDCA1 The admin can’t afford an LLM API or backend hosting right now, so simply copy the question and paste it into your favorite LLM or AI tool until I win some money through gambling💀';
    const act=document.createElement('div'); act.className='pq-actions';
    const b1=document.createElement('button'); b1.className='neu-btn'; b1.type='button'; b1.textContent='Show answer';
    b1.onclick=()=>{ ht.classList.toggle('show'); b1.textContent=ht.classList.contains('show')?'Hide answer':'Show answer'; };
    const b2=document.createElement('button'); b2.className='neu-btn'; b2.type='button'; b2.textContent='Copy question';
    b2.onclick=()=>copyText('// '+q,b2);
    act.appendChild(b1); act.appendChild(b2);
    box.appendChild(head); box.appendChild(qt); box.appendChild(ht); box.appendChild(act);
    wrap.appendChild(box);
  });
  body.appendChild(wrap);
}

function doShare(kind){
  const url = /^https?:/.test(location.href) ? location.href.split('#')[0] : 'https://github.com/01keshav/OOPs';
  const text = 'Learn OOP in Java the easy way: simple English, real-life examples and practice questions.';
  const u=encodeURIComponent(url), t=encodeURIComponent(text);
  const links={
    wa:'https://wa.me/?text='+t+'%20'+u,
    tg:'https://t.me/share/url?url='+u+'&text='+t,
    tw:'https://twitter.com/intent/tweet?text='+t+'&url='+u,
    fb:'https://www.facebook.com/sharer/sharer.php?u='+u,
    li:'https://www.linkedin.com/sharing/share-offsite/?url='+u,
    rd:'https://www.reddit.com/submit?url='+u+'&title='+t,
    ml:'mailto:?subject='+encodeURIComponent('OOP in Java course')+'&body='+t+'%20'+u
  };
  if(kind==='cp'){
    const toast=document.getElementById('shareToast');
    const done=()=>{ toast.classList.add('show'); setTimeout(()=>toast.classList.remove('show'),1400); };
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(url).then(done).catch(done); }
    else { const ta=document.createElement('textarea'); ta.value=url; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');}catch(err){} ta.remove(); done(); }
    return;
  }
  window.open(links[kind],'_blank','noopener');
}

const THEME_KEY = 'oopJavaCourse_theme';
function currentTheme(){ return document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark'; }
function syncThemeButton(){
  const b = document.getElementById('themeToggle');
  if(!b) return;
  const dark = currentTheme() === 'dark';
  b.setAttribute('aria-checked', String(dark));
  b.title = dark ? 'Switch to light mode' : 'Switch to dark mode';
}
function setTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  try{ localStorage.setItem(THEME_KEY, t); }catch(e){}
  syncThemeButton();
}
document.getElementById('themeToggle')?.addEventListener('click', ()=> setTheme(currentTheme()==='dark' ? 'light' : 'dark'));
syncThemeButton();

/* ---------- PERSISTENCE (progress saved in this browser) ---------- */
function loadProgress(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return new Set();
    const arr = JSON.parse(raw);
    if(Array.isArray(arr)) return new Set(arr);
    return new Set();
  }catch(e){
    return new Set();
  }
}
function saveProgress(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(Array.from(doneSet)));
    flashSaveStatus();
  }catch(e){
    const t = document.getElementById('saveStatusText');
    if(t) t.textContent = "Couldn't save (private browsing?)";
  }
}
function flashSaveStatus(){
  const el = document.getElementById('saveStatus');
  const t = document.getElementById('saveStatusText');
  if(!el || !t) return;
  t.textContent = 'Saved just now';
  el.classList.add('flash');
  clearTimeout(flashSaveStatus._timer);
  flashSaveStatus._timer = setTimeout(()=>{ t.textContent = 'Progress saved on this device'; el.classList.remove('flash'); }, 1600);
}

function buildSidebar(){
  const nav = document.getElementById('unit-list');
  nav.innerHTML='';
  UNITS.forEach((u,idx)=>{
    const block = document.createElement('div');
    block.className='unit-block';
    block.dataset.unit = u.id;
    const toggle = document.createElement('button');
    toggle.className='unit-toggle';
    toggle.innerHTML = `<span class="num">${idx+1}</span><span class="label"><span class="name">${u.name}</span><span class="hrs">${u.hrs} · ${u.topics.length} topics</span></span><span class="chev">▶</span>`;
    toggle.addEventListener('click',()=>{
      block.classList.toggle('open');
    });
    block.appendChild(toggle);
    const tlist = document.createElement('div');
    tlist.className='topic-list';
    u.topics.forEach(t=>{
      const link = document.createElement('div');
      link.className='topic-link';
      link.dataset.unit=u.id; link.dataset.topic=t.id;
      link.innerHTML = `<span class="check"></span><span>${t.title}</span>`;
      if(doneSet.has(u.id+'-'+t.id)){
        link.classList.add('done');
        link.querySelector('.check').textContent='✓';
      }
      link.addEventListener('click',()=>{ if(currentUnit===u.id && currentTopic===t.id){ if(doneSet.has(u.id+'-'+t.id)){ setTopicDone(u.id,t.id,false); syncCompleteBtn(); } } else loadTopic(u.id,t.id); if(document.getElementById('sidebar').classList.contains('open')) closeSidebar(); });
      tlist.appendChild(link);
    });
    block.appendChild(tlist);
    nav.appendChild(block);
  });
  updateXP();
}

function setTopicDone(unitId, topicId, done){
  const key = unitId+'-'+topicId;
  if(done) doneSet.add(key); else doneSet.delete(key);
  const link = document.querySelector(`.topic-link[data-unit="${unitId}"][data-topic="${topicId}"]`);
  if(link){
    link.classList.toggle('done', done);
    const c = link.querySelector('.check'); if(c) c.textContent = done ? '✓' : '';
  }
  updateXP();
  saveProgress();
}

function updateXP(){
  const pct = Math.round((doneSet.size/TOTAL_TOPICS)*100);
  document.getElementById('xpFill').style.width = pct+'%';
  document.getElementById('xpLabel').textContent = `${doneSet.size} / ${TOTAL_TOPICS} topics done`;
  document.getElementById('progress-bar').style.width = pct+'%';
  const hp=document.getElementById('heroProgress'); if(hp) hp.textContent = `${doneSet.size} / ${TOTAL_TOPICS} topics done`;
}

/* ---------- HOME ---------- */
function showHome(){
  currentUnit=null; currentTopic=null;
  document.getElementById('crumb').innerHTML = '';
  const body = document.getElementById('topic-body');
  const tpl = document.getElementById('tpl-home');
  body.innerHTML='';
  body.appendChild(tpl.content.cloneNode(true));
  const cardsWrap = document.getElementById('homeCards');
  UNITS.forEach((u,idx)=>{
    const doneInUnit = u.topics.filter(t=>doneSet.has(u.id+'-'+t.id)).length;
    const card = document.createElement('div');
    card.className='unit-card';
    const doneNote = doneInUnit>0 ? ` · ${doneInUnit}/${u.topics.length} done` : '';
    card.innerHTML = `<div class="badge">${idx+1}</div><div class="hrsbadge">${u.hrs}</div><div class="t">${u.name}</div><div class="d">${u.topics.length} topics inside${doneNote}</div>`;
    card.addEventListener('click',()=>{
      loadTopic(u.id, u.topics[0].id);
      document.querySelectorAll('.unit-block').forEach(b=>b.classList.remove('open'));
      document.querySelector(`.unit-block[data-unit="${u.id}"]`).classList.add('open');
    });
    cardsWrap.appendChild(card);
  });
  requestAnimationFrame(()=>{ body.classList.add('show'); triggerReveal(); });
  document.querySelectorAll('.topic-link').forEach(l=>l.classList.remove('active'));
  updateXP();
  const hs=document.getElementById('heroStats');
  if(hs){ const q=Object.values(PRACTICE).reduce((s,a)=>s+a.length,0); hs.innerHTML=`<div class="neu-stat"><b>${UNITS.length}</b><span>Units</span></div><div class="neu-stat"><b>${TOTAL_TOPICS}</b><span>Topics</span></div><div class="neu-stat"><b>${q}</b><span>Questions</span></div>`; }
}

/* ---------- LOAD TOPIC ---------- */
function loadTopic(unitId, topicId){
  const tplId = `tpl-${unitId}-${topicId}`;
  const tpl = document.getElementById(tplId);
  if(!tpl) return;
  currentUnit = unitId; currentTopic = topicId;

  const body = document.getElementById('topic-body');
  body.classList.remove('show');
  setTimeout(()=>{
    body.innerHTML='';
    body.appendChild(tpl.content.cloneNode(true));
    wrapTables(body);
    wireQuizzes(body);
    renderDeep(body, unitId, topicId);
    highlightAll(body);
    renderDetail(body, unitId, topicId);
    renderPractice(body, unitId, topicId);
    buildTopicNav(body);
    requestAnimationFrame(()=>{ body.classList.add('show'); triggerReveal(); });
  }, 180);

  // crumb
  const u = UNITS.find(x=>x.id===unitId);
  const t = u.topics.find(x=>x.id===topicId);
  const uIdx = UNITS.indexOf(u)+1;
  document.getElementById('crumb').innerHTML = `<span class="u">UNIT ${uIdx}</span> / ${t.title}`;

  // sidebar active state + mark done (persisted to this browser)
  document.querySelectorAll('.topic-link').forEach(l=>l.classList.remove('active'));
  const activeLink = document.querySelector(`.topic-link[data-unit="${unitId}"][data-topic="${topicId}"]`);
  if(activeLink) activeLink.classList.add('active');
  updateXP();

  window.scrollTo({top:0,behavior:'smooth'});
  document.querySelector('.content-wrap')?.scrollTo?.(0,0);
  document.getElementById('main').scrollTo?.(0,0);
}

/* ---------- PREV/NEXT NAV ---------- */
function syncCompleteBtn(){
  const btn=document.getElementById('completeBtn'); if(!btn) return;
  const d=doneSet.has(currentUnit+'-'+currentTopic);
  btn.classList.toggle('is-done',d);
  btn.querySelector('.cb-txt').textContent = d ? 'tap to undo' : 'Mark as complete';
  btn.setAttribute('aria-pressed', d?'true':'false');
}
function buildTopicNav(body){
  const idx = flatOrder.findIndex(f=>f.unit===currentUnit && f.topic===currentTopic);
  const prev = flatOrder[idx-1];
  const next = flatOrder[idx+1];
  const wrap = document.createElement('div');
  wrap.className='topic-nav-wrap reveal';

  const cb = document.createElement('button');
  cb.type='button'; cb.id='completeBtn'; cb.className='complete-btn';
  cb.innerHTML='<span class="cb-ico"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span><span class="cb-txt"></span>';
  cb.addEventListener('click',()=>{ setTopicDone(currentUnit,currentTopic,!doneSet.has(currentUnit+'-'+currentTopic)); syncCompleteBtn(); });
  wrap.appendChild(cb);

  const nav = document.createElement('div');
  nav.className='topic-nav';
  const arrow='<svg class="pn-arrow" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
  const prevBtn = document.createElement('button'); prevBtn.type='button';
  prevBtn.className='pn-btn pn-prev'+(prev?'':' disabled');
  if(prev){
    const pu=UNITS.find(u=>u.id===prev.unit), pt=pu.topics.find(t=>t.id===prev.topic);
    prevBtn.innerHTML = `${arrow}<span class="pn-txt"><span class="dir">Previous</span><span class="ttl">${pt.title}</span></span>`;
    prevBtn.addEventListener('click',()=>loadTopic(prev.unit,prev.topic));
  }
  const nextBtn = document.createElement('button'); nextBtn.type='button';
  nextBtn.className='pn-btn pn-next'+(next?'':' disabled');
  if(next){
    const nu=UNITS.find(u=>u.id===next.unit), nt=nu.topics.find(t=>t.id===next.topic);
    nextBtn.innerHTML = `<span class="pn-txt"><span class="dir">Next</span><span class="ttl">${nt.title}</span></span>${arrow}`;
    nextBtn.addEventListener('click',()=>loadTopic(next.unit,next.topic));
  }
  nav.appendChild(prevBtn); nav.appendChild(nextBtn);
  wrap.appendChild(nav);
  body.appendChild(wrap);
  syncCompleteBtn();
}

/* ---------- SCROLL REVEAL ---------- */
const observer = new IntersectionObserver((entries)=>{
  entries.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('visible'); } });
},{threshold:0.1});
function triggerReveal(){
  const targets = document.querySelectorAll('.reveal:not(.visible)');
  targets.forEach(el=>observer.observe(el));
  // Safety net: some embedded WebViews / preview iframes never fire
  // IntersectionObserver correctly, which would leave content stuck at
  // opacity:0 (looking like a permanent haze). Force it visible shortly
  // after render no matter what.
  setTimeout(()=>{
    document.querySelectorAll('.reveal:not(.visible)').forEach(el=>el.classList.add('visible'));
  }, 700);
}

/* ---------- CODE HIGHLIGHTER ---------- */
const JAVA_KEYWORDS = ['abstract','assert','boolean','break','byte','case','catch','char','class','const','continue','default','do','double','else','enum','extends','final','finally','float','for','goto','if','implements','import','instanceof','int','interface','long','native','new','package','private','protected','public','return','short','static','strictfp','super','switch','synchronized','this','throw','throws','transient','try','void','volatile','while','true','false','null','var'];
function escapeHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
// Single-pass tokenizer: scans RAW source once, classifies each token, and never
// re-scans text it has already generated (avoids corrupting inserted <span> markup).
const HL_REGEX = new RegExp(
  '(\\/\\/[^\\n]*)' +                          // 1: line comment
  '|(\\/\\*[\\s\\S]*?\\*\\/)' +                  // 2: block comment
  '|("(?:[^"\\\\]|\\\\.)*")' +                   // 3: double-quoted string
  "|('(?:[^'\\\\]|\\\\.)*')" +                   // 4: single-quoted char
  '|(@[A-Za-z]+)' +                             // 5: annotation
  '|\\b(\\d+\\.?\\d*)\\b' +                      // 6: number
  '|\\b(' + JAVA_KEYWORDS.join('|') + ')\\b' +   // 7: keyword
  '|\\b([A-Z][A-Za-z0-9_]*)\\b'                 // 8: capitalized type/class name
  , 'g');
function highlightJava(raw){
  let out = '';
  let last = 0;
  let m;
  HL_REGEX.lastIndex = 0;
  while((m = HL_REGEX.exec(raw))){
    out += escapeHtml(raw.slice(last, m.index));
    const full = m[0];
    const safe = escapeHtml(full);
    if(m[1]||m[2]) out += `<span class="tok-com">${safe}</span>`;
    else if(m[3]||m[4]) out += `<span class="tok-str">${safe}</span>`;
    else if(m[5]) out += `<span class="tok-ann">${safe}</span>`;
    else if(m[6]!==undefined) out += `<span class="tok-num">${safe}</span>`;
    else if(m[7]!==undefined) out += `<span class="tok-kw">${safe}</span>`;
    else if(m[8]!==undefined) out += `<span class="tok-type">${safe}</span>`;
    else out += safe;
    last = HL_REGEX.lastIndex;
  }
  out += escapeHtml(raw.slice(last));
  return out;
}
function highlightAll(root){
  root.querySelectorAll('pre code[data-lang="java"]').forEach(block=>{
    if(block.dataset.done) return;
    block.innerHTML = highlightJava(block.textContent);
    block.dataset.done='1';
  });
  root.querySelectorAll('pre code[data-lang="bash"]').forEach(block=>{
    if(block.dataset.done) return;
    block.innerHTML = escapeHtml(block.textContent).replace(/(#.*$)/gm,'<span class="tok-com">$1</span>');
    block.dataset.done='1';
  });
}

/* ---------- RESPONSIVE TABLES ---------- */
function wrapTables(root){
  root.querySelectorAll('table.tbl').forEach(table=>{
    if(table.parentElement && table.parentElement.classList.contains('table-scroll')) return;
    const wrap = document.createElement('div');
    wrap.className = 'table-scroll';
    table.parentNode.insertBefore(wrap, table);
    wrap.appendChild(table);
  });
}

/* ---------- MINI QUIZ ---------- */
function wireQuizzes(root){
  root.querySelectorAll('[data-quiz]').forEach(q=>{
    const opts = q.querySelectorAll('.opt');
    const fb = q.querySelector('.fb');
    opts.forEach(opt=>{
      opt.addEventListener('click',()=>{
        if(opt.dataset.answered) return;
        opts.forEach(o=>o.dataset.answered='1');
        const correct = opt.dataset.correct === 'true';
        opts.forEach(o=>{
          if(o.dataset.correct==='true') o.classList.add('correct');
          else if(o===opt) o.classList.add('wrong');
        });
        fb.textContent = correct ? "✅ Correct! Nicely done." : "❌ Not quite — the right answer is highlighted above.";
        fb.classList.add('show');
      });
    });
  });
}

/* ---------- SEARCH ---------- */
document.getElementById('search').addEventListener('input', (e)=>{
  const q = e.target.value.toLowerCase().trim();
  document.querySelectorAll('.unit-block').forEach(block=>{
    let anyMatch = false;
    block.querySelectorAll('.topic-link').forEach(link=>{
      const text = link.textContent.toLowerCase();
      const match = text.includes(q);
      link.style.display = match ? 'flex' : 'none';
      if(match) anyMatch = true;
    });
    if(q){ block.classList.toggle('open', anyMatch); block.style.display = anyMatch ? '' : 'none'; }
    else { block.style.display=''; block.querySelectorAll('.topic-link').forEach(l=>l.style.display='flex'); }
  });
});

/* ---------- RESET PROGRESS ---------- */
document.getElementById('resetBtn')?.addEventListener('click', ()=>{
  if(!confirm('Reset your saved progress for this course? This clears every topic marked as done on this device.')) return;
  doneSet.clear();
  try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
  document.querySelectorAll('.topic-link').forEach(l=>{ l.classList.remove('done','active'); const c=l.querySelector('.check'); if(c) c.textContent=''; });
  updateXP();
  const t = document.getElementById('saveStatusText');
  if(t) t.textContent = 'Progress reset';
  if(!currentUnit) showHome();
});

/* ---------- MOBILE SIDEBAR ---------- */
function closeSidebar(){ document.getElementById('sidebar').classList.remove('open'); document.getElementById('overlay').classList.remove('show'); }
document.getElementById('menuBtn')?.addEventListener('click', ()=>{
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('overlay').classList.add('show');
});
document.getElementById('overlay').addEventListener('click', closeSidebar);
document.getElementById('sidebarCloseBtn')?.addEventListener('click', closeSidebar);

/* ---------- KEYBOARD NAV ---------- */
document.addEventListener('keydown',(e)=>{
  if(!currentUnit) return;
  if(e.key==='ArrowRight'){ const idx=flatOrder.findIndex(f=>f.unit===currentUnit&&f.topic===currentTopic); const n=flatOrder[idx+1]; if(n) loadTopic(n.unit,n.topic); }
  if(e.key==='ArrowLeft'){ const idx=flatOrder.findIndex(f=>f.unit===currentUnit&&f.topic===currentTopic); const p=flatOrder[idx-1]; if(p) loadTopic(p.unit,p.topic); }
});
</script>
