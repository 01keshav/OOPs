ctories: mkdir and listing", "p": ["`mkdir()` makes one folder. `mkdirs()` makes the whole path including missing parents. `list()` gives names as `String[]`. `listFiles()` gives `File[]` and accepts a filter.", "The order of names from `list()` is not guaranteed, so sort if you need a fixed order."], "code": {"f": "Main.java", "c": "import java.io.*;\nimport java.util.Arrays;\n\npublic class Main {\n    public static void main(String[] args) throws IOException {\n        File dir = new File(\"mydir\");\n        System.out.println(\"mkdir: \" + dir.mkdir());\n        new File(dir, \"a.txt\").createNewFile();\n        new File(dir, \"b.txt\").createNewFile();\n        new File(dir, \"c.java\").createNewFile();\n\n        String[] names = dir.list();\n        Arrays.sort(names);\n        System.out.println(\"All: \" + Arrays.toString(names));\n\n        File[] txt = dir.listFiles((d, n) -> n.endsWith(\".txt\"));\n        System.out.println(\"txt files: \" + txt.length);\n    }\n}", "out": "mkdir: true\nAll: [a.txt, b.txt, c.java]\ntxt files: 2"}}, {"h": "What is RandomAccessFile?", "p": ["Normal streams read from the start to the end in order. `RandomAccessFile` treats a file like a big byte array with a pointer. You can move the pointer anywhere and then read or write there, in the same object.", "It both reads and writes, and it handles data types directly: `readInt()`, `writeInt()`, `readDouble()`, `writeUTF()` and so on."], "pts": ["One class for input and output", "Not a subclass of InputStream or OutputStream", "Implements `DataInput` and `DataOutput`", "Good for record files, databases, editing in place"], "viz": {"type": "chain", "items": ["Byte 0", "Byte 1", "Byte 2", "Byte 3", "..."], "caption": "File pointer can seek to any byte"}}, {"h": "Modes: \"r\" and \"rw\"", "p": ["The second argument of the constructor sets the mode. `\"r\"` is read-only: writing throws an exception and a missing file gives `FileNotFoundException`. `\"rw\"` is read and write: the file is created if it is missing.", "`\"rws\"` and `\"rwd\"` also exist and force data to disk on every write. They are rarely needed."], "table": {"head": ["Mode", "Read", "Write", "Creates file"], "rows": [["r", "Yes", "No", "No (error if missing)"], ["rw", "Yes", "Yes", "Yes"], ["rws", "Yes", "Yes", "Yes + sync content & metadata"], ["rwd", "Yes", "Yes", "Yes + sync content"]]}}, {"h": "File pointer, seek and length", "p": ["The file pointer is the current byte position. It starts at 0 and moves forward after each read or write. `getFilePointer()` tells where it is. `seek(long pos)` moves it. `length()` gives the file size.", "An int takes 4 bytes, so after three `writeInt()` calls the pointer is at 12."], "code": {"f": "Main.java", "c": "import java.io.*;\n\npublic class Main {\n    public static void main(String[] args) throws IOException {\n        try (RandomAccessFile raf = new RandomAccessFile(\"r.dat\", \"rw\")) {\n            raf.writeInt(10);\n            raf.writeInt(20);\n            raf.writeInt(30);\n            System.out.println(\"Pointer after writes: \" + raf.getFilePointer());\n            System.out.println(\"File length: \" + raf.length());\n\n            raf.seek(0);                       // go to start\n            System.out.println(\"First: \" + raf.readInt());\n            System.out.println(\"Pointer now: \" + raf.getFilePointer());\n        }\n    }\n}", "out": "Pointer after writes: 12\nFile length: 12\nFirst: 10\nPointer now: 4"}}, {"h": "Jump and update in the middle", "p": ["This is the real power. To reach record number n of fixed size s, do `seek(n * s)`. Then read it or overwrite it. Other records stay untouched, and the file is not rewritten."], "warn": "Overwriting works cleanly only when the new data has the same size as the old data.", "code": {"f": "Main.java", "c": "import java.io.*;\n\npublic class Main {\n    public static void main(String[] args) throws IOException {\n        try (RandomAccessFile raf = new RandomAccessFile(\"r.dat\", \"rw\")) {\n            for (int i = 1; i <= 5; i++) raf.writeInt(i * 10);   // 10 20 30 40 50\n\n            raf.seek(2 * 4);          // skip 2 ints (4 bytes each) -> third record\n            System.out.println(\"Third: \" + raf.readInt());\n\n            raf.seek(2 * 4);          // go back and overwrite it\n            raf.writeInt(99);\n\n            raf.seek(0);\n            for (int i = 0; i < 5; i++) System.out.print(raf.readInt() + \" \");\n            System.out.println();\n        }\n    }\n}", "out": "Third: 30\n10 20 99 40 50 "}}, {"h": "Appending and text with RandomAccessFile", "p": ["To append, jump to the end with `seek(raf.length())` and write. For text, `writeBytes()` writes a String as bytes and `readLine()` reads a line (it returns `null` at end of file)."], "tip": "`readLine()` here reads bytes as Latin-1, so use it for simple ASCII text only.", "code": {"f": "Main.java", "c": "import java.io.*;\n\npublic class Main {\n    public static void main(String[] args) throws IOException {\n        try (RandomAccessFile raf = new RandomAccessFile(\"log.txt\", \"rw\")) {\n            raf.writeBytes(\"Line1\\n\");\n            raf.seek(raf.length());      // jump to end = append\n            raf.writeBytes(\"Line2\\n\");\n\n            raf.seek(0);\n            String s;\n            while ((s = raf.readLine()) != null) System.out.println(s);\n        }\n        try (RandomAccessFile r = new RandomAccessFile(\"log.txt\", \"r\")) {\n            System.out.println(\"Read-only size: \" + r.length());\n        }\n    }\n}", "out": "Line1\nLine2\nRead-only size: 12"}}], "analogy": "File is the label on a shelf: it tells name, size and place, but not what is inside the book. RandomAccessFile is the book itself with bookmarks: open any page directly instead of reading from page 1.", "hinglish": "Bhai `File` class sirf file ya folder ki info deti hai (naam, size, exists, delete), andar ka data nahi padhti. `RandomAccessFile` mein `seek()` se kisi bhi position pe seedha jaa sakte ho aur wahin read ya write kar sakte ho, shuruaat se padhna zaroori nahi.", "mistakes": ["Thinking `new File(\"a.txt\")` creates the file.", "Using File to read the data inside a file.", "Deleting a non-empty directory with delete(): it returns false.", "Forgetting that an int is 4 bytes when calculating seek positions.", "Opening with \"r\" and then trying to write."], "remember": ["java.io.File = abstract path of a file or directory. It does not read or write content.", "new File(path) does not create a file on disk; createNewFile() does.", "Key methods: exists, createNewFile, delete, length, isFile, isDirectory, getName, getPath, mkdir, mkdirs, list, listFiles, renameTo.", "createNewFile() throws IOException and returns false if the file already exists.", "delete() removes a file or an empty directory only.", "mkdir() creates one folder; mkdirs() creates parents too.", "RandomAccessFile reads and writes at any position using a file pointer.", "Constructor: new RandomAccessFile(name, mode). Modes: \"r\", \"rw\", \"rws\", \"rwd\".", "seek(pos) moves pointer; getFilePointer() gives position; length() gives size.", "Offset of record n = n * recordSize; use seek to jump there.", "Implements DataInput and DataOutput: readInt, writeInt, readUTF, writeUTF etc.", "Mode \"r\" on a missing file throws FileNotFoundException; \"rw\" creates it."], "def": "`java.io.File` is an abstract representation of a file or directory path. It is not the file content and not a stream. Making a `File` object does not create anything on disk.", "uses": ["Checking whether a file exists before reading it", "Directory listing and file management", "Updating records in the middle of a large file without rewriting it"], "pros": ["Easy file and folder management", "Random access is fast for fixed-size records"], "cons": ["Thinking File reads or writes data", "Wrong seek positions when record sizes differ", "Forgetting to close RandomAccessFile"]}, "u6-t3": {"tldr": "The Collections Framework is a set of ready-made interfaces and classes to store and process groups of objects.", "sections": [{"h": "What is the Collections Framework?", "p": ["You do not write linked lists or hash tables yourself. You just use `ArrayList`, `HashSet`, `HashMap` and so on."], "pts": ["Interfaces: define the behaviour (`List`, `Set`, `Map`)", "Classes: real implementations (`ArrayList`, `HashMap`)", "Algorithms: static methods in `Collections` (sort, reverse, max)", "Works only with objects, not primitives (use wrappers like `Integer`)"]}, {"h": "Why we need it: arrays are not enough", "p": ["An array has a fixed size, no built-in add/remove, and no ready search or sort methods. Collections fix all this."], "pts": ["Dynamic size: grows and shrinks automatically", "Ready methods: add, remove, contains, sort, search", "Different structures for different needs (order, uniqueness, speed)", "Less code, fewer bugs, well tested", "Generics give type safety: `List<String>` accepts only Strings"], "code": {"f": "Main.java", "c": "import java.util.*;\n\npublic class Main {\n    public static void main(String[] args) {\n        int[] arr = new int[2];            // fixed size\n        arr[0] = 1; arr[1] = 2;\n        // arr[2] = 3;  -> ArrayIndexOutOfBoundsException\n\n        ArrayList<Integer> list = new ArrayList<>();   // grows itself\n        list.add(1); list.add(2); list.add(3);\n        list.remove(Integer.valueOf(2));\n        System.out.println(list + \" size=\" + list.size());\n    }\n}", "out": "[1, 3] size=2"}}, {"h": "The hierarchy", "p": ["At the top is `Iterable`, which allows for-each loops. `Collection` extends it. Three main child interfaces are `List`, `Set` and `Queue`. `Map` stands separately because it stores key-value pairs, not single elements."], "tip": "Memory line: Iterable -> Collection -> (List, Set, Queue). Map stands alone.", "viz": {"type": "tree", "root": "Collection", "kids": ["List", "Set", "Queue"], "caption": "Iterable -> Collection -> List, Set, Queue"}}, {"h": "Classes under each interface", "p": ["Each interface has several implementations. The right one depends on what you need: order, uniqueness, sorting or speed. Each gets its own section in the next topic."], "table": {"head": ["Interface", "Implementations", "Key idea"], "rows": [["List", "ArrayList, LinkedList, Vector, Stack", "Ordered, duplicates allowed"], ["Set", "HashSet, LinkedHashSet, TreeSet", "No duplicates"], ["Queue", "PriorityQueue, ArrayDeque, LinkedList", "Process in order (FIFO)"], ["Map", "HashMap, LinkedHashMap, TreeMap, Hashtable", "Key -> value pairs"]]}}, {"h": "Map has its own hierarchy", "p": ["`Map` does not extend `Collection`. It holds pairs: each key is unique and points to one value. It is still part of the framework."], "warn": "Exam trap: \"Map is a Collection\" is false.", "viz": {"type": "tree", "root": "Map", "kids": ["HashMap", "LinkedHashMap", "TreeMap"], "caption": "Map implementations (SortedMap -> TreeMap)"}}, {"h": "Common Collection methods", "p": ["Because `List`, `Set` and `Queue` all extend `Collection`, they share these methods: `add`, `addAll`, `remove`, `contains`, `size`, `isEmpty`, `clear` and `iterator`."], "code": {"f": "Main.java", "c": "import java.util.*;\n\npublic class Main {\n    public static void main(String[] args) {\n        Collection<String> c = new ArrayList<>();\n        c.add(\"Java\");\n        c.add(\"Python\");\n        c.addAll(List.of(\"C\", \"Go\"));\n        System.out.println(c);\n        System.out.println(\"size = \" + c.size());\n        System.out.println(\"has C? \" + c.contains(\"C\"));\n        c.remove(\"Python\");\n        System.out.println(\"after remove: \" + c);\n        System.out.println(\"empty? \" + c.isEmpty());\n        c.clear();\n        System.out.println(\"after clear: \" + c);\n    }\n}", "out": "[Java, Python, C, Go]\nsize = 4\nhas C? true\nafter remove: [Java, C, Go]\nempty? false\nafter clear: []"}}, {"h": "Iterator: walking through a collection", "p": ["An `Iterator` visits the elements one by one. Get it with `iterator()`. It has three methods: `hasNext()` (is there more?), `next()` (give next element) and `remove()` (delete the last returned element).", "The for-each loop uses an Iterator internally."], "tip": "`ListIterator` (for Lists only) can also go backward and add or set elements.", "code": {"f": "Main.java", "c": "import java.util.*;\n\npublic class Main {\n    public static void main(String[] args) {\n        List<String> names = new ArrayList<>(List.of(\"Ravi\", \"Asha\", \"Mohan\"));\n        Iterator<String> it = names.iterator();\n        while (it.hasNext()) {\n            String n = it.next();\n            if (n.startsWith(\"A\")) it.remove();   // safe removal\n        }\n        System.out.println(names);\n        for (String n : names) System.out.println(\"Hello \" + n);   // for-each uses Iterator\n    }\n}", "out": "[Ravi, Mohan]\nHello Ravi\nHello Mohan"}, "viz": {"type": "chain", "items": ["iterator()", "hasNext()", "next()", "remove() (optional)"], "caption": "Iterator cycle"}}, {"h": "Fail-fast behaviour", "p": ["If you change a collection directly (add or remove) while looping over it with an Iterator or for-each, Java throws `ConcurrentModificationException`. To remove safely, use `it.remove()` or `removeIf()`."], "warn": "Never call `list.remove()` inside a for-each loop over the same list.", "code": {"f": "Main.java", "c": "import java.util.*;\n\npublic class Main {\n    public static void main(String[] args) {\n        List<Integer> list = new ArrayList<>(List.of(1, 2, 3, 4));\n        try {\n            for (Integer x : list) {\n                if (x == 2) list.remove(x);   // modifying while looping\n            }\n        } catch (ConcurrentModificationException ex) {\n            System.out.println(\"ConcurrentModificationException\");\n        }\n    }\n}", "out": "ConcurrentModificationException"}}, {"h": "Collection vs Collections", "p": ["`Collection` (no s) is an interface: the root of List, Set and Queue. `Collections` (with s) is a utility class with static helper methods such as `sort`, `reverse`, `max`, `min`, `frequency` and `unmodifiableList`."], "code": {"f": "Main.java", "c": "import java.util.*;\n\npublic class Main {\n    public static void main(String[] args) {\n        List<Integer> nums = new ArrayList<>(List.of(40, 10, 30, 20));\n        Collections.sort(nums);\n        System.out.println(\"sorted : \" + nums);\n        Collections.reverse(nums);\n        System.out.println(\"reverse: \" + nums);\n        System.out.println(\"max=\" + Collections.max(nums) + \" min=\" + Collections.min(nums));\n        System.out.println(\"freq of 10 = \" + Collections.frequency(nums, 10));\n        List<Integer> ro = Collections.unmodifiableList(nums);\n        try { ro.add(5); } catch (UnsupportedOperationException ex) { System.out.println(\"read-only list\"); }\n    }\n}", "out": "sorted : [10, 20, 30, 40]\nreverse: [40, 30, 20, 10]\nmax=40 min=10\nfreq of 10 = 1\nread-only list"}}], "analogy": "An array is a fixed tiffin box with 4 slots. A collection is a magic tiffin box that grows when more food is packed, and has different box types: ordered rows, no-repeat trays, queue lines and labelled key-value boxes.", "hinglish": "Bhai arrays ka size fixed hota hai, isliye Java ne Collections Framework diya: ready data structures jaise List, Set, Queue aur Map. Ye apne aap grow karte hain. Yaad rakho Map alag hierarchy mein hai, wo Collection ko extend nahi karta. `Collections` (s ke saath) ek utility class hai.", "mistakes": ["Saying Map extends Collection.", "Confusing Collection (interface) with Collections (utility class).", "Removing from a list inside a for-each loop.", "Trying to store primitives like `List<int>`: use `List<Integer>`.", "Calling `next()` without checking `hasNext()`: NoSuchElementException."], "remember": ["Collection framework = interfaces + classes + algorithms in java.util for storing and processing groups of objects.", "Arrays: fixed size, only methods are length; collections: dynamic, many ready methods.", "Hierarchy: Iterable -> Collection -> List, Set, Queue.", "Map is separate: it does not extend Collection. It stores key-value pairs.", "List: ordered, duplicates allowed. Set: no duplicates. Queue: FIFO order. Map: unique keys.", "Classes: ArrayList, LinkedList, HashSet, LinkedHashSet, TreeSet, PriorityQueue, ArrayDeque, HashMap, LinkedHashMap, TreeMap.", "Collections hold objects only; primitives need wrappers (int -> Integer).", "Common methods: add, addAll, remove, contains, size, isEmpty, clear, iterator.", "Iterator methods: hasNext(), next(), remove().", "Fail-fast: modifying during iteration throws ConcurrentModificationException.", "Collection is an interface; Collections is a utility class (sort, reverse, max, min, unmodifiableList).", "Generics (List<String>) give compile-time type safety."], "def": "A collection is an object that holds a group of other objects. The Java Collections Framework (JCF) is the architecture in package `java.util` that gives interfaces (the rules), implementation classes (ready data structures) and algorithms (sorting, searching).", "uses": ["Storing and processing groups of data of unknown size", "Almost every real Java application"], "pros": ["Dynamic size, unlike arrays", "Ready-made, well-tested data structures", "Generics give type safety", "Consistent API across all collections"], "cons": ["Only objects are allowed, no primitives (autoboxing adds a small cost)", "Choosing the wrong collection hurts performance", "Most collections are not thread-safe by default"]}, "u6-t4": {"tldr": "List keeps order, Set keeps unique items, Queue processes in turn, Map stores key-value pairs. Each has several classes.", "sections": [{"h": "List and ArrayList", "p": ["Reading by index is very fast. Adding or removing in the middle is slower because later elements must shift."], "pts": ["Keeps insertion order", "Duplicates and `null` allowed", "Fast `get(i)` and `set(i, x)`: O(1)", "Not thread-safe. (`Vector` is the old synchronized version.)"], "code": {"f": "Main.java", "c": "import java.util.*;\n\npublic class Main {\n    public static void main(String[] args) {\n        List<String> list = new ArrayList<>();\n        list.add(\"Java\");\n        list.add(\"C++\");\n        list.add(\"Java\");          // duplicate allowed\n        list.add(1, \"Python\");     // insert at index 1\n        System.out.println(list);\n        System.out.println(\"get(2) = \" + list.get(2));\n        list.set(0, \"Kotlin\");\n        list.remove(\"C++\");\n        System.out.println(list + \" indexOf(Java)=\" + list.indexOf(\"Java\"));\n    }\n}", "out": "[Java, Python, C++, Java]\nget(2) = C++\n[Kotlin, Python, Java] indexOf(Java)=2"}, "table": {"head": ["ArrayList internal array"], "rows": [["0: Java"], ["1: Python"], ["2: C++"], ["3: Java"]]}}, {"h": "LinkedList", "p": ["`LinkedList` stores each element in a node that links to the previous and next node (doubly linked list). It implements both `List` and `Deque`, so it has `addFirst`, `addLast`, `removeFirst` and so on.", "Adding or removing at the ends is fast. Reaching the 500th element needs walking through nodes, so `get(i)` is slow."], "code": {"f": "Main.java", "c": "import java.util.*;\n\npublic class Main {\n    public static void main(String[] args) {\n        LinkedList<Integer> ll = new LinkedList<>();\n        ll.add(20);\n        ll.add(30);\n        ll.addFirst(10);\n        ll.addLast(40);\n        System.out.println(ll);\n        System.out.println(\"first=\" + ll.getFirst() + \" last=\" + ll.getLast());\n        ll.removeFirst();\n        ll.removeLast();\n        System.out.println(ll);\n    }\n}", "out": "[10, 20, 30, 40]\nfirst=10 last=40\n[20, 30]"}, "viz": {"type": "chain", "items": ["10", "20", "30", "40"], "caption": "Doubly linked nodes"}}, {"h": "ArrayList vs LinkedList", "p": ["Both are Lists with the same methods. Their speed is different because of the way they store data. Use ArrayList by default. Use LinkedList when you add or remove often at the start or middle and rarely read by index."], "table": {"head": ["Point", "ArrayList", "LinkedList"], "rows": [["Internal", "Dynamic array", "Doubly linked list"], ["get(i)", "Fast O(1)", "Slow O(n)"], ["Add/remove at start", "Slow (shifting)", "Fast O(1)"], ["Add at end", "Fast (amortized)", "Fast O(1)"], ["Memory", "Less", "More (node pointers)"], ["Implements", "List, RandomAccess", "List, Deque"]]}}, {"h": "HashSet", "p": ["`HashSet` stores unique elements using a hash table. `add()` returns `false` if the element is already there. Operations are very fast, about O(1).", "It does not promise any order. The order depends on hash codes, so never depend on it. Elements need correct `equals()` and `hashCode()` to be unique."], "warn": "Output order of HashSet can look random. Do not use it when order matters.", "code": {"f": "Main.java", "c": "import java.util.*;\n\npublic class Main {\n    public static void main(String[] args) {\n        Set<String> set = new HashSet<>();\n        System.out.println(set.add(\"Banana\"));\n        set.add(\"Apple\");\n        set.add(\"Cherry\");\n        System.out.println(set.add(\"Apple\"));   // false: duplicate\n        System.out.println(set);                // no guaranteed order\n        System.out.println(\"size=\" + set.size() + \" has Cherry? \" + set.contains(\"Cherry\"));\n    }\n}", "out": "true\nfalse\n[Apple, Cherry, Banana]\nsize=3 has Cherry? true"}}, {"h": "LinkedHashSet", "p": ["`LinkedHashSet` is a HashSet that also remembers the order in which elements were inserted. It keeps a linked list on top of the hash table. Slightly slower and heavier than HashSet."], "tip": "Need unique items in the same order you added them? Use LinkedHashSet.", "code": {"f": "Main.java", "c": "import java.util.*;\n\npublic class Main {\n    public static void main(String[] args) {\n        Set<String> set = new LinkedHashSet<>();\n        set.add(\"Banana\");\n        set.add(\"Apple\");\n        set.add(\"Cherry\");\n        set.add(\"Apple\");\n        System.out.println(set);    // insertion order kept\n    }\n}", "out": "[Banana, Apple, Cherry]"}}, {"h": "TreeSet", "p": ["`TreeSet` keeps elements unique and always sorted (natural order, or a `Comparator` you give). It is built on a red-black tree, so add/remove/contains take O(log n).", "It gives navigation methods: `first`, `last`, `lower`, `higher`, `headSet`, `tailSet`. It does not allow `null`."], "code": {"f": "Main.java", "c": "import java.util.*;\n\npublic class Main {\n    public static void main(String[] args) {\n        TreeSet<Integer> ts = new TreeSet<>(List.of(50, 10, 40, 20, 30, 20));\n        System.out.println(ts);\n        System.out.println(\"first=\" + ts.first() + \" last=\" + ts.last());\n        System.out.println(\"lower(30)=\" + ts.lower(30) + \" higher(30)=\" + ts.higher(30));\n        System.out.println(\"headSet(30)=\" + ts.headSet(30));\n        System.out.println(\"descending=\" + ts.descendingSet());\n    }\n}", "out": "[10, 20, 30, 40, 50]\nfirst=10 last=50\nlower(30)=20 higher(30)=40\nheadSet(30)=[10, 20]\ndescending=[50, 40, 30, 20, 10]"}, "table": {"head": ["Set", "Order", "Speed", "null"], "rows": [["HashSet", "None", "O(1)", "1 null"], ["LinkedHashSet", "Insertion", "O(1)", "1 null"], ["TreeSet", "Sorted", "O(log n)", "Not allowed"]]}}, {"h": "Queue and PriorityQueue", "p": ["`Queue` is a line: First-In First-Out (FIFO). Add at the tail, remove from the head. Key methods: `offer()` adds, `peek()` looks at the head, `poll()` removes the head. These return `null` (not an exception) when empty.", "`PriorityQueue` does not follow arrival order. The head is always the smallest element (natural order) or per your `Comparator`. It is built on a heap."], "warn": "Printing a PriorityQueue shows heap order, not sorted order. Use `poll()` repeatedly to get sorted output.", "code": {"f": "Main.java", "c": "import java.util.*;\n\npublic class Main {\n    public static void main(String[] args) {\n        Queue<String> q = new LinkedList<>();\n        q.offer(\"A\"); q.offer(\"B\"); q.offer(\"C\");\n        System.out.println(\"peek = \" + q.peek());\n        System.out.println(\"poll = \" + q.poll());\n        System.out.println(q);\n\n        PriorityQueue<Integer> pq = new PriorityQueue<>();\n        pq.add(30); pq.add(10); pq.add(20);\n        System.out.print(\"priority order: \");\n        while (!pq.isEmpty()) System.out.print(pq.poll() + \" \");\n        System.out.println();\n        PriorityQueue<Integer> max = new PriorityQueue<>(Collections.reverseOrder());\n        max.addAll(List.of(30, 10, 20));\n        System.out.println(\"max-heap head = \" + max.peek());\n    }\n}", "out": "peek = A\npoll = A\n[B, C]\npriority order: 10 20 30 \nmax-heap head = 30"}, "viz": {"type": "chain", "items": ["Tail: offer()", "A, B, C", "Head: poll()"], "caption": "FIFO queue"}}, {"h": "Deque and ArrayDeque", "p": ["`Deque` (double ended queue, say \"deck\") allows add and remove at both ends. `ArrayDeque` is the fast array-based class for it. It works as a queue (FIFO) and also as a stack (LIFO) with `push()`, `pop()` and `peek()`.", "`ArrayDeque` is preferred over the old `Stack` class and usually faster than LinkedList. It does not allow `null`."], "code": {"f": "Main.java", "c": "import java.util.*;\n\npublic class Main {\n    public static void main(String[] args) {\n        Deque<Integer> dq = new ArrayDeque<>();\n        dq.addFirst(2);\n        dq.addFirst(1);\n        dq.addLast(3);\n        System.out.println(dq);\n\n        Deque<String> stack = new ArrayDeque<>();   // use as a stack (LIFO)\n        stack.push(\"one\");\n        stack.push(\"two\");\n        stack.push(\"three\");\n        System.out.println(\"pop = \" + stack.pop());\n        System.out.println(\"peek = \" + stack.peek());\n        System.out.println(stack);\n    }\n}", "out": "[1, 2, 3]\npop = three\npeek = two\n[two, one]"}}, {"h": "Map and HashMap", "p": ["`Map` stores key-value pairs called entries. Keys are unique. Values can repeat. `put(k, v)` with an existing key replaces the old value. `get(k)` returns `null` if the key is absent.", "`HashMap` is the main implementation. It uses hashing, so `put` and `get` are about O(1). No order is guaranteed. It allows one `null` key and many `null` values."], "code": {"f": "Main.java", "c": "import java.util.*;\n\npublic class Main {\n    public static void main(String[] args) {\n        Map<String, Integer> marks = new HashMap<>();\n        marks.put(\"Ravi\", 80);\n        marks.put(\"Asha\", 95);\n        marks.put(\"Mohan\", 70);\n        marks.put(\"Ravi\", 85);                 // same key: value replaced\n        System.out.println(marks);\n        System.out.println(\"Asha = \" + marks.get(\"Asha\"));\n        System.out.println(\"Zoya = \" + marks.get(\"Zoya\"));\n        System.out.println(\"default = \" + marks.getOrDefault(\"Zoya\", 0));\n        System.out.println(\"hasKey Ravi? \" + marks.containsKey(\"Ravi\"));\n        marks.remove(\"Mohan\");\n        for (Map.Entry<String, Integer> e : marks.entrySet())\n            System.out.println(e.getKey() + \" -> \" + e.getValue());\n    }\n}", "out": "{Mohan=70, Ravi=85, Asha=95}\nAsha = 95\nZoya = null\ndefault = 0\nhasKey Ravi? true\nRavi -> 85\nAsha -> 95"}, "table": {"head": ["HashMap entries"], "rows": [["Ravi -> 85"], ["Asha -> 95"], ["Mohan -> 70"]]}}, {"h": "LinkedHashMap", "p": ["`LinkedHashMap` is a HashMap that remembers insertion order of keys. Iteration comes out in the order you put them. It can also be set to access order, which is useful for LRU caches."], "code": {"f": "Main.java", "c": "import java.util.*;\n\npublic class Main {\n    public static void main(String[] args) {\n        Map<String, Integer> m = new LinkedHashMap<>();\n        m.put(\"Ravi\", 80);\n        m.put(\"Asha\", 95);\n        m.put(\"Mohan\", 70);\n        System.out.println(m);                 // insertion order\n        System.out.println(m.keySet());\n        System.out.println(m.values());\n    }\n}", "out": "{Ravi=80, Asha=95, Mohan=70}\n[Ravi, Asha, Mohan]\n[80, 95, 70]"}}, {"h": "TreeMap", "p": ["`TreeMap` keeps entries sorted by key (natural order or a `Comparator`). It is a red-black tree: O(log n) operations. Methods like `firstKey`, `lastEntry`, `headMap`, `tailMap` are available. A `null` key is not allowed."], "code": {"f": "Main.java", "c": "import java.util.*;\n\npublic class Main {\n    public static void main(String[] args) {\n        TreeMap<String, Integer> m = new TreeMap<>();\n        m.put(\"Ravi\", 80);\n        m.put(\"Asha\", 95);\n        m.put(\"Mohan\", 70);\n        System.out.println(m);                 // sorted by key\n        System.out.println(\"firstKey = \" + m.firstKey());\n        System.out.println(\"lastEntry = \" + m.lastEntry());\n        System.out.println(\"headMap(Ravi) = \" + m.headMap(\"Ravi\"));\n    }\n}", "out": "{Asha=95, Mohan=70, Ravi=80}\nfirstKey = Asha\nlastEntry = Ravi=80\nheadMap(Ravi) = {Asha=95, Mohan=70}"}, "table": {"head": ["Map", "Order", "Speed", "null key"], "rows": [["HashMap", "None", "O(1)", "1 allowed"], ["LinkedHashMap", "Insertion", "O(1)", "1 allowed"], ["TreeMap", "Sorted by key", "O(log n)", "Not allowed"], ["Hashtable", "None", "O(1) synchronized", "Not allowed"]]}}, {"h": "Looping over a Map", "p": ["A Map is not Iterable. Loop over `keySet()` for keys, `values()` for values or `entrySet()` for both. Or use `forEach` with a lambda."], "tip": "`entrySet()` is the best way when you need both key and value.", "code": {"f": "Main.java", "c": "import java.util.*;\n\npublic class Main {\n    public static void main(String[] args) {\n        Map<String, Integer> m = new TreeMap<>(Map.of(\"a\", 1, \"b\", 2));\n        for (String k : m.keySet()) System.out.print(k + \" \");\n        for (int v : m.values()) System.out.print(v + \" \");\n        System.out.println();\n        m.forEach((k, v) -> System.out.println(k + \"=\" + v));\n    }\n}", "out": "a b 1 2 \na=1\nb=2"}}], "analogy": "List is a to-do list (order, repeats fine). Set is a guest list (no name twice). Queue is a ticket counter line. Map is your phone contacts: name (key) points to number (value).", "hinglish": "Bhai simple hai: List mein order rehta hai aur duplicate chalta hai. Set mein duplicate nahi chalta. Queue line ki tarah kaam karti hai, pehle aaya pehle gaya. Map mein key-value jodi hoti hai aur key unique hoti hai. Har ek ki alag-alag class hai: Hash wali fast, Linked wali order yaad rakhti, Tree wali sorted rakhti.", "mistakes": ["Assuming HashSet or HashMap keep insertion order.", "Using `get(i)` in a loop on a LinkedList (very slow).", "Adding null to a TreeSet or as a TreeMap key.", "Expecting a PriorityQueue printout to be sorted.", "Using mutable objects without hashCode/equals as HashSet elements or HashMap keys."], "remember": ["List: ordered, index based, duplicates allowed. Classes: ArrayList, LinkedList, Vector, Stack.", "ArrayList: dynamic array, fast random access, slow insert/delete in middle.", "LinkedList: doubly linked list, fast insert/delete at ends, slow get(i); implements List and Deque.", "Set: no duplicates; add() returns false for a duplicate.", "HashSet: no order, O(1). LinkedHashSet: insertion order. TreeSet: sorted, O(log n), no null.", "Queue: FIFO. offer/add insert, poll/remove take head, peek/element look at head.", "PriorityQueue: head is smallest by natural order or Comparator; heap based.", "Deque: operations at both ends; ArrayDeque can act as stack (push/pop) or queue.", "Map: key-value, unique keys, values may repeat. Not a Collection.", "HashMap: no order, one null key. LinkedHashMap: insertion order. TreeMap: sorted keys, no null key.", "Hashtable is old, synchronized, and allows no null key or value.", "HashSet and HashMap rely on hashCode() and equals() of the keys.", "Loop a Map with keySet(), values() or entrySet()."], "def": "`List` is an ordered collection. Elements have an index starting from 0, and duplicates are allowed. `ArrayList` is the most used List. Inside, it is a resizable array.", "uses": ["List: ordered data such as a to-do list or search results", "Set: removing duplicates, unique IDs", "Queue: task scheduling, print jobs, BFS", "Map: lookup tables, counting words, caching"], "pros": ["Choose the best structure for each job", "Rich methods such as add, remove, contains, get, put, size"], "cons": ["Modifying a list while looping over it (ConcurrentModificationException)", "Using a mutable object as a HashMap key and then changing it", "Using ArrayList when you need constant fast insert and delete at the front"]}, "u6-t5": {"tldr": "JDBC is the Java API that lets your program connect to a database and run SQL.", "sections": [{"h": "What is JDBC and why use it?", "p": ["Programs lose data when they stop. A database keeps it safely, and JDBC is the bridge to it. The same Java code works with MySQL, Oracle, PostgreSQL and others. Only the driver and URL change."], "pts": ["Database independent API", "Run SELECT, INSERT, UPDATE, DELETE and DDL", "Read query results row by row", "Part of standard Java (JDK), driver is an extra JAR"]}, {"h": "JDBC architecture", "p": ["Your code talks only to the JDBC API. `DriverManager` picks the right driver. The driver speaks the database's own language."], "pts": ["`DriverManager`: finds a driver and makes connections", "`Connection`: one session with the database", "`Statement` / `PreparedStatement`: carry SQL", "`ResultSet`: the table of rows returned by a SELECT"], "viz": {"type": "chain", "items": ["Java Application", "JDBC API", "DriverManager", "JDBC Driver", "Database"], "caption": "Layers of JDBC"}}, {"h": "The 5 steps of a JDBC program", "p": ["Every JDBC program follows the same flow. Learn this order and you can write any of them."], "tip": "Since JDBC 4.0 (Java 6) the driver loads itself from the JAR, so step 1 is optional. Still asked in exams.", "table": {"head": ["Step", "What happens"], "rows": [["1. Load driver", "Class.forName(driverClass)"], ["2. Connect", "DriverManager.getConnection(url, user, pass)"], ["3. Create statement", "con.createStatement()"], ["4. Execute query", "executeQuery / executeUpdate, read ResultSet"], ["5. Close", "close ResultSet, Statement, Connection"]]}}, {"h": "Steps 1 and 2: driver and connection", "p": ["`Class.forName(\"com.mysql.cj.jdbc.Driver\")` loads the driver class. Then `DriverManager.getConnection(url, user, password)` gives a `Connection`. The URL has the form `jdbc:subprotocol://host:port/database`.", "Add the driver JAR to the classpath when you run the program. This code needs a running MySQL server, so no output is shown."], "warn": "Wrong URL, user or password throws `SQLException`. A missing driver JAR gives \"No suitable driver\" or `ClassNotFoundException`.", "code": {"f": "Main.java", "c": "import java.sql.*;\n\npublic class Main {\n    public static void main(String[] args) throws Exception {\n        Class.forName(\"com.mysql.cj.jdbc.Driver\");          // step 1 (optional in JDBC 4+)\n        String url = \"jdbc:mysql://localhost:3306/college\"; // protocol:subprotocol://host:port/db\n        Connection con = DriverManager.getConnection(url, \"root\", \"password\");  // step 2\n        System.out.println(\"Connected: \" + !con.isClosed());\n        con.close();\n    }\n}"}, "table": {"head": ["Database", "Driver class", "URL pattern"], "rows": [["MySQL", "com.mysql.cj.jdbc.Driver", "jdbc:mysql://host:3306/db"], ["Oracle", "oracle.jdbc.OracleDriver", "jdbc:oracle:thin:@host:1521:xe"], ["PostgreSQL", "org.postgresql.Driver", "jdbc:postgresql://host:5432/db"]]}}, {"h": "Steps 3 and 4: Statement and execute methods", "p": ["`createStatement()` gives a `Statement` for plain SQL. Pick the execute method by the kind of SQL."], "code": {"f": "Main.java", "c": "import java.sql.*;\n\npublic class Main {\n    public static void main(String[] args) throws Exception {\n        Connection con = DriverManager.getConnection(\n            \"jdbc:mysql://localhost:3306/college\", \"root\", \"password\");\n        Statement stmt = con.createStatement();                       // step 3\n        stmt.executeUpdate(\"CREATE TABLE IF NOT EXISTS student(id INT, name VARCHAR(30))\");\n        int rows = stmt.executeUpdate(\"INSERT INTO student VALUES (1, 'Asha')\");  // step 4\n        System.out.println(rows + \" row inserted\");\n        stmt.close();\n        con.close();                                                  // step 5\n    }\n}"}, "table": {"head": ["Method", "Use for", "Returns"], "rows": [["executeQuery(sql)", "SELECT", "ResultSet"], ["executeUpdate(sql)", "INSERT, UPDATE, DELETE, DDL", "int (rows affected)"], ["execute(sql)", "Any SQL", "boolean (true if ResultSet)"]]}}, {"h": "ResultSet: reading query results", "p": ["A `ResultSet` holds the rows from a SELECT. A cursor sits before the first row. `next()` moves to the next row and returns `false` when no rows are left. Read columns with `getInt`, `getString`, `getDouble`, `getDate`, using the column name or its number."], "warn": "Column numbers start at 1, not 0. Always call `next()` before reading, else `SQLException`.", "code": {"f": "Main.java", "c": "import java.sql.*;\n\npublic class Main {\n    public static void main(String[] args) throws Exception {\n        Connection con = DriverManager.getConnection(\n            \"jdbc:mysql://localhost:3306/college\", \"root\", \"password\");\n        Statement stmt = con.createStatement();\n        ResultSet rs = stmt.executeQuery(\"SELECT id, name FROM student\");\n        while (rs.next()) {                       // moves to next row, false at the end\n            int id = rs.getInt(\"id\");             // by column name\n            String name = rs.getString(2);        // by column number (starts at 1)\n            System.out.println(id + \" \" + name);\n        }\n        rs.close(); stmt.close(); con.close();\n    }\n}"}, "viz": {"type": "chain", "items": ["Before first row", "next()", "Row 1", "next()", "Row 2", "next() = false"], "caption": "ResultSet cursor"}}, {"h": "PreparedStatement", "p": ["`PreparedStatement` is a pre-compiled SQL with `?` placeholders. You fill each one with `setInt`, `setString` and so on (index starts at 1), then execute. The database compiles the SQL only once, so repeated runs are faster.", "Values are sent as data, never joined into SQL text. This is what stops SQL injection."], "code": {"f": "Main.java", "c": "import java.sql.*;\n\npublic class Main {\n    public static void main(String[] args) throws Exception {\n        Connection con = DriverManager.getConnection(\n            \"jdbc:mysql://localhost:3306/college\", \"root\", \"password\");\n        PreparedStatement ps = con.prepareStatement(\n            \"INSERT INTO student(id, name) VALUES (?, ?)\");   // ? = placeholder\n        ps.setInt(1, 2);               // first ?\n        ps.setString(2, \"Ravi\");       // second ?\n        ps.executeUpdate();\n\n        PreparedStatement q = con.prepareStatement(\"SELECT name FROM student WHERE id = ?\");\n        q.setInt(1, 2);\n        ResultSet rs = q.executeQuery();\n        if (rs.next()) System.out.println(rs.getString(\"name\"));\n        con.close();\n    }\n}"}}, {"h": "Statement vs PreparedStatement", "p": ["With plain `Statement`, if you join user input into the SQL string, an attacker can change the query. `PreparedStatement` treats the input as a value only."], "warn": "Never build SQL by joining user input into a String.", "code": {"f": "Main.java", "c": "import java.sql.*;\n\npublic class Main {\n    static void login(Connection con, String user) throws SQLException {\n        // UNSAFE: input becomes part of the SQL text\n        String bad = \"SELECT * FROM users WHERE name = '\" + user + \"'\";\n        // user = \"x' OR '1'='1\"  ->  WHERE name = 'x' OR '1'='1'   (matches everyone)\n        con.createStatement().executeQuery(bad);\n\n        // SAFE: input is only data, never SQL\n        PreparedStatement ps = con.prepareStatement(\"SELECT * FROM users WHERE name = ?\");\n        ps.setString(1, user);\n        ps.executeQuery();\n    }\n    public static void main(String[] args) { }\n}"}, "table": {"head": ["Point", "Statement", "PreparedStatement"], "rows": [["SQL", "Fixed text, built by joining", "Template with ? placeholders"], ["Compilation", "Every execution", "Once, then reused"], ["SQL injection", "Vulnerable", "Protected"], ["Speed (repeated)", "Slower", "Faster"], ["Use for", "Static one-off SQL", "Anything with user input"]]}}, {"h": "Closing resources: try-with-resources", "p": ["Open connections are limited and costly. Always close `ResultSet`, `Statement` and `Connection`. `Connection`, `Statement` and `ResultSet` all implement `AutoCloseable`, so try-with-resources closes them for you in reverse order, even on error."], "tip": "Catch `SQLException`: `getMessage()`, `getErrorCode()` and `getSQLState()` tell what went wrong.", "code": {"f": "Main.java", "c": "import java.sql.*;\n\npublic class Main {\n    public static void main(String[] args) {\n        String url = \"jdbc:mysql://localhost:3306/college\";\n        String sql = \"SELECT id, name FROM student WHERE id > ?\";\n        try (Connection con = DriverManager.getConnection(url, \"root\", \"password\");\n             PreparedStatement ps = con.prepareStatement(sql)) {\n            ps.setInt(1, 0);\n            try (ResultSet rs = ps.executeQuery()) {\n                while (rs.next())\n                    System.out.println(rs.getInt(\"id\") + \" \" + rs.getString(\"name\"));\n            }\n        } catch (SQLException e) {\n            System.out.println(\"DB error: \" + e.getMessage());\n        }\n    }\n}"}}], "analogy": "JDBC is a translator between your Java program and the database, like a Hindi-English friend helping you talk in a foreign shop. The driver is that friend: one for each shop (MySQL, Oracle...).", "hinglish": "Bhai JDBC se Java program database se baat karta hai. Pehle driver load, phir connection, phir statement banao, query chalao, result padho aur last mein sab close karo. User input ke saath hamesha `PreparedStatement` use karo, warna SQL injection ka khatra hai.", "mistakes": ["Forgetting to add the driver JAR to the classpath.", "Starting ResultSet column index at 0 (it starts at 1).", "Building SQL with string concatenation: SQL injection.", "Not closing the Connection, which leaks resources.", "Using executeQuery for INSERT/UPDATE (use executeUpdate)."], "remember": ["JDBC = Java Database Connectivity, API in java.sql / javax.sql to work with relational databases.", "Key types: DriverManager, Connection, Statement, PreparedStatement, ResultSet, SQLException.", "5 steps: load driver, create connection, create statement, execute query, close connection.", "Class.forName(\"driver class\") loads the driver; optional since JDBC 4.0.", "URL format: jdbc:mysql://localhost:3306/dbname.", "DriverManager.getConnection(url, user, password) returns a Connection.", "executeQuery -> SELECT -> ResultSet; executeUpdate -> INSERT/UPDATE/DELETE/DDL -> int; execute -> any -> boolean.", "ResultSet: next() moves cursor; getXxx() by column name or index starting at 1.", "PreparedStatement uses ? placeholders and setInt/setString (index from 1).", "PreparedStatement: pre-compiled, faster, prevents SQL injection.", "Statement: plain SQL, compiled each time, open to SQL injection.", "Close ResultSet, Statement, Connection; try-with-resources does it automatically.", "All JDBC calls throw the checked SQLException."], "def": "JDBC (Java Database Connectivity) is an API in `java.sql` (and `javax.sql`). Through it, a Java program can connect to almost any relational database, run SQL queries and read the results.", "uses": ["Back-end applications that store and read data (students, accounts, orders)", "Frameworks such as Hibernate and Spring use JDBC internally"], "pros": ["Standard API that works with many databases", "PreparedStatement is secure and fast for repeated queries", "Full control with SQL"], "cons": ["Building SQL by joining user input into a string (SQL injection)", "Not closing connections (leaks). Use try-with-resources", "Hard-coding passwords in source code", "A lot of boilerplate code compared to ORM tools"]}, "u2-t7": {"tldr": "Static members belong to the class, not to objects: one shared copy for all.", "sections": [{"h": "What does static mean?", "p": ["You can put `static` on four things: a variable, a method, a block and a nested class. You cannot put it on a top-level class or on a local variable."], "pts": ["Loaded in memory once, when the class is loaded by the JVM", "Accessed with the class name: `ClassName.member`", "Exists even if you never create an object"], "tip": "Think: instance member = 'per object', static member = 'per class'.", "table": {"head": ["Class Counter (method area)"], "rows": [["static int count = 0"], ["(one shared copy)"]]}}, {"h": "Why do we need static?", "p": ["Some data is common for all objects, like the college name for all students. Storing it in every object wastes memory and is hard to keep in sync.", "Some work needs no object at all, like `Math.sqrt(25)`. Making static methods lets you call them directly. That is why `main` is static: the JVM must run it before any object exists."], "pts": ["Saves memory for common data", "Gives utility methods (Math, Arrays, Collections)", "Lets the JVM start the program with `main`"]}, {"h": "Static variable", "p": ["A static variable (class variable) is declared with `static` inside a class but outside methods. It gets memory once, when the class loads. If one object changes it, all objects see the change.", "Here every `Student` object has its own `roll`, but all of them share `college` and `total`."], "tip": "Static variables get default values (0, null, false) just like instance variables.", "warn": "Writing `a.college` works but is misleading. Always use `Student.college`.", "code": {"f": "Main.java", "c": "class Student {\n    int roll;                          // instance: one per object\n    static String college = \"GEC\";     // static: one for the class\n    static int total = 0;              // shared counter\n\n    Student() { total++; roll = total; }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        Student a = new Student();\n        Student b = new Student();\n        Student.college = \"GEC Jehanabad\";   // change via class name\n        System.out.println(a.roll + \" \" + b.roll);\n        System.out.println(a.college + \" | \" + b.college);\n        System.out.println(\"Total = \" + Student.total);\n    }\n}", "out": "1 2\nGEC Jehanabad | GEC Jehanabad\nTotal = 2"}}, {"h": "Static method", "p": ["A static method belongs to the class. You call it with the class name and no object. It can use only static data directly. To use instance data it needs an object reference.", "Static methods are used for helpers that do not depend on object state."], "pts": ["No `this` or `super` inside a static method", "Can be called without creating an object", "Cannot be overridden, only hidden (see rules)"], "code": {"f": "Main.java", "c": "class MathUtil {\n    static int square(int n) { return n * n; }\n    static int max(int a, int b) { return a > b ? a : b; }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        System.out.println(MathUtil.square(7));\n        System.out.println(MathUtil.max(10, 25));\n    }\n}", "out": "49\n25"}}, {"h": "Static block", "p": ["A static block is a group of statements inside `static { ... }`. It runs once, when the class is first loaded, before `main` or any constructor. Use it to initialise static variables that need extra logic.", "A class can have many static blocks. They run in the order they appear."], "warn": "Do not rely on static blocks for heavy work. They run during class loading and an exception there gives `ExceptionInInitializerError`.", "code": {"f": "Main.java", "c": "public class Main {\n    static int[] table = new int[5];\n\n    static {\n        System.out.println(\"Static block 1: filling table\");\n        for (int i = 0; i < table.length; i++) table[i] = i * i;\n    }\n    static {\n        System.out.println(\"Static block 2\");\n    }\n\n    public static void main(String[] args) {\n        System.out.println(\"main started\");\n        System.out.println(table[4]);\n    }\n}", "out": "Static block 1: filling table\nStatic block 2\nmain started\n16"}}, {"h": "Order of execution", "p": ["When a class is used, Java first runs static variable initialisers and static blocks (top to bottom, once). Only when you do `new` does it run instance blocks and then the constructor, every time."], "code": {"f": "Main.java", "c": "public class Main {\n    static { System.out.println(\"1. static block\"); }\n    { System.out.println(\"3. instance block\"); }\n    Main() { System.out.println(\"4. constructor\"); }\n\n    public static void main(String[] args) {\n        System.out.println(\"2. main\");\n        new Main();\n        new Main();\n    }\n}", "out": "1. static block\n2. main\n3. instance block\n4. constructor\n3. instance block\n4. constructor"}, "viz": {"type": "chain", "items": ["Class loads", "Static vars + blocks", "main() runs", "new -> constructor"], "caption": "Static things run first, once. Constructors run per object."}}, {"h": "Static nested class", "p": ["A class declared `static` inside another class is a static nested class. It does not need an outer object, and it can use only the outer class's static members directly. Only nested classes can be static; a top-level class cannot.", "Details of all nested class types are in the Nested & Inner Classes topic. A quick look:"], "code": {"f": "Main.java", "c": "class Outer {\n    static int x = 10;\n    static class Inner {\n        void show() { System.out.println(\"x = \" + x); }\n    }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        Outer.Inner in = new Outer.Inner();   // no Outer object needed\n        in.show();\n    }\n}", "out": "x = 10"}}, {"h": "Rules and restrictions", "p": ["Static code lives at class level, so it cannot depend on a particular object. These rules follow from that."], "pts": ["A static method cannot use `this` or `super`", "A static method cannot call a non-static method or touch a non-static variable directly", "A non-static method CAN use static members freely", "Static methods cannot be overridden. A same-signature method in a subclass only hides it (no runtime polymorphism)", "A `static` method cannot be `abstract`", "Local variables cannot be static"], "warn": "Exam trap: calling an instance method from `main` without an object gives 'non-static method cannot be referenced from a static context'.", "code": {"f": "Main.java", "c": "public class Main {\n    int a = 5;                 // instance\n    static int b = 6;          // static\n\n    static void test() {\n        System.out.println(b);          // OK\n        // System.out.println(a);       // ERROR: non-static variable a\n        Main m = new Main();            // fix: use an object\n        System.out.println(m.a);        // OK\n    }\n    public static void main(String[] args) { test(); }\n}", "out": "6\n5"}}, {"h": "Static vs instance", "p": ["Quick comparison to revise before the exam."], "table": {"head": ["Point", "Static", "Instance"], "rows": [["Belongs to", "Class", "Object"], ["Copies", "One shared", "One per object"], ["Memory", "When class loads", "When object is created"], ["Access", "ClassName.member", "object.member"], ["Can use this?", "No", "Yes"], ["Overridable (method)", "No (hidden)", "Yes"]]}}], "analogy": "The college name is printed on the main gate once and every student shares it. But each student has their own roll number. Static is the gate board, instance is the roll number.", "hinglish": "Bhai static ka matlab hai 'class ka apna', object ka nahi. Ek hi copy banti hai aur sab objects use share karte hain. Isliye main() bhi static hai, kyunki object banne se pehle chalna hota hai. Static se non-static seedha access nahi hota, object chahiye.", "mistakes": ["Calling an instance method or variable from static main without an object", "Using this inside a static method", "Thinking static methods can be overridden (they are hidden)", "Changing a static variable through one object and forgetting all objects see it", "Forgetting static blocks run only once, even if many objects are created"], "remember": ["static member belongs to the class, not to an object", "Static variable: one copy, shared by all objects, memory at class loading", "Static method: called as ClassName.method(), no object needed", "Static method cannot use this, super, or non-static members directly", "Non-static methods can use static members", "Static block: runs once at class loading, before main and constructors", "Multiple static blocks run in written order", "Order: static blocks -> main -> (per object) instance block -> constructor", "Static methods cannot be overridden, only hidden", "main is static so JVM can call it without an object", "A static method cannot be abstract", "Only nested classes can be static; top-level classes and local variables cannot"], "def": "`static` is a keyword that makes a member belong to the class itself, not to any single object. There is only one copy of it, and every object shares that copy.", "uses": ["Counters, constants (static final) and shared configuration", "Utility methods such as Math.sqrt()", "The main method itself is static so the JVM can call it without creating an object"], "pros": ["Saves memory by sharing one copy", "Easy access without creating objects"], "cons": ["Using non-static members directly inside a static method", "Overusing static, which makes code harder to test", "Shared static data can cause bugs in multithreaded programs without synchronization"]}, "u2-t8": {"tldr": "Access modifiers decide who can use a class or member: private, default, protected, public.", "sections": [{"h": "What are access modifiers?", "p": ["Java has four access levels: `private`, default (no keyword), `protected` and `public`. Only two keywords are used on top-level classes: `public` and default."], "pts": ["Control visibility, not speed or memory", "Applied to variables, methods, constructors and classes"], "viz": {"type": "chain", "items": ["private", "default", "protected", "public"], "caption": "Least visible -> most visible"}}, {"h": "Why do we need them?", "p": ["Without them any code could change your data in wrong ways. For example a bank balance could be set to a negative number. With `private` plus a checking method, the class stays in control.", "They also make later changes easy. You can change private code without breaking the users of the class."], "pts": ["Data hiding and security", "Clear public interface, hidden details", "Safer and easier to maintain code"]}, {"h": "private", "p": ["`private` members can be used only inside the same class. Not even a subclass or another class in the same package can touch them. The usual way to give controlled access is a getter and a setter."], "tip": "A private constructor stops other classes from creating objects. Used in Singleton and utility classes.", "warn": "A private method is not inherited, so it cannot be overridden.", "code": {"f": "Main.java", "c": "class Account {\n    private double balance;            // hidden\n\n    public void deposit(double amt) {\n        if (amt > 0) balance += amt;   // rule enforced here\n    }\n    public double getBalance() { return balance; }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        Account a = new Account();\n        a.deposit(500);\n        a.deposit(-100);               // ignored\n        System.out.println(a.getBalance());\n        // a.balance = 1;              // ERROR: balance has private access\n    }\n}", "out": "500.0"}}, {"h": "default (package-private)", "p": ["If you write no modifier, the member is default. It is visible to all classes in the same package, and invisible outside it, even for subclasses. There is no keyword called `default` for this purpose (the word is used in `switch` and interface methods only)."], "warn": "Do not write `default int x;` in a class. It is a compile error.", "code": {"f": "Main.java", "c": "class Item {\n    String name = \"Pen\";          // default access\n    void show() { System.out.println(\"Item: \" + name); }\n}\n\npublic class Main {              // same package (default package)\n    public static void main(String[] args) {\n        Item i = new Item();\n        System.out.println(i.name);\n        i.show();\n    }\n}", "out": "Pen\nItem: Pen"}}, {"h": "protected", "p": ["`protected` members are visible in the same package and also in subclasses, even if the subclass is in a different package. Outside the package, access works only through inheritance (using the subclass object), not through a plain parent reference.", "Below, class `A` is in package `p1` and class `B` extends it from package `p2`. Compile both files, then run `java p2.B`."], "tip": "Two files are shown in one box for notes. Keep them in separate files p1/A.java and p2/B.java.", "code": {"f": "p2/B.java", "c": "// File: p1/A.java\npackage p1;\npublic class A {\n    protected int pr = 2;\n    public int pu = 3;\n    protected void show() { System.out.println(\"A.show\"); }\n}\n\n// File: p2/B.java\npackage p2;\nimport p1.A;\npublic class B extends A {\n    public static void main(String[] args) {\n        B b = new B();\n        System.out.println(b.pr);    // OK: inherited protected\n        System.out.println(b.pu);\n        b.show();                    // OK\n        A a = new A();\n        System.out.println(a.pu);    // OK: public\n        // System.out.println(a.pr); // ERROR: other package, via A\n    }\n}", "out": "2\n3\nA.show\n3"}}, {"h": "public", "p": ["`public` members are visible everywhere: same class, same package, other packages, any subclass. Use it for the things you want to expose as your official interface, like `main`, getters and constructors.", "A `public` top-level class must be in a file with the same name, for example `public class Main` in `Main.java`. One file can have only one public class."], "pts": ["`public static void main` must be public so the JVM can call it", "Overusing public breaks encapsulation. Make fields private, methods public"]}, {"h": "Access modifiers and classes, inheritance rules", "p": ["For a top-level class you can use only `public` or default. `private` and `protected` are allowed only for nested classes and members.", "When you override a method, you may keep the same access or widen it, never narrow it. A `protected` method can become `public`, but not `private` or default."], "code": {"f": "Main.java", "c": "class Parent {\n    protected void greet() { System.out.println(\"Parent hello\"); }\n}\nclass Child extends Parent {\n    @Override\n    public void greet() { System.out.println(\"Child hello\"); }  // widened OK\n    // private void greet() {}   // ERROR: weaker access\n}\npublic class Main {\n    public static void main(String[] args) {\n        new Child().greet();\n    }\n}", "out": "Child hello"}}, {"h": "Comparison table", "p": ["Memorise this table. It is asked in almost every exam."], "table": {"head": ["Modifier", "Same class", "Same package", "Subclass (other pkg)", "Everywhere"], "rows": [["private", "Yes", "No", "No", "No"], ["default", "Yes", "Yes", "No", "No"], ["protected", "Yes", "Yes", "Yes", "No"], ["public", "Yes", "Yes", "Yes", "Yes"]]}}], "analogy": "Your house: the diary in your cupboard is private, the drawing room is for family (protected), the building gate is for the society (default) and the shop front is for everyone (public).", "hinglish": "Bhai access modifiers matlab kaun kya dekh sakta hai. private sirf apni class mein, default same package mein, protected package + child class mein, public sabke liye. Fields private rakho aur getter-setter public, yahi encapsulation hai.", "mistakes": ["Writing `default` as a keyword on a field", "Expecting private members to be inherited or overridden", "Narrowing access while overriding (compile error)", "Using protected member through a parent reference from another package", "Declaring a top-level class private or protected"], "remember": ["Access modifiers control visibility of classes, variables, methods, constructors", "Four levels: private, default (no keyword), protected, public", "private: only inside the same class", "default: same package only, even subclasses in other packages cannot use it", "protected: same package + subclasses in any package", "public: accessible from everywhere", "Top-level class can be only public or default", "private and protected allowed only on members and nested classes", "Overriding cannot reduce visibility, only keep or widen", "private members are not inherited", "Private constructor blocks object creation from outside (Singleton)", "Good practice: fields private, methods public (encapsulation)"], "def": "Access modifiers are keywords that decide who can see and use a class, variable, method or constructor. They are the main tool for encapsulation: you hide the inside and show only what is needed.", "uses": ["Implementing encapsulation and data hiding", "Designing a clean public API for a class or library"], "pros": ["Protects data from accidental changes", "Lets you change internal code without breaking other classes"], "cons": ["Making every field public for convenience", "Forgetting that default access works only inside the same package", "Mixing up protected with private"]}, "u2-t9": {"tldr": "`this` is a reference to the current object. Used to fix name clashes, chain constructors and pass the object.", "sections": [{"h": "What is the this keyword?", "p": ["Different objects get different `this`. When you call `s1.show()`, `this` is `s1` inside `show`. When you call `s2.show()`, `this` is `s2`."], "tip": "Use this simple idea: `this` = 'the object that called me'.", "code": {"f": "Main.java", "c": "public class Main {\n    String name;\n    Main(String name) { this.name = name; }\n    void whoAmI() { System.out.println(\"I am \" + this.name); }\n\n    public static void main(String[] args) {\n        Main a = new Main(\"A\");\n        Main b = new Main(\"B\");\n        a.whoAmI();      // this = a\n        b.whoAmI();      // this = b\n    }\n}", "out": "I am A\nI am B"}}, {"h": "Why do we need it?", "p": ["Often a parameter has the same name as an instance variable. Inside the method the parameter hides the variable (this is called shadowing). Java then needs a way to say 'I mean the object's variable'. That is `this`.", "Beyond that, `this` lets a constructor call another constructor, and lets you pass or return the current object."], "pts": ["Remove confusion between variable and parameter", "Constructor chaining", "Pass / return the current object", "Method chaining (builder style)"]}, {"h": "Use 1: this.variable", "p": ["`this.name` means the instance variable `name`. Plain `name` means the nearest variable, which here is the parameter. Without `this`, the assignment `name = name` only assigns the parameter to itself and the field stays default."], "warn": "`id = id;` compiles without error but does nothing useful. A classic exam bug.", "code": {"f": "Main.java", "c": "class Student {\n    int id; String name;\n\n    Student(int id, String name) {\n        this.id = id;        // field = parameter\n        this.name = name;\n    }\n    void show() { System.out.println(id + \" \" + name); }\n}\n\nclass Wrong {\n    int id;\n    Wrong(int id) { id = id; }   // no this: field stays 0\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        new Student(7, \"Keshav\").show();\n        System.out.println(new Wrong(9).id);\n    }\n}", "out": "7 Keshav\n0"}}, {"h": "Use 2: this() constructor chaining", "p": ["`this(...)` calls another constructor of the same class. It avoids repeating code. Rules: it must be the FIRST statement in the constructor, and you cannot make a loop of constructors calling each other."], "warn": "`this()` must be the first line. `super()` must also be first, so you cannot use both in one constructor.", "code": {"f": "Main.java", "c": "class Box {\n    int l, w;\n    Box() { this(1); System.out.println(\"Box()\"); }\n    Box(int l) { this(l, 1); System.out.println(\"Box(int)\"); }\n    Box(int l, int w) {\n        this.l = l; this.w = w;\n        System.out.println(\"Box(int,int)\");\n    }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        Box b = new Box();\n        System.out.println(b.l + \"x\" + b.w);\n    }\n}", "out": "Box(int,int)\nBox(int)\nBox()\n1x1"}, "viz": {"type": "chain", "items": ["Box()", "Box(int)", "Box(int,int)"], "caption": "Each constructor hands over to a bigger one"}}, {"h": "Use 3: this.method()", "p": ["You can call another method of the same object with `this.method()`. Writing just `method()` does the same thing, because the compiler adds `this.` for you. Use it when you want to be explicit."], "code": {"f": "Main.java", "c": "public class Main {\n    void a() { System.out.println(\"in a\"); this.b(); }\n    void b() { System.out.println(\"in b\"); }\n\n    public static void main(String[] args) {\n        new Main().a();\n    }\n}", "out": "in a\nin b"}}, {"h": "Use 4: pass this as an argument", "p": ["If a method needs the current object, pass `this`. This is common when one object registers itself with another, like a button listener."], "code": {"f": "Main.java", "c": "class Printer {\n    static void print(Person p) { System.out.println(\"Person: \" + p.name); }\n}\nclass Person {\n    String name;\n    Person(String name) { this.name = name; }\n    void register() { Printer.print(this); }   // send myself\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        new Person(\"Asha\").register();\n    }\n}", "out": "Person: Asha"}}, {"h": "Use 5: return this (method chaining)", "p": ["A method can return `this` so calls can be chained in one line. `StringBuilder.append()` works exactly like this. It is also the base of the Builder pattern."], "code": {"f": "Main.java", "c": "class Calc {\n    int total;\n    Calc add(int n) { total += n; return this; }\n    Calc sub(int n) { total -= n; return this; }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        Calc c = new Calc();\n        c.add(10).sub(3).add(5);\n        System.out.println(c.total);\n    }\n}", "out": "12"}, "viz": {"type": "chain", "items": ["c.add(5)", "returns c", "c.add(3)", "returns c"], "caption": "Each call hands back the same object"}}, {"h": "Rules and limits of this", "p": ["`this` exists only where an object exists, so it has limits."], "pts": ["Cannot be used in a static method, static block or static variable initialiser", "Cannot be assigned: `this = other;` is an error", "`this()` call must be the first statement of a constructor", "Inside an inner class, `Outer.this` refers to the outer object", "`this` is not a variable you declare. It is a keyword"], "warn": "Using `this` inside `static void main` gives: 'non-static variable this cannot be referenced from a static context'."}], "analogy": "When you say 'my phone', the word 'my' points to you, whoever you are. Each object says 'this' and means itself.", "hinglish": "Bhai this ka matlab 'main khud', yaani abhi wala object. Jab parameter aur variable ka naam same ho to this.id likhte hain. this() se ek constructor dusre ko bula leta hai, but wo pehli line mein hi hona chahiye. Static mein this nahi chalta.", "mistakes": ["Writing `id = id;` and wondering why the field is 0", "Putting this() after another statement", "Using this inside static main", "Recursive constructor calls causing a compile error", "Using this() and super() in the same constructor"], "remember": ["this is a reference to the current object", "Available in every non-static method and constructor", "this.field resolves shadowing between parameter and instance variable", "this(...) calls another constructor of the same class (constructor chaining)", "this(...) must be the first statement in a constructor", "Constructors cannot call each other in a cycle", "this.method() calls a method of the current object; this. is optional", "this can be passed as an argument to another method or constructor", "return this enables method chaining", "this cannot be used in static context", "this cannot be reassigned", "Outer.this gives the outer object inside an inner class", "this() and super() cannot both be first, so cannot be used together"], "def": "`this` is a reference variable that points to the current object, the object whose method or constructor is running right now. The compiler gives it to every non-static method automatically.", "uses": ["Removing confusion between parameters and fields in constructors and setters", "Constructor chaining to avoid repeated code", "Fluent APIs such as obj.setA(1).setB(2)"], "pros": ["Clear, readable code", "Less code duplication"], "cons": ["Writing name = name; so the parameter is assigned to itself", "Using this inside a static method", "Calling this(...) after other statements"]}, "u2-t10": {"tldr": "Java frees unused heap objects automatically. That process is garbage collection.", "sections": [{"h": "What is garbage collection?", "p": ["In C and C++ you free memory yourself (`free`, `delete`). In Java you only create objects with `new`. Cleaning is done for you."], "pts": ["Works on the heap area only", "Runs in a background thread", "Cannot be forced, only requested"], "viz": {"type": "chain", "items": ["new Object()", "Used by program", "No reference left", "GC frees memory"], "caption": "Life of an object"}}, {"h": "Why do we need it?", "p": ["Memory is limited. If objects are never freed the program runs out of memory (`OutOfMemoryError`). Manual freeing is error-prone: forget it and you get a memory leak, free too early and you get a crash.", "GC removes both problems, so you focus on logic, not on cleanup."], "pts": ["Fewer memory leaks", "No dangling pointers", "Cleaner, shorter code"]}, {"h": "When is an object eligible?", "p": ["An object becomes eligible for GC when no live reference can reach it. There are three common ways to get there."], "pts": ["Set the reference to `null`", "Point the reference to another object", "Reference goes out of scope (a method ends, a block ends)", "Anonymous object: `new Student();` with no variable"], "tip": "Eligible does not mean deleted. GC decides the time.", "code": {"f": "Main.java", "c": "public class Main {\n    static void demo() {\n        Object o = new Object();   // 3. dies when demo() ends\n    }\n    public static void main(String[] args) {\n        Object a = new Object();\n        a = null;                  // 1. nulled\n\n        Object b = new Object();\n        b = new Object();          // 2. first object lost\n\n        new Object();              // 4. anonymous\n        demo();\n        System.out.println(\"4 objects are eligible for GC\");\n    }\n}", "out": "4 objects are eligible for GC"}}, {"h": "How GC works: mark, sweep, compact", "p": ["A simple collector works in phases. First it marks every object reachable from the roots (local variables, static fields, active threads). Then it sweeps away all unmarked objects. Some collectors then compact the survivors so free memory is one big block."], "pts": ["Reachable from a root = alive, otherwise = garbage", "Circular references (A points to B, B to A) are still collected if nothing outside reaches them"], "table": {"head": ["Step", "What happens"], "rows": [["1. Mark", "Find all reachable objects"], ["2. Sweep", "Delete unmarked objects"], ["3. Compact", "Move survivors together"]]}}, {"h": "Heap generations", "p": ["Most objects die young, so the heap is split by age. New objects start in the Young generation (Eden and two Survivor spaces). Objects that survive several rounds move to the Old generation.", "A fast Minor GC cleans the Young area often. A slower Major or Full GC cleans the Old area less often."], "tip": "Common collectors in Java 17: G1 (default), Parallel, ZGC, Shenandoah.", "viz": {"type": "chain", "items": ["Eden", "Survivor S0/S1", "Old generation"], "caption": "Object promotion"}}, {"h": "Requesting GC: System.gc()", "p": ["`System.gc()` and `Runtime.getRuntime().gc()` ask the JVM to run the collector. It is only a request. The JVM may ignore it. Do not use it in real programs. It is mostly for demos and tests.", "`Runtime` also helps you see memory use: `totalMemory()`, `freeMemory()` and `maxMemory()`."], "warn": "Never write logic that depends on GC running at a certain moment.", "code": {"f": "Main.java", "c": "public class Main {\n    public static void main(String[] args) {\n        Runtime rt = Runtime.getRuntime();\n        System.out.println(\"Max memory > 0 ? \" + (rt.maxMemory() > 0));\n        long before = rt.freeMemory();\n        System.gc();                       // only a request\n        System.out.println(\"gc requested\");\n    }\n}", "out": "Max memory > 0 ? true\ngc requested"}}, {"h": "finalize() method", "p": ["`finalize()` is a method of `Object`. The GC may call it once, just before it destroys an object, so the object can release resources. Its syntax is `protected void finalize() throws Throwable`.", "It is unreliable: there is no guarantee when, or even whether, it runs. It was deprecated in Java 9 and is marked for removal in newer versions. Do not use it in new code. The program below prints its line on most machines, but the output is not guaranteed."], "warn": "Exam answer: finalize() is called by GC before destruction, at most once per object, and is deprecated. It cannot be called to free memory.", "code": {"f": "Main.java", "c": "public class Main {\n    String name;\n    Main(String name) { this.name = name; }\n\n    @Override\n    protected void finalize() {\n        System.out.println(name + \" finalized\");\n    }\n\n    public static void main(String[] args) throws InterruptedException {\n        Main a = new Main(\"obj1\");\n        a = null;               // eligible\n        System.gc();            // request\n        Thread.sleep(500);      // give GC time\n        System.out.println(\"end of main\");\n    }\n}", "out": "obj1 finalized\nend of main"}}, {"h": "Better alternatives and summary", "p": ["For files, sockets and DB connections, close them yourself. The best tool is try-with-resources, which calls `close()` automatically, even if an exception occurs. For advanced cleanup Java offers `java.lang.ref.Cleaner`."], "tip": "Advantage: no manual memory management. Disadvantage: you cannot control when GC runs, and it uses some CPU.", "code": {"f": "Main.java", "c": "class Res implements AutoCloseable {\n    public void close() { System.out.println(\"Resource closed\"); }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        try (Res r = new Res()) {\n            System.out.println(\"using resource\");\n        }\n    }\n}", "out": "using resource\nResource closed"}}], "analogy": "A hotel housekeeping team cleans rooms after guests leave, without being asked. You never clean the room yourself. The garbage collector is the housekeeping team of your memory.", "hinglish": "Bhai Java mein memory khud free hoti hai, C jaisa free() nahi likhna padta. Jab kisi object ko koi reference point nahi karta to wo GC ke liye eligible ho jata hai. System.gc() sirf request hai, guarantee nahi. finalize() purana ho gaya, use mat karo.", "mistakes": ["Thinking null deletes the object immediately (it only makes it eligible)", "Believing System.gc() forces collection", "Relying on finalize() to close files or connections", "Thinking GC prevents all memory leaks (objects kept in a static list are still reachable)", "Confusing the heap (GC area) with the stack (freed automatically on method return)"], "remember": ["Garbage Collection = automatic freeing of unused objects in the heap", "Done by the Garbage Collector, a daemon thread of the JVM", "Object is eligible when no live reference points to it", "Ways: assign null, reassign reference, scope ends, anonymous object", "Phases: Mark -> Sweep -> Compact", "Heap: Young (Eden + Survivor) and Old generation", "Minor GC cleans Young, Major/Full GC cleans Old", "System.gc() / Runtime.gc() only request GC, no guarantee", "finalize() is called by GC before destroying an object, at most once", "finalize() is deprecated since Java 9, avoid it", "Use try-with-resources or Cleaner for resource cleanup", "Advantage: fewer memory leaks. Disadvantage: no control over timing", "Cyclic references are still collected if unreachable from roots"], "def": "Garbage Collection (GC) is the automatic process by which the JVM finds objects that are no longer used and frees their memory. The part of the JVM that does this job is called the Garbage Collector.", "uses": ["Automatic memory management in every Java program", "Avoiding manual free() calls and many memory leaks"], "pros": ["Fewer memory leaks and dangling-pointer bugs", "Developer does not manage memory manually"], "cons": ["You cannot control exactly when GC runs", "GC pauses can affect performance in large applications", "Memory leaks are still possible if you keep unnecessary references (for example in a static list)", "Relying on finalize() for cleanup"]}, "u1-t1": {"tldr": "Where Java came from (Gosling, Sun, 1995) and the buzzwords that make it special.", "sections": [{"h": "What is Java?", "p": ["Its main promise is simple: write the program once, and it runs on any device that has a Java Virtual Machine (JVM). This idea is called WORA - Write Once, Run Anywhere."], "pts": ["Created by James Gosling and his team at Sun Microsystems", "First public release: 1995 (Java 1.0 in January 1996)", "Owned by Oracle Corporation since 2010"], "tip": "Exam line: Java = simple + object-oriented + platform independent language developed by Sun Microsystems (now Oracle)."}, {"h": "History of Java - the timeline", "p": ["Java did not start as an internet language. It started as a plan to program small electronic devices like set-top boxes and TV remotes. These devices use many different chips, so the team needed a language that did not depend on one CPU."], "warn": "Exam trap: Java was NOT created for the internet first. It was created for consumer electronics (Green Project).", "table": {"head": ["Step", "What happens"], "rows": [["1. 1991 - Green Project", "Gosling, Mike Sheridan, Patrick Naughton start work at Sun"], ["2. 1991-92 - Oak", "New language named Oak (an oak tree outside Gosling's office)"], ["3. 1994 - Web boom", "Team sees the web needs a safe, portable language"], ["4. 1995 - Renamed Java", "Oak was already a trademark, so it became Java"], ["5. 1996 - JDK 1.0", "First official release, applets run in browsers"], ["6. 2010 - Oracle", "Oracle Corporation takes over Sun Microsystems"]]}}, {"h": "Why the name Java?", "p": ["The language was first called Oak. When the team tried to register it, they found that Oak Technologies already owned the name. A new name was needed.", "After a brainstorming session the team picked Java - a type of coffee (and an island in Indonesia). That is why the Java logo is a coffee cup."], "pts": ["Oak -> Green -> Java is the usual name sequence quoted in books", "Java is NOT an acronym", "Source files end with .java, compiled files with .class"]}, {"h": "Major versions and LTS releases", "p": ["Java keeps growing. Since Java 10 (2018) a new version comes every 6 months. Some versions are marked LTS (Long Term Support) and companies prefer them because they get u
