d has no body, just a semicolon. Every non-abstract child must implement it.", "Here `Shape` promises `area()`. `Circle` and `Rectangle` give the real formulas."], "tip": "You can create a reference of an abstract class (`Shape s`), but the object must be of a concrete child.", "code": {"f": "Main.java", "c": "abstract class Shape {\n    abstract double area();            // no body\n    void info() { System.out.println(\"I am a shape\"); }  // normal method\n}\nclass Circle extends Shape {\n    double r = 2;\n    double area() { return 3.14 * r * r; }\n}\nclass Rectangle extends Shape {\n    double l = 4, b = 5;\n    double area() { return l * b; }\n}\npublic class Main {\n    public static void main(String[] args) {\n        Shape s1 = new Circle();\n        Shape s2 = new Rectangle();\n        s1.info();\n        System.out.println(s1.area());\n        System.out.println(s2.area());\n        // Shape s = new Shape();  // compile error: abstract\n    }\n}", "out": "I am a shape\n12.56\n20.0"}, "viz": {"type": "tree", "root": "Shape (abstract)", "kids": ["Circle", "Rectangle"], "caption": "Children must implement area()"}}, {"h": "Rules of abstract classes and methods", "p": ["Remember these rules. Most exam questions come from here."], "pts": ["A class with even one abstract method must itself be declared `abstract`", "An abstract class may have zero abstract methods too", "Abstract method has no body and ends with `;`", "Abstract methods cannot be `private`, `static` or `final` (they must be overridable)", "A child must implement all abstract methods, or else be declared `abstract` itself", "`abstract` and `final` together on a class is illegal: final cannot be extended, abstract must be extended", "Object creation with `new` on an abstract class is a compile error"], "warn": "`abstract void f() { }` is an error. An abstract method cannot have a body, even empty braces."}, {"h": "What can an abstract class contain?", "p": ["An abstract class is almost a normal class. It can hold instance variables, constructors, normal methods, static methods and final methods. The constructor cannot be used with `new` directly, but it runs when a child object is created (constructor chaining with `super()`)."], "code": {"f": "Main.java", "c": "abstract class Vehicle {\n    String name;\n    Vehicle(String name) {\n        this.name = name;\n        System.out.println(\"Vehicle constructor\");\n    }\n    abstract void start();\n    static void rules() { System.out.println(\"Follow traffic rules\"); }\n}\nclass Bike extends Vehicle {\n    Bike(String n) { super(n); }\n    void start() { System.out.println(name + \" starts with kick\"); }\n}\npublic class Main {\n    public static void main(String[] args) {\n        Vehicle v = new Bike(\"Splendor\");\n        v.start();\n        Vehicle.rules();\n    }\n}", "out": "Vehicle constructor\nSplendor starts with kick\nFollow traffic rules"}, "table": {"head": ["Member", "Allowed?"], "rows": [["Abstract methods", "Yes"], ["Concrete methods", "Yes"], ["Constructors", "Yes (called by child)"], ["Instance variables", "Yes"], ["Static / final methods", "Yes"], ["Object creation", "No"]]}}, {"h": "Partial implementation: abstract extends abstract", "p": ["A child need not implement everything. If it implements only some abstract methods, it must also be `abstract`. The last concrete class in the chain must implement all remaining ones."], "tip": "This is how frameworks work: a half-built abstract class gives common code, you fill the remaining holes.", "code": {"f": "Main.java", "c": "abstract class Phone {\n    abstract void call();\n    abstract void camera();\n}\nabstract class BasicPhone extends Phone {\n    void call() { System.out.println(\"Calling...\"); }   // camera() still abstract\n}\nclass SmartPhone extends BasicPhone {\n    void camera() { System.out.println(\"Clicking photo\"); }\n}\npublic class Main {\n    public static void main(String[] args) {\n        SmartPhone p = new SmartPhone();\n        p.call();\n        p.camera();\n    }\n}", "out": "Calling...\nClicking photo"}}, {"h": "Real use: template of steps", "p": ["A common design: the parent has a normal method that fixes the order of steps, and leaves some steps abstract. Children only fill the steps. The parent code is written once and the flow cannot be broken (mark it `final`)."], "code": {"f": "Main.java", "c": "abstract class Game {\n    abstract void init();\n    abstract void play();\n    final void run() {          // fixed order\n        init();\n        play();\n        System.out.println(\"Game over\");\n    }\n}\nclass Chess extends Game {\n    void init() { System.out.println(\"Setting up board\"); }\n    void play() { System.out.println(\"Playing chess\"); }\n}\npublic class Main {\n    public static void main(String[] args) {\n        new Chess().run();\n    }\n}", "out": "Setting up board\nPlaying chess\nGame over"}}], "analogy": "You drive a car using steering, brake and accelerator. You never see or care how the engine burns fuel. The pedals are the abstract view; the engine is the hidden implementation.", "hinglish": "Bhai abstraction ka matlab hai andar ka kaam chhupao aur bahar sirf zaroori cheez dikhao. Abstract class ka object nahi ban sakta, wo sirf extend hone ke liye hoti hai. Abstract method ki body nahi hoti, child ko usse implement karna hi padta hai.", "mistakes": ["Writing a body (even `{}`) for an abstract method.", "Trying `new Shape()` for an abstract class: compile error.", "Declaring an abstract method `private` or `final`: it can never be overridden.", "Forgetting that an abstract class can have constructors.", "Child skipping one abstract method without being declared abstract."], "remember": ["Abstraction: hiding implementation details and showing only essential features.", "Achieved using abstract class (0-100%) and interface.", "Abstract class: declared with `abstract`; object cannot be created.", "Abstract method: only declaration, no body: `abstract void f();`", "A class having an abstract method must be abstract.", "Abstract class can have constructors, fields, concrete, static and final methods.", "Abstract class constructor runs through `super()` when child object is created.", "Child must override all abstract methods, otherwise it must be abstract too.", "Abstract methods cannot be private, static or final.", "`abstract` + `final` on a class is illegal.", "Reference of abstract type can point to child object (runtime polymorphism).", "Abstract class may have no abstract method at all."], "def": "Abstraction means hiding the internal details and showing only what the user needs. It answers WHAT an object does, not HOW it does it.", "uses": ["Defining a common base with shared code and a required contract (Shape, Employee, Vehicle)", "Template Method pattern: the parent fixes the steps, children fill them in"], "pros": ["Hides complexity from the user", "Shares common code between subclasses", "Forces subclasses to follow a standard structure"], "cons": ["Trying to instantiate an abstract class", "Forgetting to implement all abstract methods in a concrete child", "A class can extend only one abstract class"]}, "u3-t8": {"tldr": "An interface is a contract of methods that a class promises to implement.", "sections": [{"h": "What is an interface and why use it?", "p": ["We use interfaces when unrelated classes need the same ability (for example `Bird` and `Aeroplane` can both `fly()`), and because Java allows a class to implement many interfaces, which gives multiple inheritance of type."], "pts": ["100% abstraction of behaviour (for abstract methods)", "Loose coupling: code talks to the interface, not the class", "Multiple inheritance in Java is done through interfaces", "Base of many Java APIs: `List`, `Comparable`, `Runnable`"], "viz": {"type": "chain", "items": ["interface (contract)", "class implements it", "object used via interface"], "caption": "Contract -> implementation -> usage"}}, {"h": "Declaring and implementing an interface", "p": ["Declare with `interface`. Methods without a body are automatically `public abstract`. A class uses `implements` and must define every abstract method, and the method must be written `public` (you cannot reduce visibility)."], "pts": ["Interface cannot be instantiated and has no constructor", "Abstract methods are implicitly `public abstract`", "Implementing class must override all of them, or be `abstract`", "Implemented methods must be `public`"], "warn": "Writing `void sound() {...}` in the class (without `public`) gives a compile error: weaker access privileges.", "code": {"f": "Main.java", "c": "interface Animal {\n    void sound();          // public abstract by default\n    void eat();\n}\nclass Dog implements Animal {\n    public void sound() { System.out.println(\"Dog barks\"); }\n    public void eat()   { System.out.println(\"Dog eats bone\"); }\n}\npublic class Main {\n    public static void main(String[] args) {\n        Animal a = new Dog();   // interface reference\n        a.sound();\n        a.eat();\n    }\n}", "out": "Dog barks\nDog eats bone"}}, {"h": "Constants in an interface", "p": ["Every variable in an interface is automatically `public static final`. So it is a constant. It must be given a value at declaration and cannot change later. Access it with the interface name."], "code": {"f": "Main.java", "c": "interface Config {\n    int MAX_USERS = 100;          // public static final\n    String APP = \"LabApp\";\n}\nclass Server implements Config {\n    void show() { System.out.println(APP + \" allows \" + MAX_USERS); }\n}\npublic class Main {\n    public static void main(String[] args) {\n        new Server().show();\n        System.out.println(Config.MAX_USERS);\n        // Config.MAX_USERS = 5;   // error: cannot assign a value to final variable\n    }\n}", "out": "LabApp allows 100\n100"}}, {"h": "Multiple interface implementation", "p": ["A class can implement many interfaces, separated by commas. It must implement the methods of all of them. This is how Java gets multiple inheritance without the diamond problem of classes."], "tip": "A class can extend one class AND implement many interfaces: `class A extends B implements X, Y`. Write `extends` first.", "code": {"f": "Main.java", "c": "interface Printable { void print(); }\ninterface Scannable { void scan(); }\nclass Machine implements Printable, Scannable {\n    public void print() { System.out.println(\"Printing\"); }\n    public void scan()  { System.out.println(\"Scanning\"); }\n}\npublic class Main {\n    public static void main(String[] args) {\n        Machine m = new Machine();\n        m.print();\n        m.scan();\n        Printable p = m;   // same object, different views\n        p.print();\n    }\n}", "out": "Printing\nScanning\nPrinting"}, "viz": {"type": "merge", "parents": ["Printable", "Scannable"], "child": "Machine", "bad": false, "caption": "One class, two interfaces"}}, {"h": "Interface extending interface", "p": ["An interface can extend one or more interfaces using `extends` (not `implements`). The class that implements the child interface must implement all methods from the whole chain."], "code": {"f": "Main.java", "c": "interface Shape { void draw(); }\ninterface Colored extends Shape { void fill(); }\nclass Square implements Colored {\n    public void draw() { System.out.println(\"Draw square\"); }\n    public void fill() { System.out.println(\"Fill red\"); }\n}\npublic class Main {\n    public static void main(String[] args) {\n        Colored c = new Square();\n        c.draw();\n        c.fill();\n    }\n}", "out": "Draw square\nFill red"}}, {"h": "Default methods (Java 8)", "p": ["Earlier, adding a method to an interface broke every class that implemented it. Java 8 added `default` methods: a method with a body inside the interface. Implementing classes get it for free and may override it.", "If a class implements two interfaces having the same default method, the compiler forces the class to override it. Inside it you can pick one with `Interface.super.method()`."], "warn": "Two same default methods from two interfaces and no override in the class = compile error.", "code": {"f": "Main.java", "c": "interface A { default void hello() { System.out.println(\"Hello from A\"); } }\ninterface B { default void hello() { System.out.println(\"Hello from B\"); } }\nclass C implements A, B {\n    public void hello() {            // must override: conflict\n        A.super.hello();             // choose A's version\n        System.out.println(\"and C\");\n    }\n}\npublic class Main {\n    public static void main(String[] args) {\n        new C().hello();\n    }\n}", "out": "Hello from A\nand C"}}, {"h": "Static methods (Java 8)", "p": ["An interface can have `static` methods with a body. They belong to the interface, are not inherited, and are called as `InterfaceName.method()`. They are used for utility helpers related to the interface."], "code": {"f": "Main.java", "c": "interface MathUtil {\n    static int square(int x) { return x * x; }\n}\nclass Calc implements MathUtil { }\npublic class Main {\n    public static void main(String[] args) {\n        System.out.println(MathUtil.square(6));\n        // new Calc().square(6);   // error: not inherited\n        // Calc.square(6);         // error too\n    }\n}", "out": "36"}}, {"h": "Private methods (Java 9)", "p": ["Java 9 allows `private` (and private static) methods in an interface. They hold shared code used by default or static methods, so you do not repeat it. They are not visible to implementing classes."], "code": {"f": "Main.java", "c": "interface Logger {\n    default void info(String m)  { log(\"INFO\", m); }\n    default void error(String m) { log(\"ERROR\", m); }\n    private void log(String level, String m) {\n        System.out.println(\"[\" + level + \"] \" + m);\n    }\n}\nclass App implements Logger { }\npublic class Main {\n    public static void main(String[] args) {\n        App a = new App();\n        a.info(\"Started\");\n        a.error(\"Crashed\");\n    }\n}", "out": "[INFO] Started\n[ERROR] Crashed"}, "table": {"head": ["Method type", "Body?", "Since", "Visible to class?"], "rows": [["abstract", "No", "Always", "Yes (must implement)"], ["default", "Yes", "Java 8", "Yes (can override)"], ["static", "Yes", "Java 8", "No (use interface name)"], ["private", "Yes", "Java 9", "No (helper only)"]]}}, {"h": "Functional interface (intro)", "p": ["An interface with exactly ONE abstract method is a functional interface. Default and static methods do not count. Such an interface can be implemented in one line using a lambda expression. Mark it with `@FunctionalInterface` so the compiler checks it. Examples in Java: `Runnable`, `Comparator`, `Predicate`."], "tip": "Lambda `(n) -> ...` is just a short way to write the body of that single abstract method.", "code": {"f": "Main.java", "c": "@FunctionalInterface\ninterface Greeting {\n    void say(String name);     // only one abstract method\n}\npublic class Main {\n    public static void main(String[] args) {\n        Greeting g = (n) -> System.out.println(\"Hello, \" + n);\n        g.say(\"Keshav\");\n    }\n}", "out": "Hello, Keshav"}}], "analogy": "A driving licence rule says anyone who drives must follow the traffic rules. It does not tell how each person drives. An interface is that rule; each class drives in its own way.", "hinglish": "Bhai interface ek contract hai: jo class `implements` karegi, usse saare methods banane hi padenge. Variables automatically constant hote hain. Ek class kitne bhi interface implement kar sakti hai, isliye Java me multiple inheritance interface se hota hai. Java 8 se default aur static methods bhi aa gaye.", "mistakes": ["Implementing an interface method without `public`.", "Trying to change an interface variable: it is final.", "Calling an interface static method through an object or implementing class.", "Ignoring the conflict when two interfaces have the same default method.", "Using `implements` between two interfaces instead of `extends`."], "remember": ["Interface: a contract; declared using `interface`; implemented using `implements`.", "Cannot create object of an interface; no constructors.", "Methods are implicitly `public abstract` (unless default/static/private).", "Variables are implicitly `public static final` (constants).", "Implementing class must define all abstract methods as `public`, or be abstract.", "A class can implement multiple interfaces: `class A implements X, Y`.", "An interface extends other interfaces using `extends` (can extend many).", "Default method (Java 8): has a body, inherited, can be overridden.", "Same default method in two interfaces: class must override; use `X.super.m()`.", "Static method (Java 8): called with interface name, not inherited.", "Private method (Java 9): helper for default/static methods.", "Functional interface: exactly one abstract method; use `@FunctionalInterface` and lambda."], "def": "An interface is a contract. It lists what methods a class must have, but (mostly) not how they work. Any class that signs the contract with `implements` must provide those methods.", "uses": ["Defining capabilities (Runnable, Comparable, Serializable)", "Loose coupling: code depends on the interface, not on one concrete class", "Writing flexible APIs such as the Collections Framework (List, Set, Map)"], "pros": ["Full abstraction and loose coupling", "Multiple inheritance of behaviour", "Makes code easy to test and swap implementations"], "cons": ["Forgetting to make the implemented method public", "Not implementing all abstract methods (class must then be abstract)", "Adding a new abstract method breaks all existing implementers (default methods help here)"]}, "u3-t9": {"tldr": "Abstract class shares code and state; interface defines a contract. Know when to pick which.", "sections": [{"h": "Why compare them?", "p": [], "pts": ["Abstract class: 'what you ARE' plus some shared code and data", "Interface: 'what you CAN DO', a capability", "They can be used together in one design"]}, {"h": "Side-by-side comparison", "p": ["Learn this table well. It is the most asked question in exams."], "table": {"head": ["Feature", "Abstract class", "Interface"], "rows": [["Keyword", "abstract class", "interface"], ["Methods", "Abstract + concrete", "Abstract, default, static"], ["Variables", "Any type (instance, static)", "Only public static final"], ["Constructor", "Yes", "No"], ["Inherit with", "extends (only one)", "implements (many)"], ["Access modifiers", "Any", "Public (private from 9)"], ["Object creation", "No", "No"], ["State (fields)", "Can keep state", "No instance state"], ["Final methods", "Allowed", "Not allowed"], ["Relation", "IS-A, related classes", "CAN-DO, unrelated classes"]]}}, {"h": "Difference 1: state and constructor", "p": ["An abstract class can keep instance variables and has a constructor, so it can store common data. An interface cannot. Its variables are constants only."], "code": {"f": "Main.java", "c": "abstract class Employee {\n    String name;\n    Employee(String name) { this.name = name; }   // state + constructor\n    abstract double salary();\n}\nclass Manager extends Employee {\n    Manager(String n) { super(n); }\n    double salary() { return 90000; }\n}\ninterface Payable {\n    int TAX = 10;            // constant only, no instance state\n    double pay();\n}\npublic class Main {\n    public static void main(String[] args) {\n        Employee e = new Manager(\"Ravi\");\n        System.out.println(e.name + \" earns \" + e.salary());\n        System.out.println(\"Tax % = \" + Payable.TAX);\n    }\n}", "out": "Ravi earns 90000.0\nTax % = 10"}}, {"h": "Difference 2: multiple inheritance", "p": ["A class can extend only one abstract class but can implement any number of interfaces. So if a class needs many abilities, use interfaces."], "code": {"f": "Main.java", "c": "abstract class Animal { abstract void eat(); }\ninterface Swimmer { void swim(); }\ninterface Walker  { void walk(); }\nclass Duck extends Animal implements Swimmer, Walker {\n    void eat() { System.out.println(\"Duck eats\"); }\n    public void swim() { System.out.println(\"Duck swims\"); }\n    public void walk() { System.out.println(\"Duck walks\"); }\n}\npublic class Main {\n    public static void main(String[] args) {\n        Duck d = new Duck();\n        d.eat(); d.swim(); d.walk();\n    }\n}", "out": "Duck eats\nDuck swims\nDuck walks"}, "viz": {"type": "merge", "parents": ["Abstract class (only 1)", "Interface 1, Interface 2"], "child": "Concrete class", "bad": false, "caption": "extends one, implements many"}}, {"h": "Using both together", "p": ["A popular design: define the contract as an interface, then give an abstract class that implements part of it. Concrete classes extend the abstract class and fill the rest. The Java library does this (`List` interface and `AbstractList` class)."], "code": {"f": "Main.java", "c": "interface Vehicle {\n    void start();\n    void stop();\n}\nabstract class BaseVehicle implements Vehicle {\n    public void stop() { System.out.println(\"Stopped\"); }   // common code\n}\nclass Car extends BaseVehicle {\n    public void start() { System.out.println(\"Car started\"); }\n}\npublic class Main {\n    public static void main(String[] args) {\n        Vehicle v = new Car();\n        v.start();\n        v.stop();\n    }\n}", "out": "Car started\nStopped"}}, {"h": "Which one should I use?", "p": ["Ask these questions in order."], "tip": "Rule of thumb: prefer an interface. Pick an abstract class only when you must share state or a constructor.", "table": {"head": ["Step", "What happens"], "rows": [["1. Shared fields/constructor?", "Yes: abstract class"], ["2. Already extends a class?", "Yes: use interface"], ["3. Unrelated classes, same skill?", "Yes: interface"], ["4. Need lambda style?", "Yes: interface"], ["5. Add methods later safely?", "Interface with default method"]]}}, {"h": "Since Java 8, are they the same?", "p": ["Default methods let interfaces hold code, so they look closer to abstract classes. But a big gap remains: interfaces still have no instance fields, no constructors and no protected members. Also a class can extend only one abstract class."], "pts": ["Interface: stateless behaviour sharing", "Abstract class: state + behaviour sharing", "Default methods exist mainly to evolve old interfaces without breaking code"]}], "analogy": "An abstract class is a half-built house: walls exist, you finish the rooms. An interface is a checklist of rooms the house must have, with no walls built at all.", "hinglish": "Bhai short me: abstract class me data aur constructor ho sakta hai, par ek hi extend kar sakte ho. Interface me sirf contract aur constants, par kitne bhi implement kar sakte ho. Related classes ke liye abstract class lo, alag alag classes ki ability ke liye interface.", "mistakes": ["Saying an interface can have a constructor.", "Saying a class can extend two abstract classes.", "Thinking Java 8 default methods make interface identical to abstract class.", "Forgetting `public` when implementing interface methods but not for abstract class methods."], "remember": ["Both abstract class and interface cannot be instantiated.", "Abstract class: `extends`, single; interface: `implements`, multiple.", "Abstract class can have constructors and instance variables; interface cannot.", "Interface variables are always `public static final`.", "Abstract class methods: abstract + concrete; interface: abstract, default, static, private.", "Abstract class members can have any access modifier; interface methods are public.", "Abstract class gives partial abstraction; interface gives (almost) full abstraction.", "Use abstract class for IS-A with shared code/state; interface for CAN-DO capability.", "A class can extend one class and implement many interfaces together.", "Interfaces are used for lambdas (functional interfaces); abstract classes are not.", "Abstract class can implement an interface without defining all its methods.", "Interface supports multiple inheritance of type in Java."], "def": "Both give abstraction and neither can be instantiated. Both can hold abstract methods that children must implement. So students often mix them up. The difference is in purpose: an abstract class is a partly-built parent, an interface is a pure contract.", "uses": ["Abstract class: base classes such as Shape or Employee with common fields", "Interface: abilities like Flyable, Comparable, Runnable"], "pros": ["Choosing correctly gives a clean, flexible design"], "cons": ["Using an abstract class when you only need a contract, which blocks other inheritance", "Thinking interfaces cannot have any code (default methods exist since Java 8)"]}, "u3-t10": {"tldr": "IS-A uses inheritance; HAS-A holds another object as a field (association, aggregation, composition).", "sections": [{"h": "Relationships between classes", "p": [], "viz": {"type": "tree", "root": "Class relationships", "kids": ["IS-A (Inheritance)", "HAS-A: Association", "HAS-A: Aggregation", "HAS-A: Composition"], "caption": "Four ideas to learn"}}, {"h": "IS-A: inheritance", "p": ["IS-A means one class is a special type of another. It is built with `extends` (class) or `implements` (interface). A `Dog` IS-A `Animal`, so a Dog object can be used wherever an Animal is expected.", "Test: say 'X is a Y'. If it sounds right in the real world, use inheritance. 'Car is a Vehicle' is fine."], "tip": "`instanceof` is the Java way to check an IS-A relation at runtime.", "code": {"f": "Main.java", "c": "class Vehicle {\n    void move() { System.out.println(\"Vehicle moves\"); }\n}\nclass Car extends Vehicle {\n    void honk() { System.out.println(\"Car honks\"); }\n}\npublic class Main {\n    public static void main(String[] args) {\n        Car c = new Car();\n        c.move();                     // inherited\n        c.honk();\n        Vehicle v = c;                // Car IS-A Vehicle\n        System.out.println(v instanceof Car);\n    }\n}", "out": "Vehicle moves\nCar honks\ntrue"}, "viz": {"type": "tree", "root": "Vehicle", "kids": ["Car", "Bike"], "caption": "Car IS-A Vehicle"}}, {"h": "HAS-A: the basic idea", "p": ["HAS-A means a class holds a reference to an object of another class as a field. No `extends`. The outer class reuses the inner one by delegating work to it. We say `Car HAS-A Engine`.", "HAS-A has no keyword. It is just an instance variable. Its strength decides if it is association, aggregation or composition."], "table": {"head": ["Type", "Strength", "Lifetime", "Example"], "rows": [["Association", "Weakest, just uses", "Independent", "Teacher - Student"], ["Aggregation", "Weak whole-part", "Part lives alone", "Department - Teacher"], ["Composition", "Strong whole-part", "Part dies with whole", "House - Room"]]}}, {"h": "Association", "p": ["Association is a general 'uses' or 'knows' relation between two independent classes. Both objects have their own life. It can be one-to-one, one-to-many, many-to-one or many-to-many. Neither class owns the other."], "code": {"f": "Main.java", "c": "class Student {\n    String name;\n    Student(String name) { this.name = name; }\n}\nclass Teacher {\n    String name;\n    Teacher(String name) { this.name = name; }\n    void teach(Student s) {                    // only uses the student\n        System.out.println(name + \" teaches \" + s.name);\n    }\n}\npublic class Main {\n    public static void main(String[] args) {\n        Student s = new Student(\"Amit\");\n        Teacher t = new Teacher(\"Mr. Sharma\");\n        t.teach(s);\n    }\n}", "out": "Mr. Sharma teaches Amit"}, "viz": {"type": "chain", "items": ["Teacher", "teaches", "Student"], "caption": "Both live independently"}}, {"h": "Aggregation (weak HAS-A)", "p": ["Aggregation is a whole-part relation where the part can exist without the whole. The part object is created outside and passed in. If the whole is deleted, the part stays alive. A `Department` has `Teacher`s, but if the department closes, the teachers still exist."], "tip": "Clue: part comes through the constructor or a setter (injected from outside).", "code": {"f": "Main.java", "c": "class Teacher {\n    String name;\n    Teacher(String name) { this.name = name; }\n}\nclass Department {\n    Teacher head;                              // HAS-A, passed in\n    Department(Teacher head) { this.head = head; }\n    void show() { System.out.println(\"Head: \" + head.name); }\n}\npublic class Main {\n    public static void main(String[] args) {\n        Teacher t = new Teacher(\"Dr. Rao\");    // exists on its own\n        Department d = new Department(t);\n        d.show();\n        d = null;                              // department gone\n        System.out.println(t.name + \" still exists\");\n    }\n}", "out": "Head: Dr. Rao\nDr. Rao still exists"}, "viz": {"type": "chain", "items": ["Teacher created outside", "passed to Department", "Department removed", "Teacher still alive"], "caption": "Part outlives whole"}}, {"h": "Composition (strong HAS-A)", "p": ["Composition is the strongest whole-part relation. The whole creates and owns the part, and the part cannot live without the whole. When the whole dies, the parts die too. A `House` has `Room`s. No house, no rooms."], "tip": "Clue: the whole uses `new Part()` itself and never hands the part out.", "code": {"f": "Main.java", "c": "class Room {\n    String type;\n    Room(String type) { this.type = type; }\n}\nclass House {\n    private final Room bedroom = new Room(\"Bedroom\");   // created inside\n    private final Room kitchen;\n    House() { kitchen = new Room(\"Kitchen\"); }\n    void show() {\n        System.out.println(\"House has \" + bedroom.type + \" and \" + kitchen.type);\n    }\n}\npublic class Main {\n    public static void main(String[] args) {\n        House h = new House();\n        h.show();\n    }\n}", "out": "House has Bedroom and Kitchen"}, "viz": {"type": "chain", "items": ["House created", "Room created inside", "House destroyed", "Room destroyed too"], "caption": "Part dies with whole"}}, {"h": "Aggregation vs composition", "p": ["Both are HAS-A. The only real question is: who controls the lifetime of the part?"], "table": {"head": ["Point", "Aggregation", "Composition"], "rows": [["Strength", "Weak", "Strong"], ["Part created", "Outside, passed in", "Inside the whole"], ["Part without whole", "Can exist", "Cannot exist"], ["Ownership", "Shared", "Exclusive"], ["Example", "Library - Book", "Human - Heart"]]}}, {"h": "IS-A vs HAS-A: which to choose?", "p": ["Use inheritance only for a true IS-A. Otherwise use HAS-A. A famous advice is 'favour composition over inheritance'. Inheritance ties the child tightly to the parent, and a change in the parent can break the child. Composition is loose and flexible: you can even swap the part at runtime.", "Wrong design: `class Car extends Engine`. A car is not an engine. Right design: Car HAS-A Engine."], "code": {"f": "Main.java", "c": "class Engine {\n    void start() { System.out.println(\"Engine started\"); }\n}\nclass Car {\n    private Engine engine = new Engine();      // HAS-A\n    void drive() {\n        engine.start();                        // delegate\n        System.out.println(\"Car is moving\");\n    }\n}\npublic class Main {\n    public static void main(String[] args) {\n        new Car().drive();\n    }\n}", "out": "Engine started\nCar is moving"}, "table": {"head": ["Aspect", "IS-A (inheritance)", "HAS-A (composition)"], "rows": [["Keyword", "extends / implements", "Object as a field"], ["Meaning", "Is a type of", "Contains / uses"], ["Coupling", "Tight", "Loose"], ["Reuse", "Whole parent API", "Only needed methods"], ["Runtime change", "No", "Yes (swap the part)"], ["Example", "Dog - Animal", "Car - Engine"]]}}], "analogy": "A dog IS an animal (type). A car HAS an engine (part). You would never say a car is an engine, and you would never say a dog has an animal.", "hinglish": "Bhai simple test: \"X is a Y\" sahi lage to inheritance, \"X has a Y\" sahi lage to object ko field bana do. HAS-A me teen levels: association (bas use karta hai), aggregation (part alag se bhi zinda reh sakta hai), composition (whole khatam to part bhi khatam). Zyada tar jagah composition behtar hota hai.", "mistakes": ["Using `extends` just to reuse code when there is no real IS-A (like `Car extends Engine`).", "Confusing aggregation with composition: ask who controls the part's lifetime.", "Thinking HAS-A needs a keyword. It is only a field.", "Calling a HAS-A relation 'inheritance'. A field of another class is HAS-A, not IS-A, even if you use its methods."], "remember": ["IS-A: inheritance, implemented with `extends` or `implements`.", "Test for IS-A: \"X is a Y\" must make sense.", "HAS-A: a class holds a reference to another class as an instance variable.", "Association: general \"uses\" relation; both objects independent.", "Aggregation: weak HAS-A; part can exist without whole (Department - Teacher).", "Composition: strong HAS-A; part cannot exist without whole (House - Room).", "In composition the whole creates the part; in aggregation the part comes from outside.", "Inheritance gives tight coupling; composition gives loose coupling.", "Composition lets you change behaviour at runtime by swapping the part.", "Best practice: favour composition over inheritance.", "`instanceof` checks an IS-A relation at runtime.", "Aggregation and composition are special forms of association."], "def": "Real programs have many classes, and they relate to each other. Two big ideas: IS-A (a class is a type of another class) and HAS-A (a class uses or holds another class). HAS-A has three levels of strength: association, aggregation and composition.", "uses": ["Designing class relationships in real projects", "UML diagrams and design discussions"], "pros": ["Composition is flexible and easy to change", "Inheritance gives reuse when the relationship is truly IS-A"], "cons": ["Using inheritance only to reuse code even when IS-A is false (for example Stack extends ArrayList)", "Confusing aggregation and composition"]}, "u3-t11": {"tldr": "Encapsulation wraps data and methods in a class and hides the data behind private fields and getters/setters.", "sections": [{"h": "What is encapsulation?", "p": ["It is also called data hiding. A fully encapsulated class has all fields `private` and public getters and setters."], "table": {"head": ["class Student"], "rows": [["private int id"], ["private String name"], ["public getId() / setId()"], ["public getName() / setName()"]]}}, {"h": "Why do we need it?", "p": ["Imagine `account.balance = -5000;` written by any programmer anywhere. With public fields nothing stops it. With encapsulation the class decides what is valid."], "pts": ["Data security: fields are hidden from outside", "Control: validate values in setters before saving", "Flexibility: change internal code without breaking users", "Maintainability: all rules for the data live in one place", "Read-only or write-only fields are possible", "Easy testing and reuse"]}, {"h": "How to achieve it: three steps", "p": ["Follow this recipe for every class."], "table": {"head": ["Step", "What happens"], "rows": [["1. Make fields private", "No direct access from outside"], ["2. Add public getters", "To read the value"], ["3. Add public setters", "To change it, with validation"]]}}, {"h": "Getters and setters in action", "p": ["A getter returns a field, usually named `getX()` (`isX()` for boolean). A setter changes it, named `setX(value)`. We use `this` to separate the field from the parameter."], "code": {"f": "Main.java", "c": "class Student {\n    private int id;\n    private String name;\n    public int getId() { return id; }\n    public void setId(int id) { this.id = id; }\n    public String getName() { return name; }\n    public void setName(String name) { this.name = name; }\n}\npublic class Main {\n    public static void main(String[] args) {\n        Student s = new Student();\n        s.setId(101);\n        s.setName(\"Neha\");\n        System.out.println(s.getId() + \" \" + s.getName());\n        // s.id = 5;   // compile error: id has private access\n    }\n}", "out": "101 Neha"}}, {"h": "Validation: the real power", "p": ["The main benefit of setters is control. We can reject bad data. The outside world cannot bypass the check because the field is private."], "tip": "Notice there is no `setBalance()`. Balance changes only through safe operations.", "code": {"f": "Main.java", "c": "class Account {\n    private double balance;\n    public void deposit(double amt) {\n        if (amt > 0) balance += amt;\n        else System.out.println(\"Invalid amount\");\n    }\n    public boolean withdraw(double amt) {\n        if (amt > 0 && amt <= balance) { balance -= amt; return true; }\n        return false;\n    }\n    public double getBalance() { return balance; }\n}\npublic class Main {\n    public static void main(String[] args) {\n        Account a = new Account();\n        a.deposit(1000);\n        a.deposit(-50);\n        System.out.println(a.withdraw(5000));\n        System.out.println(a.withdraw(300));\n        System.out.println(a.getBalance());\n    }\n}", "out": "Invalid amount\nfalse\ntrue\n700.0"}}, {"h": "Read-only and write-only classes", "p": ["Providing only a getter makes a field read-only. Providing only a setter makes it write-only. An immutable class sets values only in the constructor, has no setters, and uses `final` fields. `String` is a famous immutable class."], "code": {"f": "Main.java", "c": "final class Point {\n    private final int x, y;            // set once\n    Point(int x, int y) { this.x = x; this.y = y; }\n    public int getX() { return x; }    // getters only: read-only\n    public int getY() { return y; }\n}\npublic class Main {\n    public static void main(String[] args) {\n        Point p = new Point(3, 4);\n        System.out.println(p.getX() + \",\" + p.getY());\n    }\n}", "out": "3,4"}}, {"h": "Access modifiers: the tool behind it", "p": ["Encapsulation is built on access modifiers. They decide who can see a member."], "warn": "Making fields `public` and also adding getters/setters is not encapsulation. The fields must be private.", "table": {"head": ["Modifier", "Same class", "Same package", "Subclass", "Everywhere"], "rows": [["private", "Yes", "No", "No", "No"], ["default", "Yes", "Yes", "Only same pkg", "No"], ["protected", "Yes", "Yes", "Yes", "No"], ["public", "Yes", "Yes", "Yes", "Yes"]]}}, {"h": "Encapsulation vs abstraction", "p": ["Students confuse these two. Abstraction is about design: hide complexity and show only what is needed. Encapsulation is about implementation: bind data with methods and restrict access."], "table": {"head": ["Point", "Abstraction", "Encapsulation"], "rows": [["Focus", "What to show", "How to protect data"], ["Achieved by", "Abstract class, interface", "Private fields + get/set"], ["Level", "Design level", "Implementation level"], ["Solves", "Complexity", "Security / misuse"], ["Example", "ATM screen", "Balance hidden in account"]]}}, {"h": "Advantages and disadvantages", "p": ["Advantages: security, validation, flexibility, reusability and easy maintenance. Disadvantages: more code (getters and setters), and slightly more calls, which makes classes longer. Modern IDEs and Java 16 `record` reduce the boilerplate."], "pts": ["Pro: hides data and protects integrity", "Pro: internal change does not affect users", "Con: extra boilerplate code", "Con: too many setters can still break the idea; expose only what is needed"]}], "analogy": "A medicine capsule keeps the powder safe inside a shell. You take the whole capsule, not the powder. A class keeps its data inside and lets you use it only through methods.", "hinglish": "Bhai encapsulation matlab data ko class ke andar private karke rakhna aur bahar se sirf getter-setter se access dena. Isse koi galat value (jaise negative balance) seedhe nahi daal sakta, kyunki setter me check laga sakte ho.", "mistakes": ["Making fields public and calling it encapsulation.", "Adding a setter for every field blindly, even when it should be read-only.", "Forgetting `this.id = id` in a setter, which assigns the parameter to itself and leaves the field unchanged.", "Returning a mutable internal object (like an array) from a getter, which leaks the data.", "Mixing up encapsulation with abstraction in exam answers."], "remember": ["Encapsulation: wrapping data and methods into a single unit (class).", "Also called data hiding.", "Make instance variables `private`; provide `public` getters and setters.", "Getter: `getX()` returns value (`isX()` for boolean). Setter: `setX(v)` updates value.", "Setters can validate input before assigning.", "Only getter = read-only; only setter = write-only.", "Immutable class: final fields, no setters, set in constructor (like `String`).", "Access modifiers: private < default < protected < public.", "Private members are accessible only inside the same class.", "Benefits: security, flexibility, maintainability, reusability.", "Encapsulation (implementation, hides data) is different from abstraction (design, hides complexity).", "A fully encapsulated class has all fields private."], "def": "Encapsulation means wrapping data (variables) and the code that works on it (methods) into one unit, a class. It also means protecting the data: outside code cannot touch the variables directly. It must go through methods.", "uses": ["Protecting sensitive data such as passwords and balances", "Keeping the freedom to change internal implementation without breaking other code"], "pros": ["Data security and integrity", "Flexibility and easy maintenance", "Controlled access with validation", "Reusability and testability"], "cons": ["Making fields public and calling it encapsulation", "Writing getters and setters for everything without thinking, which exposes internals anyway", "Slightly more code than using public fields"]}, "u3-t12": {"tldr": "Packages group related classes into folders; CLASSPATH tells Java where to find them.", "sections": [{"h": "What is a package and why use it?", "p": [], "pts": ["Organises big projects into logical groups", "Avoids name conflicts", "Access protection: `default` and `protected` members depend on the package", "Easy to find and reuse classes", "Package name must match the folder structure"], "viz": {"type": "tree", "root": "Java packages", "kids": ["Built-in (java.util, java.io)", "User-defined (mypack)"], "caption": "Two kinds of packages"}}, {"h": "Built-in packages", "p": ["Java ships with a huge library grouped into packages. Names start with `java.` or `javax.`. You use them by importing. Only `java.lang` is imported automatically, so `String`, `System`, `Math` need no import."], "code": {"f": "Main.java", "c": "import java.util.ArrayList;\n\npublic class Main {\n    public static void main(String[] args) {\n        ArrayList<String> list = new ArrayList<>();   // java.util\n        list.add(\"Java\");\n        list.add(\"OOP\");\n        System.out.println(list);\n        System.out.println(Math.max(4, 9));           // java.lang, no import\n    }\n}", "out": "[Java, OOP]\n9"}, "table": {"head": ["Package", "Contains", "Example classes"], "rows": [["java.lang", "Core (auto-imported)", "String, Math, Object, Thread"], ["java.util", "Collections, utilities", "ArrayList, HashMap, Scanner"], ["java.io", "Input / output", "File, BufferedReader"], ["java.net", "Networking", "URL, Socket"], ["java.sql", "Database (JDBC)", "Connection, Statement"], ["java.time", "Date and time", "LocalDate, Duration"]]}}, {"h": "User-defined packages: creating one", "p": ["You create a package by writing `package name;` as the very first statement of the file (before imports). Save the file in a folder with the same name. Classes meant for use from other packages must be `public`."], "pts": ["Only one package statement per file, and it comes first", "Package names are lowercase by convention", "Real projects use reverse domain names: `com.company.project`", "`com.acme.util` means folders `com/acme/util/`"], "code": {"f": "Calculator.java", "c": "package mypack;          // must be the first line\n\npublic class Calculator {\n    public int add(int a, int b) { return a + b; }\n}"}, "table": {"head": ["Folder structure"], "rows": [["project/"], ["  mypack/"], ["    Calculator.class"], ["  Main.class"]]}}, {"h": "Importing packages", "p": ["To use a class from another package, import it or write its full name. Three ways:"], "pts": ["Single class: `import mypack.Calculator;`", "Whole package: `import mypack.*;` (classes only, not sub-packages)", "Fully qualified name: `mypack.Calculator c = new mypack.Calculator();` (no import needed)", "Static import: `import static java.lang.Math.*;` to use members without class name"], "warn": "`import java.util.*;` does NOT import `java.util.function` or other sub-packages. Also `import` goes after `package` and before the class.", "code": {"f": "Main.java", "c": "import static java.lang.Math.sqrt;       // static import\nimport java.util.*;                      // wildcard\n\npublic class Main {\n    public static void main(String[] args) {\n        List<Integer> nums = new ArrayList<>();\n        nums.add(16);\n        System.out.println(sqrt(nums.get(0)));\n        java.util.Date d = new java.util.Date();   // fully qualified\n        System.out.println(d.getClass().getName());\n    }\n}", "out": "4.0\njava.util.Date"}}, {"h": "Using the package: Main class", "p": ["Now use `Calculator` from another file. Main stays in the default package here."], "tip": "If two imported packages have the same class name (like `Date`), use the full name for at least one of them.", "code": {"f": "Main.java", "c": "import mypack.Calculator;     // import a specific class\n\npublic class Main {\n    public static void main(String[] args) {\n        Calculator c = new Calculator();\n        System.out.println(c.add(5, 3));\n    }\n}"}}, {"h": "Compile and run commands", "p": ["The `-d` option tells `javac` where to place the output. `-d .` means current folder, and javac creates the package folders (`mypack/`) automatically and puts `Calculator.class` inside. Run the class with its full package name if it is inside a package."], "code": {"f": "terminal", "c": "javac -d . Calculator.java     # creates mypack/Calculator.class\njavac Main.java                # Main imports mypack.Calculator\njava Main                      # prints 8\n\n# If Main itself is in a package (package app;)\njavac -d . Main.java\njava app.Main                  # use full name, run from the parent folder"}, "table": {"head": ["Step", "What happens"], "rows": [["1. Write package line", "package mypack; first line"], ["2. javac -d .", "Creates folder + .class"], ["3. Import in other class", "import mypack.Calculator;"], ["4. Compile and run", "javac Main.java, java Main"]]}}, {"h": "CLASSPATH", "p": ["CLASSPATH tells the JVM and `javac` where to look for user-defined `.class` files and `.jar` files. Built-in classes are found automatically. By default the class path is the current folder (`.`). If your package is somewhere else, you must tell Java the location.", "Two ways: the `-cp` (or `-classpath`) option for one command, or the `CLASSPATH` environment variable for all commands. Prefer `-cp`: it is safer and does not affect other programs."], "pts": ["Separator: `:` on Linux/Mac, `;` on Windows", "Include `.` if you also want the current folder", "The `-cp` option overrides the CLASSPATH variable", "Wrong CLASSPATH gives `ClassNotFoundException` or `NoClassDefFoundError`"], "code": {"f": "terminal", "c": "# Put compiled classes in a separate folder 'libs'\njavac -d libs Calculator.java\n\n# Compile and run Main using -cp (Linux/Mac use :, Windows use ;)\njavac -cp libs Main.java\njava -cp libs:. Main\n\n# Using a JAR file\njar cf mylib.jar -C libs mypack\njava -cp mylib.jar:. Main\n\n# Using the environment variable\nexport CLASSPATH=libs:.             # Linux / Mac\nset CLASSPATH=libs;.                # Windows"}, "viz": {"type": "chain", "items": ["java Main", "JVM searches CLASSPATH", "Loads .class files", "Runs"], "caption": "How the JVM finds classes"}}, {"h": "Access rules across packages", "p": ["Packages affect visibility. A `default` (no modifier) member is visible only inside the same package. A `protected` member is visible in the same package and in subclasses of other packages. `public` is visible everywhere, `private` only inside the class."], "warn": "A class without `public` is visible only in its own package. Importing it from outside gives a compile error.", "table": {"head": ["Modifier", "Same package", "Other package (subclass)", "Other package"], "rows": [["public", "Yes", "Yes", "Yes"], ["protected", "Yes", "Yes", "No"], ["default", "Yes", "No", "No"], ["private", "No (class only)", "No", "No"]]}}], "analogy": "Folders like College, Projects and Photos keep your laptop files organised, and two files with the same name can sit in different folders. Packages do the same for classes.", "hinglish": "Bhai package matlab classes ka folder. `package mypack;` file ki pehli line me likho, aur dusri file me `import mypack.Calculator;` karo. `javac -d .` folder khud bana deta hai. Agar class dusri jagah rakhi hai to CLASSPATH ya `-cp` se Java ko bata do kahan dhoondhna hai.", "mistakes": ["Writing `package` after `import` or not as the first line.", "Forgetting `-d .` so the .class file does not go into the package folder.", "Running `java Main` instead of `java app.Main` when Main is inside a package.", "Believing `import java.util.*;` also imports `java.util.function`.", "Using `;` as the CLASSPATH separator on Linux, or forgetting `.` in the class path."], "remember": ["Package: a group of related classes, interfaces and sub-packages; acts as folder and namespace.", "Benefits: organisation, no name conflicts, access control, reusability.", "Built-in packages: `java.lang` (auto-imported), `java.util`, `java.io`, `java.net`, `java.sql`.", "User-defined package: `package mypack;` must be the first statement in the file.", "Package name must match folder structure (`com.acme.util` = `com/acme/util/`).", "Naming convention: lowercase, reverse domain (`com.company.project`).", "Import forms: `import p.Class;`, `import p.*;`, fully qualified name, `import static`.", "`import p.*;` does not import sub-packages.", "Order in file: package, imports, class.", "`javac -d . File.java` creates package folders and places .class files.", "Run packaged class with full name: `java app.Main`.", "CLASSPATH: where JVM/javac look for user .class and .jar files; default is current folder.", "Set with `-cp` option or `CLASSPATH` variable; separator `:` (Linux/Mac), `;` (Windows).", "`default` members are visible only within the same package."], "def": "A package is a named group of related classes, interfaces and sub-packages. Think of it as a folder for Java classes. It also works as a namespace, so two classes with the same name can live in different packages without clashing (`java.util.Date` and `java.sql.Date`).", "uses": ["Organising large projects", "Avoiding name conflicts (two classes named Test in different packages)", "Controlling access with default and protected modifiers"], "pros": ["Better organisation and reuse", "No naming conflicts", "Access protection at package level"], "cons": ["package line not being the first statement", "Folder structure not matching the package name", "Forgetting to set CLASSPATH (or use -cp) so the class is not found (ClassNotFoundException)"]}, "u2-t1": {"tldr": "A class is the blueprint that defines the data and behaviour of objects. It is the base of all Java programs.", "sections": [{"h": "What is a class?", "p": ["A class is only a design. Writing a class does not create any object. Think of `Student` as the idea of a student, not a real student."], "pts": ["Declared with the `class` keyword.", "Holds data (fields) and actions (methods).", "Is the starting point of object-oriented programming in Java.", "Every Java program has at least one class."], "table": {"head": ["class Student"], "rows": [["Fields: id, name, marks"], ["Methods: display(), setMarks()"], ["Constructor: Student(...)"]]}}, {"h": "Why do we need classes?", "p": ["Real programs deal with many things such as students, accounts, books. Each thing has data and actions. Without classes you would keep many separate variables and functions, which is messy.", "A class bundles related data and methods together. You write it once and create as many objects as you want from it."], "pts": ["Reusability: one class, many objects.", "Organisation: related code stays in one place.", "Encapsulation: you can hide data using `private`.", "Models real world things naturally.", "Easy to maintain: fix the class and all objects get the fix."]}, {"h": "Syntax and parts of a class", "p": ["A class has a name, an optional access modifier and a body inside `{ }`. The body can contain the members listed below.", "The order of members is free, but a common style is: fields, constructors, then methods."], "code": {"f": "Main.java", "c": "class Student {\n    // fields (state)\n    int id;\n    String name;\n\n    // method (behaviour)\n    void display() {\n        System.out.println(id + \" \" + name);\n    }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        Student s = new Student();\n        s.id = 1;\n        s.name = \"Aman\";\n        s.display();\n    }\n}", "out": "1 Aman"}, "table": {"head": ["Member", "What it does", "Example"], "rows": [["Field (variable)", "Stores state", "int id;"], ["Method", "Defines behaviour", "void display()"], ["Constructor", "Sets initial values", "Student(int id)"], ["Initializer block", "Runs when object is built", "{ id = 1; }"], ["Nested class", "A class inside a class", "class Address {}"]]}}, {"h": "Kinds of variables inside a class", "p": ["A class can hold three kinds of variables. Each one has a different place to live and a different life time.", "Instance variables are copied into every object. A static variable has only one copy shared by all objects. A local variable lives only inside a method."], "tip": "Instance and static variables get default values (0, false, null). Local variables do not, you must set them before use.", "code": {"f": "Main.java", "c": "class Counter {\n    int count = 0;          // instance variable\n    static int total = 0;   // static variable\n\n    void hit() {\n        int step = 1;       // local variable\n        count += step;\n        total += step;\n    }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        Counter a = new Counter();\n        Counter b = new Counter();\n        a.hit(); a.hit(); b.hit();\n        System.out.println(a.count + \" \" + b.count + \" \" + Counter.total);\n    }\n}", "out": "2 1 3"}, "table": {"head": ["Type", "Declared", "Memory / life"], "rows": [["Instance", "In class, no static", "Heap, with each object"], ["Static", "In class, with static", "One copy per class"], ["Local", "Inside a method", "Stack, until method ends"]]}}, {"h": "Rules for writing classes and files", "p": ["Class names should start with a capital letter and use CamelCase, like `BankAccount`. They cannot be a keyword and cannot start with a digit.", "A `.java` file may contain many classes, but at most one can be `public`. The file name must match that public class. Each class becomes its own `.class` file after compiling."], "pts": ["Only one `public` top-level class per file.", "File name = public class name (`Main.java` for `public class Main`).", "A class without `public` has package-private (default) access.", "Top-level classes can only be `public` or default. `private` and `protected` are for nested classes."], "warn": "If the file is Main.java but the public class is Test, javac gives an error: class Test is public, should be declared in a file named Test.java.", "code": {"f": "Main.java", "c": "class Book {                 // default access\n    String title = \"Java\";\n}\n\nclass Pen {\n    String brand = \"Reynolds\";\n}\n\npublic class Main {          // file must be Main.java\n    public static void main(String[] args) {\n        System.out.println(new Book().title);\n        System.out.println(new Pen().brand);\n    }\n}", "out": "Java\nReynolds"}}, {"h": "Types of classes you will meet", "p": ["Besides normal (concrete) classes, Java has other kinds. Each is covered in its own topic later, so just know the names now."], "pts": ["Concrete class: normal class, can create objects.", "Abstract class: marked `abstract`, cannot be instantiated directly.", "Final class: marked `final`, cannot be extended.", "Nested / inner class: class declared inside another class.", "Anonymous class: class with no name, created on the spot.", "Interface-like types: `interface`, `enum`, `record` are also class-like types."]}, {"h": "Class vs Object", "p": ["Students often mix these two. The class is the plan and the object is the real thing built from the plan."], "table": {"head": ["Point", "Class", "Object"], "rows": [["Meaning", "Blueprint / template", "Instance of a class"], ["Created with", "`class` keyword", "`new` keyword"], ["Memory", "No memory for fields", "Memory in heap"], ["Count", "Declared once", "Many from one class"], ["Example", "Student", "new Student()"]]}}, {"h": "Where a class lives in memory", "p": ["When the JVM first needs a class, the class loader loads its bytecode. Class information such as method code and static variables is kept in the method area (Metaspace in Java 8+).", "Only when you write `new` is an object created in the heap. The reference variable (like `s`) sits on the stack and points to that object."], "viz": {"type": "chain", "items": ["Student.class loaded", "Metaspace holds class info", "new Student() makes object", "Heap holds the object"], "caption": "From class to object in memory"}}], "analogy": "A class is like the architect's drawing of a house. You cannot live in a drawing, but you can build many real houses from it.", "hinglish": "Bhai simple hai: class ek blueprint hai, jisme likha hota hai ki object ke paas kya data hoga aur woh kya kaam karega. Class khud memory mein object nahi banati, object banane ke liye new use karna padta hai. Java mein sab kuch class ke andar hi hota hai.", "mistakes": ["Thinking that declaring a class creates an object. Only `new` creates one.", "Naming the file differently from the public class.", "Writing two public classes in one file.", "Using a local variable without giving it a value first."], "remember": ["Class = blueprint/template; it is a user-defined data type.", "Class contains fields, methods, constructors, blocks and nested classes.", "Syntax: `class Name { fields; methods; }`.", "A class itself does not occupy heap memory for fields; objects do.", "Instance variable: one copy per object. Static variable: one copy per class. Local variable: inside method, no default value.", "One .java file can hold many classes, but only one public class.", "File name must match the public class name.", "Class names use CamelCase and start with a capital letter.", "Top-level class can be only public or default (package-private).", "Object is created from a class using `new`.", "Class info (static vars, method code) is in Metaspace; objects are in heap.", "Class gives reusability, organisation and encapsulation."], "def": "A class is a blueprint (template) that describes the properties and the behaviour that its objects will have. It is a user-defined data type, just like `int` or `String`, but you design it yourself.", "uses": ["Modelling real-world entities such as Student, Account, Product", "Grouping related data and the methods that work on it", "Creating many objects from one design"], "pros": ["Reusability: write once, create many objects", "Organised, modular code", "Supports encapsulation, inheritance and polymorphism"], "cons": ["Thinking a class occupies memory by itself", "Putting everything in one giant class instead of splitting responsibilities", "Naming mistakes: class names should start with a capital letter (Student)"]}, "u2-t2": {"tldr": "An object is a real instance of a class with its own state, behaviour and identity, created using new.", "sections": [{"h": "What is an object?", "p": ["Every object has three things: state, behaviour and identity."], "table": {"head": ["Part", "Meaning", "Example (a Dog)"], "rows": [["State", "Data it holds (fields)", "name = Bruno, age = 3"], ["Behaviour", "What it can do (methods)", "bark(), eat()"], ["Identity", "Unique address / hash", "Bruno is different from Tommy"]]}}, {"h": "Creating an object: 3 steps", "p": ["The statement `Student s = new Student();` looks like one step but does three things.", "1) Declaration: `Student s` makes a reference variable. 2) Instantiation: `new` allocates memory in the heap. 3) Initialization: the constructor `Student()` sets the starting values. Finally the address is stored in `s`."], "tip": "You can split declaration and creation in two lines, or write them together in one line.", "code": {"f": "Main.java", "c": "class Student {\n    int id;\n    String name;\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        Student s;              // only a reference, no object yet\n        s = new Student();      // now the object exists\n        System.out.println(s.id + \" \" + s.name);\n    }\n}", "out": "0 null"}, "table": {"head": ["Step", "What happens"], "rows": [["1. Declaration", "Student s"], ["2. Instantiation", "new gets heap memory"], ["3. Initialization", "constructor runs"], ["4. Assignment", "address goes into s"]]}}, {"h": "Accessing members with the dot operator", "p": ["Use the dot `.` to reach a field or call a method of an object. Every object has its own copy of the instance fields, so changing one object does not affect another."], "code": {"f": "Main.java", "c": "class Student {\n    int id;\n    String name;\n    void display() {\n        System.out.println(id + \" - \" + name);\n    }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        Student s1 = new Student();\n        Student s2 = new Student();\n        s1.id = 101; s1.name = \"Aman\";\n        s2.id = 102; s2.name = \"Riya\";\n        s1.display();\n        s2.display();\n    }\n}", "out": "101 - Aman\n102 - Riya"}}, {"h": "Reference variables and memory", "p": ["The variable `s1` does not hold the object. It holds the address of the object. The variable lives on the stack and the object lives in the heap.", "Copying a reference with `b = a` gives two names for the same object. Changing the object through `b` is visible through `a`."], "warn": "`==` on objects compares addresses, not contents. Use `equals()` for contents.", "code": {"f": "Main.java", "c": "class Student {\n    String name;\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        Student a = new Student();\n        a.name = \"Aman\";\n        Student b = a;          // same object, not a copy\n        b.name = \"Riya\";\n        System.out.println(a.name);\n        System.out.println(a == b);\n    }\n}", "out": "Riya\ntrue"}, "table": {"head": ["Heap"], "rows": [["Student object (id=1, name=Aman)"], ["a and b both point here"]]}}, {"h": "Different ways to create an object", "p": ["`new` is the normal way. Java also has other ways, which you will see in advanced topics: `clone()`, reflection (`newInstance()`), and deserialization. A constructor is called in `new` and reflection. It is not called in `clone()` and deserialization."], "code": {"f": "Main.java", "c": "class Point implements Cloneable {\n    int x = 5;\n    protected Object clone() throws CloneNotSupportedException {\n        return super.clone();\n    }\n}\n\npublic class Main {\n    public static void main(String[] args) throws Exception {\n        Point p1 = new Point();                                   // new\n        Point p2 = (Point) p1.clone();                            // clone\n        Point p3 = Point.class.getDeclaredConstructor().newInstance(); // reflection\n        System.out.println(p1.x + \" \" + p2.x + \" \" + p3.x);\n        System.out.println(p1 == p2);\n    }\n}", "out": "5 5 5\nfalse"}}, {"h": "Anonymous objects", "p": ["An object created without storing its reference in a variable is called an anonymous object. You can use it only once, because you have no name to reach it again.", "It is handy when you need to call just one method."], "code": {"f": "Main.java", "c": "class Greeter {\n    void hello() {\n        System.out.println(\"Hello from an anonymous object\");\n    }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        new Greeter().hello();   // no variable, used once\n    }\n}", "out": "Hello from an anonymous object"}}, {"h": "Objects as parameters and return values", "p": ["Objects can be passed to methods and returned from them. Java passes the reference by value, so the method can change the same object. See the Methods topic for details."], "code": {"f": "Main.java", "c": "class Box {\n    int size;\n}\n\npublic class Main {\n    static void grow(Box b) { b.size += 10; }\n    static Box makeBox(int s) {\n        Box b = new Box();\n        b.size = s;\n        return b;\n    }\n    public static void main(String[] args) {\n        Box x = makeBox(5);\n        grow(x);\n        System.out.println(x.size);\n    }\n}", "out": "15"}}, {"h": "null and the default values of an object", "p": ["If a reference does not point to any object, it holds `null`. Calling a method or field on `null` throws `NullPointerException`.", "When an object is created, its fields get default values: numbers 0, boolean false, char '\\u0000', and references null."], "warn": "An object with no reference left becomes eligible for garbage collection.", "code": {"f": "Main.java", "c": "class Item {\n    int qty;\n    boolean ok;\n    String label;\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        Item i = new Item();\n        System.out.println(i.qty + \" \" + i.ok + \" \" + i.label);\n        Item j = null;\n        System.out.println(j.qty);   // NullPointerException\n    }\n}", "out": "0 false null\nPicked up JAVA_TOOL_OPTIONS: -Djavax.net.ssl.trustStore=/etc/ssl/certs/java/cacerts -Djavax.net.ssl.trustStoreType=JKS -Dhttps.proxyHost=127.0.0.1 -Dhttps.proxyPort=39251 -Dhttp.nonProxyHosts=localhost|127.0.0.1|::1|127.*|0.*|::|169.254.*|api.anthropic.com|api-staging.anthropic.com|api-pr-preview.anthropic.com|mcp-proxy.anthropic.com|mcp-proxy-staging.anthropic.com|registry.npmjs.org|jsr.io|npm.jsr.io|pypi.org|files.pythonhosted.org|index.crates.io|proxy.golang.org|host.docker.internal|10.*|172.16.*|172.17.*|172.18.*|172.19.*|172.20.*|172.21.*|172.22.*|172.23.*|172.24.*|172.25.*|172.26.*|172.27.*|172.28.*|172.29.*|172.30.*|172.31.*|192.168.*|100.64.0.0/10|*.svc.cluster.local|*.svc.cluster.local -Djdk.http.auth.tunneling.disabledSchemes= -Djdk.http.auth.proxying.disabledSchemes="}}], "analogy": "If the class is the design of a phone model, then your phone, your friend's phone and the one in the shop are objects. Each one has its own battery level and photos.", "hinglish": "Bhai object matlab class ka asli roop. Class sirf design hai, object woh cheez hai jo memory mein bani hoti hai. new likhte hi heap mein jagah milti hai aur hume ek reference milta hai. Dhyan rakho: Student b = a likhne se naya object nahi banta, bas doosra reference milta hai.", "mistakes": ["Believing `Student b = a;` makes a new Student.", "Using `==` to compare object contents.", "Using a reference before `new` (it is null, so NullPointerException).", "Thinking that the variable `s` itself is the object. It is only a reference."], "remember": ["Object = instance of a class; has state, behaviour and identity.", "Syntax: `ClassName ref = new ClassName();`.", "Creation steps: declaration, instantiation (new), initialization (constructor), assignment.", "Objects live in heap; reference variables live in stack.", "Each object has its own copy of instance variables.", "Dot operator accesses members: `obj.field`, `obj.method()`.", "`b = a` copies the reference; both point to the same object.", "`==` compares references; `equals()` compares content (if overridden).", "Ways to create: new, clone(), reflection, deserialization.", "Anonymous object: `new Greeter().hello();` usable only once.", "Default values: 0, false, '\\u0000', null.", "Calling a member on null throws NullPointerException.", "Object with no reference is eligible for garbage collection."], "def": "An object is a real entity created from a class. It takes memory and holds actual values. In Java, almost everything you work with is an object.", "uses": ["Representing every real-world item in your program", "Passing data around as a single unit"], "pros": ["Each object has its own copy of the data", "Objects interact only through methods, which keeps code organised"], "cons": ["Confusing the reference with the object (Student b = a does not create a new student)", "NullPointerException from using an object that was never created", "Creating objects in loops without need, which wastes memory"]}, "u2-t3": {"tldr": "A method is a named block of code that does one job. It can take inputs and return a result.", "sections": [{"h": "What is a method and why use it?", "p": ["We use methods to avoid repeating code, to break a big problem into small parts, and to make programs easy to read and test."], "pts": ["Write once, call many times (reusability).", "Makes code modular.", "Easy to debug: test each method alone.", "Can access and change the fields of its class."]}, {"h": "Anatomy of a method", "p": ["A method has a header (declaration) and a body. The header has the access modifier, optional keywords like `static`, the return type, the name and the parameter list.", "Method names use camelCase and are usually verbs, like `calculateTotal`."], "code": {"f": "Main.java", "c": "public class Main {\n    // access  static  returnType  name  (parameters)\n    public static int add(int a, int b) {\n        int sum = a + b;\n        return sum;\n    }\n\n    public static void main(String[] args) {\n        int result = add(10, 20);\n        System.out.println(\"Sum = \" + result);\n    }\n}", "out": "Sum = 30"}, "viz": {"type": "chain", "items": ["public", "static", "int", "add", "(int a, int b)", "{ body }"], "caption": "modifier, keyword, return type, name, parameters, body"}}, {"h": "Types of methods", "p": ["Predefined methods already exist in Java libraries, like `Math.sqrt()` or `String.length()`. User-defined methods are written by you.", "Inside a class, methods are either instance (need an object) or static (called with the class name)."], "code": {"f": "Main.java", "c": "class Calc {\n    int base = 100;\n    int addBase(int x) { return base + x; }          // instance\n    static int square(int x) { return x * x; }       // static\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        Calc c = new Calc();\n        System.out.println(c.addBase(5));\n        System.out.println(Calc.square(4));\n        System.out.println(Math.max(3, 9));           // predefined\n    }\n}", "out": "105\n16\n9"}, "table": {"head": ["Point", "Instance method", "Static method"], "rows": [["Keyword", "none", "static"], ["Called with", "object: s.show()", "class: Main.show()"], ["Can use instance fields", "Yes", "No (no object)"], ["Belongs to", "Object", "Class"]]}}, {"h": "Parameters and arguments", "p": ["Parameters are the variables in the method declaration (formal parameters). Arguments are the actual values you pass when calling (actual parameters).", "Arguments must match the parameters in number, order and compatible type. Java may widen a type automatically, for example `int` to `double`."], "warn": "`intro(20, \"Riya\")` is a compile error because the order of types is wrong.", "code": {"f": "Main.java", "c": "public class Main {\n    static void intro(String name, int age) {   // parameters\n        System.out.println(name + \" is \" + age);\n    }\n\n    static double half(double x) { return x / 2; }\n\n    public static void main(String[] args) {\n        intro(\"Riya\", 20);                       // arguments\n        System.out.println(half(7));             // int 7 widened to double\n    }\n}", "out": "Riya is 20\n3.5"}}, {"h": "Return type and the return statement", "p": ["The return type tells what kind of value the method gives back. If it returns nothing, write `void`. A method with a non-void type must return a value on every path.", "`return` ends the method at once. In a `void` method you can write a plain `return;` to exit early. A method can return only one value, but that value can be an array or an object."], "warn": "Code written after `return` in the same block is unreachable, and javac reports an error.", "code": {"f": "Main.java", "c": "public class Main {\n    static String grade(int marks) {\n        if (marks >= 40) {\n            return \"Pass\";\n        }\n        return \"Fail\";\n    }\n\n    static void printPositive(int n) {\n        if (n <= 0) return;          // early exit from void method\n        System.out.println(n);\n    }\n\n    public static void main(String[] args) {\n        System.out.println(grade(55));\n        printPositive(-3);\n        printPositive(8);\n    }\n}", "out": "Pass\n8"}}, {"h": "Pass by value", "p": ["Java always passes arguments by value. The method gets a copy of the argument. For primitives the copy is the value itself, so the caller's variable never changes.", "For objects the copy is a copy of the reference. The method can change the object's data through it, but if it points the parameter to a new object, the caller does not see that."], "code": {"f": "Main.java", "c": "class Box { int v = 1; }\n\npublic class Main {\n    static void a(int x) { x = 99; }\n    static void b(Box bx) { bx.v = 99; }\n    static void c(Box bx) { bx = new Box(); bx.v = 99; }\n\n    public static void main(String[] args) {\n        int n = 1;\n        Box p = new Box(), q = new Box();\n        a(n); b(p); c(q);\n        System.out.println(n + \" \" + p.v + \" \" + q.v);\n    }\n}", "out": "1 99 1"}, "table": {"head": ["Case", "Caller sees change?", "Why"], "rows": [["Change a primitive", "No", "Only a copy was passed"], ["Change object field", "Yes", "Same object via copied reference"], ["Assign new object to param", "No", "Only the local copy now points elsewhere"]]}}, {"h": "Method overloading (introduction)", "p": ["Overloading means writing many methods with the same name but different parameter lists in the same class. The difference can be the number, the type or the order of parameters.", "The compiler picks the right one by looking at the arguments. Changing only the return type is not enough."], "warn": "`int f()` and `double f()` cannot both exist. Same name and same parameters is a compile error.", "code": {"f": "Main.java", "c": "public class Main {\n    static int add(int a, int b)         { return a + b; }\n    static int add(int a, int b, int c)  { return a + b + c; }\n    static double add(double a, double b){ return a + b; }\n\n    public static void main(String[] args) {\n        System.out.println(add(1, 2));\n        System.out.println(add(1, 2, 3));\n        System.out.println(add(1.5, 2.5));\n    }\n}", "out": "3\n6\n4.0"}}, {"h": "Variable arguments (varargs)", "p": ["Varargs let a method accept zero or more arguments of one type. Write three dots after the type: `int... nums`. Inside the method, `nums` behaves like an array.", "A method can have only one varargs parameter, and it must be the last parameter."], "tip": "`System.out.printf` and `String.format` are famous methods that use varargs.", "code": {"f": "Main.java", "c": "public class Main {\n    static int sum(String label, int... nums) {\n        int total = 0;\n        for (int n : nums) total += n;\n        System.out.println(label + \" (\" + nums.length + \" values) = \" + total);\n        return total;\n    }\n\n    public static void main(String[] args) {\n        sum(\"none\");\n        sum(\"two\", 4, 6);\n        sum(\"four\", 1, 2, 3, 4);\n    }\n}", "out": "none (0 values) = 0\ntwo (2 values) = 10\nfour (4 values) = 10"}}], "analogy": "A method is a button on a TV remote. The volume button only changes volume. You press it any time without knowing the wiring inside.", "hinglish": "Bhai method ek kaam karne wala code ka block hai jise tum baar baar bula sakte ho. Input ke liye parameters hote hain aur output ke liye return. Java mein sab pass-by-value hota hai, object ke case mein reference ki copy jaati hai, isliye object ka data change ho sakta hai par naya object assign karne se bahar kuch nahi badalta.", "mistakes": ["Saying Java passes objects by reference. It passes the reference by value.", "Forgetting `return` on some path in a non-void method.", "Overloading by changing only the return type.", "Calling an instance method from `static main` without creating an object.", "Putting varargs parameter anywhere except last."], "remember": ["Method = named block of code that performs a task; defined inside a class.", "Syntax: `accessModifier [static] returnType name(parameters) { body }`.", "Parameters = in the declaration; arguments = values passed in the call.", "`void` means no return value; otherwise the method must return on every path.", "`return` exits the method immediately; one value at most.", "Instance methods need an object; static methods are called with the class name.", "Java is strictly pass-by-value; for objects the reference is copied.", "A method can change an object's fields but cannot change the caller's reference.", "Overloading: same name, different parameter list (number/type/order); return type alone is not enough.", "Varargs: `type... name`, acts as an array, must be last, only one per method.", "Method names use camelCase and are usually verbs.", "Predefined methods come from Java API (Math.sqrt, String.length)."], "def": "A method is a block of code that performs one task. It is written inside a class and runs only when it is called. Methods define the behaviour of an object.", "uses": ["Breaking a big problem into small, reusable pieces", "Performing actions such as calculating, printing, validating and saving data"], "pros": ["Reusability: write once, call many times", "Easier testing and debugging", "Hides implementation details"], "cons": ["Forgetting return in a method with a non-void return type", "Writing code after a return statement (unreachable code error)", "Confusing parameters with arguments", "Expecting a method to change a primitive argument of the caller (it cannot)"]}, "u2-t4": {"tldr": "An array of objects stores many objects of one class. Each slot holds a reference and starts as null.", "sections": [{"h": "What is an array of objects?", "p": ["Unlike an `int[]`, which holds the numbers themselves, an object array holds only addresses. The real objects live in the heap."], "table": {"head": ["Student[] arr  (length 3)"], "rows": [["arr[0] -> Student(1, Aman)"], ["arr[1] -> Student(2, Riya)"], ["arr[2] -> Student(3, Kabir)"]]}}, {"h": "Declaring and creating the array", "p": ["It takes two stages. First create the array itself. After that every slot is `null`, so create each object and put it in its slot.", "Syntax: `ClassName[] name = new ClassName[size];`"], "code": {"f": "Main.java", "c": "class Student {\n    int id;\n    String name;\n    Student(int id, String name) {\n        this.id = id;\n        this.name = name;\n    }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        Student[] arr = new Student[3];\n        System.out.println(arr[0]);            //
