null\n        arr[0] = new Student(1, \"Aman\");\n        arr[1] = new Student(2, \"Riya\");\n        arr[2] = new Student(3, \"Kabir\");\n        System.out.println(arr.length + \" \" + arr[1].name);\n    }\n}", "out": "null\n3 Riya"}, "table": {"head": ["Step", "What happens"], "rows": [["1. Declare", "Student[] arr;"], ["2. Create array", "arr = new Student[3];"], ["3. Slots are null", "no objects yet"], ["4. Fill each slot", "arr[0] = new Student(...)"]]}}, {"h": "Array initializer shortcut", "p": ["If you know the objects in advance, create them right inside curly braces. The array size is decided by the number of items."], "code": {"f": "Main.java", "c": "class Student {\n    int id;\n    String name;\n    Student(int id, String name) { this.id = id; this.name = name; }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        Student[] arr = {\n            new Student(1, \"Aman\"),\n            new Student(2, \"Riya\")\n        };\n        System.out.println(arr.length + \" students, first is \" + arr[0].name);\n    }\n}", "out": "2 students, first is Aman"}}, {"h": "Looping over the objects", "p": ["Use a normal `for` loop when you need the index. Use the for-each loop when you only need each element. Both call methods of each object in the array."], "code": {"f": "Main.java", "c": "class Student {\n    int id;\n    String name;\n    Student(int id, String name) { this.id = id; this.name = name; }\n    void display() { System.out.println(id + \" - \" + name); }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        Student[] arr = { new Student(1, \"Aman\"), new Student(2, \"Riya\"), new Student(3, \"Kabir\") };\n        for (int i = 0; i < arr.length; i++) {\n            arr[i].display();\n        }\n        for (Student s : arr) {\n            System.out.println(s.name.toUpperCase());\n        }\n    }\n}", "out": "1 - Aman\n2 - Riya\n3 - Kabir\nAMAN\nRIYA\nKABIR"}}, {"h": "Searching: highest marks", "p": ["A common exam program: keep a variable for the best object so far and compare each element with it."], "code": {"f": "Main.java", "c": "class Student {\n    String name;\n    int marks;\n    Student(String name, int marks) { this.name = name; this.marks = marks; }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        Student[] arr = { new Student(\"Aman\", 72), new Student(\"Riya\", 91), new Student(\"Kabir\", 65) };\n        Student top = arr[0];\n        for (Student s : arr) {\n            if (s.marks > top.marks) top = s;\n        }\n        System.out.println(top.name + \" scored \" + top.marks);\n    }\n}", "out": "Riya scored 91"}}, {"h": "Sorting an array of objects", "p": ["`Arrays.sort(arr, comparator)` sorts objects by any field you choose. A comparator tells how to compare two objects. Here we sort by marks, highest first, using a lambda."], "tip": "Without a comparator, `Arrays.sort` needs the class to implement `Comparable`, or it throws ClassCastException.", "code": {"f": "Main.java", "c": "import java.util.Arrays;\n\nclass Student {\n    String name;\n    int marks;\n    Student(String name, int marks) { this.name = name; this.marks = marks; }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        Student[] arr = { new Student(\"Aman\", 72), new Student(\"Riya\", 91), new Student(\"Kabir\", 65) };\n        Arrays.sort(arr, (a, b) -> b.marks - a.marks);\n        for (Student s : arr) System.out.println(s.name + \" \" + s.marks);\n    }\n}", "out": "Riya 91\nAman 72\nKabir 65"}}, {"h": "NullPointerException trap and shared references", "p": ["If a slot is still `null`, calling a method or reading a field on it throws `NullPointerException`. Always fill all slots, or check `if (arr[i] != null)`.", "Also remember that the array keeps references. Copying the array with `clone()` copies the references only (a shallow copy), so both arrays point to the same objects."], "code": {"f": "Main.java", "c": "class Student {\n    String name;\n    Student(String name) { this.name = name; }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        Student[] a = new Student[2];\n        a[0] = new Student(\"Aman\");\n        Student[] b = a.clone();\n        b[0].name = \"Changed\";\n        System.out.println(a[0].name);          // shared object\n        for (Student s : a) {\n            if (s != null) System.out.println(\"ok \" + s.name);\n            else System.out.println(\"empty slot\");\n        }\n        System.out.println(a[1].name);          // NullPointerException\n    }\n}", "out": "Changed\nok Changed\nempty slot\nPicked up JAVA_TOOL_OPTIONS: -Djavax.net.ssl.trustStore=/etc/ssl/certs/java/cacerts -Djavax.net.ssl.trustStoreType=JKS -Dhttps.proxyHost=127.0.0.1 -Dhttps.proxyPort=39251 -Dhttp.nonProxyHosts=localhost|127.0.0.1|::1|127.*|0.*|::|169.254.*|api.anthropic.com|api-staging.anthropic.com|api-pr-preview.anthropic.com|mcp-proxy.anthropic.com|mcp-proxy-staging.anthropic.com|registry.npmjs.org|jsr.io|npm.jsr.io|pypi.org|files.pythonhosted.org|index.crates.io|proxy.golang.org|host.docker.internal|10.*|172.16.*|172.17.*|172.18.*|172.19.*|172.20.*|172.21.*|172.22.*|172.23.*|172.24.*|172.25.*|172.26.*|172.27.*|172.28.*|172.29.*|172.30.*|172.31.*|192.168.*|100.64.0.0/10|*.svc.cluster.local|*.svc.cluster.local -Djdk.http.auth.tunneling.disabledSchemes= -Djdk.http.auth.proxying.disabledSchemes="}}], "analogy": "A class of 30 students needs 30 chairs. `new Student[30]` only brings 30 empty chairs. You still have to make each student sit on one.", "hinglish": "Bhai array of objects matlab ek array jisme objects ke reference rakhe jaate hain. new Student[3] likhne se sirf 3 khaali jagah banti hain, objects nahi. Har jagah par alag se new Student() karna padta hai, warna NullPointerException aayega.", "mistakes": ["Thinking `new Student[3]` creates 3 Student objects.", "Using `arr.length()` or `arr.size()`. For arrays it is `arr.length`.", "Forgetting that a shallow copy shares the same objects.", "Looping with `i <= arr.length` and getting ArrayIndexOutOfBoundsException.", "Sorting objects with no Comparable or Comparator."], "remember": ["Array of objects holds references to objects of one class.", "Syntax: `ClassName[] arr = new ClassName[n];`.", "After creating the array every element is `null` (default for references).", "Create each object separately: `arr[i] = new ClassName(...)`.", "Shortcut: `Student[] a = { new Student(..), new Student(..) };`.", "`arr.length` gives the size (a field, no brackets).", "Use for or for-each loop to process all objects.", "Accessing a member of a null element throws NullPointerException.", "Objects live in heap; the array holds only their addresses.", "`clone()` or `Arrays.copyOf` gives a shallow copy: same objects are shared.", "Sort with `Arrays.sort(arr, comparator)` or make the class `Comparable`.", "Index range is 0 to length-1, else ArrayIndexOutOfBoundsException."], "def": "An array of objects is an array whose elements are references to objects of a class, such as `Student[]`. It lets you store and handle many objects together with one name and an index.", "uses": ["Storing a group of similar entities such as students, products or employees", "Searching, sorting and finding the maximum or minimum of objects"], "pros": ["Easy and fast access by index", "Simple way to handle many objects with one name"], "cons": ["NullPointerException from using an element that was never created", "ArrayIndexOutOfBoundsException when the index is outside 0 to length-1", "Fixed size: you cannot add more elements than the array was created with"]}, "u2-t5": {"tldr": "A constructor has the class name, no return type, and runs automatically on `new` to set the object's starting values.", "sections": [{"h": "What is a constructor?", "p": ["It looks like a method but has the same name as the class and has no return type. You never call it by name. The `new` keyword calls it."], "code": {"f": "Main.java", "c": "class Student {\n    int id;\n    String name;\n\n    Student(int id, String name) {      // constructor\n        this.id = id;\n        this.name = name;\n        System.out.println(\"Constructor called\");\n    }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        Student s = new Student(101, \"Aman\");\n        System.out.println(s.id + \" \" + s.name);\n    }\n}", "out": "Constructor called\n101 Aman"}, "viz": {"type": "chain", "items": ["new Student(1,\"Aman\")", "Memory allocated", "Constructor runs", "Object ready"], "caption": "What happens on new"}}, {"h": "Constructor vs method", "p": ["Both are blocks of code, but they have different jobs and rules. Remember this table for exams."], "table": {"head": ["Point", "Constructor", "Method"], "rows": [["Name", "Same as class", "Any valid name"], ["Return type", "None (not even void)", "Required (or void)"], ["Called", "Automatically by new", "Explicitly by us"], ["Purpose", "Initialize object", "Do a task"], ["Inherited", "No", "Yes"], ["Default one", "Compiler gives", "Never"]]}}, {"h": "Default constructor", "p": ["If you write no constructor at all, the compiler adds one for you. It has no parameters and an empty body (apart from the hidden `super()` call). This is called the default constructor.", "It makes the fields get their default values: 0 for numbers, false for boolean, null for references."], "tip": "Compiler provides the default constructor only when the class has no constructor of its own. It exists in the .class file, not in your source.", "code": {"f": "Main.java", "c": "class Car {\n    int speed;\n    String model;\n    // no constructor written: compiler adds Car() { super(); }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        Car c = new Car();\n        System.out.println(c.speed + \" \" + c.model);\n    }\n}", "out": "0 null"}}, {"h": "No-arg constructor (written by you)", "p": ["A no-argument constructor is one you write yourself with an empty parameter list. Use it to give your own starting values instead of 0 or null.", "Many people use the word 'default constructor' for this too, but strictly the default one is the compiler-made one."], "code": {"f": "Main.java", "c": "class Account {\n    String bank;\n    double balance;\n\n    Account() {                  // no-arg constructor\n        bank = \"SBI\";\n        balance = 500.0;\n    }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        Account a = new Account();\n        System.out.println(a.bank + \" \" + a.balance);\n    }\n}", "out": "SBI 500.0"}}, {"h": "Parameterized constructor", "p": ["A parameterized constructor takes arguments, so each object can start with different values. Inside it, `this.id = id` separates the field (left) from the parameter (right) when both have the same name."], "warn": "Without `this`, `id = id;` assigns the parameter to itself and the field stays 0.", "code": {"f": "Main.java", "c": "class Student {\n    int id;\n    String name;\n\n    Student(int id, String name) {\n        this.id = id;\n        this.name = name;\n    }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        Student s1 = new Student(101, \"Aman\");\n        Student s2 = new Student(102, \"Riya\");\n        System.out.println(s1.id + \" \" + s1.name);\n        System.out.println(s2.id + \" \" + s2.name);\n    }\n}", "out": "101 Aman\n102 Riya"}}, {"h": "Copy constructor", "p": ["A copy constructor creates a new object using the data of an existing object of the same class. Java has no built-in copy constructor like C++. You write it yourself, and it takes an object of the same class as its parameter."], "tip": "If a field is itself an object, copy it too (deep copy), otherwise both objects share it.", "code": {"f": "Main.java", "c": "class Student {\n    int id;\n    String name;\n\n    Student(int id, String name) { this.id = id; this.name = name; }\n\n    Student(Student other) {         // copy constructor\n        this.id = other.id;\n        this.name = other.name;\n    }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        Student s1 = new Student(101, \"Aman\");\n        Student s2 = new Student(s1);\n        s2.name = \"Riya\";\n        System.out.println(s1.name + \" \" + s2.name);\n        System.out.println(s1 == s2);\n    }\n}", "out": "Aman Riya\nfalse"}}, {"h": "Constructor overloading", "p": ["A class can have many constructors with different parameter lists. This is constructor overloading. The compiler picks the right one from the arguments in `new`.", "It lets users create objects in many ways: with no data, with some data or with full data."], "code": {"f": "Main.java", "c": "class Student {\n    int id;\n    String name;\n\n    Student() { name = \"Unknown\"; }\n    Student(int id) { this.id = id; name = \"Unknown\"; }\n    Student(int id, String name) { this.id = id; this.name = name; }\n\n    void show() { System.out.println(id + \" \" + name); }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        new Student().show();\n        new Student(7).show();\n        new Student(8, \"Riya\").show();\n    }\n}", "out": "0 Unknown\n7 Unknown\n8 Riya"}}, {"h": "Constructor chaining with this() and super()", "p": ["Constructor chaining means one constructor calls another. `this(...)` calls another constructor of the same class. `super(...)` calls a constructor of the parent class.", "The call must be the first statement of the constructor, and you cannot use both `this()` and `super()` in the same constructor. If you write neither, the compiler adds `super()` as the first line. The parent constructor always runs before the child's body."], "warn": "Two constructors calling each other with this() gives a compile error: recursive constructor invocation.", "code": {"f": "Main.java", "c": "class Person {\n    Person() { System.out.println(\"Person()\"); }\n}\n\nclass Student extends Person {\n    int id;\n    String name;\n\n    Student() {\n        this(0, \"NA\");               // calls the 2-arg constructor\n        System.out.println(\"Student()\");\n    }\n    Student(int id, String name) {\n        super();                     // calls Person()\n        this.id = id;\n        this.name = name;\n        System.out.println(\"Student(id, name)\");\n    }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        new Student();\n    }\n}", "out": "Person()\nStudent(id, name)\nStudent()"}, "viz": {"type": "chain", "items": ["new Student(8)", "this(8, \"NA\")", "super()  (Person)", "Person body", "Student body"], "caption": "Order of execution for chaining"}}, {"h": "Rules and special cases", "p": ["Learn these rules, they are very common in exams and viva."], "pts": ["The name must match the class name exactly.", "No return type. If you add one (even `void`), it becomes a normal method.", "Allowed modifiers: `public`, `protected`, `private`, default. Not `static`, `final`, `abstract`, `synchronized`.", "Constructors are not inherited, but a child constructor calls the parent one using `super()`.", "If you write any constructor, the compiler does not add the default one. Then `new Student()` fails unless you write it.", "A `private` constructor stops outside classes from creating objects. This is used in the Singleton pattern.", "A constructor can throw exceptions and can use `return;` (without a value) to exit early."], "code": {"f": "Main.java", "c": "class Student {\n    int id;\n    void Student() {                 // has void: this is a METHOD, not a constructor\n        System.out.println(\"I am a method\");\n    }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        Student s = new Student();   // default constructor, prints nothing\n        s.Student();                 // calling the method\n    }\n}", "out": "I am a method"}}], "analogy": "When you create an Instagram account, the app asks for name, email and password at the very start. That set-up moment is the constructor.", "hinglish": "Bhai constructor ek special method jaisa hota hai jiska naam class ke naam jaisa hota hai aur return type nahi hota. Jaise hi new likhte ho, yeh apne aap chal jaata hai aur object ki starting values set karta hai. Agar tumne koi constructor nahi likha to Java free mein default de deta hai, par ek bhi likha to woh free wala gayab.", "mistakes": ["Adding `void` or any return type, which makes it a normal method.", "Calling `new Student()` after defining only a parameterized constructor.", "Writing `id = id;` instead of `this.id = id;`.", "Placing `this()` or `super()` after other statements.", "Thinking constructors are inherited by subclasses."], "remember": ["Constructor: special block with the class name and no return type, used to initialize an object.", "Runs automatically when `new` is used; you cannot call it like a method.", "Default constructor: compiler-made, no parameters, only if the class has no constructor.", "No-arg constructor: written by you with empty parameters.", "Parameterized constructor: takes arguments to set custom values.", "Copy constructor: `Student(Student s)`, must be written manually in Java.", "Constructor overloading: many constructors with different parameter lists.", "`this(...)` calls another constructor of the same class; `super(...)` calls parent constructor.", "`this()` or `super()` must be the first statement, and both cannot be used together.", "Compiler inserts `super()` automatically if no explicit call is written.", "Constructors cannot be static, final, abstract or inherited.", "If any constructor is written, the default one is not added.", "Private constructor blocks object creation from outside (Singleton)."], "def": "A constructor is a special block of code that runs when an object is created. Its job is to initialize the new object, which means giving values to its fields.", "uses": ["Giving objects their starting values", "Making sure an object is always created in a valid state", "Singleton and factory style designs"], "pros": ["Initialisation happens automatically", "Overloading gives flexible ways to create objects", "Reduces repeated setup code"], "cons": ["Adding a return type (even void) turns it into a normal method", "Forgetting that the default constructor disappears once you write your own", "Using the parameter name and the field name without this, so the field stays unset"]}, "u2-t6": {"tldr": "Binding connects a method call to the method body. Static binding happens at compile time, dynamic binding at runtime.", "sections": [{"h": "What is method binding?", "p": ["It matters when many methods share a name, as in overloading and overriding. Based on when the decision is made, there are two types."], "viz": {"type": "chain", "items": ["Method call", "Binding", "Method body runs"], "caption": "Binding connects call to body"}}, {"h": "Static binding (early binding)", "p": ["In static binding the compiler decides which method will run, at compile time. It uses the type of the reference variable and the argument types, not the actual object.", "Methods that cannot be overridden are bound statically: `static`, `private` and `final` methods. Overloaded methods are also bound statically. Constructors too."], "table": {"head": ["Point", "Static binding"], "rows": [["Also called", "Early binding / compile-time binding"], ["Decided by", "Compiler"], ["Looks at", "Reference type, argument types"], ["Used for", "Overloading, static, private, final"], ["Speed", "Slightly faster"]]}}, {"h": "Static binding with overloading", "p": ["With overloading, the compiler checks the argument types and picks the matching method before the program even runs."], "code": {"f": "Main.java", "c": "class Printer {\n    void print(int x)    { System.out.println(\"int: \" + x); }\n    void print(String s) { System.out.println(\"String: \" + s); }\n    void print(double d) { System.out.println(\"double: \" + d); }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        Printer p = new Printer();\n        p.print(5);\n        p.print(\"hi\");\n        p.print(2.5);\n    }\n}", "out": "int: 5\nString: hi\ndouble: 2.5"}}, {"h": "Static binding with static, private and final methods", "p": ["A static method belongs to the class, so the reference type decides which one runs. If a child declares a static method with the same signature, it hides the parent's method. It is not overriding.", "`private` and `final` methods cannot be overridden, so the compiler can bind them early too."], "warn": "A static method call like `p.who()` is resolved by the reference type, not the object. That is method hiding, not overriding.", "code": {"f": "Main.java", "c": "class Parent {\n    static void who() { System.out.println(\"Parent static\"); }\n    final void fixed() { System.out.println(\"Parent final\"); }\n}\n\nclass Child extends Parent {\n    static void who() { System.out.println(\"Child static\"); }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        Parent p = new Child();\n        p.who();          // reference type Parent decides\n        p.fixed();\n        Child.who();\n    }\n}", "out": "Parent static\nParent final\nChild static"}}, {"h": "Dynamic binding (late binding)", "p": ["In dynamic binding the method to run is decided at runtime, by the JVM, from the actual object that the reference points to. This happens for overridden instance methods.", "This is the base of runtime polymorphism. A parent reference can hold a child object and the child's version runs."], "code": {"f": "Main.java", "c": "class Animal {\n    void sound() { System.out.println(\"Animal sound\"); }\n}\nclass Dog extends Animal {\n    void sound() { System.out.println(\"Dog barks\"); }\n}\nclass Cat extends Animal {\n    void sound() { System.out.println(\"Cat meows\"); }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        Animal[] zoo = { new Dog(), new Cat(), new Animal() };\n        for (Animal a : zoo) {\n            a.sound();           // decided at runtime\n        }\n    }\n}", "out": "Dog barks\nCat meows\nAnimal sound"}, "table": {"head": ["Step", "What happens"], "rows": [["1. Compile time", "Checks Animal has sound()"], ["2. Runtime", "JVM sees object is Dog"], ["3. Lookup", "Finds Dog's sound()"], ["4. Run", "Dog barks"]]}}, {"h": "How the JVM does dynamic binding", "p": ["At compile time the compiler only checks that the method exists in the reference type. It writes the call into the bytecode as a virtual call (`invokevirtual`).", "At runtime the JVM finds the real class of the object and looks in its method table (virtual table). If the class overrides the method it runs that one, otherwise it goes up to the parent class."], "viz": {"type": "chain", "items": ["a.sound()", "Find real class of object", "Search Dog for sound()", "Found: run it"], "caption": "Runtime method lookup"}}, {"h": "Variables are not dynamically bound", "p": ["Dynamic binding works for instance methods only. Field access is decided at compile time using the reference type. So the same field name in parent and child gives the parent's field when accessed through a parent reference."], "code": {"f": "Main.java", "c": "class Parent {\n    String name = \"Parent field\";\n    String who() { return \"Parent method\"; }\n}\nclass Child extends Parent {\n    String name = \"Child field\";\n    String who() { return \"Child method\"; }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        Parent p = new Child();\n        System.out.println(p.name);   // static: reference type\n        System.out.println(p.who());  // dynamic: actual object\n    }\n}", "out": "Parent field\nChild method"}}, {"h": "Overloading with references: a classic trap", "p": ["Overloaded methods are chosen by the compile-time type of the argument. Even if the real object is a `String`, if the variable type is `Object`, the `Object` version runs."], "code": {"f": "Main.java", "c": "public class Main {\n    static void show(Object o) { System.out.println(\"Object version\"); }\n    static void show(String s) { System.out.println(\"String version\"); }\n\n    public static void main(String[] args) {\n        Object o = \"hello\";\n        String s = \"hello\";\n        show(o);    // chosen by reference type at compile time\n        show(s);\n    }\n}", "out": "Object version\nString version"}}, {"h": "Static vs dynamic binding", "p": ["Quick table for exams."], "table": {"head": ["Point", "Static binding", "Dynamic binding"], "rows": [["Time", "Compile time", "Run time"], ["Decided by", "Compiler", "JVM"], ["Based on", "Reference type", "Actual object type"], ["Used in", "Overloading, static, private, final", "Overriding"], ["Also called", "Early binding", "Late binding"], ["Polymorphism", "Compile-time", "Runtime"], ["Speed", "Faster", "Slightly slower"]]}}], "analogy": "You order 'chai' at a shop. If the menu has only one chai, the cook is known beforehand (static). If the owner decides at that moment which cook makes it, it is decided late (dynamic).", "hinglish": "Bhai binding ka matlab hai method call ko uski body se jodna. Agar yeh decision compile time par ho jaye to static binding (overloading, static, private, final). Agar runtime par actual object dekh kar ho to dynamic binding (overriding). Yaad rakho: variable kabhi dynamic nahi hota, sirf methods hote hain.", "mistakes": ["Calling overloading 'runtime polymorphism'. It is compile time.", "Expecting `p.who()` to call child's static method through a parent reference.", "Expecting fields to behave polymorphically like methods.", "Forgetting that overload resolution uses the declared type: `Object o = \"hi\"` picks show(Object)."], "remember": ["Binding = linking a method call to the method body.", "Static binding (early): resolved at compile time by the compiler.", "Dynamic binding (late): resolved at runtime by the JVM from the actual object.", "Overloading uses static binding; overriding uses dynamic binding.", "static, private and final methods (and constructors) use static binding.", "A static method in the child with same signature is method hiding, not overriding.", "In dynamic binding, the object type decides the method, not the reference type.", "Parent reference to child object (upcasting) enables runtime polymorphism.", "Compiler only checks the method exists in the reference type.", "Variables/fields are bound statically: reference type decides.", "JVM uses invokevirtual and the virtual method table for dynamic dispatch.", "Static binding is slightly faster than dynamic binding."], "def": "When you write `obj.show()`, the program must decide which `show()` body to run. Linking the method call to the method body is called binding.", "uses": ["Runtime polymorphism in frameworks, plug-in style designs and collections of mixed objects", "Understanding exam questions on output of overridden methods"], "pros": ["Static binding is faster", "Dynamic binding makes code flexible and extensible"], "cons": ["Expecting static methods to be overridden. They are only hidden", "Expecting fields to behave polymorphically like methods", "Dynamic binding adds a very small run-time cost"]}, "u5-t2": {"tldr": "Create a thread by extending Thread or implementing Runnable, put the work in run(), and launch it with start().", "sections": [{"h": "Two ways to create a thread", "p": ["After creating the object you call `start()`. The JVM then creates a new call stack and calls `run()` on it."], "viz": {"type": "tree", "root": "Creating a thread", "kids": ["extends Thread", "implements Runnable"], "caption": "The two classic ways"}}, {"h": "Way 1: Extend the Thread class", "p": ["Make your own class that extends `Thread` and override `run()`. Create its object and call `start()`.", "Because Java has no multiple inheritance of classes, your class cannot extend anything else after this."], "code": {"f": "Main.java", "c": "class MyThread extends Thread {\n    public void run() {\n        System.out.println(\"Hello from \" + getName());\n    }\n}\n\npublic class Main {\n    public static void main(String[] args) throws InterruptedException {\n        MyThread t = new MyThread();\n        t.start();\n        t.join();\n        System.out.println(\"Main done\");\n    }\n}", "out": "Hello from Thread-0\nMain done"}, "table": {"head": ["Step", "What happens"], "rows": [["1. Extend Thread", "class MyThread extends Thread"], ["2. Override run()", "put the task code inside"], ["3. Create object", "new MyThread()"], ["4. Call start()", "JVM calls run() in a new thread"]]}}, {"h": "Way 2: Implement the Runnable interface", "p": ["`Runnable` has one method: `void run()`. Your class implements it, then you pass an object of your class to the `Thread` constructor and call `start()` on that Thread.", "Here the class is free to extend another class. This is the preferred way in real projects, because the task (Runnable) is separated from the runner (Thread)."], "code": {"f": "Main.java", "c": "class Task implements Runnable {\n    public void run() {\n        System.out.println(\"Task running in \" + Thread.currentThread().getName());\n    }\n}\n\npublic class Main {\n    public static void main(String[] args) throws InterruptedException {\n        Thread t = new Thread(new Task(), \"worker-1\");\n        t.start();\n        t.join();\n        System.out.println(\"Main done\");\n    }\n}", "out": "Task running in worker-1\nMain done"}, "viz": {"type": "chain", "items": ["Task class (Runnable)", "new Thread(task)", "start()", "run() executes"], "caption": "Runnable flow"}}, {"h": "Runnable with a lambda or anonymous class", "p": ["`Runnable` has only one abstract method, so it is a functional interface. You can write the task as a lambda instead of a separate class. This is the shortest form and is used a lot in modern Java.", "An anonymous inner class also works but is longer."], "tip": "For a one-line task, a lambda is cleanest. For a task with its own fields and many methods, use a named class.", "code": {"f": "Main.java", "c": "public class Main {\n    public static void main(String[] args) throws InterruptedException {\n        Thread t1 = new Thread(() -> System.out.println(\"Lambda task\"));\n        Thread t2 = new Thread(new Runnable() {\n            public void run() {\n                System.out.println(\"Anonymous task\");\n            }\n        });\n        t1.start();\n        t1.join();\n        t2.start();\n        t2.join();\n    }\n}", "out": "Lambda task\nAnonymous task"}}, {"h": "start() vs run()", "p": ["`start()` creates a new thread and the JVM calls `run()` inside it. If you call `run()` directly, it is just a normal method call. No new thread is created and the code runs on the caller's thread.", "Look at the thread names in the output to see the difference."], "warn": "Calling `run()` instead of `start()` is the most common beginner bug. Nothing runs in parallel.", "code": {"f": "Main.java", "c": "public class Main {\n    public static void main(String[] args) throws InterruptedException {\n        Thread t = new Thread(() ->\n            System.out.println(\"Running in: \" + Thread.currentThread().getName()));\n        t.run();\n        t.start();\n        t.join();\n    }\n}", "out": "Running in: main\nRunning in: Thread-0"}}, {"h": "Starting a thread twice", "p": ["A thread object can be started only once. After it finishes, it is dead and cannot be restarted. A second `start()` throws `IllegalThreadStateException`. Create a new Thread object if you need to run the task again."], "code": {"f": "Main.java", "c": "public class Main {\n    public static void main(String[] args) throws InterruptedException {\n        Thread t = new Thread(() -> System.out.println(\"Run once\"));\n        t.start();\n        t.join();\n        try {\n            t.start();\n        } catch (IllegalThreadStateException e) {\n            System.out.println(\"Caught: \" + e.getClass().getSimpleName());\n        }\n    }\n}", "out": "Run once\nCaught: IllegalThreadStateException"}}, {"h": "Many threads: order is not guaranteed", "p": ["When you start several threads, the OS scheduler decides which one runs when. The output order can change from run to run. Never write code that depends on it.", "Use `join()` or synchronization when you need a fixed order. The program below may print the lines in any order, so no fixed output is shown."], "code": {"f": "Main.java", "c": "public class Main {\n    public static void main(String[] args) {\n        for (int i = 1; i <= 3; i++) {\n            int id = i;\n            new Thread(() -> System.out.println(\"Thread \" + id)).start();\n        }\n        System.out.println(\"main ends\");\n    }\n}"}}, {"h": "Thread vs Runnable: which to use?", "p": ["Both give the same result. Prefer Runnable in most cases."], "table": {"head": ["Point", "extends Thread", "implements Runnable"], "rows": [["Type", "Class", "Interface"], ["Other inheritance", "Not possible (class already extends Thread)", "Free to extend another class"], ["Task and thread", "Tied together", "Separated"], ["Sharing one task", "Each object is a new task", "Same task object can go to many threads"], ["Thread pools", "Not suitable", "Works with executors"], ["Style", "Simple for demos", "Preferred in real code"]]}}], "analogy": "Thread is the worker, Runnable is the job card. You can hire a worker who has the job built in (extends Thread), or hand any worker a job card (Runnable). Calling `start()` is telling the worker to begin.", "hinglish": "Bhai thread banane ke do tareeke hain: Thread class ko extend karo ya Runnable interface implement karo. Dono mein kaam `run()` ke andar likhte hain. Thread chalane ke liye hamesha `start()` bulao, `run()` direct bulaya to naya thread banta hi nahi. Real projects mein Runnable better hai kyunki class ko kisi aur class se extend karne ki freedom milti hai.", "mistakes": ["Calling `t.run()` and thinking a new thread started.", "Calling `start()` twice on the same Thread object.", "Expecting threads to print in the order they were started.", "Extending Thread when the class already needs another parent class: use Runnable."], "remember": ["Thread = object of `java.lang.Thread`; the work is in `run()`.", "Way 1: `class A extends Thread` and override `run()`.", "Way 2: `class B implements Runnable` and pass it to `new Thread(b)`.", "`Runnable` is a functional interface (`void run()`), so a lambda can be used.", "`start()` creates a new call stack and calls `run()` there.", "Calling `run()` directly runs on the current thread; no multithreading.", "Calling `start()` twice throws `IllegalThreadStateException`.", "Thread order of execution is decided by the scheduler; not guaranteed.", "`Thread(Runnable, String name)` sets the thread name.", "Default names are Thread-0, Thread-1, ...; main thread is `main`.", "Runnable preferred: allows extending another class, separates task from thread.", "`join()` makes the caller wait until the thread finishes."], "def": "In Java a thread is an object of the `Thread` class. There are two standard ways to give it work: extend the `Thread` class, or implement the `Runnable` interface. In both ways the work goes inside a method named `run()`.", "uses": ["Running independent tasks in the background", "Handling many clients or jobs at the same time"], "pros": ["Runnable keeps the class free to extend another class", "Simple, direct API"], "cons": ["Calling run() instead of start()", "Starting the same thread twice", "Extending Thread when you also need another parent class"]}, "u5-t3": {"tldr": "A thread moves through NEW, RUNNABLE, BLOCKED, WAITING, TIMED_WAITING and TERMINATED; getState() shows where it is.", "sections": [{"h": "What is the thread life cycle?", "p": ["Java defines six states in the enum `Thread.State`: NEW, RUNNABLE, BLOCKED, WAITING, TIMED_WAITING and TERMINATED. You can read the current one with `getState()`."], "viz": {"type": "chain", "items": ["NEW", "RUNNABLE", "TERMINATED"], "caption": "Main path of every thread"}}, {"h": "Full flow of states", "p": ["From RUNNABLE a thread can step aside into BLOCKED, WAITING or TIMED_WAITING and later come back to RUNNABLE. Only when `run()` ends (or an uncaught exception happens) does it go to TERMINATED.", "Each state has its own section below."], "table": {"head": ["Step", "What happens"], "rows": [["1. NEW", "object created, start() not called"], ["2. RUNNABLE", "ready or running on CPU"], ["3. BLOCKED", "waiting for a monitor lock"], ["4. WAITING", "wait(), join(), park() with no timeout"], ["5. TIMED_WAITING", "sleep(ms), wait(ms), join(ms)"], ["6. TERMINATED", "run() finished"]]}}, {"h": "NEW and TERMINATED", "p": ["NEW: the Thread object exists but `start()` has not been called. No new stack is created yet.", "TERMINATED: `run()` has completed normally or ended by an exception. The thread is dead. It cannot be restarted."], "code": {"f": "Main.java", "c": "public class Main {\n    public static void main(String[] args) throws InterruptedException {\n        Thread t = new Thread(() -> System.out.println(\"working\"));\n        System.out.println(\"Before start: \" + t.getState());\n        t.start();\n        t.join();\n        System.out.println(\"After finish: \" + t.getState());\n    }\n}", "out": "Before start: NEW\nworking\nAfter finish: TERMINATED"}}, {"h": "RUNNABLE", "p": ["After `start()` the thread is RUNNABLE. This means it is ready to run or is running right now. Java does not split this into separate 'ready' and 'running' states. The scheduler picks one runnable thread per core and gives it CPU time.", "A thread waiting for blocking I/O is also reported as RUNNABLE."], "code": {"f": "Main.java", "c": "public class Main {\n    static volatile boolean stop = false;\n    public static void main(String[] args) throws InterruptedException {\n        Thread t = new Thread(() -> { while (!stop) { } });\n        t.start();\n        Thread.sleep(100);\n        System.out.println(\"State: \" + t.getState());\n        stop = true;\n        t.join();\n    }\n}", "out": "State: RUNNABLE"}, "viz": {"type": "chain", "items": ["Ready (in queue)", "Running (on CPU)"], "caption": "Both are shown as RUNNABLE in Java"}}, {"h": "BLOCKED", "p": ["A thread is BLOCKED when it wants to enter a `synchronized` block or method but another thread already holds that lock. It cannot move until the lock is released. Then it goes back to RUNNABLE.", "In this demo main holds the lock, so the second thread gets stuck at `synchronized`."], "tip": "BLOCKED is about waiting for a lock. WAITING is about waiting for another thread's signal. Do not mix them up.", "code": {"f": "Main.java", "c": "public class Main {\n    public static void main(String[] args) {\n        Object lock = new Object();\n        Thread t = new Thread(() -> {\n            synchronized (lock) {\n                System.out.println(\"t got the lock\");\n            }\n        });\n        synchronized (lock) {\n            t.start();\n            while (t.getState() != Thread.State.BLOCKED) {\n                Thread.onSpinWait();\n            }\n            System.out.println(\"State: \" + t.getState());\n        }\n    }\n}", "out": "State: BLOCKED\nt got the lock"}}, {"h": "WAITING", "p": ["A thread is WAITING when it waits indefinitely for another thread to do something. It enters this state by calling `Object.wait()`, `Thread.join()` (no timeout) or `LockSupport.park()`. Another thread must call `notify()`, finish, or `unpark()` to wake it.", "Below, `t` calls `wait()` and main wakes it with `notify()`."], "code": {"f": "Main.java", "c": "public class Main {\n    public static void main(String[] args) throws InterruptedException {\n        Object lock = new Object();\n        Thread t = new Thread(() -> {\n            synchronized (lock) {\n                try { lock.wait(); } catch (InterruptedException e) { }\n            }\n        });\n        t.start();\n        while (t.getState() != Thread.State.WAITING) {\n            Thread.onSpinWait();\n        }\n        System.out.println(\"State: \" + t.getState());\n        synchronized (lock) { lock.notify(); }\n        t.join();\n        System.out.println(\"Final: \" + t.getState());\n    }\n}", "out": "State: WAITING\nFinal: TERMINATED"}}, {"h": "TIMED_WAITING", "p": ["Same as WAITING, but with a time limit. The thread returns to RUNNABLE when the time ends or when it is woken earlier. Methods that cause it: `Thread.sleep(ms)`, `wait(ms)`, `join(ms)`, `parkNanos()`.", "A sleeping thread keeps its locks. That is a key point for exams."], "warn": "`sleep()` does not release the lock. `wait()` does.", "code": {"f": "Main.java", "c": "public class Main {\n    public static void main(String[] args) throws InterruptedException {\n        Thread t = new Thread(() -> {\n            try { Thread.sleep(5000); } catch (InterruptedException e) {\n                System.out.println(\"woken early\");\n            }\n        });\n        t.start();\n        while (t.getState() != Thread.State.TIMED_WAITING) {\n            Thread.onSpinWait();\n        }\n        System.out.println(\"State: \" + t.getState());\n        t.interrupt();\n        t.join();\n    }\n}", "out": "State: TIMED_WAITING\nwoken early"}}, {"h": "State transitions at a glance", "p": ["Use this table to revise which call moves a thread where."], "table": {"head": ["From", "To", "Cause"], "rows": [["NEW", "RUNNABLE", "start()"], ["RUNNABLE", "BLOCKED", "needs a busy synchronized lock"], ["BLOCKED", "RUNNABLE", "lock becomes free"], ["RUNNABLE", "WAITING", "wait(), join()"], ["WAITING", "RUNNABLE", "notify(), notifyAll(), joined thread ends"], ["RUNNABLE", "TIMED_WAITING", "sleep(ms), wait(ms), join(ms)"], ["TIMED_WAITING", "RUNNABLE", "time over or interrupt()"], ["RUNNABLE", "TERMINATED", "run() ends or uncaught exception"]]}}], "analogy": "Think of a patient in a clinic: registered (NEW), in the queue or with the doctor (RUNNABLE), waiting for a room that is occupied (BLOCKED), waiting for a report to arrive (WAITING), told to come back in 10 minutes (TIMED_WAITING), discharged (TERMINATED).", "hinglish": "Bhai thread ki zindagi mein 6 states hoti hain. Object bana to NEW, start() ke baad RUNNABLE. Agar lock nahi mila to BLOCKED, kisi ke notify ka intezaar kiya to WAITING, aur sleep(ms) jaise time-limit wale intezaar mein TIMED_WAITING. run() khatam hua to TERMINATED, aur dead thread dobara start nahi hota.", "mistakes": ["Believing Java has a RUNNING state: it is part of RUNNABLE.", "Confusing BLOCKED (lock) with WAITING (signal).", "Thinking `sleep()` releases the lock.", "Trying to restart a TERMINATED thread."], "remember": ["Java thread states: NEW, RUNNABLE, BLOCKED, WAITING, TIMED_WAITING, TERMINATED.", "Defined in the enum `Thread.State`; read with `getState()`.", "NEW: object created, `start()` not yet called.", "RUNNABLE: ready or running; Java has no separate RUNNING state.", "BLOCKED: waiting to acquire a monitor lock for `synchronized`.", "WAITING: waits indefinitely: `wait()`, `join()`, `park()`.", "TIMED_WAITING: waits with timeout: `sleep(ms)`, `wait(ms)`, `join(ms)`.", "TERMINATED: `run()` completed or uncaught exception.", "A terminated thread cannot be restarted.", "`sleep()` keeps the lock; `wait()` releases it.", "`notify()` / `notifyAll()` move a thread from WAITING to BLOCKED/RUNNABLE (it must re-acquire the lock first).", "`interrupt()` wakes a thread from sleep/wait with `InterruptedException`."], "def": "A thread is not always running. From creation to death it moves through states. The life cycle is the set of these states and the events that move a thread from one to the other.", "uses": ["Debugging thread problems", "Understanding why a thread is not making progress"], "pros": ["Gives a clear model for thread behaviour"], "cons": ["Trying to restart a terminated thread", "Confusing BLOCKED (waiting for a lock) with WAITING (waiting for a signal)"]}, "u5-t4": {"tldr": "Priority hints the scheduler, sleep/join/yield control timing, interrupt asks a thread to stop, daemon threads die with the JVM.", "sections": [{"h": "Thread priority", "p": ["Use `setPriority(int)` and `getPriority()`. A value outside 1..10 throws `IllegalArgumentException`."], "warn": "Priority is only a hint. The OS may ignore it, so never depend on it for correct results.", "code": {"f": "Main.java", "c": "public class Main {\n    public static void main(String[] args) {\n        Thread t = new Thread(() -> { });\n        System.out.println(\"Default: \" + t.getPriority());\n        t.setPriority(Thread.MAX_PRIORITY);\n        System.out.println(\"Now: \" + t.getPriority());\n        try {\n            t.setPriority(11);\n        } catch (IllegalArgumentException e) {\n            System.out.println(\"11 is invalid\");\n        }\n    }\n}", "out": "Default: 5\nNow: 10\n11 is invalid"}, "table": {"head": ["Constant", "Value", "Meaning"], "rows": [["MIN_PRIORITY", "1", "lowest"], ["NORM_PRIORITY", "5", "default"], ["MAX_PRIORITY", "10", "highest"]]}}, {"h": "Priority is inherited", "p": ["A new thread starts with the same priority as the thread that created it. Main has priority 5, so its children get 5 unless you change them."], "code": {"f": "Main.java", "c": "public class Main {\n    public static void main(String[] args) throws InterruptedException {\n        Thread.currentThread().setPriority(8);\n        Thread child = new Thread(() ->\n            System.out.println(\"Child priority: \" + Thread.currentThread().getPriority()));\n        child.start();\n        child.join();\n    }\n}", "out": "Child priority: 8"}}, {"h": "sleep(): pause for some time", "p": ["`Thread.sleep(ms)` pauses the current thread for at least the given milliseconds. The thread goes to TIMED_WAITING and gives the CPU to others. It does not release any lock it holds.", "It is a static method and throws the checked exception `InterruptedException`."], "code": {"f": "Main.java", "c": "public class Main {\n    public static void main(String[] args) throws InterruptedException {\n        System.out.println(\"Start\");\n        Thread.sleep(500);\n        System.out.println(\"After 0.5 second\");\n    }\n}", "out": "Start\nAfter 0.5 second"}}, {"h": "join(): wait for another thread", "p": ["`t.join()` makes the calling thread wait until thread `t` dies. `t.join(ms)` waits at most that long. Use it when you need the result of a thread before moving on.", "Without `join()`, main may finish first."], "code": {"f": "Main.java", "c": "public class Main {\n    public static void main(String[] args) throws InterruptedException {\n        Thread t = new Thread(() -> {\n            try { Thread.sleep(300); } catch (InterruptedException e) { }\n            System.out.println(\"Worker finished\");\n        });\n        t.start();\n        t.join();\n        System.out.println(\"Main continues\");\n    }\n}", "out": "Worker finished\nMain continues"}, "viz": {"type": "chain", "items": ["main: t.start()", "main: t.join() waits", "t finishes", "main continues"], "caption": "How join() works"}}, {"h": "yield(): offer the CPU", "p": ["`Thread.yield()` tells the scheduler: 'I am happy to let another thread of same or higher priority run now.' The thread stays RUNNABLE. The scheduler may simply ignore the hint.", "So the output of yield-based programs is not guaranteed, and yield is rarely used in real code."], "tip": "Run it a few times. The order of A and B lines can change.", "code": {"f": "Main.java", "c": "public class Main {\n    public static void main(String[] args) {\n        Runnable r = () -> {\n            for (int i = 1; i <= 3; i++) {\n                System.out.println(Thread.currentThread().getName() + \" step \" + i);\n                Thread.yield();\n            }\n        };\n        new Thread(r, \"A\").start();\n        new Thread(r, \"B\").start();\n    }\n}"}}, {"h": "interrupt(): politely ask a thread to stop", "p": ["`t.interrupt()` sets the interrupt flag of thread `t`. If `t` is sleeping or waiting, it wakes up at once and `InterruptedException` is thrown (and the flag is cleared). If `t` is running, only the flag is set; the thread must check it with `isInterrupted()`.", "Interrupt does not kill a thread. It is a request. The thread decides how to stop."], "tip": "Static `Thread.interrupted()` returns the flag and clears it. Instance `isInterrupted()` only reads it.", "code": {"f": "Main.java", "c": "public class Main {\n    public static void main(String[] args) throws InterruptedException {\n        Thread sleeper = new Thread(() -> {\n            try {\n                Thread.sleep(10000);\n            } catch (InterruptedException e) {\n                System.out.println(\"Sleeper interrupted\");\n            }\n        });\n        Thread worker = new Thread(() -> {\n            while (!Thread.currentThread().isInterrupted()) { }\n            System.out.println(\"Worker saw the flag\");\n        });\n        sleeper.start();\n        worker.start();\n        sleeper.interrupt();\n        sleeper.join();\n        worker.interrupt();\n        worker.join();\n    }\n}", "out": "Sleeper interrupted\nWorker saw the flag"}}, {"h": "Daemon threads", "p": ["A daemon thread is a background helper thread, like the garbage collector. The JVM exits when only daemon threads are left. A normal (user) thread keeps the JVM alive until it finishes.", "Call `setDaemon(true)` before `start()`. Calling it after start throws `IllegalThreadStateException`. A thread created by a daemon thread is also daemon."], "warn": "Do not use daemon threads for work like writing files: the JVM can stop them in the middle.", "code": {"f": "Main.java", "c": "public class Main {\n    public static void main(String[] args) {\n        Thread bg = new Thread(() -> {\n            while (true) {\n                try { Thread.sleep(1000); } catch (InterruptedException e) { }\n            }\n        });\n        bg.setDaemon(true);\n        bg.start();\n        System.out.println(\"isDaemon: \" + bg.isDaemon());\n        System.out.println(\"main ends, JVM exits\");\n    }\n}", "out": "isDaemon: true\nmain ends, JVM exits"}}, {"h": "sleep vs yield vs join", "p": ["Three methods, three different purposes."], "table": {"head": ["Point", "sleep()", "yield()", "join()"], "rows": [["Purpose", "pause for time", "offer CPU", "wait for thread end"], ["Static?", "Yes", "Yes", "No (on a thread)"], ["State", "TIMED_WAITING", "RUNNABLE", "WAITING"], ["Guaranteed?", "At least that time", "No, only a hint", "Yes"], ["Throws InterruptedException", "Yes", "No", "Yes"]]}}], "analogy": "Priority is like a VIP pass at a counter: helpful but not a guarantee. `sleep` is taking a nap, `join` is waiting for your friend to finish before leaving, `yield` is saying 'you go first', and a daemon is a cleaner who leaves when the last guest leaves.", "hinglish": "Bhai priority 1 se 10 tak hoti hai, default 5, lekin ye sirf hint hai. sleep() thread ko kuch time ke liye rok deta hai, join() dusre thread ke khatam hone tak wait karata hai, yield() CPU chhodne ki request hai. interrupt() thread ko rukne ka signal deta hai. Daemon thread background mein chalta hai aur jab saare normal threads khatam ho jaate hain to JVM band ho jata hai.", "mistakes": ["Relying on priority to get a fixed execution order.", "Calling `setDaemon(true)` after `start()`.", "Thinking `interrupt()` kills the thread immediately.", "Forgetting to handle or declare `InterruptedException` for `sleep()` and `join()`.", "Assuming `yield()` guarantees another thread runs."], "remember": ["Priority range 1..10; `MIN`=1, `NORM`=5, `MAX`=10.", "`setPriority()` / `getPriority()`; invalid value gives `IllegalArgumentException`.", "Child thread inherits parent's priority; priority is only a hint to the scheduler.", "`Thread.sleep(ms)`: static, pauses current thread, TIMED_WAITING, keeps locks, throws `InterruptedException`.", "`t.join()`: caller waits until `t` dies; `join(ms)` has a timeout.", "`Thread.yield()`: hint to give CPU to another thread; thread stays RUNNABLE.", "`interrupt()` sets flag; sleeping/waiting thread gets `InterruptedException`.", "`isInterrupted()` reads the flag; static `Thread.interrupted()` reads and clears it.", "Interrupt is cooperative: it does not force a thread to stop.", "Daemon thread: low-priority background service thread (e.g., GC).", "JVM exits when all user threads end, even if daemon threads still run.", "`setDaemon(true)` before `start()`, else `IllegalThreadStateException`."], "def": "Every thread has a priority from 1 to 10. A higher number is a hint to the scheduler that the thread is more important. Defaults: `MIN_PRIORITY` = 1, `NORM_PRIORITY` = 5, `MAX_PRIORITY` = 10.", "uses": ["Cancelling long-running or background tasks", "Stopping a worker thread when the application shuts down"], "pros": ["Gives some control over scheduling", "Safe, cooperative way to stop threads"], "cons": ["Expecting a high priority to guarantee the thread runs first", "Swallowing InterruptedException without restoring the flag or exiting", "Using the old stop() method, which is unsafe and deprecated"]}, "u5-t5": {"tldr": "Synchronization lets only one thread at a time use shared data, using the synchronized keyword on methods or blocks.", "sections": [{"h": "What is synchronization?", "p": ["In Java we do this with the `synchronized` keyword. It uses a lock (called monitor) that is built into every object."], "pts": ["Critical section = code that touches shared data", "Mutual exclusion = one thread at a time", "Also gives visibility: changes made inside are seen by the next thread taking the lock"], "viz": {"type": "chain", "items": ["Thread enters", "Takes the lock", "Runs critical section", "Releases the lock"], "caption": "Only one thread inside at a time"}}, {"h": "Race condition: the problem", "p": ["A race condition happens when the result depends on the timing of threads. The classic case is `count++`. It looks like one step but is really three: read the value, add 1, write it back. Two threads can read the same old value, and one update is lost.", "The program below starts two threads that each add 1 one hundred thousand times. We use `join()` so main prints only after both finish. The total should be 200000, but it is usually smaller. The exact number changes every run, so no fixed output is given."], "warn": "Wrong output here does not crash. Race bugs are silent, which makes them dangerous.", "code": {"f": "Main.java", "c": "class Counter {\n    int count = 0;\n    void increment() { count++; }\n}\n\npublic class Main {\n    public static void main(String[] args) throws InterruptedException {\n        Counter c = new Counter();\n        Runnable r = () -> { for (int i = 0; i < 100000; i++) c.increment(); };\n        Thread t1 = new Thread(r);\n        Thread t2 = new Thread(r);\n        t1.start(); t2.start();\n        t1.join(); t2.join();\n        System.out.println(\"Expected 200000, got \" + c.count);\n    }\n}"}, "table": {"head": ["Step", "What happens"], "rows": [["1. T1 reads count = 5", ""], ["2. T2 reads count = 5", "before T1 writes"], ["3. T1 writes 6", ""], ["4. T2 writes 6", "one increment is lost"]]}}, {"h": "Fix 1: synchronized method", "p": ["Add `synchronized` to the method. A thread must take the lock of the object (`this`) before running it. Other threads calling any synchronized method on the same object wait.", "Now the total is always 200000, so we can show a fixed output."], "tip": "Lock is per object. Two different Counter objects have two different locks.", "code": {"f": "Main.java", "c": "class Counter {\n    int count = 0;\n    synchronized void increment() { count++; }\n}\n\npublic class Main {\n    public static void main(String[] args) throws InterruptedException {\n        Counter c = new Counter();\n        Runnable r = () -> { for (int i = 0; i < 100000; i++) c.increment(); };\n        Thread t1 = new Thread(r);\n        Thread t2 = new Thread(r);\n        t1.start(); t2.start();\n        t1.join(); t2.join();\n        System.out.println(\"Expected 200000, got \" + c.count);\n    }\n}", "out": "Expected 200000, got 200000"}}, {"h": "Fix 2: synchronized block", "p": ["A synchronized block locks only the lines that need protection. Syntax: `synchronized (lockObject) { ... }`. Other lines of the method run freely, so the program stays faster.", "You can lock `this` or any private object. A private lock object stops outside code from locking it by mistake."], "code": {"f": "Main.java", "c": "class Counter {\n    private int count = 0;\n    private final Object lock = new Object();\n\n    void increment() {\n        // non-critical work can go here\n        synchronized (lock) {\n            count++;\n        }\n    }\n    int get() { return count; }\n}\n\npublic class Main {\n    public static void main(String[] args) throws InterruptedException {\n        Counter c = new Counter();\n        Runnable r = () -> { for (int i = 0; i < 100000; i++) c.increment(); };\n        Thread t1 = new Thread(r), t2 = new Thread(r);\n        t1.start(); t2.start();\n        t1.join(); t2.join();\n        System.out.println(\"Total: \" + c.get());\n    }\n}", "out": "Total: 200000"}}, {"h": "Fix 3: static synchronized", "p": ["A `static` method belongs to the class, not to an object. A `static synchronized` method takes the lock of the `Class` object (`Counter.class`). Use it to protect static fields, even when threads use different objects.", "A normal synchronized method locks `this`; it does not protect static data from threads using other objects."], "code": {"f": "Main.java", "c": "class Counter {\n    static int count = 0;\n    static synchronized void increment() { count++; }\n}\n\npublic class Main {\n    public static void main(String[] args) throws InterruptedException {\n        Thread t1 = new Thread(() -> { for (int i = 0; i < 100000; i++) Counter.increment(); });\n        Thread t2 = new Thread(() -> { for (int i = 0; i < 100000; i++) Counter.increment(); });\n        t1.start(); t2.start();\n        t1.join(); t2.join();\n        System.out.println(\"Total: \" + Counter.count);\n    }\n}", "out": "Total: 200000"}}, {"h": "Object lock vs class lock", "p": ["Which lock is taken decides which threads block each other. Threads waiting on different locks run in parallel.", "A thread that already holds a lock can enter another synchronized block of the same lock again. This is called reentrancy."], "table": {"head": ["Code", "Lock taken", "Protects"], "rows": [["synchronized instance method", "this object", "that object's data"], ["synchronized (obj) { }", "obj", "whatever you guard with obj"], ["static synchronized method", "ClassName.class", "static data"], ["synchronized (X.class) { }", "X.class", "same as static synchronized"]]}}, {"h": "Deadlock: the danger", "p": ["If thread A holds lock 1 and waits for lock 2, while thread B holds lock 2 and waits for lock 1, both wait forever. This is a deadlock.", "Avoid it by always taking locks in the same order, keeping synchronized blocks short, and not calling unknown code while holding a lock."], "viz": {"type": "chain", "items": ["A holds Lock1", "A wants Lock2", "B holds Lock2", "B wants Lock1"], "caption": "Circular wait = deadlock"}}, {"h": "Advantages and limits", "p": ["Synchronization makes shared data safe, but it has a price."], "table": {"head": ["Good", "Cost"], "rows": [["Prevents race conditions", "Slower: threads wait for the lock"], ["Ensures visibility of changes", "Risk of deadlock"], ["Simple keyword, built in", "Too much locking removes parallelism"]]}}], "analogy": "A shared bank counter: if two clerks update your balance at the same time, one entry gets lost. A token (lock) allows only the clerk holding it to update, and the other waits for the token.", "hinglish": "Bhai jab do threads ek hi data ko ek saath badalte hain to race condition hoti hai aur update kho jaata hai, jaise count++ mein. synchronized keyword lock deta hai, to ek time pe sirf ek thread andar ja sakta hai. Method pe lagao to object ka lock, block mein jo object doge uska lock, aur static synchronized mein class ka lock lagta hai. Lock galat order mein lo to deadlock ho sakta hai.", "mistakes": ["Forgetting `join()` and printing the total before threads finish.", "Synchronizing on different objects and expecting mutual exclusion.", "Using a plain `synchronized` method to protect static data.", "Making the whole method synchronized when only two lines need it.", "Locking on a String literal or a changing object reference."], "remember": ["Synchronization controls access of multiple threads to a shared resource.", "Race condition: output depends on thread timing; e.g., unsynchronized `count++` loses updates.", "`count++` = read, add, write (not atomic).", "Critical section: code accessing shared data.", "`synchronized` gives mutual exclusion and memory visibility.", "Synchronized method: lock on `this`.", "Synchronized block: `synchronized (obj) { }`; lock on `obj`; smaller scope is faster.", "`static synchronized`: lock on `ClassName.class`.", "Locks are reentrant: same thread can re-enter.", "Use `join()` so main prints the total only after threads finish.", "Deadlock: threads wait on each other's locks forever; take locks in a fixed order.", "Costs: slower execution, possible deadlock."], "def": "Threads of one program share the same heap. When two threads change the same data at the same time, the result can be wrong. Synchronization means allowing only one thread at a time to use a shared resource.", "uses": ["Bank accounts, counters, inventory and any shared data", "Producer-consumer and cache designs"], "pros": ["Prevents data corruption and inconsistent results", "Simple to use with the synchronized keyword"], "cons": ["Slower performance because threads wait for each other", "Risk of deadlock", "Synchronizing too much code reduces parallelism", "Forgetting to synchronize all access to the shared data"]}, "u5-t6": {"tldr": "wait(), notify() and notifyAll() let threads pause and signal each other so they can cooperate, like in producer-consumer.", "sections": [{"h": "What is inter-thread communication?", "p": ["Synchronization alone is not enough. It stops two threads from entering a critical section together, but it cannot make a thread wait for a condition such as 'the buffer has data'. Without communication, the waiting thread would need busy waiting: looping again and again and wasting CPU."], "pts": ["Avoids busy waiting (polling in a loop)", "Built on `wait()`, `notify()` and `notifyAll()`", "These methods are in the `Object` class, so every object can be a waiting room", "Works together with `synchronized`"], "viz": {"type": "chain", "items": ["Thread A: wait()", "Thread B: change state", "Thread B: notify()", "Thread A: resumes"], "caption": "A waits, B signals, A continues"}}, {"h": "The three methods", "p": ["All three methods are declared in `java.lang.Object`, are `final`, and can be called only by a thread that owns the object's monitor (lock)."], "tip": "`wait()` throws the checked `InterruptedException`, so handle it with try-catch or `throws`.", "table": {"head": ["Method", "What it does", "Releases lock?"], "rows": [["wait()", "Current thread waits until notified or interrupted", "Yes, immediately"], ["wait(long ms)", "Waits at most the given time", "Yes"], ["notify()", "Wakes ONE thread waiting on this object", "No, only on exit of synchronized"], ["notifyAll()", "Wakes ALL threads waiting on this object", "No, only on exit of synchronized"]]}}, {"h": "wait() and notify() in action", "p": ["A thread calls `wait()` inside a synchronized method. It gives up the lock and moves to the WAITING state. Another thread changes the condition and calls `notify()`. The waiting thread wakes up, but it must first get the lock back before it can continue.", "Here the waiter checks a `ready` flag. The `sleep` in main only makes sure the waiter starts first; the program is correct even without it, because of the flag."], "code": {"f": "Main.java", "c": "class Box {\n    private boolean ready = false;\n\n    synchronized void waitForReady() throws InterruptedException {\n        while (!ready) {\n            System.out.println(\"Waiter: not ready, waiting...\");\n            wait();\n        }\n        System.out.println(\"Waiter: got the signal, continuing\");\n    }\n\n    synchronized void makeReady() {\n        ready = true;\n        System.out.println(\"Signaller: ready = true, notifying\");\n        notify();\n    }\n}\n\npublic class Main {\n    public static void main(String[] args) throws InterruptedException {\n        Box box = new Box();\n        Thread waiter = new Thread(() -> {\n            try { box.waitForReady(); } catch (InterruptedException e) { }\n        });\n        waiter.start();\n        Thread.sleep(300);\n        box.makeReady();\n        waiter.join();\n    }\n}", "out": "Waiter: not ready, waiting...\nSignaller: ready = true, notifying\nWaiter: got the signal, continuing"}}, {"h": "The lock rule: IllegalMonitorStateException", "p": ["You must hold the monitor of an object to call `wait()`, `notify()` or `notifyAll()` on it. That means calling them inside a `synchronized` method or a `synchronized` block on the same object.", "If you call them without the lock, Java throws `IllegalMonitorStateException` (a runtime exception)."], "warn": "Locking one object but calling `wait()` on another also throws this exception. The lock and the wait must be on the same object.", "code": {"f": "Main.java", "c": "public class Main {\n    public static void main(String[] args) throws InterruptedException {\n        Object lock = new Object();\n        try {\n            lock.wait();\n        } catch (IllegalMonitorStateException e) {\n            System.out.println(\"Caught: \" + e.getClass().getSimpleName());\n        }\n        try {\n            lock.notify();\n        } catch (IllegalMonitorStateException e) {\n            System.out.println(\"Caught: \" + e.getClass().getSimpleName());\n        }\n        synchronized (lock) {\n            lock.notify();\n            System.out.println(\"Inside synchronized: notify() is fine\");\n        }\n    }\n}", "out": "Caught: IllegalMonitorStateException\nCaught: IllegalMonitorStateException\nInside synchronized: notify() is fine"}}, {"h": "wait() vs sleep()", "p": ["Students often mix these two. Both pause a thread, but their purpose is very different."], "table": {"head": ["Point", "wait()", "sleep()"], "rows": [["Defined in", "Object class", "Thread class"], ["Lock", "Releases the lock", "Keeps the lock"], ["Called from", "synchronized code only", "Anywhere"], ["Wakes up by", "notify / notifyAll / timeout / interrupt", "Time over or interrupt"], ["Type", "Instance method", "Static method"], ["Used for", "Thread communication", "Just a pause"]]}}, {"h": "notify() vs notifyAll()", "p": ["`notify()` wakes only one waiting thread, and the JVM decides which one. `notifyAll()` wakes every waiting thread; they then compete for the lock one by one, and each rechecks its condition.", "In the example three threads wait for `go`. `notifyAll()` wakes all of them. With `notify()` only one would wake and the other two would wait forever, so the program would hang.", "The order in which the threads wake is not fixed, so we print only the final count."], "tip": "When unsure, use `notifyAll()`. It is safer. Use `notify()` only when all waiters are identical and one wake-up is enough.", "code": {"f": "Main.java", "c": "public class Main {\n    static final Object lock = new Object();\n    static boolean go = false;\n    static int woke = 0;\n\n    public static void main(String[] args) throws InterruptedException {\n        Thread[] ts = new Thread[3];\n        for (int i = 0; i < 3; i++) {\n            ts[i] = new Thread(() -> {\n                synchronized (lock) {\n                    while (!go) {\n                        try { lock.wait(); } catch (InterruptedException e) { }\n                    }\n                    woke++;\n                }\n            });\n            ts[i].start();\n        }\n        Thread.sleep(300);\n        synchronized (lock) {\n            go = true;\n            lock.notifyAll();\n        }\n        for (Thread t : ts) t.join();\n        System.out.println(\"Threads woken: \" + woke);\n    }\n}", "out": "Threads woken: 3"}}, {"h": "The producer-consumer problem", "p": ["A producer creates data and a consumer uses it, both sharing a buffer. Rules: the producer must wait when the buffer is full, the consumer must wait when it is empty, and both must not touch the buffer at the same time.", "Below the buffer holds just one item. The `full` flag tells whose turn it is. Every `put` is followed by a `take`, so the output alternates in a fixed way."], "code": {"f": "Main.java", "c": "class Slot {\n    private int value;\n    private boolean full = false;\n\n    synchronized void put(int v) throws InterruptedException {\n        while (full) wait();\n        value = v;\n        full = true;\n        System.out.println(\"Produced \" + v);\n        notifyAll();\n    }\n\n    synchronized int take() throws InterruptedException {\n        while (!full) wait();\n        full = false;\n        System.out.println(\"Consumed \" + value);\n        notifyAll();\n        return value;\n    }\n}\n\npublic class Main {\n    public static void main(String[] args) throws InterruptedException {\n        Slot slot = new Slot();\n        Thread producer = new Thread(() -> {\n            try { for (int i = 1; i <= 4; i++) slot.put(i); }\n            catch (InterruptedException e) { }\n        });\n        Thread consumer = new Thread(() -> {\n            try { for (int i = 1; i <= 4; i++) slot.take(); }\n            catch (InterruptedException e) { }\n        });\n        producer.start(); consumer.start();\n        producer.join(); consumer.join();\n    }\n}", "out": "Produced 1\nConsumed 1\nProduced 2\nConsumed 2\nProduced 3\nConsumed 3\nProduced 4\nConsumed 4"}, "viz": {"type": "chain", "items": ["Producer", "Shared buffer", "Consumer"], "caption": "Producer and consumer share a buffer"}}, {"h": "Bounded buffer and the while-loop rule", "p": ["A real buffer holds many items. This one holds at most 3. The producer waits while the queue is full; the consumer waits while it is empty. Both call `notifyAll()` after changing the queue.", "Notice that `wait()` is always inside a `while`, not an `if`. A thread may wake up when the condition is still false (a spurious wake-up, or another thread took the item first). The loop rechecks the condition every time."], "warn": "Using `if` instead of `while` before `wait()` is the most common bug in producer-consumer code.", "code": {"f": "Main.java", "c": "import java.util.LinkedList;\nimport java.util.Queue;\n\nclass Buffer {\n    private final Queue<Integer> q = new LinkedList<>();\n    private final int capacity = 3;\n\n    synchronized void put(int v) throws InterruptedException {\n        while (q.size() == capacity) wait();\n        q.add(v);\n        notifyAll();\n    }\n\n    synchronized int take() throws InterruptedException {\n        while (q.isEmpty()) wait();\n        int v = q.remove();\n        notifyAll();\n        return v;\n    }\n}\n\npublic class Main {\n    static int sum = 0;\n\n    public static void main(String[] args) throws InterruptedException {\n        Buffer b = new Buffer();\n        Thread p = new Thread(() -> {\n            try { for (int i = 1; i <= 10; i++) b.put(i); }\n            catch (InterruptedException e) { }\n        });\n        Thread c = new Thread(() -> {\n            try { for (int i = 1; i <= 10; i++) sum += b.take(); }\n            catch (InterruptedException e) { }\n        });\n        p.start(); c.start();\n        p.join(); c.join();\n        System.out.println(\"Sum of consumed items = \" + sum);\n    }\n}", "out": "Sum of consumed items = 55"}}], "analogy": "Think of a tea stall counter. The cook waits while the counter is full. The customer waits while it is empty. Whenever one of them changes the counter, they ring a bell so the other wakes up and checks again.", "hinglish": "Bhai synchronization sirf threads ko ek saath lock pe takrane se rokta hai, lekin threads ko aapas mein baat bhi karni padti hai. Uske liye wait(), notify() aur notifyAll() hain. wait() lock chhod ke so jaata hai, notify() kisi sone wale ko jagata hai. Teeno sirf synchronized block ke andar chalte hain, aur wait() hamesha while loop mein likho. Producer-consumer iska sabse famous example hai.", "mistakes": ["Calling `wait()` / `notify()` outside a synchronized block: it throws `IllegalMonitorStateException`.", "Using `if` instead of `while` around `wait()`: the condition may be false after waking.", "Thinking `wait()` and `sleep()` are the same: only `wait()` releases the lock.", "Using `notify()` when many different threads wait: a wrong thread may wake and the right one sleeps forever.", "Calling `notify()` before the other thread has called `wait()` with no flag: the signal is lost and the waiter hangs. Keep a condition variable."], "remember": ["Inter-thread communication: cooperation of threads using wait(), notify() and notifyAll().", "These three methods belong to `Object`, not to `Thread`.", "They can be called only inside synchronized code, on the same object whose lock is held; else `IllegalMonitorStateException`.", "`wait()`: releases the lock, thread goes to WAITING until notified or interrupted.", "`wait(ms)`: waits for a limited time (TIMED_WAITING).", "`notify()`: wakes one waiting thread (chosen by JVM). `notifyAll()`: wakes all waiting threads.", "A woken thread must re-acquire the lock before it continues; the notifier's lock is released only when its synchronized block ends.", "`wait()` releases the lock; `sleep()` does not.", "Always call `wait()` in a `while (!condition)` loop to handle spurious wake-ups.", "`wait()` throws the checked `InterruptedException`.", "Producer-consumer: producer waits when buffer is full, consumer waits when it is empty.", "Prefer `notifyAll()` unless all waiters are identical.", "Inter-thread communication avoids busy waiting and saves CPU."], "def": "Inter-thread communication means threads of the same program coordinate their work by passing signals. One thread says 'I am done, you can go ahead' and another thread waits for that message.", "uses": ["Producer-consumer queues", "Coordinating the order of work between threads"], "pros": ["Efficient: waiting threads do not use CPU", "Allows precise cooperation between threads"], "cons": ["Calling wait or notify outside synchronized code", "Using if instead of while around wait()", "Missed notifications causing a thread to wait forever"]}, "u1-t5": {"tldr": "Symbols that act on values: arithmetic, relational, logical, assignment, unary, bitwise, shift and ternary.", "sections": [{"h": "Operator basics and arithmetic operators", "p": ["Arithmetic operators do maths. They are `+` (add), `-` (subtract), `*` (multiply), `/` (divide) and `%` (remainder, also called modulus).", "When both operands are `int`, `/` gives an `int` and throws away the decimal part. If one operand is `double`, the result is `double`. The `+` operator also joins Strings."], "warn": "`\"Sum = \" + a + b` prints `Sum = 103`, not 13. Evaluation goes left to right, so a is joined as text first. Write `(a + b)` to add first. Also, `5 / 0` throws ArithmeticException but `5.0 / 0` gives Infinity.", "code": {"f": "Arith.java", "c": "public class Arith {\n    public static void main(String[] args) {\n        int a = 10, b = 3;\n        System.out.println(a + b);       // 13\n        System.out.println(a - b);       // 7\n        System.out.println(a * b);       // 30\n        System.out.println(a / b);       // 3  (int division)\n        System.out.println(a % b);       // 1\n        System.out.println(10 / 3.0);    // double division\n        System.out.println(-7 % 3);      // sign follows left operand\n        System.out.println(\"Sum = \" + a + b);\n    }\n}", "out": "13\n7\n30\n3\n1\n3.3333333333333335\n-1\nSum = 103"}, "table": {"head": ["Family", "Operators", "Result"], "rows": [["Arithmetic", "+ - * / %", "number"], ["Relational", "== != > < >= <=", "boolean"], ["Logical", "&& || !", "boolean"], ["Assignment", "= += -= *= /= %=", "stores value"], ["Unary", "+ - ++ -- !", "number/boolean"], ["Bitwise", "& | ^ ~", "int/long"], ["Shift", "<< >> >>>", "int/long"], ["Ternary", "? :", "one of two values"]]}}, {"h": "Relational operators", "p": ["Relational (comparison) operators compare two values and always give a `boolean`: `true` or `false`. They are `==`, `!=`, `>`, `<`, `>=`, `<=`.", "They are used inside `if`, `while` and other conditions. For primitives `==` compares values. For objects `==` compares references (addresses), not content."], "warn": "`=` assigns, `==` compares. Writing `if (a = 5)` is a compile error in Java for ints (it is not a boolean). Also, relational operators like `>` do not work on `boolean` or objects.", "code": {"f": "Rel.java", "c": "public class Rel {\n    public static void main(String[] args) {\n        int a = 5, b = 8;\n        System.out.println(a == b);  // false\n        System.out.println(a != b);  // true\n        System.out.println(a > b);   // false\n        System.out.println(a < b);   // true\n        System.out.println(a >= 5);  // true\n        System.out.println(b <= 7);  // false\n    }\n}", "out": "false\ntrue\nfalse\ntrue\ntrue\nfalse"}}, {"h": "Logical operators", "p": ["Logical operators combine boolean expressions. `&&` is AND (true only if both are true), `||` is OR (true if at least one is true), and `!` is NOT (flips the value).", "`&&` and `||` are short-circuit operators. If the left side already decides the answer, the right side is not evaluated at all. This is useful to avoid errors, like dividing by zero."], "tip": "Non short-circuit `&` and `|` on booleans always evaluate both sides. `&&` and `||` can skip the right side.", "code": {"f": "Logic.java", "c": "public class Logic {\n    static boolean check(String s) {\n        System.out.println(\"check \" + s);\n        return true;\n    }\n    public static void main(String[] args) {\n        int x = 0;\n        System.out.println(x != 0 && 10 / x > 1);  // safe: right side skipped\n        System.out.println(false && check(\"A\"));   // check not called\n        System.out.println(true || check(\"B\"));    // check not called\n        System.out.println(false & check(\"C\"));    // & always evaluates both\n        System.out.println(!(x == 0));\n    }\n}", "out": "false\nfalse\ntrue\ncheck C\nfalse\nfalse"}, "table": {"head": ["A", "B", "A && B", "A || B"], "rows": [["true", "true", "true", "true"], ["true", "false", "false", "true"], ["false", "true", "false", "true"], ["false", "false", "false", "false"]]}}, {"h": "Assignment and compound assignment", "p": ["The assignment operator `=` stores the right side value into the variable on the left. Compound assignment operators combine an operation with assignment: `+=`, `-=`, `*=`, `/=`, `%=` (and `&=`, `|=`, `^=`, `<<=`, `>>=`).", "`a += 5` means `a = a + 5`, but with one extra feature: Java adds a hidden cast back to the type of `a`. So it can silently narrow the result."], "tip": "`b = b + 5` fails for a `byte` because `b + 5` is an `int`. But `b += 5` works because of the implicit cast.", "code": {"f": "Assign.java", "c": "public class Assign {\n    public static void main(String[] args) {\n        int a = 10;\n        a += 5;  System.out.println(a);   // 15\n        a -= 3;  System.out.println(a);   // 12\n        a *= 2;  System.out.println(a);   // 24\n        a /= 5;  System.out.println(a);   // 4\n        a %= 3;  System.out.println(a);
